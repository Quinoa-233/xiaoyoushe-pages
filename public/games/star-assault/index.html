<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>星际突击 · 太空射击</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Cpath%20d='M16%203%20L27%2027%20L16%2021.5%20L5%2027%20Z'%20fill='%2338e8ff'/%3E%3Cpath%20d='M16%2011%20L21.5%2022.5%20L16%2019.5%20L10.5%2022.5%20Z'%20fill='%23eaf7ff'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#04070f;
  --panel:rgba(10,18,34,.78);
  --ink:#dfe9f5;
  --dim:#7e92ab;
  --cyan:#38e8ff;
  --magenta:#ff3b6b;
  --amber:#ffc93c;
  --green:#3dffa0;
  --line:rgba(120,160,210,.16);
  --font:"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --mono:"Consolas","Cascadia Mono",ui-monospace,monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  background:var(--bg);color:var(--ink);font-family:var(--font);
  overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;
  overscroll-behavior:none;
}
#stage{position:fixed;inset:0;touch-action:none}
#game{position:absolute;inset:0;display:block;cursor:crosshair}
#vignette{position:absolute;inset:0;pointer-events:none;z-index:4;
  background:radial-gradient(120% 90% at 50% 42%,transparent 55%,rgba(0,0,0,.55) 100%)}

/* ===== HUD ===== */
#hud{position:absolute;inset:0;pointer-events:none;z-index:6;padding:14px;
  display:flex;flex-direction:column;justify-content:space-between;font-family:var(--mono)}
#hudTop{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.hudBlock{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 12px;min-width:96px}
.hudBlock.right{text-align:right}
.hudCenter{text-align:center;min-width:120px}
.hudLabel{font-size:11px;letter-spacing:.12em;color:var(--dim);font-family:var(--font)}
.hudBig{font-size:22px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.hudBig.dim{color:var(--dim)}
.hudCombo{font-size:12px;color:var(--amber);margin-top:2px;opacity:0;transition:opacity .2s;font-family:var(--font)}
.hudWave{font-size:11px;color:var(--dim);margin-top:2px;font-family:var(--font)}
#hudBottom{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.bars{display:flex;flex-direction:column;gap:6px;min-width:170px}
.barRow{display:flex;align-items:center;gap:8px}
.barTag{font-size:11px;color:var(--dim);width:32px;font-family:var(--font)}
.bar{flex:1;height:8px;background:rgba(255,255,255,.08);border-radius:99px;overflow:hidden;max-width:220px}
.barFill{height:100%;width:100%;border-radius:99px;transition:width .15s}
.barFill.hp{background:linear-gradient(90deg,#3dffa0,#38e8ff)}
.barFill.sh{background:linear-gradient(90deg,#38e8ff,#7df3ff)}
.barNum{font-size:11px;color:var(--ink);width:30px;text-align:right}
.weapons{display:flex;gap:8px}
.wItem{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 10px;text-align:center}
.wTag{display:block;font-size:10px;color:var(--dim);letter-spacing:.08em;font-family:var(--font)}
.wVal{font-size:15px;color:var(--cyan);font-weight:700}
.wName{display:block;font-size:10px;color:var(--dim);letter-spacing:.08em;margin-top:1px;font-family:var(--font)}
#wSel{cursor:pointer;pointer-events:auto;border:1px solid var(--line);background:var(--panel);color:inherit;font-family:var(--font);touch-action:manipulation}
#wSel:hover{border-color:var(--cyan)}
#wSel:active{transform:scale(.97)}
#wSel:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}

/* ===== 悬浮按钮 ===== */
#muteBtn{position:absolute;top:64px;right:14px;z-index:30;width:44px;height:44px;border-radius:50%;
  border:1px solid var(--line);background:var(--panel);color:var(--ink);
  display:flex;align-items:center;justify-content:center;cursor:pointer;font-family:var(--font)}
#muteBtn svg{width:20px;height:20px;fill:currentColor}
#muteBtn:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
#bombBtn{position:absolute;right:16px;bottom:104px;z-index:30;width:76px;height:76px;border-radius:50%;
  border:2px solid var(--magenta);background:rgba(255,59,107,.16);color:#ff8fb0;
  display:none;align-items:center;justify-content:center;flex-direction:column;gap:2px;
  font-size:11px;letter-spacing:.1em;cursor:pointer;font-family:var(--font);
  box-shadow:0 0 26px rgba(255,59,107,.22)}
#bombBtn svg{width:22px;height:22px;fill:currentColor}
#bombBtn:active{transform:scale(.94);background:rgba(255,59,107,.32)}
#bombBtn:focus-visible{outline:2px solid var(--magenta);outline-offset:2px}
@media (pointer:coarse){#bombBtn{display:flex}}

/* ===== 遮罩与菜单 ===== */
.overlay{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;
  background:rgba(3,6,12,.55);backdrop-filter:blur(8px);
  opacity:1;visibility:visible;transition:opacity .22s,visibility .22s}
.overlay.off{opacity:0;visibility:hidden;pointer-events:none}
.hidden{display:none!important}
.panel{background:linear-gradient(180deg,rgba(14,24,44,.94),rgba(8,14,26,.96));
  border:1px solid var(--line);border-radius:20px;padding:32px 34px;width:min(430px,90vw);
  text-align:center;box-shadow:0 24px 80px rgba(0,0,0,.5)}
.title{font-size:42px;letter-spacing:.06em;font-weight:800;color:var(--ink);line-height:1.1}
.title .accent{color:var(--cyan);text-shadow:0 0 26px rgba(56,232,255,.5)}
.title.small{font-size:28px}
.title.danger{color:var(--magenta);text-shadow:0 0 26px rgba(255,59,107,.45)}
.sub{color:var(--dim);margin:8px 0 18px;font-size:13px;letter-spacing:.22em;font-family:var(--font)}
.best{margin-bottom:18px;font-size:13px;color:var(--dim);font-family:var(--font)}
.best b{color:var(--amber);font-family:var(--mono);font-size:16px}
.howto{list-style:none;text-align:left;margin:0 auto 22px;padding:14px 16px;
  border:1px dashed var(--line);border-radius:12px;background:rgba(255,255,255,.02)}
.howto li{display:flex;justify-content:space-between;gap:12px;padding:5px 0;font-size:13px;color:var(--dim);font-family:var(--font)}
.howto b{color:var(--ink);font-weight:600}
.howto span{color:var(--dim);text-align:right}
.btn{display:inline-block;border:none;border-radius:12px;padding:13px 34px;font-size:16px;font-weight:700;
  cursor:pointer;font-family:var(--font);transition:transform .12s,box-shadow .12s}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(135deg,#38e8ff,#2f9dff);color:#04121f;box-shadow:0 8px 30px rgba(56,232,255,.32)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn:hover{transform:translateY(-1px)}
.btn:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.btnRow{display:flex;gap:12px;justify-content:center;margin-top:18px}
.hint{font-size:11px;color:var(--dim);margin-top:16px;font-family:var(--font)}
.finalScore{font-size:42px;font-weight:800;color:var(--amber);font-family:var(--mono);margin:6px 0 10px}
.newRec{color:var(--green);font-size:13px;letter-spacing:.12em;margin-top:6px;font-family:var(--font)}

/* ===== 波次横幅 ===== */
#banner{position:absolute;top:24%;left:0;right:0;text-align:center;z-index:15;pointer-events:none;
  font-size:34px;font-weight:800;letter-spacing:.14em;color:var(--ink);font-family:var(--font);
  opacity:0;transform:scale(.92);transition:opacity .3s,transform .3s;
  text-shadow:0 4px 30px rgba(0,0,0,.6)}
#banner.show{opacity:1;transform:scale(1)}
#banner.boss{color:var(--magenta);text-shadow:0 0 34px rgba(255,59,107,.65)}

@media (max-width:560px){
  .title{font-size:32px}
  .hudBig{font-size:18px}
  .panel{padding:24px 20px}
  .howto li{flex-direction:column;gap:2px}
  .howto span{text-align:left}
  #hudBottom{flex-direction:column;align-items:flex-start;gap:8px}
  #banner{font-size:26px}
  #muteBtn{top:14px;right:14px}
}
@media (prefers-reduced-motion:reduce){
  .overlay,#banner{transition:none}
}
</style>
</head>
<body>
<!-- ===== 游戏舞台 ===== -->
<div id="stage">
  <canvas id="game"></canvas>
  <div id="vignette"></div>
</div>

<!-- ===== HUD ===== -->
<div id="hud">
  <div id="hudTop">
    <div class="hudBlock">
      <div class="hudLabel">得分</div>
      <div class="hudBig" id="score">0</div>
      <div class="hudCombo" id="combo"></div>
    </div>
    <div class="hudBlock hudCenter">
      <div class="hudLabel">第 <span id="wave">1</span> 波</div>
      <div class="hudWave" id="enemyCount"></div>
    </div>
    <div class="hudBlock right">
      <div class="hudLabel">最高分</div>
      <div class="hudBig dim" id="hiScore">0</div>
    </div>
  </div>
  <div id="hudBottom">
    <div class="bars">
      <div class="barRow">
        <span class="barTag">装甲</span>
        <div class="bar"><div class="barFill hp" id="hpBar"></div></div>
        <span class="barNum" id="hpText">100</span>
      </div>
      <div class="barRow">
        <span class="barTag">护盾</span>
        <div class="bar"><div class="barFill sh" id="shBar"></div></div>
        <span class="barNum" id="shText">0</span>
      </div>
    </div>
    <div class="weapons">
      <button class="wItem" id="wSel" title="点击切换武器（1-5 / Q·E）">
        <span class="wTag">火力</span>
        <span class="wVal" id="wVal">I</span>
        <span class="wName" id="wName">脉冲</span>
      </button>
      <div class="wItem"><span class="wTag">炸弹</span><span class="wVal" id="bombVal">1</span></div>
    </div>
  </div>
</div>

<!-- ===== 悬浮按钮 ===== -->
<button id="muteBtn" role="switch" aria-checked="true" aria-label="声音开关" title="声音开关（M）">
  <span id="iconSound" class="muteIcon"><svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3z"/><path d="M16 8a5 5 0 0 1 0 8M18.5 5.5a9 9 0 0 1 0 13" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg></span>
  <span id="iconMuted" class="muteIcon hidden"><svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3z"/><path d="M16 9l6 6M22 9l-6 6" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg></span>
</button>
<button id="bombBtn" aria-label="释放炸弹（清屏）">
  <svg viewBox="0 0 24 24"><path d="M13 2 L4 14 h6 l-1 8 L18 10 h-6 z"/></svg>
  <span>炸弹</span>
</button>

<!-- ===== 波次横幅 ===== -->
<div id="banner"></div>

<!-- ===== 主菜单 ===== -->
<div class="overlay" id="menuOverlay">
  <div class="panel">
    <h1 class="title">星际<span class="accent">突击</span></h1>
    <p class="sub">无尽波次 · 太空防御</p>
    <div class="best">历史最高分 <b id="menuBest">0</b></div>
    <ul class="howto">
      <li><b>移动</b><span>WASD / 方向键 / 鼠标 / 触屏拖动</span></li>
      <li><b>开火</b><span>自动开火，拾取「火力」升级当前武器</span></li>
      <li><b>武器</b><span>数字键 1-5 / Q·E 切换，触屏点武器栏</span></li>
      <li><b>炸弹</b><span>空格键或右下按钮，清屏保命</span></li>
      <li><b>暂停</b><span>P / Esc</span></li>
    </ul>
    <button class="btn primary" id="startBtn">开始战斗</button>
    <p class="hint">敌人逐波变强，每 5 波迎战 BOSS</p>
  </div>
</div>

<!-- ===== 暂停 ===== -->
<div class="overlay off" id="pauseOverlay">
  <div class="panel">
    <h2 class="title small">已暂停</h2>
    <div class="btnRow">
      <button class="btn primary" id="resumeBtn">继续</button>
      <button class="btn ghost" id="restartBtn">重新开始</button>
    </div>
  </div>
</div>

<!-- ===== 结束 ===== -->
<div class="overlay off" id="overOverlay">
  <div class="panel">
    <h2 class="title small danger">任务终止</h2>
    <div class="hudLabel">本局得分</div>
    <div class="finalScore" id="finalScore">0</div>
    <div class="best">历史最高分 <b id="finalBest">0</b></div>
    <div class="newRec hidden" id="newRecord">新纪录！</div>
    <div class="btnRow">
      <button class="btn primary" id="againBtn">再来一局</button>
      <button class="btn ghost" id="menuBtn">返回主菜单</button>
    </div>
  </div>
</div>

<script>
'use strict';
/* ================= 工具函数 ================= */
const $ = id => document.getElementById(id);
const rand = (a, b) => a + Math.random() * (b - a);
const randInt = (a, b) => Math.floor(rand(a, b + 1));
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const TAU = Math.PI * 2;
const HYP = Math.hypot;
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const MONO = '"Consolas","Cascadia Mono",ui-monospace,monospace';

/* ================= 画布与星云背景 ================= */
const canvas = $('game');
const ctx = canvas.getContext('2d');
let W = 0, H = 0;
const nebula = document.createElement('canvas');

function buildNebula() {
  nebula.width = Math.max(64, Math.round(W * 2));
  nebula.height = Math.max(64, Math.round(H));
  const n = nebula.getContext('2d');
  n.clearRect(0, 0, nebula.width, nebula.height);
  const spots = [
    { x: 0.18, y: 0.26, r: 0.45, c: 'rgba(56,120,255,0.10)' },
    { x: 0.82, y: 0.72, r: 0.5, c: 'rgba(255,59,107,0.07)' },
    { x: 0.5, y: 0.08, r: 0.4, c: 'rgba(56,232,255,0.06)' },
    { x: 0.1, y: 0.9, r: 0.5, c: 'rgba(140,90,255,0.06)' }
  ];
  for (const s of spots) {
    const g = n.createRadialGradient(s.x * nebula.width, s.y * nebula.height, 0,
      s.x * nebula.width, s.y * nebula.height, s.r * nebula.width);
    g.addColorStop(0, s.c);
    g.addColorStop(1, 'rgba(0,0,0,0)');
    n.fillStyle = g;
    n.fillRect(0, 0, nebula.width, nebula.height);
  }
}

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  buildNebula();
}
window.addEventListener('resize', () => { resize(); initStars(); });
resize();

/* ================= 音频系统 ================= */
const SFX = {
  ctx: null, master: null, muted: false, noiseBuf: null,
  ensure() {
    if (this.ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    this.ctx = new AC();
    this.master = this.ctx.createGain();
    this.master.gain.value = 0.4;
    this.master.connect(this.ctx.destination);
    const len = this.ctx.sampleRate;
    this.noiseBuf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
    const d = this.noiseBuf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    this.muted = localStorage.getItem('starstrike_muted') === '1';
    this.applyMute();
  },
  applyMute() { if (this.master) this.master.gain.value = this.muted ? 0 : 0.4; },
  toggle() { this.muted = !this.muted; localStorage.setItem('starstrike_muted', this.muted ? '1' : '0'); this.applyMute(); },
  tone(type, f0, f1, dur, vol, delay = 0) {
    if (!this.ctx || this.muted) return;
    const t = this.ctx.currentTime + delay;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(Math.max(1, f0), t);
    if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(this.master);
    o.start(t); o.stop(t + dur + 0.02);
  },
  noise(dur, vol, f0, f1, delay = 0) {
    if (!this.ctx || this.muted) return;
    const t = this.ctx.currentTime + delay;
    const s = this.ctx.createBufferSource();
    s.buffer = this.noiseBuf;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    const f = this.ctx.createBiquadFilter();
    f.type = 'lowpass';
    f.frequency.setValueAtTime(f0 || 1200, t);
    if (f1) f.frequency.exponentialRampToValueAtTime(f1, t + dur);
    s.connect(f); f.connect(g); g.connect(this.master);
    s.start(t); s.stop(t + dur + 0.02);
  },
  shoot() { this.tone('square', 640 + rand(0, 120), 180, 0.08, 0.05); },
  hit() { this.tone('square', 220, 120, 0.05, 0.06); },
  enemyDie() { this.noise(0.28, 0.16, 1400, 120); this.tone('triangle', 260, 60, 0.22, 0.10); },
  playerHit() { this.noise(0.4, 0.22, 900, 100); this.tone('sawtooth', 320, 60, 0.4, 0.16); },
  shieldHit() { this.tone('triangle', 520, 220, 0.1, 0.12); },
  powerup() { this.tone('sine', 520, 880, 0.16, 0.12); this.tone('sine', 780, 1320, 0.2, 0.08, 0.06); },
  bomb() { this.noise(0.8, 0.3, 1800, 60); this.tone('sine', 140, 36, 0.7, 0.3); },
  waveClear() { [523, 659, 784].forEach((f, i) => this.tone('triangle', f, f, 0.14, 0.10, i * 0.08)); },
  bossWarn() { this.tone('sawtooth', 330, 330, 0.22, 0.10); this.tone('sawtooth', 440, 440, 0.22, 0.10, 0.25); },
  playerDie() { this.noise(0.9, 0.28, 1000, 60); this.tone('sawtooth', 400, 50, 0.8, 0.18); },
  click() { this.tone('triangle', 660, 880, 0.06, 0.08); }
};

/* 背景音乐：轻量合成循环 */
const Music = {
  timer: null, nextTime: 0, step: 0, on: false,
  start() {
    if (!SFX.ctx || this.on) return;
    this.on = true;
    this.nextTime = SFX.ctx.currentTime + 0.1;
    this.step = 0;
    this.timer = setInterval(() => this.tick(), 80);
  },
  stop() {
    if (this.timer) { clearInterval(this.timer); this.timer = null; }
    this.on = false;
  },
  tick() {
    if (!SFX.ctx || SFX.muted) return;
    const t = SFX.ctx.currentTime;
    const stepDur = 0.14;
    while (this.nextTime < t + 0.22) {
      const s = this.step % 16, bar = Math.floor(this.step / 16) % 4;
      const bass = [110, 110, 130.8, 98][bar];
      if (s % 4 === 0) SFX.tone('sine', bass, bass, stepDur * 2.5, 0.05, this.nextTime - t);
      const arp = [220, 261.6, 329.6, 392, 329.6, 261.6, 220, 196][s % 8];
      if (s % 2 === 0) SFX.tone('triangle', arp, arp, stepDur * 1.4, 0.025, this.nextTime - t);
      this.nextTime += stepDur;
      this.step++;
    }
  }
};

/* ================= 输入 ================= */
const input = { keys: {}, mx: 0, my: 0, active: false, touchMode: false };
function setTarget(e) { input.mx = e.clientX; input.my = e.clientY; }
canvas.addEventListener('pointerdown', e => {
  input.active = true;
  input.touchMode = e.pointerType !== 'mouse';
  setTarget(e);
  try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* 忽略 */ }
});
canvas.addEventListener('pointermove', e => {
  if (e.pointerType === 'mouse' || input.active) setTarget(e);
});
window.addEventListener('pointerup', () => { input.active = false; });
canvas.addEventListener('contextmenu', e => e.preventDefault());

/* ================= 全局状态 ================= */
let state = 'menu'; /* menu | playing | paused | over */
let score = 0;
let hi = parseInt(localStorage.getItem('starstrike_best') || '0', 10) || 0;
let bombs = 1;
let shake = 0, flash = 0, slowmo = 0;
let time = 0;
let combo = 0, comboT = 0;

/* ================= 星空 ================= */
const stars = [];
function initStars() {
  stars.length = 0;
  const n = Math.min(150, Math.round(W * H / 9000));
  for (let i = 0; i < n; i++) {
    stars.push({ x: rand(0, W), y: rand(0, H), s: rand(18, 72), z: rand(0.3, 1), tw: rand(0, TAU) });
  }
}
function updateStars(dt) {
  for (const s of stars) {
    s.y += s.s * dt * (0.6 + (wave ? wave.n : 1) * 0.02);
    s.tw += dt * 2;
    if (s.y > H) { s.y = -4; s.x = rand(0, W); }
  }
}
function drawStars() {
  for (const s of stars) {
    ctx.globalAlpha = (0.35 + 0.65 * Math.abs(Math.sin(s.tw))) * (0.5 + s.z * 0.5);
    ctx.fillStyle = '#cfe8ff';
    const sz = s.z < 0.6 ? 1.2 : 2.2;
    ctx.fillRect(s.x, s.y, sz, sz);
  }
  ctx.globalAlpha = 1;
}
initStars();

/* ================= 粒子 ================= */
const parts = [];
function spawnPart(p) {
  if (parts.length > 700) parts.shift();
  parts.push(p);
}
function explosion(x, y, color, n = 18) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, TAU), sp = rand(40, 280);
    spawnPart({ kind: 'spark', x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: rand(0.25, 0.65), max: 0.65, color, size: rand(1.5, 3.5) });
  }
  spawnPart({ kind: 'ring', x, y, r: 6, max: rand(40, 70), life: 0.35, color });
}
function ring(x, y, color, max = 60) {
  spawnPart({ kind: 'ring', x, y, r: 6, max, life: 0.4, color });
}
function textPop(x, y, text, color, size = 15) {
  spawnPart({ kind: 'text', x, y, text, color, size, life: 0.9, max: 0.9, vy: -46 });
}
function updateParts(dt) {
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.life -= dt;
    if (p.life <= 0) { parts.splice(i, 1); continue; }
    if (p.kind === 'spark') {
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.vx *= 1 - Math.min(1, dt * 2); p.vy *= 1 - Math.min(1, dt * 2);
    } else if (p.kind === 'ring') {
      p.r += (p.max - p.r) * Math.min(1, dt * 8);
    } else if (p.kind === 'text') {
      p.y += p.vy * dt;
    }
  }
}
function drawParts() {
  for (const p of parts) {
    const a = clamp(p.life / (p.max || 1), 0, 1);
    if (p.kind === 'spark') {
      ctx.globalAlpha = a;
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x, p.y, p.size, p.size);
    } else if (p.kind === 'ring') {
      ctx.globalAlpha = a * 0.8;
      ctx.strokeStyle = p.color;
      ctx.lineWidth = 2.5 * a + 0.5;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, TAU); ctx.stroke();
    } else if (p.kind === 'text') {
      ctx.globalAlpha = a;
      ctx.fillStyle = p.color;
      ctx.font = 'bold ' + p.size + 'px ' + MONO;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(p.text, p.x, p.y);
    }
  }
  ctx.globalAlpha = 1;
}

/* ================= 玩家 ================= */
const WEAPONS = [
  { id: 'pulse', name: '脉冲' },
  { id: 'laser', name: '激光' },
  { id: 'missile', name: '导弹' },
  { id: 'scatter', name: '霰弹' },
  { id: 'plasma', name: '电浆' }
];
const player = {
  x: W / 2, y: H * 0.78, hp: 100, maxHp: 100, shield: 0,
  weapon: 1, wType: 0, wLevels: [1, 1, 1, 1, 1],
  fireCd: 0, invuln: 0, alive: true
};

/* ================= 实体数组 ================= */
const pBullets = [], eBullets = [], enemies = [], powerups = [];

function updatePlayer(dt) {
  if (!player.alive) return;
  const sp = 330;
  let kx = 0, ky = 0;
  if (input.keys.ArrowLeft || input.keys.KeyA) kx -= 1;
  if (input.keys.ArrowRight || input.keys.KeyD) kx += 1;
  if (input.keys.ArrowUp || input.keys.KeyW) ky -= 1;
  if (input.keys.ArrowDown || input.keys.KeyS) ky += 1;
  if (kx || ky) {
    const m = HYP(kx, ky);
    player.x += kx / m * sp * dt;
    player.y += ky / m * sp * dt;
  } else {
    const tx = input.touchMode ? (input.active ? input.mx : player.x) : input.mx;
    const ty = input.touchMode ? (input.active ? input.my : player.y) : input.my;
    const k = 1 - Math.pow(0.0005, dt);
    player.x = lerp(player.x, tx, k);
    player.y = lerp(player.y, ty, k);
  }
  player.x = clamp(player.x, 24, W - 24);
  player.y = clamp(player.y, 80, H - 30);
  if (player.invuln > 0) player.invuln -= dt;
  /* 引擎尾焰粒子 */
  spawnPart({ kind: 'spark', x: player.x + rand(-4, 4), y: player.y + 18, vx: rand(-10, 10), vy: rand(80, 150), life: rand(0.15, 0.35), max: 0.35, color: '#38e8ff', size: rand(1, 2.5) });
  /* 自动开火 */
  player.fireCd -= dt;
  if (player.fireCd <= 0) {
    playerShoot();
    player.fireCd = fireCdFor(player.wType, player.weapon);
  }
}

function fireCdFor(type, lv) {
  if (type === 0) return Math.max(0.085, 0.165 - lv * 0.013);   /* 脉冲 */
  if (type === 1) return Math.max(0.07, 0.13 - lv * 0.01);      /* 激光 */
  if (type === 2) return Math.max(0.3, 0.52 - lv * 0.05);       /* 导弹 */
  if (type === 3) return Math.max(0.26, 0.40 - lv * 0.03);      /* 霰弹 */
  return Math.max(0.45, 0.62 - lv * 0.035);                     /* 电浆 */
}

function playerShoot() {
  const sx = player.x, sy = player.y - 20;
  const lv = player.weapon;
  const type = player.wType;
  if (type === 0) {
    const bv = -560;
    const fire = (ang, off) => {
      pBullets.push({
        x: sx + off, y: sy,
        vx: Math.sin(ang) * bv * 0.35, vy: Math.cos(ang) * bv,
        life: 1.1, dmg: 1, kind: 'pulse'
      });
    };
    switch (lv) {
      case 1: fire(0, 0); break;
      case 2: fire(-0.05, -8); fire(0.05, 8); break;
      case 3: fire(0, 0); fire(-0.14, -12); fire(0.14, 12); break;
      case 4: fire(-0.05, -10); fire(0.05, 10); fire(-0.22, -16); fire(0.22, 16); fire(0, 0); break;
      default: fire(0, 0); fire(-0.12, -12); fire(0.12, 12); fire(-0.3, -22); fire(0.3, 22); fire(-0.6, -18); fire(0.6, 18); break;
    }
  } else if (type === 1) {
    pBullets.push({ x: sx, y: sy - 6, vx: 0, vy: -720, life: 0.9, dmg: 2, pierce: 1 + lv, rr: 4, kind: 'laser' });
  } else if (type === 2) {
    const n = lv < 3 ? 1 : lv < 5 ? 2 : 3;
    for (let i = 0; i < n; i++) {
      pBullets.push({
        x: sx + (i - (n - 1) / 2) * 10, y: sy,
        vx: rand(-20, 20), vy: -380, life: 3, dmg: 3, homing: true, rr: 7, kind: 'missile'
      });
    }
  } else if (type === 3) {
    const n = 4 + lv;
    for (let i = 0; i < n; i++) {
      const ang = -Math.PI / 2 + (i - (n - 1) / 2) * 0.09 + rand(-0.02, 0.02);
      const sp = 430 + rand(0, 60);
      pBullets.push({ x: sx, y: sy, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp, life: 0.7, dmg: 1, rr: 3, kind: 'scatter' });
    }
  } else {
    pBullets.push({ x: sx, y: sy, vx: 0, vy: -230, life: 1.6, dmg: 6, rr: 12, explosive: true, boomR: 60 + lv * 10, kind: 'plasma' });
  }
  SFX.shoot();
  spawnPart({ kind: 'spark', x: sx, y: sy - 16, vx: 0, vy: -60, life: 0.12, max: 0.12, color: '#bffaff', size: 3 });
}

/* ================= 敌人 ================= */
function spawnEnemy(type, sub) {
  const x = rand(40, W - 40);
  const e = {
    kind: type, sub: sub || 'fortress', x, y: -30, vx: 0, vy: 0, hp: 1, maxHp: 1, r: 14,
    fireCd: rand(1, 2.5), score: 0, t: rand(0, TAU), seed: rand(0, TAU),
    flash: 0, homeX: rand(60, W - 60), phase: '', pat: 0, patT: 0, spin: 0,
    spd: 0, shield: 0, shieldMax: 0, shieldCd: 0, tickT: 0, dashCd: 1.2, cloaked: false
  };
  switch (type) {
    case 'drone':
      e.hp = 1; e.maxHp = 1; e.score = 100; e.r = 14;
      e.vy = rand(70, 100) + wave.n * 4;
      break;
    case 'fighter':
      e.hp = 2; e.maxHp = 2; e.score = 200; e.r = 16;
      e.vy = rand(95, 120) + wave.n * 4;
      e.vx = rand(120, 180) * (Math.random() < 0.5 ? -1 : 1);
      break;
    case 'shooter':
      e.hp = 4; e.maxHp = 4; e.score = 300; e.r = 18;
      e.vy = rand(90, 120); e.phase = 'enter'; e.fireCd = rand(0.8, 1.4);
      break;
    case 'tank':
      e.hp = 10 + Math.floor(wave.n * 1.5); e.maxHp = e.hp; e.score = 500; e.r = 26;
      e.vy = rand(34, 46); e.fireCd = rand(1.2, 2);
      break;
    case 'kamikaze':
      e.hp = 3; e.maxHp = 3; e.score = 250; e.r = 15;
      e.vy = rand(90, 120); e.spd = rand(170, 210) + wave.n * 8;
      break;
    case 'splitter':
      e.hp = 5; e.maxHp = 5; e.score = 350; e.r = 19;
      e.vy = rand(55, 75);
      break;
    case 'cloaker':
      e.hp = 4; e.maxHp = 4; e.score = 400; e.r = 16;
      e.vy = 42; e.tickT = 0; e.dashCd = 1.2;
      break;
    case 'shielder':
      e.hp = 6; e.maxHp = 6; e.score = 450; e.r = 22;
      e.vy = rand(34, 44); e.shield = 30; e.shieldMax = 30; e.fireCd = rand(1.4, 2.2);
      break;
    case 'boss':
      e.hp = 240 + wave.n * 45; e.maxHp = e.hp; e.score = 5000; e.r = 66;
      e.vy = 60; e.phase = 'enter';
      break;
  }
  enemies.push(e);
  if (type === 'boss') wave.boss = e;
  return e;
}

function updateEnemies(dt) {
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    e.t += dt;
    if (e.flash > 0) e.flash -= dt;
    if (e.kind === 'boss') { updateBoss(e, dt); continue; }
    switch (e.kind) {
      case 'drone':
        e.x += Math.sin(e.t * 2.2 + e.seed) * 30 * dt;
        e.y += e.vy * dt;
        break;
      case 'fighter':
        e.x += e.vx * dt;
        e.y += e.vy * dt;
        if (e.x < 30 || e.x > W - 30) e.vx *= -1;
        e.x += Math.sin(e.t * 3) * 40 * dt;
        break;
      case 'shooter':
        if (e.phase === 'enter') {
          e.y += e.vy * dt;
          if (e.y >= H * 0.12) { e.y = H * 0.12; e.phase = 'hover'; e.homeX = rand(70, W - 70); }
        } else {
          e.x = lerp(e.x, e.homeX, 1 - Math.pow(0.01, dt));
          e.fireCd -= dt;
          if (e.fireCd <= 0) { enemyFire(e); e.fireCd = Math.max(0.7, 1.7 - wave.n * 0.05); }
        }
        break;
      case 'tank':
        e.y += e.vy * dt;
        e.x += Math.sin(e.t * 1.4 + e.seed) * 22 * dt;
        e.fireCd -= dt;
        if (e.fireCd <= 0) { enemyFire(e); e.fireCd = Math.max(1.0, 2.2 - wave.n * 0.06); }
        break;
      case 'kamikaze':
        {
          const a = Math.atan2(player.y - e.y, player.x - e.x);
          const k = Math.min(1, dt * 3);
          e.vx = lerp(e.vx, Math.cos(a) * e.spd, k);
          e.vy = lerp(e.vy, Math.sin(a) * e.spd, k);
          e.x += e.vx * dt;
          e.y += e.vy * dt;
        }
        break;
      case 'splitter':
        e.y += e.vy * dt;
        e.x += Math.sin(e.t * 1.8 + e.seed) * 20 * dt;
        break;
      case 'cloaker':
        {
          e.tickT += dt;
          const phase = e.tickT % 4.4;
          if (phase < 1.8) {
            e.cloaked = false;
            e.vx = 0;
            e.y += 42 * dt;
            e.x += Math.sin(e.t * 2) * 26 * dt;
          } else if (phase < 3.2) {
            e.cloaked = true;
            e.y += 12 * dt;
          } else {
            e.cloaked = false;
            if (e.dashCd <= 0) {
              const a = Math.atan2(player.y - e.y, player.x - e.x);
              e.vx = Math.cos(a) * 400;
              e.vy = Math.sin(a) * 400;
              e.dashCd = 1.2;
            }
            e.x += e.vx * dt;
            e.y += e.vy * dt;
          }
          if (e.dashCd > 0) e.dashCd -= dt;
        }
        break;
      case 'shielder':
        e.y += e.vy * dt;
        e.x += Math.sin(e.t * 1.2 + e.seed) * 18 * dt;
        e.shieldCd += dt;
        if (e.shieldCd >= 3) { e.shield = e.shieldMax; e.shieldCd = 0; }
        e.fireCd -= dt;
        if (e.fireCd <= 0) { enemyFire(e); e.fireCd = Math.max(1.2, 2.4 - wave.n * 0.06); }
        break;
    }
    if (e.y > H + 50) enemies.splice(i, 1);
  }
}

function enemyFire(e) {
  const dx = player.x - e.x, dy = player.y - e.y;
  const ang = Math.atan2(dy, dx);
  const sp = (e.kind === 'shielder' ? 210 : 140) + wave.n * 10;
  const shots = e.kind === 'tank' ? 3 : 1;
  for (let i = 0; i < shots; i++) {
    const a = ang + (i - (shots - 1) / 2) * 0.18;
    eBullets.push({ x: e.x + Math.cos(a) * e.r, y: e.y + Math.sin(a) * e.r, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 5, r: 5 });
  }
}

function updateBoss(e, dt) {
  if (e.phase === 'enter') {
    e.y += e.vy * dt;
    if (e.y >= H * 0.18) { e.y = H * 0.18; e.phase = 'fight'; }
  } else {
    e.x += Math.sin(e.t * 0.6) * 70 * dt;
    e.x = clamp(e.x, 90, W - 90);
    e.fireCd -= dt;
    if (e.fireCd <= 0) {
      e.pat = (e.pat + 1) % 4;
      e.fireCd = e.sub === 'hive' ? 1.6 : 1.4;
      if (e.sub === 'hive') hivePattern(e);
      else fortressPattern(e);
    }
  }
}

function fortressPattern(e) {
  const dx = player.x - e.x, dy = player.y - e.y;
  const base = Math.atan2(dy, dx);
  if (e.pat === 0) {
    for (let i = 0; i < 5; i++) {
      const a = base + (i - 2) * 0.14, sp = 190 + wave.n * 8;
      eBullets.push({ x: e.x, y: e.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 6, r: 6 });
    }
  } else if (e.pat === 1) {
    const n = 14 + Math.min(8, wave.n);
    for (let i = 0; i < n; i++) {
      const a = TAU * i / n + e.spin, sp = 150 + wave.n * 6;
      eBullets.push({ x: e.x, y: e.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 6, r: 6 });
    }
    e.spin += 0.35;
  } else if (e.pat === 2) {
    eBullets.push({ x: e.x, y: e.y, vx: Math.cos(base) * 230, vy: Math.sin(base) * 230, life: 6, r: 7 });
    eBullets.push({ x: e.x, y: e.y, vx: Math.cos(base + 0.5) * 170, vy: Math.sin(base + 0.5) * 170, life: 6, r: 6 });
    eBullets.push({ x: e.x, y: e.y, vx: Math.cos(base - 0.5) * 170, vy: Math.sin(base - 0.5) * 170, life: 6, r: 6 });
  } else {
    for (let i = 0; i < 4; i++) {
      const a = e.spin + i * 1.57, sp = 120 + wave.n * 4;
      eBullets.push({ x: e.x, y: e.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 6, r: 5 });
    }
    e.spin += 0.5;
  }
}

function hivePattern(e) {
  const dx = player.x - e.x, dy = player.y - e.y;
  const base = Math.atan2(dy, dx);
  if (e.pat === 0) {
    for (let i = 0; i < 6; i++) {
      const a = base + (i - 2.5) * 0.12, sp = 200 + wave.n * 8;
      eBullets.push({ x: e.x, y: e.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 6, r: 6 });
    }
  } else if (e.pat === 1) {
    const m = Math.min(4, 2 + Math.floor(wave.n / 10));
    for (let i = 0; i < m; i++) {
      const d = spawnEnemy(Math.random() < 0.4 ? 'kamikaze' : 'drone');
      d.x = e.x + rand(-40, 40);
      d.y = e.y + 20;
    }
    textPop(e.x, e.y - e.r - 20, '召唤护卫', '#3dffa0', 16);
  } else if (e.pat === 2) {
    const n = 12 + Math.min(6, wave.n);
    for (let i = 0; i < n; i++) {
      const a = TAU * i / n + e.spin, sp = 180 + wave.n * 6;
      eBullets.push({ x: e.x, y: e.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 6, r: 6 });
    }
    e.spin += 0.3;
  } else {
    for (let i = 0; i < 4; i++) {
      const a = e.spin + i * Math.PI / 2;
      for (let j = 0; j < 3; j++) {
        const sp = 130 + j * 90 + wave.n * 4;
        eBullets.push({ x: e.x, y: e.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 6, r: 5 });
      }
    }
    e.spin += 0.4;
  }
}

/* ================= 伤害与击杀 ================= */
function damageEnemy(e, d, sx, sy) {
  if (e.cloaked) return;
  if (e.shield > 0) {
    e.shield -= d;
    e.shieldCd = 0;
    e.flash = 0.08;
    SFX.shieldHit();
    spawnPart({ kind: 'spark', x: e.x + rand(-10, 10), y: e.y + rand(-10, 10), vx: rand(-60, 60), vy: rand(-60, 60), life: 0.18, max: 0.18, color: '#7df3ff', size: 2 });
    return;
  }
  e.hp -= d;
  e.flash = 0.08;
  SFX.hit();
  spawnPart({ kind: 'spark', x: e.x + rand(-8, 8), y: e.y + rand(-8, 8), vx: rand(-60, 60), vy: rand(-60, 60), life: 0.18, max: 0.18, color: '#fff', size: 2 });
  if (e.hp <= 0) killEnemy(e);
}

function killEnemy(e) {
  const idx = enemies.indexOf(e);
  if (idx < 0) return;
  enemies.splice(idx, 1);
  if (e.kind === 'boss') { wave.boss = null; bossDie(e); return; }
  if (e.kind === 'splitter') {
    for (let i = 0; i < 2; i++) {
      const d = spawnEnemy('drone');
      d.x = e.x + rand(-14, 14);
      d.y = e.y + rand(-6, 6);
    }
  }
  SFX.enemyDie();
  explosion(e.x, e.y, e.kind === 'tank' ? '#ff9a3d' : '#ff5b8a');
  combo++; comboT = 3;
  const mult = 1 + combo * 0.05;
  const pts = Math.round(e.score * mult / 10) * 10;
  score += pts;
  textPop(e.x, e.y - 16, '+' + pts, mult > 1.3 ? '#ffc93c' : '#dfe9f5');
  if (Math.random() < 0.13) dropPowerup(e.x, e.y);
  shake = Math.min(12, shake + 2);
}

function bossDie(e) {
  SFX.bomb();
  SFX.waveClear();
  explosion(e.x, e.y, '#38e8ff', 40);
  explosion(e.x, e.y, '#ffc93c', 30);
  ring(e.x, e.y, '#38e8ff', 260);
  shake = 26; flash = 1; slowmo = 0.5;
  combo += 10; comboT = 3;
  const mult = 1 + combo * 0.05;
  const pts = Math.round(e.score * mult / 10) * 10;
  score += pts;
  textPop(e.x, e.y - 90, 'BOSS 击破 +' + pts, '#ffc93c', 26);
  for (let i = 0; i < 3; i++) dropPowerup(e.x + rand(-60, 60), e.y + rand(-20, 30));
}

function dropPowerup(x, y) {
  const r = Math.random();
  let kind;
  if (r < 0.30) kind = 'W';
  else if (r < 0.50) kind = 'S';
  else if (r < 0.70) kind = 'H';
  else if (r < 0.85) kind = 'B';
  else kind = 'N';
  powerups.push({ kind, x, y, vy: rand(70, 95), t: rand(0, TAU), ttl: 12 });
}

function updatePowerups(dt) {
  for (let i = powerups.length - 1; i >= 0; i--) {
    const p = powerups[i];
    p.t += dt; p.ttl -= dt;
    p.x += Math.sin(p.t * 3) * 30 * dt;
    p.y += p.vy * dt;
    if (p.ttl <= 0 || p.y > H + 20) { powerups.splice(i, 1); continue; }
    if (!player.alive) continue;
    const d = HYP(p.x - player.x, p.y - player.y);
    if (d < 110) {
      const a = Math.atan2(player.y - p.y, player.x - p.x);
      p.x += Math.cos(a) * 300 * dt;
      p.y += Math.sin(a) * 300 * dt;
    }
    if (d < 26) { applyPowerup(p); powerups.splice(i, 1); }
  }
}

function applyPowerup(p) {
  SFX.powerup();
  ring(p.x, p.y, '#ffc93c', 46);
  switch (p.kind) {
    case 'W':
      player.wLevels[player.wType] = Math.min(5, player.wLevels[player.wType] + 1);
      player.weapon = player.wLevels[player.wType];
      textPop(player.x, player.y - 40, WEAPONS[player.wType].name + '升级', '#ffc93c');
      break;
    case 'S':
      player.shield = Math.min(60, player.shield + 30);
      textPop(player.x, player.y - 40, '护盾 +30', '#38e8ff');
      break;
    case 'H':
      player.hp = Math.min(player.maxHp, player.hp + 30);
      textPop(player.x, player.y - 40, '修复 +30', '#3dffa0');
      break;
    case 'B':
      bombs = Math.min(5, bombs + 1);
      textPop(player.x, player.y - 40, '炸弹 +1', '#ffc93c');
      break;
    case 'N':
      textPop(player.x, player.y - 40, '过载冲击！', '#ff5b8a', 20);
      overload();
      break;
  }
}

function overload() {
  flash = 0.8; shake = 18; SFX.bomb();
  clearEnemyBullets();
  for (let i = enemies.length - 1; i >= 0; i--) damageEnemy(enemies[i], 40, enemies[i].x, enemies[i].y);
}

function clearEnemyBullets() {
  eBullets.length = 0;
  for (let i = 0; i < 24; i++) {
    const a = rand(0, TAU);
    spawnPart({ kind: 'spark', x: rand(0, W), y: rand(0, H), vx: Math.cos(a) * 120, vy: Math.sin(a) * 120, life: 0.4, max: 0.4, color: '#ffc93c', size: 2.5 });
  }
}

function useBomb() {
  if (!player.alive || bombs <= 0 || state !== 'playing') return;
  bombs--;
  flash = 0.9; shake = 22; SFX.bomb();
  ring(player.x, player.y, '#ffc93c', H * 0.5);
  clearEnemyBullets();
  for (let i = enemies.length - 1; i >= 0; i--) damageEnemy(enemies[i], 60, enemies[i].x, enemies[i].y);
}

function damagePlayer(d, sx, sy) {
  if (!player.alive || player.invuln > 0) return;
  if (player.shield > 0) {
    player.shield -= d;
    SFX.shieldHit();
    ring(player.x, player.y, '#38e8ff', 40);
    shake = Math.min(14, shake + 5);
    return;
  }
  player.hp -= d;
  player.invuln = 1.3;
  combo = 0; comboT = 0;
  shake = Math.min(18, shake + 8);
  flash = Math.max(flash, 0.35);
  SFX.playerHit();
  explosion(player.x, player.y, '#ff5b8a', 14);
  if (player.hp <= 0) playerDie();
}

function playerDie() {
  player.alive = false;
  SFX.playerDie();
  explosion(player.x, player.y, '#ffc93c', 30);
  explosion(player.x, player.y, '#ff5b8a', 26);
  ring(player.x, player.y, '#fff', 120);
  shake = 30; flash = 1;
  setTimeout(() => endGame(), 900);
}

function collideBullets() {
  for (let i = pBullets.length - 1; i >= 0; i--) {
    const b = pBullets[i];
    for (let j = enemies.length - 1; j >= 0; j--) {
      const e = enemies[j];
      if (e.cloaked) continue;
      if (HYP(b.x - e.x, b.y - e.y) < e.r + (b.rr || 5)) {
        if (b.explosive) {
          plasmaBoom(b.x, b.y, b.boomR, b.dmg);
          pBullets.splice(i, 1);
          break;
        }
        damageEnemy(e, b.dmg, b.x, b.y);
        if (b.pierce) {
          if (!b.hitSet) b.hitSet = [];
          if (b.hitSet.indexOf(e) >= 0) continue;
          b.hitSet.push(e);
          b.pierce--;
          spawnPart({ kind: 'spark', x: b.x, y: b.y, vx: rand(-40, 40), vy: rand(-40, 40), life: 0.12, max: 0.12, color: '#ff5bd8', size: 2 });
          if (b.pierce <= 0) { pBullets.splice(i, 1); }
          break;
        }
        pBullets.splice(i, 1);
        break;
      }
    }
  }
}

function plasmaBoom(x, y, r, dmg) {
  SFX.bomb();
  explosion(x, y, '#c06bff', 14);
  ring(x, y, '#c06bff', r);
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    if (HYP(e.x - x, e.y - y) < r + e.r) damageEnemy(e, dmg, x, y);
  }
}

function collidePlayer() {
  if (!player.alive || player.invuln > 0) return;
  for (let i = eBullets.length - 1; i >= 0; i--) {
    const b = eBullets[i];
    if (HYP(b.x - player.x, b.y - player.y) < b.r + 11) {
      eBullets.splice(i, 1);
      damagePlayer(10, b.x, b.y);
      if (!player.alive) return;
    }
  }
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    if (HYP(e.x - player.x, e.y - player.y) < e.r + 11) {
      if (e.kind === 'kamikaze') {
        kamikazeBlow(e);
        damagePlayer(28, e.x, e.y);
        if (!player.alive) return;
        continue;
      }
      damagePlayer(18, e.x, e.y);
      if (!player.alive) return;
    }
  }
}

function kamikazeBlow(e) {
  const idx = enemies.indexOf(e);
  if (idx < 0) return;
  enemies.splice(idx, 1);
  SFX.bomb();
  explosion(e.x, e.y, '#ff8f3d', 16);
  ring(e.x, e.y, '#ffc93c', 46);
  shake = Math.min(14, shake + 4);
}

/* ================= 波次系统 ================= */
const wave = { n: 0, queue: [], t: 0, clearT: 0, boss: null };
function orderOf(t) {
  return t === 'drone' ? 0 : t === 'kamikaze' ? 1 : t === 'fighter' ? 2 :
    t === 'splitter' ? 3 : t === 'shooter' ? 4 : t === 'tank' ? 5 :
    t === 'cloaker' ? 6 : 7;
}

function buildWave(n) {
  wave.queue = [];
  if (n % 5 === 0) {
    let t = 0.6;
    const escort = Math.min(4 + Math.floor(n / 5) * 2, 10);
    for (let i = 0; i < escort; i++) {
      wave.queue.push({ type: Math.random() < 0.5 ? 'drone' : 'fighter', t });
      t += 0.5;
    }
    const sub = (Math.floor(n / 5) % 2 === 1) ? 'fortress' : 'hive';
    wave.queue.push({ type: 'boss', sub, t: t + 1.5 });
    return;
  }
  const count = Math.min(10 + Math.floor(n * 2.2), 44);
  const list = [];
  for (let i = 0; i < count; i++) {
    let t = 'drone';
    const r = Math.random();
    if (n >= 2) {
      if (r < 0.14) t = 'kamikaze';
      else if (r < 0.34) t = 'fighter';
      else if (n >= 3 && r < 0.46) t = 'splitter';
      else if (n >= 3 && r < 0.58) t = 'shooter';
      else if (n >= 4 && r < 0.70) t = 'cloaker';
      else if (n >= 4 && r < 0.80) t = 'tank';
      else if (n >= 6 && r < 0.88) t = 'shielder';
    }
    list.push(t);
  }
  list.sort((a, b) => orderOf(a) - orderOf(b));
  let t = 0.6;
  for (const ty of list) {
    wave.queue.push({ type: ty, t });
    t += rand(0.26, 0.5);
  }
}

function startWave(n) {
  wave.n = n;
  wave.t = 0;
  wave.clearT = 0;
  wave.boss = null;
  buildWave(n);
  showBanner('第 ' + n + ' 波', n % 5 === 0 ? 'boss' : '');
  if (n % 5 === 0) SFX.bossWarn();
}

function updateWave(dt) {
  wave.t += dt;
  while (wave.queue.length && wave.queue[0].t <= wave.t) {
    const s = wave.queue.shift();
    spawnEnemy(s.type, s.sub);
  }
  if (!wave.queue.length && !enemies.length && wave.clearT === 0) {
    wave.clearT = 2.0;
  }
  if (wave.clearT > 0) {
    wave.clearT -= dt;
    if (wave.clearT <= 0) {
      if (wave.n % 5 === 0) {
        player.hp = Math.min(player.maxHp, player.hp + 40);
        textPop(player.x, player.y - 60, 'BOSS 战奖励 · 修复', '#3dffa0');
      } else {
        player.hp = Math.min(player.maxHp, player.hp + 15);
      }
      SFX.waveClear();
      startWave(wave.n + 1);
    }
  }
}

/* ================= 主更新 ================= */
function update(dt) {
  time += dt;
  updateStars(dt);
  updateParts(dt);
  if (state !== 'playing') return;
  if (slowmo > 0) { slowmo -= dt; dt *= 0.35; }
  if (comboT > 0) { comboT -= dt; if (comboT <= 0) combo = 0; }
  updatePlayer(dt);
  for (let i = pBullets.length - 1; i >= 0; i--) {
    const b = pBullets[i];
    if (b.homing) {
      let target = null, bd = 1e9;
      for (const e of enemies) {
        const dd = (e.x - b.x) * (e.x - b.x) + (e.y - b.y) * (e.y - b.y);
        if (dd < bd) { bd = dd; target = e; }
      }
      if (target) {
        const want = Math.atan2(target.y - b.y, target.x - b.x);
        const cur = Math.atan2(b.vy, b.vx);
        let diff = want - cur;
        while (diff > Math.PI) diff -= TAU;
        while (diff < -Math.PI) diff += TAU;
        const na = cur + clamp(diff, -6 * dt, 6 * dt);
        const sp = HYP(b.vx, b.vy);
        b.vx = Math.cos(na) * sp;
        b.vy = Math.sin(na) * sp;
      }
    }
    b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
    if (b.explosive && (b.life <= 0 || b.y < -30)) {
      plasmaBoom(b.x, b.y, b.boomR, b.dmg);
      pBullets.splice(i, 1);
      continue;
    }
    if (b.life <= 0 || b.y < -20 || b.x < -20 || b.x > W + 20) pBullets.splice(i, 1);
  }
  for (let i = eBullets.length - 1; i >= 0; i--) {
    const b = eBullets[i];
    b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
    if (b.life <= 0 || b.y > H + 30 || b.x < -30 || b.x > W + 30) eBullets.splice(i, 1);
  }
  updateEnemies(dt);
  collideBullets();
  collidePlayer();
  updatePowerups(dt);
  updateWave(dt);
  shake *= 1 - Math.min(1, dt * 6);
  if (shake < 0.2) shake = 0;
  flash = Math.max(0, flash - dt * 2.5);
  hud();
}

/* ================= 渲染 ================= */
function drawNebula() {
  const dx = (time * 8) % nebula.width;
  ctx.globalAlpha = 0.9;
  ctx.drawImage(nebula, dx, 0);
  ctx.drawImage(nebula, dx - nebula.width, 0);
  ctx.globalAlpha = 1;
}

function drawPlayer() {
  if (!player.alive) return;
  if (player.invuln > 0 && Math.floor(time * 20) % 2 === 0) ctx.globalAlpha = 0.35;
  const x = player.x, y = player.y;
  if (player.shield > 0) {
    ctx.strokeStyle = 'rgba(56,232,255,0.5)';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(x, y, 24, 0, TAU); ctx.stroke();
    ctx.fillStyle = 'rgba(56,232,255,0.08)';
    ctx.fill();
  }
  const fl = Math.sin(time * 40) * 4;
  ctx.fillStyle = 'rgba(255,201,60,0.9)';
  ctx.beginPath();
  ctx.moveTo(x - 5, y + 16); ctx.lineTo(x, y + 26 + fl); ctx.lineTo(x + 5, y + 16);
  ctx.closePath(); ctx.fill();
  ctx.save();
  ctx.translate(x, y);
  ctx.fillStyle = '#38e8ff';
  ctx.beginPath();
  ctx.moveTo(0, -22);
  ctx.lineTo(14, 14); ctx.lineTo(6, 10); ctx.lineTo(0, 16); ctx.lineTo(-6, 10); ctx.lineTo(-14, 14);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#eaf7ff';
  ctx.beginPath(); ctx.moveTo(0, -12); ctx.lineTo(5, 8); ctx.lineTo(-5, 8);
  ctx.closePath(); ctx.fill();
  ctx.restore();
  ctx.globalAlpha = 1;
}

function drawBossHp(e) {
  const w = Math.max(120, e.r * 2.2);
  const pct = clamp(e.hp / e.maxHp, 0, 1);
  ctx.fillStyle = 'rgba(10,18,34,0.7)';
  ctx.fillRect(e.x - w / 2, e.y - e.r - 24, w, 8);
  ctx.fillStyle = pct > 0.4 ? (e.sub === 'hive' ? '#3dffa0' : '#ff5b8a') : '#ffc93c';
  ctx.fillRect(e.x - w / 2, e.y - e.r - 24, w * pct, 8);
}

function drawEnemy(e) {
  if (e.kind === 'boss') drawBossHp(e);
  ctx.save();
  ctx.translate(e.x, e.y);
  const flash = e.flash > 0;
  if (e.kind === 'boss') {
    if (e.sub === 'hive') {
      ctx.fillStyle = flash ? '#fff' : '#3dffa0';
      ctx.beginPath();
      ctx.moveTo(0, -36); ctx.lineTo(28, -18); ctx.lineTo(34, 12); ctx.lineTo(16, 38);
      ctx.lineTo(-16, 38); ctx.lineTo(-34, 12); ctx.lineTo(-28, -18);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = flash ? '#fff' : '#0c2b22';
      ctx.beginPath(); ctx.arc(0, 8, 18, 0, TAU); ctx.fill();
      ctx.fillStyle = flash ? '#fff' : '#c06bff';
      ctx.beginPath(); ctx.arc(0, 8, 9 + Math.sin(e.t * 5) * 2, 0, TAU); ctx.fill();
      ctx.fillStyle = flash ? '#fff' : '#7dffce';
      ctx.beginPath(); ctx.moveTo(-34, 2); ctx.lineTo(-56, 18); ctx.lineTo(-30, 20); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(34, 2); ctx.lineTo(56, 18); ctx.lineTo(30, 20); ctx.closePath(); ctx.fill();
    } else {
      ctx.fillStyle = flash ? '#fff' : '#ff5b8a';
      ctx.beginPath();
      ctx.moveTo(0, -40); ctx.lineTo(30, -22); ctx.lineTo(26, 26); ctx.lineTo(10, 40);
      ctx.lineTo(-10, 40); ctx.lineTo(-26, 26); ctx.lineTo(-30, -22);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = flash ? '#fff' : '#2a0a14';
      ctx.beginPath(); ctx.arc(0, 0, 16, 0, TAU); ctx.fill();
      ctx.fillStyle = flash ? '#fff' : '#ffc93c';
      ctx.beginPath(); ctx.arc(0, 0, 8 + Math.sin(e.t * 6) * 2, 0, TAU); ctx.fill();
      ctx.fillStyle = flash ? '#fff' : '#ff8fb0';
      ctx.beginPath(); ctx.moveTo(-30, -10); ctx.lineTo(-52, 10); ctx.lineTo(-26, 14); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(30, -10); ctx.lineTo(52, 10); ctx.lineTo(26, 14); ctx.closePath(); ctx.fill();
    }
  } else if (e.kind === 'drone') {
    ctx.fillStyle = flash ? '#fff' : '#ff5b8a';
    ctx.beginPath();
    ctx.moveTo(0, 14); ctx.lineTo(10, -6); ctx.lineTo(0, -2); ctx.lineTo(-10, -6);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = flash ? '#fff' : '#ff9db8';
    ctx.beginPath(); ctx.arc(0, 0, 4, 0, TAU); ctx.fill();
  } else if (e.kind === 'fighter') {
    ctx.rotate(Math.atan2(e.vy, e.vx) + Math.PI / 2);
    ctx.fillStyle = flash ? '#fff' : '#ff8f3d';
    ctx.beginPath();
    ctx.moveTo(0, -14); ctx.lineTo(12, 12); ctx.lineTo(0, 6); ctx.lineTo(-12, 12);
    ctx.closePath(); ctx.fill();
  } else if (e.kind === 'shooter') {
    ctx.fillStyle = flash ? '#fff' : '#c06bff';
    ctx.beginPath();
    ctx.moveTo(0, -14); ctx.lineTo(14, 6); ctx.lineTo(9, 14); ctx.lineTo(-9, 14); ctx.lineTo(-14, 6);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = flash ? '#fff' : '#ffc93c';
    ctx.beginPath(); ctx.arc(0, -2, 3.5, 0, TAU); ctx.fill();
  } else if (e.kind === 'tank') {
    ctx.fillStyle = flash ? '#fff' : '#3dffa0';
    ctx.beginPath();
    ctx.moveTo(0, -20); ctx.lineTo(24, 6); ctx.lineTo(16, 22); ctx.lineTo(-16, 22); ctx.lineTo(-24, 6);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = flash ? '#fff' : '#0c2b22';
    ctx.beginPath(); ctx.arc(0, 2, 9, 0, TAU); ctx.fill();
  } else if (e.kind === 'kamikaze') {
    ctx.fillStyle = flash ? '#fff' : '#ff8f3d';
    ctx.beginPath();
    ctx.moveTo(0, 16); ctx.lineTo(9, -8); ctx.lineTo(0, -3); ctx.lineTo(-9, -8);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(255,201,60,0.8)';
    ctx.beginPath();
    ctx.moveTo(-3, 16); ctx.lineTo(0, 22 + Math.sin(e.t * 30) * 3); ctx.lineTo(3, 16);
    ctx.closePath(); ctx.fill();
  } else if (e.kind === 'splitter') {
    ctx.fillStyle = flash ? '#fff' : '#c06bff';
    ctx.beginPath();
    for (let k = 0; k < 6; k++) {
      const a = e.t * 0.6 + k * TAU / 6;
      const px = Math.cos(a) * 17, py = Math.sin(a) * 17;
      if (k === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = flash ? '#fff' : '#f3d9ff';
    ctx.beginPath(); ctx.arc(0, 0, 5, 0, TAU); ctx.fill();
  } else if (e.kind === 'cloaker') {
    ctx.globalAlpha = e.cloaked ? 0.15 : 0.85 + 0.15 * Math.sin(e.t * 6);
    ctx.fillStyle = flash ? '#fff' : '#38e8ff';
    ctx.beginPath();
    ctx.moveTo(0, -16); ctx.lineTo(13, 0); ctx.lineTo(0, 16); ctx.lineTo(-13, 0);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = 'rgba(56,232,255,0.8)';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.globalAlpha = 1;
  } else if (e.kind === 'shielder') {
    if (e.shield > 0) {
      ctx.strokeStyle = 'rgba(125,243,255,0.7)';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(0, 0, e.r + 4, 0, TAU); ctx.stroke();
    }
    ctx.fillStyle = flash ? '#fff' : '#c8f04d';
    ctx.beginPath();
    ctx.moveTo(0, -18); ctx.lineTo(16, 0); ctx.lineTo(0, 18); ctx.lineTo(-16, 0);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = flash ? '#fff' : '#1a2b10';
    ctx.beginPath(); ctx.arc(0, 0, 6, 0, TAU); ctx.fill();
  }
  ctx.restore();
}

function drawPowerup(p) {
  if (p.ttl < 3 && Math.floor(time * 8) % 2 === 0) return;
  const colors = { W: '#ffc93c', S: '#38e8ff', H: '#3dffa0', B: '#ff5b8a', N: '#c06bff' };
  const labels = { W: 'W', S: 'S', H: 'H', B: 'B', N: 'N' };
  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.rotate(Math.sin(p.t * 3) * 0.2);
  ctx.fillStyle = 'rgba(8,14,26,0.7)';
  ctx.strokeStyle = colors[p.kind];
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(0, 0, 13, 0, TAU); ctx.fill(); ctx.stroke();
  ctx.fillStyle = colors[p.kind];
  ctx.font = 'bold 13px ' + MONO;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(labels[p.kind], 0, 1);
  ctx.restore();
}

function drawBullets() {
  for (const b of pBullets) {
    if (b.kind === 'laser') {
      ctx.strokeStyle = '#ff5bd8';
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(b.x, b.y + 16); ctx.stroke();
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(b.x, b.y, 2.5, 0, TAU); ctx.fill();
    } else if (b.kind === 'missile') {
      ctx.fillStyle = '#ffc93c';
      ctx.save();
      ctx.translate(b.x, b.y);
      ctx.rotate(Math.atan2(b.vy, b.vx) + Math.PI / 2);
      ctx.beginPath(); ctx.moveTo(0, -7); ctx.lineTo(4, 5); ctx.lineTo(-4, 5); ctx.closePath(); ctx.fill();
      ctx.restore();
    } else if (b.kind === 'plasma') {
      ctx.fillStyle = 'rgba(192,107,255,0.35)';
      ctx.beginPath(); ctx.arc(b.x, b.y, 12, 0, TAU); ctx.fill();
      ctx.fillStyle = '#c06bff';
      ctx.beginPath(); ctx.arc(b.x, b.y, 6, 0, TAU); ctx.fill();
    } else if (b.kind === 'scatter') {
      ctx.fillStyle = '#9dffc9';
      ctx.fillRect(b.x - 1.5, b.y - 4, 3, 8);
    } else {
      ctx.globalAlpha = 0.9;
      ctx.fillStyle = '#bffaff';
      ctx.fillRect(b.x - 1.5, b.y - 7, 3, 14);
      ctx.globalAlpha = 1;
    }
  }
  for (const b of eBullets) {
    ctx.fillStyle = 'rgba(255,91,138,0.35)';
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.fill();
    ctx.fillStyle = '#ff5b8a';
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 0.7, 0, TAU); ctx.fill();
  }
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  ctx.save();
  if (shake > 0.3 && !REDUCED) ctx.translate(rand(-shake, shake) * 0.5, rand(-shake, shake) * 0.5);
  drawNebula();
  drawStars();
  for (const p of powerups) drawPowerup(p);
  for (const e of enemies) drawEnemy(e);
  drawBullets();
  if (player.alive) drawPlayer();
  drawParts();
  ctx.restore();
  if (flash > 0) {
    ctx.fillStyle = 'rgba(255,255,255,' + (flash * 0.5) + ')';
    ctx.fillRect(0, 0, W, H);
  }
}

/* ================= HUD ================= */
const el = {
  score: $('score'), hi: $('hiScore'), wave: $('wave'), rem: $('enemyCount'),
  hp: $('hpBar'), hpT: $('hpText'), sh: $('shBar'), shT: $('shText'),
  bomb: $('bombVal'), w: $('wVal'), wName: $('wName'), combo: $('combo')
};
const hc = {};
function hud() {
  if (hc.score !== score) { hc.score = score; el.score.textContent = score.toLocaleString(); }
  if (hc.hi !== hi) { hc.hi = hi; el.hi.textContent = hi.toLocaleString(); }
  if (hc.wave !== wave.n) { hc.wave = wave.n; el.wave.textContent = wave.n; }
  const rem = enemies.length + wave.queue.length;
  if (hc.rem !== rem) { hc.rem = rem; el.rem.textContent = rem > 0 ? rem + ' 敌' : ''; }
  const hp = Math.round(clamp(player.hp, 0, player.maxHp));
  if (hc.hp !== hp) {
    hc.hp = hp;
    el.hp.style.width = (player.hp / player.maxHp * 100) + '%';
    el.hpT.textContent = hp;
  }
  const sh = Math.round(player.shield);
  if (hc.sh !== sh) {
    hc.sh = sh;
    el.sh.style.width = (player.shield / 60 * 100) + '%';
    el.shT.textContent = sh;
  }
  if (hc.bomb !== bombs) { hc.bomb = bombs; el.bomb.textContent = bombs; }
  const wk = player.wType + ':' + player.weapon;
  if (hc.w !== wk) {
    hc.w = wk;
    el.w.textContent = 'I'.repeat(player.weapon);
    el.wName.textContent = WEAPONS[player.wType].name;
  }
  if (hc.combo !== combo) {
    hc.combo = combo;
    if (combo >= 2) {
      el.combo.textContent = '连击 ×' + (1 + combo * 0.05).toFixed(2);
      el.combo.style.opacity = 1;
    } else {
      el.combo.style.opacity = 0;
    }
  }
}

function switchWeapon(i) {
  if (state !== 'playing' && state !== 'paused') return;
  if (i === player.wType) return;
  player.wType = i;
  player.weapon = player.wLevels[i];
  SFX.click();
}
function cycleWeapon(d) {
  switchWeapon((player.wType + d + WEAPONS.length) % WEAPONS.length);
}

/* ================= 界面与状态 ================= */
function setState(s) {
  state = s;
  $('menuOverlay').classList.toggle('off', s !== 'menu');
  $('pauseOverlay').classList.toggle('off', s !== 'paused');
  $('overOverlay').classList.toggle('off', s !== 'over');
}

function resetGame() {
  score = 0; combo = 0; comboT = 0; bombs = 1;
  player.x = W / 2; player.y = H * 0.78;
  player.hp = player.maxHp = 100;
  player.shield = 0; player.weapon = 1; player.wType = 0; player.wLevels = [1, 1, 1, 1, 1];
  player.fireCd = 0; player.invuln = 0; player.alive = true;
  pBullets.length = 0; eBullets.length = 0; enemies.length = 0; powerups.length = 0; parts.length = 0;
  wave.queue = []; wave.boss = null;
  startWave(1);
}

function startGame() {
  SFX.ensure();
  if (SFX.ctx && SFX.ctx.state === 'suspended') SFX.ctx.resume();
  SFX.click();
  resetGame();
  setState('playing');
  Music.start();
}

function setPause(p) {
  if (state === 'playing' && p) {
    setState('paused');
    Music.stop();
    SFX.click();
  } else if (state === 'paused' && !p) {
    setState('playing');
    Music.start();
    SFX.click();
  }
}

function endGame() {
  setState('over');
  Music.stop();
  if (score > hi) {
    hi = score;
    localStorage.setItem('starstrike_best', String(hi));
    $('newRecord').classList.remove('hidden');
  } else {
    $('newRecord').classList.add('hidden');
  }
  $('finalScore').textContent = score.toLocaleString();
  $('finalBest').textContent = hi.toLocaleString();
}

const banner = $('banner');
let bannerT = null;
function showBanner(text, cls) {
  banner.textContent = text;
  banner.className = 'show' + (cls ? ' ' + cls : '');
  if (bannerT) clearTimeout(bannerT);
  bannerT = setTimeout(() => { banner.className = ''; }, 1800);
}

function updateMute() {
  const m = SFX.muted;
  $('muteBtn').setAttribute('aria-checked', String(!m));
  $('iconSound').classList.toggle('hidden', m);
  $('iconMuted').classList.toggle('hidden', !m);
}

/* ================= 按键 ================= */
function onKey(e) {
  const c = e.code;
  input.keys[c] = true;
  if (e.repeat) return;
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(c)) e.preventDefault();
  if (c === 'KeyM') {
    SFX.ensure();
    SFX.toggle();
    updateMute();
    return;
  }
  if (state === 'menu' || state === 'over') {
    if (c === 'Enter' || c === 'Space') { e.preventDefault(); startGame(); }
    return;
  }
  if (state === 'playing') {
    if (c === 'Space') useBomb();
    if (c === 'KeyP' || c === 'Escape') setPause(true);
    if (c === 'Digit1') switchWeapon(0);
    else if (c === 'Digit2') switchWeapon(1);
    else if (c === 'Digit3') switchWeapon(2);
    else if (c === 'Digit4') switchWeapon(3);
    else if (c === 'Digit5') switchWeapon(4);
    else if (c === 'KeyQ') cycleWeapon(-1);
    else if (c === 'KeyE') cycleWeapon(1);
  } else if (state === 'paused') {
    if (c === 'KeyP' || c === 'Escape' || c === 'Enter') setPause(false);
    if (c === 'KeyR') startGame();
  }
}
window.addEventListener('keydown', onKey);
window.addEventListener('keyup', e => { input.keys[e.code] = false; });
document.addEventListener('visibilitychange', () => {
  if (document.hidden && state === 'playing') setPause(true);
});
window.addEventListener('blur', () => {
  if (state === 'playing') setPause(true);
});

/* ================= 按钮绑定 ================= */
$('startBtn').addEventListener('click', startGame);
$('resumeBtn').addEventListener('click', () => setPause(false));
$('restartBtn').addEventListener('click', startGame);
$('againBtn').addEventListener('click', startGame);
$('menuBtn').addEventListener('click', () => {
  setState('menu');
  $('menuBest').textContent = hi.toLocaleString();
});
$('muteBtn').addEventListener('click', () => {
  SFX.ensure();
  SFX.toggle();
  updateMute();
});
$('bombBtn').addEventListener('pointerdown', e => {
  e.stopPropagation();
  useBomb();
});
$('wSel').addEventListener('pointerdown', e => {
  e.stopPropagation();
  cycleWeapon(1);
});

/* ================= 启动 ================= */
SFX.ensure();
updateMute();
$('menuBest').textContent = hi.toLocaleString();
$('hiScore').textContent = hi.toLocaleString();
setState('menu');
draw(); /* 首帧立即绘制，避免白屏 */

let last = performance.now();
function loop(ts) {
  const dt = Math.min(0.05, (ts - last) / 1000);
  last = ts;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
