<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no" />
<title>回声花园 · Echo Garden</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#04050c;overflow:hidden;}
  canvas{display:block;width:100vw;height:100vh;cursor:crosshair;touch-action:none;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';

/* =========================================================
   回声花园 Echo Garden
   第一届"智游杯"AI+游戏创意作品挑战赛 · 个人参赛作品
   单文件实现：Canvas 2D + WebAudio，无任何外部资源
   ========================================================= */

var W = 1600, H = 900;
var TAU = Math.PI * 2;
var FONT = '"PingFang SC","Microsoft YaHei","Hiragino Sans GB","Noto Sans SC",system-ui,sans-serif';

var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d', { alpha: false });

/* ---------------- 基础工具 ---------------- */
function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
function lerp(a, b, t) { return a + (b - a) * t; }
function easeOutBack(t) { var c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); }
function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }
function rgbStr(c, a) { return 'rgba(' + (c[0] | 0) + ',' + (c[1] | 0) + ',' + (c[2] | 0) + ',' + a + ')'; }
function hexRgb(h) { var n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function mixRgb(a, b, t) { return [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)]; }
function roundRect(c, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}

/* ---------------- 调色板 ---------------- */
var COLORS = [
  { hex: '#7CF2FF', name: '青' },
  { hex: '#B79CFF', name: '紫' },
  { hex: '#FF9BD2', name: '粉' },
  { hex: '#FFD37A', name: '金' },
  { hex: '#86FFC0', name: '绿' }
];
for (var ci = 0; ci < COLORS.length; ci++) COLORS[ci].rgb = hexRgb(COLORS[ci].hex);

/* ---------------- 花精灵（预烘焙，性能友好） ---------------- */
function bakeFlower(rgb) {
  var R = 140, size = R * 2;
  var cv = document.createElement('canvas');
  cv.width = cv.height = size;
  var g = cv.getContext('2d');
  g.translate(R, R);
  g.globalCompositeOperation = 'lighter';
  var r = rgb[0], gg = rgb[1], b = rgb[2];

  var halo = g.createRadialGradient(0, 0, 0, 0, 0, R * 0.98);
  halo.addColorStop(0, 'rgba(' + r + ',' + gg + ',' + b + ',0.40)');
  halo.addColorStop(0.26, 'rgba(' + r + ',' + gg + ',' + b + ',0.17)');
  halo.addColorStop(0.60, 'rgba(' + r + ',' + gg + ',' + b + ',0.055)');
  halo.addColorStop(1, 'rgba(' + r + ',' + gg + ',' + b + ',0)');
  g.fillStyle = halo;
  g.beginPath(); g.arc(0, 0, R * 0.98, 0, TAU); g.fill();

  var petals = 6;
  for (var i = 0; i < petals; i++) {
    g.save();
    g.rotate(i / petals * TAU);
    var pg = g.createRadialGradient(0, -46, 4, 0, -46, 52);
    pg.addColorStop(0, 'rgba(255,255,255,0.34)');
    pg.addColorStop(0.18, 'rgba(' + r + ',' + gg + ',' + b + ',0.94)');
    pg.addColorStop(0.55, 'rgba(' + r + ',' + gg + ',' + b + ',0.72)');
    pg.addColorStop(1, 'rgba(' + r + ',' + gg + ',' + b + ',0.02)');
    g.fillStyle = pg;
    g.beginPath(); g.ellipse(0, -46, 26, 46, 0, 0, TAU); g.fill();
    g.restore();
  }

  var core = g.createRadialGradient(0, 0, 0, 0, 0, 14);
  core.addColorStop(0, 'rgba(255,255,255,0.9)');
  core.addColorStop(0.45, 'rgba(' + r + ',' + gg + ',' + b + ',0.8)');
  core.addColorStop(1, 'rgba(' + r + ',' + gg + ',' + b + ',0)');
  g.fillStyle = core;
  g.beginPath(); g.arc(0, 0, 14, 0, TAU); g.fill();
  return cv;
}
var SPRITES = COLORS.map(function (c) { return bakeFlower(c.rgb); });

/* ---------------- 视口 ---------------- */
var dpr = 1;
var view = { s: 1, ox: 0, oy: 0, w: W, h: H };
function resize() {
  var w = window.innerWidth || W, h = window.innerHeight || H;
  dpr = Math.min(2, window.devicePixelRatio || 1);
  canvas.width = Math.max(1, Math.round(w * dpr));
  canvas.height = Math.max(1, Math.round(h * dpr));
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
  var s = Math.min(w / W, h / H);
  view.s = s; view.ox = (w - W * s) / 2; view.oy = (h - H * s) / 2; view.w = w; view.h = h;
}
window.addEventListener('resize', resize);

function toWorld(clientX, clientY) {
  var rect = canvas.getBoundingClientRect();
  return {
    x: (clientX - rect.left - view.ox) / view.s,
    y: (clientY - rect.top - view.oy) / view.s
  };
}

/* ---------------- 花园布局 ---------------- */
var FIELD = { x: 80, y: 186, w: 1440, h: 528 };
var COLS = 6, ROWS = 4;
var CW = FIELD.w / COLS, CH = FIELD.h / ROWS;
var NCELL = COLS * ROWS;

function cellCX(i) { return FIELD.x + ((i % COLS) + 0.5) * CW; }
function cellCY(i) { return FIELD.y + (Math.floor(i / COLS) + 0.5) * CH; }

/* ---------------- 游戏状态 ---------------- */
var state = {
  mode: 'title',          // title | play | finale
  t: 0,
  res: 0,                 // 共鸣度 0..100
  plantings: 0,
  proposals: 0,
  accepts: 0,
  rejects: 0,
  picked: 0,              // 当前选的色
  showHeat: false,
  flowers: [],
  particles: [],
  waves: [],
  proposal: null,
  nextPropAt: 2,
  propIdle: 0,
  idleUsed: 0,
  cellW: new Float32Array(NCELL),
  colorW: new Float32Array(COLORS.length),
  cellFlowers: new Int16Array(NCELL),
  conf: 0.18,             // 小回声置信度 0..1
  temp: 1.0,              // 采样温度：低=笃定，高=试探
  speech: { text: '', start: -99, until: -99 },
  tip: null,
  tut: 0, tutT: 0,
  lastX: 0, lastY: 0, lastCell: -1,
  ending: -1,
  stageName: '萌芽',
  shake: 0
};

var muted = false;

/* ---------------- 小回声的"学习模型" ---------------- */
function distOf(arr, floor) {
  var i, sum = 0;
  for (i = 0; i < arr.length; i++) sum += arr[i];
  var tot = sum + floor * arr.length;
  var out = new Array(arr.length);
  for (i = 0; i < arr.length; i++) out[i] = (arr[i] + floor) / tot;
  return out;
}
function sharpen(p, temp) {
  var t = Math.max(0.25, temp), i, sum = 0;
  var out = new Array(p.length);
  for (i = 0; i < p.length; i++) { out[i] = Math.pow(p[i], 1 / t); sum += out[i]; }
  for (i = 0; i < p.length; i++) out[i] /= sum;
  return out;
}
function sampleFrom(p) {
  var r = Math.random(), acc = 0;
  for (var i = 0; i < p.length; i++) { acc += p[i]; if (r <= acc) return i; }
  return p.length - 1;
}
function cellPrediction() { return sharpen(distOf(state.cellW, 0.55), state.temp); }
function colorPrediction() { return sharpen(distOf(state.colorW, 0.75), state.temp); }
function dominantColor() {
  var p = colorPrediction(), best = 0;
  for (var i = 1; i < p.length; i++) if (p[i] > p[best]) best = i;
  return best;
}
function decayWeights() {
  for (var i = 0; i < state.cellW.length; i++) state.cellW[i] *= 0.90;
  for (var j = 0; j < state.colorW.length; j++) state.colorW[j] *= 0.90;
}

/* ---------------- 语音/音效 ---------------- */
var actx = null;
function ensureAudio() {
  if (!actx) {
    try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { actx = null; }
  }
  if (actx && actx.state === 'suspended') { try { actx.resume(); } catch (e) {} }
}
var SCALE = [261.63, 293.66, 329.63, 392.00, 440.00];
function tone(degree, vol) {
  if (!actx || muted) return;
  var base = SCALE[degree % 5];
  var f = base * (degree >= 5 ? 2 : 1);
  var t0 = actx.currentTime;
  var o = actx.createOscillator(), o2 = actx.createOscillator();
  var g = actx.createGain(), lp = actx.createBiquadFilter();
  o.type = 'triangle'; o.frequency.value = f;
  o2.type = 'sine'; o2.frequency.value = f * 2;
  lp.type = 'lowpass'; lp.frequency.value = 2400; lp.Q.value = 0.6;
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(0.14 * vol, t0 + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + 1.7);
  o.connect(lp);
  o2.connect(lp);
  lp.connect(g);
  g.connect(actx.destination);
  o.start(t0); o2.start(t0);
  o.stop(t0 + 1.8); o2.stop(t0 + 1.8);
}

/* ---------------- 台词 ---------------- */
function say(text, dur) {
  state.speech = { text: text, start: state.t, until: state.t + (dur || 4.2) };
}

/* 小回声头上的即时提示：hit = 猜中，miss = 没猜中 */
function tip(kind, text, dur) {
  state.tip = { kind: kind, text: text, start: state.t, until: state.t + (dur || 3.2) };
}

/* ---------------- 特效 ---------------- */
function spawnParticles(x, y, colorIdx, n, power) {
  for (var i = 0; i < n; i++) {
    var a = Math.random() * TAU, sp = (30 + Math.random() * 110) * power;
    state.particles.push({
      x: x, y: y,
      vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 20,
      life: 0, max: 0.5 + Math.random() * 0.75,
      ci: colorIdx, size: 1.2 + Math.random() * 2.4
    });
  }
  if (state.particles.length > 520) state.particles.splice(0, state.particles.length - 520);
}
function spawnWave(x, y, colorIdx, max, speed) {
  state.waves.push({ x: x, y: y, r: 8, max: max || 150, ci: colorIdx, life: 0, dur: speed || 0.75 });
}

/* ---------------- 种花 ---------------- */
/* 一格最多 4 朵；同一格里的花按"座位"排开，互不重叠 */
var MAX_PER_CELL = 4;
/* 每个座位：[横向偏移, 纵向偏移, 缩小比例]（偏移量是格子的比例） */
var SLOT_LAYOUTS = [
  [[0, 0, 1.00]],
  [[-0.240, 0, 0.72], [0.240, 0, 0.72]],
  [[-0.330, 0, 0.58], [0, 0.02, 0.60], [0.330, 0, 0.58]],
  [[-0.360, -0.06, 0.50], [-0.120, 0.05, 0.50], [0.120, -0.05, 0.50], [0.360, 0.06, 0.50]]
];

function cellOf(x, y) {
  var col = clamp(Math.floor((x - FIELD.x) / CW), 0, COLS - 1);
  var row = clamp(Math.floor((y - FIELD.y) / CH), 0, ROWS - 1);
  return row * COLS + col;
}

/* 这一格满了就退到相邻最空的一格 */
function chooseCell(x, y) {
  var idx = cellOf(x, y);
  if (state.cellFlowers[idx] < MAX_PER_CELL) return idx;
  var col = idx % COLS, row = Math.floor(idx / COLS);
  var best = idx, bestN = 999;
  var dxs = [1, -1, 0, 0], dys = [0, 0, 1, -1];
  for (var d = 0; d < 4; d++) {
    var nc = col + dxs[d], nr = row + dys[d];
    if (nc < 0 || nc >= COLS || nr < 0 || nr >= ROWS) continue;
    var ni = nr * COLS + nc;
    if (state.cellFlowers[ni] < bestN) { bestN = state.cellFlowers[ni]; best = ni; }
  }
  return best;
}

/* 重新分配一格里的所有花：新的直接落座，旧的滑过去让位 */
function reflowCell(idx) {
  var list = [], i;
  for (i = 0; i < state.flowers.length; i++) {
    if (state.flowers[i].cell === idx) list.push(state.flowers[i]);
  }
  var n = list.length;
  if (!n) return;
  var lay = SLOT_LAYOUTS[Math.min(n, MAX_PER_CELL) - 1];
  for (i = 0; i < n; i++) {
    var f = list[i];
    var s = lay[Math.min(i, lay.length - 1)];
    f.tx = cellCX(idx) + s[0] * CW;
    f.ty = cellCY(idx) + s[1] * CH;
    f.tscale = s[2];
    if (!f.placed) {
      f.placed = true;
      f.x = f.tx; f.y = f.ty; f.curScale = f.tscale;
      f.x0 = f.x; f.y0 = f.y; f.s0 = f.curScale; f.mv = 1;
    } else {
      f.x0 = f.x; f.y0 = f.y; f.s0 = f.curScale; f.mv = 0;
    }
  }
}

function addFlowerTo(idx, colorIdx, isAI) {
  var f = {
    cell: idx, ci: colorIdx,
    x: 0, y: 0, tx: 0, ty: 0, x0: 0, y0: 0, mv: 1,
    placed: false, curScale: 1, s0: 1, tscale: 1,
    size: 118 + Math.random() * 48,
    rot: Math.random() * TAU,
    spin: (Math.random() < 0.5 ? -1 : 1) * (0.08 + Math.random() * 0.12),
    phase: Math.random() * TAU,
    born: state.t,
    ai: !!isAI
  };
  state.flowers.push(f);
  if (state.flowers.length > 190) {
    var dead = state.flowers.shift();
    if (dead && dead.cell != null) {
      state.cellFlowers[dead.cell] = Math.max(0, state.cellFlowers[dead.cell] - 1);
    }
  }
  state.cellFlowers[idx]++;
  reflowCell(idx);

  spawnWave(f.x, f.y, colorIdx, isAI ? 150 : 92 + Math.random() * 46, isAI ? 0.85 : 0.62);
  spawnParticles(f.x, f.y, colorIdx, isAI ? 20 : 13, isAI ? 1.4 : 1);
  tone(colorIdx + (isAI ? 5 : 0), isAI ? 0.9 : 0.65);
  state.shake = Math.min(1, state.shake + (isAI ? 0.35 : 0.18));
  return f;
}

function addRes(n) {
  state.res = clamp(state.res + n, 0, 100);
  var v = state.res;
  state.stageName = v < 34 ? '萌芽' : (v < 68 ? '生长' : '盛放');
}

function plant(x, y) {
  if (state.mode !== 'play' || state.ending >= 0) return;
  if (x < FIELD.x - 20 || x > FIELD.x + FIELD.w + 20 || y < FIELD.y - 20 || y > FIELD.y + FIELD.h + 20) return;

  var idx = chooseCell(x, y);

  decayWeights();
  state.cellW[idx] += 1;
  state.colorW[state.picked] += 1;

  var nf = addFlowerTo(idx, state.picked, false);
  state.plantings++;
  addRes(1.6);

  state.lastCell = idx;
  if (nf) { state.lastX = nf.x; state.lastY = nf.y; }
  if (state.tut === 0) state.tut = 1;

  // 学习表现：置信度随样本增加缓慢上升
  state.conf = clamp(state.conf + 0.02, 0.05, 0.97);
  state.temp = clamp(state.temp - 0.012, 0.55, 1.4);

  if (state.plantings === 1) say('第一朵。我会记住它的位置。', 4);
  else if (state.plantings === 6) say('你在往那边种……我好像看出来了。', 4.4);
  else if (state.plantings === 14) say('这片花园开始有你的样子了。', 4.2);

  if (state.plantings >= state.nextPropAt && !state.proposal) makeProposal();
}

/* ---------------- 小回声提案 ---------------- */
function makeProposal() {
  if (state.mode !== 'play' || state.ending >= 0) return;
  var pc = cellPrediction();
  var idx = sampleFrom(pc);

  // 第一题送分：就猜在你刚才那一格旁边，让人一眼看懂"它真的在学你"
  if (state.proposals === 0 && state.lastCell >= 0) {
    var lc = state.lastCell;
    var lcol = lc % COLS, lrow = Math.floor(lc / COLS);
    var cand = [lc];
    var nb = [[1, 0], [-1, 0], [0, 1], [0, -1]];
    for (var d = 0; d < 4; d++) {
      var nc = lcol + nb[d][0], nr = lrow + nb[d][1];
      if (nc >= 0 && nc < COLS && nr >= 0 && nr < ROWS) cand.push(nr * COLS + nc);
    }
    idx = cand[Math.floor(Math.random() * cand.length)];
  }

  var colorP = colorPrediction();
  var cIdx = sampleFrom(colorP);

  var x = cellCX(idx) + (Math.random() - 0.5) * CW * 0.3;
  var y = cellCY(idx) + (Math.random() - 0.5) * CH * 0.3;

  state.proposal = {
    x: x, y: y, ci: cIdx, cell: idx,
    life: 0, dur: 5.0,
    born: state.t, ph: Math.random() * TAU
  };
  state.proposals++;
  state.propIdle = 0;
  state.nextPropAt = state.plantings + 3;
  tip('ask', '我猜这里？', 2.8);
  if (state.tut < 2) state.tut = 2;
}

function acceptProposal() {
  var p = state.proposal;
  state.proposal = null;
  decayWeights();
  state.cellW[p.cell] += 2.4;
  state.colorW[p.ci] += 2.2;
  addFlowerTo(chooseCell(p.x, p.y), p.ci, true);
  state.accepts++;
  state.conf = clamp(state.conf + 0.13, 0.05, 0.99);
  if (state.tut === 2) { state.tut = 3; state.tutT = state.t; }
  state.temp = clamp(state.temp - 0.09, 0.45, 1.4);
  addRes(12);
  state.shake = 1;
  var hits = ['猜中了  ＋12', '就是这里  ＋12', '嗯，你的心意  ＋12', '记住这一格  ＋12'];
  tip('hit', hits[Math.floor(Math.random() * hits.length)]);
}

function rejectProposal(silent) {
  var p = state.proposal;
  if (!p) return;
  state.proposal = null;
  state.rejects++;
  state.conf = clamp(state.conf - 0.10, 0.05, 0.99);
  state.temp = clamp(state.temp + 0.13, 0.45, 1.5);
  addRes(-2);
  spawnParticles(p.x, p.y, p.ci, 7, 0.5);
  if (!silent) {
    var miss = ['猜偏了  －2', '那……再想想  －2', '不是这里  －2', '记下了：不是这儿  －2'];
    tip('miss', miss[Math.floor(Math.random() * miss.length)]);
  }
}

/* ---------------- 开场 / 重开 ---------------- */
function restart(withIntro) {
  state.res = 0;
  state.plantings = 0;
  state.proposals = 0;
  state.accepts = 0;
  state.rejects = 0;
  state.flowers.length = 0;
  state.particles.length = 0;
  state.waves.length = 0;
  state.proposal = null;
  state.cellW.fill(0);
  state.colorW.fill(0);
  state.cellFlowers.fill(0);
  state.conf = 0.18;
  state.temp = 1.0;
  state.nextPropAt = 2;
  state.propIdle = 0;
  state.idleUsed = 0;
  state.ending = -1;
  state.shake = 0;
  state.picked = 0;
  state.stageName = '萌芽';
  state.tip = null;
  state.tut = 0;
  state.tutT = 0;
  state.lastCell = -1;
  state.mode = 'play';
  if (withIntro) say('我在学你。你种下的每一朵，我都会记住。', 5);
  else say('再来一次。这次我会更早认出你。', 4);
}

/* ---------------- 输入 ---------------- */
function onDown(e) {
  ensureAudio();
  var p = toWorld(e.clientX, e.clientY);
  state.audioReady = true;

  if (state.mode === 'title') { restart(true); return; }

  if (state.mode === 'finale') {
    if (p.x > 688 && p.x < 912 && p.y > 550 && p.y < 608) restart(false);
    return;
  }

  // 色盘
  for (var i = 0; i < COLORS.length; i++) {
    var sx = 100 + i * 38, sy = 872;
    if ((p.x - sx) * (p.x - sx) + (p.y - sy) * (p.y - sy) < 20 * 20) {
      state.picked = i;
      tone(i, 0.3);
      return;
    }
  }

  if (state.ending >= 0) return;

  // 接受提案
  if (state.proposal) {
    var dx = p.x - state.proposal.x, dy = p.y - state.proposal.y;
    if (dx * dx + dy * dy < 58 * 58) { acceptProposal(); return; }
  }

  plant(p.x, p.y);
}

window.addEventListener('pointerdown', function (e) {
  if (e.button !== undefined && e.button !== 0) return;
  onDown(e);
}, { passive: true });

window.addEventListener('keydown', function (e) {
  var k = e.key;
  if (k === 'Tab') { e.preventDefault(); state.showHeat = !state.showHeat; ensureAudio(); return; }
  if (k >= '1' && k <= '5') { state.picked = parseInt(k, 10) - 1; ensureAudio(); tone(state.picked, 0.35); return; }
  if (k === 'm' || k === 'M') { muted = !muted; return; }
  if (k === 'r' || k === 'R') { restart(false); return; }
  if (k === ' ' || k === 'Enter') {
    if (state.mode === 'title') { restart(true); e.preventDefault(); }
    else if (state.mode === 'finale') { restart(false); e.preventDefault(); }
  }
});

/* ---------------- 背景装饰数据 ---------------- */
var stars = [];
for (var si = 0; si < 110; si++) {
  stars.push({ x: Math.random() * W, y: Math.random() * 720, r: Math.random() * 1.5 + 0.4, ph: Math.random() * TAU, sp: 0.5 + Math.random() });
}
var rain = [];
for (var ri = 0; ri < 110; ri++) {
  rain.push({ x: Math.random() * (W + 200) - 100, y: Math.random() * H, len: 14 + Math.random() * 26, sp: 260 + Math.random() * 320, a: 0.03 + Math.random() * 0.07 });
}
var buildings = [];
(function () {
  var x = -40;
  while (x < W + 40) {
    var w = 42 + Math.random() * 78;
    var h = 70 + Math.random() * 150;
    var wins = [];
    for (var wy = 0; wy < Math.floor(h / 22); wy++) {
      for (var wx = 0; wx < Math.floor((w - 12) / 16); wx++) {
        if (Math.random() < 0.42) wins.push({ x: 8 + wx * 16, y: 12 + wy * 22, c: Math.floor(Math.random() * COLORS.length) });
      }
    }
    buildings.push({ x: x, w: w, h: h, wins: wins });
    x += w + 6 + Math.random() * 22;
  }
})();

/* ---------------- 更新 ---------------- */
function update(dt) {
  state.t += dt;
  var t = state.t;

  // 提案计时
  if (state.mode === 'play' && state.proposal) {
    state.proposal.life += dt;
    if (state.proposal.life > state.proposal.dur) rejectProposal(false);
  }

  // 空场太久就主动猜一次，别让玩家干等（每次播种最多自动猜一次，防止挂机时刷屏）
  if (state.mode === 'play' && state.ending < 0 && !state.proposal && state.plantings >= 2 && state.idleUsed < Math.min(state.plantings, 2)) {
    state.propIdle += dt;
    if (state.propIdle > 2.6) { state.propIdle = 0; state.idleUsed++; makeProposal(); }
  } else {
    state.propIdle = 0;
  }

  // 新手引导收尾
  if (state.tut === 3 && state.t - state.tutT > 3.8) state.tut = 4;

  // 同格让位动画
  for (var fi = 0; fi < state.flowers.length; fi++) {
    var fw = state.flowers[fi];
    if (fw.mv < 1) {
      fw.mv = Math.min(1, fw.mv + dt / 0.42);
      var me = easeOutCubic(fw.mv);
      fw.x = lerp(fw.x0, fw.tx, me);
      fw.y = lerp(fw.y0, fw.ty, me);
      fw.curScale = lerp(fw.s0, fw.tscale, me);
    }
  }

  // 粒子
  for (var i = state.particles.length - 1; i >= 0; i--) {
    var p = state.particles[i];
    p.life += dt;
    if (p.life >= p.max) { state.particles.splice(i, 1); continue; }
    p.vy += 26 * dt;
    p.vx *= 0.985;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
  }

  // 冲击波
  for (var w = state.waves.length - 1; w >= 0; w--) {
    var wv = state.waves[w];
    wv.life += dt;
    if (wv.life >= wv.dur) { state.waves.splice(w, 1); continue; }
    wv.r = 8 + (wv.max - 8) * easeOutCubic(wv.life / wv.dur);
  }

  // 雨
  for (var r = 0; r < rain.length; r++) {
    var d = rain[r];
    d.y += d.sp * dt;
    d.x -= d.sp * 0.16 * dt;
    if (d.y > H + 30) { d.y = -30; d.x = Math.random() * (W + 200) - 60; }
  }

  // 屏幕轻微震动衰减
  state.shake = Math.max(0, state.shake - dt * 2.6);

  // 结局推进
  if (state.mode === 'play' && state.res >= 100 && state.ending < 0) {
    state.ending = 0;
    state.shake = 1;
    for (var fl = 0; fl < state.flowers.length; fl++) {
      var f = state.flowers[fl];
      spawnWave(f.x, f.y, f.ci, 200 + Math.random() * 180, 1.1);
    }
    say('你把我教会的，全种下来了。', 6);
    tone(0, 1); tone(2, 0.8); tone(4, 0.6);
  }
  if (state.ending >= 0 && state.mode === 'play') {
    state.ending += dt;
    if (state.ending > 2.0) { state.mode = 'finale'; state.ending = 2.0; }
  }
}

/* ---------------- 绘制：背景 ---------------- */
var SKY_TOP_A = hexRgb('#070a1c'), SKY_TOP_B = hexRgb('#150f33');
var SKY_MID_A = hexRgb('#0a1026'), SKY_MID_B = hexRgb('#1a1038');
var SKY_BOT_A = hexRgb('#04060f'), SKY_BOT_B = hexRgb('#0a0b20');

function drawBackground(k) {
  var g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, rgbStr(mixRgb(SKY_TOP_A, SKY_TOP_B, k), 1));
  g.addColorStop(0.55, rgbStr(mixRgb(SKY_MID_A, SKY_MID_B, k), 1));
  g.addColorStop(1, rgbStr(mixRgb(SKY_BOT_A, SKY_BOT_B, k), 1));
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  var t = state.t;
  var blobs = [
    { x: W * 0.18 + Math.sin(t * 0.07) * 60, y: H * 0.28 + Math.cos(t * 0.05) * 40, r: 540, c: [70, 120, 255], a: 0.10 },
    { x: W * 0.84 + Math.cos(t * 0.06) * 70, y: H * 0.24 + Math.sin(t * 0.08) * 44, r: 480, c: [150, 90, 255], a: 0.09 },
    { x: W * 0.50 + Math.sin(t * 0.04) * 90, y: H * 0.90, r: 660, c: [30, 170, 210], a: 0.07 }
  ];
  ctx.globalCompositeOperation = 'lighter';
  for (var i = 0; i < blobs.length; i++) {
    var b = blobs[i];
    var rg = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.r);
    rg.addColorStop(0, rgbStr(b.c, b.a * (0.6 + 1.1 * k)));
    rg.addColorStop(1, rgbStr(b.c, 0));
    ctx.fillStyle = rg;
    ctx.fillRect(b.x - b.r, b.y - b.r, b.r * 2, b.r * 2);
  }
  ctx.globalCompositeOperation = 'source-over';

  // 星点
  for (var s = 0; s < stars.length; s++) {
    var st = stars[s];
    var tw = 0.28 + 0.28 * Math.sin(t * st.sp + st.ph);
    ctx.fillStyle = 'rgba(190,225,255,' + (tw * (0.5 + 0.5 * k)).toFixed(3) + ')';
    ctx.beginPath();
    ctx.arc(st.x, st.y, st.r, 0, TAU);
    ctx.fill();
  }
}

function drawSkyline(k) {
  ctx.save();
  var baseY = 742;
  ctx.globalAlpha = 0.55;
  for (var i = 0; i < buildings.length; i++) {
    var b = buildings[i];
    ctx.fillStyle = 'rgba(6,9,24,0.92)';
    ctx.fillRect(b.x, baseY - b.h, b.w, b.h + 60);
    for (var w = 0; w < b.wins.length; w++) {
      var wn = b.wins[w];
      var lit = 0.06 + 0.55 * k;
      ctx.fillStyle = rgbStr(COLORS[wn.c].rgb, lit * (0.55 + 0.45 * Math.sin(state.t * 1.2 + wn.x + b.x)));
      ctx.fillRect(b.x + wn.x, baseY - b.h + wn.y, 4, 6);
    }
  }
  ctx.restore();
}

function drawRain() {
  ctx.save();
  ctx.strokeStyle = 'rgba(170,210,255,0.10)';
  ctx.lineWidth = 1;
  for (var i = 0; i < rain.length; i++) {
    var d = rain[i];
    ctx.globalAlpha = d.a;
    ctx.beginPath();
    ctx.moveTo(d.x, d.y);
    ctx.lineTo(d.x + d.len * 0.16, d.y + d.len);
    ctx.stroke();
  }
  ctx.restore();
}

/* ---------------- 绘制：花园 ---------------- */
function drawFieldFrame() {
  ctx.save();

  // 园地底色：一点夜色里的水光
  var wash = ctx.createLinearGradient(0, FIELD.y, 0, FIELD.y + FIELD.h);
  wash.addColorStop(0, 'rgba(96,150,230,0.055)');
  wash.addColorStop(0.55, 'rgba(70,120,200,0.028)');
  wash.addColorStop(1, 'rgba(40,90,170,0.065)');
  roundRect(ctx, FIELD.x, FIELD.y, FIELD.w, FIELD.h, 18);
  ctx.fillStyle = wash;
  ctx.fill();

  ctx.globalAlpha = 0.9;
  roundRect(ctx, FIELD.x, FIELD.y, FIELD.w, FIELD.h, 18);
  ctx.strokeStyle = 'rgba(130,195,255,0.10)';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  // 四角括号
  var L = 26, c = 'rgba(124,242,255,0.30)';
  ctx.strokeStyle = c;
  ctx.lineWidth = 2;
  var pts = [
    [FIELD.x, FIELD.y, 1, 1], [FIELD.x + FIELD.w, FIELD.y, -1, 1],
    [FIELD.x, FIELD.y + FIELD.h, 1, -1], [FIELD.x + FIELD.w, FIELD.y + FIELD.h, -1, -1]
  ];
  for (var i = 0; i < pts.length; i++) {
    var p = pts[i];
    ctx.beginPath();
    ctx.moveTo(p[0] + p[2] * L, p[1]);
    ctx.lineTo(p[0], p[1]);
    ctx.lineTo(p[0], p[1] + p[3] * L);
    ctx.stroke();
  }
  ctx.restore();
}

function drawGrid() {
  ctx.save();
  ctx.strokeStyle = 'rgba(140,200,255,0.055)';
  ctx.lineWidth = 1;
  for (var c = 1; c < COLS; c++) {
    ctx.beginPath();
    ctx.moveTo(FIELD.x + c * CW, FIELD.y + 8);
    ctx.lineTo(FIELD.x + c * CW, FIELD.y + FIELD.h - 8);
    ctx.stroke();
  }
  for (var r = 1; r < ROWS; r++) {
    ctx.beginPath();
    ctx.moveTo(FIELD.x + 8, FIELD.y + r * CH);
    ctx.lineTo(FIELD.x + FIELD.w - 8, FIELD.y + r * CH);
    ctx.stroke();
  }
  ctx.restore();
}

function drawHeat() {
  var p = cellPrediction();
  var pmax = 0, bi = 0, i;
  for (i = 0; i < NCELL; i++) { if (p[i] > pmax) { pmax = p[i]; bi = i; } }
  var on = state.showHeat;
  var rgb = [124, 242, 255];

  // 开启时先压暗一层，热区才跳得出来
  if (on) {
    ctx.save();
    roundRect(ctx, FIELD.x + 2, FIELD.y + 2, FIELD.w - 4, FIELD.h - 4, 16);
    ctx.fillStyle = 'rgba(3,6,16,0.62)';
    ctx.fill();
    ctx.restore();
  }

  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (i = 0; i < NCELL; i++) {
    var rel = pmax > 0 ? p[i] / pmax : 0;
    var a = on ? Math.pow(rel, 0.7) * 0.62 : p[i] * 0.05;
    if (a < 0.004) continue;
    var x = FIELD.x + (i % COLS) * CW + 4;
    var y = FIELD.y + Math.floor(i / COLS) * CH + 4;
    roundRect(ctx, x, y, CW - 8, CH - 8, 10);
    var g = ctx.createRadialGradient(x + CW / 2 - 4, y + CH / 2 - 4, 6, x + CW / 2 - 4, y + CH / 2 - 4, CW * 0.66);
    g.addColorStop(0, rgbStr(rgb, a));
    g.addColorStop(0.62, rgbStr(rgb, a * 0.6));
    g.addColorStop(1, rgbStr(rgb, a * 0.12));
    ctx.fillStyle = g;
    ctx.fill();
  }
  ctx.restore();

  if (!on) return;

  ctx.save();
  // 每格描边 + 百分比
  for (i = 0; i < NCELL; i++) {
    var rel2 = pmax > 0 ? p[i] / pmax : 0;
    if (rel2 < 0.10) continue;
    var bx = FIELD.x + (i % COLS) * CW + 4;
    var by = FIELD.y + Math.floor(i / COLS) * CH + 4;
    roundRect(ctx, bx, by, CW - 8, CH - 8, 10);
    ctx.strokeStyle = 'rgba(124,242,255,' + (0.10 + 0.4 * rel2).toFixed(3) + ')';
    ctx.lineWidth = 1;
    ctx.stroke();
    if (rel2 > 0.45) {
      var lab = (i === bi ? '最想押这里 ' : '') + Math.round(p[i] * 100) + '%';
      ctx.font = '700 13px ' + FONT;
      var lw = ctx.measureText(lab).width;
      roundRect(ctx, bx + 8, by + 8, lw + 16, 23, 11.5);
      ctx.fillStyle = i === bi ? 'rgba(8,62,86,0.9)' : 'rgba(6,20,40,0.66)';
      ctx.fill();
      ctx.fillStyle = i === bi ? 'rgba(205,252,255,1)' : 'rgba(200,238,255,' + (0.5 + 0.45 * rel2).toFixed(3) + ')';
      ctx.textAlign = 'left';
      ctx.fillText(lab, bx + 16, by + 24);
    }
  }

  // 最可能的一格：流动虚线
  var tx = FIELD.x + (bi % COLS) * CW + 4;
  var ty = FIELD.y + Math.floor(bi / COLS) * CH + 4;
  ctx.strokeStyle = 'rgba(190,255,255,0.92)';
  ctx.lineWidth = 2;
  ctx.setLineDash([7, 8]);
  ctx.lineDashOffset = -state.t * 22;
  roundRect(ctx, tx, ty, CW - 8, CH - 8, 10);
  ctx.stroke();
  ctx.setLineDash([]);

  ctx.textAlign = 'left';
  ctx.font = '600 15px ' + FONT;
  ctx.fillStyle = 'rgba(175,232,255,0.95)';
  ctx.fillText('小回声的推测：亮的地方它最想押注　·　Tab 关闭', FIELD.x + 4, FIELD.y - 14);
  ctx.restore();
}

function drawFlowers() {
  var t = state.t;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (var i = 0; i < state.flowers.length; i++) {
    var f = state.flowers[i];
    var g = clamp((t - f.born) / 0.55, 0, 1);
    if (g <= 0) continue;
    var sc = easeOutBack(g);
    var breathe = 1 + 0.035 * Math.sin(t * 1.7 + f.phase);
    if (state.ending >= 0) breathe *= 1 + 0.10 * Math.sin(t * 2.6 + i * 0.5);
    var d = f.size * (f.curScale || 1) * sc * breathe;
    if (d < 2) continue;
    ctx.save();
    ctx.translate(f.x, f.y);
    ctx.rotate(f.rot + f.spin * t);
    ctx.globalAlpha = 0.8 * clamp(g * 1.4, 0, 1) * (f.ai ? 1 : 0.95);
    ctx.drawImage(SPRITES[f.ci], -d / 2, -d / 2, d, d);
    ctx.restore();
  }
  ctx.restore();
}

function drawProposal() {
  var p = state.proposal;
  if (!p) return;
  var t = state.t;
  var left = clamp(1 - p.life / p.dur, 0, 1);
  var pulse = 0.72 + 0.28 * Math.sin(t * 5 + p.ph);
  var rgb = COLORS[p.ci].rgb;

  ctx.save();
  ctx.translate(p.x, p.y);

  // 光晕
  ctx.globalCompositeOperation = 'lighter';
  var g = ctx.createRadialGradient(0, 0, 0, 0, 0, 92);
  g.addColorStop(0, rgbStr(rgb, 0.16 * pulse));
  g.addColorStop(1, rgbStr(rgb, 0));
  ctx.fillStyle = g;
  ctx.fillRect(-92, -92, 184, 184);

  // 预测花的残影
  var d = 104 * (0.92 + 0.08 * Math.sin(t * 3));
  ctx.globalAlpha = 0.30 * pulse;
  ctx.rotate(t * 0.5);
  ctx.drawImage(SPRITES[p.ci], -d / 2, -d / 2, d, d);
  ctx.rotate(-t * 0.5);

  // 虚线环
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 0.55 + 0.35 * pulse;
  ctx.strokeStyle = rgbStr(rgb, 0.9);
  ctx.lineWidth = 2;
  ctx.setLineDash([7, 9]);
  ctx.lineDashOffset = -t * 26;
  ctx.beginPath();
  ctx.arc(0, 0, 56, 0, TAU);
  ctx.stroke();
  ctx.setLineDash([]);

  // 剩余时间弧
  ctx.globalAlpha = 0.7;
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.arc(0, 0, 64, -Math.PI / 2, -Math.PI / 2 + TAU * left);
  ctx.stroke();

  // 问号
  ctx.globalAlpha = 0.55 + 0.45 * pulse;
  ctx.fillStyle = '#ffffff';
  ctx.font = '700 26px ' + FONT;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('?', 0, -1);
  ctx.restore();

  ctx.textBaseline = 'alphabetic';
  ctx.textAlign = 'left';
}

function drawFx() {
  var t = state.t;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';

  for (var i = 0; i < state.waves.length; i++) {
    var w = state.waves[i];
    var k = w.life / w.dur;
    var a = (1 - k) * (1 - k) * 0.42;
    // 外圈柔光 + 内圈细线，避免看起来像调试用的圆
    ctx.strokeStyle = rgbStr(COLORS[w.ci].rgb, a * 0.30);
    ctx.lineWidth = 7 * (1 - k) + 2.5;
    ctx.beginPath();
    ctx.arc(w.x, w.y, w.r, 0, TAU);
    ctx.stroke();
    ctx.strokeStyle = rgbStr(COLORS[w.ci].rgb, a * 0.85);
    ctx.lineWidth = 1.1;
    ctx.beginPath();
    ctx.arc(w.x, w.y, w.r, 0, TAU);
    ctx.stroke();
  }

  for (var p = 0; p < state.particles.length; p++) {
    var pt = state.particles[p];
    var kk = pt.life / pt.max;
    var aa = (1 - kk) * 0.85;
    var rgb = COLORS[pt.ci].rgb;
    ctx.fillStyle = rgbStr(rgb, aa);
    ctx.beginPath();
    ctx.arc(pt.x, pt.y, pt.size * (1 - kk * 0.55), 0, TAU);
    ctx.fill();
  }
  ctx.restore();
}

function drawVignette() {
  var g = ctx.createRadialGradient(W / 2, H / 2, H * 0.28, W / 2, H / 2, H * 0.95);
  g.addColorStop(0, 'rgba(0,0,0,0)');
  g.addColorStop(1, 'rgba(0,0,0,0.62)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
}

function drawTip() {
  var tp = state.tip;
  if (!tp) return;
  var t = state.t;
  if (t > tp.until) { state.tip = null; return; }
  var a = Math.min(1, (t - tp.start) / 0.18) * Math.min(1, (tp.until - t) / 0.5);
  a = clamp(a, 0, 1);
  if (a <= 0.01) return;

  var kind = tp.kind;
  var accent = kind === 'hit' ? [124, 242, 255] : (kind === 'miss' ? [255, 186, 107] : [188, 166, 255]);
  var fill = kind === 'hit' ? 'rgba(12,54,82,0.94)' : (kind === 'miss' ? 'rgba(62,42,18,0.94)' : 'rgba(34,26,72,0.94)');

  ctx.save();
  ctx.globalAlpha = a;
  ctx.font = '600 16px ' + FONT;
  var tw = ctx.measureText(tp.text).width;
  var padL = 34, padR = 16, h = 38;
  var w = Math.min(340, Math.max(130, tw + padL + padR));
  var x = 1520 - w;
  var y = 112 - (1 - a) * 7;

  // 指向小球的连接线
  ctx.strokeStyle = rgbStr(accent, 0.45);
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(1504, y + 1);
  ctx.lineTo(1504, y - 9);
  ctx.stroke();

  roundRect(ctx, x, y, w, h, 11);
  ctx.fillStyle = fill;
  ctx.fill();
  ctx.strokeStyle = rgbStr(accent, 0.5);
  ctx.lineWidth = 1.2;
  ctx.stroke();

  // 状态点（猜中=青，猜偏=琥珀，思考=紫）
  ctx.globalCompositeOperation = 'lighter';
  var g = ctx.createRadialGradient(x + 19, y + h / 2, 0, x + 19, y + h / 2, 15);
  g.addColorStop(0, rgbStr(accent, 0.9));
  g.addColorStop(1, rgbStr(accent, 0));
  ctx.fillStyle = g;
  ctx.fillRect(x + 4, y + h / 2 - 15, 30, 30);
  ctx.globalCompositeOperation = 'source-over';
  ctx.beginPath();
  ctx.arc(x + 19, y + h / 2, 4, 0, TAU);
  ctx.fillStyle = rgbStr(accent, 1);
  ctx.fill();

  ctx.fillStyle = 'rgba(240,250,255,0.96)';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  ctx.fillText(tp.text, x + padL, y + h / 2 + 1);
  ctx.restore();

  ctx.textBaseline = 'alphabetic';
  ctx.textAlign = 'left';
}

/* ---------------- 新手引导 ---------------- */
function tutLabel(text, x, yBottom, accent) {
  ctx.save();
  ctx.font = '700 17px ' + FONT;
  var w = ctx.measureText(text).width + 32;
  var h = 38;
  var bx = clamp(x - w / 2, FIELD.x + 6, FIELD.x + FIELD.w - w - 6);
  var by = clamp(yBottom - h, FIELD.y + 6, FIELD.y + FIELD.h - h - 6);
  roundRect(ctx, bx, by, w, h, 19);
  ctx.fillStyle = 'rgba(6,14,28,0.88)';
  ctx.fill();
  ctx.strokeStyle = rgbStr(accent, 0.75);
  ctx.lineWidth = 1.6;
  ctx.stroke();
  ctx.fillStyle = 'rgba(236,248,255,0.98)';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, bx + w / 2, by + h / 2 + 1);
  ctx.restore();
  ctx.textBaseline = 'alphabetic';
  ctx.textAlign = 'left';
}

function tutArrow(x1, y1, x2, y2, accent) {
  ctx.save();
  ctx.strokeStyle = rgbStr(accent, 0.8);
  ctx.lineWidth = 2.6;
  ctx.setLineDash([11, 9]);
  ctx.lineDashOffset = -state.t * 42;
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x2, y2);
  ctx.stroke();
  ctx.setLineDash([]);
  var ang = Math.atan2(y2 - y1, x2 - x1);
  ctx.fillStyle = rgbStr(accent, 0.95);
  ctx.beginPath();
  ctx.moveTo(x2, y2);
  ctx.lineTo(x2 - 17 * Math.cos(ang - 0.42), y2 - 17 * Math.sin(ang - 0.42));
  ctx.lineTo(x2 - 17 * Math.cos(ang + 0.42), y2 - 17 * Math.sin(ang + 0.42));
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function drawTutorial() {
  if (state.mode !== 'play' || state.tut < 1 || state.tut > 3) return;
  var t = state.t;

  if (state.tut === 1) {
    tutLabel('再种一朵，它就开始猜了', state.lastX || W / 2, (state.lastY || 400) - 58, [124, 242, 255]);
    return;
  }

  if (state.tut === 2 && state.proposal) {
    var p = state.proposal;
    var pulse = 0.5 + 0.45 * Math.sin(t * 5);
    ctx.save();
    ctx.strokeStyle = 'rgba(198,178,255,' + pulse.toFixed(2) + ')';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(p.x, p.y, 74 + 5 * Math.sin(t * 4), 0, TAU);
    ctx.stroke();
    ctx.restore();
    tutArrow(1470, 100, p.x + 8, p.y - 84, [198, 178, 255]);
    tutLabel('它猜你下一朵种这儿 —— 点它试试', p.x, p.y - 78, [198, 178, 255]);
    return;
  }

  if (state.tut === 3) {
    tutLabel('猜中 ＋12！把共鸣度种到 100% 就通关', state.lastX || W / 2, (state.lastY || 400) - 58, [124, 242, 255]);
  }
}

function drawHUD() {
  var t = state.t;
  var bx = 80, by = 754, bw = 620, bh = 12;

  ctx.font = '600 13px ' + FONT;
  ctx.fillStyle = 'rgba(160,200,240,0.62)';
  ctx.textAlign = 'left';
  ctx.fillText('共鸣度', bx, by - 8);

  // 轨道
  roundRect(ctx, bx, by, bw, bh, bh / 2);
  ctx.fillStyle = 'rgba(255,255,255,0.07)';
  ctx.fill();

  // 进度
  var k = state.res / 100;
  if (k > 0.002) {
    ctx.save();
    roundRect(ctx, bx, by, bw, bh, bh / 2);
    ctx.clip();
    var g = ctx.createLinearGradient(bx, 0, bx + bw, 0);
    g.addColorStop(0, '#7CF2FF');
    g.addColorStop(0.55, '#B79CFF');
    g.addColorStop(1, '#FFD37A');
    ctx.fillStyle = g;
    ctx.fillRect(bx, by, bw * k, bh);
    // 高光
    ctx.globalCompositeOperation = 'lighter';
    var pulse = 0.25 + 0.25 * Math.sin(t * 3);
    ctx.fillStyle = 'rgba(255,255,255,' + (0.10 + 0.14 * pulse) + ')';
    ctx.fillRect(bx, by, bw * k, bh * 0.45);
    ctx.restore();
  }

  // 进度头
  if (k > 0.01) {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    var hx = bx + bw * k;
    var rg = ctx.createRadialGradient(hx, by + bh / 2, 0, hx, by + bh / 2, 26);
    rg.addColorStop(0, 'rgba(255,255,255,0.55)');
    rg.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = rg;
    ctx.fillRect(hx - 26, by + bh / 2 - 26, 52, 52);
    ctx.restore();
  }

  ctx.font = '700 17px ' + FONT;
  ctx.fillStyle = 'rgba(230,245,255,0.92)';
  ctx.fillText(Math.round(state.res) + '%', bx + bw + 16, by + 12);
  ctx.font = '400 13px ' + FONT;
  ctx.fillStyle = 'rgba(160,200,240,0.55)';
  ctx.fillText('· ' + state.stageName, bx + bw + 16 + 46, by + 12);

  // 统计
  ctx.textAlign = 'right';
  ctx.font = '400 14px ' + FONT;
  ctx.fillStyle = 'rgba(175,210,245,0.6)';
  ctx.fillText('播种 ' + state.plantings + '   ·   提案 ' + state.proposals + '   ·   共鸣 ' + state.accepts, 1520, by + 12);

  // 台词
  var sp = state.speech;
  if (sp && t < sp.until && sp.text) {
    var a = Math.min(1, (t - sp.start) / 0.35) * Math.min(1, (sp.until - t) / 0.8);
    a = clamp(a, 0, 1);
    var label = '小回声：';
    ctx.font = '600 14px ' + FONT;
    var lw = ctx.measureText(label).width;
    ctx.font = '400 20px ' + FONT;
    var tw = ctx.measureText(sp.text).width;
    var total = lw + tw;
    var sx = (W - total) / 2;
    ctx.textAlign = 'left';
    ctx.globalAlpha = a * 0.6;
    ctx.fillStyle = 'rgba(150,200,245,1)';
    ctx.font = '600 14px ' + FONT;
    ctx.fillText(label, sx, 812);
    ctx.globalAlpha = a;
    ctx.fillStyle = 'rgba(232,244,255,1)';
    ctx.font = '400 20px ' + FONT;
    ctx.fillText(sp.text, sx + lw, 812);
    ctx.globalAlpha = 1;
  }

  // 色盘
  ctx.textAlign = 'left';
  for (var i = 0; i < COLORS.length; i++) {
    var sx2 = 100 + i * 38, sy = 872, sel = state.picked === i;
    var rgb = COLORS[i].rgb;
    ctx.save();
    if (sel) {
      ctx.globalCompositeOperation = 'lighter';
      var gg = ctx.createRadialGradient(sx2, sy, 0, sx2, sy, 26);
      gg.addColorStop(0, rgbStr(rgb, 0.55));
      gg.addColorStop(1, rgbStr(rgb, 0));
      ctx.fillStyle = gg;
      ctx.fillRect(sx2 - 26, sy - 26, 52, 52);
      ctx.globalCompositeOperation = 'source-over';
    }
    ctx.beginPath();
    ctx.arc(sx2, sy, sel ? 12 : 9.5, 0, TAU);
    ctx.fillStyle = rgbStr(rgb, sel ? 1 : 0.55);
    ctx.fill();
    ctx.strokeStyle = sel ? 'rgba(255,255,255,0.95)' : 'rgba(255,255,255,0.18)';
    ctx.lineWidth = 1.6;
    ctx.stroke();
    if (sel) {
      ctx.fillStyle = 'rgba(4,8,20,0.85)';
      ctx.font = '700 11px ' + FONT;
      ctx.textAlign = 'center';
      ctx.fillText(String(i + 1), sx2, sy + 4);
      ctx.textAlign = 'left';
    }
    ctx.restore();
  }

  // 操作提示
  ctx.textAlign = 'right';
  ctx.font = '400 13px ' + FONT;
  ctx.fillStyle = 'rgba(150,190,235,0.42)';
  ctx.fillText('点击花园播种 · 1-5 换色 · Tab 看小回声的想法 · M 静音 · R 重开', 1520, 876);
  ctx.textAlign = 'left';

  // 首次引导
  if (state.plantings === 0) {
    var cxp = FIELD.x + FIELD.w / 2, cyp = FIELD.y + FIELD.h / 2;
    var pr = 46 + 8 * Math.sin(t * 2.4);
    ctx.save();
    ctx.strokeStyle = 'rgba(200,235,255,0.35)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(cxp, cyp, pr, 0, TAU);
    ctx.stroke();
    ctx.fillStyle = 'rgba(210,235,255,0.6)';
    ctx.font = '400 17px ' + FONT;
    ctx.textAlign = 'center';
    ctx.fillText('点这里，种下第一朵光', cxp, cyp + 4);
    ctx.restore();
    ctx.textAlign = 'left';
  }
}

/* ---------------- 绘制：标题 / 结局 ---------------- */
function drawTitle() {
  var t = state.t;
  ctx.save();
  ctx.fillStyle = 'rgba(4,6,16,0.55)';
  ctx.fillRect(0, 0, W, H);

  var cx = W / 2, cy = 400;

  // 光核
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  var g = ctx.createRadialGradient(cx, cy - 40, 0, cx, cy - 40, 420);
  g.addColorStop(0, 'rgba(124,242,255,' + (0.14 + 0.04 * Math.sin(t * 1.2)) + ')');
  g.addColorStop(0.5, 'rgba(150,110,255,0.07)');
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g;
  ctx.fillRect(cx - 420, cy - 460, 840, 840);
  ctx.restore();

  ctx.textAlign = 'center';

  ctx.font = '700 104px ' + FONT;
  var tg = ctx.createLinearGradient(0, cy - 150, 0, cy - 30);
  tg.addColorStop(0, '#ffffff');
  tg.addColorStop(1, '#8fe3ff');
  ctx.fillStyle = tg;
  ctx.fillText('回声花园', cx, cy - 40);

  ctx.font = '600 16px ' + FONT;
  ctx.fillStyle = 'rgba(150,205,255,0.55)';
  ctx.fillText('E C H O   G A R D E N', cx, cy + 2);

  ctx.font = '400 21px ' + FONT;
  ctx.fillStyle = 'rgba(215,232,250,0.82)';
  ctx.fillText('一座下雨的花园，和一个正在学你的小东西。', cx, cy + 62);

  ctx.font = '400 17px ' + FONT;
  ctx.fillStyle = 'rgba(180,212,245,0.78)';
  ctx.fillText('点花园种花 → 它偷偷记下你在哪儿种 → 每两三朵就猜你下一朵种哪儿', cx, cy + 102);
  ctx.fillText('点中它的猜测 ＋12，不理它 －2；把共鸣度种到 100% 就通关', cx, cy + 132);

  // 开始按钮
  var pulse = 0.6 + 0.4 * Math.sin(t * 2.2);
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  var bg = ctx.createRadialGradient(cx, cy + 214, 0, cx, cy + 214, 170);
  bg.addColorStop(0, 'rgba(124,242,255,' + (0.10 + 0.07 * pulse) + ')');
  bg.addColorStop(1, 'rgba(124,242,255,0)');
  ctx.fillStyle = bg;
  ctx.fillRect(cx - 170, cy + 44, 340, 340);
  ctx.restore();

  roundRect(ctx, cx - 132, cy + 186, 264, 56, 28);
  ctx.fillStyle = 'rgba(124,242,255,' + (0.05 + 0.05 * pulse) + ')';
  ctx.fill();
  ctx.strokeStyle = 'rgba(180,235,255,' + (0.45 + 0.35 * pulse) + ')';
  ctx.lineWidth = 1.6;
  ctx.stroke();

  ctx.font = '600 22px ' + FONT;
  ctx.fillStyle = 'rgba(235,250,255,0.95)';
  ctx.textAlign = 'center';
  ctx.fillText('点击开始', cx, cy + 222);

  // 底部署名
  ctx.font = '400 14px ' + FONT;
  ctx.fillStyle = 'rgba(140,175,215,0.45)';
  ctx.fillText('第一届"智游杯"AI+游戏创意作品挑战赛 · 个人参赛作品', cx, H - 96);

  ctx.font = '400 13px ' + FONT;
  ctx.fillStyle = 'rgba(140,175,215,0.32)';
  ctx.fillText('纯前端单文件实现 · 无需安装 · 双击即玩', cx, H - 68);

  ctx.restore();
  ctx.textAlign = 'left';
}

function drawFinale() {
  var t = state.t;
  var k = clamp((state.ending - 0.6) / 0.9, 0, 1);
  ctx.save();
  ctx.fillStyle = 'rgba(4,6,16,' + (0.74 * k) + ')';
  ctx.fillRect(0, 0, W, H);

  var cx = W / 2, cy = 430;
  ctx.globalAlpha = k;

  // 文字底衬，避免花朵压字
  var plate = ctx.createRadialGradient(cx, cy + 30, 40, cx, cy + 30, 560);
  plate.addColorStop(0, 'rgba(4,6,16,0.92)');
  plate.addColorStop(0.55, 'rgba(4,6,16,0.72)');
  plate.addColorStop(1, 'rgba(4,6,16,0)');
  ctx.fillStyle = plate;
  ctx.fillRect(cx - 620, cy - 190, 1240, 500);

  ctx.textAlign = 'center';

  ctx.font = '700 52px ' + FONT;
  var g = ctx.createLinearGradient(0, cy - 120, 0, cy - 40);
  g.addColorStop(0, '#ffffff');
  g.addColorStop(1, '#9fe8ff');
  ctx.fillStyle = g;
  ctx.fillText('花园记住了你的心意', cx, cy - 60);

  ctx.font = '400 20px ' + FONT;
  ctx.fillStyle = 'rgba(205,225,245,0.8)';
  ctx.fillText('你播下 ' + state.plantings + ' 朵光，小回声猜中 ' + state.accepts + ' 次，最终置信度 ' + Math.round(state.conf * 100) + '%。', cx, cy + 4);

  var acc = state.proposals > 0 ? Math.round(state.accepts / state.proposals * 100) : 0;
  ctx.fillStyle = 'rgba(170,205,240,0.62)';
  ctx.font = '400 17px ' + FONT;
  ctx.fillText('它的 ' + state.proposals + ' 次猜测里，有 ' + acc + '% 变成了花。', cx, cy + 42);
  ctx.fillText('这些判断里，有你留下的每一个角落。', cx, cy + 74);

  // 按钮
  var pulse = 0.6 + 0.4 * Math.sin(t * 2);
  roundRect(ctx, cx - 110, cy + 122, 220, 54, 27);
  ctx.strokeStyle = 'rgba(180,235,255,' + (0.4 + 0.35 * pulse) + ')';
  ctx.lineWidth = 1.6;
  ctx.stroke();
  ctx.font = '600 20px ' + FONT;
  ctx.fillStyle = 'rgba(235,250,255,0.95)';
  ctx.fillText('再种一次', cx, cy + 156);

  ctx.font = '400 13px ' + FONT;
  ctx.fillStyle = 'rgba(150,185,220,0.4)';
  ctx.fillText('也可以按 R 重新开始', cx, cy + 210);
  ctx.restore();
  ctx.textAlign = 'left';
}

/* ---------------- 主渲染 ---------------- */
function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#04050c';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.translate(view.ox, view.oy);
  ctx.scale(view.s, view.s);

  if (state.shake > 0.01) {
    var s = state.shake * 2.2;
    ctx.translate((Math.random() - 0.5) * s, (Math.random() - 0.5) * s);
  }

  var k = state.res / 100;
  drawBackground(k);
  drawSkyline(k);
  drawRain();

  if (state.mode === 'title') {
    drawTitle();
    return;
  }

  drawFieldFrame();
  drawGrid();
  drawHeat();
  drawFlowers();
  drawProposal();
  drawFx();
  drawVignette();
  drawHeader();
  drawHUD();
  drawTip();
  drawTutorial();

  if (state.mode === 'finale') drawFinale();
}

/* ---------------- 循环 ---------------- */
var last = 0;
function loop(now) {
  if (!last) last = now;
  var dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  update(dt);
  render();
  requestAnimationFrame(loop);
}

resize();
requestAnimationFrame(loop);

/* 防止误触右键菜单 / 滚动 */
window.addEventListener('contextmenu', function (e) { e.preventDefault(); });
window.addEventListener('wheel', function (e) { e.preventDefault(); }, { passive: false });

/* 调试接口：便于评测/录屏工具读取当前状态 */
window.__echoGarden = state;

})();
</script>
</body>
