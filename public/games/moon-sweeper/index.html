<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>月面清道夫 · Moon Sweeper</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  :root{
    --ink:#242A31; --ink2:#5D6572; --ink3:#8B93A0;
    --cream:#FBF8F0; --line:rgba(36,42,49,.10);
    --gold:#D99B34; --gold-d:#B87F22; --teal:#2F8C86; --rust:#D9663F;
  }
  html,body{height:100%;overflow:hidden;background:#E6E2D8;
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",-apple-system,"Segoe UI",sans-serif;
    color:var(--ink);font-feature-settings:"tnum";}
  body{display:flex;align-items:center;justify-content:center;}
  #stage{position:absolute;left:50%;top:50%;width:1280px;height:720px;border-radius:20px;overflow:hidden;
    box-shadow:0 40px 90px rgba(40,45,55,.28), 0 2px 0 rgba(255,255,255,.6) inset;
    transform-origin:center center;background:#EDEAE1;
    transform:translate(-50%,-50%) scale(1);}
  canvas{display:block;width:1280px;height:720px;touch-action:none;}

  /* ---------- HUD ---------- */
  #hud{position:absolute;inset:0;pointer-events:none;z-index:10;}
  .card{background:rgba(251,248,240,.86);backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,.8);border-radius:16px;
    box-shadow:0 8px 26px rgba(50,55,65,.12), 0 1px 0 rgba(255,255,255,.9) inset;}
  #hudLeft{position:absolute;left:22px;top:20px;padding:12px 16px 12px 14px;width:352px;}
  .row{display:flex;align-items:center;gap:10px;}
  .row+.row{margin-top:9px;}
  .lab{font-size:12px;letter-spacing:.08em;color:var(--ink2);width:44px;flex:0 0 44px;font-weight:600;}
  .bar{position:relative;flex:1;height:11px;border-radius:6px;background:rgba(36,42,49,.10);overflow:hidden;}
  .bar i{position:absolute;left:0;top:0;bottom:0;width:0%;border-radius:6px;
    background:#2F8C86;transition:width .14s linear,background .3s;}
  .val{font-size:12px;font-weight:700;color:var(--ink);width:44px;text-align:right;flex:0 0 44px;}

  #hudRight{position:absolute;right:22px;top:20px;padding:10px 16px;display:flex;align-items:center;gap:14px;}
  .goldbox{display:flex;align-items:center;gap:7px;font-size:16px;font-weight:800;color:var(--gold-d);}
  .coin{width:17px;height:17px;border-radius:5px;background:linear-gradient(145deg,#F0C063,#D08F26);
    box-shadow:0 1px 2px rgba(150,100,10,.4), 0 0 0 1px rgba(180,120,20,.35) inset;}
  .divline{width:1px;height:22px;background:var(--line);}
  .sector{font-size:13px;font-weight:700;color:var(--ink2);}
  .sector b{color:var(--ink);font-size:16px;}

  #hudMid{position:absolute;left:50%;top:22px;transform:translateX(-50%);display:flex;gap:8px;pointer-events:auto;}
  .mini{pointer-events:auto;cursor:pointer;border:1px solid rgba(255,255,255,.85);border-radius:11px;
    background:rgba(251,248,240,.86);backdrop-filter:blur(10px);color:var(--ink2);
    font-size:12.5px;font-weight:700;padding:8px 14px;font-family:inherit;
    box-shadow:0 6px 18px rgba(50,55,65,.10);transition:.16s;}
  .mini:hover{color:var(--ink);transform:translateY(-1px);box-shadow:0 10px 22px rgba(50,55,65,.16);}

  #hint{position:absolute;left:24px;bottom:22px;font-size:12.5px;color:#6B7280;
    background:rgba(251,248,240,.7);padding:7px 13px;border-radius:10px;
    border:1px solid rgba(255,255,255,.7);transition:opacity .6s;}
  #sectorTag{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);
    font-size:12px;letter-spacing:.22em;color:#8A8F98;font-weight:700;}

  #boostBtn{position:absolute;right:26px;bottom:24px;width:100px;height:100px;border-radius:50%;
    border:1px solid rgba(255,255,255,.9);background:rgba(251,248,240,.9);backdrop-filter:blur(10px);
    color:var(--ink);font-family:inherit;font-size:13px;font-weight:800;letter-spacing:.06em;cursor:pointer;
    box-shadow:0 10px 26px rgba(50,55,65,.16);pointer-events:auto;transition:.12s;user-select:none;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;line-height:1.15;}
  #boostBtn .key{font-size:9px;font-weight:700;letter-spacing:.04em;color:#9AA0A8;
    border:1px solid rgba(138,143,152,.4);border-radius:20px;padding:1px 6px;}
  #boostBtn:active,#boostBtn.on{transform:scale(.94);background:#2F8C86;color:#F7FBF9;border-color:#2F8C86;}
  #boostBtn.on .key{color:rgba(247,251,249,.9);border-color:rgba(247,251,249,.5);}
  #boostBtn.cd{opacity:.4;filter:grayscale(.6);}

  /* ---------- 覆盖层 ---------- */
  #overlay{position:absolute;inset:0;z-index:30;display:none;align-items:center;justify-content:center;
    background:rgba(233,229,219,.62);backdrop-filter:blur(7px);padding:28px;}
  #overlay.show{display:flex;}
  .panel{width:100%;max-width:760px;max-height:100%;overflow:auto;background:var(--cream);
    border-radius:22px;padding:30px 34px;box-shadow:0 30px 70px rgba(40,45,55,.22);
    border:1px solid rgba(255,255,255,.9);animation:pop .28s cubic-bezier(.2,.9,.3,1.2);}
  @keyframes pop{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
  .panel::-webkit-scrollbar{width:8px}
  .panel::-webkit-scrollbar-thumb{background:rgba(36,42,49,.18);border-radius:4px}

  h1.title{font-size:52px;letter-spacing:.08em;line-height:1.1;color:var(--ink);}
  .sub{font-size:12px;letter-spacing:.36em;color:var(--ink3);font-weight:700;margin-top:8px;}
  .lead{font-size:14.5px;line-height:1.95;color:var(--ink2);margin-top:18px;}
  .lead b{color:var(--ink);}
  .feat{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:22px 0 6px;}
  .feat div{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 14px 15px;}
  .feat h4{font-size:13.5px;margin-bottom:6px;color:var(--ink);}
  .feat p{font-size:12px;line-height:1.7;color:var(--ink3);}
  .dot{display:inline-block;width:8px;height:8px;border-radius:3px;margin-right:6px;vertical-align:1px;}

  .btns{display:flex;gap:12px;margin-top:24px;flex-wrap:wrap;}
  button.act{font-family:inherit;font-size:14.5px;font-weight:800;letter-spacing:.05em;cursor:pointer;
    border-radius:13px;padding:14px 30px;border:1px solid transparent;transition:.16s;}
  .primary{background:var(--ink);color:#FBF8F0;box-shadow:0 12px 26px rgba(36,42,49,.26);}
  .primary:hover{transform:translateY(-2px);box-shadow:0 16px 32px rgba(36,42,49,.32);}
  .ghost{background:transparent;color:var(--ink2);border-color:rgba(36,42,49,.16);}
  .ghost:hover{background:#fff;color:var(--ink);}

  .statline{display:flex;gap:26px;margin-top:20px;flex-wrap:wrap;}
  .statline div{font-size:12px;color:var(--ink3);letter-spacing:.06em;}
  .statline div b{display:block;font-size:26px;color:var(--ink);margin-top:4px;letter-spacing:0;}

  /* 图鉴 */
  .bookgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px;}
  .bk{display:flex;gap:12px;padding:12px;border-radius:13px;background:#fff;border:1px solid var(--line);}
  .bk.lock{background:rgba(36,42,49,.04);border-style:dashed;opacity:.62;}
  .spine{width:30px;height:40px;border-radius:4px 7px 7px 4px;flex:0 0 30px;
    background:linear-gradient(150deg,#3E7C93,#2E5D73);position:relative;box-shadow:0 2px 5px rgba(30,60,80,.28);}
  .spine:after{content:"";position:absolute;left:5px;top:5px;bottom:5px;width:2px;background:rgba(255,255,255,.45);border-radius:2px;}
  .bk.lock .spine{background:#C9C6BE;box-shadow:none;}
  .bk h5{font-size:13.5px;margin-bottom:3px;}
  .bk p{font-size:11.5px;color:var(--ink3);line-height:1.6;}
  .bk .eff{font-size:11px;color:var(--gold-d);font-weight:800;margin-top:4px;}

  /* 工坊 */
  .shopitem{display:flex;align-items:center;gap:16px;padding:14px 16px;border-radius:14px;
    background:#fff;border:1px solid var(--line);margin-top:10px;}
  .shopitem .nm{font-size:14px;font-weight:800;}
  .shopitem .ds{font-size:11.5px;color:var(--ink3);margin-top:3px;}
  .lv{display:flex;gap:4px;margin-top:7px;}
  .lv i{width:16px;height:5px;border-radius:3px;background:rgba(36,42,49,.13);}
  .lv i.f{background:var(--teal);}
  .buy{margin-left:auto;font-family:inherit;font-size:13px;font-weight:800;cursor:pointer;
    padding:10px 16px;border-radius:11px;border:1px solid rgba(36,42,49,.14);background:#FBF8F0;color:var(--ink);
    display:flex;align-items:center;gap:6px;transition:.15s;white-space:nowrap;}
  .buy:hover:not(:disabled){background:var(--ink);color:#FBF8F0;border-color:var(--ink);}
  .buy:disabled{opacity:.42;cursor:not-allowed;}
  .buy .coin{width:13px;height:13px;}

  /* 选关 */
  .lvlgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:20px;}
  .lvl{position:relative;background:#fff;border:1px solid var(--line);border-radius:14px;
    padding:14px 8px 13px;text-align:center;cursor:pointer;transition:.15s;font-family:inherit;}
  .lvl:hover:not(.off){transform:translateY(-3px);box-shadow:0 12px 26px rgba(50,55,65,.15);border-color:rgba(47,140,134,.4);}
  .lvl .no{font-size:10.5px;letter-spacing:.22em;color:var(--ink3);font-weight:800;}
  .lvl .nm{font-size:15px;font-weight:800;margin-top:5px;}
  .lvl .meta{font-size:10.5px;color:var(--ink3);margin-top:7px;line-height:1.7;}
  .lvl .cost{margin-top:9px;font-size:12px;font-weight:800;color:var(--gold-d);
    display:flex;align-items:center;justify-content:center;gap:4px;}
  .lvl.free .cost{color:var(--teal);}
  .lvl.off{opacity:.48;cursor:not-allowed;}
  .lvl .coin{width:11px;height:11px;}
  .lvl .tag{position:absolute;top:-8px;right:-6px;font-size:10px;font-weight:800;color:#fff;
    background:var(--teal);padding:3px 8px;border-radius:8px;letter-spacing:.05em;}

  #toastWrap{position:absolute;left:50%;bottom:110px;transform:translateX(-50%);z-index:25;
    display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;}
  .toast{background:rgba(36,42,49,.92);color:#FBF8F0;font-size:13px;font-weight:700;
    padding:11px 20px;border-radius:12px;box-shadow:0 12px 30px rgba(36,42,49,.3);
    display:flex;align-items:center;gap:10px;animation:tin .3s ease;}
  .toast b{color:#F2C46A;}
  @keyframes tin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .toast.out{opacity:0;transform:translateY(-6px);transition:.4s;}
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv" width="1280" height="720"></canvas>

  <div id="hud">
    <div id="hudLeft" class="card">
      <div class="row">
        <span class="lab">氧气</span>
        <span class="bar"><i id="o2fill"></i></span>
        <span class="val" id="o2val">100</span>
      </div>
      <div class="row">
        <span class="lab">清洁度</span>
        <span class="bar"><i id="pgfill" style="background:#8A93A0"></i></span>
        <span class="val" id="pgval">0%</span>
      </div>
      <div class="row">
        <span class="lab">机体</span>
        <span class="bar"><i id="hpfill"></i></span>
        <span class="val" id="hpval">100</span>
      </div>
      <div class="row">
        <span class="lab">技能</span>
        <span class="bar"><i id="skfill"></i></span>
        <span class="val" id="skval">就绪</span>
      </div>
    </div>

    <div id="hudRight" class="card">
      <div class="goldbox"><span class="coin"></span><span id="goldVal">0/5</span></div>
      <div class="divline"></div>
      <div class="sector">月区 <b id="secVal">1</b>/5</div>
    </div>

    <div id="hudMid">
      <button class="mini" id="btnCodex">图鉴</button>
      <button class="mini" id="btnSound">音效 开</button>
      <button class="mini" id="btnPause">暂停</button>
    </div>

    <div id="hint">WASD / 方向键 移动 · 空格 或 鼠标右键 释放强化吸取（持续 5s，有冷却） · 岩石是实体障碍，绕行或吸碎它</div>
    <div id="sectorTag"></div>
    <button id="boostBtn"><span>强化吸取</span><span class="key">右键 / 空格</span></button>
  </div>

  <div id="toastWrap"></div>
  <div id="overlay"></div>
</div>

<script>
/* =========================================================
   月面清道夫 · Moon Sweeper
   清理月球 + 金砖收集 + 书籍图鉴 三合一循环
   ========================================================= */
const W = 1280, H = 720;
const FIELD = { x0: 28, y0: 128, x1: W - 28, y1: H - 28 };
const TAU = Math.PI * 2;

const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp  = (a, b, t) => a + (b - a) * t;
const rand  = (a = 0, b = 1) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const dist  = (x1, y1, x2, y2) => Math.hypot(x1 - x2, y1 - y2);
const pick  = arr => arr[Math.floor(Math.random() * arr.length)];

// 旧浏览器兼容：roundRect
if (!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
    const rr = Math.min(typeof r === 'number' ? r : 0, Math.abs(w) / 2, Math.abs(h) / 2);
    this.moveTo(x + rr, y);
    this.arcTo(x + w, y, x + w, y + h, rr);
    this.arcTo(x + w, y + h, x, y + h, rr);
    this.arcTo(x, y + h, x, y, rr);
    this.arcTo(x, y, x + w, y, rr);
    this.closePath();
    return this;
  };
}

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* ---------------- 存档 ---------------- */
const SAVE_KEY = 'moonSweeperSaveV1';
const defaultSave = () => ({
  gold: 0, totalEarned: 0, books: {}, upg: { range: 0, speed: 0, o2: 0, gold: 0, armor: 0, skill: 0 },
  best: 0, cleared: false, muted: false, plays: 0
});
let save = defaultSave();
try {
  const raw = localStorage.getItem(SAVE_KEY);
  if (raw) {
    const d = defaultSave(), o = JSON.parse(raw);
    save = Object.assign(d, o);
    save.upg = Object.assign(d.upg, o.upg || {});   // 老存档补全新增升级项
    if (o.totalEarned === undefined) save.totalEarned = save.gold;  // 老存档回填：以当前余额近似
  }
} catch (e) { /* 隐私模式忽略 */ }
function persist() {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {}
}
/** 把未入账的金砖结算进存档，重复调用只会结算一次 */
function bankRun() {
  if (!G || !G.runGold) { if (G) G.banked = true; return; }
  save.gold += G.runGold;
  save.totalEarned += G.runGold;   // 累计收集（不含已花掉的部分）
  G.runGold = 0;
  G.banked = true;
  persist();
}

/* ---------------- 书籍（图鉴 + 当局增益） ---------------- */
const BOOKS = [
  { id:'geo',    title:'月面地质学',     tag:'勘探', desc:'月壤颗粒带静电，吸起来比想象中容易。', eff:'吸取范围 +12%', apply:r => r.suctionMul *= 1.12 },
  { id:'gait',   title:'低重力步法',     tag:'机动', desc:'六分之一重力，跳着走比走着快。',       eff:'移动速度 +10%', apply:r => r.speedMul  *= 1.10 },
  { id:'o2',     title:'再生氧气循环',   tag:'生存', desc:'把月壤里的氧重新挤出来，一次一点。',   eff:'清扫回氧 +30%', apply:r => r.o2Regen *= 1.3 },
  { id:'smelt',  title:'废料冶炼手册',   tag:'工业', desc:'太空垃圾里也有好东西，只看你会不会拆。', eff:'金砖价值 +25%', apply:r => r.goldMul  *= 1.25 },
  { id:'echo',   title:'环形山的回声',   tag:'灵感', desc:'在空无一人的地方，声音会替你干活。',   eff:'清扫效率 +20%',  apply:r => r.cleanMul *= 1.20 },
  { id:'moss',   title:'苔藓计划',       tag:'生态', desc:'第一株苔藓长出来时，全场安静了三秒。', eff:'氧气回补 +30%', apply:r => r.o2Regen  *= 1.30 },
  { id:'map',    title:'月球背面地图',   tag:'导航', desc:'有些坐标，只有清洁工才知道。',         eff:'吸取吸附 +25%', apply:r => r.magnetMul *= 1.25 },
  { id:'diary',  title:'孤独宇航员日记', tag:'笔记', desc:'“第 412 天。今天也没人等我的信。”',   eff:'陨石伤害 -30%', apply:r => r.dmgMul   *= 0.70 },
  { id:'palace', title:'广寒宫施工图',   tag:'蓝图', desc:'图纸上只有一座地基，和一片空地。',     eff:'技能持续 +2 秒', apply:r => r.skillDur += 2 },
  { id:'code',   title:'清道夫守则',     tag:'规章', desc:'第一条：月球不需要感谢，它只需要干净。', eff:'强化吸取 +25%', apply:r => r.boostMul *= 1.25 },
];
const BOOK_MAP = Object.fromEntries(BOOKS.map(b => [b.id, b]));

/* ---------------- 永久升级 ---------------- */
const UPGRADES = [
  { key:'range', name:'吸尘口改造', desc:'吸取半径 +8%',        max:8, base:30, grow:1.52 },
  { key:'speed', name:'推进器调校', desc:'移动速度 +6%',        max:8, base:26, grow:1.50 },
  { key:'o2',    name:'氧气循环',   desc:'氧气消耗 -5%',        max:8, base:34, grow:1.48 },
  { key:'gold',  name:'回收精炼线', desc:'金砖收益 +10%',       max:6, base:42, grow:1.58 },
  { key:'armor', name:'防陨装甲',   desc:'陨石伤害 -10%',       max:6, base:38, grow:1.55 },
  { key:'skill', name:'冷却线圈',   desc:'技能冷却 -1.5秒',     max:6, base:36, grow:1.55 },
];
const upgCost = u => Math.round(u.base * Math.pow(u.grow, save.upg[u.key]));

/* ---------------- 月区 ---------------- */
const SECTORS = [
  { name:'静海',            dust:44, rocks:12, goldGoal:5  },
  { name:'风暴洋',          dust:52, rocks:15, goldGoal:10 },
  { name:'第谷环形山',      dust:60, rocks:18, goldGoal:15 },
  { name:'雨海',            dust:68, rocks:22, goldGoal:20 },
  { name:'南极-艾特肯盆地', dust:78, rocks:26, goldGoal:25 },
];
const goldGoalOf = n => SECTORS[n - 1].goldGoal;
const SECTOR_MAX = SECTORS.length;

/* ---------------- 音效（纯 WebAudio 合成） ---------------- */
const Audio2 = (() => {
  let ac = null, noiseSrc = null, noiseGain = null, master = null, ready = false;
  function noiseBuffer(ctx) {
    const len = ctx.sampleRate * 2, buf = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    return buf;
  }
  function init() {
    if (ready) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    ac = new AC();
    master = ac.createGain(); master.gain.value = save.muted ? 0 : 1; master.connect(ac.destination);

    noiseSrc = ac.createBufferSource();
    noiseSrc.buffer = noiseBuffer(ac); noiseSrc.loop = true;
    const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 820; bp.Q.value = 0.9;
    noiseGain = ac.createGain(); noiseGain.gain.value = 0;
    noiseSrc.connect(bp); bp.connect(noiseGain); noiseGain.connect(master);
    noiseSrc.start();
    ready = true;
  }
  function tone(freq, dur, type = 'sine', vol = 0.08, slideTo = null) {
    if (!ready || save.muted) return;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.value = freq;
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, ac.currentTime + dur);
    g.gain.setValueAtTime(vol, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + dur);
    o.connect(g); g.connect(master);
    o.start(); o.stop(ac.currentTime + dur + 0.02);
  }
  return {
    init,
    hum(v) { if (ready && noiseGain) noiseGain.gain.value = save.muted ? 0 : v * 0.055; },
    clean() { tone(rand(620, 760), 0.07, 'sine', 0.045, 420); },
    gold()  { tone(880, 0.09, 'triangle', 0.07, 1320); },
    skill() { tone(440, 0.16, 'triangle', 0.07, 880); setTimeout(() => tone(880, 0.12, 'triangle', 0.05, 1174), 120); },
    book()  { tone(523, 0.10, 'sine', 0.07); setTimeout(() => tone(784, 0.16, 'sine', 0.06), 90); },
    rock()  { tone(rand(120, 160), 0.14, 'square', 0.05, 60); },
    hit()   { tone(90, 0.28, 'sawtooth', 0.09, 40); },
    clear() { [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => tone(f, 0.22, 'sine', 0.07), i * 110)); },
    fail()  { [330, 262, 196].forEach((f, i) => setTimeout(() => tone(f, 0.30, 'sine', 0.07), i * 150)); },
    toggle() {
      save.muted = !save.muted; persist();
      if (master) master.gain.value = save.muted ? 0 : 1;
      return !save.muted;
    }
  };
})();

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const bgCanvas = document.createElement('canvas');
bgCanvas.width = W; bgCanvas.height = H;
const bgx = bgCanvas.getContext('2d');

function paintBackground(seed) {
  const rnd = mulberry32(seed);
  const g = bgx.createLinearGradient(0, 0, W, H);
  g.addColorStop(0, '#F2EFE7'); g.addColorStop(0.55, '#EBE7DD'); g.addColorStop(1, '#E2DED3');
  bgx.fillStyle = g; bgx.fillRect(0, 0, W, H);

  // 大型阴影盆地
  for (let i = 0; i < 5; i++) {
    const x = rnd() * W, y = rnd() * H, r = 130 + rnd() * 200;
    const rg = bgx.createRadialGradient(x, y, r * 0.2, x, y, r);
    rg.addColorStop(0, 'rgba(120,112,96,0.10)');
    rg.addColorStop(1, 'rgba(120,112,96,0)');
    bgx.fillStyle = rg; bgx.beginPath(); bgx.arc(x, y, r, 0, TAU); bgx.fill();
  }

  // 陨石坑
  const craters = 9 + Math.floor(rnd() * 4);
  for (let i = 0; i < craters; i++) {
    const x = 60 + rnd() * (W - 120);
    const y = FIELD.y0 + 40 + rnd() * (FIELD.y1 - FIELD.y0 - 80);
    const r = 26 + rnd() * 58;
    const rg = bgx.createRadialGradient(x, y - r * 0.15, r * 0.1, x, y, r);
    rg.addColorStop(0, 'rgba(196,190,176,0.85)');
    rg.addColorStop(0.55, 'rgba(214,208,194,0.55)');
    rg.addColorStop(0.92, 'rgba(232,227,215,0.25)');
    rg.addColorStop(1, 'rgba(250,247,239,0.85)');
    bgx.beginPath(); bgx.arc(x, y, r, 0, TAU); bgx.fillStyle = rg; bgx.fill();
    bgx.beginPath(); bgx.arc(x, y, r, Math.PI * 1.02, Math.PI * 1.92);
    bgx.strokeStyle = 'rgba(150,143,128,0.28)'; bgx.lineWidth = 2.4; bgx.stroke();
    bgx.beginPath(); bgx.arc(x, y, r * 0.97, Math.PI * 0.05, Math.PI * 0.9);
    bgx.strokeStyle = 'rgba(255,253,247,0.75)'; bgx.lineWidth = 1.8; bgx.stroke();
  }

  // 月壤颗粒
  for (let i = 0; i < 2200; i++) {
    const x = rnd() * W, y = rnd() * H, s = rnd() * 1.7 + 0.3;
    bgx.fillStyle = rnd() > 0.5 ? 'rgba(120,112,96,0.055)' : 'rgba(255,253,246,0.16)';
    bgx.beginPath(); bgx.arc(x, y, s, 0, TAU); bgx.fill();
  }
}

           o2Regen: 1, magnetMul: 1, dmgMul: 1, skillDur: 0, boostMul: 1, books: [] };

/* ---------------- 技能：强化吸取 ---------------- */
const skillBaseDur = () => 5 + B.skillDur;                    // 广寒宫施工图：每张 +2s
const skillCdDur   = () => Math.max(4, 13 - 1.5 * save.upg.skill);  // 冷却线圈：每级 -1.5s
const SKILL_O2_COST = 12;   // 开启技能一次性消耗的额外氧气
function tryActivateSkill() {
  if (!G || G.state !== 'playing') return;
  if (skillT > 0 || skillCdT > 0) return;
  if (G.o2 <= SKILL_O2_COST + 5) {          // 保底：开了技能不能直接把氧气开没
    toast(`氧气不足 · 开启技能需要 <b>${SKILL_O2_COST}</b> 氧气`);
    return;
  }
  G.o2 -= SKILL_O2_COST;
  floatText(G.player.x, G.player.y + 30, `-${SKILL_O2_COST} 氧气`, '#D9663F', 14);
  skillT = skillBaseDur();
  boostBtn.classList.add('on');
  Audio2.skill();
  floatText(G.player.x, G.player.y - 34, `强化吸取 ${skillT.toFixed(0)}s`, '#2F8C86', 17);
  burst(G.player.x, G.player.y, 'rgba(72,180,170,0.9)', 10, 130, 3);
}
function updateSkill(dt) {
  if (skillT > 0) {
    skillT -= dt;
    if (skillT <= 0) {
      skillT = 0;
      skillCdT = skillCdDur();
      boostBtn.classList.remove('on');
      boostBtn.classList.add('cd');
    }
  } else if (skillCdT > 0) {
    skillCdT -= dt;
    if (skillCdT <= 0) { skillCdT = 0; boostBtn.classList.remove('cd'); }
  }
  boosting = skillT > 0 && G.state === 'playing';
}

function toWorld(clientX, clientY) {
  const r = cv.getBoundingClientRect();
  return { x: (clientX - r.left) * (W / r.width), y: (clientY - r.top) * (H / r.height) };
}
cv.addEventListener('pointerdown', e => {

  cv.setPointerCapture(e.pointerId);
