<body>

<!-- ============ 标题页 ============ -->
<div class="title-screen" id="titleScreen">
  <div class="clouds">
    <div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div>
  </div>
  <div class="grass"></div>
  <div class="title-inner">

      <h1>泡泡<span>堂</span></h1>

    </div>

    <div class="tip">
      <span class="kb-only"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 移动 · <kbd>空格</kbd> 放水球<br>
      玩家2：<kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> + <kbd>回车</kbd><br></span>
      手机：左下摇杆走动 + 右下按钮放水球
    </div>
  </div>
</div>

<!-- ============ 游戏 ============ -->
<div class="app">
  <div class="topbar">
    <div class="brand"><span class="q">Q版</span><span>泡泡堂</span></div>
    <div class="hud" id="hud"></div>
    <div class="actions">
      <button class="icon-btn" id="btnSound" title="音效">🔊</button>
      <button class="icon-btn" id="btnPause" title="暂停 (Esc)">⏸</button>

  </div>

  <div class="stage">
    <canvas id="game"></canvas>

    <div class="overlay" id="overlay">
      <div class="panel" id="panel-clear" hidden>
        <div class="big-icon">🏅</div>

  <!-- 触屏：放在棋盘下方，不遮住格子 -->
  <div class="touch" id="touch">

  <div class="hint">打爆木箱吃道具　💧水球+1　🔥威力+1　👟速度+1　·　水球会连爆，小心别炸到自己</div>
</div>

<script>
(function () {
  'use strict';

  /* =========================================================
     1. 基础
     ========================================================= */
  const COLS = 15, ROWS = 13, TILE = 48;
  const W = COLS * TILE, H = ROWS * TILE;
  const EMPTY = 0, STONE = 1, CRATE = 2;

  const BOMB_TIME = 2.25;
  const BURN_TIME = 0.46;
  const TOTAL_STAGES = 8;      // 单人闯关共 8 关
  const VERSUS_WINS = 3;       // 双人对战先赢 3 局

  const DIRVEC = {
    up:    { x: 0, y: -1 },
    down:  { x: 0, y: 1 },
    left:  { x: -1, y: 0 },
    right: { x: 1, y: 0 }
  };

  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const rand = (a, b) => a + Math.random() * (b - a);
  const sign = v => (v > 0 ? 1 : v < 0 ? -1 : 0);

  /* =========================================================
     2. 角色（经典 6 人）
     ========================================================= */
  const CHARS = [
    { id: 'pidan',    name: '皮蛋', hair: '#3f74d6', hair2: '#2b56a8', style: 'spike',  body: '#5fa8ef', body2: '#3b7cc4',
      skin: '#ffe2c6', desc: '皮蛋：正义感强，但做事马虎' },
    { id: 'xiaoguai', name: '小乖', hair: '#ff8fb1', hair2: '#e0658c', style: 'twin',   body: '#ff9ec4', body2: '#dd6b96',
      skin: '#ffe8d4', desc: '小乖：年龄最小，最会玩水球' },
    { id: 'baobao',   name: '宝宝', hair: '#ffb347', hair2: '#e08a20', style: 'curl',   body: '#ffd166', body2: '#dfa733',
      skin: '#ffe8d4', desc: '宝宝：爱睡觉，性格最乐观' },
    { id: 'congtou',  name: '葱头', hair: '#6fce4a', hair2: '#4aa32c', style: 'sprout', body: '#a9e58c', body2: '#6bbf4f',
      skin: '#ffe8d4', desc: '葱头：爱看书胜过玩水球' },
    { id: 'pangdun',  name: '胖墩', hair: '#8b5a2b', hair2: '#6b421c', style: 'bowl',   body: '#f0834f', body2: '#c25a2c',
      skin: '#ffdfc0', desc: '胖墩：胆小又爱吃，但很勇敢' },
    { id: 'heiniu',   name: '黑妞', hair: '#3a3a4e', hair2: '#25253a', style: 'bob',    body: '#b39bf0', body2: '#8468d0',
      skin: '#ffe2c6', desc: '黑妞：害羞寡言的小女孩' }
  ];

  /* =========================================================
     3. 画布
     ========================================================= */
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');

  function fitCanvas() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    canvas.style.aspectRatio = W + ' / ' + H;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  fitCanvas();
  window.addEventListener('resize', fitCanvas);

  /* =========================================================
     4. 音效
     ========================================================= */
  let audioCtx = null, muted = false;
  function ensureAudio() {
    if (!audioCtx) {
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { audioCtx = null; }
    }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  }
  function tone(freq, dur, type, vol, slideTo) {
    if (muted || !audioCtx) return;
    const t = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = type || 'sine';
    osc.frequency.setValueAtTime(freq, t);
    if (slideTo) osc.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol || 0.05, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(g).connect(audioCtx.destination);
    osc.start(t); osc.stop(t + dur + 0.02);
  }
  function noise(dur, vol) {
    if (muted || !audioCtx) return;
    const sr = audioCtx.sampleRate;
    const len = Math.floor(sr * dur);
    const buf = audioCtx.createBuffer(1, len, sr);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.2);
    const src = audioCtx.createBufferSource();
    src.buffer = buf;
    const f = audioCtx.createBiquadFilter();
    f.type = 'lowpass';
    f.frequency.setValueAtTime(1500, audioCtx.currentTime);
    f.frequency.exponentialRampToValueAtTime(220, audioCtx.currentTime + dur);
    const g = audioCtx.createGain();
    g.gain.value = vol || 0.1;
    src.connect(f).connect(g).connect(audioCtx.destination);
    src.start();
  }
  function sfx(name) {
    if (muted) return;
    ensureAudio();
    if (!audioCtx) return;
    switch (name) {
      case 'place':  tone(540, 0.1, 'sine', 0.045, 330); break;
      case 'boom':   noise(0.3, 0.1); tone(150, 0.2, 'sawtooth', 0.045, 55); break;
      case 'item':   tone(760, 0.08, 'triangle', 0.05, 940); setTimeout(() => tone(1120, 0.1, 'triangle', 0.04), 70); break;
      case 'crate':  noise(0.1, 0.045); tone(230, 0.08, 'square', 0.025, 140); break;
      case 'die':    tone(420, 0.32, 'sine', 0.06, 110); break;
      case 'clear':  [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => tone(f, 0.18, 'triangle', 0.05), i * 100)); break;
      case 'fail':   [420, 330, 262].forEach((f, i) => setTimeout(() => tone(f, 0.24, 'sine', 0.05), i * 130)); break;
      case 'ui':     tone(680, 0.06, 'sine', 0.03, 800); break;
    }
  }

  /* =========================================================
     5. 状态
     ========================================================= */
  const game = {
    mode: 'stage',        // stage | versus
    state: 'title',       // title | playing | clear | fail | victory | roundover | matchover
    paused: false,
    grid: [], players: [], bombs: [], burns: [], items: [], particles: [],
    danger: [],
    time: 0, introTimer: 0, endTimer: 0, ending: false,
    stage: 1, score: 0, kills: 0,
    timeLimit: 120, lastLeft: -1,
    roundWinner: null, timeUp: false,
    shake: 0,
    selected: 0
  };

  /* =========================================================
     6. 关卡配置
     ========================================================= */
  const SPAWN_POINTS = [
    [1, ROWS - 2], [COLS - 2, 1], [COLS - 2, ROWS - 2], [1, 1],
    [Math.floor(COLS / 2), 1], [Math.floor(COLS / 2), ROWS - 2]
  ];

  function stageConfig(n) {
    return {
      enemies: Math.min(4, 1 + Math.floor((n - 1) / 2)),   // 1,1,2,2,3,3,4,4
      crates: 0.56 + Math.min(0.1, n * 0.012),
      skill: Math.min(0.9, 0.15 + (n - 1) * 0.08),
      time: 120
    };
  }

  /* =========================================================
     7. 地图
     ========================================================= */
  function generateGrid(crateChance, spawns) {
    const g = [];
    for (let y = 0; y < ROWS; y++) {
      const row = [];
      for (let x = 0; x < COLS; x++) {
        let t = EMPTY;
        if (x === 0 || y === 0 || x === COLS - 1 || y === ROWS - 1) t = STONE;
        else if (x % 2 === 0 && y % 2 === 0) t = STONE;
        row.push(t);
      }
      g.push(row);
    }
    for (let y = 1; y < ROWS - 1; y++) {
      for (let x = 1; x < COLS - 1; x++) {
        if (g[y][x] !== EMPTY) continue;
        let safe = false;
        for (let i = 0; i < spawns.length; i++) {
          const s = spawns[i];
          if (Math.abs(x - s[0]) + Math.abs(y - s[1]) <= 2) { safe = true; break; }
        }
        if (safe) continue;
        if (Math.random() < crateChance) g[y][x] = CRATE;
      }
    }
    return g;
  }

  function tileAt(x, y) {
    if (x < 0 || y < 0 || x >= COLS || y >= ROWS) return STONE;
    return game.grid[y][x];
  }

  /* =========================================================
     8. 角色实体
     ========================================================= */
  const HUMAN_KEYS = [
    { up: 'KeyW', down: 'KeyS', left: 'KeyA', right: 'KeyD', bomb: 'Space' },
    { up: 'ArrowUp', down: 'ArrowDown', left: 'ArrowLeft', right: 'ArrowRight', bomb: 'Enter' }
  ];

  function makePlayer(charIndex, team, human, id) {
    const ch = CHARS[charIndex % CHARS.length];
    return {
      id: id, char: ch, team: team, human: human, isAI: !human,
      keys: human ? HUMAN_KEYS[id === 1 ? 1 : 0] : null,
      pressOrder: [], touch: { x: 0, y: 0 },
      x: 1.5, y: 1.5, r: 0.3,
      speed: 3.3, maxBombs: 1, power: 1, activeBombs: 0,
      alive: true, wins: 0,
      face: 'down', moving: false, walkPhase: 0,
      intent: { x: 0, y: 0 },
      path: null, think: 0, stuck: 0,
      skill: 1, spawn: { x: 1, y: 1 }
    };
  }

  function resetPlayer(p, cx, cy) {
    p.x = cx + 0.5;
    p.y = cy + 0.5;
    p.spawn = { x: cx, y: cy };
    p.speed = 3.3;
    p.maxBombs = 1;
    p.power = 1;
    p.activeBombs = 0;
    p.alive = true;
    p.face = 'down';
    p.moving = false;
    p.intent = { x: 0, y: 0 };
    p.pressOrder = [];
    p.touch = { x: 0, y: 0 };
    p.path = null;
    p.think = 0;
    p.stuck = 0;
  }

  /* =========================================================
     9. 碰撞 / 移动
     ========================================================= */
  function blockedAt(x, y, r, self) {
    const x0 = Math.floor(x - r), x1 = Math.floor(x + r);
    const y0 = Math.floor(y - r), y1 = Math.floor(y + r);
    for (let ty = y0; ty <= y1; ty++) {
      for (let tx = x0; tx <= x1; tx++) {
        if (tileAt(tx, ty) !== EMPTY) return true;
      }
    }
    let cx0 = x0, cx1 = x1, cy0 = y0, cy1 = y1;
    if (self) {
      cx0 = Math.floor(self.x - r); cx1 = Math.floor(self.x + r);
      cy0 = Math.floor(self.y - r); cy1 = Math.floor(self.y + r);
    }
    for (let i = 0; i < game.bombs.length; i++) {
      const b = game.bombs[i];
      if (b.dead) continue;
      if (b.cx >= x0 && b.cx <= x1 && b.cy >= y0 && b.cy <= y1) {
        if (b.cx >= cx0 && b.cx <= cx1 && b.cy >= cy0 && b.cy <= cy1) continue;
        return true;
      }
    }
    return false;
  }

  function bombAt(cx, cy) {
    for (let i = 0; i < game.bombs.length; i++) {
      const b = game.bombs[i];
      if (!b.dead && b.cx === cx && b.cy === cy) return true;
    }
    return false;
  }

  function stepEntity(p, intent, dt) {
    let dx = 0, dy = 0;
    if (intent.x) dx = sign(intent.x);
    else if (intent.y) dy = sign(intent.y);
    p.moving = false;
    if (!dx && !dy) return;
    const sp = p.speed * dt;
    p.walkPhase += dt * 12;

    if (dx !== 0) {
      p.face = dx > 0 ? 'right' : 'left';
      const nx = p.x + dx * sp;
      if (!blockedAt(nx, p.y, p.r, p)) { p.x = nx; p.moving = true; }
      const lane = Math.floor(p.y) + 0.5;
      if (Math.abs(lane - p.y) > 0.002) {
        const st = Math.min(Math.abs(lane - p.y), sp * 1.6);
        const ny = p.y + sign(lane - p.y) * st;
        if (!blockedAt(p.x, ny, p.r, p)) p.y = ny;
      }
    } else if (dy !== 0) {
      p.face = dy > 0 ? 'down' : 'up';
      const ny = p.y + dy * sp;
      if (!blockedAt(p.x, ny, p.r, p)) { p.y = ny; p.moving = true; }
      const lane = Math.floor(p.x) + 0.5;
      if (Math.abs(lane - p.x) > 0.002) {
        const st = Math.min(Math.abs(lane - p.x), sp * 1.6);
        const nx = p.x + sign(lane - p.x) * st;
        if (!blockedAt(nx, p.y, p.r, p)) p.x = nx;
      }
    }
  }

  /* =========================================================
     10. 水球 / 爆炸 / 道具
     ========================================================= */
  function tryPlaceBomb(p) {
    if (!p || !p.alive) return false;
    if (game.state !== 'playing' || game.paused || game.introTimer > 0) return false;
    const cx = Math.floor(p.x), cy = Math.floor(p.y);
    if (tileAt(cx, cy) !== EMPTY) return false;
    if (bombAt(cx, cy)) return false;
    if (p.activeBombs >= p.maxBombs) return false;
    game.bombs.push({ cx: cx, cy: cy, timer: BOMB_TIME, range: p.power, owner: p, dead: false });
    p.activeBombs++;
    sfx('place');
    return true;
  }

  function blastCells(cx, cy, range) {
    const set = new Set();
    set.add(cx + ',' + cy);
    for (const k in DIRVEC) {
      const d = DIRVEC[k];
      for (let i = 1; i <= range; i++) {
        const nx = cx + d.x * i, ny = cy + d.y * i;
        const t = tileAt(nx, ny);
        if (t === STONE) break;
        set.add(nx + ',' + ny);
        if (t === CRATE) break;
      }
    }
    return set;
  }

  function explode(bomb) {
    if (bomb.dead) return;
    bomb.dead = true;
    if (bomb.owner) bomb.owner.activeBombs = Math.max(0, bomb.owner.activeBombs - 1);

    const cells = [{ cx: bomb.cx, cy: bomb.cy }];
    const seen = new Set([bomb.cx + ',' + bomb.cy]);

    for (const k in DIRVEC) {
      const d = DIRVEC[k];
      for (let i = 1; i <= bomb.range; i++) {
        const nx = bomb.cx + d.x * i, ny = bomb.cy + d.y * i;
        const t = tileAt(nx, ny);
        if (t === STONE) break;
        if (t === CRATE) { smashCrate(nx, ny); break; }
        const key = nx + ',' + ny;
        if (seen.has(key)) break;
        seen.add(key);
        cells.push({ cx: nx, cy: ny });
        let hit = false;
        for (let j = 0; j < game.bombs.length; j++) {
          const o = game.bombs[j];
          if (!o.dead && o.cx === nx && o.cy === ny) { hit = true; explode(o); break; }
        }
        if (hit) break;
      }
    }

    for (let i = 0; i < cells.length; i++) {
      const c = cells[i];
      game.burns.push({ cx: c.cx, cy: c.cy, t: BURN_TIME });
      for (let j = game.items.length - 1; j >= 0; j--) {
        if (game.items[j].cx === c.cx && game.items[j].cy === c.cy) game.items.splice(j, 1);
      }
      for (let k = 0; k < 3; k++) {
        game.particles.push({
          x: (c.cx + 0.5) * TILE + rand(-13, 13),
          y: (c.cy + 0.5) * TILE + rand(-13, 13),
          vx: rand(-60, 60), vy: rand(-160, -50),
          r: rand(2, 5), life: rand(0.3, 0.6), max: 0.6,
          color: Math.random() < 0.5 ? '#ffffff' : '#9fe0ff'
        });
      }
    }
    game.shake = Math.min(10, game.shake + 5);
    sfx('boom');
  }

  function smashCrate(cx, cy) {
    if (tileAt(cx, cy) !== CRATE) return;
    game.grid[cy][cx] = EMPTY;
    sfx('crate');
    for (let k = 0; k < 8; k++) {
      game.particles.push({
        x: (cx + 0.5) * TILE + rand(-12, 12),
        y: (cy + 0.5) * TILE + rand(-12, 12),
        vx: rand(-110, 110), vy: rand(-200, -60),
        r: rand(2, 4.5), life: rand(0.4, 0.75), max: 0.75,
        color: Math.random() < 0.5 ? '#c07a3e' : '#e2ab6b'
      });
    }
    if (Math.random() < 0.32) {
      const r = Math.random();
      const type = r < 0.4 ? 'bomb' : r < 0.75 ? 'power' : 'speed';
      game.items.push({ cx: cx, cy: cy, type: type, bob: Math.random() * 6 });
    }
  }

  function updateBombs(dt) {
    for (let i = 0; i < game.bombs.length; i++) {
      const b = game.bombs[i];
      if (b.dead) continue;
      b.timer -= dt;
      if (b.timer <= 0) explode(b);
    }
    let any = false;
    for (let i = 0; i < game.bombs.length; i++) if (!game.bombs[i].dead) { any = true; break; }
    if (any) game.bombs = game.bombs.filter(b => !b.dead);
    else game.bombs.length = 0;
  }

  function updateBurns(dt) {
    for (let i = game.burns.length - 1; i >= 0; i--) {
      game.burns[i].t -= dt;
      if (game.burns[i].t <= 0) game.burns.splice(i, 1);
    }
  }

  function isBurning(cx, cy) {
    for (let i = 0; i < game.burns.length; i++) {
      if (game.burns[i].cx === cx && game.burns[i].cy === cy) return true;
    }
    return false;
  }

  function applyItem(p, item) {
    if (item.type === 'bomb') p.maxBombs = Math.min(6, p.maxBombs + 1);
    else if (item.type === 'power') p.power = Math.min(6, p.power + 1);
    else p.speed = Math.min(5.2, p.speed + 0.42);
    sfx('item');
    for (let k = 0; k < 10; k++) {
      game.particles.push({
        x: (item.cx + 0.5) * TILE, y: (item.cy + 0.5) * TILE,
        vx: rand(-90, 90), vy: rand(-140, -30),
        r: rand(1.5, 3.5), life: rand(0.35, 0.6), max: 0.6,
        color: item.type === 'bomb' ? '#7fd0ff' : item.type === 'power' ? '#ffa45c' : '#a9e88a'
      });
    }
  }

  function updateItems(dt) {
    for (let i = game.items.length - 1; i >= 0; i--) {
      const it = game.items[i];
      it.bob += dt * 3;
      let taken = false;
      for (let j = 0; j < game.players.length; j++) {
        const p = game.players[j];
        if (!p.alive) continue;
        if (Math.floor(p.x) === it.cx && Math.floor(p.y) === it.cy) {
          applyItem(p, it);
          taken = true;
          break;
        }
      }
      if (taken) game.items.splice(i, 1);
    }
  }

  function killPlayer(p) {
    if (!p.alive) return;
    p.alive = false;
    p.path = null;
    p.intent = { x: 0, y: 0 };
    sfx('die');
    for (let k = 0; k < 20; k++) {
      game.particles.push({
        x: p.x * TILE, y: (p.y - 0.2) * TILE,
        vx: rand(-150, 150), vy: rand(-240, -60),
        r: rand(2, 6), life: rand(0.5, 0.9), max: 0.9,
        color: Math.random() < 0.45 ? p.char.body : '#ffffff'
      });
    }
    if (!p.human) {
      game.kills++;
      game.score += 100;
    }
    updateHud();
  }

  function checkDamage() {
    for (let i = 0; i < game.players.length; i++) {
      const p = game.players[i];
      if (!p.alive) continue;
      if (isBurning(Math.floor(p.x), Math.floor(p.y))) killPlayer(p);
    }
  }

  /* =========================================================
     11. 危险图 / AI
     ========================================================= */
  function computeDanger() {
    const d = game.danger;
    for (let y = 0; y < ROWS; y++) {
      const row = d[y];
      for (let x = 0; x < COLS; x++) row[x] = Infinity;
    }
    for (let i = 0; i < game.bombs.length; i++) {
      const b = game.bombs[i];
      if (b.dead) continue;
      const t = b.timer;
      if (t < d[b.cy][b.cx]) d[b.cy][b.cx] = t;
      for (const k in DIRVEC) {
        const dir = DIRVEC[k];
        for (let s = 1; s <= b.range; s++) {
          const nx = b.cx + dir.x * s, ny = b.cy + dir.y * s;
          const tt = tileAt(nx, ny);
          if (tt === STONE) break;
          if (t < d[ny][nx]) d[ny][nx] = t;
          if (tt === CRATE) break;
        }
      }
    }
    for (let i = 0; i < game.burns.length; i++) {
      const bu = game.burns[i];
      if (d[bu.cy] && d[bu.cy][bu.cx] !== undefined) d[bu.cy][bu.cx] = 0;
    }
  }

  function bfsFrom(sx, sy, dangerLimit) {
    const N = COLS * ROWS;
    const dist = new Int32Array(N).fill(-1);
    const prev = new Int32Array(N).fill(-1);
    const start = sy * COLS + sx;
    dist[start] = 0;
    const q = [start];
    let head = 0;
    while (head < q.length) {
      const cur = q[head++];
      const cx = cur % COLS, cy = (cur - cx) / COLS;
      for (const k in DIRVEC) {
        const dir = DIRVEC[k];
        const nx = cx + dir.x, ny = cy + dir.y;
        if (nx < 0 || ny < 0 || nx >= COLS || ny >= ROWS) continue;
        const ni = ny * COLS + nx;
        if (dist[ni] !== -1) continue;
        if (game.grid[ny][nx] !== EMPTY) continue;
        if (bombAt(nx, ny)) continue;
        if (game.danger[ny][nx] < dangerLimit) continue;
        dist[ni] = dist[cur] + 1;
        prev[ni] = cur;
        q.push(ni);
      }
    }
    return { dist: dist, prev: prev };
  }

  function buildPath(prev, idx, sx, sy) {
    const out = [];
    let cur = idx;
    const start = sy * COLS + sx;
    let guard = 0;
    while (cur !== start && cur !== -1 && guard++ < 400) {
      const x = cur % COLS, y = (cur - x) / COLS;
      out.push({ x: x, y: y });
      cur = prev[cur];
    }
    return out.reverse();
  }

  // 带时间的逃跑寻路：只走“走到时还没炸”的格子，并返回最近的安全点
  function escapePath(p, cx, cy) {
    const speed = Math.max(2.6, p.speed);
    const N = COLS * ROWS;
    const dist = new Int32Array(N).fill(-1);
    const prev = new Int32Array(N).fill(-1);
    const start = cy * COLS + cx;
    dist[start] = 0;
    const q = [start];
    let head = 0;
    let best = -1;

    while (head < q.length) {
      const cur = q[head++];
      const ccx = cur % COLS, ccy = (cur - ccx) / COLS;
      if (cur !== start && game.danger[ccy][ccx] === Infinity) { best = cur; break; }
      for (const k in DIRVEC) {
        const d = DIRVEC[k];
        const nx = ccx + d.x, ny = ccy + d.y;
        if (nx < 0 || ny < 0 || nx >= COLS || ny >= ROWS) continue;
        const ni = ny * COLS + nx;
        if (dist[ni] !== -1) continue;
        if (game.grid[ny][nx] !== EMPTY) continue;
        if (bombAt(nx, ny)) continue;
        const arrive = (dist[cur] + 1) / speed;
        if (game.danger[ny][nx] < arrive + 0.12) continue;  // 到的时候已经炸了，别去
        dist[ni] = dist[cur] + 1;
        prev[ni] = cur;
        q.push(ni);
      }
    }

    if (best < 0) {
      // 找不到绝对安全点：退而求其次，挑“能多活一会儿”的格子
      let bestScore = -1;
      for (let i = 0; i < N; i++) {
        if (dist[i] < 0 || i === start) continue;
        const x = i % COLS, y = (i - x) / COLS;
        const dgr = game.danger[y][x] === Infinity ? 99 : game.danger[y][x];
        const score = dgr + dist[i] * 0.05;
        if (score > bestScore) { bestScore = score; best = i; }
      }
    }
    if (best < 0) return [];
    return buildPath(prev, best, cx, cy);
  }

  // 假设真的在 (cx,cy) 放下一颗水球：算上引信时间，能不能跑到彻底安全的格子？
  // 做法是把假想水球临时塞进列表重算危险图，再做“带时间”的宽度搜索，
  // 只有走到 danger === Infinity 的格子才算活路。
  function canEscapeAfterBomb(p, cx, cy) {
    const fake = { cx: cx, cy: cy, range: p.power, timer: BOMB_TIME, owner: p, dead: false };
    game.bombs.push(fake);
    computeDanger();

    const danger = game.danger;
    const speed = Math.max(2.6, p.speed);
    const N = COLS * ROWS;
    const seen = new Uint8Array(N);
    const start = cy * COLS + cx;
    seen[start] = 1;
    const q = [{ i: start, t: 0 }];
    let head = 0;
    let ok = false;

    while (head < q.length && !ok) {
      const cur = q[head++];
      const ccx = cur.i % COLS, ccy = (cur.i - ccx) / COLS;
      if (cur.i !== start && danger[ccy][ccx] === Infinity) { ok = true; break; }
      for (const k in DIRVEC) {
        const d = DIRVEC[k];
        const nx = ccx + d.x, ny = ccy + d.y;
        if (nx < 0 || ny < 0 || nx >= COLS || ny >= ROWS) continue;
        const ni = ny * COLS + nx;
        if (seen[ni]) continue;
        if (game.grid[ny][nx] !== EMPTY) continue;
        if (bombAt(nx, ny)) continue;          // 假想水球在起点，不影响出脚
        const arrive = cur.t + 1 / speed;
        if (arrive + 0.2 > danger[ny][nx]) continue;   // 走到那格时已经炸了
        seen[ni] = 1;
        q.push({ i: ni, t: arrive });
      }
    }

    game.bombs.pop();
    computeDanger();                           // 还原成真实危险图
    return ok;
  }

  function dijkstraDig(sx, sy) {
    const N = COLS * ROWS;
    const dist = new Int32Array(N).fill(1e9);
    const prev = new Int32Array(N).fill(-1);
    const done = new Uint8Array(N);
    const start = sy * COLS + sx;
    dist[start] = 0;
    for (let iter = 0; iter < N; iter++) {
      let best = -1, bestD = 1e9;
      for (let i = 0; i < N; i++) {
        if (!done[i] && dist[i] < bestD) { bestD = dist[i]; best = i; }
      }
      if (best < 0) break;
      done[best] = 1;
      const bx = best % COLS, by = (best - bx) / COLS;
      for (const k in DIRVEC) {
        const d = DIRVEC[k];
        const nx = bx + d.x, ny = by + d.y;
        if (nx < 0 || ny < 0 || nx >= COLS || ny >= ROWS) continue;
        const t = game.grid[ny][nx];
        if (t === STONE) continue;
        if (bombAt(nx, ny)) continue;
        if (game.danger[ny][nx] < 1.2) continue;   // 马上要炸的格子，绕开
        const ni = ny * COLS + nx;
        const cost = t === CRATE ? 7 : 1;
        if (dist[best] + cost < dist[ni]) { dist[ni] = dist[best] + cost; prev[ni] = best; }
      }
    }
    return { dist: dist, prev: prev };
  }

  function isFoe(p, q) {
    return q.alive && q !== p && q.team !== p.team;
  }

  function pickTarget(p, dist) {
    let target = -1, bestScore = Infinity;
    const start = Math.floor(p.y) * COLS + Math.floor(p.x);
    // 目标点不能落在水球爆炸范围里，也不能就是自己脚下（否则路径为空，AI 会原地死循环）
    const usable = i => {
      if (i === start) return false;
      if (dist[i] < 1 || dist[i] >= 1e9) return false;
      const x = i % COLS, y = (i - x) / COLS;
      return game.danger[y][x] === Infinity;
    };

    for (let i = 0; i < game.items.length; i++) {
      const it = game.items[i];
      const idx = it.cy * COLS + it.cx;
      if (usable(idx) && dist[idx] < bestScore) { bestScore = dist[idx]; target = idx; }
    }
    for (let i = 0; i < game.players.length; i++) {
      const q = game.players[i];
      if (!isFoe(p, q)) continue;
      const ex = Math.floor(q.x), ey = Math.floor(q.y);
      const reach = Math.max(1, p.power);
      for (const k in DIRVEC) {
        const d = DIRVEC[k];
        for (let s = 1; s <= reach; s++) {
          const x = ex + d.x * s, y = ey + d.y * s;
          if (x < 1 || y < 1 || x >= COLS - 1 || y >= ROWS - 1) break;
          const t = tileAt(x, y);
          if (t === STONE || t === CRATE) break;
          const idx = y * COLS + x;
          if (usable(idx) && dist[idx] + 3 < bestScore) { bestScore = dist[idx] + 3; target = idx; }
        }
      }
    }
    return target;
  }

  function tryAIbomb(p, cx, cy) {
    if (p.activeBombs >= p.maxBombs) return false;
    if (bombAt(cx, cy)) return false;
    let want = false;
    for (const k in DIRVEC) {
      const d = DIRVEC[k];
      if (tileAt(cx + d.x, cy + d.y) === CRATE) { want = true; break; }
    }
    if (!want) {
      for (const k in DIRVEC) {
        const d = DIRVEC[k];
        for (let i = 1; i <= p.power; i++) {
          const nx = cx + d.x * i, ny = cy + d.y * i;
          const t = tileAt(nx, ny);
          if (t === STONE || t === CRATE) break;
          let found = false;
          for (let j = 0; j < game.players.length; j++) {
            const q = game.players[j];
            if (isFoe(p, q) && Math.floor(q.x) === nx && Math.floor(q.y) === ny) { found = true; break; }
          }
          if (found) { want = true; break; }
        }
        if (want) break;
      }
    }
    if (!want) return false;
    if (!canEscapeAfterBomb(p, cx, cy)) return false;
    return tryPlaceBomb(p);
  }

  function wanderPath(p, cx, cy) {
    const res = bfsFrom(cx, cy, 1.2);
    const opts = [];
    for (let i = 0; i < res.dist.length; i++) if (res.dist[i] > 1) opts.push(i);
    if (!opts.length) return [];
    return buildPath(res.prev, opts[(Math.random() * opts.length) | 0], cx, cy);
  }

  function goalPath(p, cx, cy) {
    const res = bfsFrom(cx, cy, 1.5);
    let target = pickTarget(p, res.dist);
    if (target >= 0) return buildPath(res.prev, target, cx, cy);
    const dg = dijkstraDig(cx, cy);
    target = pickTarget(p, dg.dist);
    if (target >= 0) return buildPath(dg.prev, target, cx, cy);
    return wanderPath(p, cx, cy);
  }

  function followPath(p) {
    if (!p.path || p.path.length === 0) { p.intent = { x: 0, y: 0 }; return; }
    const n = p.path[0];
    // 前方那一格马上就要炸了（而自己脚下还安全），就别再往里踩，作废路径让它重新规划
    const cur = game.danger[Math.floor(p.y)] && game.danger[Math.floor(p.y)][Math.floor(p.x)];
    if (game.danger[n.y][n.x] < 0.55 && cur === Infinity) { p.path = null; p.intent = { x: 0, y: 0 }; return; }
    const tx = n.x + 0.5, ty = n.y + 0.5;
    const dx = tx - p.x, dy = ty - p.y;
    if (Math.abs(dx) > 0.09) p.intent = { x: sign(dx), y: 0 };
    else if (Math.abs(dy) > 0.09) p.intent = { x: 0, y: sign(dy) };
    else { p.path.shift(); p.intent = { x: 0, y: 0 }; }
  }

  function updateAI(p, dt) {
    const cx = Math.floor(p.x), cy = Math.floor(p.y);
    // 只要脚下这格会被炸到（哪怕还有 2 秒），就先跑——否则会走回自己的水球里
    const inDanger = game.danger[cy][cx] < BOMB_TIME + 0.15;
    const speedFactor = 1.35 - p.skill * 0.5;

    if (inDanger) {
      // 选定逃跑路线就一路跑完，不要每帧重算（否则会在两格之间来回横跳）
      if (!p.path || p.path.length === 0) p.path = escapePath(p, cx, cy);
      p.think = 0.1;
      followPath(p);
      return;
    }

    const head = (p.path && p.path.length) ? p.path[0] : null;
    if (head && game.grid[head.y][head.x] === CRATE) {
      const md = Math.abs(head.x - cx) + Math.abs(head.y - cy);
      if (md <= 1) {
        p.path = null;
        if (p.think <= 0) {
          if (tryAIbomb(p, cx, cy)) {
            computeDanger();
            p.path = escapePath(p, cx, cy);
            p.think = 0.3;
          } else {
            p.path = wanderPath(p, cx, cy);
            p.think = 0.8;
          }
        }
      }
    }

    p.think -= dt;
    if (p.think <= 0 && (!p.path || p.path.length === 0)) {
      p.think = (0.16 + Math.random() * 0.12) * speedFactor;
      if (tryAIbomb(p, cx, cy)) {
        computeDanger();
        p.path = escapePath(p, cx, cy);
      } else {
        p.path = goalPath(p, cx, cy);
        // 目标没选出来 / 路径为空，就随便走走，别原地罚站
        if (!p.path || p.path.length === 0) p.path = wanderPath(p, cx, cy);
        if (!p.path || p.path.length === 0) p.think = 0.1;
      }
    }
    followPath(p);
  }

  /* =========================================================
     12. 输入
     ========================================================= */
  const keys = Object.create(null);

  function humanIntent(p) {
    if (p.touch && (p.touch.x || p.touch.y)) {
      if (Math.abs(p.touch.x) >= Math.abs(p.touch.y)) return { x: sign(p.touch.x), y: 0 };
      return { x: 0, y: sign(p.touch.y) };
    }
    for (let i = p.pressOrder.length - 1; i >= 0; i--) {
      const d = p.pressOrder[i];
      if (keys[p.keys[d]]) return DIRVEC[d];
    }
    return { x: 0, y: 0 };
  }

  function handleKeyDown(code) {
    ensureAudio();

    if (game.state === 'title') {
      if (code === 'Space' || code === 'Enter') startStage(1);
      return;
    }
    if (code === 'Escape' || code === 'KeyP') { togglePause(); return; }
    if (game.state === 'clear') { if (code === 'Space' || code === 'Enter') nextStage(); return; }
    if (game.state === 'fail') { if (code === 'Space' || code === 'Enter') retryStage(); return; }
    if (game.state === 'victory') { if (code === 'Space' || code === 'Enter') startStage(1); return; }
    if (game.state === 'roundover') { if (code === 'Space' || code === 'Enter') nextRound(); return; }
    if (game.state === 'matchover') { if (code === 'Space' || code === 'Enter') startVersus(); return; }
    if (game.state !== 'playing' || game.paused) return;

    for (let i = 0; i < game.players.length; i++) {
      const p = game.players[i];
      if (!p.human) continue;
      for (const dirName in DIRVEC) {
        if (p.keys[dirName] === code) {
          p.pressOrder = p.pressOrder.filter(d => d !== dirName);
          p.pressOrder.push(dirName);
        }
      }
      if (p.keys.bomb === code) tryPlaceBomb(p);
    }
  }

  function handleKeyUp(code) {
    for (let i = 0; i < game.players.length; i++) {
      const p = game.players[i];
      if (!p.human) continue;
      for (const dirName in DIRVEC) {
        if (p.keys[dirName] === code) p.pressOrder = p.pressOrder.filter(d => d !== dirName);
      }
    }
  }

  window.addEventListener('keydown', function (e) {
    const block = ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'];
    if (block.indexOf(e.code) >= 0) e.preventDefault();
    keys[e.code] = true;
    if (e.repeat) return;
    handleKeyDown(e.code);
  });
  window.addEventListener('keyup', function (e) {
    keys[e.code] = false;
    handleKeyUp(e.code);
  });

  /* 触屏摇杆 */
  const touchLayer = document.getElementById('touch');
  const stick = document.getElementById('stick');
  const knob = document.getElementById('knob');
  const bombBtn = document.getElementById('bombBtn');

  if ('ontouchstart' in window || navigator.maxTouchPoints > 0) {
    touchLayer.classList.add('on');
    document.body.classList.add('touch-mode');   // 触屏设备上藏掉键盘说明
  }

  let stickId = null;
  function setKnob(dx, dy) { knob.style.transform = 'translate(' + dx + 'px,' + dy + 'px)'; }
  function stickStart(e) {
    e.preventDefault();
    ensureAudio();
    const t = e.changedTouches ? e.changedTouches[0] : e;
    stickId = t.identifier !== undefined ? t.identifier : 'mouse';
    stickMove(e);
  }
  function stickMove(e) {
    if (stickId === null) return;
    e.preventDefault();
    let t = null;
    if (e.changedTouches) {
      for (let i = 0; i < e.changedTouches.length; i++) {
        if (e.changedTouches[i].identifier === stickId) t = e.changedTouches[i];
      }
    } else t = e;
    if (!t) return;
    const r = stick.getBoundingClientRect();
    let dx = t.clientX - (r.left + r.width / 2);
    let dy = t.clientY - (r.top + r.height / 2);
    const max = r.width / 2 - 8;
    const len = Math.hypot(dx, dy);
    if (len > max) { dx = dx / len * max; dy = dy / len * max; }
    setKnob(dx, dy);
    const nx = dx / max, ny = dy / max;
    const p0 = game.players[0];
    if (p0 && p0.human) {
      p0.touch = (Math.abs(nx) < 0.3 && Math.abs(ny) < 0.3) ? { x: 0, y: 0 } : { x: nx, y: ny };
    }
  }
  function stickEnd(e) {
    if (stickId === null) return;
    if (e.changedTouches) {
      let matched = false;
      for (let i = 0; i < e.changedTouches.length; i++) {
        if (e.changedTouches[i].identifier === stickId) matched = true;
      }
      if (!matched) return;
    }
    stickId = null;
    setKnob(0, 0);
    const p0 = game.players[0];
    if (p0) p0.touch = { x: 0, y: 0 };
  }
  stick.addEventListener('touchstart', stickStart, { passive: false });
  stick.addEventListener('touchmove', stickMove, { passive: false });
  stick.addEventListener('touchend', stickEnd);
  stick.addEventListener('touchcancel', stickEnd);
  stick.addEventListener('mousedown', stickStart);
  window.addEventListener('mousemove', function (e) { if (stickId === 'mouse') stickMove(e); });
  window.addEventListener('mouseup', function (e) { if (stickId === 'mouse') stickEnd(e); });
  bombBtn.addEventListener('pointerdown', function (e) {
    e.preventDefault();
    ensureAudio();
    if (game.players[0]) tryPlaceBomb(game.players[0]);
  });

  /* =========================================================
     13. 关卡流程
     ========================================================= */
  function clearEntities() {
    game.bombs = [];
    game.burns = [];
    game.items = [];
    game.particles = [];
    game.shake = 0;
    game.danger = [];
    for (let y = 0; y < ROWS; y++) {
      const row = [];
      for (let x = 0; x < COLS; x++) row.push(Infinity);
      game.danger.push(row);
    }
  }

  function startStage(n) {
    hideAllPanels();
    document.getElementById('titleScreen').classList.add('hide');
    game.mode = 'stage';
    game.state = 'playing';
    game.paused = false;
    game.ending = false;
    game.endTimer = 0;
    game.timeUp = false;
    game.time = 0;
    game.lastLeft = -1;
    game.stage = n;

    const cfg = stageConfig(n);
    game.timeLimit = cfg.time;
    if (n === 1) { game.score = 0; game.kills = 0; }

    const spawns = SPAWN_POINTS.slice(0, cfg.enemies + 1);
    game.grid = generateGrid(cfg.crates, spawns);
    clearEntities();

    game.players = [];
    const hero = makePlayer(game.selected, 0, true, 0);
    game.players.push(hero);
    resetPlayer(hero, spawns[0][0], spawns[0][1]);

    for (let i = 1; i <= cfg.enemies; i++) {
      const idx = (game.selected + i) % CHARS.length;
      const e = makePlayer(idx, 1, false, i);
      e.skill = cfg.skill;
      resetPlayer(e, spawns[i][0], spawns[i][1]);
      game.players.push(e);
    }

    game.introTimer = 1.3;
    updateHud();
  }

  function nextStage() {
    if (game.stage >= TOTAL_STAGES) {
      hideAllPanels();
      game.state = 'victory';
      document.getElementById('victoryDesc').textContent =
        '8 关全部通过！总得分 ' + game.score + ' 分，共打败 ' + game.kills + ' 个对手。';
      showPanel('panel-victory');
      return;
    }
    startStage(game.stage + 1);
  }

  function retryStage() {
    startStage(game.stage);
  }

  function startVersus() {
    hideAllPanels();
    document.getElementById('titleScreen').classList.add('hide');
    game.mode = 'versus';
    game.state = 'playing';
    game.paused = false;
    game.ending = false;
    game.endTimer = 0;
    game.timeUp = false;
    game.time = 0;
    game.lastLeft = -1;
    game.timeLimit = 90;

    const spawns = [[1, ROWS - 2], [COLS - 2, 1]];
    game.grid = generateGrid(0.62, spawns);
    clearEntities();

    game.players = [];
    for (let i = 0; i < 2; i++) {
      const idx = (game.selected + i) % CHARS.length;
      const p = makePlayer(idx, i + 1, true, i);
      resetPlayer(p, spawns[i][0], spawns[i][1]);
      game.players.push(p);
    }
    game.introTimer = 1.3;
    updateHud();
  }

  function nextRound() {
    if (game.state !== 'roundover') return;
    startVersusRound();
  }

  function startVersusRound() {
    hideAllPanels();
    game.state = 'playing';
    game.paused = false;
    game.ending = false;
    game.endTimer = 0;
    game.timeUp = false;
    game.time = 0;
    game.lastLeft = -1;

    const spawns = [[1, ROWS - 2], [COLS - 2, 1]];
    game.grid = generateGrid(0.62, spawns);
    clearEntities();
    for (let i = 0; i < game.players.length; i++) {
      resetPlayer(game.players[i], spawns[i][0], spawns[i][1]);
    }
    game.introTimer = 1.2;
    updateHud();
  }

  /* =========================================================
     14. 更新
     ========================================================= */
  function update(dt) {
    game.time += dt;
    game.shake = Math.max(0, game.shake - dt * 26);
    updateParticles(dt);

    if (game.introTimer > 0) { game.introTimer -= dt; return; }

    const left = Math.max(0, Math.ceil(game.timeLimit - game.time));
    if (left !== game.lastLeft) { game.lastLeft = left; updateTimerChip(left); }

    computeDanger();

    for (let i = 0; i < game.players.length; i++) {
      const p = game.players[i];
      if (!p.alive) continue;
      if (p.isAI) updateAI(p, dt);
      else p.intent = humanIntent(p);
    }

    for (let i = 0; i < game.players.length; i++) {
      const p = game.players[i];
      if (!p.alive) continue;
      const ox = p.x, oy = p.y;
      stepEntity(p, p.intent, dt);
      if (p.isAI) {
        if ((p.intent.x || p.intent.y) && Math.hypot(p.x - ox, p.y - oy) < 0.004) {
          p.stuck += dt;
          if (p.stuck > 0.32) { p.stuck = 0; p.path = null; p.think = 0; }
        } else p.stuck = 0;
      }
    }

    updateBombs(dt);
    updateBurns(dt);
    updateItems(dt);
    checkDamage();
    checkEnd(dt);
  }

  function updateParticles(dt) {
    for (let i = game.particles.length - 1; i >= 0; i--) {
      const pt = game.particles[i];
      pt.life -= dt;
      if (pt.life <= 0) { game.particles.splice(i, 1); continue; }
      pt.vy += 620 * dt;
      pt.x += pt.vx * dt;
      pt.y += pt.vy * dt;
    }
  }

  function checkEnd(dt) {
    if (game.ending) {
      game.endTimer -= dt;
      if (game.endTimer <= 0) {
        game.ending = false;
        if (game.mode === 'stage') {
          if (!game.players[0].alive) doFail();
          else doClear();
        } else {
          doRoundOver();
        }
      }
      return;
    }

    if (game.mode === 'stage') {
      const hero = game.players[0];
      let enemiesAlive = 0;
      for (let i = 1; i < game.players.length; i++) if (game.players[i].alive) enemiesAlive++;
      if (!hero.alive) { game.ending = true; game.endTimer = 1.3; sfx('fail'); return; }
      if (enemiesAlive === 0) { game.ending = true; game.endTimer = 1.1; sfx('clear'); return; }
      if (game.time >= game.timeLimit) { game.ending = true; game.endTimer = 0.8; game.timeUp = true; sfx('fail'); }
      return;
    }

    let alive = [];
    for (let i = 0; i < game.players.length; i++) if (game.players[i].alive) alive.push(game.players[i]);
    if (alive.length <= 1) {
      game.ending = true;
      game.endTimer = 1.2;
      game.roundWinner = alive.length === 1 ? alive[0] : null;
      if (game.roundWinner) {
        game.roundWinner.wins++;
        sfx('clear');
      } else sfx('fail');
      return;
    }
    if (game.time >= game.timeLimit) {
      game.ending = true;
      game.endTimer = 1.0;
      game.roundWinner = null;
      game.timeUp = true;
      sfx('fail');
    }
  }

  function doClear() {
    game.state = 'clear';
    const bonus = 200 + Math.floor((game.timeLimit - game.time) * 2);
    game.score += bonus;
    document.getElementById('clearTitle').textContent = '第 ' + game.stage + ' 关 通过！';
    document.getElementById('clearDesc').textContent =
      '用时 ' + Math.floor(game.time) + ' 秒 · 时间奖励 ' + bonus + ' 分';
    document.getElementById('btnNextStage').textContent =
      game.stage >= TOTAL_STAGES ? '看看结局' : '下一关';
    showPanel('panel-clear');
    updateHud();
  }

  function doFail() {
    game.state = 'fail';
    document.getElementById('failTitle').textContent = game.timeUp ? '时间到，挑战失败' : '被水球炸到了…';
    document.getElementById('failDesc').textContent = '已闯过 ' + (game.stage - 1) + ' 关 · 得分 ' + game.score;
    showPanel('panel-fail');
  }

  function doRoundOver() {
    const w = game.roundWinner;
    const champion = game.players.filter(p => p.wins >= VERSUS_WINS)[0];
    if (champion) {
      game.state = 'matchover';
      document.getElementById('matchTitle').textContent = champion.char.name + ' 获胜！';
      document.getElementById('matchDesc').textContent =
        '比分 ' + game.players.map(p => p.char.name + ' ' + p.wins).join(' : ');
      showPanel('panel-match');
      return;
    }
    game.state = 'roundover';
    document.getElementById('roundIcon').textContent = w ? '🎉' : (game.timeUp ? '⏰' : '😵');
    document.getElementById('roundTitle').textContent = w
      ? (w.char.name + ' 赢下这回合！')
      : (game.timeUp ? '时间到，平局！' : '同归于尽，平局！');
    document.getElementById('roundDesc').textContent =
      game.players.map(p => p.char.name + ' ' + p.wins + ' 胜').join('　');
    showPanel('panel-round');
  }

  /* =========================================================
     15. 绘制：地形
     ========================================================= */
  function roundRect(c, x, y, w, h, r) {
    c.beginPath();
    if (c.roundRect) { c.roundRect(x, y, w, h, r); return; }
    c.moveTo(x + r, y);
    c.arcTo(x + w, y, x + w, y + h, r);
    c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r);
    c.arcTo(x, y, x + w, y, r);
    c.closePath();
  }

  function drawGrassTuft(c, px, py) {
    c.strokeStyle = 'rgba(70,145,55,0.5)';
    c.lineWidth = 1.6;
    c.lineCap = 'round';
    for (let i = 0; i < 3; i++) {
      const ox = px + (i - 1) * 3.2;
      c.beginPath();
      c.moveTo(ox, py);
      c.quadraticCurveTo(ox + (i - 1) * 2, py - 5, ox + (i - 1) * 4, py - 8);
      c.stroke();
    }
  }

  function drawStone(c, px, py) {
    const g = c.createLinearGradient(px, py, px, py + TILE);
    g.addColorStop(0, '#cfd8dd');
    g.addColorStop(0.45, '#aab8c3');
    g.addColorStop(1, '#8b9caa');
    c.fillStyle = g;
    roundRect(c, px + 1, py + 1, TILE - 2, TILE - 2, 9);
    c.fill();
    c.fillStyle = 'rgba(255,255,255,0.5)';
    roundRect(c, px + 5, py + 4, TILE - 10, 9, 4);
    c.fill();
    c.strokeStyle = 'rgba(90,110,125,0.45)';
    c.lineWidth = 1.6;
    c.beginPath();
    c.moveTo(px + 4, py + TILE * 0.52);
    c.lineTo(px + TILE - 4, py + TILE * 0.52);
    c.moveTo(px + TILE * 0.42, py + 4);
    c.lineTo(px + TILE * 0.42, py + TILE * 0.52);
    c.moveTo(px + TILE * 0.72, py + TILE * 0.52);
    c.lineTo(px + TILE * 0.72, py + TILE - 4);
    c.stroke();
    c.fillStyle = 'rgba(60,80,95,0.16)';
    roundRect(c, px + 3, py + TILE - 8, TILE - 6, 5, 3);
    c.fill();
  }

  function drawCrate(c, px, py) {
    c.fillStyle = 'rgba(70,45,20,0.22)';
    roundRect(c, px + 4, py + 6, TILE - 8, TILE - 9, 7);
    c.fill();

    const g = c.createLinearGradient(px, py, px, py + TILE);
    g.addColorStop(0, '#e8b273');
    g.addColorStop(0.5, '#d4944f');
    g.addColorStop(1, '#b87838');
    c.fillStyle = g;
    roundRect(c, px + 2, py + 2, TILE - 4, TILE - 6, 7);
    c.fill();

    c.strokeStyle = '#9a6229';
    c.lineWidth = 2.2;
    roundRect(c, px + 2, py + 2, TILE - 4, TILE - 6, 7);
    c.stroke();

    c.strokeStyle = 'rgba(154,98,41,0.7)';
    c.lineWidth = 3;
    c.beginPath();
    c.moveTo(px + 8, py + 8);
    c.lineTo(px + TILE - 8, py + TILE - 12);
    c.moveTo(px + TILE - 8, py + 8);
    c.lineTo(px + 8, py + TILE - 12);
    c.stroke();

    c.fillStyle = 'rgba(255,235,200,0.45)';
    roundRect(c, px + 6, py + 5, TILE - 12, 5, 2.5);
    c.fill();
  }

  /* =========================================================
     16. 绘制：角色
     ========================================================= */
  function drawCharacter(c, x, y, s, ch, opt) {
    opt = opt || {};
    const t = opt.time || 0;
    const face = opt.face || 'down';
    const walk = opt.walk || 0;
    const blink = opt.blink !== undefined ? opt.blink : (Math.sin(t * 2 + (opt.seed || 0)) > 0.97);

    const headR = 12.2 * s;
    const bodyW = 17 * s;
    const bodyTop = y - 20 * s;
    const bodyBot = y - 5 * s;
    const headY = y - 26.5 * s;

    // 影子
    c.save();
    c.globalAlpha = 0.2;
    c.fillStyle = '#2c4a2c';
    c.beginPath();
    c.ellipse(x, y + 1.5 * s, 12.5 * s, 4.4 * s, 0, 0, Math.PI * 2);
    c.fill();
    c.restore();

    // 后层头发
    c.fillStyle = ch.hair2;
    if (ch.style === 'twin') {
      c.beginPath(); c.ellipse(x - 12.5 * s, headY + 3 * s, 5.5 * s, 8.5 * s, -0.2, 0, Math.PI * 2); c.fill();
      c.beginPath(); c.ellipse(x + 12.5 * s, headY + 3 * s, 5.5 * s, 8.5 * s, 0.2, 0, Math.PI * 2); c.fill();
    } else if (ch.style === 'bob') {
      c.beginPath(); c.ellipse(x, headY + 2 * s, 14 * s, 13.5 * s, 0, 0, Math.PI * 2); c.fill();
    }

    // 脚
    c.fillStyle = ch.body2;
    c.beginPath(); c.ellipse(x - 5 * s, y - 2.5 * s + walk * 1.4 * s, 4.6 * s, 3.2 * s, 0, 0, Math.PI * 2); c.fill();
    c.beginPath(); c.ellipse(x + 5 * s, y - 2.5 * s - walk * 1.4 * s, 4.6 * s, 3.2 * s, 0, 0, Math.PI * 2); c.fill();

    // 身体
    const bg = c.createLinearGradient(x, bodyTop, x, bodyBot);
    bg.addColorStop(0, ch.body);
    bg.addColorStop(1, ch.body2);
    c.fillStyle = bg;
    roundRect(c, x - bodyW / 2, bodyTop, bodyW, bodyBot - bodyTop, 7 * s);
    c.fill();
    c.fillStyle = 'rgba(255,255,255,0.55)';
    c.beginPath();
    c.ellipse(x, bodyBot - 4 * s, 5 * s, 4 * s, 0, 0, Math.PI * 2);
    c.fill();

    // 手
    c.fillStyle = ch.body;
    c.beginPath(); c.ellipse(x - bodyW / 2 - 1, bodyTop + 7 * s - walk * 1.6 * s, 3.6 * s, 4.4 * s, 0.25, 0, Math.PI * 2); c.fill();
    c.beginPath(); c.ellipse(x + bodyW / 2 + 1, bodyTop + 7 * s + walk * 1.6 * s, 3.6 * s, 4.4 * s, -0.25, 0, Math.PI * 2); c.fill();

    // 头
    c.fillStyle = ch.skin;
    c.beginPath(); c.arc(x, headY, headR, 0, Math.PI * 2); c.fill();

    // 头发
    c.fillStyle = ch.hair;
    c.beginPath();
    c.arc(x, headY, headR + 0.6 * s, Math.PI * 1.0, Math.PI * 2.0);
    c.lineTo(x + headR * 0.86, headY + 1.5 * s);
    c.quadraticCurveTo(x, headY - 4 * s, x - headR * 0.86, headY + 1.5 * s);
    c.closePath();
    c.fill();

    if (ch.style === 'spike') {
      c.beginPath();
      c.moveTo(x - 3 * s, headY - headR + 0.5 * s);
      c.lineTo(x - 1 * s, headY - headR - 6 * s);
      c.lineTo(x + 2 * s, headY - headR + 0.5 * s);
      c.closePath(); c.fill();
    } else if (ch.style === 'curl') {
      c.beginPath();
      c.arc(x + 2 * s, headY - headR - 2 * s, 4.2 * s, 0, Math.PI * 2);
      c.fill();
      c.fillStyle = 'rgba(255,255,255,0.35)';
      c.beginPath();
      c.arc(x + 1 * s, headY - headR - 3 * s, 1.8 * s, 0, Math.PI * 2);
      c.fill();
    } else if (ch.style === 'sprout') {
      c.strokeStyle = '#4aa32c';
      c.lineWidth = 2.4 * s;
      c.lineCap = 'round';
      c.beginPath();
      c.moveTo(x, headY - headR + 1 * s);
      c.quadraticCurveTo(x + 1 * s, headY - headR - 5 * s, x - 1 * s, headY - headR - 8 * s);
      c.stroke();
      c.fillStyle = '#6fce4a';
      c.beginPath(); c.ellipse(x - 5 * s, headY - headR - 8 * s, 5 * s, 3 * s, -0.5, 0, Math.PI * 2); c.fill();
      c.beginPath(); c.ellipse(x + 4 * s, headY - headR - 10 * s, 4.5 * s, 2.8 * s, 0.4, 0, Math.PI * 2); c.fill();
    } else if (ch.style === 'bob') {
      c.beginPath();
      c.ellipse(x - headR * 0.92, headY + 2 * s, 3.6 * s, 8 * s, 0.1, 0, Math.PI * 2);
      c.fill();
      c.beginPath();
      c.ellipse(x + headR * 0.92, headY + 2 * s, 3.6 * s, 8 * s, -0.1, 0, Math.PI * 2);
      c.fill();
    }

    // 表情
    const lookX = face === 'left' ? -1.6 * s : face === 'right' ? 1.6 * s : 0;
    const lookY = face === 'up' ? -1.2 * s : face === 'down' ? 0.5 * s : 0;
    const eyeY = headY + 2.2 * s + lookY;
    const eyeX = 4.6 * s;

    if (blink) {
      c.strokeStyle = '#3a3030';
      c.lineWidth = 1.7 * s;
      c.lineCap = 'round';
      c.beginPath();
      c.moveTo(x - eyeX - 2.2 * s + lookX, eyeY); c.lineTo(x - eyeX + 2.2 * s + lookX, eyeY);
      c.moveTo(x + eyeX - 2.2 * s + lookX, eyeY); c.lineTo(x + eyeX + 2.2 * s + lookX, eyeY);
      c.stroke();
    } else {
      c.fillStyle = '#3a3030';
      c.beginPath(); c.ellipse(x - eyeX + lookX, eyeY, 2.7 * s, 3.2 * s, 0, 0, Math.PI * 2); c.fill();
      c.beginPath(); c.ellipse(x + eyeX + lookX, eyeY, 2.7 * s, 3.2 * s, 0, 0, Math.PI * 2); c.fill();
      c.fillStyle = '#ffffff';
      c.beginPath(); c.arc(x - eyeX - 0.9 * s + lookX, eyeY - 1.1 * s, 1 * s, 0, Math.PI * 2); c.fill();
      c.beginPath(); c.arc(x + eyeX - 0.9 * s + lookX, eyeY - 1.1 * s, 1 * s, 0, Math.PI * 2); c.fill();
    }

    c.fillStyle = 'rgba(255,140,160,0.42)';
    c.beginPath(); c.ellipse(x - 8.6 * s, headY + 6.6 * s, 2.9 * s, 2 * s, 0, 0, Math.PI * 2); c.fill();
    c.beginPath(); c.ellipse(x + 8.6 * s, headY + 6.6 * s, 2.9 * s, 2 * s, 0, 0, Math.PI * 2); c.fill();

    c.strokeStyle = '#a8624e';
    c.lineWidth = 1.4 * s;
    c.beginPath();
    c.arc(x, headY + 7 * s, 2.3 * s, 0.18 * Math.PI, 0.82 * Math.PI);
    c.stroke();
  }

  /* =========================================================
     17. 绘制：场景
     ========================================================= */
  function drawBoard(t) {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#9ad96a');
    g.addColorStop(0.5, '#8ccf5b');
    g.addColorStop(1, '#7cc24e');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    for (let y = 0; y < ROWS; y++) {
      for (let x = 0; x < COLS; x++) {
        const px = x * TILE, py = y * TILE;
        ctx.fillStyle = (x + y) % 2 === 0 ? 'rgba(255,255,255,0.10)' : 'rgba(60,120,40,0.06)';
        ctx.fillRect(px, py, TILE, TILE);
      }
    }
    for (let y = 0; y < ROWS; y++) {
      for (let x = 0; x < COLS; x++) {
        if (game.grid[y][x] !== EMPTY) continue;
        if ((x * 7 + y * 11) % 7 === 0) {
          drawGrassTuft(ctx, x * TILE + TILE / 2, y * TILE + TILE * 0.75);
        }
      }
    }
    for (let y = 0; y < ROWS; y++) {
      for (let x = 0; x < COLS; x++) {
        const v = game.grid[y][x];
        if (v === STONE) drawStone(ctx, x * TILE, y * TILE);
        else if (v === CRATE) drawCrate(ctx, x * TILE, y * TILE);
      }
    }
  }

  function drawItems(t) {
    for (let i = 0; i < game.items.length; i++) {
      const it = game.items[i];
      const px = (it.cx + 0.5) * TILE;
      const py = (it.cy + 0.5) * TILE + Math.sin(it.bob) * 2.5;
      const col = it.type === 'bomb' ? '#3fa9ea' : it.type === 'power' ? '#ff8a3d' : '#4fb85c';
      const bgc = it.type === 'bomb' ? '#d9f1ff' : it.type === 'power' ? '#ffe6cf' : '#dff5d8';

      ctx.save();
      ctx.globalAlpha = 0.16;
      ctx.fillStyle = '#1d4a1d';
      ctx.beginPath(); ctx.ellipse(px, py + 15, 11, 4, 0, 0, Math.PI * 2); ctx.fill();
      ctx.restore();

      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.arc(px, py, 13, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = bgc;
      ctx.beginPath(); ctx.arc(px, py, 11.5, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = col;
      ctx.lineWidth = 2.4;
      ctx.beginPath(); ctx.arc(px, py, 12.4, 0, Math.PI * 2); ctx.stroke();

      ctx.fillStyle = col;
      if (it.type === 'bomb') {
        ctx.beginPath(); ctx.arc(px, py + 1.5, 7, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#ffffff';
        ctx.beginPath(); ctx.arc(px - 2.2, py - 1, 2.2, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = col;
        ctx.fillRect(px - 1.6, py - 8, 3.2, 3.4);
      } else if (it.type === 'power') {
        ctx.beginPath();
        ctx.moveTo(px, py - 8);
        ctx.quadraticCurveTo(px + 7, py + 0.5, px + 2.6, py + 7);
        ctx.quadraticCurveTo(px, py + 2.6, px - 2.6, py + 7);
        ctx.quadraticCurveTo(px - 7, py + 0.5, px, py - 8);
        ctx.fill();
        ctx.fillStyle = '#fff3e0';
        ctx.beginPath(); ctx.arc(px, py + 2, 2, 0, Math.PI * 2); ctx.fill();
      } else {
        ctx.beginPath();
        ctx.moveTo(px + 1.5, py - 8);
        ctx.lineTo(px - 6, py + 1.5);
        ctx.lineTo(px - 0.5, py + 1.5);
        ctx.lineTo(px - 2.5, py + 8);
        ctx.lineTo(px + 6, py - 2);
        ctx.lineTo(px + 0.5, py - 2);
        ctx.closePath();
        ctx.fill();
      }
    }
  }

  function drawBurns(t) {
    for (let i = 0; i < game.burns.length; i++) {
      const b = game.burns[i];
      const k = clamp(b.t / BURN_TIME, 0, 1);
      const age = 1 - k;
      const px = (b.cx + 0.5) * TILE;
      const py = (b.cy + 0.5) * TILE;
      const r = TILE * (0.44 + 0.26 * age);
      ctx.save();
      ctx.globalAlpha = clamp(k * 1.7, 0, 1);

      const g = ctx.createRadialGradient(px, py, r * 0.2, px, py, r * 1.25);
      g.addColorStop(0, 'rgba(255,255,255,0.98)');
      g.addColorStop(0.42, 'rgba(150,226,255,0.92)');
      g.addColorStop(0.78, 'rgba(70,175,235,0.5)');
      g.addColorStop(1, 'rgba(70,175,235,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(px, py, r * 1.25, 0, Math.PI * 2); ctx.fill();

      ctx.fillStyle = 'rgba(205,244,255,0.92)';
      for (let s = 0; s < 8; s++) {
        const a = (s * Math.PI) / 4 + t * 1.4;
        const len = r * (1.0 + 0.14 * Math.sin(t * 18 + s));
        const w = 0.17;
        ctx.beginPath();
        ctx.moveTo(px + Math.cos(a - w) * r * 0.55, py + Math.sin(a - w) * r * 0.55);
        ctx.lineTo(px + Math.cos(a) * len, py + Math.sin(a) * len);
        ctx.lineTo(px + Math.cos(a + w) * r * 0.55, py + Math.sin(a + w) * r * 0.55);
        ctx.closePath(); ctx.fill();
      }
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.arc(px, py, r * 0.56, 0, Math.PI * 2); ctx.fill();

      ctx.fillStyle = 'rgba(255,255,255,0.9)';
      for (let s = 0; s < 4; s++) {
        const a = s * 1.7 + t * 2.2;
        ctx.beginPath();
        ctx.arc(px + Math.cos(a) * r * 0.78, py + Math.sin(a) * r * 0.78, 2.2 + (s % 2) * 1.3, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }
  }

  function drawBombs(t) {
    for (let i = 0; i < game.bombs.length; i++) {
      const b = game.bombs[i];
      if (b.dead) continue;
      const px = (b.cx + 0.5) * TILE;
      const py = (b.cy + 0.5) * TILE;
      const ratio = clamp(b.timer / BOMB_TIME, 0, 1);
      const pulse = 1 + Math.sin(t * 11) * 0.05 + (1 - ratio) * 0.14;
      const r = 13.5 * pulse;

      ctx.fillStyle = 'rgba(30,70,50,0.16)';
      ctx.beginPath(); ctx.ellipse(px, py + 14, 12, 4.5, 0, 0, Math.PI * 2); ctx.fill();

      const g = ctx.createRadialGradient(px - 5, py - 7, 2, px, py + 2, r + 3);
      g.addColorStop(0, '#f2fdff');
      g.addColorStop(0.42, '#9ddcff');
      g.addColorStop(1, '#3aa3e6');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(px, py + 1, r, 0, Math.PI * 2); ctx.fill();

      if (ratio < 0.38) {
        const blink = 0.45 + 0.4 * Math.sin(t * 24);
        ctx.globalAlpha = blink * 0.2;
        ctx.fillStyle = '#ff6b6b';
        ctx.beginPath(); ctx.arc(px, py + 1, r, 0, Math.PI * 2); ctx.fill();
        ctx.globalAlpha = blink;
        ctx.strokeStyle = '#ff7a6b';
        ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(px, py + 1, r + 3.4, 0, Math.PI * 2); ctx.stroke();
        ctx.globalAlpha = 1;
      }

      ctx.fillStyle = '#2b8ccb';
      ctx.beginPath();
      ctx.moveTo(px - 3.6, py - r + 1);
      ctx.lineTo(px + 3.6, py - r + 1);
      ctx.lineTo(px, py - r - 5);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = 'rgba(255,255,255,0.88)';
      ctx.beginPath();
      ctx.ellipse(px - r * 0.34, py - r * 0.36, r * 0.26, r * 0.17, -0.6, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.6)';
      ctx.beginPath(); ctx.arc(px + r * 0.3, py + r * 0.34, 2.1, 0, Math.PI * 2); ctx.fill();
    }
  }

  function drawPlayers(t) {
    for (let i = 0; i < game.players.length; i++) {
      const p = game.players[i];
      if (!p.alive) continue;
      const px = p.x * TILE;
      const py = p.y * TILE;
      const walk = p.moving ? Math.sin(p.walkPhase) : 0;
      const bob = p.moving ? 0 : Math.sin(t * 2.2 + p.id * 1.5) * 0.8;
      drawCharacter(ctx, px, py + 14 + bob, 1.02, p.char, {
        time: t, seed: p.id * 1.7, face: p.face, walk: walk
      });
      if (p.human && game.mode === 'versus') {
        ctx.fillStyle = i === 0 ? '#3fa9ea' : '#ff7aa8';
        ctx.beginPath();
        const ty = py - 22;
        ctx.moveTo(px, ty); ctx.lineTo(px - 5, ty - 7); ctx.lineTo(px + 5, ty - 7);
        ctx.closePath(); ctx.fill();
      }
    }
  }

  function drawParticles() {
    for (let i = 0; i < game.particles.length; i++) {
      const pt = game.particles[i];
      const a = clamp(pt.life / pt.max, 0, 1);
      ctx.globalAlpha = a;
      ctx.fillStyle = pt.color;
      ctx.beginPath();
      ctx.arc(pt.x, pt.y, pt.r * (0.6 + a * 0.6), 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawIntroToast() {
    const k = clamp(game.introTimer / 1.3, 0, 1);
    ctx.save();
    ctx.globalAlpha = 0.3 + 0.7 * k;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    let title;
    if (game.mode === 'stage') title = '第 ' + game.stage + ' 关';
    else {
      let r = 1;
      if (game.players.length === 2) r = game.players[0].wins + game.players[1].wins + 1;
      title = '第 ' + r + ' 回合';
    }
    ctx.font = '900 46px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.lineWidth = 9;
    ctx.strokeStyle = 'rgba(255,255,255,0.95)';
    ctx.strokeText(title, W / 2, H / 2 - 18);
    const g = ctx.createLinearGradient(W / 2 - 130, 0, W / 2 + 130, 0);
    g.addColorStop(0, '#3fb0ee');
    g.addColorStop(1, '#ff7fb0');
    ctx.fillStyle = g;
    ctx.fillText(title, W / 2, H / 2 - 18);

    ctx.font = '800 18px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.lineWidth = 6;
    ctx.strokeStyle = 'rgba(255,255,255,0.9)';
    const sub = game.mode === 'stage'
      ? '消灭全部 ' + Math.max(0, game.players.length - 1) + ' 个对手'
      : '先赢 ' + VERSUS_WINS + ' 局';
    ctx.strokeText(sub, W / 2, H / 2 + 26);
    ctx.fillStyle = '#3d7a4f';
    ctx.fillText(sub, W / 2, H / 2 + 26);
    ctx.restore();
  }

  function render(t) {
    ctx.save();
    if (game.shake > 0.2) {
      ctx.translate(rand(-game.shake, game.shake) * 0.42, rand(-game.shake, game.shake) * 0.42);
    }
    drawBoard(t);
    drawItems(t);
    drawBurns(t);
    drawBombs(t);
    drawPlayers(t);
    drawParticles();
    ctx.restore();

    if (game.state === 'playing' && game.introTimer > 0) drawIntroToast();
  }

  /* =========================================================
     18. HUD / 面板
     ========================================================= */
  const hudEl = document.getElementById('hud');
  const overlay = document.getElementById('overlay');
  const panels = document.querySelectorAll('.panel');

  function showPanel(id) {
    overlay.classList.add('show');
    for (let i = 0; i < panels.length; i++) panels[i].hidden = panels[i].id !== id;
  }
  function hideAllPanels() {
    overlay.classList.remove('show');
    for (let i = 0; i < panels.length; i++) panels[i].hidden = true;
  }

  function updateHud() {
    if (!game.players.length || game.state === 'title') { hudEl.innerHTML = ''; return; }
    if (game.mode === 'stage') {
      let alive = 0;
      for (let i = 1; i < game.players.length; i++) if (game.players[i].alive) alive++;
      hudEl.innerHTML =
        '<div class="chip stage">第 ' + game.stage + '/' + TOTAL_STAGES + ' 关</div>' +
        '<div class="chip enemy">敌人 ' + alive + '</div>' +
        '<div class="chip">得分 ' + game.score + '</div>' +
        '<div class="chip timer" id="timerChip">⏱ --</div>';
    } else {
      let html = '';
      for (let i = 0; i < game.players.length; i++) {
        const p = game.players[i];
        html += '<div class="chip' + (p.alive ? '' : ' dead') + '">' +
          '<span class="dot" style="background:' + p.char.body + '"></span>' +
          p.char.name + '<span class="wins">' + '★'.repeat(p.wins) + '</span></div>';
      }
      html += '<div class="chip timer" id="timerChip">⏱ --</div>';
      hudEl.innerHTML = html;
    }
    updateTimerChip(Math.max(0, Math.ceil(game.timeLimit - game.time)));
  }

  function updateTimerChip(left) {
    const el = document.getElementById('timerChip');
    if (!el) return;
    el.textContent = '⏱ ' + left;
    if (left <= 20) el.classList.add('warn');
    else el.classList.remove('warn');
  }

  function togglePause() {
    if (game.state !== 'playing') return;
    game.paused = !game.paused;
    if (game.paused) showPanel('panel-pause');
    else hideAllPanels();
    sfx('ui');
  }

  /* =========================================================
     19. 标题页角色
     ========================================================= */
  const charRow = document.getElementById('charRow');
  const charDesc = document.getElementById('charDesc');
  const pickCells = [];

  CHARS.forEach(function (ch, i) {
    const cell = document.createElement('div');
    cell.className = 'pick-cell';
    cell.title = ch.name;
    const cv = document.createElement('canvas');
    const size = 108;
    cv.width = size;
    cv.height = size;
    drawCharacter(cv.getContext('2d'), size / 2, size * 0.9, 1.9, ch, { time: 0, seed: i, blink: false, face: 'down' });
    cell.appendChild(cv);
    cell.addEventListener('click', function () {
      ensureAudio();
      sfx('ui');
      game.selected = i;
      pickCells.forEach(function (el, j) { el.classList.toggle('on', j === i); });
      charDesc.textContent = ch.desc;
    });
    charRow.appendChild(cell);
    pickCells.push(cell);
    if (i === 0) cell.classList.add('on');
  });

  /* =========================================================
     20. 按钮
     ========================================================= */
  document.getElementById('btnStage').addEventListener('click', function () { ensureAudio(); startStage(1); });
  document.getElementById('btnVersus').addEventListener('click', function () { ensureAudio(); startVersus(); });
  document.getElementById('btnNextStage').addEventListener('click', function () { ensureAudio(); nextStage(); });
  document.getElementById('btnRetry').addEventListener('click', function () { ensureAudio(); retryStage(); });
  document.getElementById('btnReplay').addEventListener('click', function () { ensureAudio(); startStage(1); });
  document.getElementById('btnNextRound').addEventListener('click', function () { ensureAudio(); nextRound(); });
  document.getElementById('btnRematch').addEventListener('click', function () { ensureAudio(); startVersus(); });
  document.getElementById('btnResume').addEventListener('click', togglePause);
  document.getElementById('btnPause').addEventListener('click', function () { ensureAudio(); togglePause(); });

  function backToTitle() {
    hideAllPanels();
    game.state = 'title';
    game.paused = false;
    game.players = [];
    document.getElementById('titleScreen').classList.remove('hide');
    hudEl.innerHTML = '';
  }
  document.getElementById('btnQuit1').addEventListener('click', backToTitle);
  document.getElementById('btnQuit2').addEventListener('click', backToTitle);
  document.getElementById('btnQuit3').addEventListener('click', backToTitle);
  document.getElementById('btnQuit4').addEventListener('click', backToTitle);

  const btnSound = document.getElementById('btnSound');
  btnSound.addEventListener('click', function () {
    muted = !muted;
    btnSound.textContent = muted ? '🔇' : '🔊';
    if (!muted) { ensureAudio(); sfx('ui'); }
  });

  /* =========================================================
     21. 循环
     ========================================================= */
  let lastTs = 0;
  function frame(ts) {
    if (!lastTs) lastTs = ts;
    let dt = (ts - lastTs) / 1000;
    lastTs = ts;
    dt = Math.min(dt, 0.05);

    if (game.state === 'playing' && !game.paused) {
      update(dt);
    } else if (game.players.length) {
      updateParticles(dt);
      updateBurns(dt);
      game.shake = Math.max(0, game.shake - dt * 26);
    }
    if (game.state !== 'title') render(ts / 1000);
    requestAnimationFrame(frame);
  }

  game.grid = generateGrid(0.6, SPAWN_POINTS.slice(0, 2));
  for (let y = 0; y < ROWS; y++) {
    const row = [];
    for (let x = 0; x < COLS; x++) row.push(Infinity);
    game.danger.push(row);
  }
  requestAnimationFrame(frame);

  window.__PB__ = {
    game: game,
    startStage: startStage,
    startVersus: startVersus,
    nextStage: nextStage,
    nextRound: nextRound,
    retryStage: retryStage,
    backToTitle: backToTitle,
    togglePause: togglePause,
    CHARS: CHARS
  };

  // 切到后台（手机点开别的应用 / 浏览器切标签页）自动暂停，回来不会莫名其妙被打死
  document.addEventListener('visibilitychange', function () {
    if (document.hidden && game.state === 'playing' && !game.paused) togglePause();
  });

})();
</script>
</body>
</html>
