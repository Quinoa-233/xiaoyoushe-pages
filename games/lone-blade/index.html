// ---- 火柴人渲染（程序化骨骼 v2，GDD §1） ----
// 姿态格式：armF/armB = [上臂角, 小臂角]（0=前方，正=向下，两段臂带肘关节）
//           wrist = 刀刃相对小臂的偏角 → 刀刃角 = 小臂角 + wrist，刀随手转
//           legs  = [[脚x偏移, 抬脚], ...] 两段腿，膝盖前凸
const easeOut = q => 1 - (1 - q) * (1 - q);
const easeOutQuart = q => 1 - Math.pow(1 - q, 4);
function drawStick(x, groundY, facing, color, scale, pose, flash, extra){
  const s = 90 * scale;             // 身高
  const hipY = groundY - s * 0.45;
  const shY = groundY - s * 0.82;   // 肩
  const headR = s * 0.11;
  const headY = groundY - s * 0.95;
  const P = pose;
  const leanX = (P.lean || 0) * s * 0.05;
  ctx.save();
  ctx.translate(x, 0);
  ctx.scale(facing, 1);
  ctx.strokeStyle = flash > 0 ? "#ffffff" : color;
  ctx.fillStyle = flash > 0 ? "#ffffff" : color;
  ctx.lineWidth = Math.max(3, 5 * scale);
  ctx.lineCap = "round";
  const L = (x1, y1, x2, y2) => { ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); };
  // 躯干 + 头
  L(leanX, shY, leanX * 0.6, hipY);
  ctx.beginPath(); ctx.arc(leanX * 1.1, headY, headR, 0, Math.PI * 2); ctx.stroke();
  // 两段腿（膝盖朝前凸 → 自然站姿/跑姿）
  const legs = P.legs || [[-0.13, 0.02], [0.17, 0]];
  const hipX = leanX * 0.6;
  for (const lg of legs) {
    const fx = hipX + lg[0] * s * 0.34;
    const fy = groundY - (lg[1] || 0) * s * 0.3;
    const kx = (hipX + fx) / 2 + s * 0.09;
    const ky = (hipY + fy) / 2 - (lg[1] || 0) * s * 0.1;
    L(hipX, hipY, kx, ky); L(kx, ky, fx, fy);
  }
  // 双手重兵器：玩家重剑 / BOSS 巨斧后臂同握
  const twoHanded = P.weapon === "heavy" || P.weapon === "eaxe";
  const armF = P.armF || [0.8, 1.1];
  const armB = twoHanded ? [armF[0] - 0.3, armF[1] - 0.14] : (P.armB || [0.95, 1.25]);
  const handB = limb(armB);   // 后手坐标（弓弦终点跟后手走）
  const hand = limb(armF);
  if (P.weapon) {
    // 刀刃/枪杆由小臂角驱动；弓垂直持握（内部自绘，不用腕角）
    const wang = P.weapon === "bow" ? armF[1] + 1.45 : armF[1] + (P.wrist === undefined ? -0.15 : P.wrist);
    drawWeapon(hand.x, hand.y, wang, P.weapon, scale, extra && extra.charged, extra && extra.nocked, handB, extra);
  }
  ctx.restore();

  function limb(angs){
    const a1 = angs[0], a2 = angs[1];
    const ex = leanX + Math.cos(a1) * s * 0.28, ey = shY + Math.sin(a1) * s * 0.28;
    const hx = ex + Math.cos(a2) * s * 0.27, hy = ey + Math.sin(a2) * s * 0.27;
    L(leanX, shY, ex, ey); L(ex, ey, hx, hy);
    return { x: hx, y: hy };
  }
}
// 武器沿小臂方向（刀刃角）绘制：刀真的"握在手里并随手转"；弓为竖直持握（不受腕角旋转）
// 外观随锻造等级进化（颜值系统）：0 凡铁 → 1 青锋 → 2 赤金 → 3 寒光 → 4 紫电 → 5 神兵
function drawWeapon(hx, hy, ang, type, scale, charged, nocked, handB, extra){
  const wkey = type === "heavy" ? "sword" : type;
  const tier = clamp(SAVE.wLv[wkey] || 0, 0, 5);
  const isMax = tier >= 5;
  const glow = tier >= 3;                      // 寒光起自带辉光
  const glowCol = TIER_COLOR[tier];
  ctx.save();
  ctx.translate(hx, hy);
  if (type !== "bow") ctx.rotate(ang);
  if (type === "sword" || type === "heavy"){
    const heavy = type === "heavy";
    const len = (heavy ? 100 : 80) * scale * (1 + tier * 0.09);     // 锻造加长刀身
    const wd = Math.max(3, (heavy ? 6.5 : 4.5) * scale) * (1 + tier * 0.06);
    // 高阶辉光：刀身外圈品阶色光晕
    if (glow) {
      ctx.save();
      ctx.globalAlpha = 0.30 + 0.14 * Math.sin(nowSec * 10);
      ctx.strokeStyle = glowCol; ctx.lineWidth = 7;
      ctx.lineCap = "round";
      ctx.beginPath(); ctx.moveTo(4, 0); ctx.lineTo(len, 0); ctx.stroke();
      ctx.restore();
    }
    // 刀柄 + 护手（高阶：缠绳纹 + 兽首护手）
    ctx.strokeStyle = tier >= 2 ? "#5a4028" : "#8a6f4d"; ctx.lineWidth = Math.max(3, 4 * scale);
    ctx.beginPath(); ctx.moveTo(-15 * scale, 0); ctx.lineTo(0, 0); ctx.stroke();
    if (tier >= 1) {   // 柄绳
      ctx.strokeStyle = tier >= 4 ? "#8a6fb0" : "#a08868"; ctx.lineWidth = 1.4;
      for (let i = 0; i < 4; i++) { ctx.beginPath(); ctx.moveTo(-13 * scale + i * 3.2, -2.4); ctx.lineTo(-10.5 * scale + i * 3.2, 2.4); ctx.stroke(); }
    }
    ctx.strokeStyle = tier >= 3 ? glowCol : "#c9b08a"; ctx.lineWidth = Math.max(2.5, 3 * scale) * (tier >= 2 ? 1.25 : 1);
    if (tier >= 4) {   // 神兵/紫电：菱形大护手
      ctx.beginPath(); ctx.moveTo(0, -15 * scale); ctx.lineTo(5 * scale, 0); ctx.lineTo(0, 15 * scale); ctx.lineTo(-5 * scale, 0); ctx.closePath(); ctx.stroke();
    } else {
      ctx.beginPath(); ctx.moveTo(0, -11 * scale); ctx.lineTo(0, 11 * scale); ctx.stroke();
    }
    // 刃：梯形刀身 + 品阶脊线；蓄力 / 神兵炽亮
    const bodyCol = charged ? "rgba(255,238,85,0.92)" : (tier === 0 ? "rgba(230,236,246,0.9)" : "rgba(" + hex2rgb(TIER_COLOR[tier]) + ",0.88)");
    ctx.beginPath();
    ctx.moveTo(2 * scale, -wd * 0.75);
    ctx.lineTo(len * 0.55, -wd * 0.95);
    ctx.lineTo(len, 0);
    ctx.lineTo(len * 0.55, wd * 0.95);
    ctx.lineTo(2 * scale, wd * 0.75);
    ctx.closePath();
    ctx.fillStyle = bodyCol;
    ctx.fill();
    ctx.strokeStyle = charged ? "#ffee55" : (tier === 0 ? "#e8edf5" : TIER_COLOR[tier]); ctx.lineWidth = 1.5; ctx.stroke();
    ctx.strokeStyle = tier >= 2 ? glowCol : "#ffffff"; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(6 * scale, -1); ctx.lineTo(len * 0.88, -2.5); ctx.stroke();
    if (tier >= 3) {   // 寒光以上：刃口流光
      ctx.save();
      ctx.globalAlpha = 0.6 + 0.35 * Math.sin(nowSec * 14);
      ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.moveTo(len * 0.3, -wd * 0.7); ctx.lineTo(len * 0.92, 0); ctx.stroke();
      ctx.restore();
    }
    if (isMax) {       // 神兵：刃尖星芒
      ctx.save();
      ctx.globalAlpha = 0.5 + 0.4 * Math.sin(nowSec * 8);
      ctx.strokeStyle = "#ffe66e"; ctx.lineWidth = 1.8;
      ctx.beginPath(); ctx.moveTo(len, 0); ctx.lineTo(len + 14, 0); ctx.stroke();
      ctx.beginPath(); ctx.arc(len, 0, 5, 0, Math.PI * 2); ctx.stroke();
      ctx.restore();
    }
  } else if (type === "spear"){
    const t = tier;
    const shaftLen = 108 * scale * (1 + t * 0.06);
    const skillOn = player.state === "lunge" || player.state === "sweep" || player.state === "drop";
    // 高阶辉光
    if (t >= 3 || skillOn) {
      ctx.save();
      ctx.globalAlpha = (skillOn ? 0.42 : 0.28) + 0.12 * Math.sin(nowSec * 10);
      ctx.strokeStyle = skillOn ? "#a0ffd0" : glowCol; ctx.lineWidth = skillOn ? 9 : 6; ctx.lineCap = "round";
      ctx.beginPath(); ctx.moveTo(20 * scale, 0); ctx.lineTo(shaftLen + 18 * scale, 0); ctx.stroke();
      ctx.restore();
    }
    // 杆：暗描边 + 亮芯（双线，比单线厚一档）
    ctx.strokeStyle = "#3a3038"; ctx.lineWidth = Math.max(5, 5.6 * scale); ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(-34 * scale, 0); ctx.lineTo(shaftLen, 0); ctx.stroke();
    ctx.strokeStyle = t >= 1 ? (t >= 4 ? "#8a76b0" : "#a8875e") : "#b89a70"; ctx.lineWidth = Math.max(3, 3.4 * scale);
    ctx.beginPath(); ctx.moveTo(-34 * scale, 0); ctx.lineTo(shaftLen, 0); ctx.stroke();
    ctx.save();   // 杆身高光
    ctx.globalAlpha = 0.5; ctx.strokeStyle = t >= 3 ? "#ffffff" : "#f4e6cc"; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(0, -1.5 * scale); ctx.lineTo(shaftLen - 6, -1.5 * scale); ctx.stroke();
    ctx.restore();
    // 枪鐏（杆尾铁锥）
    ctx.fillStyle = "#8a9099";
    ctx.beginPath(); ctx.moveTo(-34 * scale, 0); ctx.lineTo(-46 * scale, -3 * scale); ctx.lineTo(-46 * scale, 3 * scale); ctx.closePath(); ctx.fill();
    if (t >= 2) {   // 赤金以上：枪杆缠纹
      ctx.strokeStyle = glowCol; ctx.lineWidth = 1.2;
      for (let i = 0; i < 5; i++) { const px = (30 + i * 14) * scale; ctx.beginPath(); ctx.moveTo(px, -3); ctx.lineTo(px + 8, 3); ctx.stroke(); }
    }
    // 红缨：青锋起有，神兵变金缨；技能中加长飘动
    if (t >= 1 || skillOn) {
      const flow = skillOn ? 1.8 : 1;
      ctx.strokeStyle = t >= 5 ? "#ffe66e" : "#d64141"; ctx.lineWidth = 2.2;
      for (let i = 0; i < 5; i++) {
        ctx.globalAlpha = 0.55 + i * 0.09;
        ctx.beginPath(); ctx.moveTo(shaftLen - 6, 0);
        ctx.quadraticCurveTo(shaftLen + 4 + i * 4, (-7 - i * 3) * flow, shaftLen + 10 + i * 8, (5 + i * 6) * flow);
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
    }
    // 枪尖：菱形双翼 + 高阶流光
    const tipCol = t === 0 ? "#dfe4ea" : TIER_COLOR[t];
    ctx.fillStyle = tipCol;
    ctx.beginPath(); ctx.moveTo(shaftLen, 0); ctx.lineTo(shaftLen + 19 * scale, -3.5 * scale); ctx.lineTo(shaftLen + 19 * scale, 3.5 * scale); ctx.closePath(); ctx.fill();
    if (t >= 2 || skillOn) {   // 双翼倒钩
      ctx.fillStyle = ctx.strokeStyle = t >= 4 ? glowCol : "#c8d4e0";
      ctx.globalAlpha = 0.9;
      ctx.beginPath(); ctx.moveTo(shaftLen + 4, 0); ctx.lineTo(shaftLen + 14 * scale, -9 * scale); ctx.lineTo(shaftLen + 17 * scale, -2 * scale); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(shaftLen + 4, 0); ctx.lineTo(shaftLen + 14 * scale, 9 * scale); ctx.lineTo(shaftLen + 17 * scale, 2 * scale); ctx.closePath(); ctx.fill();
      ctx.globalAlpha = 1;
    }
    // 枪锋白线 + 尖端点光
    ctx.strokeStyle = "#ffffff"; ctx.lineWidth = t >= 3 ? 1.6 : 1;
    ctx.globalAlpha = 0.7 + 0.3 * Math.sin(nowSec * 14);
    ctx.beginPath(); ctx.moveTo(shaftLen + 2, 0); ctx.lineTo(shaftLen + 19 * scale, 0); ctx.stroke();
    ctx.globalAlpha = 1;
    if (t >= 3 || skillOn) {
      ctx.fillStyle = "#ffffff";
      ctx.globalAlpha = 0.5 + 0.4 * Math.sin(nowSec * 16);
      ctx.beginPath(); ctx.arc(shaftLen + 20 * scale, 0, 2.4, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
    }
  } else if (type === "shield"){
    const sh = extra || {};
    const crack = clamp(sh.shieldDmg || 0, 0, 1);   // 0 完好 → 1 濒碎
    if (sh.shieldBroken) {
      // 破盾后：只剩半片锯齿残骸（暗色、断口），随手臂晃动
      ctx.save();
      ctx.globalAlpha = 0.55;
      ctx.fillStyle = "#262c34"; ctx.strokeStyle = "#4a525c"; ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.moveTo(12 * scale, -26 * scale);
      ctx.lineTo(21 * scale, -14 * scale);
      ctx.lineTo(15 * scale, -5 * scale);
      ctx.lineTo(22 * scale, 5 * scale);
      ctx.lineTo(13 * scale, 12 * scale);
      ctx.lineTo(16 * scale, 1 * scale);
      ctx.lineTo(10 * scale, -9 * scale);
      ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.restore();
    } else {
      // 盾面被击时的白闪 + 损伤加深配色
      const hot = (sh.shieldFlash || 0) > 0;
      const base = hot ? "#c8d6ea" : (crack > 0.6 ? "#2e343c" : "#39424e");
      ctx.fillStyle = base; ctx.strokeStyle = hot ? "#ffffff" : (crack > 0.6 ? "#55606c" : "#66707c"); ctx.lineWidth = 2;
      ctx.beginPath(); ctx.ellipse(16 * scale, 0, 10 * scale, 34 * scale, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      // 盾心铆钉
      ctx.fillStyle = hot ? "#ffffff" : "#8892a0"; ctx.beginPath(); ctx.arc(16 * scale, 0, 3.5 * scale, 0, Math.PI * 2); ctx.fill();
      // 裂纹：随耐久下降逐条出现（3 条）
      if (crack > 0.25) {
        ctx.strokeStyle = "#0f1318"; ctx.lineWidth = 1.6; ctx.lineCap = "round";
        const cracks = [
          [[14, -24], [19, -14], [12, -6]],
          [[18, 6], [11, 14], [17, 24]],
          [[15, -12], [21, -8], [16, 0]],
        ];
        const nCrack = crack > 0.75 ? 3 : (crack > 0.5 ? 2 : 1);
        for (let i = 0; i < nCrack; i++) {
          ctx.beginPath();
          cracks[i].forEach((pt, j) => { const X = pt[0] * scale, Y = pt[1] * scale; j ? ctx.lineTo(X, Y) : ctx.moveTo(X, Y); });
          ctx.stroke();
        }
      }
      // 高伤时盾面发抖（濒碎提示）
      if (crack > 0.7) {
        ctx.globalAlpha = 0.25 + 0.2 * Math.sin(nowSec * 22);
        ctx.strokeStyle = "#ff6644"; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.ellipse(16 * scale, 0, 12 * scale, 36 * scale, 0, 0, Math.PI * 2); ctx.stroke();
        ctx.globalAlpha = 1;
      }
    }
  } else if (type === "eblade"){
    // 敌·刀客朴刀：宽刃弯背、圆盘护手、铁灰带锈——与玩家武士刀形制区分（v0.5）
    ctx.strokeStyle = "#6b5a44"; ctx.lineWidth = Math.max(3.5, 4.5 * scale);
    ctx.beginPath(); ctx.moveTo(-14 * scale, 0); ctx.lineTo(0, 0); ctx.stroke();
    ctx.fillStyle = "#8a8074";
    ctx.beginPath(); ctx.arc(2 * scale, 0, 4.5 * scale, 0, Math.PI * 2); ctx.fill();
    const len = 66 * scale, wd = 11 * scale;
    ctx.beginPath();
    ctx.moveTo(3 * scale, -wd * 0.55);
    ctx.quadraticCurveTo(len * 0.45, -wd * 1.5, len, -wd * 0.35);
    ctx.lineTo(len * 0.96, wd * 0.5);
    ctx.quadraticCurveTo(len * 0.4, wd * 1.1, 3 * scale, wd * 0.55);
    ctx.closePath();
    ctx.fillStyle = "rgba(196,188,172,0.85)"; ctx.fill();
    ctx.strokeStyle = "#b8ac96"; ctx.lineWidth = 1.4; ctx.stroke();
    ctx.strokeStyle = "#5a5044"; ctx.lineWidth = 1.2;   // 血槽
    ctx.beginPath(); ctx.moveTo(8 * scale, -2); ctx.lineTo(len * 0.8, -wd * 0.35); ctx.stroke();
  } else if (type === "efork"){
    // 敌·枪兵猎叉：双尖叉 + 红缨——与玩家长枪形制区分（v0.5）
    ctx.strokeStyle = "#7a5f42"; ctx.lineWidth = Math.max(3.5, 4 * scale);
    const L0 = 120 * scale;
    ctx.beginPath(); ctx.moveTo(-30 * scale, 0); ctx.lineTo(L0, 0); ctx.stroke();
    ctx.strokeStyle = "#a83226"; ctx.lineWidth = 2;   // 缨
    for (let i = 0; i < 3; i++) {
      ctx.beginPath(); ctx.moveTo(L0 - 6, 0);
      ctx.quadraticCurveTo(L0 + 2 + i * 3, -5 - i * 4, L0 + 8 + i * 6, 3 + i * 4);
      ctx.stroke();
    }
    ctx.strokeStyle = "#c2b8a4"; ctx.lineWidth = Math.max(2.5, 3 * scale); ctx.lineCap = "round";
    const tipLen = 22 * scale, spread = 13 * scale;
    ctx.beginPath(); ctx.moveTo(L0, 0); ctx.lineTo(L0 + tipLen, 0); ctx.stroke();                    // 中尖
    ctx.beginPath(); ctx.moveTo(L0, -spread * 0.2); ctx.lineTo(L0 + 4 * scale, -spread); ctx.lineTo(L0 + tipLen * 0.92, -spread); ctx.stroke();   // 上叉
    ctx.beginPath(); ctx.moveTo(L0, spread * 0.2); ctx.lineTo(L0 + 4 * scale, spread); ctx.lineTo(L0 + tipLen * 0.92, spread); ctx.stroke();       // 下叉
  } else if (type === "eaxe"){
    // 敌·BOSS 巨斧：月牙斧刃 + 斧面血符——与玩家重剑形制区分（v0.5；v0.6 缩到人形合比例）
    ctx.strokeStyle = "#5f5040"; ctx.lineWidth = Math.max(4.5, 5 * scale);
    const L0 = 92 * scale;
    ctx.beginPath(); ctx.moveTo(-34 * scale, 0); ctx.lineTo(L0, 0); ctx.stroke();
    ctx.fillStyle = "#9aa2ad"; ctx.strokeStyle = "#c8d2dc"; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(L0 - 5, -4 * scale);
    ctx.quadraticCurveTo(L0 + 30 * scale, -26 * scale, L0 + 33 * scale, 0);
    ctx.quadraticCurveTo(L0 + 30 * scale, 26 * scale, L0 - 5, 4 * scale);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = "rgba(178,40,36,0.85)";   // 斧面血符
    ctx.beginPath(); ctx.arc(L0 + 12 * scale, 0, 4.5 * scale, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#f0e0c8"; ctx.fillRect(L0 + 10 * scale, -2.5 * scale, 4 * scale, 5 * scale);
  } else if (type === "bow"){
    // 竖直长弓：弓梢上下、弓身弧向前凸；弦端点连到后手实际位置 → 拉弦动作由骨骼驱动
    // 锻造进化：0 木弓 → 1 角弓（青纹）→ 2 赤铜弓 → 3 铁脊弓（辉光）→ 4 紫檀弓 → 5 神臂弓
    const t = tier;
    const R = 42 * scale * (1 + t * 0.05);
    const cx = 4 * scale;
    const tipY = R * 0.91;
    const limbCol = t === 0 ? "#a8825a" : (charged ? "#9fe8ff" : TIER_COLOR[t]);
    if (t >= 3) {   // 铁脊以上：弓身辉光
      ctx.save();
      ctx.globalAlpha = 0.30 + 0.14 * Math.sin(nowSec * 10);
      ctx.strokeStyle = glowCol; ctx.lineWidth = 8; ctx.lineCap = "round";
      ctx.beginPath(); ctx.arc(cx - R * 0.42, 0, R, -1.15, 1.15); ctx.stroke();
      ctx.restore();
    }
    ctx.strokeStyle = limbCol; ctx.lineWidth = Math.max(3, 4 * scale) * (1 + t * 0.08); ctx.lineCap = "round";
    ctx.beginPath(); ctx.arc(cx - R * 0.42, 0, R, -1.15, 1.15); ctx.stroke();
    // v0.7：弓臂高光（内圈细亮线）——双线描边让木弓也有金属质感
    ctx.save();
    ctx.globalAlpha = 0.55;
    ctx.strokeStyle = t >= 3 ? "#ffffff" : "#f0e2c4"; ctx.lineWidth = 1.3;
    ctx.beginPath(); ctx.arc(cx - R * 0.42, 0, R - 3.2 * scale, -1.05, 1.05); ctx.stroke();
    ctx.restore();
    // 弓把缠绳：中央一小段加粗深色 + 三道缠纹
    ctx.strokeStyle = t >= 2 ? "#4a3a2a" : "#6b503a"; ctx.lineWidth = Math.max(4, 6 * scale);
    ctx.beginPath(); ctx.arc(cx - R * 0.42, 0, R, -0.17, 0.17); ctx.stroke();
    ctx.strokeStyle = t >= 4 ? glowCol : "#d8c9a0"; ctx.lineWidth = 1.1;
    for (let i = -1; i <= 1; i++) {
      ctx.beginPath();
      ctx.arc(cx - R * 0.42, 0, R + 1.5, i * 0.085 - 0.03, i * 0.085 + 0.03);
      ctx.stroke();
    }
    if (t >= 1) {   // 角弓以上：反曲弓梢 + 缠筋纹
      ctx.strokeStyle = t >= 2 ? glowCol : "#e8dcc0"; ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.moveTo(cx, -tipY); ctx.lineTo(cx + 9 * scale, -tipY - 8 * scale); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(cx, tipY); ctx.lineTo(cx + 9 * scale, tipY + 8 * scale); ctx.stroke();
      for (let i = 0; i < 3; i++) {
        const ay = (i + 1) * R * 0.28;
        ctx.beginPath(); ctx.moveTo(cx - 6 * scale, -ay); ctx.lineTo(cx - 12 * scale, -ay - 6); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(cx - 6 * scale, ay); ctx.lineTo(cx - 12 * scale, ay + 6); ctx.stroke();
      }
    }
    if (t >= 5) {   // 神臂弓：弓心星辉
      ctx.save();
      ctx.globalAlpha = 0.5 + 0.4 * Math.sin(nowSec * 8);
      ctx.strokeStyle = "#ffe66e"; ctx.lineWidth = 1.8;
      ctx.beginPath(); ctx.arc(cx, 0, 7, 0, Math.PI * 2); ctx.stroke();
      ctx.restore();
    }
    // 弦：上弓梢 → 弦扣（后手）→ 下弓梢；未拉弦时竖直
    let nockX = cx, nockY = 0;
    if (handB) {
      const bx = handB.x - hx, by = handB.y - hy;
      if (bx < cx) { nockX = Math.max(bx, cx - 26 * scale); nockY = clamp(by, -9 * scale, 9 * scale); }
    }
    ctx.strokeStyle = t >= 3 ? "#dfe8ff" : "#e8e0cc"; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(cx, -tipY); ctx.lineTo(nockX, nockY); ctx.lineTo(cx, tipY); ctx.stroke();
    // 搭弦之箭：从弦扣沿水平向前（高阶箭矢染色）
    if (nocked) {
      const acol = t >= 2 ? TIER_COLOR[t] : "#d8c9a0";
      ctx.strokeStyle = charged ? "#ffee88" : acol; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.moveTo(nockX, nockY); ctx.lineTo(cx + 46 * scale, 0); ctx.stroke();
      ctx.fillStyle = charged ? "#ffee88" : (t >= 2 ? TIER_COLOR[t] : "#eef2f7");
      ctx.beginPath(); ctx.moveTo(cx + 46 * scale, 0); ctx.lineTo(cx + 58 * scale, -4 * scale); ctx.lineTo(cx + 58 * scale, 4 * scale); ctx.closePath(); ctx.fill();
    }
    // 蓄力满：弓身青辉
    if (charged) {
      ctx.globalAlpha = 0.45 + 0.25 * Math.sin(nowSec * 18);
      ctx.strokeStyle = "#9fe8ff"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(cx - R * 0.42, 0, R + 8, -1.0, 1.0); ctx.stroke();
      ctx.globalAlpha = 1;
    }
  }
  ctx.restore();
}
function hex2rgb(h){
  return parseInt(h.slice(1, 3), 16) + "," + parseInt(h.slice(3, 5), 16) + "," + parseInt(h.slice(5, 7), 16);
}

// ---- 挥刀弧线表：小臂角从 startA（举刀）扫到 endA（劈落），刀刃跟随 ----
const SWINGS = {
  1:     { startA: -2.10, endA: 0.55, lean0: -0.40, lean1: 1.50, wrist: -0.10 },
  2:     { startA: -2.35, endA: 0.45, lean0: -0.50, lean1: 1.60, wrist: -0.10 },
  3:     { startA: -2.60, endA: 0.75, lean0: -0.70, lean1: 2.00, wrist: -0.10 },
  4:     { startA: -2.70, endA: 0.85, lean0: -0.90, lean1: 2.05, wrist: -0.10 },   // 空中下劈：举刀过顶直坠
  heavy: { startA: -2.85, endA: 1.05, lean0: -1.00, lean1: 2.20, wrist: -0.15 },
};

// ---- 玩家姿态 ----
function drawPlayer(){
  const p = player;
  let pose;
  const t = p.animT;
  const s = 90;
  const isBow = p.weapon === "bow";
  if (p.state === "dodge") {
    // 翻滚：团身旋转
    ctx.save();
    ctx.translate(p.x, p.y - 38);
    ctx.rotate((0.35 - p.dodgeT) / 0.35 * Math.PI * 2 * p.dodgeDir);
    ctx.strokeStyle = p.iframesT > 0 ? "#ffee55" : "#e8e8e8";
    ctx.lineWidth = 5; ctx.lineCap = "round";
    ctx.beginPath(); ctx.arc(0, 0, 22, 0, Math.PI * 1.5); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-14, -8); ctx.lineTo(20, 4); ctx.stroke();
    ctx.restore();
    return;
  }
  // ---- 技能2：疾风乱舞（整体高速旋转） ----
  if (p.state === "skill2") {
    ctx.save();
    ctx.translate(p.x, p.y - 48);
    ctx.rotate(p.skillT * 17 * p.facing);
    drawStick(0, 48, 1, "#e8e8e8", 1.0, { lean: 0, armF: [0.1, -0.3], armB: [-0.12, 0.28], wrist: 0,
      legs: [[-0.12, 0.35], [0.12, 0.35]], weapon: isBow ? "bow" : "sword" });
    ctx.restore();
    // 旋风气流线
    ctx.save();
    ctx.globalAlpha = 0.35;
    ctx.strokeStyle = "#c9a0ff"; ctx.lineWidth = 2;
    for (let i = 0; i < 3; i++) {
      const a = p.skillT * 17 + i * 2.09;
      ctx.beginPath(); ctx.arc(p.x, p.y - 50, 58 + i * 22, a, a + 1.4); ctx.stroke();
    }
    ctx.restore();
    return;
  }
  if (p.state === "hurt") {
    // 受击后仰，手臂本能后甩护身
    pose = { lean: -1.8, armF: [-1.15, -0.75], armB: [-1.35, -0.95], wrist: -0.3, legs: [[-0.30, 0], [0.22, 0]], weapon: isBow ? "bow" : "sword" };
  }
  else if (p.state === "iai") {
    // 居合：前倾疾冲、刀收身侧（出鞘前），拖影残像
    pose = { lean: 1.5, armF: [0.35, -1.85], armB: [0.1, -0.5], wrist: -0.3,
             legs: [[-0.62, 0.1], [0.72, 0.08]], weapon: "sword" };
    ctx.save();
    ctx.globalAlpha = 0.25; ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 10;
    ctx.beginPath(); ctx.moveTo(p.x - p.facing * 120, p.y - 55); ctx.lineTo(p.x, p.y - 55); ctx.stroke();
    ctx.restore();
  }
  else if (p.state === "lunge") {
    // 游龙·破阵：骑马步疾突、双手送枪 + 龙形枪气
    pose = { lean: 1.4, armF: [0.08, 0.03], armB: [-0.18, -0.28], wrist: -0.02,
             legs: [[-0.52, 0.06], [0.68, 0.05]], weapon: "spear" };
    ctx.save();
    ctx.translate(p.x, p.y - 58); ctx.scale(p.facing, 1);
    // 三层后向残影
    for (let i = 1; i <= 3; i++) {
      ctx.globalAlpha = 0.2 - i * 0.045;
      ctx.strokeStyle = "#a0ffd0"; ctx.lineWidth = 8 - i * 1.6; ctx.lineCap = "round";
      ctx.beginPath(); ctx.moveTo(-i * 26, 0); ctx.lineTo(-i * 26 - 34, 0); ctx.stroke();
    }
    // 龙形枪气：节节收窄的龙身（外层厚淡 + 内层亮芯）+ 龙首
    const lph = p.skillT * 26;
    for (let i = 0; i < 10; i++) {
      const xx = -46 + i * 20;
      const yy = Math.sin(lph + i * 0.62) * (i / 10) * 18;
      const k = 1 - i / 11;
      ctx.strokeStyle = "#a0ffd0"; ctx.lineWidth = 24 * k + 2; ctx.lineCap = "round";
      ctx.globalAlpha = 0.10 + 0.30 * k;
      ctx.beginPath(); ctx.moveTo(xx, yy); ctx.lineTo(xx + 21, yy); ctx.stroke();
      ctx.strokeStyle = "#eafff5"; ctx.lineWidth = 4 * k + 1;
      ctx.globalAlpha = 0.35 + 0.5 * k;
      ctx.beginPath(); ctx.moveTo(xx, yy); ctx.lineTo(xx + 21, yy); ctx.stroke();
    }
    // 龙首：带描边的三角头 + 眼点 + 双须（贴在枪尖位置，枪到哪龙头到哪）
    const hx0 = 166, hy0 = Math.sin(lph + 9 * 0.62) * 18;
    ctx.globalAlpha = 0.95;
    ctx.beginPath();
    ctx.moveTo(hx0 - 4, hy0 - 13); ctx.lineTo(hx0 + 42, hy0 - 17); ctx.lineTo(hx0 + 30, hy0);
    ctx.lineTo(hx0 + 42, hy0 + 17); ctx.lineTo(hx0 - 4, hy0 + 13);
    ctx.closePath();
    ctx.fillStyle = "#d8fff0"; ctx.fill();
    ctx.strokeStyle = "#5fe8b8"; ctx.lineWidth = 2.4; ctx.stroke();
    ctx.fillStyle = "#134a3c";
    ctx.beginPath(); ctx.arc(hx0 + 16, hy0 - 7, 3.2, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(hx0 + 16, hy0 + 7, 3.2, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#a0ffd0"; ctx.lineWidth = 2;
    for (let s = -1; s <= 1; s += 2) {
      ctx.beginPath();
      ctx.moveTo(hx0 + 28, hy0 + s * 8);
      ctx.quadraticCurveTo(hx0 + 60, hy0 + s * 26, hx0 + 44, hy0 + s * 38);
      ctx.stroke();
    }
    // 枪尖爆点
    ctx.globalAlpha = 0.9;
    ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 2;
    for (let i = 0; i < 6; i++) {
      const a = i * 1.047 + lph * 0.15;
      ctx.beginPath(); ctx.moveTo(hx0 + 20 + Math.cos(a) * 8, hy0 + Math.sin(a) * 8);
      ctx.lineTo(hx0 + 20 + Math.cos(a) * 26, hy0 + Math.sin(a) * 26); ctx.stroke();
    }
    ctx.restore();
  }
  else if (p.state === "sweep") {
    // 横扫·千军破：拧腰平扫（两段反向）
    const sw = p.skillT < 0.13 ? lerp(0.3, 1.5, p.skillT / 0.13)
             : p.skillT < 0.38 ? lerp(1.5, 0.4, (p.skillT - 0.13) / 0.25)
             : lerp(-0.6, 1.25, (p.skillT - 0.38) / 0.24);
    pose = { lean: 0.7, armF: [sw, sw - 0.45], armB: [sw - 0.4, sw - 0.7], wrist: -0.02,
             legs: [[-0.42, 0.05], [0.5, 0.05]], weapon: "spear" };
    // 双段 360° 弧光：第一段顺扫、第二段回扫（正反圆环 + 地面尘环）
    ctx.save();
    ctx.translate(p.x, p.y - 55);
    const a1 = clamp((p.skillT - 0.13) / 0.24, 0, 1);
    const a2 = clamp((p.skillT - 0.38) / 0.24, 0, 1);
    ctx.lineCap = "round";
    if (p.skillT >= 0.13 && a1 < 1) {
      const e1 = easeOut(a1), a0 = -2.6, aEnd = a0 + 6.283 * e1;
      ctx.globalAlpha = (1 - a1) * 0.8;
      ctx.strokeStyle = "#a0ffd0"; ctx.lineWidth = 14 * (1 - a1) + 3;
      ctx.beginPath(); ctx.ellipse(0, 8, 232, 78, 0, a0, aEnd); ctx.stroke();
      ctx.globalAlpha = (1 - a1) * 0.65;
      ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 3.5;
      ctx.beginPath(); ctx.ellipse(0, 8, 200, 62, 0, a0, aEnd); ctx.stroke();
      // 扫击前缘：一段高亮拖刃（读得出"枪尖正在这一侧"）
      ctx.globalAlpha = (1 - a1) * 0.95;
      ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 8;
      ctx.beginPath(); ctx.ellipse(0, 8, 232, 78, 0, aEnd - 0.45, aEnd); ctx.stroke();
    }
    if (p.skillT >= 0.38 && a2 < 1) {
      const e2 = easeOut(a2), b0 = 2.9, bEnd = b0 - 6.283 * e2;
      ctx.globalAlpha = (1 - a2) * 0.7;
      ctx.strokeStyle = "#c8ffe8"; ctx.lineWidth = 12 * (1 - a2) + 2.5;
      ctx.beginPath(); ctx.ellipse(0, 8, 250, 90, 0, b0, bEnd, true); ctx.stroke();
      ctx.globalAlpha = (1 - a2) * 0.45;
      ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.ellipse(0, 8, 214, 70, 0, b0, bEnd, true); ctx.stroke();
      ctx.globalAlpha = (1 - a2) * 0.9;
      ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 7;
      ctx.beginPath(); ctx.ellipse(0, 8, 250, 90, 0, bEnd, bEnd + 0.45, true); ctx.stroke();
    }
    ctx.restore();
    // 地面横扫尘环
    if (p.skillT >= 0.13 && p.skillT <= 0.75) {
      const q = clamp((p.skillT - 0.13) / 0.5, 0, 1);
      ctx.save();
      ctx.globalAlpha = (1 - q) * 0.45;
      ctx.strokeStyle = "#8fe8c0"; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.ellipse(p.x, GROUND + 4, 60 + q * 200, 10 + q * 26, 0, 0, Math.PI * 2); ctx.stroke();
      ctx.restore();
    }
  }
  else if (p.state === "drop") {
    // 坠天·裂地：空中倒持枪下坠 / 落地压枪收势
    if (!p.onGround) {
      pose = { lean: 0.2, armF: [0.15, 0.85], armB: [0.3, 1.0], wrist: 0, legs: [[-0.3, 0.45], [0.3, 0.4]], weapon: "spear" };
      // 下坠光束：三道竖直流光 + 枪尖聚能
      ctx.save();
      ctx.translate(p.x, p.y - 50);
      ctx.lineCap = "round";
      for (let i = 0; i < 3; i++) {
        ctx.globalAlpha = 0.16 + i * 0.14;
        ctx.strokeStyle = i === 1 ? "#ffffff" : "#a0ffd0"; ctx.lineWidth = i === 1 ? 2 : 6;
        const off = (i - 1) * 12;
        ctx.beginPath(); ctx.moveTo(off, -34); ctx.lineTo(off, -150 - i * 24); ctx.stroke();
      }
      ctx.globalAlpha = 0.6 + 0.3 * Math.sin(nowSec * 22);
      ctx.fillStyle = "#ccffe6";
      ctx.beginPath(); ctx.arc(0, 62, 9, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    } else {
      pose = { lean: 1.2, armF: [0.5, 0.9], armB: [0.2, 0.6], wrist: 0, legs: [[-0.55, 0.05], [0.6, 0.1]], weapon: "spear" };
      // 落地：五道上冲光柱 + 地面裂线
      const q = clamp(p.skillT / 0.4, 0, 1);
      ctx.save();
      ctx.globalAlpha = (1 - q) * 0.7;
      ctx.lineCap = "round";
      for (let i = 0; i < 5; i++) {
        const xx = p.x + (i - 2) * 30;
        const hh = (86 + (i % 2) * 60) * (1 - q * 0.35);
        ctx.strokeStyle = i % 2 ? "#a0ffd0" : "#ffffff"; ctx.lineWidth = i % 2 ? 5 : 2.5;
        ctx.beginPath(); ctx.moveTo(xx, GROUND); ctx.lineTo(xx + (i - 2) * 4, GROUND - hh); ctx.stroke();
      }
      ctx.globalAlpha = (1 - q) * 0.5;
      ctx.strokeStyle = "#7fe8c0"; ctx.lineWidth = 2;
      for (let i = 0; i < 6; i++) {
        const a = i * 1.047, rr = 40 + q * 190;
        ctx.beginPath();
        ctx.moveTo(p.x + Math.cos(a) * rr * 0.5, GROUND);
        ctx.lineTo(p.x + Math.cos(a) * rr, GROUND + Math.sin(a) * 8);
        ctx.stroke();
      }
      ctx.restore();
    }
  }
  else if (p.state === "rain") {
    // 万箭·天罗：仰身朝天拉弓放箭
    pose = { lean: -0.3, armF: [-0.55, -0.95], armB: [-0.25, -0.85], wrist: 0,
             legs: [[-0.3, 0], [0.35, 0]], weapon: "bow" };
    // 覆盖范围预告：五条循环落箭轨迹（让玩家看清"这片区域要下雨"）
    ctx.save();
    ctx.globalAlpha = 0.18;
    ctx.strokeStyle = "#9fe8ff"; ctx.lineWidth = 2; ctx.lineCap = "round";
    for (let i = 0; i < 7; i++) {
      const xx = p.x + p.facing * (80 + i * 62);
      const yy = ((nowSec * 900 + i * 137) % 400) + 30;
      ctx.beginPath(); ctx.moveTo(xx, yy); ctx.lineTo(xx, yy + 76); ctx.stroke();

      // 突刺拖尾：判定帧水平速度线

function leanXof(pose){ return (pose.lean || 0) * 90 * 0.05; }

// ---- 敌人姿态 ----
function drawEnemy(e){
  const P = enemyPose(e);
  const shY = e.y - 90 * e.scale * 0.82;
  // 前摇红光 → 升级为攻击范围预告（扇形/箭头，威胁可读才敢贴身贪刀）
  if (e.state === "telegraph") {
    ctx.save();
    ctx.translate(e.x, 0); ctx.scale(e.facing, 1);
    ctx.globalAlpha = 0.20 + 0.13 * Math.sin(nowSec * 16);
    if (e.type === "spear") {
      const rx = 40 + e._range * e.scale;
      ctx.strokeStyle = "#ff4433"; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(24, shY); ctx.lineTo(rx, shY); ctx.stroke();
      ctx.fillStyle = "#ff4433";
      ctx.beginPath(); ctx.moveTo(rx, shY - 9); ctx.lineTo(rx + 14, shY); ctx.lineTo(rx, shY + 9); ctx.closePath(); ctx.fill();
    } else {
      ctx.strokeStyle = e.isBoss ? "#ff5522" : "#ff3333";
      ctx.lineWidth = 10 * e.scale;
      ctx.beginPath(); ctx.arc(0, shY, 95 * e.scale, -0.5, 0.75); ctx.stroke();
    }
    ctx.restore();
  }
  // 挥击刀光（敌人也有弧线拖尾）
  if (e.state === "attack" && e.t < 0.25) {
    ctx.save();
    ctx.translate(e.x, 0); ctx.scale(e.facing, 1);
    ctx.globalAlpha = 0.30 * (1 - e.t / 0.25);
    ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 5 * e.scale;
    ctx.beginPath(); ctx.arc(0, shY, 92 * e.scale, -2.0, 0.45); ctx.stroke();
    ctx.restore();
  }
  drawStick(e.x, e.y, e.facing, e.color, e.scale, P, e.hitFlash > 0 ? 1 : 0,
    { shieldBroken: e.shieldBroken, shieldDmg: e.shieldMax ? 1 - e.shieldHp / e.shieldMax : 0, shieldFlash: e.shieldFlash });
  // 血条（加厚 + 描边 + 内高光）
  if (!e.dead) {
    const bw = 56 * e.scale, bh = 9;
    const y = e.y - 112 * e.scale;
    ctx.fillStyle = "#1a1e24"; ctx.fillRect(e.x - bw / 2 - 1, y - 1, bw + 2, bh + 2);
    ctx.fillStyle = "#333a44"; ctx.fillRect(e.x - bw / 2, y, bw, bh);
    const r = clamp(e.hp / e.maxHp, 0, 1);
    ctx.fillStyle = e.elite ? "#ff7a00" : (e.isBoss ? "#e8402a" : "#d64141");
    ctx.fillRect(e.x - bw / 2, y, bw * r, bh);
    ctx.fillStyle = "rgba(255,255,255,0.28)"; ctx.fillRect(e.x - bw / 2, y + 1, bw * r, 2.5);
    if (e.hp < e.maxHp && !e.isBoss) { ctx.fillStyle = "#666f7a"; ctx.font = "11px sans-serif"; ctx.textAlign = "center"; ctx.fillText(Math.ceil(e.hp), e.x, y - 4); }
    if (e.elite) { ctx.fillStyle = "#ff8844"; ctx.font = "12px sans-serif"; ctx.textAlign = "center"; ctx.fillText("精英", e.x, y - 20); }
    if (e.isBoss) { ctx.fillStyle = "#ff5533"; ctx.font = "bold 14px sans-serif"; ctx.textAlign = "center"; ctx.fillText(bossLook(game.trial).name + " · 阶段 " + e.phase, e.x, y - 20); }
    // 盾牌耐久条（盾卫专属）：轻击磨盾 / 重击破盾，破盾后显示"盾碎"
    if (e.type === "shield") {
      const sy2 = y + bh + 3;
      if (!e.shieldBroken) {
        const sr = clamp(e.shieldHp / e.shieldMax, 0, 1);
        ctx.fillStyle = "#141a20"; ctx.fillRect(e.x - bw / 2, sy2, bw, 4);
        ctx.fillStyle = sr > 0.5 ? "#6fb9e8" : (sr > 0.25 ? "#e8c25a" : "#e86a4a");
        ctx.fillRect(e.x - bw / 2, sy2, bw * sr, 4);
      } else {
        ctx.fillStyle = "#6b7480"; ctx.font = "10px sans-serif"; ctx.textAlign = "center";
        ctx.fillText("盾碎", e.x, sy2 + 6);
      }
    }
  }
}

  // approach 走路：手臂随腿摆动
  const ph = (e.x / 75) * Math.PI * 2 % (Math.PI * 2);
  const sw = Math.sin(ph);
  return { lean: 0.55, armF: [0.5 - sw * 0.4, 0.9 - sw * 0.45], armB: [0.5 + sw * 0.4, 0.9 + sw * 0.45], wrist,
           legs: [[sw * 0.36, 0.28 * Math.max(0, sw)], [-sw * 0.36, 0.28 * Math.max(0, -sw)]], weapon: wp };
}

function drawParticle(p){
  const a = 1 - p.t / p.life;
  ctx.save();
  if (p.ring) {
    // 冲击波纹（命中环）
    const prog = p.t / p.life;
    ctx.globalAlpha = clamp((1 - prog) * 0.75, 0, 1);
    ctx.strokeStyle = p.color;
    ctx.lineWidth = 3.5 * (1 - prog) + 1;
    ctx.beginPath(); ctx.arc(p.x, p.y, lerp(p.r0, p.r1, 1 - Math.pow(1 - prog, 2)), 0, Math.PI * 2); ctx.stroke();
    ctx.restore(); return;
  }
  if (p.star) {
    // 星芒冲击：八向放射线，长短交错 + 轻微旋转
    const prog = p.t / p.life;
    const rr = lerp(p.r0, p.r1, 1 - Math.pow(1 - prog, 2));
    ctx.globalAlpha = clamp((1 - prog) * 0.95, 0, 1);
    ctx.strokeStyle = p.color; ctx.lineCap = "round";
    for (let i = 0; i < 8; i++) {
      const a = i * Math.PI / 4 + prog * 0.7;
      const rIn = rr * (i % 2 ? 0.5 : 0.3), rOut = rr * (i % 2 ? 0.85 : 1);
      ctx.lineWidth = (i % 2 ? 2 : 4) * (1 - prog) + 0.8;
      ctx.beginPath();
      ctx.moveTo(p.x + Math.cos(a) * rIn, p.y + Math.sin(a) * rIn);
      ctx.lineTo(p.x + Math.cos(a) * rOut, p.y + Math.sin(a) * rOut);
      ctx.stroke();
    }
    ctx.restore(); return;
  }
  ctx.globalAlpha = clamp(a, 0, 1);
  ctx.strokeStyle = p.color; ctx.lineWidth = 2; ctx.lineCap = "round";
  if (p.slash) {
    // 双层弧光
    ctx.globalAlpha = clamp(a * 1.2, 0, 0.9); ctx.lineWidth = 5;
    ctx.beginPath(); ctx.arc(p.x - p.vx * 0.2, p.y, p.len * 0.5, -1.2, 1.2); ctx.stroke();
    ctx.globalAlpha = clamp(a * 0.8, 0, 0.6); ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(p.x - p.vx * 0.2, p.y, p.len * 0.64, -1.0, 1.0); ctx.stroke();
  } else if (p.stab) {
    // 突刺轨迹线（水平渐隐）
    ctx.globalAlpha = clamp(a * 1.3, 0, 0.9); ctx.lineWidth = 3.5;
    ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - Math.sign(p.vx) * p.len, p.y); ctx.stroke();
    ctx.globalAlpha = clamp(a * 0.7, 0, 0.5); ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(p.x, p.y + 5); ctx.lineTo(p.x - Math.sign(p.vx) * p.len * 0.7, p.y + 5); ctx.stroke();
  } else {
    ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - p.vx * 0.05, p.y - p.vy * 0.05); ctx.stroke();
  }
  ctx.restore();
}
function drawDmgText(d){
  const a = 1 - d.t / d.life;
  // 弹跳入场：数字砸出来再回落
  const pop = 1 + 0.55 * Math.max(0, 1 - d.t * 7);
  ctx.save(); ctx.globalAlpha = clamp(a, 0, 1);
  ctx.font = "bold " + Math.round((d.big ? 30 : 20) * pop) + "px sans-serif";
  ctx.textAlign = "center";
  ctx.strokeStyle = "#00000088"; ctx.lineWidth = 4; ctx.strokeText(d.txt, d.x, d.y);
  ctx.fillStyle = d.color; ctx.fillText(d.txt, d.x, d.y);
  ctx.restore();
}
function drawOrb(o){
  const colors = { xt: "#9fd6ff", jp: "#c9a0ff", cy: "#ffd700" };
  ctx.save();
  ctx.translate(o.x, o.y);
  ctx.rotate(Math.sin(o.t * 6) * 0.2);
  if (o.kind === "gem") {
    // 永久升级物品：大颗宝石 + 呼吸光晕 + 内高光（双层放大菱形替代 shadowBlur）
    const def = GEM_DEFS[o.sub] || GEM_DEFS.hp;
    const pul = 0.7 + 0.3 * Math.sin(o.t * 8);
    ctx.fillStyle = def.color;
    for (const gs of [1.6, 1.25]) {
      ctx.globalAlpha = 0.16 * pul;
      ctx.beginPath();
      ctx.moveTo(0, -12 * gs); ctx.lineTo(9 * gs, -3 * gs); ctx.lineTo(6 * gs, 10 * gs); ctx.lineTo(0, 13 * gs); ctx.lineTo(-6 * gs, 10 * gs); ctx.lineTo(-9 * gs, -3 * gs);
      ctx.closePath(); ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.strokeStyle = "#ffffffaa"; ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(0, -12); ctx.lineTo(9, -3); ctx.lineTo(6, 10); ctx.lineTo(0, 13); ctx.lineTo(-6, 10); ctx.lineTo(-9, -3);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = "#ffffffcc";
    ctx.beginPath(); ctx.moveTo(0, -8); ctx.lineTo(4, -3); ctx.lineTo(0, 2); ctx.lineTo(-4, -3); ctx.closePath(); ctx.fill();
    ctx.restore();
    return;
  }
  ctx.fillStyle = colors[o.kind];
  ctx.strokeStyle = "#ffffff55";
  ctx.beginPath();
  if (o.kind === "xt") ctx.rect(-7, -7, 14, 14);
  else if (o.kind === "jp") { ctx.moveTo(0, -9); ctx.lineTo(7, 0); ctx.lineTo(0, 9); ctx.lineTo(-7, 0); ctx.closePath(); }
  else { ctx.moveTo(0, -9); ctx.lineTo(8, -4); ctx.lineTo(8, 5); ctx.lineTo(0, 10); ctx.lineTo(-8, 5); ctx.lineTo(-8, -4); ctx.closePath(); }
  ctx.fill(); ctx.stroke();
  ctx.restore();
}

    ctx.strokeStyle = ready ? sk.color : "#3a3f47"; ctx.lineWidth = 1.5;

    ctx.strokeRect(x, y, cw, ch);
    ctx.globalAlpha = 1;

    if (!ready) {
      ctx.fillStyle = sk.color; ctx.globalAlpha = 0.8;
      ctx.fillRect(x + 7, y + ch - 8, (cw - 14) * (1 - clamp(sk.cdt / sk.cd, 0, 1)), 3);

      ctx.textAlign = "right"; ctx.fillStyle = "#8b93a0"; ctx.font = "10px sans-serif";

    ctx.fillStyle = "#222831"; ctx.fillRect(W / 2 - 320, y, 640, 60);
    ctx.fillStyle = r.can ? "#f0e6d2" : "#556"; ctx.font = "bold 19px sans-serif"; ctx.textAlign = "left";
    ctx.fillText(r.title, W / 2 - 300, y + 25);
    ctx.fillStyle = "#c9a0ff"; ctx.font = "16px sans-serif";
    ctx.fillText(r.cost, W / 2 - 300, y + 47);
    uiBtn(W / 2 + 120, y + 10, 170, 40, "淬炼", r.cb, r.can);
    y += 68;
  }
  // 秘纹（GDD §5.1 残页 sink）：横排三格
  ctx.fillStyle = "#f0e6d2"; ctx.font = "bold 22px serif"; ctx.textAlign = "center";
  ctx.fillText("秘纹（残页 10 张合成 · 永久生效）", W / 2, y + 24);
  y += 40;
  const relics = [
    { id: "swift", title: "疾风剑意", desc: "攻速 +15%" },
    { id: "vampire", title: "嗜血剑意", desc: "命中回血 8%" },
    { id: "critUp", title: "会心剑意", desc: "暴击率 +15%" },
  ];
  const rw = 205, gap = 12;
  relics.forEach((r, i) => {
    const x = W / 2 - (rw * 3 + gap * 2) / 2 + i * (rw + gap);
    const owned = !!SAVE.relics[r.id];
    ctx.fillStyle = "#222831"; ctx.fillRect(x, y, rw, 78);
    ctx.strokeStyle = owned ? "#ffd700" : "#3a3f47"; ctx.lineWidth = 1.5; ctx.strokeRect(x, y, rw, 78);
    ctx.fillStyle = owned ? "#ffd700" : "#889"; ctx.font = "bold 17px sans-serif"; ctx.textAlign = "center";
    ctx.fillText(r.title + (owned ? " · 已掌握" : ""), x + rw / 2, y + 26);
    ctx.fillStyle = "#99a"; ctx.font = "13px sans-serif";
    ctx.fillText(r.desc, x + rw / 2, y + 46);
    if (!owned) uiBtn(x + rw / 2 - 62, y + 52, 124, 24, "合成", () => {
      if (SAVE.cy >= 10) { SAVE.cy -= 10; SAVE.relics[r.id] = true; persist(); toast("秘纹掌握"); } else toast("残页不足");
    }, SAVE.cy >= 10);
  });
  y += 92;
  if (game.forgeMsgT > 0) { ctx.fillStyle = "#ffee55"; ctx.font = "bold 20px sans-serif"; ctx.textAlign = "center"; ctx.fillText(game.forgeMsg, W / 2, Math.min(H - 24, y + 14)); }
  uiBtn(W - 150, 24, 122, 46, "返 回", () => { game.state = "title"; });
  drawUIButtons();
}
function toast(msg){ game.forgeMsg = msg; game.forgeMsgT = 2; }
function drawUIButtons(){
  for (const b of game.uiButtons) {
    ctx.fillStyle = b.enabled ? "#2f3b47" : "#1a2028";
    ctx.fillRect(b.x, b.y, b.w, b.h);
    ctx.strokeStyle = b.enabled ? "#8899aa" : "#333"; ctx.strokeRect(b.x, b.y, b.w, b.h);
    ctx.fillStyle = b.enabled ? "#f0e6d2" : "#445";
    ctx.font = "bold 22px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(b.label, b.x + b.w / 2, b.y + b.h / 2);
    ctx.textBaseline = "alphabetic";
  }
}

function drawPause(){
  // v0.5：暂停覆盖层——时间冻结，菜单可点/可按
  ctx.fillStyle = "rgba(6,8,12,0.80)"; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = "#f0e6d2"; ctx.font = "bold 56px serif"; ctx.textAlign = "center";
  ctx.fillText("暂 停", W / 2, 176);
  ctx.fillStyle = "#8a92a0"; ctx.font = "16px sans-serif";
  ctx.fillText("P / Esc 继续 · B 保存进度 · M 静音 · S 防护（格挡） · Q 换武器", W / 2, 222);
  ctx.fillStyle = "#c9d4e0"; ctx.font = "15px sans-serif";
  ctx.fillText("第 " + game.trial + " 关 · 关口 " + Math.min(game.wave, game.waveTotal) + "/" + game.waveTotal +
    " · 前行 " + Math.round(clamp(player.x / Math.max(1, level.bossGateX), 0, 1) * 100) + "%" +
    " · 人物 Lv." + SAVE.pLv + " · 气 " + Math.max(0, Math.ceil(player.hp)) + "/" + playerMaxHp() +
    (AudioSys.muted ? " · 已静音" : ""), W / 2, 252);
  game.uiButtons = [];
  uiBtn(W / 2 - 105, 296, 210, 54, "继 续", () => togglePause());
  uiBtn(W / 2 - 105, 366, 210, 54, "保存进度（B）", () => bankProgress());
  uiBtn(W / 2 - 105, 436, 210, 54, AudioSys.muted ? "声音：关（M）" : "声音：开（M）", () => { AudioSys.toggleMute(); });
  uiBtn(W / 2 - 105, 506, 210, 54, "返回主菜单", () => { game.paused = false; game.state = "title"; });
  drawUIButtons();
}
function drawDeath(){
  ctx.fillStyle = "rgba(10,4,4,0.82)"; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = "#d64545"; ctx.font = "bold 64px serif"; ctx.textAlign = "center";
  ctx.fillText("败", W / 2, 200);
  ctx.fillStyle = "#f0e6d2"; ctx.font = "20px serif";
  ctx.fillText("武道未成，素材尽存——每一次倒下都是学费", W / 2, 250);
  // 败因分析（GDD P5 / §9 B·E 信号）
  const s = player.stats;
  const pr = s.threats > 0 ? Math.round(s.perfect / s.threats * 100) : 0;
  const lines = [
    "击杀 " + s.kills + " · 受击 " + s.hitsTaken + " 次 · 挥刀 " + s.attacks + " 次",
    "完美闪避 " + s.perfect + " 次 / 受威胁 " + s.threats + " 次（触发率 " + pr + "%）",
    "贪刀受击（攻击中被反击）" + s.deathWhileAttacking + " 次",
    "本局入账：玄铁 " + game.roundXt + " · 精魄 " + game.roundJp + " · 残页 " + game.roundCy + " · 经验 " + game.roundXp,
  ];
  ctx.fillStyle = "#99a"; ctx.font = "16px sans-serif";
  lines.forEach((l, i) => ctx.fillText(l, W / 2, 320 + i * 34));
  game.uiButtons = [];
  uiBtn(W / 2 - 210, 500, 195, 60, "再战此关", () => startRun());
  uiBtn(W / 2 + 15, 500, 195, 60, "去锻造", () => { game.state = "forge"; });
  drawUIButtons();
}
function drawVictory(){
  ctx.fillStyle = "rgba(6,10,16,0.85)"; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = "#ffd700"; ctx.font = "bold 64px serif"; ctx.textAlign = "center";
  ctx.fillText("关 破", W / 2, 200);
  ctx.fillStyle = "#f0e6d2"; ctx.font = "20px serif";
  ctx.fillText(bossLook(game.trial).name + "授首。第 " + (SAVE.trialLevel) + " 关已解锁", W / 2, 250);
  const s = player.stats;
  const pr = s.threats > 0 ? Math.round(s.perfect / s.threats * 100) : 0;
  ctx.fillStyle = "#99a"; ctx.font = "16px sans-serif";
  ctx.fillText("完美闪避率 " + pr + "% · 受击 " + s.hitsTaken + " 次", W / 2, 310);
  ctx.fillText("本局入账：玄铁 " + game.roundXt + " · 精魄 " + game.roundJp + " · 残页 " + game.roundCy + " · 经验 " + game.roundXp + " · 人物 Lv." + SAVE.pLv, W / 2, 344);
  // v0.4：过关存档 + 升级物品提示
  const pulse = 0.7 + 0.3 * Math.sin(nowSec * 5);
  ctx.fillStyle = "#7fe89a"; ctx.font = "bold 18px sans-serif";
  ctx.fillText("✓ 进度已存档（等级 · 素材 · 升级物品）", W / 2, 378);
  if ((SAVE.pickHp || 0) + (SAVE.pickAtk || 0) > 0) {
    ctx.fillStyle = "rgba(255,204,102," + pulse + ")"; ctx.font = "15px sans-serif";
    ctx.fillText("已获升级物品 " + (SAVE.gemsGot || 0) + " 件 · 血珀×" + (SAVE.pickHp || 0) + " · 锐牙×" + (SAVE.pickAtk || 0), W / 2, 402);
  }
  // v0.6：山门已开（通关传送门）
  ctx.fillStyle = "rgba(255,233,168," + (0.6 + 0.4 * pulse) + ")"; ctx.font = "bold 17px serif";
  ctx.fillText("山门已开 —— 踏入即传送到第 " + SAVE.trialLevel + " 关", W / 2, 428);
  game.uiButtons = [];
  uiBtn(W / 2 - 210, 472, 195, 60, "踏入山门", () => startTransit());
  uiBtn(W / 2 + 15, 472, 195, 60, "去锻造", () => { game.state = "forge"; });
  ctx.fillStyle = "#6a7480"; ctx.font = "13px sans-serif"; ctx.textAlign = "center";
  ctx.fillText("（或按 空格 / K 直接踏入山门）", W / 2, 556);
  drawUIButtons();
}

// ---------- 主循环 ----------
// v0.8 帧率治理：渲染分辨率随实测帧耗时动态调档——连续掉帧降档保帧率，长期稳定升档保清晰
let ftEMA = 1 / 60, govN = 0;
function frame(ts){
  const gap = (ts - lastTs) / 1000;
  const dtReal = Math.min(0.033, gap || 0.016);
  lastTs = ts;
  if (gap > 0 && gap < 0.25) {          // 后台切回的首帧不采样
    ftEMA = ftEMA * 0.94 + Math.min(gap, 0.05) * 0.06;
    govN++;
    if (govN > 90 && ftEMA > 0.022 && dprStep < DPR_STEPS.length - 1) { setRenderDpr(dprStep + 1); govN = 0; }   // <46fps 持续 1.5s → 降一档
    else if (govN > 420 && ftEMA < 0.015 && dprStep > 0) { setRenderDpr(dprStep - 1); govN = 0; }                 // 稳定 <15ms 达 7s → 升一档
  } else govN = 0;
  update(dtReal);
  render();
  pressedThisFrame.clear();
  jumpBtnPressed = false; dodgeBtn = false;
  skillReq = [false, false, false]; switchReq = false;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
