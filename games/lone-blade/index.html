<!DOCTYPE html>
<html lang="zh-CN">

<title>孤剑试炼 · Lone Blade Trials · 原型 v0.8</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#0b0d10;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;}

<div id="wrap"><canvas id="cv"></canvas></div>
<script>
"use strict";
/* ============================================================
   孤剑试炼 原型 v0.8 —— 火柴人刀剑横版动作
   对应 GDD：§4 招式表 / §4.3 敌人 / §5 经济 / §6 层级强度 / §6D 弓枪技能 / §6E 丝滑操作 / §7 反馈通道 / §9 埋点
   ============================================================ */

// ---------- 画布与逻辑分辨率 ----------
const W = 1280, H = 720;
const cv = document.getElementById("cv");
// v0.8：alpha:false 免 alpha 合成、desynchronized 低延迟上屏——输入到出帧少一拍
const ctx = cv.getContext("2d", { alpha: false, desynchronized: true });
// v0.8 帧率治理：渲染分辨率动态调档——高性能机 2x 全清，连续掉帧自动降档（2→1.5→1.25→1）
const DPR_STEPS = [2, 1.5, 1.25, 1];
let dprCap = Math.min(window.devicePixelRatio || 1, 2);
let renderDpr = dprCap, dprStep = 0;
function setRenderDpr(step){
  if (step === dprStep) return;
  dprStep = step; renderDpr = Math.min(dprCap, DPR_STEPS[step]);
  resize();
}
function resize(){
  const s = Math.min(window.innerWidth / W, window.innerHeight / H);
  const d = Math.min(window.devicePixelRatio || 1, renderDpr);
  cv.width = W * d;
  cv.height = H * d;
  cv.style.width = (W * s) + "px";
  cv.style.height = (H * s) + "px";
}
window.addEventListener("resize", resize); resize();

// ---------- 工具 ----------
const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));

// ---------- 存档（对应 GDD §8：wx.setStorageSync 同构） ----------
const SAVE_KEY = "lone_blade_save_v02";
const DEFAULT_SAVE = { xt: 0, jp: 0, cy: 0, forgeLv: 0, wLv: { sword: 0, bow: 0, spear: 0 }, quenchHp: 0, quenchAtk: 0, relics: {}, trialLevel: 1, bestTrial: 1, pLv: 1, xp: 0, petKind: "fox", pickHp: 0, pickAtk: 0, gemsGot: 0 };
let SAVE = loadSave();
if (!SAVE.wLv) SAVE.wLv = { sword: 0, bow: 0, spear: 0 };   // v01 存档迁移：全局 forgeLv 折算到三武器
if (SAVE.forgeLv > 0 && SAVE.wLv.sword === 0 && SAVE.wLv.bow === 0 && SAVE.wLv.spear === 0) {
  SAVE.wLv.sword = SAVE.forgeLv; SAVE.wLv.bow = SAVE.forgeLv; SAVE.wLv.spear = SAVE.forgeLv;
}
if (!SAVE.pLv) SAVE.pLv = 1;
if (SAVE.xp === undefined) SAVE.xp = 0;
if (SAVE.pickHp === undefined) SAVE.pickHp = 0;   // v0.4：局内拾取升级物品（死亡不丢）
if (SAVE.pickAtk === undefined) SAVE.pickAtk = 0;
if (SAVE.gemsGot === undefined) SAVE.gemsGot = 0;
function loadSave(){
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return JSON.parse(JSON.stringify(DEFAULT_SAVE));
    const s = JSON.parse(raw);
    return Object.assign(JSON.parse(JSON.stringify(DEFAULT_SAVE)), s);
  } catch(e){ return JSON.parse(JSON.stringify(DEFAULT_SAVE)); }
}
function persist(){ try { localStorage.setItem(SAVE_KEY, JSON.stringify(SAVE)); } catch(e){} }

// ---------- 玩家数值（GDD §10，全部 PLACEHOLDER 待埋点校准） ----------
const BASE = {
  hp: 100,          // + 淬炼气血 10/条
  speed: 330,
  jumpV: -800,
  gravity: 2300,
  atk: [10, 12, 18],     // 轻三连
  heavy: 30,
  critMul: 1.8,
  iFrames: 0.25,         // 闪避 i-frames
  dodgeDur: 0.35,
  dodgeSpeed: 640,
  dodgeCD: 0.3,   // v0.5：0.5→0.3，总闪避间隔 0.65s，连闪更跟手
  comboWindow: 0.5,
  // 弓与技能（GDD §4.4；武器技能 CD 见 SKILLS 表）
  skillWave: 14,        // 剑气伤害
  skillWhirl: 8,        // 乱舞每段伤害（×4 段）
  bow: 11,              // 普通箭
  bowPower: 26,         // 蓄力强箭（破盾）
  arrowSpeed: 950,
  spear: [8, 9, 14],    // 长枪三突刺（远判定低单发）
  spearHeavy: 24,       // 蓄力大突刺（超远判定 + 大击退）
  airAtk: 16,           // 空中下劈
  // ---- v0.7 弓/枪技能重制（所有数值 [PLACEHOLDER]，验证路径见 GDD §6D） ----
  bowPierce: 20,        // 裂云·贯日 单支贯穿箭（×3 支，可叠打同一目标）
  bowRain: 13,          // 万箭·天罗 单支落箭（×14 支）
  bowRainHeavy: 32,     // 万箭·天罗 收尾天箭（×3 支）
  bowWind: 42,          // 疾风·回锋 原地风爆
  spearLunge: 17,       // 游龙·破阵 单段穿刺（×3 段，每段可重击同一目标）
  spearSweep: 26,       // 横扫·千军破 单段横扫（×2 段，无视盾牌）
  spearDrop: 46,        // 坠天·裂地 落地主冲击
  spearWave: 22,        // 坠天·裂地 扩散冲击波（×2 段，逐段衰减 0.8）
};
const WEAPON_ORDER = ["sword", "bow", "spear"];   // Q 轮换顺序：刀→长弓→长枪
// ---------- 武器技能表（U/I/O 三槽，每武器三技能，CD 全部 [PLACEHOLDER] 待 playtest 校准） ----------
const SKILLS = {
  sword: [
    { name: "剑气·裂空", cd: 6,  desc: "穿透剑气波" },
    { name: "疾风乱舞", cd: 12, desc: "周身四段·全程无敌" },
    { name: "居合·一闪", cd: 10, desc: "前冲穿阵·沿途重创" },
  ],
  bow: [
    { name: "裂云·贯日", cd: 6.5, desc: "三连贯穿箭·越阵破甲" },
    { name: "万箭·天罗", cd: 14,  desc: "十七箭覆地·收尾三天箭" },
    { name: "疾风·回锋", cd: 9,   desc: "后撤留风爆·回身双箭" },
  ],
  spear: [
    { name: "游龙·破阵", cd: 8,   desc: "三段龙形穿刺·收招枪气" },
    { name: "横扫·千军破", cd: 10, desc: "双段360°横扫·无视盾牌" },
    { name: "坠天·裂地", cd: 13,  desc: "三叠冲击波·裂地大击退" },
  ],
};
// 层级强度（GDD §6）
const floorHp = n => 1 + 0.35 * (n - 1);
const floorAtk = n => 1 + 0.28 * (n - 1);
// ---------- 人物等级（经验升级） ----------
function xpNeed(lv){ return Math.round(30 * Math.pow(1.32, lv - 1)); }   // Lv1→30 · Lv5→96 · Lv10→388
const HP_PER_LV = 12;   // 每升一级气血上限 +12（v0.4：升级加血更明显）
function playerMaxHp(){ return BASE.hp + SAVE.quenchHp * 10 + (SAVE.pLv - 1) * HP_PER_LV + (SAVE.pickHp || 0) * 5; }
// 武器分体锻造：每把武器独立等级，+12%/级；人物等级 +4%/级；局内拾取锐牙 +2%/个
function weaponMult(w){ return Math.pow(1.12, (SAVE.wLv[w] || 0)); }
function dmgMult(w){ return weaponMult(w || player.weapon) * (1 + SAVE.quenchAtk * 0.05) * (1 + (SAVE.pLv - 1) * 0.04) * (1 + (SAVE.pickAtk || 0) * 0.02); }
// 武器品阶（外观随锻造等级进化：凡铁→青锋→赤金→寒光→紫电→神兵）
const TIER_NAMES = ["凡铁", "青锋", "赤金", "寒光", "紫电", "神兵"];
const TIER_COLOR = ["#c8ccd2", "#7fd4ff", "#ffb347", "#eef4ff", "#c9a0ff", "#ffe66e"];
function tierOf(w){ return clamp(SAVE.wLv[w] || 0, 0, 5); }
function grantXp(n){
  SAVE.xp += n;
  let ups = 0;
  while (SAVE.xp >= xpNeed(SAVE.pLv)) {
    SAVE.xp -= xpNeed(SAVE.pLv);
    SAVE.pLv++; ups++;
  }
  if (ups > 0) {
    persist();
    S().levelup();
    player.hp = playerMaxHp();   // v0.4：升阶瞬间气血回满
    ring(player.x, player.y - 55, 130, "#ffe66e");
    burst(player.x, player.y - 55, "#ffe66e", 18, 380);
    flash("rgba(255,238,120,0.25)", 0.15);
    shake = Math.max(shake, 5);
    dmgText(player.x, player.y - 140, "升阶 Lv." + SAVE.pLv, "#ffe66e", true);
    dmgText(player.x, player.y - 112, "气血上限 +" + ups * HP_PER_LV + " · 伤害 +" + Math.round(ups * 4) + "% · 气血回满", "#c9e08a", false);
    if (pet) { ring(pet.x, pet.y, 70, "#b0e8ff"); burst(pet.x, pet.y, "#b0e8ff", 10, 260); }   // 宠物一同升阶
    return ups;
  }
  return 0;
}
function atkSpeedMult(){ return SAVE.relics.swift ? 1.15 : 1; }
function critChance(){ return SAVE.relics.critUp ? 0.15 : 0; }

// ---------- 输入（键盘 + 触屏，GDD §4.1） ----------
const keys = {};
window.addEventListener("keydown", e => {
  if (["ArrowLeft","ArrowRight","ArrowUp","ArrowDown"," ","j","J","k","K","l","L","u","U","i","I","o","O","s","S","q","Q","Tab","p","P","b","B","m","M","Escape"].includes(e.key)) e.preventDefault();
  const first = !keys[e.key];
  keys[e.key] = true;
  if (first) pressedThisFrame.add(e.key);
  if (first && (e.key === "j" || e.key === "J")) onAtkDown();
  handleUIKey(e.key);
});
window.addEventListener("keyup", e => {
  keys[e.key] = false;
  if (e.key === "j" || e.key === "J") onAtkUp();
});

const pressedThisFrame = new Set();
// 统一"攻击键按下/抬起"事件流（键盘 J + 触屏 ATK 键）
let atkBtnDown = false, atkBtnDownAt = -1, atkBtnReleased = false, atkPressBufferedAt = -1;
function onAtkDown(){ atkBtnDown = true; atkBtnDownAt = nowSec; atkPressBufferedAt = nowSec; }
function onAtkUp(){ atkBtnDown = false; atkBtnReleased = true; }
let dodgeBtn = false, jumpBtnPressed = false;
// v0.5：跳跃/闪避/换武器输入缓冲（攻击硬直中预输入 → 硬直一结束立即响应，降延迟）
let jumpBufAt = -1, dodgeBufAt = -1, switchBufAt = -1;
let skillBufAt = [-1, -1, -1];   // v0.8：技能输入缓冲——任何状态下按下都记录，0.35s 内可施放即触发
function onDodgeDown(){ dodgeBtn = true; }
function onJumpDown(){ jumpBtnPressed = true; }
let skillReq = [false, false, false], switchReq = false, blockBtn = false;
function onSkillDown(slot){ skillReq[slot] = true; }
function onSwitchDown(){ switchReq = true; }
function touchAction(id){
  if (id === "atk") onAtkDown();
  if (id === "dodge") onDodgeDown();
  if (id === "jump") onJumpDown();
  if (id === "skill0") onSkillDown(0);
  if (id === "skill1") onSkillDown(1);
  if (id === "skill2") onSkillDown(2);
  if (id === "switch") onSwitchDown();
  if (id === "block") blockBtn = true;
}

// 触屏：左 1/3 为方向区，右侧按钮由 Button 布局判定
const touchState = { active: false, x: 0, dir: 0 };
cv.addEventListener("pointerdown", e => {
  const p = toLogical(e);
  if (handleUIPoint(p)) return;
  if (game.state !== "play") return;
  // 右侧按钮（点按即触发，不依赖 move）
  for (const b of touchButtons) {
    if (Math.hypot(p.x - b.x, p.y - b.y) < b.r + 14) {
      b.pressed = true;
      touchAction(b.id);
      return;
    }
  }
  // 左侧方向区
  if (p.x < W * 0.38 && p.y > H * 0.45) {
    touchState.active = true; touchState.x = p.x; touchState.dir = p.x < (W * 0.19) ? -1 : 1;
  }
});
cv.addEventListener("pointermove", e => {
  if (touchState.active) { const p = toLogical(e); touchState.dir = p.x < touchState.x - 60 ? -1 : (p.x > touchState.x + 60 ? 1 : touchState.dir); }
});
const upHandler = e => {
  if (touchState.active) { touchState.active = false; touchState.dir = 0; }
  blockBtn = false;
  for (const b of touchButtons) {
    if (b.id === "atk" && b.pressed) { b.pressed = false; onAtkUp(); }
    else b.pressed = false;
  }
};
cv.addEventListener("pointerup", upHandler);
cv.addEventListener("pointercancel", upHandler);
function toLogical(e){
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };
}
// 触屏按钮按住检测（e.buttons>0 排除鼠标悬停误触）
cv.addEventListener("pointermove", e => {
  if (game.state !== "play" || e.buttons === 0) return;
  const p = toLogical(e);
  for (const b of touchButtons) {
    const hit = Math.hypot(p.x - b.x, p.y - b.y) < b.r + 14;
    if (hit && !b.pressed) {
      b.pressed = true;
      touchAction(b.id);
    }
    if (!hit && b.pressed && b.id === "atk") { b.pressed = false; onAtkUp(); }
  }
});
const touchButtons = [
  { id: "atk",    label: "斩", x: W - 130, y: H - 130, r: 58 },
  { id: "dodge",  label: "闪", x: W - 250, y: H - 90,  r: 52 },
  { id: "jump",   label: "跳", x: W - 80,  y: H - 260, r: 38 },
  { id: "skill0", label: "壹", x: W - 168, y: H - 250, r: 42 },
  { id: "skill1", label: "贰", x: W - 278, y: H - 195, r: 46 },
  { id: "skill2", label: "叁", x: W - 190, y: H - 355, r: 40 },
  { id: "block",  label: "格", x: W - 90,  y: H - 360, r: 40 },
  { id: "switch", label: "换", x: W - 80,  y: H - 460, r: 34 },
];

function inputDir(){
  let d = 0;
  if (keys["ArrowLeft"] || keys["a"] || keys["A"]) d -= 1;
  if (keys["ArrowRight"] || keys["d"] || keys["D"]) d += 1;
  if (touchState.active) d = touchState.dir;
  return d;
}
function isTouchDevice(){ return "ontouchstart" in window || navigator.maxTouchPoints > 0; }

// ---------- 计时 ----------
let nowSec = 0, lastTs = 0;
let timeScale = 1;        // 剑意时刻：敌人侧 0.3 倍
let enemyTimeScale = 1;
let hitstop = 0;          // 全局打击停顿（秒，真实时间）
let shake = 0, shakeX = 0, shakeY = 0, shakeDir = 0;
let zoom = 0;             // 重击镜头推近量
let flashT = 0, flashColor = "rgba(255,255,255,0.2)";

// ---------- 音频（WebAudio 程序化合成，零素材；无 AudioContext 环境全静默兜底） ----------
const AudioSys = (() => {
  let ac = null, master = null, sfxG = null, bgmG = null, windSrc = null;
  let muted = !!(SAVE.muted);
  let nextBellAt = 0, started = false;
  // 五声音阶（宫商角徵羽，D 调）：江湖/古琴风骨架
  const PENTA = [146.83, 164.81, 196.00, 220.00, 261.63, 293.66, 329.63, 392.00];

  function ensure(){
    if (ac) { if (ac.state === "suspended") ac.resume(); return true; }
    try {
      const AC = (typeof window !== "undefined" && (window.AudioContext || window.webkitAudioContext));
      if (!AC) return false;
      ac = new AC();
      master = ac.createGain(); master.gain.value = muted ? 0 : 0.85; master.connect(ac.destination);
      sfxG = ac.createGain(); sfxG.gain.value = 0.8; sfxG.connect(master);
      bgmG = ac.createGain(); bgmG.gain.value = 0.5; bgmG.connect(master);
      startBGM();
      return true;
    } catch(e){ return false; }
  }
  function noiseBuf(dur){
    const n = Math.max(1, Math.floor(ac.sampleRate * dur));
    const b = ac.createBuffer(1, n, ac.sampleRate);
    const d = b.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    return b;
  }
  // 通用音色：滤波噪声（挥砍/打击的"肉感"）
  function noise(dur, f0, f1, vol, type){
    if (!ac || muted) return;
    const src = ac.createBufferSource(); src.buffer = noiseBuf(dur);
    const fl = ac.createBiquadFilter(); fl.type = type || "bandpass"; fl.Q.value = 1.1;
    fl.frequency.setValueAtTime(f0, ac.currentTime);
    if (f1 && f1 !== f0) fl.frequency.exponentialRampToValueAtTime(f1, ac.currentTime + dur);
    const g = ac.createGain();
    g.gain.setValueAtTime(vol, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + dur);
    src.connect(fl); fl.connect(g); g.connect(sfxG);
    src.start(); src.stop(ac.currentTime + dur + 0.02);
  }
  // 通用音色：单音（金属/木质感）
  function tone(freq, dur, type, vol, slideTo, delay){
    if (!ac || muted) return;
    const t0 = ac.currentTime + (delay || 0);
    const o = ac.createOscillator(); o.type = type || "sine";
    o.frequency.setValueAtTime(freq, t0);
    if (slideTo && slideTo !== freq) o.frequency.exponentialRampToValueAtTime(Math.max(1, slideTo), t0 + dur);
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.008);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    o.connect(g); g.connect(sfxG);
    o.start(t0); o.stop(t0 + dur + 0.02);
  }
  // ---- 打击音效组 ----
  const sfx = {
    swing(heavy){ noise(heavy ? 0.16 : 0.10, 380, heavy ? 1500 : 1100, heavy ? 0.5 : 0.34); },
    hitLight(){ noise(0.06, 2400, 900, 0.5); tone(240, 0.07, "triangle", 0.3, 120); },
    hitHeavy(){ noise(0.13, 1600, 300, 0.7); tone(120, 0.16, "square", 0.45, 55); tone(75, 0.2, "sine", 0.4, 40); },
    crit(){ tone(1750, 0.09, "sine", 0.5, 900); noise(0.08, 3200, 1200, 0.55); tone(880, 0.12, "triangle", 0.3, 440, 0.01); },
    kill(){ noise(0.22, 900, 120, 0.75); tone(160, 0.3, "sine", 0.5, 42); tone(660, 0.14, "triangle", 0.22, 130); },
    parry(){ tone(1240, 0.12, "sine", 0.5, 620); tone(1860, 0.16, "sine", 0.35, 930, 0.015); noise(0.05, 4200, 2000, 0.4); },
    block(){ tone(140, 0.12, "square", 0.32, 70); noise(0.08, 700, 260, 0.3); },
    shieldBreak(){ noise(0.3, 2600, 200, 0.85, "highpass"); tone(420, 0.25, "square", 0.4, 90); tone(210, 0.3, "triangle", 0.35, 60, 0.03); },
    hurt(){ tone(90, 0.18, "sawtooth", 0.5, 45); noise(0.1, 500, 150, 0.4); },
    dodge(){ noise(0.13, 500, 1600, 0.25); },
    jump(){ tone(300, 0.09, "sine", 0.18, 480); },
    bowShoot(power){ noise(power ? 0.16 : 0.1, 600, power ? 2600 : 1800, power ? 0.5 : 0.32); if (power) tone(520, 0.1, "triangle", 0.25, 180); },
    bowFull(){ tone(880, 0.08, "sine", 0.22); tone(1320, 0.1, "sine", 0.18, 1320, 0.05); },
    switch(){ tone(1560, 0.05, "sine", 0.25); tone(2080, 0.07, "sine", 0.2, 2080, 0.03); },
    levelup(){ [0, 0.09, 0.18, 0.3].forEach((d, i) => tone(PENTA[4 + i] * 2, 0.22, "sine", 0.3, null, d)); },
    pickup(){ tone(1320, 0.07, "sine", 0.28); tone(1760, 0.1, "sine", 0.22, 1760, 0.06); },
    victory(){ [0, 0.14, 0.28, 0.42, 0.62].forEach((d, i) => tone([293.66, 349.23, 392, 440, 587.33][i], 0.3, "sine", 0.3, null, d)); },
    death(){ tone(220, 0.9, "sine", 0.4, 55); tone(110, 1.1, "triangle", 0.35, 40, 0.05); noise(0.6, 300, 60, 0.3); },
    bossIn(){ tone(65, 0.8, "sine", 0.55, 30); noise(0.5, 200, 50, 0.4); tone(98, 0.7, "triangle", 0.3, 49, 0.1); },
    // v0.6：关口 / 通路 / 山门

function drawProjectile(pr){

      ctx.beginPath(); ctx.moveTo(-72, 0); ctx.lineTo(-6, 0); ctx.stroke();
      ctx.globalAlpha = 0.75 * fade;
      ctx.strokeStyle = "#fff6cc"; ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.moveTo(-44, 0); ctx.lineTo(-4, 0); ctx.stroke();

      ctx.strokeStyle = gold; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(8, -8); ctx.lineTo(30, 0); ctx.lineTo(8, 8); ctx.lineTo(2, 0); ctx.closePath(); ctx.stroke();

    }
    ctx.strokeStyle = hot ? (pr.heavyRain ? "#fff0b8" : "#ffe27a") : "#d8c9a0"; ctx.lineWidth = hot ? 4 : 3; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(-26, 0); ctx.lineTo(8, 0); ctx.stroke();
    ctx.fillStyle = hot ? "#fffbe8" : "#eef2f7";
    ctx.beginPath(); ctx.moveTo(8, 0); ctx.lineTo(hot ? 26 : 20, hot ? -6 : -4); ctx.lineTo(hot ? 26 : 20, hot ? 6 : 4); ctx.closePath(); ctx.fill();

  }

}

// ---------- 宠物：灵狐（随人物**每一级**进化：颜色渐变 + 特征逐级解锁） ----------
let pet = null;
// 灵狐品阶：1-4 白狐 / 5-9 青狐 / 10-14 金狐 / 15+ 紫狐
function petTier(){ const lv = SAVE.pLv; return lv >= 15 ? 3 : lv >= 10 ? 2 : lv >= 5 ? 1 : 0; }
const PET_LOOKS = [
  { name: "白灵狐", color: "#e8f4ff", aura: "#ffffff" },
  { name: "青霜狐", color: "#7fd4ff", aura: "#9fe8ff" },
  { name: "金曜狐", color: "#ffe66e", aura: "#ffd700" },
  { name: "紫电狐", color: "#c9a0ff", aura: "#b08aff" },
];
const PET_TIER_START = [1, 5, 10, 15];
function petLook(){ return PET_LOOKS[petTier()]; }
// v0.4：颜色在品阶带内向下一品阶逐级渐变——每一级都肉眼可见地"变高级"
function lerpHex(a, b, t){
  const pa = [parseInt(a.slice(1,3),16), parseInt(a.slice(3,5),16), parseInt(a.slice(5,7),16)];
  const pb = [parseInt(b.slice(1,3),16), parseInt(b.slice(3,5),16), parseInt(b.slice(5,7),16)];
  return "rgb(" + pa.map((v,i) => Math.round(v + (pb[i] - v) * t)).join(",") + ")";
}
function petBodyColor(){
  const tier = petTier(), lv = SAVE.pLv;
  const start = PET_TIER_START[tier], end = tier < 3 ? PET_TIER_START[tier + 1] : start + 5;
  const t = clamp((lv - start) / (end - start), 0, 1);
  return lerpHex(PET_LOOKS[tier].color, PET_LOOKS[Math.min(3, tier + 1)].color, t * 0.85);
}
// 特征逐级解锁表（v0.4：样式越来越高级）
function petFeat(){
  const lv = SAVE.pLv;
  return {
    tailTip:  lv >= 2,    // Lv2  尾尖光点
    eyeGlow:  lv >= 3,    // Lv3  眼瞳发光（品阶色）
    tailGleam: lv >= 4,   // Lv4  尾巴描边发光
    twinTail: lv >= 6,    // Lv6  双尾
    tailFlame: lv >= 8,   // Lv8  移动带尾焰微粒
    starOrbit: lv >= 10,  // Lv10 环绕星辉
    doubleAura: lv >= 12, // Lv12 双层光环

function petGlow(){ return clamp(0.35 + (SAVE.pLv - 1) * 0.05, 0.35, 1); }   // 辉光强度随级增长

function nearestEnemy(x, y){
  let best = null, bd = Infinity;
  for (const e of enemies) {
    if (e.dead) continue;
    const d = Math.hypot(e.x - x, (e.y - 55 * e.scale) - y);
    if (d < bd) { bd = d; best = e; }
  }

}
function updatePet(dt){

  const tx = clamp(player.x - player.facing * 62, 40, WORLD_W - 40);
  const ty = player.y - 108 + Math.sin(pet.bobT * 2.6) * 10;
  const k = 1 - Math.pow(0.0025, dt);
  pet.vx = (tx - pet.x) * 6.5; pet.vy = (ty - pet.y) * 6.5;
  pet.x += pet.vx * k * 0.16; pet.y += pet.vy * k * 0.16;

  if (feat.eyeGlow) {
    ctx.fillStyle = look.aura;
    ctx.beginPath(); ctx.arc(11.5 * s, -5 * s, 2.2 * s, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#ffffff";
    ctx.beginPath(); ctx.arc(11.5 * s, -5 * s, 0.9 * s, 0, Math.PI * 2); ctx.fill();
  } else {
    ctx.fillStyle = "#0b0d10";
    ctx.beginPath(); ctx.arc(11.5 * s, -5 * s, 1.3 * s, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}

// ---------- 敌人 ----------
let enemies = [];
const ENEMY_TYPES = {
  grunt:  { name: "刀客", color: "#d9534f", speed: 170, hp: 30,  atk: 15, range: 70,  tele: 0.40, active: 0.14, recovery: 0.6, scale: 1.0, drops: { xt: [2, 4] } },
  spear:  { name: "枪兵", color: "#d9a441", speed: 135, hp: 34,  atk: 18, range: 150, tele: 0.55, active: 0.16, recovery: 0.75, scale: 1.0, drops: { xt: [2, 4] } },
  shield: { name: "盾卫", color: "#7a8ba0", speed: 85,  hp: 45,  atk: 12, range: 60,  tele: 0.50, active: 0.14, recovery: 0.7, scale: 1.05, shieldHp: 26, drops: { xt: [3, 5] } },
};
function spawnEnemy(typeKey, elite, x){
  const t = ENEMY_TYPES[typeKey];
  const n = game.trial;
  const e = {
    type: typeKey, elite: !!elite,
    x: clamp(x, 40, WORLD_W - 40), y: GROUND, facing: x > player.x ? -1 : 1,
    maxHp: t.hp * floorHp(n) * (elite ? 4 : 1) * (typeKey === "boss" ? 1 : 1),
    atk: t.atk * floorAtk(n) * (elite ? 1.3 : 1),
    state: "approach",   // approach/telegraph/attack/recover/stagger
    t: 0, swingDone: false, perfectArmed: true,
    staggerT: 0, hp: 0,
    teleT: 0,
    speed: t.speed * (elite ? 1.15 : 1),
    _tele: t.tele, _active: t.active, _recovery: t.recovery, _range: t.range,
    scale: t.scale * (elite ? 1.25 : 1),
    color: elite ? "#ff2211" : t.color,
    drops: t.drops, hitFlash: 0,
  };
  // 盾卫：盾牌有耐久（正面轻击磨盾，重击高效破盾；破盾后永久失去格挡）
  if (typeKey === "shield") {
    e.shieldMax = (t.shieldHp || 26) * floorHp(n) * (elite ? 1.8 : 1);
    e.shieldHp = e.shieldMax;
    e.shieldBroken = false;
    e.shieldFlash = 0;
  }
  e.hp = e.maxHp;
  enemies.push(e);
  return e;
}

// ---------- BOSS（GDD §4.3：3 阶段守关员；关卡模式下每关关底换脸） ----------
const BOSS_LOOKS = [
  { name: "狱主·血屠", color: "#c9302c", scale: 1.9, tip: "巨刃横斩" },
  { name: "刀魔·断岳", color: "#8a2be2", scale: 1.85, tip: "残影连斩" },
  { name: "枪王·贯岳", color: "#c9a015", scale: 1.95, tip: "百步穿枪" },
  { name: "弓煞·蚀月", color: "#1f9e6e", scale: 1.8, tip: "连珠箭雨" },
  { name: "血神·吞天", color: "#e02020", scale: 2.05, tip: "嗜血狂潮" },
];
function bossLook(n){ return BOSS_LOOKS[(n - 1) % BOSS_LOOKS.length]; }
function spawnBoss(){
  const n = game.trial;
  const look = bossLook(n);
  const b = {
    type: "boss", elite: false, isBoss: true,
    x: level.bossGateX + 420, y: GROUND, facing: -1,
    maxHp: 600 * floorHp(n), hp: 0, atk: 22 * floorAtk(n),
    state: "idle", t: 0, moveT: 0, swingDone: false, perfectArmed: true,
    phase: 1, enrage: 1, staggerImmune: true,
    scale: look.scale, color: look.color, drops: { xt: [40, 60], jp: [20, 20], cy: [5, 5] },
    hitFlash: 0, teleT: 0, _tele: 0, _active: 0, _recovery: 0, _range: 0, staggerT: 0,
  };
  b.hp = b.maxHp;
  enemies.push(b);
  return b;
}

// ---------- 关卡推进（v0.6：向前探索 → 关口拦路 → 斩敌开路） ----------
const level = { len: 6200, seg: 820, gates: [], idx: -1, bossGateX: 6200, bossArmed: false, bossSpawned: false, cleared: 0 };
const WAVE_COMPOSITIONS = [
  ["grunt", "grunt", "grunt"],
  ["grunt", "spear", "grunt"],
  ["grunt", "spear", "shield", "grunt"],
  ["spear", "shield", "grunt", "spear"],
  ["grunt", "spear", "shield", "grunt", "grunt"],
  ["spear", "spear", "shield", "shield", "grunt", "grunt"],
];
function buildLevel(){
  level.len = 6200 + (game.trial - 1) * 350;
  const firstGate = 520, lastGate = level.len - 700;
  level.seg = (lastGate - firstGate) / Math.max(1, game.waveTotal - 1);
  WORLD_W = level.len + 1100;
  level.gates = [];
  for (let i = 1; i <= game.waveTotal; i++) {
    level.gates.push({ i, x: firstGate + (i - 1) * level.seg, spawned: false, cleared: false });
  }
  level.idx = -1; level.cleared = 0;
  level.bossGateX = level.len;
  level.bossArmed = false; level.bossSpawned = false;
  game.limitX = WORLD_W - 30;
  buildBackdrop();
}

// ---------- 波次管理（关卡模式：每关 6 道关口 + 关底 BOSS） ----------
const game = {
  state: "title",   // title/forge/play/waveBanner/death/victory
  paused: false,    // v0.5：P/Esc 暂停（时间冻结，仅 UI 可交互）
  trial: 1, wave: 0, waveTotal: 6,
  limitX: 99999,    // v0.6：当前可前进的右边界（关口拦路时收窄）
  transit: { active: false, t: 0, dur: 1.6, switched: false },   // v0.6：山门传送转场
  bannerT: 0, bannerText: "",
  roundXt: 0, roundJp: 0, roundCy: 0, roundXp: 0,
  uiButtons: [],
  forgeMsg: "", forgeMsgT: 0,
};
function startRun(){
  game.state = "play"; game.trial = SAVE.trialLevel; game.wave = 0;
  game.roundXt = 0; game.roundJp = 0; game.roundCy = 0; game.roundXp = 0;
  if (!game.transit || !game.transit.active) game.transit = { active: false, t: 0, dur: 1.6, switched: false };
  buildLevel();
  enemies = []; particles.length = 0; dmgTexts.length = 0; orbs.length = 0; projectiles.length = 0;
  blasts.length = 0;
  portal = null;
  resetPlayer(true);
  resetPet();
  camera.x = 0;
  AudioSys.setKey(game.trial);   // 每关换调（听觉上的关卡推进）
  AudioSys.setMood("explore");
  nextWave();
}
function nextWave(){
  game.wave++;
  if (game.wave > game.waveTotal) { // 终点：关底 BOSS
    level.bossArmed = true;
    game.state = "waveBanner"; game.bannerT = 1.5;
    game.bannerText = "第 " + game.trial + " 关 · " + bossLook(game.trial).name + " 在前方拦路";
    return;
  }
  game.state = "waveBanner"; game.bannerT = 1.25;
  game.bannerText = "第 " + game.trial + " 关 · 波次 " + game.wave + " / " + game.waveTotal + " · 向前推进（→ / D）";
}
// 关口：玩家推进到附近才刷怪（敌人从前方涌出，同时封住去路）
function updateStageProgress(){
  if (game.state !== "play") return;
  if (level.bossArmed) {
    if (!level.bossSpawned && player.x >= level.bossGateX - 420) {
      level.bossSpawned = true;
      const look = bossLook(game.trial);
      game.state = "waveBanner"; game.bannerT = 1.6;
      game.bannerText = "第 " + game.trial + " 关 · " + look.name + " 拦路";
      spawnBoss();
      S().bossIn();
      shake = Math.max(shake, 8);
    }
    return;
  }
  const g = level.gates[game.wave - 1];
  if (!g || g.spawned) return;
  if (player.x >= g.x - 300) { g.spawned = true; level.idx = g.i - 1; spawnGateWave(g); }
}
function spawnGateWave(g){
  const w = g.i, n = game.trial;
  const comp = WAVE_COMPOSITIONS[clamp(w, 1, 6) - 1];
  comp.forEach((k, i) => spawnEnemy(k, w >= 3 && i === comp.length - 1, g.x + 220 + i * 132));
  if (w >= 4) spawnEnemy("spear", false, player.x - 460);           // 后方包抄（前后夹击压迫感）
  for (let i = 0; i < Math.min(3, n - 1); i++) spawnEnemy("grunt", false, g.x + 400 + i * 120);
  game.limitX = Math.max(player.x + 30, g.x - 10);                   // 封住去路，必须清场
  shake = Math.max(shake, 5); hitstop = Math.max(hitstop, 0.045);
  dmgText(g.x, GROUND - 215, "前方有人拦路", "#ffcc66", false);
  S().gate();
}
function gateCleared(g){
  g.cleared = true; level.cleared++;
  game.limitX = WORLD_W - 30;                                        // 通路解开，继续向前
  const jp = randi(1, 2); game.roundJp += jp;
  dropOrb(g.x + 60, GROUND - 120, "jp", jp);
  dmgText(g.x, GROUND - 205, "通路已开 · 继续向前推进", "#7fe89a", false);
  ring(g.x, GROUND - 100, 160, "#7fe89a");
  S().gateOpen();
  nextWave();
}

// ---------- 山门（通关传送门）：BOSS 倒下后开启，踏入即传送到下一关 ----------
let portal = null;
function openPortal(x){
  portal = { x, y: GROUND, t: 0 };
  burst(x, GROUND - 130, "#ffe9a8", 26, 420);
  burst(x, GROUND - 130, "#9fe8ff", 16, 300);
  ring(x, GROUND - 130, 200, "#ffe9a8");
  starRing(x, GROUND - 130, 240, "#ffe9a8");
  shake = Math.max(shake, 7);
  S().portalOpen();
}
function startTransit(){
  if (game.transit.active) return;
  game.transit = { active: true, t: 0, dur: 1.6, switched: false };
  S().portalEnter();
}
function grantRoundMaterials(){
  // 未拾取的素材球自动入账（结算兜底，P3：任何一局收获为正）；升级物品直接生效入档
  for (const o of orbs) {
    if (o.kind === "xt") game.roundXt += o.amount;
    if (o.kind === "jp") game.roundJp += o.amount;
    if (o.kind === "cy") game.roundCy += o.amount;
    if (o.kind === "gem") applyGem(o.sub);
  }
  orbs.length = 0;
  SAVE.xt += game.roundXt; SAVE.jp += game.roundJp; SAVE.cy += game.roundCy;
  persist();   // xp/pLv 由 grantXp 即时入账，这里兜底保存余量进度
}

// ---------- UI 键盘/点按 ----------
function handleUIKey(k){
  // v0.5：P/Esc 暂停 · B 局中存档 · M 静音（S 防护 = 格挡键，见 §4.1）
  const lower = k.length === 1 ? k.toLowerCase() : k;
  if (lower === "p" || k === "Escape") togglePause();
  else if (lower === "m") { const mu = AudioSys.toggleMute(); toast(mu ? "已静音（M 恢复）" : "声音开启"); }
  else if (lower === "b") bankProgress();
  else if (game.state === "victory" && (k === " " || k === "Enter" || lower === "k" || lower === "j")) startTransit();   // 踏入山门
}
function togglePause(){
  if (game.state !== "play" && game.state !== "waveBanner") return;
  game.paused = !game.paused;
  if (game.paused) S().switch();   // 菜单点按音
}
function bankProgress(){
  // B 键：局中即时存档——场上素材球/宝石兜底入账，素材入档，进度落盘（死亡也不丢）
  if ((game.state !== "play" && game.state !== "waveBanner") || game.state === "title") return;
  for (const o of orbs) {
    if (o.kind === "xt") game.roundXt += o.amount;
    if (o.kind === "jp") game.roundJp += o.amount;
    if (o.kind === "cy") game.roundCy += o.amount;
    if (o.kind === "gem") applyGem(o.sub);
  }
  orbs.length = 0;
  const xt = game.roundXt, jp = game.roundJp, cy = game.roundCy;
  SAVE.xt += xt; SAVE.jp += jp; SAVE.cy += cy;
  game.roundXt = 0; game.roundJp = 0; game.roundCy = 0;
  persist();
  toast(xt + jp + cy > 0 ? ("进度已存档：玄铁 " + xt + " · 精魄 " + jp + " · 残页 " + cy) : "进度已存档（等级/经验/物品已永久有效）");
  S().pickup();
}
function handleUIPoint(p){
  // v0.5：战斗中也可点 HUD 右上角 ⏸ 图标；命中任何 UI 按钮即吞掉本次点击
  for (const b of game.uiButtons) {
    if (p.x > b.x && p.x < b.x + b.w && p.y > b.y && p.y < b.y + b.h) {
      if (b.enabled !== false) b.cb(); else toast("素材不足");
      return true;
    }
  }
  if (game.state === "play" && !game.paused) return false;
  return game.state !== "play" || game.paused;
}
function uiBtn(x, y, w, h, label, cb, enabled){
  game.uiButtons.push({ x, y, w, h, label, cb, enabled: enabled !== false });
}

// ---------- 主更新 ----------
function update(dtReal){
  if (game.paused) return;   // v0.5：暂停时世界冻结（渲染继续）
  nowSec += dtReal;
  AudioSys.tick();
  // v0.6：山门传送转场——半程切关，全程冻结世界
  if (game.transit.active) {
    const tr = game.transit;
    tr.t += dtReal;
    if (!tr.switched && tr.t >= tr.dur * 0.5) { tr.switched = true; startRun(); }
    if (tr.t >= tr.dur) { tr.active = false; }
    return;
  }
  // v0.8 丝滑改造：打击停顿只"钉住"敌人（近乎冻结），玩家/宠物/特效/镜头全速更新——
  // 打击感保留（敌人定格、震屏照播），但放技能、按键永远即时响应，不再有"卡了一下"的感觉
  const frozen = hitstop > 0;
  if (frozen) hitstop = Math.max(0, hitstop - dtReal);
  // 剑意时刻：敌人侧时缓
  enemyTimeScale = lerp(enemyTimeScale, timeScale, 1 - Math.pow(0.0001, dtReal));
  timeScale = lerp(timeScale, 1, 1 - Math.pow(0.02, dtReal));

  shakeX = rand(-shake, shake) + shakeDir * shake * 0.55;   // 定向震屏
  shakeY = rand(-shake, shake);
  shake = Math.max(0, shake - dtReal * 34);
  shakeDir = lerp(shakeDir, 0, 1 - Math.pow(0.001, dtReal));
  zoom = Math.max(0, zoom - dtReal * 0.24);                  // 镜头推近回弹
  flashT = Math.max(0, flashT - dtReal);

  if (game.state === "play" || game.state === "waveBanner") updateCombat(dtReal, frozen);
  updateFx(dtReal);
  // 相机
  const target = clamp(player.x - W * 0.42, 0, WORLD_W - W);
  camera.x = lerp(camera.x, target, 1 - Math.pow(0.001, dtReal));
  if (game.state === "waveBanner") { game.bannerT -= dtReal; if (game.bannerT <= 0) game.state = "play"; }
  if (game.state === "forge") game.forgeMsgT -= dtReal;
}

function updateFx(dt){
  updatePetals(dt);   // v0.6：花瓣飘落（纯视觉）
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i]; p.t += dt;
    if (p.ring) { if (p.t > p.life) particles.splice(i, 1); continue; }
    p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 900 * dt;
    if (p.t > p.life) particles.splice(i, 1);
  }
  for (let i = dmgTexts.length - 1; i >= 0; i--) {
    const d = dmgTexts[i]; d.t += dt; d.y += d.vy * dt; d.vy *= 0.94;
    if (d.t > d.life) dmgTexts.splice(i, 1);
  }
  for (let i = orbs.length - 1; i >= 0; i--) {
    const o = orbs[i]; o.t += dt;
    if (o.t < 0.6) { o.x += o.vx * dt; o.y += o.vy * dt; o.vy += 1400 * dt; if (o.y > GROUND - 8) { o.y = GROUND - 8; o.vy = 0; o.vx *= 0.8; } }
    else { // 飞向玩家
      const dx = player.x - o.x, dy = (player.y - 50) - o.y, dist = Math.hypot(dx, dy) + 0.01;
      const spd = Math.min(900, 300 + o.t * 800);
      o.x += dx / dist * spd * dt; o.y += dy / dist * spd * dt;
      if (dist < 30) {
        if (o.kind === "xt") game.roundXt += o.amount;
        if (o.kind === "jp") game.roundJp += o.amount;
        if (o.kind === "cy") game.roundCy += o.amount;
        if (o.kind === "gem") { applyGem(o.sub); orbs.splice(i, 1); continue; }
        dmgText(o.x, o.y - 20, "+" + o.amount + (o.kind === "xt" ? " 玄铁" : o.kind === "jp" ? " 精魄" : " 残页"), "#9fd6ff", false);
        orbs.splice(i, 1);
      }
    }
  }
}

// ---------- 战斗更新 ----------
function updateCombat(dtReal, frozen){
  const pdt = dtReal; // 玩家在剑意时刻/打击停顿中都不减速（反杀窗口 + 丝滑操作，GDD §4.2 / §6E）
  const edt = dtReal * enemyTimeScale * (frozen ? 0.05 : 1);   // 打击停顿 = 敌人侧急冻
  updatePlayer(pdt);
  updatePet(pdt);       // 灵狐随玩家全速行动（不受敌方时缓）
  for (const e of enemies) updateEnemy(e, edt);
  updateProjectiles(frozen ? dtReal * 0.3 : dtReal);   // 投射物在顿帧里慢放（视觉），不吃敌方时缓
  updateBlasts(pdt);        // v0.7：冲击波/风爆结算（同样不吃时缓）
  // v0.6：向前探索——推进到关口才刷怪 / BOSS 拦路判定
  updateStageProgress();
  // 玩家攻击 → 命中判定
  if (player.state === "attack" && player.phase === "active") checkPlayerHits();
  // 敌人攻击 → 命中/完美闪避判定
  for (const e of enemies) if (e.state === "attack" && !e.swingDone) checkEnemyHit(e);
  // 清理死亡
  for (let i = enemies.length - 1; i >= 0; i--) if (enemies[i].dead) enemies.splice(i, 1);
  // 关口清场：解开去路，继续向前
  if (enemies.length === 0 && game.state === "play" && !level.bossArmed) {
    const g = level.gates[game.wave - 1];
    if (g && g.spawned && !g.cleared) gateCleared(g);
  }
  // BGM 情绪跟随战况（探索 / 交战 / BOSS）
  AudioSys.setMood(level.bossSpawned && enemies.some(e => e.isBoss) ? "boss" : (enemies.length > 0 ? "battle" : "explore"));
  if (player.hp <= 0) onPlayerDeath();
  if (game.state === "waveBanner") player.animT += pdt;
}

function updatePlayer(dt){
  player.animT += dt;
  player.dodgeCDT = Math.max(0, player.dodgeCDT - dt);
  player.invulnT = Math.max(0, player.invulnT - dt);
  player.iframesT = Math.max(0, player.iframesT - dt);
  player.comboT = Math.max(0, player.comboT - dt);
  for (const w of WEAPON_ORDER) for (let si = 0; si < 3; si++) player.skillCDs[w][si] = Math.max(0, player.skillCDs[w][si] - dt);

  const wantDodge = (dodgeBtn || pressedThisFrame.has("l") || pressedThisFrame.has("L"));
  const wantJump = (jumpBtnPressed || pressedThisFrame.has(" ") || pressedThisFrame.has("ArrowUp") || pressedThisFrame.has("k") || pressedThisFrame.has("K"));
  const wantSkill = [
    (skillReq[0] || pressedThisFrame.has("u") || pressedThisFrame.has("U")),
    (skillReq[1] || pressedThisFrame.has("i") || pressedThisFrame.has("I")),
    (skillReq[2] || pressedThisFrame.has("o") || pressedThisFrame.has("O")),
  ];
  const wantBlock = (blockBtn || keys["s"] || keys["S"]);   // S = 防护（格挡）键
  const wantSwitch = (switchReq || pressedThisFrame.has("q") || pressedThisFrame.has("Q") || pressedThisFrame.has("Tab"));
  // v0.5：按下的瞬间记缓冲时间戳（0.2-0.25s 内有效）
  if (wantJump) jumpBufAt = nowSec;
  if (wantDodge) dodgeBufAt = nowSec;
  if (wantSwitch) switchBufAt = nowSec;
  // ---- v0.8 丝滑三件套 ----
  // ① 技能输入缓冲：任何状态（攻击/格挡/其他技能中）按下 U/I/O 都记录，0.35s 内进入可施放状态即触发
  for (let si = 0; si < 3; si++) if (wantSkill[si]) skillBufAt[si] = nowSec;
  const skillReady = si => (wantSkill[si] || (skillBufAt[si] > 0 && nowSec - skillBufAt[si] <= 0.35)) && player.skillCDs[player.weapon][si] <= 0;
  const castNow = si => { skillBufAt[si] = -1; player.buffered = false; castWeaponSkill(si); };
  // ② 技能与移动键同时生效：frac = 该技能允许的移速比例，canTurn = 是否允许转向
  const steer = (frac, canTurn) => {
    const d = inputDir();
    if (d !== 0) { player.x = clamp(player.x + d * BASE.speed * frac * dt, 30, maxX()); if (canTurn) player.facing = d; }
  };
  // ③ 持续型技能中可起跳（跳跃缓冲同自由态）
  const skillJump = () => {
    if ((wantJump || (jumpBufAt > 0 && nowSec - jumpBufAt <= 0.2)) && player.onGround) {

function checkPlayerHits(){
  const st = stageStats();
  const x0 = player.x + player.facing * 30, x1 = player.x + player.facing * (30 + st.range);
  const hx0 = Math.min(x0, x1), hx1 = Math.max(x0, x1);
  for (const e of enemies) {
    if (player.hitSet.has(e) || e.dead) continue;
    const ex = e.x, eh = 90 * e.scale, ey = e.y;
    const ew = 34 * e.scale;
    if (ex + ew > hx0 && ex - ew < hx1 && Math.abs(ey - player.y) < st.h + 80) {
      player.hitSet.add(e);
      hitEnemy(e, playerAttackDamage(), st, player.facing);
      // 空中下劈命中 → pogo 弹跳（GDD §4.4：跳跃参与战斗的理由）
      if (player.stage === 4 && !player.onGround) {
        player.vy = -560;
        burst(player.x, player.y - 20, "#ffeecc", 6, 200);
      }
    }
  }
}
function hitEnemy(e, dmg, st, dir, srcX){
  // 暴击判定（剑意必暴 + 秘纹会心）
  let crit = player.nextCrit || Math.random() < critChance();
  player.nextCrit = false;
  let final = dmg * (crit ? BASE.critMul : 1);
  // 盾卫盾牌：正面攻击先打盾（GDD §4.3）——盾有耐久，打破后永久失去格挡

    e.shieldHp = Math.max(0, e.shieldHp - final * 3);
    e.shieldFlash = 0.24;
    S().shieldBreak();
    starRing(e.x + e.facing * 30, e.y - 55 * e.scale, 130, "#d8ffe8");

    }
  }
  if (e.type === "shield" && !e.shieldBroken && !e.isBoss && !st.ignoreShield) {
    // 攻击来自敌人面朝方向 = 正面
    const fromFront = Math.sign((srcX === undefined ? player.x : srcX) - e.x) === e.facing;
    if (fromFront) {
      const sx = e.x + e.facing * 30, sy = e.y - 55 * e.scale;
      // 重击（蓄力/空中下劈/重招）破盾效率 2.5 倍，并震入少量真伤；轻击全吃在盾上
      e.shieldHp = Math.max(0, e.shieldHp - final * (st.heavy ? 2.5 : 1));
      e.shieldFlash = 0.22;
      S().hitLight();
      // 金属火花：白蓝短线四溅 + 橙黄火星 + 盾面冲击环
      burst(sx, sy, "#dfe9ff", 12, 430);
      burst(sx, sy, "#ffcf8a", 6, 320);
      ring(sx, sy, 52, "#cfe4ff");
      hitstop = Math.max(hitstop, 0.07); punch(dir, 7); zoom = Math.max(zoom, 0.022);
      flash("rgba(210,235,255,0.18)", 0.06);
      if (navigator.vibrate) navigator.vibrate(12);
      if (e.shieldHp <= 0) {
        // ---- 破盾：盾面炸裂 → 长踉跄 + 穿透伤害 ----
        e.shieldBroken = true;
        S().shieldBreak();
        e.hp -= final * 0.6;
        hitstop = 0.15; punch(dir, 14); zoom = Math.max(zoom, 0.07);
        shake = Math.max(shake, 12);
        flash("rgba(255,255,255,0.5)", 0.14);
        starRing(sx, sy, 135, "#fff2c4");
        ring(sx, sy, 110, "#ffffff");
        burst(sx, sy, "#dfe9ff", 28, 640);     // 盾片飞散
        burst(sx, sy, "#ffffff", 16, 430);
        dmgText(e.x, e.y - 122, "破 盾!", "#ffe066", true);
        if (navigator.vibrate) navigator.vibrate(45);
        if (!e.elite) { e.state = "stagger"; e.staggerT = 1.0; e.t = 0; }
        else e.x = clamp(e.x + dir * 40, 30, WORLD_W - 30);
        if (e.hp <= 0) { killEnemy(e, dir); return; }
        return;
      }
      if (st.heavy) {
        // 盾未破但被重击：震入 35% 真伤
        e.hp -= final * 0.35;
        dmgText(e.x, e.y - 102, Math.round(final * 0.35), "#ffaa66", false);
        if (e.hp <= 0) { killEnemy(e, dir); return; }
      } else {
        dmgText(e.x, e.y - 102, "盾 " + Math.ceil(e.shieldHp), "#9fd6ff", false);
      }
      return;
    }
  }
  e.hp -= final;
  e.hitFlash = 0.18;
  const heavyHit = st.heavy || player.stage === 3;
  if (crit) S().crit(); else if (heavyHit) S().hitHeavy(); else S().hitLight();
  const hx = e.x - dir * 20, hy = e.y - 55 * e.scale;
  // ---- 反馈通道全开（GDD §7）：hitstop / 定向震屏 / 冲击环 / 星芒 / 推镜 / 闪屏 ----
  hitstop = heavyHit ? 0.10 : 0.055;
  punch(dir, heavyHit ? 12 : 7);
  zoom = Math.max(zoom, crit ? 0.062 : (heavyHit ? 0.048 : 0.022));
  flash(crit ? "rgba(255,255,255,0.45)" : (heavyHit ? "rgba(255,225,185,0.3)" : "rgba(255,255,255,0.18)"), crit ? 0.12 : 0.09);
  ring(hx, hy, heavyHit || crit ? 92 : 58, crit ? "#ff6644" : (heavyHit ? "#ffbb77" : "#ffeecc"));
  ring(hx, hy, heavyHit || crit ? 58 : 38, "#ffffff");
  if (heavyHit || crit) starRing(hx, hy, crit ? 120 : 96, crit ? "#ffd0b0" : "#fff2c4");
  burst(hx, hy, crit ? "#ff8855" : (heavyHit ? "#ff8855" : "#ffeebb"), heavyHit || crit ? 18 : 10, 460);
  burst(hx, hy, "#ffffff", heavyHit || crit ? 8 : 4, 620);   // 高速白色火花
  if (navigator.vibrate) navigator.vibrate(heavyHit || crit ? 30 : 14);
  dmgText(e.x, e.y - 100, Math.round(final), crit ? "#ff3333" : "#ffcc66", crit || heavyHit);
  // 击退与踉跄（精英霸体除外）
  if (!e.elite && !e.isBoss) {
    e.x = clamp(e.x + dir * st.knock, 30, WORLD_W - 30);
    e.state = "stagger"; e.staggerT = st.stagger; e.t = 0;
  } else if (!e.isBoss) {
    e.x = clamp(e.x + dir * st.knock * 0.15, 30, WORLD_W - 30);
  }
  // 嗜血剑意
  if (SAVE.relics.vampire) { player.hp = Math.min(playerMaxHp(), player.hp + final * 0.08); }

function killEnemy(e, dir){

  if (player.hp < playerMaxHp()) {
    player.hp = Math.min(playerMaxHp(), player.hp + heal);
    dmgText(player.x, player.y - 125, "+" + heal, "#4cd964", false);

  if (e.isBoss) {

    dropGem(e.x + 40, e.y - 60);   // 精英必掉一个永久升级物品

function checkEnemyHit(e){
  // 敌方攻击判定盒
  let rx = e._range * (e.scale || 1), ax0, ax1;
  if (e.isBoss) { rx = e.bossRange || 140; }
  ax0 = Math.min(e.x + e.facing * 30, e.x + e.facing * (30 + rx));
  ax1 = Math.max(e.x + e.facing * 30, e.x + e.facing * (30 + rx));
  const pw = 26, px0 = player.x - pw, px1 = player.x + pw;
  const overlapX = px1 > ax0 && px0 < ax1 && Math.abs(player.y - e.y) < 110;
  if (!overlapX) return;
  // 威胁计数：每次挥刀只计一次（GDD §9 B 信号的分母）
  if (!e.swingCounted) { e.swingCounted = true; player.stats.threats++; }
  if (player.invulnT > 0) return;          // 受击保护
  if (player.iframesT > 0) {               // 完美闪避（GDD §4.2：i-frames 中穿过刀锋）
    if (e.perfectArmed) {
      e.perfectArmed = false;
      player.stats.perfect++;
      triggerSwordFocus();
    }
    return;
  }
  if (e.swingDone) return;                 // 本次挥刀已命中过
  // ---- 格挡（S）：只防正面；起手 0.18s 内 = 完美格挡 ----
  if (player.state === "block") {
    const toEnemy = Math.sign(e.x - player.x) || player.facing;
    if (toEnemy === player.facing) {
      e.swingDone = true;
      if (player.blockT <= 0.18) {
        // 完美格挡（parry）：无伤 + 敌方大踉跄 + 反击必暴
        player.stats.parries++;
        player.nextCrit = true;
        if (!e.isBoss && !e.elite) { e.state = "stagger"; e.staggerT = 1.1; e.t = 0; }
        else e.x = clamp(e.x + toEnemy * 60, 30, WORLD_W - 30);
        hitstop = 0.11; punch(toEnemy, 7); zoom = Math.max(zoom, 0.04);
        flash("rgba(255,255,255,0.35)", 0.12);
        S().parry();
        ring(player.x + player.facing * 42, player.y - 55, 95, "#ffffff");
        burst(player.x + player.facing * 42, player.y - 55, "#ffffff", 12, 340);
        dmgText(player.x, player.y - 112, "完美格挡!", "#ffffff", true);
        if (navigator.vibrate) navigator.vibrate(30);
        return;
      }
      // 普通格挡：削 80% 伤害，小幅后坐
      player.stats.blocked++;
      const chip = Math.max(1, Math.round(e.atk * 0.2));
      player.hp -= chip;
      player.vx = -e.facing * 150;
      hitstop = 0.06; punch(toEnemy, 5);
      S().block();
      burst(player.x + player.facing * 42, player.y - 55, "#ffffff", 8, 260);
      ring(player.x + player.facing * 42, player.y - 55, 55, "#ffffff");
      dmgText(player.x, player.y - 112, "格挡 -" + chip, "#cccccc", false);
      if (navigator.vibrate) navigator.vibrate(12);
      return;
    }
    // 背后受击：格挡无效，走正常伤害
  }
  // 命中玩家
  e.swingDone = true;
  if (player.state === "attack" || player.state === "charge") player.stats.deathWhileAttacking++;
  player.stats.hitsTaken++;
  player.hp -= e.atk;
  S().hurt();
  player.state = "hurt"; player.hurtT = 0.5; player.invulnT = 0.8;   // GDD §3.1
  player.buffered = false;                                          // 受击打断：连段缓冲一并清除
  player.vx = -e.facing * 260;
  // ---- 受击反馈：屏红闪 + 定向后坐震屏 ----
  hitstop = 0.06;
  punch(-e.facing, 9);
  zoom = Math.max(zoom, 0.02);
  flash("rgba(255,60,60,0.32)", 0.13);
  ring(player.x, player.y - 55, 60, "#ff5544");
  burst(player.x, player.y - 55, "#ff4444", 12, 320);
  dmgText(player.x, player.y - 100, Math.round(e.atk), "#ff4444", true);
  if (navigator.vibrate) navigator.vibrate(40);
}
function triggerSwordFocus(){
  timeScale = 0.3; enemyTimeScale = 0.3;
  S().parry();
  player.nextCrit = true;
  dmgText(player.x, player.y - 130, "剑意!", "#ffee55", true);
  ring(player.x, player.y - 50, 80, "#ffee55");
  burst(player.x, player.y - 50, "#ffee55", 14, 340);
  flash("rgba(255,238,120,0.18)", 0.1);

// ---------- 敌人 AI ----------
function updateEnemy(e, dt){
  e.hitFlash = Math.max(0, e.hitFlash - dt);
  if (e.shieldFlash) e.shieldFlash = Math.max(0, e.shieldFlash - dt);
  if (e.dead) return;
  if (e.isBoss) { updateBoss(e, dt); return; }
  if (e.state === "stagger") { e.staggerT -= dt; if (e.staggerT <= 0) e.state = "approach"; return; }
  const dx = player.x - e.x;
  const dist = Math.abs(dx);
  e.t += dt;

  if (e.state === "approach") {
    if (dist > e._range * 0.85) { e.facing = Math.sign(dx) || 1; e.x = clamp(e.x + e.facing * e.speed * dt, 30, WORLD_W - 30); }
    else { e.state = "telegraph"; e.t = 0; e.perfectArmed = true; e.swingDone = false; e.swingCounted = false; }
  } else if (e.state === "telegraph") {
    e.facing = Math.sign(player.x - e.x) || e.facing;
    if (e.t >= e._tele) { e.state = "attack"; e.t = 0; }
  } else if (e.state === "attack") {
    // 攻击时小幅前冲
    e.x = clamp(e.x + e.facing * 220 * dt * (e.type === "grunt" ? 1.6 : 1), 30, WORLD_W - 30);
    if (e.t >= e._active) { e.state = "recover"; e.t = 0; }
  } else if (e.state === "recover") {
    if (e.t >= e._recovery) { e.state = "approach"; e.t = 0; }
  }
}
function updateBoss(b, dt){
  b.t += dt;
  b.phase = b.hp > b.maxHp * 0.6 ? 1 : (b.hp > b.maxHp * 0.3 ? 2 : 3);
  b.enrage = b.phase === 3 ? 1.35 : 1;
  const dx = player.x - b.x, dist = Math.abs(dx);
  if (b.state === "idle") {
    b.facing = Math.sign(dx) || 1;
    if (dist > 180) b.x = clamp(b.x + b.facing * 200 * b.enrage * dt, 30, WORLD_W - 30);
    if (b.t > 0.9 / b.enrage) { pickBossMove(b, dist); }
  } else if (b.state === "telegraph") {
    if (b.t >= b._tele) { b.state = "attack"; b.t = 0; b.swingDone = false; b.perfectArmed = true; b.swingCounted = false; }
  } else if (b.state === "attack") {
    if (b.move === "dash") b.x = clamp(b.x + b.facing * 700 * b.enrage * dt, 30, WORLD_W - 30);
    if (b.move === "slam") { if (b.t > 0.25 && !b.slamJumped) { b.slamJumped = true; } b.x = clamp(b.x + b.facing * 320 * dt, 30, WORLD_W - 30); }
    if (b.t >= b._active) {
      if (b.move === "slam" && !b.shockDone) {
        b.shockDone = true;
        punch(b.facing, 13); zoom = Math.max(zoom, 0.035); flash("rgba(255,170,80,0.3)", 0.1);
        ring(b.x, GROUND - 30, 120, "#ffaa33");
        burst(b.x, GROUND, "#ffaa33", 20, 420);
        // 地波：贴地判定一次（简化为近距离伤害）
        if (Math.abs(player.x - b.x) < 260 && player.iframesT <= 0 && player.invulnT <= 0) {
          player.hp -= b.atk * 0.8; player.stats.hitsTaken++;
          player.state = "hurt"; player.hurtT = 0.5; player.invulnT = 0.8; player.vx = -b.facing * 300;
          dmgText(player.x, player.y - 100, Math.round(b.atk * 0.8), "#ff4444", true);
        }
      }
      b.state = "recover"; b.t = 0;
    }
  } else if (b.state === "recover") {
    if (b.t >= b._recovery / b.enrage) { b.state = "idle"; b.t = 0; b.slamJumped = false; b.shockDone = false; }
  }
  // 连击（P2 阶段三连突刺）
  if (b.state === "idle" && b.phase >= 2 && Math.random() < 0.3) { b.combo = 3; }
  if (b.state === "recover" && b.combo > 0) { b.combo--; pickBossMove(b, dist); }
}
function pickBossMove(b, dist){
  b.state = "telegraph"; b.t = 0;
  if (b.phase === 1 || Math.random() < 0.6) {
    if (dist > 350) { b.move = "dash"; b._tele = 0.6; b._active = 0.30; b._recovery = 0.8; b.bossRange = 130; }
    else { b.move = "thrust"; b._tele = 0.5; b._active = 0.18; b._recovery = 0.7; b.bossRange = 170; }
  } else {
    b.move = "slam"; b._tele = 0.7; b._active = 0.45; b._recovery = 1.0; b.bossRange = 0;
  }
}

// ---------- 死亡 / 胜利（GDD §3.2 / §9） ----------
function onPlayerDeath(){
  if (game.state === "death") return;
  S().death();
  grantRoundMaterials();   // P3：死亡素材全额保留
  game.state = "death";
  burst(player.x, player.y - 50, "#ffffff", 24, 420);
  shake = 8;
}
function onVictory(){
  if (game.state === "victory") return;
  S().victory();
  grantRoundMaterials();
  SAVE.bestTrial = Math.max(SAVE.bestTrial, SAVE.trialLevel);
  SAVE.trialLevel = SAVE.trialLevel + 1;   // 解锁下一关
  persist();   // v0.4：每通一关即时存档（等级/经验/素材/升级物品全部落盘）
  game.state = "victory";
  game.saveFlash = 2;   // 胜利界面"已存档"提示计时
  dmgText(player.x, player.y - 160, "进度已存档", "#7fe89a", true);
  shake = 6;
}

// ---------- 渲染 ----------
function render(){
  ctx.save();
  ctx.scale(cv.width / W, cv.height / H);
  ctx.fillStyle = "#0b0d10"; ctx.fillRect(0, 0, W, H);
  if (game.state === "title") { drawTitle(); ctx.restore(); return; }
  if (game.state === "forge") { drawForge(); ctx.restore(); return; }

  drawBackground();
  ctx.save();
  // 重击/暴击/击杀：镜头瞬间推近（zoom punch）
  const z = 1 + zoom;
  if (z > 1.001) { ctx.translate(W / 2, H / 2); ctx.scale(z, z); ctx.translate(-W / 2, -H / 2); }
  ctx.translate(-camera.x + shakeX, shakeY);

  // 地面
  ctx.strokeStyle = "#2a2f36"; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(0, GROUND + 2); ctx.lineTo(WORLD_W, GROUND + 2); ctx.stroke();
  // 地纹（单路径批量 + 只画可视区：合并 stroke 调用降卡顿）
  ctx.strokeStyle = "#1a1e24"; ctx.lineWidth = 1;
  ctx.beginPath();
  const gx0 = Math.max(0, Math.floor((camera.x - 120) / 90) * 90), gx1 = Math.min(WORLD_W, camera.x + W + 120);
  for (let x = gx0; x <= gx1; x += 90) { ctx.moveTo(x, GROUND + 2); ctx.lineTo(x - 30, GROUND + 34); }
  ctx.stroke();

  // 剑意时刻氛围
  if (enemyTimeScale < 0.7) { ctx.fillStyle = "rgba(180,200,255,0.08)"; ctx.fillRect(camera.x, 0, W, H); }

  drawGates();
  for (const o of orbs) drawOrb(o);
  for (const e of enemies) if (!e.dead) drawEnemy(e);   // 尸体不再渲染（碎裂粒子已接管）
  for (const pr of projectiles) drawProjectile(pr);
  drawBlasts();
  if (portal) drawPortal();
  drawPet();
  if (game.state !== "death") drawPlayer();
  for (const p of particles) drawParticle(p);
  for (const d of dmgTexts) drawDmgText(d);

  ctx.restore();
  drawPetals();
  drawHUD();
  // 命中/受击/剑意 闪屏层（反馈通道，GDD §7）
  if (flashT > 0) { ctx.globalAlpha = Math.min(1, flashT * 7); ctx.fillStyle = flashColor; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
  if (game.state === "waveBanner") drawBanner();
  if (game.state === "death") drawDeath();
  if (game.state === "victory") drawVictory();
  if (game.state === "play" && isTouchDevice()) drawTouchControls();
  if (game.paused) drawPause();   // v0.5：暂停覆盖层（最后画，压住一切）
  if (game.transit.active) drawTransit();   // v0.6：山门传送转场（最上层）
  ctx.restore();
}

// ---------- 江湖背景（v0.6：多层视差 · 竹林客栈 · 关口牌坊 · 飘落花瓣） ----------
let bgSeed = 1;
function bgRand(){ bgSeed = (bgSeed * 1664525 + 1013904223) >>> 0; return bgSeed / 4294967296; }
const bg = { pines: [], roofs: [], lanterns: [], petals: [] };
function buildBackdrop(){
  bgSeed = 9871 + game.trial * 613;
  bg.pines = []; bg.roofs = []; bg.lanterns = []; bg.petals = [];
  const spanP = WORLD_W * 0.55 + W + 600;
  for (let i = 0; i < 90; i++) bg.pines.push({
    x: bgRand() * spanP, h: 110 + bgRand() * 170,
    s: 0.75 + bgRand() * 0.55, bamboo: bgRand() < 0.6, lean: (bgRand() - 0.5) * 0.18,
  });
  const spanR = WORLD_W * 0.78 + W + 600;
  for (let i = 0; i < 16; i++) bg.roofs.push({
    x: bgRand() * spanR, w: 150 + bgRand() * 170, h: 54 + bgRand() * 46, lamp: bgRand() < 0.7,
  });
  for (let i = 0; i < 34; i++) bg.lanterns.push({ x: bgRand() * spanR, y: GROUND - 150 - bgRand() * 110, r: 3.2 + bgRand() * 3.4, ph: bgRand() * 6.3 });
  for (let i = 0; i < 46; i++) bg.petals.push({
    x: bgRand() * W, y: bgRand() * H, vy: 10 + bgRand() * 30, vx: -14 - bgRand() * 30,
    r: 1.8 + bgRand() * 2.4, a: bgRand() * 6.28, spin: (bgRand() - 0.5) * 2.4,
  });
}
buildBackdrop();   // 标题界面也先铺一层江湖夜
function updatePetals(dt){  for (const p of bg.petals) {
    p.x += p.vx * dt; p.y += p.vy * dt; p.a += p.spin * dt;
    if (p.y > H + 10 || p.x < -20) { p.y = -10; p.x = Math.random() * W * 1.15; }
  }
}
function drawHillLayer(p, baseY, amp, color, phase, rim){
  const ox = camera.x * p;
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(-90, H);
  ctx.lineTo(-90, baseY);
  for (let x = -90; x <= W + 110; x += 64) {
    const wx = x + ox;
    const y = baseY - amp * (0.55 + 0.45 * Math.sin(wx * 0.0034 + phase)) - amp * 0.22 * Math.sin(wx * 0.0112 + phase * 2.1);
    ctx.lineTo(x, y);
  }
  ctx.lineTo(W + 110, baseY);
  ctx.lineTo(W + 110, H);
  ctx.closePath(); ctx.fill();
  // 月光山脊（极淡的一线亮边，撑出水墨层次）
  if (rim) {
    ctx.strokeStyle = rim; ctx.lineWidth = 1.4;
    ctx.beginPath();
    for (let x = -90; x <= W + 110; x += 64) {
      const wx = x + ox;
      const y = baseY - amp * (0.55 + 0.45 * Math.sin(wx * 0.0034 + phase)) - amp * 0.22 * Math.sin(wx * 0.0112 + phase * 2.1);
      if (x === -90) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
  }
}
function drawPagoda(sx, baseY, h, color){
  if (sx < -140 || sx > W + 140) return;
  ctx.fillStyle = color;
  const tiers = 4, tw = h * 0.42;
  for (let i = 0; i < tiers; i++) {
    const ty = baseY - h + i * (h / tiers);
    const w = tw * (0.55 + i * 0.15);
    ctx.beginPath();
    ctx.moveTo(sx - w, ty + h / tiers * 0.62);
    ctx.lineTo(sx - w * 0.62, ty);
    ctx.lineTo(sx + w * 0.62, ty);
    ctx.lineTo(sx + w, ty + h / tiers * 0.62);
    ctx.closePath(); ctx.fill();
    ctx.fillRect(sx - w * 0.16, ty + h / tiers * 0.62, w * 0.32, h / tiers * 0.3);
  }
  ctx.fillRect(sx - 1.5, baseY - h - 12, 3, 14);
}
function drawBackground(){
  // 天幕：夜墨渐层
  const sky = ctx.createLinearGradient(0, 0, 0, GROUND + 40);
  sky.addColorStop(0, "#05070e");
  sky.addColorStop(0.42, "#0a1220");
  sky.addColorStop(1, "#16202e");
  ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);
  // 星子（视差 0.02，缓慢漂移）
  const sox = camera.x * 0.02;
  ctx.fillStyle = "#dfe8f5";
  for (let i = 0; i < 60; i++) {
    const sx = ((i * 197 - sox) % (W + 80) + W + 80) % (W + 80) - 40;
    const sy = 26 + ((i * 89) % 240);
    ctx.globalAlpha = 0.18 + ((i * 37) % 10) / 26 + 0.12 * Math.sin(nowSec * 1.4 + i);
    ctx.fillRect(sx, sy, 1.7, 1.7);
  }
  ctx.globalAlpha = 1;
  // 月
  const mx = 980 - camera.x * 0.05;
  ctx.fillStyle = "#e8e4d8"; ctx.beginPath(); ctx.arc(mx, 128, 54, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#0a0f18"; ctx.beginPath(); ctx.arc(mx + 21, 116, 47, 0, Math.PI * 2); ctx.fill();
  // 云带（三条，缓慢横移）
  for (let i = 0; i < 3; i++) {
    const cy = 110 + i * 54;
    const cx = ((mx * 0.6 + i * 420 - camera.x * (0.03 + i * 0.012)) % (W + 460) + W + 460) % (W + 460) - 230;
    ctx.globalAlpha = 0.1 - i * 0.02;
    ctx.fillStyle = "#9fb2c8";
    ctx.beginPath(); ctx.ellipse(cx, cy, 230 + i * 40, 16 + i * 3, 0, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
  // 远山三层（水墨剪影，越远越淡；带一线月光山脊）
  drawHillLayer(0.08, GROUND - 60, 150, "#101b28", 0.6, "rgba(150,180,215,0.10)");
  drawHillLayer(0.16, GROUND - 30, 112, "#16222f", 2.1, "rgba(150,180,215,0.09)");
  drawHillLayer(0.26, GROUND + 6, 78, "#1c2a38", 4.4, "rgba(150,180,215,0.08)");
  // 塔影（寺院远影）
  drawPagoda(520 - camera.x * 0.34, GROUND - 40, 210, "#0f1a26");
  drawPagoda(1420 - camera.x * 0.34, GROUND - 30, 150, "#0f1a26");
  drawPagoda(2350 - camera.x * 0.34, GROUND - 36, 178, "#0e1824");
  drawPagoda(3400 - camera.x * 0.34, GROUND - 26, 132, "#0e1824");
  drawPagoda(4900 - camera.x * 0.34, GROUND - 34, 190, "#0e1824");
  // 雾带
  ctx.fillStyle = "rgba(140,168,196,0.05)";
  ctx.fillRect(0, GROUND - 150, W, 46);
  ctx.fillStyle = "rgba(140,168,196,0.04)";
  ctx.fillRect(0, GROUND - 96, W, 34);
  // 竹林 / 松林（视差 0.55）
  const pox = camera.x * 0.55;
  for (const t of bg.pines) {
    const sx = t.x - pox;
    if (sx < -160 || sx > W + 160) continue;
    const by = GROUND - 2;
    if (t.bamboo) {
      ctx.strokeStyle = "#24483b"; ctx.lineWidth = 3.4 * t.s; ctx.lineCap = "round";
      const tipX = sx + t.lean * t.h, tipY = by - t.h;
      ctx.beginPath(); ctx.moveTo(sx, by); ctx.quadraticCurveTo(sx + t.lean * t.h * 0.35, by - t.h * 0.6, tipX, tipY); ctx.stroke();
      // 竹节
      ctx.strokeStyle = "#2f5a49"; ctx.lineWidth = 2.2 * t.s;
      for (let k = 1; k < 6; k++) {
        const q = k / 6, nx = sx + (tipX - sx) * q, ny = by + (tipY - by) * q;
        ctx.beginPath(); ctx.moveTo(nx - 4 * t.s, ny); ctx.lineTo(nx + 4 * t.s, ny); ctx.stroke();
      }
      // 竹叶（3~4 簇，交错方向）
      ctx.strokeStyle = "#2b5346"; ctx.lineWidth = 1.7 * t.s;
      for (let k = 2; k < 6; k++) {
        const q = k / 6, lx = sx + (tipX - sx) * q, ly = by + (tipY - by) * q;
        const dir = k % 2 ? 1 : -1;
        for (let f = 0; f < 3; f++) {
          ctx.beginPath();
          ctx.moveTo(lx, ly);
          ctx.quadraticCurveTo(lx + dir * (14 + f * 7) * t.s, ly - (8 + f * 3) * t.s, lx + dir * (24 + f * 11) * t.s, ly - (2 - f * 5) * t.s);
          ctx.stroke();
        }
      }
    } else {
      ctx.fillStyle = "#16281f";
      for (let k = 0; k < 3; k++) {
        const w = (46 - k * 11) * t.s, hh = t.h * (0.34 + k * 0.2);
        ctx.beginPath();
        ctx.moveTo(sx - w, by - hh * 0.62);
        ctx.lineTo(sx, by - hh - 14 * t.s);
        ctx.lineTo(sx + w, by - hh * 0.62);
        ctx.closePath(); ctx.fill();
      }
      ctx.strokeStyle = "#1a2a20"; ctx.lineWidth = 3 * t.s;
      ctx.beginPath(); ctx.moveTo(sx, by); ctx.lineTo(sx, by - t.h * 0.5); ctx.stroke();
    }
  }
  // 客栈屋檐 + 灯笼（视差 0.78）
  const rox = camera.x * 0.78;
  for (const r of bg.roofs) {
    const sx = r.x - rox;
    if (sx < -260 || sx > W + 260) continue;
    const by = GROUND - 4;
    ctx.fillStyle = "#101a24";
    // 檐身
    ctx.beginPath();
    ctx.moveTo(sx - r.w / 2, by);
    ctx.lineTo(sx - r.w / 2, by - r.h * 0.5);
    ctx.lineTo(sx - r.w * 0.58, by - r.h * 0.55);
    ctx.lineTo(sx - r.w * 0.3, by - r.h);
    ctx.lineTo(sx + r.w * 0.3, by - r.h);
    ctx.lineTo(sx + r.w * 0.58, by - r.h * 0.55);
    ctx.lineTo(sx + r.w / 2, by - r.h * 0.5);
    ctx.lineTo(sx + r.w / 2, by);
    ctx.closePath(); ctx.fill();
    // 屋脊微光
    ctx.strokeStyle = "#1c2a38"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(sx - r.w * 0.3, by - r.h); ctx.lineTo(sx + r.w * 0.3, by - r.h); ctx.stroke();
    if (r.lamp) {
      const lx = sx + r.w * 0.42, ly = by - r.h * 0.42;
      ctx.fillStyle = "rgba(255,140,70,0.10)";
      ctx.beginPath(); ctx.arc(lx, ly, 16, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#c0392b";
      ctx.beginPath(); ctx.arc(lx, ly, 3.6, 0, Math.PI * 2); ctx.fill();
    }
  }
  // 悬空灯笼（暖点，带吊绳与穗子）
  for (const l of bg.lanterns) {
    const sx = l.x - rox;
    if (sx < -40 || sx > W + 40) continue;
    const fl = 0.72 + 0.28 * Math.sin(nowSec * 2.2 + l.ph);
    ctx.strokeStyle = "rgba(120,140,160,0.20)"; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(sx, l.y - l.r * 8); ctx.lineTo(sx, l.y - l.r); ctx.stroke();
    ctx.fillStyle = "rgba(255,150,80," + (0.10 * fl) + ")";
    ctx.beginPath(); ctx.arc(sx, l.y, l.r * 4.6, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "rgba(214,84,52," + (0.55 + 0.35 * fl) + ")";
    ctx.beginPath(); ctx.arc(sx, l.y, l.r, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "rgba(240,180,110,0.35)"; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(sx, l.y + l.r); ctx.lineTo(sx, l.y + l.r * 2.6); ctx.stroke();
  }
  // 前景芦草（近景框，遮住画面最下沿，增加纵深）
  const fgox = camera.x;
  ctx.strokeStyle = "#0b1119"; ctx.lineWidth = 2;
  ctx.beginPath();
  for (let i = 0; i < 90; i++) {
    const ph = (i * 173) % 1000;
    const sx = ((i * 149 - fgox) % (W + 160) + W + 160) % (W + 160) - 80;
    const h = 22 + (ph % 37);
    const sway = Math.sin(nowSec * 1.6 + i) * 3;
    ctx.moveTo(sx, H);
    ctx.quadraticCurveTo(sx + sway, H - h * 0.6, sx + sway * 2.2, H - h);
  }
  ctx.stroke();
  ctx.fillStyle = "#0a0f16";
  ctx.fillRect(0, H - 16, W, 16);
}
// 飘落花瓣（屏幕空间，雨后桃花）
function drawPetals(){
  for (const p of bg.petals) {
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.a);
    ctx.fillStyle = "rgba(226,150,170,0.55)";

    ctx.restore();
  }
}

// ---------- 关口牌坊（世界层，拦路 / 已通） ----------
function drawGate(g){
  const sx = g.x;   // 世界坐标系（渲染时已整体 translate(-camera.x)）
  if (sx < camera.x - 220 || sx > camera.x + W + 220) return;
  const by = GROUND;
  const blocked = g.spawned && !g.cleared;
  const done = g.cleared;
  const col = blocked ? "#c0563c" : done ? "#3d8a64" : "#6a4a42";
  const glow = blocked ? (0.45 + 0.35 * Math.sin(nowSec * 8)) : done ? 0.5 : 0;
  ctx.save();
  if (glow > 0) { ctx.globalAlpha = glow * 0.5; ctx.strokeStyle = blocked ? "#ff6644" : "#5fe8a0"; ctx.lineWidth = 12; }
  else { ctx.strokeStyle = col; ctx.lineWidth = 7; }
  ctx.lineCap = "butt";
  ctx.beginPath(); ctx.moveTo(sx - 56, by); ctx.lineTo(sx - 56, by - 166); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(sx + 56, by); ctx.lineTo(sx + 56, by - 166); ctx.stroke();
  ctx.globalAlpha = 1;
  // 横梁（两端上翘）
  ctx.strokeStyle = col; ctx.lineWidth = 8;
  ctx.beginPath();
  ctx.moveTo(sx - 96, by - 166); ctx.lineTo(sx - 56, by - 184);
  ctx.lineTo(sx + 56, by - 184); ctx.lineTo(sx + 96, by - 166);
  ctx.stroke();
  // 匾额
  ctx.fillStyle = "rgba(8,12,18,0.88)"; ctx.fillRect(sx - 27, by - 178, 54, 27);
  ctx.strokeStyle = col; ctx.lineWidth = 2; ctx.strokeRect(sx - 27, by - 178, 54, 27);
  ctx.fillStyle = blocked ? "#ff9b7a" : done ? "#8ee8b0" : "#9fb2c8";
  ctx.font = "bold 16px serif"; ctx.textAlign = "center";
  ctx.fillText(blocked ? "阻" : done ? "通" : "关", sx, by - 158);
  // 幡旗（拦路时飘动更急）
  const sway = Math.sin(nowSec * (blocked ? 6 : 2.6) + g.i) * (blocked ? 7 : 3);
  for (const dir of [-1, 1]) {
    ctx.strokeStyle = col; ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(sx + dir * 56, by - 150);
    ctx.quadraticCurveTo(sx + dir * 44 + sway, by - 128, sx + dir * 40 + sway * 1.4, by - 104);
    ctx.stroke();
    ctx.fillStyle = blocked ? "rgba(168,69,47,0.55)" : "rgba(47,106,78,0.4)";
    ctx.beginPath();
    ctx.moveTo(sx + dir * 56, by - 148);
    ctx.lineTo(sx + dir * 34, by - 142);
    ctx.lineTo(sx + dir * 34 + sway, by - 108);
    ctx.lineTo(sx + dir * 56 + sway, by - 112);
    ctx.closePath(); ctx.fill();
  }
  // 关口标记：第 N 道
  ctx.fillStyle = "rgba(159,178,200,0.55)"; ctx.font = "12px sans-serif";
  ctx.fillText("第 " + g.i + " 道", sx, by + 24);
  ctx.restore();
}
function drawGates(){
  for (const g of level.gates) drawGate(g);
  // 终点山门（BOSS 场地）
  const bx = level.bossGateX;
  if (bx > camera.x - 260 && bx < camera.x + W + 260) {
    const by = GROUND;
    ctx.save();
    if (level.bossSpawned) {
      ctx.globalAlpha = 0.4 + 0.25 * Math.sin(nowSec * 5);
      ctx.strokeStyle = "#e04040"; ctx.lineWidth = 16;
    } else { ctx.strokeStyle = "#5b6672"; ctx.lineWidth = 10; }

    ctx.fillStyle = level.bossSpawned ? "#ff8a6a" : "#9fb2c8"; ctx.font = "bold 20px serif"; ctx.textAlign = "center";

    }
    ctx.restore();
  }
}
// ---------- 山门传送门（BOSS 倒下后开启） ----------
function drawPortal(){
  const px = portal.x, py = GROUND;   // 世界坐标
  if (px < camera.x - 280 || px > camera.x + W + 280) return;

  }

  ctx.strokeStyle = "#ffe9a8"; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.ellipse(px, py, 96, 22, 0, 0, Math.PI * 2); ctx.stroke();
  ctx.globalAlpha = 1;
  ctx.restore();
}
// ---------- 山门传送转场（墨染 + 关门） ----------
