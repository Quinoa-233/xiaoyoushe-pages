        if (zb.y < camY - 460 || zb.y > camY + H + 420) { continue; }
        drawTreasureLandmark(zb, zb.x - camX, zb.y - camY, t);
    }

    /* ---- 连接各片区的踩踏土路 ---- */
    ctx.save();
    ctx.translate(-camX, -camY);
    ctx.strokeStyle = 'rgba(196,166,116,0.3)';
    ctx.lineWidth = 46;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(TR_ZONES[0].x, TR_ZONES[0].y);
    ctx.lineTo(0, -60);
    ctx.lineTo(TR_ZONES[1].x + 120, TR_ZONES[1].y + 120);
    ctx.moveTo(0, -60);
    ctx.lineTo(TR_ZONES[2].x - 120, TR_ZONES[2].y + 120);
    ctx.moveTo(0, -60);
    ctx.lineTo(0, 200);
    ctx.lineTo(TR_ZONES[3].x, TR_ZONES[3].y - 120);
    ctx.moveTo(TR_ZONES[3].x - 100, TR_ZONES[3].y - 80);
    ctx.lineTo(TR_ZONES[4].x + 100, TR_ZONES[4].y + 60);
    ctx.stroke();
    ctx.restore();

    /* ---- 散布的废墟碎石：矮、歪、大小不一，不要像一排墓碑 ---- */
    ctx.save();
    ctx.translate(-camX, -camY);
    for (i = 0; i < 120; i += 1) {
        var sx = hash2(i, 7) * (TR_HALF_W * 2 - 120) - (TR_HALF_W - 60);
        var sy = hash2(11, i) * (TR_HALF_H * 2 - 120) - (TR_HALF_H - 60);
        if (sx < camX - 160 || sx > camX + W + 160) { continue; }
        if (sy < camY - 160 || sy > camY + H + 160) { continue; }
        /* 别压在片区地标上 */
        var onZone = false;
        for (var z2 = 0; z2 < TR_ZONES.length; z2 += 1) {
            var ddx = sx - TR_ZONES[z2].x, ddy = sy - TR_ZONES[z2].y;
            if (ddx * ddx + ddy * ddy < (TR_ZONES[z2].r * 0.62) * (TR_ZONES[z2].r * 0.62)) { onZone = true; break; }
        }
        if (onZone) { continue; }
        var hv0 = hash2(i, 3);
        var lean = (hv0 - 0.5) * 1.0;
        ctx.save();
        ctx.translate(sx, sy);
        ctx.rotate(lean);
        /* 60% 是趴在地上的碎石，40% 是矮的断墙残块 */
        if (hv0 < 0.6) {
            var rr0 = 9 + hv0 * 16;
            ctx.fillStyle = 'rgba(40,32,24,0.4)';
            ctx.beginPath();
            ctx.ellipse(2, rr0 * 0.4 + 3, rr0 * 1.1, rr0 * 0.42, 0, 0, TAU);
            ctx.fill();
            ctx.fillStyle = (i % 3 === 0) ? '#77694F' : '#695C45';
            ctx.beginPath();
            ctx.moveTo(-rr0, rr0 * 0.2);
            ctx.lineTo(-rr0 * 0.35, -rr0 * 0.55);
            ctx.lineTo(rr0 * 0.45, -rr0 * 0.42);
            ctx.lineTo(rr0, rr0 * 0.18);
            ctx.lineTo(rr0 * 0.2, rr0 * 0.55);
            ctx.lineTo(-rr0 * 0.5, rr0 * 0.5);
            ctx.closePath();
            ctx.fill();
            ctx.fillStyle = 'rgba(200,186,152,0.32)';
            ctx.beginPath();
            ctx.ellipse(-rr0 * 0.1, -rr0 * 0.28, rr0 * 0.42, rr0 * 0.2, 0, 0, TAU);
            ctx.fill();
        } else {
            var ww0 = 16 + hv0 * 14;
            var hh0 = 14 + (i % 4) * 9;
            ctx.fillStyle = 'rgba(40,32,24,0.42)';
            rr(-ww0 / 2 + 2, -hh0 + 7, ww0 + 4, 10, 3);
            ctx.fill();
            ctx.fillStyle = (i % 3 === 0) ? '#786A52' : '#6B5E48';
            /* 顶面是斜的：看得出是塌下来的半截墙 */
            ctx.beginPath();
            ctx.moveTo(-ww0 / 2, hh0 * 0.4);
            ctx.lineTo(-ww0 / 2, -hh0);
            ctx.lineTo(ww0 * 0.1, -hh0 + 5);
            ctx.lineTo(ww0 / 2, -hh0 * 0.6);
            ctx.lineTo(ww0 / 2, hh0 * 0.4);
            ctx.closePath();
            ctx.fill();
            ctx.fillStyle = 'rgba(202,188,154,0.34)';
            ctx.beginPath();
            ctx.moveTo(-ww0 / 2, -hh0);
            ctx.lineTo(ww0 * 0.1, -hh0 + 5);
            ctx.lineTo(ww0 / 2, -hh0 * 0.6);
            ctx.lineTo(ww0 / 2, -hh0 * 0.6 + 4);
            ctx.lineTo(ww0 * 0.1, -hh0 + 9);
            ctx.lineTo(-ww0 / 2, -hh0 + 4);
            ctx.closePath();
            ctx.fill();
            ctx.strokeStyle = 'rgba(40,32,22,0.4)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(-ww0 / 2, hh0 * 0.4);
            ctx.lineTo(-ww0 / 2, -hh0);
            ctx.lineTo(ww0 * 0.1, -hh0 + 5);
            ctx.lineTo(ww0 / 2, -hh0 * 0.6);
            ctx.lineTo(ww0 / 2, hh0 * 0.4);
            ctx.stroke();
        }
        ctx.restore();
    }

    /* 地面裂痕 */
    ctx.strokeStyle = 'rgba(34,28,20,0.34)';
    ctx.lineWidth = 1.6;
    for (i = 0; i < 54; i += 1) {
        var lx = hash2(i, 21) * (TR_HALF_W * 2) - TR_HALF_W;
        var ly = hash2(31, i) * (TR_HALF_H * 2) - TR_HALF_H;
        if (lx < camX - 180 || lx > camX + W + 180) { continue; }
        if (ly < camY - 180 || ly > camY + H + 180) { continue; }
        ctx.beginPath();
        ctx.moveTo(lx, ly);
        ctx.lineTo(lx + 40 + (i % 4) * 22, ly + 16 + (i % 3) * 18);
        ctx.lineTo(lx + 78 + (i % 5) * 16, ly - 6 + (i % 3) * 10);
        ctx.stroke();
    }
    ctx.restore();

    /* ---- 石灯台 ---- */
    var lamps = state.trLamps || [];
    for (i = 0; i < lamps.length; i += 1) {
        var lp = lamps[i];
        if (lp.x < camX - 120 || lp.x > camX + W + 120) { continue; }
        if (lp.y < camY - 160 || lp.y > camY + H + 120) { continue; }
        var lpx = lp.x - camX, lpy = lp.y - camY;
        var lgg = ctx.createRadialGradient(lpx, lpy, 0, lpx, lpy, 110);
        lgg.addColorStop(0, 'rgba(255,214,130,0.24)');
        lgg.addColorStop(1, 'rgba(255,214,130,0)');
        ctx.fillStyle = lgg;
        ctx.beginPath();
        ctx.arc(lpx, lpy, 110, 0, TAU);
        ctx.fill();
        ctx.fillStyle = 'rgba(40,32,24,0.4)';
        ctx.beginPath();
        ctx.ellipse(lpx, lpy + 5, 16, 6, 0, 0, TAU);
        ctx.fill();
        ctx.fillStyle = '#5E5446';
        rr(lpx - 6, lpy - 46, 12, 50, 3);
        ctx.fill();
        ctx.fillStyle = '#6E6250';
        rr(lpx - 11, lpy - 54, 22, 11, 3);
        ctx.fill();
        var fl = 0.7 + 0.3 * Math.sin(t * 3 + lp.t);
        ctx.fillStyle = 'rgba(255,210,120,' + (0.5 + fl * 0.4).toFixed(3) + ')';
        ctx.beginPath();
        ctx.arc(lpx, lpy - 62, 6 + fl * 2.5, 0, TAU);
        ctx.fill();
        ctx.fillStyle = '#FFF0C4';
        ctx.beginPath();
        ctx.arc(lpx, lpy - 62, 3.2, 0, TAU);
        ctx.fill();
    }

    /* ---- 残墙 ---- */
    drawTreasureWalls(camX, camY);

    /* 尘埃光束（屏幕坐标） */
    ctx.save();
    ctx.globalAlpha = 0.10;
    for (i = 0; i < 7; i += 1) {
        var bx = ((i * 733 + t * 16) % (W + 300)) - 150;
        var by = (i * 137) % H;
        var bg2 = ctx.createLinearGradient(bx, by, bx + 60, by + 200);
        bg2.addColorStop(0, 'rgba(255,236,190,0.7)');
        bg2.addColorStop(1, 'rgba(255,236,190,0)');
        ctx.fillStyle = bg2;
        ctx.beginPath();
        ctx.moveTo(bx, by);
        ctx.lineTo(bx + 30, by);
        ctx.lineTo(bx + 90, by + 200);
        ctx.lineTo(bx + 24, by + 200);
        ctx.closePath();
        ctx.fill();
    }
    ctx.restore();
}

/* 片区地标：前庭大门 / 水渠石桥 / 作坊炉台 / 祭坛石台 / 坍塌口断墙 */
function drawTreasureLandmark(z, x, y, t) {
    ctx.save();
    ctx.translate(x, y);

    /* 通用：给一块方料加"左暗右亮"的立体感 */
    function block(bx, by, bw, bh, r0, base, lite, dark) {
        ctx.fillStyle = base;
        rr(bx, by, bw, bh, r0);
        ctx.fill();
        /* 左侧暗面 */
        ctx.fillStyle = dark;
        rr(bx, by, Math.max(3, bw * 0.24), bh, r0);
        ctx.fill();
        /* 右侧亮面 */
        ctx.fillStyle = lite;
        rr(bx + bw - Math.max(3, bw * 0.2), by, Math.max(3, bw * 0.2), bh, r0);

        var rocks = [

/* 残墙：围着废墟画一圈高低不齐的石墙，四边各留一道缺口当门 */
/* 残墙：围着废墟画一圈高低不齐的连续石墙，四边各留一道缺口当门 */
function drawTreasureWalls(camX, camY) {
    ctx.save();
    ctx.translate(-camX, -camY);
    var HX = TR_HALF_W, HY = TR_HALF_H;
    /* 四道门的中心位置（世界坐标） */
    var doors = [
        { x: 0, y: -HY },       // 北门
        { x: HX, y: 0 },        // 东门
        { x: 0, y: HY },        // 南门
        { x: -HX, y: 0 }        // 西门
    ];
    var doorHalf = 96;

    /* 整条边沿长度采样，一次成型 —— 不再切成一个个小方块 */
    var STEP = 6;          /* 沿墙采样步长 */
    var BASE = 20;         /* 墙体往地下压，墙脚不露白 */
    var WALL_H = 62;       /* 墙的标准高度 */

    function hashWall(seed, k, salt) {
        return hash2(Math.floor(seed + k * 37), salt);
    }

    /* 高度用"几个低频波 + 一段缓坡"叠加，避免每个采样点乱跳形成锯齿 */
    function edgeHeight(seed, k) {
        var a = hashWall(seed, Math.floor(k / 9) * 9, 5);        /* 每 54px 变一次的基调 */
        var b = hashWall(seed, Math.floor(k / 4) * 4, 13);       /* 每 24px 的次级起伏 */
        var base = 0.62 + a * 0.28 + (b - 0.5) * 0.16;
        return WALL_H * base;
    }

    /* 沿一条边采样，产出 {x, y, h, k} 序列（h = 0 表示这里塌没了） */
    function buildEdge(bx, by, horiz, seed) {
        var span = horiz ? HX * 2 : HY * 2;
        var n = Math.max(2, Math.round(span / STEP));
        var pts = [];
        var k;
        for (k = 0; k <= n; k += 1) {
            var o = (k / n) * span;
            var x = horiz ? bx + o : bx;
            var y = horiz ? by : by + o;
            /* 门洞附近高度归零，墙自然断开 */
            var isDoor = false;
            for (var d = 0; d < doors.length; d += 1) {
                var ddx = x - doors[d].x, ddy = y - doors[d].y;
                if (ddx * ddx + ddy * ddy < doorHalf * doorHalf) { isDoor = true; break; }
            }
            var h;
            if (isDoor) {
                h = 0;
            } else {
                var r = hashWall(seed, Math.floor(k / 22) * 22, 41);
                /* 塌成大缺口：整片一起塌，不是一根根断 */
                if (r < 0.17) {
                    h = 0;
                } else {
                    h = edgeHeight(seed, k);
                }
            }
            pts.push({ x: x, y: y, h: h, k: k });
        }
        /* 收口：门洞两侧和缺口边缘给一段斜下来的过渡，墙不会一刀切 */
        var i;
        for (i = 1; i < pts.length - 1; i += 1) {
            var prev = pts[i - 1].h, cur = pts[i].h, next = pts[i + 1].h;
            if (cur > 0 && (prev <= 0 || next <= 0)) {
                pts[i].h = Math.min(cur, WALL_H * 0.5);
            }
        }
        return pts;
    }

    /* 把连续非零的采样点切成若干 run，每个 run 画一整面墙 */
    function segments(pts) {
        var out = [], cur = [], i;
        for (i = 0; i < pts.length; i += 1) {
            if (pts[i].h > 0) {
                cur.push(pts[i]);
            } else if (cur.length) {
                out.push(cur);
                cur = [];
            }
        }
        if (cur.length) { out.push(cur); }
        return out;
    }

    function paintEdge(pts, horiz, seed) {
        var i;
        /* 粗剔除：整条边都在屏外就跳过 */
        var minX = 1e9, maxX = -1e9, minY = 1e9, maxY = -1e9;
        for (i = 0; i < pts.length; i += 1) {
            if (pts[i].x < minX) { minX = pts[i].x; }
            if (pts[i].x > maxX) { maxX = pts[i].x; }
            if (pts[i].y < minY) { minY = pts[i].y; }
            if (pts[i].y > maxY) { maxY = pts[i].y; }
        }
        if (maxX < camX - 260 || minX > camX + W + 260) { return; }
        if (maxY < camY - 320 || minY > camY + H + 220) { return; }

        var runs = segments(pts);
        for (var ri = 0; ri < runs.length; ri += 1) {
            paintRun(runs[ri], horiz, seed);
        }
    }

    function paintRun(run, horiz, seed) {
        if (run.length < 2) { return; }
        var j;
        var s = run[0], e = run[run.length - 1];
        /* 用沿墙方向的偏移作画笔，竖直方向用 wall 坐标 */
        function px(p, v) { return horiz ? { x: p.x, y: p.y + v } : { x: p.x + v, y: p.y }; }

        /* --- 立面：上轮廓沿线 + 底下封口 --- */
        ctx.beginPath();
        var a0 = px(s, BASE + 8);
        ctx.moveTo(a0.x, a0.y);
        for (j = 0; j < run.length; j += 1) {
            var tp = px(run[j], BASE - run[j].h);
            ctx.lineTo(tp.x, tp.y);
        }
        var a1 = px(e, BASE + 8);
        ctx.lineTo(a1.x, a1.y);
        ctx.lineTo(a0.x, a0.y);
        ctx.closePath();
        ctx.fillStyle = '#6B5E47';
        ctx.fill();
        ctx.strokeStyle = 'rgba(30,24,16,0.46)';
        ctx.lineWidth = 1.3;
        ctx.stroke();

        /* --- 墙身斑驳 + 墙根青苔 --- */
        ctx.save();
        ctx.clip();
        ctx.strokeStyle = 'rgba(46,38,28,0.2)';
        ctx.lineWidth = 1;
        for (j = 1; j <= 3; j += 1) {
            var lv = BASE - 12 - (j - 1) * 16;
            var b0 = px(s, lv), b1 = px(e, lv);
            ctx.beginPath();
            ctx.moveTo(b0.x, b0.y);
            ctx.lineTo(b1.x, b1.y);
            ctx.stroke();
        }
        /* 青苔：沿墙根一段一段地抹 */
        ctx.globalAlpha = 0.3;
        ctx.strokeStyle = '#5E8A46';
        ctx.lineWidth = 5;
        ctx.lineCap = 'round';
        var pen = false;
        ctx.beginPath();
        for (j = 0; j < run.length; j += 1) {
            var mp = px(run[j], BASE - 3);
            if (hashWall(seed, run[j].k, 27) >= 0.55) {
                if (pen) { ctx.lineTo(mp.x, mp.y); }
                else { ctx.moveTo(mp.x, mp.y); pen = true; }
            } else {
                pen = false;
            }
        }
        ctx.stroke();
        ctx.restore();

        /* --- 顶面亮边：贴着上轮廓压一条，石头立刻有厚度 --- */
        ctx.beginPath();
        for (j = 0; j < run.length; j += 1) {
            var t1 = px(run[j], BASE - run[j].h);
            if (j === 0) { ctx.moveTo(t1.x, t1.y); } else { ctx.lineTo(t1.x, t1.y); }
        }
        for (j = run.length - 1; j >= 0; j -= 1) {
            var t2 = px(run[j], BASE - run[j].h + 3.6);
            ctx.lineTo(t2.x, t2.y);
        }
        ctx.closePath();
        ctx.fillStyle = 'rgba(206,192,160,0.42)';
        ctx.fill();

        /* --- 伸出墙头的断茬石：稀疏一点，别排成城垛 --- */
        for (j = 0; j < run.length; j += 1) {
            var p2 = run[j];
            var sk = hashWall(seed, p2.k, 31);
            if (sk < 0.955) { continue; }
            /* 相邻已有断茬就跳过，避免连成一片 */
            if (j > 0 && hashWall(seed, run[j - 1].k, 31) >= 0.955) { continue; }
            var cp = px(p2, BASE - p2.h - 8 - sk * 8);
            ctx.save();
            ctx.translate(cp.x, cp.y);
            if (!horiz) { ctx.rotate(-Math.PI / 2); }
            ctx.rotate((sk - 0.5) * 0.5);
            ctx.fillStyle = 'rgba(30,24,16,0.4)';
            rr(-8, 1, 16, 9, 3);
            ctx.fill();
            ctx.fillStyle = '#76684F';
            rr(-8, -11, 16, 16, 3);
            ctx.fill();
            ctx.fillStyle = 'rgba(206,192,158,0.42)';
            rr(-8, -11, 16, 4, 2);
            ctx.fill();
            ctx.restore();
        }
    }

    /* 四条边各画一次 */
    paintEdge(buildEdge(-HX, -HY, true, 101), true, 101);
    paintEdge(buildEdge(-HX, HY, true, 733), true, 733);
    paintEdge(buildEdge(-HX, -HY, false, 217), false, 217);
    paintEdge(buildEdge(HX, -HY, false, 911), false, 911);

    /* 墙根散落碎砖（四条边统一撒，跳过门口） */
    var bi;
    for (bi = 0; bi < 4; bi += 1) {
        var ptsB = (bi === 0) ? buildEdge(-HX, -HY, true, 409) :
            (bi === 1) ? buildEdge(-HX, HY, true, 613) :
                (bi === 2) ? buildEdge(-HX, -HY, false, 821) : buildEdge(HX, -HY, false, 337);
        var horizB = (bi < 2);
        for (var qi = 0; qi < ptsB.length; qi += 2) {
            var q = ptsB[qi];
            if (q.h <= 0) { continue; }
            if (q.x < camX - 200 || q.x > camX + W + 200) { continue; }
            if (q.y < camY - 220 || q.y > camY + H + 180) { continue; }
            var hb = hash2(Math.floor(q.k * 19 + bi * 71), 41);
            if (hb < 0.5) { continue; }
            var off = (hb - 0.5) * 18;
            var bx2 = horizB ? q.x + off * 0.4 : q.x + BASE + 8;
            var by2 = horizB ? q.y + BASE + 8 : q.y + off * 0.4;
            ctx.fillStyle = 'rgba(44,36,26,0.38)';
            ctx.beginPath();
            ctx.ellipse(bx2, by2 + 3, 10, 3.6, 0, 0, TAU);
            ctx.fill();
            ctx.save();
            ctx.translate(bx2, by2 - 2);
            ctx.rotate((hb - 0.5) * 1.2);
            ctx.fillStyle = hb > 0.72 ? '#7A6C55' : '#67593F';
            rr(-9, -6, 18, 11, 3);
            ctx.fill();
            ctx.fillStyle = 'rgba(204,190,156,0.34)';
            rr(-9, -6, 18, 4, 2);
            ctx.fill();
            ctx.restore();
        }
    }

    /* 门口两根门柱，告诉玩家这里能出去 */
    for (var d2 = 0; d2 < doors.length; d2 += 1) {
        var dr = doors[d2];
        var horizD = Math.abs(dr.y) > Math.abs(dr.x);
        for (var s2 = -1; s2 <= 1; s2 += 2) {
            var px2 = horizD ? dr.x + s2 * doorHalf : dr.x;
            var py2 = horizD ? dr.y : dr.y + s2 * doorHalf;
            if (px2 < camX - 200 || px2 > camX + W + 200) { continue; }
            if (py2 < camY - 220 || py2 > camY + H + 180) { continue; }
            ctx.fillStyle = 'rgba(34,28,20,0.42)';
            rr(px2 - 13, py2 - 22 + 8, 28, 30, 4);
            ctx.fill();
            ctx.fillStyle = '#7A6C55';
            rr(px2 - 14, py2 - 58, 28, 64, 4);
            ctx.fill();
            ctx.fillStyle = 'rgba(206,192,158,0.34)';
            rr(px2 - 14, py2 - 58, 28, 7, 3);
            ctx.fill();
            ctx.strokeStyle = 'rgba(34,28,20,0.5)';
            ctx.lineWidth = 1.2;
            rr(px2 - 14, py2 - 58, 28, 64, 4);
            ctx.stroke();
            ctx.fillStyle = 'rgba(94,140,70,0.45)';
            ctx.beginPath();
            ctx.ellipse(px2, py2 - 56, 13, 4, 0, 0, TAU);
            ctx.fill();
        }
    }
    ctx.restore();
}

/* 藏宝点：木料堆 / 泉水眼 / 钱袋 / 工具箱 */
function drawTreasureLoot(k, x, y, t, hl) {
    var r = k.r;
    var bob = Math.sin(t * 2.2) * 2;
    var col = k.col;

    /* 地面光晕 */
    var gg = ctx.createRadialGradient(x, y + r * 0.5, 0, x, y + r * 0.5, r * 1.9);
    gg.addColorStop(0, withA(col, 0.26 + hl * 0.26));
    gg.addColorStop(1, withA(col, 0));
    ctx.fillStyle = gg;
    ctx.beginPath();
    ctx.ellipse(x, y + r * 0.5, r * 1.9, r * 1.1, 0, 0, TAU);
    ctx.fill();

    /* 落地阴影，让物件从地面里浮出来 */
    ctx.fillStyle = 'rgba(40,30,18,0.28)';
    ctx.beginPath();
    ctx.ellipse(x, y + r * 0.75, r * 1.15, r * 0.42, 0, 0, TAU);
    ctx.fill();

    ctx.save();
    ctx.translate(x, y + bob);
    ctx.scale(r / 14, r / 14);

    if (k.kind === 'wood') {
        /* 三根圆木堆 */
        for (var i = 0; i < 3; i += 1) {
            var ox = (i - 1) * 11, oy = (i === 1 ? -6 : 2);
            ctx.fillStyle = '#8A5E2E';
            rr(ox - 12, oy - 6, 24, 12, 5);
            ctx.fill();
            ctx.fillStyle = '#C98A18';
            rr(ox - 12, oy - 6, 24, 5, 3);
            ctx.fill();
            ctx.fillStyle = '#E8C88A';
            ctx.beginPath();
            ctx.arc(ox - 10, oy, 2.6, 0, TAU);
            ctx.fill();
        }
    } else if (k.kind === 'water') {
        /* 水泉眼 */
        ctx.fillStyle = '#4A6A78';
        ctx.beginPath();
        ctx.ellipse(0, 4, 13, 6, 0, 0, TAU);
        ctx.fill();
        ctx.fillStyle = '#4FA8D8';
        ctx.beginPath();
        ctx.ellipse(0, 2, 11, 5.4, 0, 0, TAU);
        ctx.fill();
        /* 冒泡 */
        for (var b = 0; b < 3; b += 1) {
            var bt = (t * 1.5 + b * 0.7) % 1;
            ctx.globalAlpha = (1 - bt) * 0.9;
            ctx.fillStyle = '#CFF3FF';
            ctx.beginPath();
            ctx.arc(-4 + b * 4, 2 - bt * 18, 2.2 + bt * 1.4, 0, TAU);
            ctx.fill();
        }
        ctx.globalAlpha = 1;
    } else if (k.kind === 'coin') {
        /* 钱袋 */
        ctx.fillStyle = '#B8860B';
        ctx.beginPath();
        ctx.moveTo(-9, 8);
        ctx.quadraticCurveTo(-11, -4, 0, -6);
        ctx.quadraticCurveTo(11, -4, 9, 8);
        ctx.quadraticCurveTo(0, 13, -9, 8);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = '#FFD166';
        ctx.beginPath();
        ctx.moveTo(-6, -5);
        ctx.lineTo(6, -5);
        ctx.lineTo(4, -9);
        ctx.lineTo(-4, -9);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = '#E0A21A';
        ctx.beginPath();
        ctx.arc(0, 2, 3.2, 0, TAU);
        ctx.fill();
    } else {
        /* 工具箱：木箱 + 搭扣 */
        ctx.fillStyle = '#7A5A34';
        rr(-13, -9, 26, 19, 3);
        ctx.fill();
        ctx.fillStyle = '#A8763C';
        rr(-13, -9, 26, 8, 3);
        ctx.fill();
        ctx.strokeStyle = '#C98A18';
        ctx.lineWidth = 2;
        rr(-13, -9, 26, 19, 3);
        ctx.stroke();
        ctx.fillStyle = '#FFD166';
        rr(-2.5, -2, 5, 6, 1.5);
        ctx.fill();
    }

    ctx.restore();

    /* 高亮圈：画在缩放外，尺寸直接跟半径走 */
    if (hl > 0.02) {
        ctx.strokeStyle = withA(col, 0.75 * hl);
        ctx.lineWidth = 2.4;
        ctx.beginPath();
        ctx.arc(x, y, r * 0.72 + 6 + (1 - hl) * 10, 0, TAU);
        ctx.stroke();
    }
}

/* 守卫：胖水滴身形 + 探照眼 + 警戒条 */
function drawTreasureGuard(g, camX, camY, t) {
    var r = g.r;
    camX = camX || 0;
    camY = camY || 0;
    ctx.save();
    ctx.translate(g.x - camX, g.y - camY);

    /* 影子 */
    ctx.fillStyle = 'rgba(30,24,16,0.32)';
    ctx.beginPath();
    ctx.ellipse(0, r * 0.92, r * 0.78, r * 0.22, 0, 0, TAU);
    ctx.fill();

    /* 身体：上尖下胖的水滴 */
    var bg = ctx.createLinearGradient(0, -r * 1.3, 0, r);
    bg.addColorStop(0, '#7A6A88');
    bg.addColorStop(1, '#4A3F56');
    ctx.fillStyle = bg;
    ctx.beginPath();
    ctx.moveTo(0, -r * 1.35);
    ctx.quadraticCurveTo(r * 1.05, -r * 0.35, r * 0.92, r * 0.62);
    ctx.quadraticCurveTo(0, r * 1.18, -r * 0.92, r * 0.62);
    ctx.quadraticCurveTo(-r * 1.05, -r * 0.35, 0, -r * 1.35);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = '#312A3E';
    ctx.lineWidth = 1.6;
    ctx.stroke();

    /* 探照眼：朝向巡逻方向 */
    var fx = Math.cos(g.ang) * r * 0.42;
    var fy = Math.sin(g.ang) * r * 0.42 - r * 0.25;
    ctx.fillStyle = g.mode === 'chase' ? '#FF6B8A' : '#FFE9A8';
    ctx.beginPath();
    ctx.arc(fx, fy, r * 0.2, 0, TAU);
    ctx.fill();
    ctx.fillStyle = 'rgba(40,32,50,0.85)';
    ctx.beginPath();
    ctx.arc(fx, fy, r * 0.09, 0, TAU);
    ctx.fill();

    /* 手电筒光锥：末端渐隐的扇形，比一刀切好看 */
    if (g.mode !== 'chase') {
        var la = g.ang;
        var cr = 158;
        var cone = ctx.createRadialGradient(fx, fy, 0, fx, fy, cr);
        cone.addColorStop(0, 'rgba(255,233,168,0.26)');
        cone.addColorStop(0.55, 'rgba(255,233,168,0.10)');
        cone.addColorStop(1, 'rgba(255,233,168,0)');
        ctx.save();
        ctx.fillStyle = cone;
        ctx.beginPath();
        ctx.moveTo(fx, fy);
        ctx.arc(fx, fy, cr, la - 0.82, la + 0.82);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
    }

    /* 警戒条 */
    if (g.alert > 0.03) {
        var aw = r * 1.9, ah = 4.5;
        var ay = -r * 1.62;
        ctx.fillStyle = 'rgba(20,16,26,0.7)';
        rr(-aw / 2, ay, aw, ah, 2);
        ctx.fill();
        ctx.fillStyle = g.alert >= 1 ? '#FF4D6D' : (g.alert > 0.45 ? '#FFA23E' : '#FFD166');
        rr(-aw / 2 + 0.8, ay + 0.8, (aw - 1.6) * Math.min(1, g.alert), ah - 1.6, 1.5);
        ctx.fill();
    }

    /* 追击感叹号 */
    if (g.mode === 'chase') {
        var bob2 = Math.sin(t * 8) * 2.5;
        ctx.fillStyle = '#FF4D6D';
        ctx.font = '800 20px system-ui, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('!', 0, -r * 1.9 + bob2);
    }
    ctx.restore();
}

/* 夺宝主渲染 */
function drawTreasure(t) {
    drawTreasureGround(t);

    /* 藏宝点 */
    var tl = state.trLoots;
    for (var i = 0; i < tl.length; i += 1) {
        var lo = tl[i];
        if (lo.got) { continue; }
        if (lo.x < state.cam.x - 90 || lo.x > state.cam.x + W + 90) { continue; }
        if (lo.y < state.cam.y - 90 || lo.y > state.cam.y + H + 90) { continue; }
        drawTreasureLoot(lo.kind, lo.x - state.cam.x, lo.y - state.cam.y, t + lo.t, lo.hl);
    }

    /* 守卫 */
    var gd = state.guards;
    for (var g = 0; g < gd.length; g += 1) {
        var gg = gd[g];
        if (gg.x < state.cam.x - 140 || gg.x > state.cam.x + W + 140) { continue; }
        if (gg.y < state.cam.y - 140 || gg.y > state.cam.y + H + 140) { continue; }
        drawTreasureGuard(gg, state.cam.x, state.cam.y, t);
    }

    /* 玩家 */
    var p = state.player;
    var px = p.x - state.cam.x, py = p.y - state.cam.y;
    ctx.save();
    /* 藏身时半透明 */
    var hiding = state.trHide >= 0.8;
    ctx.globalAlpha = hiding ? 0.52 : 1;
    drawCharShape(state.charId, px, py, p.r, t, p.face, p.hurt, 1);
    ctx.restore();

    /* 藏身虚线圈 */
    if (hiding) {
        var pulse = 0.5 + 0.5 * Math.sin(t * 4);
        ctx.strokeStyle = 'rgba(160,220,255,' + (0.35 + pulse * 0.3).toFixed(3) + ')';
        ctx.lineWidth = 2;
        ctx.setLineDash([5, 5]);
        ctx.lineDashOffset = -t * 18;
        ctx.beginPath();
        ctx.ellipse(px, py + p.r * 0.95, p.r * 1.5, p.r * 0.5, 0, 0, TAU);
        ctx.stroke();
        ctx.setLineDash([]);
        txt('藏身中', px, py - p.r * 1.9, 9.5, 'rgba(190,230,255,0.9)', 'center', 700);
    }

    /* 屏幕外藏宝点的指引箭头 */
    drawTreasureWaypoints(t);

    /* 角落暗角 */
    var vg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.3, W / 2, H / 2, Math.max(W, H) * 0.72);
    vg.addColorStop(0, 'rgba(0,0,0,0)');
    vg.addColorStop(1, 'rgba(12,8,4,0.52)');
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, W, H);
}

/* 屏幕外的藏宝点：边缘画个小箭头指方向，不会玩得没头绪 */
function drawTreasureWaypoints(t) {
    var tl = state.trLoots;
    var p = state.player;
    var pad = 30;
    for (var i = 0; i < tl.length; i += 1) {
        var lo = tl[i];
        if (lo.got) { continue; }
        var sx = lo.x - state.cam.x, sy = lo.y - state.cam.y;
        if (sx > pad && sx < W - pad && sy > pad && sy < H - pad) { continue; }
        /* 夹到屏幕边缘 */
        var cx = clamp(sx, pad, W - pad);
        var cy = clamp(sy, pad, H - pad);
        var ang = Math.atan2(lo.y - p.y, lo.x - p.x);
        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(ang);
        var pulseW = 0.6 + 0.4 * Math.sin(t * 3 + i);
        ctx.fillStyle = withA(lo.kind.col, 0.5 + pulseW * 0.4);
        ctx.beginPath();
        ctx.moveTo(11, 0);
        ctx.lineTo(-7, -8);
        ctx.lineTo(-3, 0);
        ctx.lineTo(-7, 8);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
    }
}

/* 夺宝 HUD：进度胶囊 / 时间 / 木材水源 / 暂停 */
function drawTreasureHud(t) {
    var got = state.trGot;
    var goal = TREASURE_GOAL;
    var left = Math.max(0, TREASURE_LEN - state.time);

    /* 进度胶囊 */
    var pw = Math.min(148, W * 0.42);
    var px = 14, py = 14, ph = 26;
    ctx.fillStyle = 'rgba(28,22,14,0.62)';
    rr(px, py, pw, ph, ph * 0.5);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,214,120,0.35)';
    ctx.lineWidth = 1;
    rr(px + 0.5, py + 0.5, pw - 1, ph - 1, ph * 0.5);
    ctx.stroke();
    /* 星形图标 */
    var sx = px + 16, sy = py + ph / 2;
    ctx.fillStyle = '#FFD166';
    starDot(sx, sy, 7, '#FFD166', 1);
    txt(got + ' / ' + goal, px + 28, py + ph / 2, 11.5, '#FFF3D0', 'left', 700);

    /* 时间 */
    txt(Math.ceil(left) + 's', W / 2, py + ph / 2, 13, '#FFF3D0', 'center', 700);

    /* 暂停按钮 */
    var pb = 30;
    /* 视觉 30×30，触摸热区扩到 44 见方（手指标准）；绘制仍用原坐标 */
    ui.trPauseBtn = { x: W - pb - 12 - 7, y: 12 - 7, w: pb + 14, h: pb + 14 };
    ctx.fillStyle = 'rgba(28,22,14,0.62)';
    rr(W - pb - 12, 12, pb, pb, 8);
    ctx.fill();
    ctx.fillStyle = '#FFF3D0';
    rr(W - pb - 12 + 10, 12 + 8, 4, 14, 1.5);
    ctx.fill();
    rr(W - pb - 12 + 16, 12 + 8, 4, 14, 1.5);
    ctx.fill();

    /* 木材 / 水源 计数 */
    var ry = py + ph + 8;
    var chips = [
        { label: '木材', val: state.trYield.wood, col: '#C98A18' },
        { label: '水源', val: state.trYield.water, col: '#4FA8D8' }
    ];
    var chx = px;
    for (var i = 0; i < chips.length; i += 1) {
        var c = chips[i];
        var label = c.label + ' ' + c.val;
        ctx.font = '700 11px system-ui, sans-serif';
        var tw = ctx.measureText(label).width;
        ctx.fillStyle = 'rgba(28,22,14,0.58)';
        rr(chx, ry, tw + 20, 20, 10);
        ctx.fill();
        ctx.fillStyle = c.col;
        ctx.beginPath();
        ctx.arc(chx + 10, ry + 10, 4, 0, TAU);
        ctx.fill();
        ctx.fillStyle = '#FFF3D0';
        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';
        ctx.fillText(label, chx + 18, ry + 10.5);
        chx += tw + 26;
    }

    /* 被抓次数 */
    if (state.trCaught > 0) {
        ctx.textAlign = 'right';
        ctx.textBaseline = 'middle';
        ctx.font = '700 11px system-ui, sans-serif';
        ctx.fillStyle = 'rgba(255,150,160,0.9)';
        ctx.fillText('被抓 ' + state.trCaught + ' 次', W - 16, py + ph + 18);
    }

    /* 中央提示 */
    if (state.trMsgT > 0 && state.trMsg) {
        var ma = Math.min(1, state.trMsgT / 0.4);
        ctx.globalAlpha = ma;
        txt(state.trMsg, W / 2, H * 0.3, 17, '#FFE0E4', 'center', 800);
        ctx.globalAlpha = 1;
    }
}

/* 夺宝结算页 */
function drawTreasureDone(t) {
    darkBg();
    drawStarsBg(t);

    var y = state.trYield || { wood: 0, water: 0, coins: 0 };
    var got = state.trGot || 0;
    var coins = state.trCoins || 0;

    txt('满载而归', W / 2, H * 0.17, Math.min(30, W * 0.08), '#4A5E8A', 'center', 800);
    txt('遗迹里搬回来的家当', W / 2, H * 0.17 + Math.min(30, W * 0.08) * 0.75, 11, 'rgba(74,94,138,0.6)', 'center', 500);

    /* 战利品卡片 */
    var cw = Math.min(300, W - 60);
    var cx = W / 2 - cw / 2;
    var cy = H * 0.30;
    var chh = 138;
    ctx.fillStyle = 'rgba(255,255,255,0.86)';
    rr(cx, cy, cw, chh, 14);
    ctx.fill();
    ctx.strokeStyle = 'rgba(120,90,40,0.28)';
    ctx.lineWidth = 1.4;
    rr(cx + 0.5, cy + 0.5, cw - 1, chh - 1, 14);
    ctx.stroke();

    txt('搜到藏宝点', cx + cw / 2, cy + 22, 11.5, 'rgba(90,70,40,0.75)', 'center', 600);
    txt(got + ' 处', cx + cw / 2, cy + 46, 22, '#6B4A16', 'center', 800);

    /* 三行产出 */
    var rows = [
        { label: '木材', val: y.wood, col: '#C98A18' },
        { label: '水源', val: y.water, col: '#4FA8D8' },
        { label: '金币', val: coins, col: '#E0A21A' }
    ];
    for (var i = 0; i < rows.length; i += 1) {
        var r = rows[i];
        var ry = cy + 76 + i * 19;
        ctx.fillStyle = r.col;
        ctx.beginPath();
        ctx.arc(cx + cw / 2 - 62, ry, 4.4, 0, TAU);
        ctx.fill();
        txt(r.label, cx + cw / 2 - 52, ry, 11.5, 'rgba(70,58,38,0.85)', 'left', 600);
        txt('+' + r.val, cx + cw / 2 + 58, ry, 12, r.col, 'right', 800);
    }

    /* 被抓提示 */
    if (state.trCaught > 0) {
        txt('被守卫逮住 ' + state.trCaught + ' 次', W / 2, cy + chh + 16, 10, 'rgba(180,90,100,0.75)', 'center', 600);
    }

    /* 提示下一步 */
    txt('木材和水源拿回家，就能盖房开地了', W / 2, cy + chh + 38, 10.5, 'rgba(74,94,138,0.62)', 'center', 500);

    /* 兔子 */
    drawCharShape(save.char, W / 2, H * 0.63, Math.min(30, W * 0.075), t * 1.2, 1, 0, 1);

    /* 回家按钮 */
    var bh = Math.min(52, H * 0.07);
    var bw = Math.min(240, W - 60);
    ui.trDoneHome = { x: W / 2 - bw / 2, y: H - bh - 26, w: bw, h: bh };
    neonBtn(ui.trDoneHome, '回家', '#4A5E8A', null, t);
}

/* ============================================================ 家园渲染 */

/* 房子：按风格画不同的屋 */
function drawHomeHouse(style, x, y, s, t) {
    ctx.save();
    ctx.translate(x, y);

    /* 影子：贴着房子根部一小圈，淡淡的，别在泥地上留一块深斑 */
    ctx.fillStyle = 'rgba(60,74,44,0.13)';
    ctx.beginPath();
    ctx.ellipse(0, s * 0.62, s * 0.66, s * 0.12, 0, 0, TAU);
    ctx.fill();

    var wallCol = '#E4C48A';
    var roofCol = '#C2543A';
    var roofShape = 'gable';

    if (style === 'hut') {
        wallCol = '#D9BC82';
        roofCol = '#A8763C';
        roofShape = 'thatch';
    } else if (style === 'cabin') {
        wallCol = '#D2A96A';
        roofCol = '#4E7A3E';
        roofShape = 'gable';
    } else if (style === 'stone') {
        wallCol = '#B4BEC4';
        roofCol = '#6E7A84';
        roofShape = 'flat';
    } else if (style === 'villa') {
        wallCol = '#F0DCE4';
        roofCol = '#B4657E';
        roofShape = 'gable';
    }

    /* 主体 */
    ctx.fillStyle = wallCol;
    rr(-s * 0.62, -s * 0.36, s * 1.24, s * 0.98, 4);
    ctx.fill();
    ctx.strokeStyle = 'rgba(80,60,36,0.32)';
    ctx.lineWidth = 1.2;
    rr(-s * 0.62, -s * 0.36, s * 1.24, s * 0.98, 4);
    ctx.stroke();

    /* 屋顶 */
    ctx.fillStyle = roofCol;
    if (roofShape === 'gable') {
        ctx.beginPath();
        ctx.moveTo(-s * 0.76, -s * 0.32);
        ctx.lineTo(0, -s * 1.06);
        ctx.lineTo(s * 0.76, -s * 0.32);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = 'rgba(60,40,24,0.3)';
        ctx.stroke();
    } else if (roofShape === 'thatch') {
        ctx.beginPath();
        ctx.moveTo(-s * 0.8, -s * 0.3);
        ctx.quadraticCurveTo(0, -s * 1.12, s * 0.8, -s * 0.3);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        /* 茅草纹 */
        ctx.strokeStyle = 'rgba(120,88,44,0.35)';
        ctx.lineWidth = 1;
        for (var i = 0; i < 5; i += 1) {
            var yy = -s * 0.42 - i * s * 0.12;
            ctx.beginPath();
            ctx.moveTo(-s * 0.66 + i * s * 0.06, yy);
            ctx.lineTo(s * 0.66 - i * s * 0.06, yy);
            ctx.stroke();
        }
    } else {
        ctx.fillRect(-s * 0.7, -s * 0.52, s * 1.4, s * 0.22);
        ctx.strokeStyle = 'rgba(50,60,66,0.4)';
        ctx.strokeRect(-s * 0.7, -s * 0.52, s * 1.4, s * 0.22);
    }

    /* 门 */
    ctx.fillStyle = '#8A5A2E';
    rr(-s * 0.16, s * 0.02, s * 0.32, s * 0.6, s * 0.16);
    ctx.fill();
    ctx.fillStyle = '#FFD166';
    ctx.beginPath();
    ctx.arc(s * 0.08, s * 0.32, s * 0.035, 0, TAU);
    ctx.fill();

    /* 窗 */
    ctx.fillStyle = '#BFE6F5';
    var wy = style === 'villa' ? -s * 0.18 : -s * 0.12;
    rr(-s * 0.46, wy, s * 0.22, s * 0.24, 3);
    ctx.fill();
    ctx.strokeStyle = 'rgba(90,70,44,0.5)';
    ctx.lineWidth = 1;
    ctx.stroke();
    if (style === 'villa') {
        rr(s * 0.24, wy, s * 0.22, s * 0.24, 3);
        ctx.fill();
        ctx.stroke();
    }

    /* 烟囱 */
    if (style === 'cottage' || style === 'cabin') {
        ctx.fillStyle = '#9A5A44';
        rr(s * 0.3, -s * 0.92, s * 0.16, s * 0.36, 2);
        ctx.fill();
        /* 炊烟 */
        ctx.globalAlpha = 0.28;
        ctx.fillStyle = '#FFFFFF';
        for (var q = 0; q < 3; q += 1) {
            var qt = (t * 0.5 + q * 0.33) % 1;
            ctx.beginPath();
            ctx.arc(s * 0.38 + Math.sin(qt * 6) * s * 0.08, -s * 0.96 - qt * s * 0.5, s * 0.06 + qt * s * 0.06, 0, TAU);
            ctx.fill();
        }
        ctx.globalAlpha = 1;
    }

    /* 洋房露台 */
    if (style === 'villa') {
        ctx.fillStyle = 'rgba(255,255,255,0.75)';
        rr(-s * 0.9, s * 0.14, s * 1.8, s * 0.1, 3);
        ctx.fill();
        ctx.strokeStyle = 'rgba(180,120,140,0.6)';
        ctx.lineWidth = 1;
        for (var p2 = 0; p2 < 6; p2 += 1) {
            var pxx = -s * 0.86 + p2 * s * 0.34;
            ctx.beginPath();
            ctx.moveTo(pxx, s * 0.14);
            ctx.lineTo(pxx, s * 0.24);
            ctx.stroke();
        }
    }
    ctx.restore();
}

/* 装饰物 */
function drawHomeDeco(id, x, y, s, t) {
    ctx.save();
    ctx.translate(x, y);
    if (id === 'fence') {
        ctx.fillStyle = '#C9A227';
        for (var i = 0; i < 4; i += 1) {
            rr(-s * 0.45 + i * s * 0.3, -s * 0.3, s * 0.09, s * 0.42, 2);
            ctx.fill();
        }
        ctx.fillStyle = '#B08C18';
        rr(-s * 0.48, -s * 0.18, s * 0.96, s * 0.07, 2);
        ctx.fill();
        rr(-s * 0.48, -s * 0.02, s * 0.96, s * 0.07, 2);
        ctx.fill();
    } else if (id === 'pond') {
        ctx.fillStyle = '#7A8A6A';
        ctx.beginPath();
        ctx.ellipse(0, 0, s * 0.5, s * 0.32, 0, 0, TAU);
        ctx.fill();
        ctx.fillStyle = '#4FA8D8';
        ctx.beginPath();
        ctx.ellipse(0, -s * 0.02, s * 0.42, s * 0.25, 0, 0, TAU);
        ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.5)';
        ctx.beginPath();
        ctx.ellipse(-s * 0.1, -s * 0.08, s * 0.14, s * 0.05, -0.3, 0, TAU);
        ctx.fill();
        /* 荷叶 */
        ctx.fillStyle = '#4E9E2A';
        ctx.beginPath();
        ctx.ellipse(s * 0.2, -s * 0.06, s * 0.12, s * 0.07, 0, 0, TAU);
        ctx.fill();
    } else if (id === 'well') {
        ctx.fillStyle = '#8A8A92';
        rr(-s * 0.28, -s * 0.3, s * 0.56, s * 0.42, 4);
        ctx.fill();
        ctx.fillStyle = '#5A5A62';
        ctx.beginPath();
        ctx.ellipse(0, -s * 0.3, s * 0.28, s * 0.1, 0, 0, TAU);
        ctx.fill();
        ctx.fillStyle = '#4A7A9A';
        ctx.beginPath();
        ctx.ellipse(0, -s * 0.3, s * 0.19, s * 0.065, 0, 0, TAU);
        ctx.fill();
        /* 支架 */
        ctx.fillStyle = '#8A5A2E';
        rr(-s * 0.26, -s * 0.62, s * 0.06, s * 0.34, 2);
        ctx.fill();
        rr(s * 0.2, -s * 0.62, s * 0.06, s * 0.34, 2);
        ctx.fill();
        ctx.fillStyle = '#B8860B';
        rr(-s * 0.3, -s * 0.66, s * 0.6, s * 0.08, 3);
        ctx.fill();
    } else if (id === 'tree') {
        ctx.fillStyle = '#8A5A2E';
        rr(-s * 0.07, -s * 0.3, s * 0.14, s * 0.42, 3);
        ctx.fill();
        ctx.fillStyle = '#4E9E2A';
        ctx.beginPath();
        ctx.arc(0, -s * 0.46, s * 0.32, 0, TAU);
        ctx.fill();
        ctx.fillStyle = '#63BC3A';
        ctx.beginPath();
        ctx.arc(-s * 0.12, -s * 0.56, s * 0.19, 0, TAU);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(s * 0.13, -s * 0.55, s * 0.17, 0, TAU);
        ctx.fill();
        /* 果子 */
        ctx.fillStyle = '#E85D6A';
        for (var f = 0; f < 3; f += 1) {
            ctx.beginPath();
            ctx.arc(-s * 0.16 + f * s * 0.16, -s * 0.42 + (f % 2) * s * 0.12, s * 0.045, 0, TAU);
            ctx.fill();
        }
    } else if (id === 'lamp') {
        ctx.fillStyle = '#6E6E76';
        rr(-s * 0.04, -s * 0.6, s * 0.08, s * 0.72, 2);
        ctx.fill();
        ctx.fillStyle = '#E8A81E';
        ctx.beginPath();
        ctx.moveTo(-s * 0.12, -s * 0.6);
        ctx.lineTo(s * 0.12, -s * 0.6);
        ctx.lineTo(s * 0.08, -s * 0.78);
        ctx.lineTo(-s * 0.08, -s * 0.78);
        ctx.closePath();
        ctx.fill();
        /* 光晕 */
        var lg = ctx.createRadialGradient(0, -s * 0.66, 0, 0, -s * 0.66, s * 0.5);
        lg.addColorStop(0, 'rgba(255,220,140,0.5)');
        lg.addColorStop(1, 'rgba(255,220,140,0)');
        ctx.fillStyle = lg;
        ctx.beginPath();
        ctx.arc(0, -s * 0.66, s * 0.5, 0, TAU);
        ctx.fill();
    } else if (id === 'windmill') {
        ctx.fillStyle = '#C9A227';
        ctx.beginPath();
        ctx.moveTo(-s * 0.16, s * 0.14);
        ctx.lineTo(-s * 0.09, -s * 0.5);
        ctx.lineTo(s * 0.09, -s * 0.5);
        ctx.lineTo(s * 0.16, s * 0.14);
        ctx.closePath();
        ctx.fill();
        /* 风叶 */
        ctx.save();
        ctx.translate(0, -s * 0.54);
        ctx.rotate(t * 0.9);
        ctx.fillStyle = '#C25E14';
        for (var w = 0; w < 4; w += 1) {
            ctx.save();
            ctx.rotate(w * Math.PI / 2);
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(s * 0.42, -s * 0.07);
            ctx.lineTo(s * 0.42, s * 0.07);
            ctx.closePath();
            ctx.fill();
            ctx.restore();
        }
        ctx.restore();
        ctx.fillStyle = '#8A5A2E';
        ctx.beginPath();
        ctx.arc(0, -s * 0.54, s * 0.05, 0, TAU);
        ctx.fill();
    }
    ctx.restore();
}

/* 一株作物：按生长阶段画 */
function drawHomeCrop(slot, x, y, s, t) {
    if (!slot) { return; }
    var sd = seedOf(slot.seed);
    if (!sd) { return; }
    var stage = cropStage(slot);
    var ratio = slot.need > 0 ? Math.min(1, slot.plant / slot.need) : 0;
    var grow = 0.35 + ratio * 0.65;      // 尺寸随成长变大

    ctx.save();
    ctx.translate(x, y);

    /* 土壤 */
    ctx.fillStyle = '#8A6A44';
    ctx.beginPath();
    ctx.ellipse(0, s * 0.1, s * 0.42, s * 0.16, 0, 0, TAU);
    ctx.fill();
    ctx.fillStyle = '#6E5436';
    ctx.beginPath();
    ctx.ellipse(0, s * 0.07, s * 0.36, s * 0.13, 0, 0, TAU);
    ctx.fill();

    if (stage === 0) {
        /* 种子：埋在土里的小点 */
        ctx.fillStyle = '#B08A50';
        ctx.beginPath();
        ctx.arc(0, s * 0.02, s * 0.06, 0, TAU);
        ctx.fill();
    } else {
        /* 茎 */
        ctx.strokeStyle = '#5AA03A';
        ctx.lineWidth = s * 0.07;
        ctx.beginPath();
        ctx.moveTo(0, s * 0.06);
        ctx.lineTo(0, -s * 0.36 * grow);
        ctx.stroke();
        /* 叶 */
        ctx.fillStyle = '#6BBB45';
        ctx.beginPath();
        ctx.ellipse(-s * 0.14, -s * 0.16 * grow, s * 0.15, s * 0.07, -0.5, 0, TAU);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(s * 0.14, -s * 0.24 * grow, s * 0.15, s * 0.07, 0.5, 0, TAU);
        ctx.fill();

        if (stage >= 2) {
            /* 果实/菜头 */
            var fr = s * (0.13 + (stage - 2) * 0.07);
            var fy = -s * 0.36 * grow - (stage === 3 ? s * 0.04 : 0);
            ctx.fillStyle = sd.color;
            ctx.beginPath();
            ctx.arc(0, fy, fr, 0, TAU);
            ctx.fill();
            ctx.fillStyle = 'rgba(255,255,255,0.35)';
            ctx.beginPath();
            ctx.arc(-fr * 0.3, fy - fr * 0.3, fr * 0.32, 0, TAU);
            ctx.fill();
            /* 高光 */
            ctx.fillStyle = 'rgba(255,255,255,0.5)';
            ctx.beginPath();
            ctx.arc(-fr * 0.32, fy - fr * 0.35, fr * 0.16, 0, TAU);
            ctx.fill();
        }
        if (stage === 3) {
            /* 成熟光晕 + 提示 */
            var pulse = 0.5 + 0.5 * Math.sin(t * 3);
            ctx.strokeStyle = 'rgba(255,240,160,' + (0.3 + pulse * 0.4).toFixed(3) + ')';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(0, -s * 0.36 * grow, s * 0.34, 0, TAU);
            ctx.stroke();
        }
    }
    ctx.restore();
}

/* 第 i 块菜地的世界坐标 */
function homePlotPos(i) {
    var row = Math.floor(i / HOME_PLOT_COLS);
    var col = i - row * HOME_PLOT_COLS;
    return {
        x: HOME_FARM_POS.x + col * HOME_PLOT_DX,
        y: HOME_FARM_POS.y + row * HOME_PLOT_DY
    };
}

/* 菜园围栏的矩形范围（紧贴格子外沿，不含草地） */
function homeFarmRect() {
    var n = Math.max(1, (save.home.plots || []).length);
    var cols = Math.min(HOME_PLOT_COLS, n);
    var rows = Math.ceil(n / HOME_PLOT_COLS);
    var padX = 22, padY = 22;
    var x0 = HOME_FARM_POS.x - HOME_PLOT_HW - padX;
    var y0 = HOME_FARM_POS.y - HOME_PLOT_HH - padY;
    var x1 = HOME_FARM_POS.x + (cols - 1) * HOME_PLOT_DX + HOME_PLOT_HW + padX;
    var y1 = HOME_FARM_POS.y + (rows - 1) * HOME_PLOT_DY + HOME_PLOT_HH + padY;
    return { x: x0, y: y0, w: x1 - x0, h: y1 - y0 };
}

/* 野地上的景物不能压到院子、房子、菜园 */
function homeSceneryBlocked(x, y) {
    var pl = HOME_PLAZA_POS, hs = HOME_HOUSE_POS;
    var dx = (x - pl.x) / 148, dy = (y - pl.y) / 132;
    if (dx * dx + dy * dy < 1.1) { return true; }
    /* 房子门前那片院子 */
    var yd = (x - hs.x) / 158, ydy = (y - (hs.y + 100)) / 92;
    if (yd * yd + ydy * ydy < 1.1) { return true; }
    /* 门前连到广场的土路 */
    if (x > -70 && x < 70 && y > hs.y + 100 && y < pl.y - 80) { return true; }
    if (x > hs.x - 140 && x < hs.x + 140 && y > hs.y - 130 && y < hs.y + 100) { return true; }
    var fr = homeFarmRect();
    if (x > fr.x - 30 && x < fr.x + fr.w + 30 && y > fr.y - 30 && y < fr.y + fr.h + 30) { return true; }
    for (var k in HOME_DECO_SPOT) {
        if (!HOME_DECO_SPOT.hasOwnProperty(k)) { continue; }
        var sp = HOME_DECO_SPOT[k];
        if (Math.abs(x - sp.x) < 90 && Math.abs(y - sp.y) < 100) { return true; }
    }
    return false;
}

/* 草地上的自然景物：树丛 / 灌木 / 石头 / 花簇，密度够就不会显得空 */
function drawHomeScenery(camX, camY, t) {
    var i, x, y, k;
    var count = 150;
    ctx.save();
    ctx.translate(-camX, -camY);

    /* 先把位置算出来存着，方便按 y 排序做前后遮挡 */
    var items = [];
    for (i = 0; i < count * 3 && items.length < count; i += 1) {
        x = hash2(i, 71) * HOME_W - HOME_HALF_W;
        y = hash2(83, i) * HOME_H - HOME_HALF_H;
        if (homeSceneryBlocked(x, y)) { continue; }
        items.push({ x: x, y: y, r: hash2(i, 97) });
    }
    items.sort(function (a, b) { return a.y - b.y; });

    for (k = 0; k < items.length; k += 1) {
        x = items[k].x; y = items[k].y;
        if (x < camX - 120 || x > camX + W + 120) { continue; }
        if (y < camY - 180 || y > camY + H + 140) { continue; }
        var v = items[k].r;
        var sway = Math.sin(t * 1.4 + x * 0.02) * 1.6;

        if (v < 0.30) {
            /* 灌木丛 */
            ctx.fillStyle = 'rgba(60,90,40,0.24)';
            ctx.beginPath();
            ctx.ellipse(x, y + 6, 22, 7, 0, 0, TAU);
            ctx.fill();
            ctx.fillStyle = '#5EA23E';
            ctx.beginPath();
            ctx.arc(x - 9, y - 2, 12, 0, TAU);
            ctx.arc(x + 8, y - 4, 14, 0, TAU);
            ctx.arc(x, y - 14, 12, 0, TAU);
            ctx.fill();
            ctx.fillStyle = '#78C24E';
            ctx.beginPath();
            ctx.arc(x - 5 + sway * 0.4, y - 14, 7.5, 0, TAU);
            ctx.fill();
        } else if (v < 0.52) {
            /* 石头堆 */
            ctx.fillStyle = 'rgba(60,70,50,0.2)';
            ctx.beginPath();
            ctx.ellipse(x, y + 5, 20, 6, 0, 0, TAU);
            ctx.fill();
            ctx.fillStyle = '#9AA0A6';
            ctx.beginPath();
            ctx.arc(x - 7, y - 3, 11, 0, TAU);
            ctx.fill();
            ctx.fillStyle = '#B2B8BE';
            ctx.beginPath();
            ctx.arc(x + 8, y - 1, 8, 0, TAU);
            ctx.fill();
            ctx.fillStyle = '#C2C8CE';
            ctx.beginPath();
            ctx.arc(x - 9, y - 8, 4.5, 0, TAU);
            ctx.fill();
        } else if (v < 0.72) {
            /* 小树 */
            ctx.fillStyle = 'rgba(50,80,36,0.26)';
            ctx.beginPath();
            ctx.ellipse(x, y + 6, 20, 6, 0, 0, TAU);
            ctx.fill();
            ctx.fillStyle = '#8A5A2E';
            rr(x - 4, y - 22, 8, 28, 3);
            ctx.fill();
            ctx.fillStyle = '#4E9E2A';
            ctx.beginPath();
            ctx.arc(x + sway, y - 36, 22, 0, TAU);
            ctx.fill();
            ctx.fillStyle = '#66BE3C';
            ctx.beginPath();
            ctx.arc(x - 9 + sway, y - 44, 13, 0, TAU);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(x + 10 + sway, y - 42, 12, 0, TAU);
            ctx.fill();
        } else {
            /* 花簇 */
            var col = ['#FFF3C4', '#FFD1E0', '#D8E8FF', '#FFE0A8', '#F7C8F0'][k % 5];
            for (var p2 = 0; p2 < 4; p2 += 1) {
                var pxx = x + (p2 - 1.5) * 9 + sway * 0.5;
                var pyy = y + ((p2 % 2) - 0.5) * 8;
                ctx.strokeStyle = 'rgba(90,140,60,0.7)';
                ctx.lineWidth = 1.4;
                ctx.beginPath();
                ctx.moveTo(pxx, pyy + 8);
                ctx.lineTo(pxx, pyy + 2);
                ctx.stroke();
                ctx.fillStyle = col;
                ctx.beginPath();
                ctx.arc(pxx, pyy, 4.2, 0, TAU);
                ctx.fill();
                ctx.fillStyle = '#F2C14E';
                ctx.beginPath();
                ctx.arc(pxx, pyy, 1.7, 0, TAU);
                ctx.fill();
            }
        }
    }
    ctx.restore();
}

/* 院墙：木篱笆围一圈，四边各留一道门 */
function drawHomeWalls(camX, camY) {
    var HX = HOME_HALF_W, HY = HOME_HALF_H;
    var step = 52;
    ctx.save();
    ctx.translate(-camX, -camY);

    function seg(x, y, horiz) {
        if (x < camX - 120 || x > camX + W + 120) { return; }
        if (y < camY - 140 || y > camY + H + 120) { return; }
        /* 影子 */
        ctx.fillStyle = 'rgba(60,70,40,0.22)';
        if (horiz) {
            rr(x - 2, y - step / 2 + 6, step, 7, 3);
        } else {
            rr(x - 3, y - step / 2, 7, step, 3);
        }
        ctx.fill();
        /* 两道横栏 */
        ctx.strokeStyle = '#B08C18';
        ctx.lineWidth = 4;
        ctx.beginPath();
        if (horiz) {
            ctx.moveTo(x - step / 2, y - 22); ctx.lineTo(x + step / 2, y - 22);
            ctx.moveTo(x - step / 2, y - 4); ctx.lineTo(x + step / 2, y - 4);
        } else {
            ctx.moveTo(x - 8, y - step / 2); ctx.lineTo(x - 8, y + step / 2);
            ctx.moveTo(x + 8, y - step / 2); ctx.lineTo(x + 8, y + step / 2);
        }
        ctx.stroke();
        /* 一根立柱 */
        ctx.fillStyle = '#C9A227';
        if (horiz) {
            rr(x - step / 2 - 3, y - 42, 8, 46, 3);
        } else {
            rr(x - 4, y - step / 2, 8, step + 4, 3);
        }
        ctx.fill();
        ctx.fillStyle = '#E0B93A';
        if (horiz) {
            rr(x - step / 2 - 3, y - 42, 8, 5, 2);
        } else {
            rr(x - 4, y - step / 2, 8, 5, 2);
        }
        ctx.fill();
    }

    /* 上下两道（世界横线 y = ±HY） */
    for (var x = -HX + step / 2; x < HX - 4; x += step) {
        if (Math.abs(x) < 140) { continue; }   // 中间留门
        seg(x, -HY, true);
        seg(x, HY, true);
    }
    /* 左右两道（世界竖线 x = ±HX） */
    for (var y = -HY + step / 2; y < HY - 4; y += step) {
        if (Math.abs(y) < 140) { continue; }
        seg(-HX, y, false);
        seg(HX, y, false);
    }

    /* 四道门柱 */
    var doors = [
        { x: 0, y: -HY, horiz: true },
        { x: 0, y: HY, horiz: true },
        { x: -HX, y: 0, horiz: false },
        { x: HX, y: 0, horiz: false }
    ];
    for (var d = 0; d < doors.length; d += 1) {
        var dr = doors[d];
        for (var s = -1; s <= 1; s += 2) {
            var px = dr.horiz ? dr.x + s * 140 : dr.x;
            var py = dr.horiz ? dr.y : dr.y + s * 140;
            if (px < camX - 140 || px > camX + W + 140) { continue; }
            if (py < camY - 160 || py > camY + H + 140) { continue; }
            ctx.fillStyle = 'rgba(60,70,40,0.25)';
            ctx.beginPath();
            ctx.ellipse(px, py + 4, 9, 4, 0, 0, TAU);
            ctx.fill();
            ctx.fillStyle = '#8A5E2E';
            rr(px - 7, py - 76, 14, 82, 4);
            ctx.fill();
            ctx.fillStyle = '#C9A227';
            rr(px - 7, py - 76, 14, 7, 3);
            ctx.fill();
            /* 柱顶挂个小灯笼 */
            var fl2 = 0.6 + 0.4 * Math.sin(camX * 0.01 + d + s);
            ctx.fillStyle = 'rgba(255,190,110,' + (0.55 + fl2 * 0.35).toFixed(3) + ')';
            ctx.beginPath();
            ctx.arc(px, py - 84, 8, 0, TAU);
            ctx.fill();
            ctx.fillStyle = '#FFF0C4';
            ctx.beginPath();
            ctx.arc(px, py - 84, 3.6, 0, TAU);
            ctx.fill();
        }
    }
    ctx.restore();
}

/* 家园场景 */
function drawHome(t) {
    if (state.homeInside) { drawHomeInside(t); return; }
    drawHomeOutdoor(t);
}

/* 一句操作提示：深色胶囊 + 白字，浮在角色头顶 */
function cmdHint(t, label, sx, sy) {
    ctx.font = '800 12px system-ui, sans-serif';
    var tw = ctx.measureText(label).width;
    var pulse = 0.5 + 0.5 * Math.sin(t * 3.4);
    ctx.fillStyle = 'rgba(30,42,22,0.78)';
    rr(sx - tw / 2 - 12, sy - 12, tw + 24, 24, 12);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,226,140,' + (0.5 + pulse * 0.5).toFixed(3) + ')';
    ctx.lineWidth = 1.6;
    rr(sx - tw / 2 - 12, sy - 12, tw + 24, 24, 12);
    ctx.stroke();
    ctx.fillStyle = '#FFFFFF';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(label, sx, sy + 0.5);
}

function drawHomeOutdoor(t) {
    var hm = save.home;
    var camX = state.cam.x, camY = state.cam.y;
    var g0 = ctx.createLinearGradient(0, 0, 0, H);
    g0.addColorStop(0, '#B9DE8E');
    g0.addColorStop(0.5, '#A5D073');
    g0.addColorStop(1, '#8CB95F');
    ctx.fillStyle = g0;
    ctx.fillRect(0, 0, W, H);

    /* 远景山：两层，后面的淡、前面的实，拉开纵深 */
    ctx.fillStyle = 'rgba(150,188,118,0.42)';
    ctx.beginPath();
    ctx.moveTo(0, H * 0.30);
    ctx.quadraticCurveTo(W * 0.22, H * 0.15, W * 0.46, H * 0.27);
    ctx.quadraticCurveTo(W * 0.7, H * 0.14, W, H * 0.25);
    ctx.lineTo(W, H * 0.46);
    ctx.lineTo(0, H * 0.46);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = 'rgba(126,170,96,0.5)';
    ctx.beginPath();
    ctx.moveTo(0, H * 0.36);
    ctx.quadraticCurveTo(W * 0.3, H * 0.26, W * 0.62, H * 0.35);
    ctx.quadraticCurveTo(W * 0.86, H * 0.42, W, H * 0.34);
    ctx.lineTo(W, H * 0.52);
    ctx.lineTo(0, H * 0.52);
    ctx.closePath();
    ctx.fill();

    /* 草地纹理（世界坐标，跟着院子走） */
    ctx.save();
    ctx.translate(-camX, -camY);

    /* 1) 大块深浅绿斑：把一整片死板的渐变打散成有起伏的草地 */
    for (var pb = 0; pb < 74; pb += 1) {
        var pbx = hash2(pb, 503) * HOME_W - HOME_HALF_W;
        var pby = hash2(513, pb) * HOME_H - HOME_HALF_H;
        if (pbx < camX - 260 || pbx > camX + W + 260) { continue; }
        if (pby < camY - 260 || pby > camY + H + 260) { continue; }
        var pbrx = 70 + hash2(pb, 523) * 120;
        var pbry = pbrx * (0.55 + hash2(pb, 533) * 0.3);
        var dark = hash2(pb, 543) < 0.5;
        ctx.fillStyle = dark ? 'rgba(104,152,74,0.16)' : 'rgba(196,226,150,0.16)';
        ctx.beginPath();
        ctx.ellipse(pbx, pby, pbrx, pbry, hash2(pb, 553) * 3, 0, TAU);
        ctx.fill();
    }
    /* 2) 草叶纹理：三根一簇，高矮错落 */
    for (var gi = 0; gi < 520; gi += 1) {
        var gx = hash2(gi, 3) * HOME_W - HOME_HALF_W;
        var gy = hash2(9, gi) * HOME_H - HOME_HALF_H;
        if (gx < camX - 40 || gx > camX + W + 40) { continue; }
        if (gy < camY - 40 || gy > camY + H + 40) { continue; }
        var gh = 6 + hash2(gi, 17) * 7;
        var gsd = hash2(gi, 23);
        ctx.strokeStyle = gsd < 0.3 ? 'rgba(96,148,64,0.5)'
            : (gsd < 0.7 ? 'rgba(132,182,86,0.46)' : 'rgba(168,208,120,0.5)');
        ctx.lineWidth = 1.3;
        ctx.beginPath();
        ctx.moveTo(gx, gy);
        ctx.lineTo(gx + 2.5, gy - gh);
        ctx.moveTo(gx + 4, gy);
        ctx.lineTo(gx + 6.5, gy - gh * 0.82);
        ctx.moveTo(gx - 3, gy);
        ctx.lineTo(gx - 4.5, gy - gh * 0.62);
        ctx.stroke();
    }
    /* 小野花点缀 */
    for (var f = 0; f < 90; f += 1) {
        var fx = hash2(f, 41) * HOME_W - HOME_HALF_W;
        var fy = hash2(47, f) * HOME_H - HOME_HALF_H;
        if (fx < camX - 30 || fx > camX + W + 30) { continue; }
        if (fy < camY - 30 || fy > camY + H + 30) { continue; }
        if (homeSceneryBlocked(fx, fy)) { continue; }
        var fc = ['#FFF3C4', '#FFD1E0', '#D8E8FF', '#FFE0A8'][f % 4];
        ctx.fillStyle = fc;
        ctx.beginPath();
        ctx.arc(fx, fy, 2.6, 0, TAU);
        ctx.fill();
        ctx.fillStyle = '#F2C14E';
        ctx.beginPath();
        ctx.arc(fx, fy, 1.1, 0, TAU);
        ctx.fill();
    }

    /* ---- 房子门前一小片踩实的院坝（贴着台阶，别摊成一大片沙地） ---- */
    var plaza = HOME_PLAZA_POS;
    var yardY = HOME_HOUSE_POS.y + 82;
    ctx.save();
    ctx.translate(HOME_HOUSE_POS.x, yardY);
    /* 极坐标描一条起伏的闭合轮廓：比房子略宽一点点 */
    var yN = 40;
    var yPts = [];
    var yi;
    for (yi = 0; yi < yN; yi += 1) {
        var ya = yi / yN * TAU;
        var yr0 = 1 + (hash2(yi, 301) - 0.5) * 0.3;
        yPts.push({ x: Math.cos(ya) * 74 * yr0, y: Math.sin(ya) * 40 * yr0 });
    }
    ctx.beginPath();
    for (yi = 0; yi < yN; yi += 1) {
        var yc0 = yPts[yi];
        var yc1 = yPts[(yi + 1) % yN];
        if (yi === 0) {
            ctx.moveTo(yc0.x, yc0.y);
        } else {
            ctx.quadraticCurveTo(yc0.x, yc0.y, (yc0.x + yc1.x) / 2, (yc0.y + yc1.y) / 2);
        }
    }
    ctx.closePath();
    /* 底色用径向渐变：边缘深、中心浅，像被踩实的土地 */
    var ygrad = ctx.createRadialGradient(0, 0, 8, 0, 4, 112);
    ygrad.addColorStop(0, '#C8A876');
    ygrad.addColorStop(0.55, '#BC9A6A');
    ygrad.addColorStop(1, '#A28052');
    ctx.fillStyle = ygrad;
    ctx.fill();
    /* 踩出来的细颗粒斑驳 */
    ctx.save();
    ctx.clip();
    for (var ypi = 0; ypi < 120; ypi += 1) {
        var ypx = (hash2(ypi, 201) - 0.5) * 220;
        var ypy = (hash2(211, ypi) - 0.5) * 84;
        var ypr = 3 + hash2(ypi, 213) * 7;
        ctx.fillStyle = hash2(ypi, 217) < 0.5 ? 'rgba(216,192,152,0.28)' : 'rgba(162,138,98,0.2)';
        ctx.beginPath();
        ctx.ellipse(ypx, ypy, ypr, ypr * 0.72, 0, 0, TAU);
        ctx.fill();
    }
    ctx.restore();
    /* 轮廓边缘：一圈碎石子 + 冒出来的草，跟草地自然咬合 */
    for (var ygi = 0; ygi < 30; ygi += 1) {
        var ygp = yPts[Math.floor(hash2(ygi, 231) * yN)];
        if (hash2(ygi, 243) < 0.55) {
            ctx.fillStyle = 'rgba(150,132,98,0.46)';
            ctx.beginPath();
            ctx.arc(ygp.x * 1.04, ygp.y * 1.08,
                2 + hash2(ygi, 239) * 2.4, 0, TAU);
            ctx.fill();
        } else {
            ctx.strokeStyle = 'rgba(120,168,80,0.72)';
            ctx.lineWidth = 1.4;
            ctx.beginPath();
            ctx.moveTo(ygp.x * 1.02, ygp.y * 1.04);
            ctx.lineTo(ygp.x * 1.02 + 2, ygp.y * 1.04 - 8);
            ctx.moveTo(ygp.x * 1.02 + 3, ygp.y * 1.04);
            ctx.lineTo(ygp.x * 1.02 + 5, ygp.y * 1.04 - 6);
            ctx.stroke();

    ctx.restore();

    /* 门前的泥土小径：窄窄一条弯向广场，两边用草压边，别成沙河 */
    var roadTop = yardY + 18;
    var roadBot = plaza.y - 62;
    var RN = 12;
    var rPts = [];
    for (var ri = 0; ri <= RN; ri += 1) {
        var rt = ri / RN;
        /* 路径微微左右摆动，不是笔直一条 */
        var rcx = Math.sin(rt * Math.PI * 1.15) * 16 + (hash2(ri, 291) - 0.5) * 8;
        rPts.push({ x: rcx, y: lerp(roadTop, roadBot, rt) });
    }
    ctx.beginPath();
    ctx.moveTo(rPts[0].x - 30, rPts[0].y);
    for (var ri2 = 0; ri2 <= RN; ri2 += 1) {
        var rr2 = 30 - ri2 / RN * 11 + (hash2(ri2, 251) - 0.5) * 7;
        ctx.lineTo(rPts[ri2].x - rr2, rPts[ri2].y);
    }
    for (var ri3 = RN; ri3 >= 0; ri3 -= 1) {
        var rr3 = 30 - ri3 / RN * 11 + (hash2(ri3, 253) - 0.5) * 7;
        ctx.lineTo(rPts[ri3].x + rr3, rPts[ri3].y);
    }
    ctx.closePath();
    var rgrad = ctx.createLinearGradient(0, roadTop, 0, roadBot);
    rgrad.addColorStop(0, '#BE9C6C');
    rgrad.addColorStop(1, '#B08E60');
    ctx.fillStyle = rgrad;
    ctx.fill();
    /* 路面撒碎石 + 边缘草 */
    for (var rsi = 0; rsi < 34; rsi += 1) {
        var rst = hash2(rsi, 261);
        var rsp = rPts[Math.min(RN, Math.floor(rst * (RN + 1)))];
        var rsx = rsp.x + (hash2(rsi, 265) - 0.5) * 42;
        ctx.fillStyle = hash2(rsi, 263) < 0.5 ? 'rgba(202,178,140,0.48)' : 'rgba(142,120,84,0.4)';
        ctx.beginPath();
        ctx.arc(rsx, rsp.y + (hash2(rsi, 269) - 0.5) * 14,
            1.5 + hash2(rsi, 267) * 2.2, 0, TAU);
        ctx.fill();
    }
    for (var rgi = 0; rgi <= RN; rgi += 1) {
        for (var rgs = -1; rgs <= 1; rgs += 2) {
            var rgx = rPts[rgi].x + rgs * (30 - rgi / RN * 11 + 4);
            ctx.strokeStyle = 'rgba(122,170,82,0.66)';
            ctx.lineWidth = 1.4;
            ctx.beginPath();
            ctx.moveTo(rgx, rPts[rgi].y + 3);
            ctx.lineTo(rgx + rgs * 1.5, rPts[rgi].y - 7);
            ctx.moveTo(rgx + rgs * 3, rPts[rgi].y + 3);
            ctx.lineTo(rgx + rgs * 4.5, rPts[rgi].y - 5);
            ctx.stroke();

    }

    /* ---- 中央小广场：一小片铺石的空地（轮廓不规则，别像井盖） ---- */
    ctx.save();
    ctx.translate(plaza.x, plaza.y);
    ctx.rotate(-0.08);
    /* 用一圈描点做出不规则边界的铺石地面 */
    var pzN = 34;
    /* 预采样轮廓点，再用中点二次曲线抹平尖角 */
    var pzPts = [];
    var pzi;
    for (pzi = 0; pzi < pzN; pzi += 1) {
        var pza0 = pzi / pzN * TAU;
        var pzr0 = 1 + (hash2(pzi, 401) - 0.5) * 0.1;
        pzPts.push({ x: Math.cos(pza0) * pzr0, y: Math.sin(pza0) * pzr0 });
    }
    function plazaOutline(rx, ry) {
        ctx.beginPath();
        var pi, pA, pB, pM, pM2;
        for (pi = 0; pi <= pzN; pi += 1) {
            pA = pzPts[pi % pzN];
            pB = pzPts[(pi + 1) % pzN];
            pM = { x: (pA.x + pB.x) / 2 * rx, y: (pA.y + pB.y) / 2 * ry };
            if (pi === 0) {
                ctx.moveTo(pM.x, pM.y);
            } else {
                pM2 = { x: (pzPts[(pi - 1) % pzN].x + pA.x) / 2 * rx, y: (pzPts[(pi - 1) % pzN].y + pA.y) / 2 * ry };
                ctx.quadraticCurveTo(pA.x * rx, pA.y * ry, pM.x, pM.y);
            }
        }
        ctx.closePath();
    }
    /* 外圈散落的镶边石（稀疏几处，别围成一圈齿轮） */
    for (var pzs = 0; pzs < 30; pzs += 1) {
        if (hash2(pzs, 415) < 0.55) { continue; }
        var pza = pzs / 30 * TAU + 0.1;
        var pzr = 1 + (hash2(pzs, 403) - 0.5) * 0.16;
        ctx.save();
        ctx.translate(Math.cos(pza) * 98 * pzr, Math.sin(pza) * 86 * pzr);
        ctx.rotate(pza + (hash2(pzs, 405) - 0.5) * 0.6);
        ctx.fillStyle = 'rgba(150,140,116,0.5)';
        rr(-11, -7, 22, 14, 4);
        ctx.fill();
        ctx.fillStyle = 'rgba(214,206,186,0.36)';
        rr(-11, -7, 22, 4, 2);
        ctx.fill();
        ctx.restore();
    }
    plazaOutline(94, 82);
    ctx.fillStyle = '#C9BFA4';
    ctx.fill();
    ctx.strokeStyle = 'rgba(130,120,98,0.45)';
    ctx.lineWidth = 2.6;
    ctx.stroke();
    /* 铺石纹：用一组近似水平、微微起伏的石板缝，不要放射感 */
    ctx.save();
    plazaOutline(94, 82);
    ctx.clip();
    ctx.strokeStyle = 'rgba(140,130,108,0.22)';
    ctx.lineWidth = 1.1;
    var pz;
    for (pz = -5; pz <= 5; pz += 1) {
        var pzRowY = pz * 16;
        ctx.beginPath();
        for (var px3 = -110; px3 <= 110; px3 += 16) {
            var pzz = pzRowY + Math.sin(px3 * 0.05 + pz) * 3;
            if (px3 === -110) { ctx.moveTo(px3, pzz); } else { ctx.lineTo(px3, pzz); }
        }
        ctx.stroke();
    }
    /* 竖缝：错开半格 */
    for (pz = 0; pz < 22; pz += 1) {
        var pzx = -108 + pz * 10.5;
        var pzoff = (hash2(pz, 417) - 0.5) * 5;
        ctx.beginPath();
        ctx.moveTo(pzx + pzoff, -100);
        ctx.lineTo(pzx + pzoff, 104);
        ctx.stroke();
    }
    /* 几处被踩出来的浅色斑 */
    for (pz = 0; pz < 12; pz += 1) {
        ctx.fillStyle = 'rgba(224,216,196,0.26)';
        ctx.beginPath();
        ctx.ellipse((hash2(pz, 407) - 0.5) * 150, (hash2(409, pz) - 0.5) * 130,
            8 + hash2(pz, 411) * 14, 6 + hash2(pz, 413) * 10, 0, 0, TAU);
        ctx.fill();
    }
    ctx.restore();
    /* 广场上摆两把长凳 */
    ctx.fillStyle = '#9A6A3C';
    rr(-66, -4, 30, 7, 3);
    ctx.fill();
    rr(36, 12, 30, 7, 3);
    ctx.fill();
    ctx.fillStyle = '#7A4E24';
    rr(-64, 3, 4, 11, 2);
    ctx.fill();
    rr(-42, 3, 4, 11, 2);
    ctx.fill();
    rr(38, 19, 4, 11, 2);
    ctx.fill();
    rr(60, 19, 4, 11, 2);
    ctx.fill();
    /* 一盏地灯 */
    ctx.fillStyle = '#6E6E76';
    rr(60, -50, 3, 44, 1.5);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,220,140,0.55)';
    ctx.beginPath();
    ctx.arc(61.5, -52, 6, 0, TAU);
    ctx.fill();
    ctx.restore();

    /* 石板小径：连续铺一排小石板（不是三块大砖），走起来才像路 */
    function slabPath(x1, y1, x2, y2) {
        var dx = x2 - x1, dy = y2 - y1;
        var len = Math.sqrt(dx * dx + dy * dy);
        var seg = 22;
        var steps = Math.max(3, Math.floor(len / seg));
        var ang = Math.atan2(dy, dx);
        var nx = -Math.sin(ang), ny = Math.cos(ang);
        for (var k = 0; k <= steps; k += 1) {
            var pv = k / steps;
            var sx = x1 + dx * pv, sy = y1 + dy * pv;
            /* 每块石板略有偏差，边沿高低不平 */
            var jx = (hash2(k, 273) - 0.5) * 5;
            var jy = (hash2(275, k) - 0.5) * 5;
            var sw = 15 + hash2(k, 277) * 7;      /* 沿路方向的长度 */
            var sh = 9 + hash2(k, 279) * 4;       /* 横向的宽度 */
            ctx.save();
            ctx.translate(sx + nx * jx + jy * 0.3, sy + ny * jy + jx * 0.3);
            ctx.rotate(ang + (hash2(k, 281) - 0.5) * 0.26);
            ctx.fillStyle = 'rgba(120,110,90,0.26)';
            rr(-sw / 2 + 1.4, -sh / 2 + 2, sw, sh, 3);
            ctx.fill();
            ctx.fillStyle = k % 2 ? '#B5AB97' : '#C6BCA6';
            rr(-sw / 2, -sh / 2, sw, sh, 3);
            ctx.fill();
            ctx.fillStyle = 'rgba(226,218,198,0.42)';
            rr(-sw / 2, -sh / 2, sw, 3, 1.6);
            ctx.fill();
            ctx.restore();
        }
    }
    /* 广场通往菜园：一路踏步石 */
    slabPath(plaza.x - 40, plaza.y + 96, HOME_FARM_POS.x + 118, HOME_FARM_POS.y - 122);

    /* ---- 菜园区：一圈木栅栏圈出的菜地（不要橙色塑胶大框） ---- */
    var fr2 = homeFarmRect();
    /* ① 栅栏内的地面：一块翻好的菜地土，圆角矩形紧贴格子 */
    var fx0 = fr2.x - 10, fy0 = fr2.y - 10;
    var fx1 = fr2.x + fr2.w + 10, fy1 = fr2.y + fr2.h + 10;
    rr(fx0, fy0, fx1 - fx0, fy1 - fy0, 14);
    var fgrad = ctx.createLinearGradient(0, fy0, 0, fy1);
    fgrad.addColorStop(0, '#AE8A5E');
    fgrad.addColorStop(1, '#9C7650');
    ctx.fillStyle = fgrad;
    ctx.fill();
    /* 土面颗粒 */
    ctx.save();
    rr(fx0, fy0, fx1 - fx0, fy1 - fy0, 14);
    ctx.clip();
    for (var fti = 0; fti < 180; fti += 1) {
        var ftx = fx0 + hash2(fti, 611) * (fx1 - fx0);
        var fty = fy0 + hash2(621, fti) * (fy1 - fy0);
        ctx.fillStyle = hash2(fti, 631) < 0.5 ? 'rgba(170,140,100,0.34)' : 'rgba(104,80,52,0.26)';
        ctx.beginPath();
        ctx.ellipse(ftx, fty, 3 + hash2(fti, 641) * 6, 2 + hash2(fti, 651) * 4, hash2(fti, 661) * 3, 0, TAU);
        ctx.fill();
    }
    ctx.restore();

    /* ② 木栅栏：沿四边立柱 + 两道横栏，像真的菜园围栏 */
    function farmFence(px, py) {
        if (px < camX - 80 || px > camX + W + 80) { return; }
        if (py < camY - 100 || py > camY + H + 90) { return; }
        /* 立柱 */
        ctx.fillStyle = 'rgba(60,50,30,0.24)';
        ctx.beginPath();
        ctx.ellipse(px + 2, py + 4, 7, 3, 0, 0, TAU);
        ctx.fill();
        ctx.fillStyle = '#A87A3E';
        rr(px - 3, py - 30, 6, 34, 2);
        ctx.fill();
        ctx.fillStyle = '#C79A55';
        rr(px - 3, py - 30, 6, 6, 2);
        ctx.fill();
        /* 两道横栏（在相邻立柱之间由调用方补） */
    }
    var fstep = 26;
    var fxi;
    for (fxi = fx0; fxi <= fx1; fxi += fstep) {
        /* 上边留一道口子当菜园门 */
        if (!(Math.abs(fxi - (HOME_FARM_POS.x + 20)) < 34)) { farmFence(fxi, fy0); }
        farmFence(fxi, fy1);
    }
    var fyi;
    for (fyi = fy0 + fstep; fyi <= fy1 - fstep; fyi += fstep) {
        farmFence(fx0, fyi);
        farmFence(fx1, fyi);

    ctx.fillStyle = '#B98A48';

    ctx.fill();
    rr(fx0, fy0 - 12, fx1 - fx0, 4, 2);
    ctx.fill();
    rr(fx0, fy1 - 24, fx1 - fx0, 4, 2);
    ctx.fill();
    rr(fx0, fy1 - 12, fx1 - fx0, 4, 2);
    ctx.fill();

    rr(fx0 - 1, fy0 - 24, 4, fy1 - fy0 + 4, 2);
    ctx.fill();
    rr(fx0 - 1, fy0 - 12, 4, fy1 - fy0 + 4, 2);
    ctx.fill();
    rr(fx1 - 3, fy0 - 24, 4, fy1 - fy0 + 4, 2);
    ctx.fill();
    rr(fx1 - 3, fy0 - 12, 4, fy1 - fy0 + 4, 2);
    ctx.fill();
    ctx.restore();

    /* ---- 草地上的自然景物（房子 / 菜园之后画，能被它们压住） ---- */
    drawHomeScenery(camX, camY, t);

    /* ---- 房子 ---- */
    var houseStyle = hm.house ? (homeItemOf(hm.house) ? homeItemOf(hm.house).style : 'cottage') : null;
    ctx.save();
    ctx.translate(-camX, -camY);
    if (houseStyle) {

            Math.min(88, W * 0.24), t);
    } else {
        /* 还没盖房：地基和一片碎石 */
        ctx.strokeStyle = 'rgba(120,96,60,0.55)';

    }

    ctx.save();
    ctx.translate(-camX, -camY);

    /* ---- 菜园地块 ---- */
    ctx.save();
    ctx.translate(-camX, -camY);
    var plotN = hm.plots.length;
    for (var p = 0; p < plotN; p += 1) {
        var pp = homePlotPos(p);

        /* 选中格：先铺一层柔光底，一眼看出站的是哪一格 */
        if (isNear) {

        }

        ctx.fillStyle = 'rgba(60,44,26,0.24)';
        rr(px - HOME_PLOT_HW + 3, py - HOME_PLOT_HH + 6, HOME_PLOT_HW * 2, HOME_PLOT_HH * 2, 8);
        ctx.fill();

        rr(px - HOME_PLOT_HW, py - HOME_PLOT_HH, HOME_PLOT_HW * 2, HOME_PLOT_HH * 2, 8);
        ctx.fill();
        /* 土面颗粒 */

        ctx.clip();
        for (var sgi = 0; sgi < 26; sgi += 1) {

            var sgy = py - HOME_PLOT_HH + hash2(711, p * 31 + sgi) * HOME_PLOT_HH * 2;

        if (hm.crops[p] && cropStage(hm.crops[p]) === 3) {
            var pulse2 = 0.5 + 0.5 * Math.sin(t * 3 + p);

    ctx.restore();

    /* ---- 院墙（画在最后，压住草地边缘感） ---- */
    drawHomeWalls(camX, camY);

    /* ---- 角色 ---- */
    var pl = state.player;

    ctx.save();
    drawCharShape(state.charId, scrX, scrY, pl.r, t, pl.face, pl.hurt, 1);
    ctx.restore();

    /* 站在某格旁：冒出一排就地操作按钮（种 / 收 / 浇水 / 施肥） */
    ui.homeActBtns = [];
    if (nearPlot >= 0) {
        var slot2 = hm.crops[nearPlot];
        var acts = [];
        if (!slot2) {
            /* 空格：看背包里有没有能种的种子 */
            var hasSeed = false;
            if (save.seeds) {
                for (var sk2 in save.seeds) {

        } else if (cropStage(slot2) === 3) {
            acts.push({ key: 'harvest', label: '收获', id: nearPlot });
        } else {
            acts.push({ key: 'water', label: '浇水 1水源', id: nearPlot });
            acts.push({ key: 'fert', label: '施肥 6金币', id: nearPlot });
        }
        var abw = 0, abh = 26, abgap = 8;
        var ai;
        for (ai = 0; ai < acts.length; ai += 1) {
            ctx.font = '800 12px system-ui, sans-serif';
            acts[ai].w = Math.max(64, ctx.measureText(acts[ai].label).width + 24);
            abw += acts[ai].w + (ai > 0 ? abgap : 0);
        }
        var abx = scrX - abw / 2;
        var aby = scrY - pl.r - 62;
        /* 气泡底板 */
        ctx.fillStyle = 'rgba(28,40,20,0.62)';
        rr(abx - 8, aby - 8, abw + 16, abh + 16, 13);
        ctx.fill();
        for (ai = 0; ai < acts.length; ai += 1) {
            var a = acts[ai];
            var bx = abx, by = aby;
            var hot = (a.key === 'harvest') ? '#E8A81E'
                : (a.key === 'plant' ? '#5EB62E'
                    : (a.key === 'water' ? '#4FA8D8' : '#967828'));
            ctx.fillStyle = hot;
            rr(bx, by, a.w, abh, 9);
            ctx.fill();
            ctx.fillStyle = '#FFFFFF';
            ctx.font = '800 12px system-ui, sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(a.label, bx + a.w / 2, by + abh / 2 + 0.5);
            /* 视觉高度就是 26，但手指点击热区上下各放宽 9px：
               手机上手点这个气泡时不必像素级精准，图上完全看不出来。 */
            ui.homeActBtns.push({ x: bx, y: by - 9, w: a.w, h: abh + 18, key: a.key, idx: a.id });
            abx += a.w + abgap;
        }
        /* 提示键位（放在气泡上方，不挡角色） */
        ctx.fillStyle = 'rgba(255,255,255,0.72)';
        ctx.font = '700 10px system-ui, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('按 E 直接操作', scrX, aby - 16);
    }

    /* 站在门口：提示进屋（做成可点区域，手机也能点） */
    ui.homeDoorBtn = null;
    if (state.homeNearDoor) {
        cmdHint(t, '按 E 进屋', scrX, scrY - pl.r - 34);
        ctx.font = '800 12px system-ui, sans-serif';
        var dtw = ctx.measureText('按 E 进屋').width;
        ui.homeDoorBtn = { x: scrX - dtw / 2 - 14, y: scrY - pl.r - 48, w: dtw + 28, h: 30, act: 'enter' };
    }

    /* 顶部资源条 */
    drawHomeTopBar(t);

    /* 建造 / 种植 入口按钮 */
    var bh = Math.min(44, H * 0.062);
    var bw = Math.min(126, W * 0.34);
    ui.homeBuildBtn = { x: W - bw - 14, y: H - bh - 14, w: bw, h: bh };
    neonBtn(ui.homeBuildBtn, '建造 / 种植', '#C98A18', null, t);

    /* 左下角返回 */
    ui.homeSceneBack = { x: 14, y: H - bh - 14, w: Math.min(96, W * 0.26), h: bh };
    neonBtn(ui.homeSceneBack, '← 大厅', '#5E7E4E', null, t);

    /* 小地图：右上角一块，标出房子、菜园、角色 */
    drawHomeMiniMap(t);

    /* 作物成熟提示条 */
    var readyN = 0;
    for (var c3 = 0; c3 < hm.crops.length; c3 += 1) {
        if (hm.crops[c3] && cropStage(hm.crops[c3]) === 3) { readyN += 1; }
    }
    if (readyN > 0) {
        var rtxt = '有 ' + readyN + ' 株可以收了';
        ctx.font = '700 11px system-ui, sans-serif';
        var rtw = ctx.measureText(rtxt).width;
        ctx.fillStyle = 'rgba(232,168,30,0.92)';
        rr(W / 2 - rtw / 2 - 12, H - bh - 62, rtw + 24, bh, bh * 0.4);
        ctx.fill();
        ctx.fillStyle = '#3A2606';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(rtxt, W / 2, H - bh / 2 - 62);
    }
}

/* 屋内：一间真实的屋子内部——木地板、四壁、门、床、桌、地毯、窗、炉火 */
function drawHomeInside(t) {
    var hm = save.home;
    var camX = state.cam.x, camY = state.cam.y;
    var rm = HOME_ROOM;
    var rw = rm.x1 - rm.x0;
    var rh = rm.y1 - rm.y0;

    /* 地板底：铺满屏幕 */
    ctx.fillStyle = '#5A4630';
    ctx.fillRect(0, 0, W, H);

    ctx.save();
    ctx.translate(-camX, -camY);

    /* ---- 木地板：横条纹拼接 ---- */
    ctx.fillStyle = '#B98A56';
    rr(rm.x0, rm.y0, rw, rh, 6);
    ctx.fill();
    ctx.save();
    rr(rm.x0, rm.y0, rw, rh, 6);
    ctx.clip();
    var plw = 34;
    for (var fy = rm.y0; fy < rm.y1; fy += plw) {
        ctx.fillStyle = (Math.floor((fy - rm.y0) / plw) % 2) ? '#C19260' : '#B2834F';
        ctx.fillRect(rm.x0, fy, rw, plw - 2);
        ctx.strokeStyle = 'rgba(96,68,40,0.4)';
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.moveTo(rm.x0, fy + plw - 1);
        ctx.lineTo(rm.x1, fy + plw - 1);
        ctx.stroke();
    }
    /* 木纹 */
    for (var fi = 0; fi < 60; fi += 1) {
        var fx = rm.x0 + hash2(fi, 801) * rw;
        var fy2 = rm.y0 + hash2(811, fi) * rh;
        var flw = 20 + hash2(fi, 821) * 50;
        ctx.strokeStyle = 'rgba(140,104,64,0.28)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(fx, fy2);
        ctx.lineTo(fx + flw, fy2 + 2);
        ctx.stroke();
    }
    /* 地板中央一片地毯 */
    ctx.fillStyle = 'rgba(120,60,60,0.5)';
    ctx.beginPath();
    ctx.ellipse(0, 30, 96, 62, 0, 0, TAU);
    ctx.fill();
    ctx.strokeStyle = 'rgba(220,184,140,0.5)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.ellipse(0, 30, 96, 62, 0, 0, TAU);
    ctx.stroke();
    ctx.strokeStyle = 'rgba(220,184,140,0.35)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.ellipse(0, 30, 74, 46, 0, 0, TAU);
    ctx.stroke();
    /* 地毯四角小花 */
    for (var ci = 0; ci < 4; ci += 1) {
        ctx.fillStyle = 'rgba(232,196,150,0.5)';
        ctx.beginPath();
        ctx.arc(Math.cos(ci * 1.57 + 0.7) * 78, 30 + Math.sin(ci * 1.57 + 0.7) * 48, 5, 0, TAU);
        ctx.fill();
    }
    ctx.restore();

    /* ---- 上墙（带木框 + 挂饰） ---- */
    ctx.fillStyle = '#D8B586';
    ctx.fillRect(rm.x0, rm.y0 - 54, rw, 54);
    ctx.fillStyle = 'rgba(120,88,52,0.32)';
    ctx.fillRect(rm.x0, rm.y0 - 6, rw, 6);
    /* 墙上皮影 / 画框 */
    ctx.fillStyle = '#8A5A2E';
    rr(-46, rm.y0 - 46, 40, 30, 3);
    ctx.fill();
    ctx.fillStyle = '#BFE6F5';
    rr(-42, rm.y0 - 42, 32, 22, 2);
    ctx.fill();
    /* 墙上挂钟 */
    ctx.fillStyle = '#6E5636';
    ctx.beginPath();
    ctx.arc(58, rm.y0 - 30, 14, 0, TAU);
    ctx.fill();
    ctx.fillStyle = '#F0E4C8';
    ctx.beginPath();
    ctx.arc(58, rm.y0 - 30, 11, 0, TAU);
    ctx.fill();
    ctx.strokeStyle = '#5A4630';
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.moveTo(58, rm.y0 - 30);
    ctx.lineTo(58, rm.y0 - 38);
    ctx.moveTo(58, rm.y0 - 30);
    ctx.lineTo(64, rm.y0 - 28);
    ctx.stroke();

    /* ---- 下墙（带踢脚线） ---- */
    ctx.fillStyle = '#D8B586';
    ctx.fillRect(rm.x0, rm.y1, rw, 40);
    ctx.fillStyle = 'rgba(120,88,52,0.32)';
    ctx.fillRect(rm.x0, rm.y1, rw, 5);

    /* ---- 左墙：竖书柜（放在床下方，别被床压住） ---- */
    var sbX = rm.x0, sbY = -62, sbW = 38, sbH = 252;
    ctx.fillStyle = 'rgba(60,44,26,0.22)';
    ctx.beginPath();
    ctx.ellipse(sbX + sbW / 2 + 6, sbY + sbH - 4, sbW * 0.62, 10, 0, 0, TAU);
    ctx.fill();
    /* 柜体 */
    ctx.fillStyle = '#8A5E30';
    rr(sbX, sbY, sbW, sbH, 4);
    ctx.fill();
    ctx.fillStyle = '#9A6C38';
    rr(sbX + 2, sbY + 2, sbW - 4, sbH - 4, 3);
    ctx.fill();
    /* 隔板 + 书 */
    var shelfN = 5;
    var shelfH = (sbH - 10) / shelfN;
    for (var sh = 0; sh < shelfN; sh += 1) {
        var sy0 = sbY + 5 + sh * shelfH;
        /* 隔板 */
        ctx.fillStyle = '#6E4A22';
        ctx.fillRect(sbX + 2, sy0 + shelfH - 4, sbW - 4, 4);
        /* 一格里的几本书：高低胖瘦错开 */
        var bw = 5;
        var bx0 = sbX + 6;
        var bi = 0;
        while (bx0 + bw < sbX + sbW - 4) {
            var seed = sh * 7 + bi * 3;
            var bh2 = shelfH * (0.55 + hash2(seed, 41) * 0.34);
            var col = ['#C2566E', '#4E7A9A', '#7A9A4E', '#C29A4E', '#8A6AA8', '#4E9A93'][
                Math.floor(hash2(seed, 51) * 6)
            ];
            ctx.fillStyle = col;
            rr(bx0, sy0 + shelfH - 4 - bh2, bw, bh2, 1);
            ctx.fill();
            /* 书脊一道高光，别像色块 */
            ctx.fillStyle = 'rgba(255,255,255,0.22)';
            ctx.fillRect(bx0 + 1, sy0 + shelfH - 2 - bh2, 1.2, bh2 - 2);
            bx0 += bw + 2;
            bi += 1;
        }
    }
    /* 柜侧一道阴影，显出厚度 */
    ctx.fillStyle = 'rgba(80,52,24,0.3)';
    ctx.fillRect(sbX + sbW - 4, sbY + 2, 4, sbH - 4);

    /* ---- 右墙：窗 + 壁炉 ---- */

    rr(rm.x1 - 18, rm.y0, 18, rh, 3);

    /* 窗 */

    rr(rm.x1 - 16, rm.y0 + 26, 12, 46, 2);
    ctx.fill();
    ctx.strokeStyle = '#7A5A38';
    ctx.lineWidth = 1.4;
    ctx.strokeRect(rm.x1 - 16, rm.y0 + 26, 12, 46);
    ctx.beginPath();
    ctx.moveTo(rm.x1 - 10, rm.y0 + 26);
    ctx.lineTo(rm.x1 - 10, rm.y0 + 72);
    ctx.stroke();

    /* ---- 床：左上角一张床（床头板 + 床垫 + 被子 + 枕头） ---- */
    /* 落地影子 */
    ctx.fillStyle = 'rgba(60,44,26,0.22)';
    ctx.beginPath();
    ctx.ellipse(-108, rm.y0 + 130, 62, 14, 0, 0, TAU);
    ctx.fill();
    /* 床头板：比床身宽一点、高出来一截 */
    ctx.fillStyle = '#7A5228';
    rr(-168, rm.y0 + 8, 118, 40, 6);
    ctx.fill();
    ctx.fillStyle = '#8A6030';
    rr(-164, rm.y0 + 12, 110, 32, 5);
    ctx.fill();
    /* 床身外框（木沿） */

    rr(-164, rm.y0 + 40, 114, 116, 6);
    ctx.fill();
    /* 床垫：米白，比木框内缩一点 */

    rr(-158, rm.y0 + 46, 102, 104, 5);
    ctx.fill();
    /* 枕头：两只并排，带一点厚度 */
    for (var pi2 = 0; pi2 < 2; pi2 += 1) {
        var plx = -152 + pi2 * 50;
        ctx.fillStyle = 'rgba(150,130,100,0.28)';
        rr(plx, rm.y0 + 50, 46, 24, 7);
        ctx.fill();
        ctx.fillStyle = '#FAF5E8';
        rr(plx, rm.y0 + 48, 46, 23, 7);
        ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.75)';
        rr(plx + 5, rm.y0 + 51, 36, 6, 3);
        ctx.fill();
    }
    /* 被子：盖住下半张床，带折边和两道褶 */
    ctx.fillStyle = '#C2566E';
    rr(-160, rm.y0 + 92, 106, 62, 6);
    ctx.fill();
    /* 被沿（更亮的一条折边） */
    ctx.fillStyle = '#D4708A';
    rr(-160, rm.y0 + 92, 106, 14, 6);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.45)';
    rr(-158, rm.y0 + 93, 102, 5, 3);
    ctx.fill();
    /* 被子上的两道褶线（只画在被子范围内） */
    ctx.strokeStyle = 'rgba(150,50,74,0.4)';
    ctx.lineWidth = 1.4;
    for (var fu = 0; fu < 2; fu += 1) {
        var fuy = rm.y0 + 116 + fu * 18;
        ctx.beginPath();
        ctx.moveTo(-152, fuy);
        ctx.lineTo(-56, fuy);
        ctx.stroke();
    }
    /* 床尾板 */
    ctx.fillStyle = '#8A6030';
    rr(-164, rm.y0 + 150, 114, 10, 4);
    ctx.fill();

    /* ---- 桌 + 椅：右下 ---- */
    ctx.fillStyle = 'rgba(60,44,26,0.22)';
    ctx.beginPath();
    ctx.ellipse(96, 108, 58, 14, 0, 0, TAU);
    ctx.fill();
    /* 椅背：立在桌右侧，独立成一把椅子 */

    ctx.ellipse(150, 108, 20, 6, 0, 0, TAU);
    ctx.fill();
    ctx.fillStyle = '#7A5228';
    rr(136, 56, 30, 34, 4);
    ctx.fill();
    ctx.fillStyle = '#8A6030';
    rr(139, 59, 24, 28, 3);
    ctx.fill();
    /* 椅面 */
    ctx.fillStyle = '#8A6030';
    rr(134, 86, 34, 8, 3);
    ctx.fill();
    /* 椅子腿 */
    ctx.fillStyle = '#7A5228';
    rr(136, 92, 5, 18, 2);
    ctx.fill();
    rr(161, 92, 5, 18, 2);
    ctx.fill();
    /* 桌腿（从桌面底下接出来，别留缝） */
    ctx.fillStyle = '#7A5228';
    rr(58, 55, 7, 52, 2);
    ctx.fill();
    rr(132, 55, 7, 52, 2);
    ctx.fill();
    /* 桌面 */
    ctx.fillStyle = '#A8783E';
    rr(46, 44, 104, 16, 5);
    ctx.fill();
    ctx.fillStyle = '#C09050';
    rr(46, 44, 104, 11, 5);
    ctx.fill();
    /* 桌面前沿高光 */

    ctx.fill();
    /* 桌上小盆栽：盆 + 土 + 三片叶（摆在桌面正上方） */
    ctx.fillStyle = '#B4573E';

    ctx.fill();
    ctx.fillStyle = '#C96A4C';
    rr(60, 32, 22, 6, 3);
    ctx.fill();
    ctx.fillStyle = '#5A4030';
    rr(63, 31, 16, 4, 2);
    ctx.fill();
    ctx.fillStyle = '#5EA23E';
    for (var lf = -1; lf <= 1; lf += 1) {
        ctx.beginPath();

    ctx.fillStyle = '#6FB84A';
    ctx.beginPath();

    /* ---- 门：下墙正中的一扇木门 ---- */
    ctx.fillStyle = '#8A5A2E';

    ctx.fillStyle = '#A8703A';

    /* 门口的迎宾垫 */

    /* ---- 房间外圈：一圈墙影，显出"屋"的边界 ---- */
    ctx.strokeStyle = 'rgba(60,42,24,0.55)';

    /* ---- 吊灯 ---- */

    ctx.beginPath();
    ctx.moveTo(0, rm.y0 - 54);
    ctx.lineTo(0, rm.y0 - 26);

    ctx.fillStyle = '#C9A227';
    ctx.beginPath();

    var bh = Math.min(44, H * 0.062);
    var bw = Math.min(126, W * 0.34);
