            var wig = Math.sin(t * 2.6 + i) * 0.2;
            var lx = Math.cos(a2) * r * 1.5;
            var ly = Math.sin(a2) * r * 1.35;
            ctx.moveTo(Math.cos(a2) * r * 0.7, Math.sin(a2) * r * 0.7);
            ctx.quadraticCurveTo(lx * 0.8 + wig * r * 0.3, ly * 0.7, lx, ly);
        }
        ctx.stroke();

        // 身
        ctx.fillStyle = body;
        ctx.beginPath();
        ctx.ellipse(0, 0, r * 1.02, r * 0.96, 0, 0, TAU);
        ctx.fill();
        // 苔藓
        ctx.fillStyle = 'rgba(110,170,70,0.75)';
        ctx.beginPath();
        ctx.ellipse(-r * 0.5, -r * 0.5, r * 0.32, r * 0.22, -0.5, 0, TAU);
        ctx.ellipse(r * 0.36, -r * 0.62, r * 0.26, r * 0.18, 0.4, 0, TAU);
        ctx.fill();
        // 大嘴
        var open = 0.5 + Math.sin(t * 3) * 0.18;
        ctx.fillStyle = '#3A1E16';
        ctx.beginPath();
        ctx.ellipse(0, r * 0.34, r * 0.56, r * 0.34 * open, 0, 0, TAU);
        ctx.fill();
        // 牙
        ctx.fillStyle = '#FFF6E4';
        ctx.beginPath();
        for (i = 0; i < 4; i += 1) {
            var tx = -r * 0.42 + i * r * 0.28;
            ctx.moveTo(tx - r * 0.08, r * 0.2);
            ctx.lineTo(tx + r * 0.08, r * 0.2);
            ctx.lineTo(tx, r * 0.44);
        }
        ctx.fill();
        // 眼
        ctx.fillStyle = '#FF5D45';
        ctx.beginPath();
        ctx.arc(-r * 0.34, -r * 0.22, r * 0.14, 0, TAU);
        ctx.arc(r * 0.34, -r * 0.22, r * 0.14, 0, TAU);
        ctx.fill();
        ctx.fillStyle = '#FFE08A';
        ctx.beginPath();
        ctx.arc(-r * 0.34, -r * 0.22, r * 0.06, 0, TAU);
        ctx.arc(r * 0.34, -r * 0.22, r * 0.06, 0, TAU);
        ctx.fill();
    }

    // 受击白闪
    if (flash) {
        ctx.globalAlpha = 0.35;
        ctx.fillStyle = '#FFFFFF';
        ctx.beginPath();
        ctx.arc(0, 0, r * 1.05, 0, TAU);
        ctx.fill();
        ctx.globalAlpha = 1;
    }

    ctx.restore();
}

/* ------------------------------------------------------------ 玩家与投射物 */
function drawPlayer() {
    var p = state.player;
    var ch = getChar(state.charId);

    // 拖影
    for (var i = 0; i < p.trail.length; i += 1) {
        var tr = p.trail[i];
        var age = 1 - tr.t / 0.26;
        if (age <= 0) { continue; }
        ctx.globalAlpha = age * 0.18;
        ctx.fillStyle = ch.color;
        fillEllipse(tr.x, tr.y + p.r * 0.95, p.r * 0.62 * age, p.r * 0.16 * age);
    }
    ctx.globalAlpha = 1;

    if (p.iframe > 0 && Math.floor(p.iframe * 16) % 2 === 0) {
        ctx.globalAlpha = 0.45;
    }

    // 光环（亮底上改成细线环，别糊成一片白圈）
    if (upLv('halo') > 0) {
        var hr = 92 + upLv('halo') * 18;
        ctx.fillStyle = 'rgba(255,255,255,0.10)';
        ctx.beginPath();
        ctx.arc(p.x, p.y, hr, 0, TAU);
        ctx.fill();
        ctx.strokeStyle = 'rgba(26,118,142,0.38)';
        ctx.lineWidth = 1.8;
        ctx.setLineDash([7, 7]);
        ctx.beginPath();
        ctx.arc(p.x, p.y, hr, 0, TAU);
        ctx.stroke();
        ctx.setLineDash([]);
    }

    // 升级瞬间的弹性变大：前 0.2 秒冲到峰值，之后带回弹地缩回去
    var growS = 1;
    if (state.growT > 0) {
        var gt = 1 - state.growT / 1.2;
        growS = gt < 0.18
            ? 1 + (gt / 0.18) * 0.42
            : 1.42 - easeOut((gt - 0.18) / 0.82) * 0.42 + Math.sin((gt - 0.18) * 12) * 0.02;
    }
    if (growS !== 1) {
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.scale(growS, growS);
        drawCharShape(state.charId, 0, 0, p.r, p.walk, p.face, p.hurt, 1);
        ctx.restore();
    } else {
        drawCharShape(state.charId, p.x, p.y, p.r, p.walk, p.face, p.hurt, 1);
    }
    ctx.globalAlpha = 1;

    // 护盾
    if (p.shield > 0) {
        ctx.strokeStyle = 'rgba(92,200,255,0.85)';
        ctx.lineWidth = 2.2;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r * 1.75, 0, TAU);
        ctx.stroke();
        ctx.fillStyle = 'rgba(92,200,255,0.12)';
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r * 1.75, 0, TAU);
        ctx.fill();
    }
}

function drawOrbs() {
    for (var i = 0; i < state.orbs.length; i += 1) {
        var o = state.orbs[i];
        ctx.save();
        ctx.translate(o.x, o.y);
        ctx.globalAlpha = 0.35;
        ctx.fillStyle = '#9AD7FF';
        fillEllipse(0, 0, 15, 15);
        ctx.globalAlpha = 1;
        ctx.fillStyle = '#E8F8FF';
        fillEllipse(0, 0, 7, 7);
        ctx.fillStyle = '#5FB8FF';
        fillEllipse(0, 0, 4, 4);
        ctx.restore();
    }
}


function drawHoles() {
    for (var i = 0; i < state.holes.length; i += 1) {
        var h = state.holes[i];
        var k = h.t / h.max;
        var pulse = 0.9 + 0.1 * Math.sin(world.tick * 8);

        // 吸积盘光晕
        ctx.globalAlpha = 0.30 * k;
        ctx.fillStyle = '#C08CFF';
        fillEllipse(h.x, h.y, h.r * pulse, h.r * pulse * 0.82);
        ctx.globalAlpha = 1;

        // 核心
        ctx.globalAlpha = 0.9 * k;
        ctx.fillStyle = '#0B0418';
        fillEllipse(h.x, h.y, h.r * 0.30, h.r * 0.26);
        ctx.globalAlpha = 1;

        // 旋转环
        ctx.strokeStyle = '#C08CFF';
        for (var r = 0; r < 3; r += 1) {
            ctx.globalAlpha = (0.7 - r * 0.2) * k;
            ctx.lineWidth = 2.4 - r * 0.6;
            ctx.beginPath();
            ctx.ellipse(h.x, h.y, h.r * (0.42 + r * 0.26), h.r * (0.34 + r * 0.2),
                world.tick * (2 + r) + r, 0, TAU);
            ctx.stroke();
        }
        ctx.globalAlpha = 1;
    }
}

function drawDrones() {
    for (var i = 0; i < state.drones.length; i += 1) {
        var d = state.drones[i];
        ctx.save();
        ctx.translate(d.x, d.y);
        var bob = Math.sin(world.tick * 5 + i) * 1.6;
        ctx.translate(0, bob);

        ctx.globalAlpha = 0.3;
        ctx.fillStyle = '#7CFFB2';
        fillEllipse(0, 0, 10, 10);
        ctx.globalAlpha = 1;

        ctx.fillStyle = '#7CFFB2';
        ctx.beginPath();
        ctx.moveTo(0, -5.5);
        ctx.lineTo(5, 4);
        ctx.lineTo(0, 1.8);
        ctx.lineTo(-5, 4);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = '#FFFFFF';
        fillEllipse(0, -1.5, 1.7, 1.7);
        ctx.restore();
    }
}

/* 当前装备的攻击特效；没选或没解锁就返回 null */
function curFx() {
    if (typeof save === 'undefined' || !save || !save.fxCur || save.fxCur === 'plain') { return null; }
    return FX_SKINS[save.fxCur] || null;
}

/* 子弹拖尾：沿飞行反方向铺一串渐隐的点 */
function drawBulletTrail(b, fx) {
    var ang = Math.atan2(b.vy, b.vx);
    var ux = -Math.cos(ang);
    var uy = -Math.sin(ang);
    var i, k;

    if (fx.tail === 'rainbow') {
        for (i = 1; i <= 4; i += 1) {
            k = i / 4;
            ctx.globalAlpha = 0.42 * (1 - k) + 0.05;
            ctx.fillStyle = 'hsl(' + Math.round((b.x * 1.7 + state.time * 110) % 360) + ',85%,68%)';
            fillEllipse(ux * i * 7, uy * i * 7, 5 - k * 2.6, 5 - k * 2.6);
        }
        ctx.globalAlpha = 1;
        return;
    }

    for (i = 1; i <= 3; i += 1) {
        k = i / 3;
        ctx.globalAlpha = 0.34 * (1 - k) + 0.05;
        ctx.fillStyle = fx.tail;
        fillEllipse(ux * i * 8, uy * i * 8, 5.2 * (1 - k * 0.5), 4.4 * (1 - k * 0.5));
    }
    if (fx.glow) {
        ctx.fillStyle = fx.glow;
        for (i = 0; i < 3; i += 1) {
            var a = (i / 3) * TAU + b.x * 0.02;
            ctx.globalAlpha = 0.45;
            fillEllipse(ux * (12 + i * 6) + Math.cos(a) * 5, uy * (12 + i * 6) + Math.sin(a) * 5, 1.7, 1.7);
        }
    }
    ctx.globalAlpha = 1;
}

function drawBullets() {
    var fx = curFx();
    for (var i = 0; i < state.bullets.length; i += 1) {
        var b = state.bullets[i];
        ctx.save();
        ctx.translate(b.x, b.y);
        if (fx) { drawBulletTrail(b, fx); }
        if (b.kind === 'blade') {
            ctx.rotate(b.spin);
            ctx.strokeStyle = fx && fx.tail !== 'rainbow' ? fx.tail : '#7CFFB2';
            ctx.lineWidth = 3;
            ctx.globalAlpha = 0.9;
            ctx.beginPath();
            ctx.arc(0, 0, 9, 0.3, 2.4);
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(0, 0, 9, 3.4, 5.5);
            ctx.stroke();
            ctx.globalAlpha = 1;
        } else {
            ctx.rotate(Math.atan2(b.vy, b.vx));
            ctx.globalAlpha = 0.35;
            ctx.fillStyle = b.color;
            fillEllipse(0, 0, 13, 6);
            ctx.globalAlpha = 1;
            ctx.fillStyle = b.color;
            ctx.beginPath();
            ctx.moveTo(9, 0);
            ctx.lineTo(-6, -4);
            ctx.lineTo(-3, 0);
            ctx.lineTo(-6, 4);
            ctx.closePath();
            ctx.fill();
            ctx.fillStyle = '#FFFFFF';
            fillEllipse(2, 0, 2.6, 2.2);
        }
        ctx.restore();
    }
}

function drawEnemyBullets() {
    for (var i = 0; i < state.ebullets.length; i += 1) {
        var b = state.ebullets[i];
        ctx.globalAlpha = 0.32;
        ctx.fillStyle = b.color;
        fillEllipse(b.x, b.y, b.r * 2.1, b.r * 2.1);
        ctx.globalAlpha = 1;
        ctx.fillStyle = b.color;
        fillEllipse(b.x, b.y, b.r, b.r);
        ctx.fillStyle = '#FFFFFF';
        fillEllipse(b.x - b.r * 0.25, b.y - b.r * 0.25, b.r * 0.4, b.r * 0.4);
    }
}

function drawMines() {
    for (var i = 0; i < state.mines.length; i += 1) {
        var m = state.mines[i];
        var k = 1 - m.t / m.max;
        ctx.strokeStyle = 'rgba(255,138,92,' + (0.35 + k * 0.55) + ')';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(m.x, m.y, 8 + k * 5, 0, TAU);
        ctx.stroke();
        ctx.fillStyle = '#FF8A5C';
        fillEllipse(m.x, m.y, 3.5, 3.5);
    }
}

/* 经验宝石：紫蓝菱形晶体——和黄白色的炮弹在色相上彻底拉开，
   捡东西和打怪扫一眼就能分清。大颗经验（头目/铁甲虫）更亮更大。 */
function drawGems() {
    for (var i = 0; i < state.gems.length; i += 1) {
        var g = state.gems[i];
        var s = (g.v >= 5 ? 5.6 : 3.8) + Math.sin(g.t * 8) * 0.7;
        var big = g.v >= 5;
        // 底光
        ctx.globalAlpha = 0.4;
        ctx.fillStyle = big ? '#C9B0FF' : '#A87BFF';
        fillEllipse(g.x, g.y, s + 4.5, s + 4.5);
        ctx.globalAlpha = 1;
        // 菱形晶体
        ctx.save();
        ctx.translate(g.x, g.y);
        ctx.rotate(Math.sin(g.t * 2.4) * 0.35);
        ctx.fillStyle = big ? '#B48CFF' : '#9F6BFF';
        ctx.beginPath();
        ctx.moveTo(0, -s * 1.35);
        ctx.lineTo(s * 0.78, 0);
        ctx.lineTo(0, s * 1.35);
        ctx.lineTo(-s * 0.78, 0);
        ctx.closePath();
        ctx.fill();
        // 内芯亮面
        ctx.fillStyle = big ? '#EBE0FF' : '#D8C4FF';
        ctx.beginPath();
        ctx.moveTo(0, -s * 0.72);
        ctx.lineTo(s * 0.4, 0);
        ctx.lineTo(0, s * 0.72);
        ctx.lineTo(-s * 0.4, 0);
        ctx.closePath();
        ctx.fill();
        // 高光点
        ctx.fillStyle = '#FFFFFF';
        fillEllipse(-s * 0.18, -s * 0.42, s * 0.2, s * 0.14);
        ctx.restore();
    }
}

/* 金币：路上掉的、会自己飞过来 */
function drawCoins() {
    for (var i = 0; i < state.coins.length; i += 1) {
        var c = state.coins[i];
        var s = 4.0 + Math.sin(c.t * 9) * 0.45;
        ctx.globalAlpha = 0.38;
        ctx.fillStyle = '#FFD24A';
        fillEllipse(c.x, c.y, s + 4, s + 4);
        ctx.globalAlpha = 1;
        ctx.fillStyle = '#E0A21A';
        fillEllipse(c.x, c.y, s, s);
        ctx.fillStyle = '#FFE38A';
        fillEllipse(c.x - s * 0.3, c.y - s * 0.3, s * 0.42, s * 0.42);
    }
}

/* 地图彩蛋：许愿井 / 土地庙 / 稻草人 / 野餐篮 / 树洞信箱
   不是敌人也不掉落，走到跟前才触发一次；触发后淡出消失。 */
function drawRelics() {
    for (var i = 0; i < state.relics.length; i += 1) {
        var r = state.relics[i];
        if (r.used && r.useT <= 0) { continue; }
        var fade = r.used ? r.useT / 1.1 : 1;
        var bob = Math.sin(r.t * 1.6 + i) * 1.5;

        ctx.save();
        if (!r.used) {
            ctx.globalAlpha = 0.1 + Math.sin(r.t * 2.2) * 0.05;
            ctx.fillStyle = '#FFE9A8';
            fillEllipse(r.x, r.y - 8, 38, 26);
            ctx.globalAlpha = 1;
        }
        ctx.globalAlpha = fade;
        ctx.translate(r.x, r.y + bob);
        drawRelicShape(r.id, r.t);
        ctx.restore();
    }
}

function drawRelicShape(id, t) {
    // 统一的落地影
    ctx.fillStyle = 'rgba(58,88,46,0.2)';
    fillEllipse(0, 12, 24, 6);

    if (id === 'wish') {
        /* 许愿井：石井圈 + 一汪水 + 木架吊桶 */
        ctx.fillStyle = '#A9A896';
        ctx.beginPath(); ctx.ellipse(0, 2, 26, 14.5, 0, 0, TAU); ctx.fill();
        ctx.strokeStyle = '#7C7C68';
        ctx.lineWidth = 1.4;
        ctx.stroke();

        ctx.fillStyle = '#4E7E92';
        ctx.beginPath(); ctx.ellipse(0, 2, 18, 9, 0, 0, TAU); ctx.fill();

        ctx.strokeStyle = 'rgba(214,242,255,0.7)';
        ctx.lineWidth = 1.6;
        ctx.beginPath(); ctx.ellipse(-2, 1, 11, 5, 0, Math.PI * 1.12, Math.PI * 1.72); ctx.stroke();
        ctx.beginPath(); ctx.ellipse(3, 4, 6.5, 3, 0, Math.PI * 1.2, Math.PI * 1.8); ctx.stroke();

        ctx.strokeStyle = 'rgba(120,120,104,0.5)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(-22, 0); ctx.lineTo(-18, 6);
        ctx.moveTo(20, -2); ctx.lineTo(16, 5);
        ctx.moveTo(4, 15); ctx.lineTo(6, 9);
        ctx.stroke();

        ctx.strokeStyle = '#8A6134';
        ctx.lineWidth = 3.2;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(-19, -2); ctx.lineTo(-16, -34);
        ctx.moveTo(19, -2); ctx.lineTo(16, -34);
        ctx.stroke();
        ctx.lineWidth = 2.8;
        ctx.beginPath(); ctx.moveTo(-18, -34); ctx.lineTo(18, -34); ctx.stroke();
        ctx.fillStyle = '#9A7040';
        fillEllipse(0, -34, 4, 4);

        var swing = Math.sin(t * 1.4) * 2.4;
        ctx.strokeStyle = 'rgba(196,168,120,0.9)';
        ctx.lineWidth = 1.2;
        ctx.beginPath(); ctx.moveTo(swing, -33); ctx.lineTo(swing, -20); ctx.stroke();
        ctx.fillStyle = '#B07C42';
        rr(swing - 6, -21, 12, 10, 2);
        ctx.fill();
        ctx.strokeStyle = '#7A5226';
        ctx.lineWidth = 1;
        ctx.stroke();

    } else if (id === 'shrine') {
        /* 土地庙：小瓦顶 + 米白庙身 + 门口一炷香 */
        ctx.fillStyle = '#F0E4C8';
        ctx.beginPath();
        ctx.moveTo(-14, 8); ctx.lineTo(-12, -10); ctx.lineTo(12, -10); ctx.lineTo(14, 8);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = '#B9A582';
        ctx.lineWidth = 1.3;
        ctx.stroke();

        ctx.fillStyle = '#5A4A34';
        ctx.beginPath();
        ctx.moveTo(-5, 8); ctx.lineTo(-5, -2);
        ctx.quadraticCurveTo(0, -6.5, 5, -2);
        ctx.lineTo(5, 8);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = '#A2503C';
        ctx.beginPath();
        ctx.moveTo(-21, -8);
        ctx.quadraticCurveTo(-16, -24, 0, -24);
        ctx.quadraticCurveTo(16, -24, 21, -8);
        ctx.quadraticCurveTo(12, -12, 0, -12);
        ctx.quadraticCurveTo(-12, -12, -21, -8);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = '#7A3626';
        ctx.lineWidth = 1.3;
        ctx.stroke();

        ctx.strokeStyle = 'rgba(122,54,38,0.35)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        for (var k = -12; k <= 12; k += 8) {
            ctx.moveTo(k, -11); ctx.lineTo(k * 1.12, -22);
        }
        ctx.stroke();

        ctx.fillStyle = '#B9A582';
        rr(-9, 8, 18, 4, 1.5);
        ctx.fill();
        ctx.fillStyle = '#8A7050';
        rr(-4, 2, 8, 6, 2);
        ctx.fill();
        ctx.fillStyle = 'rgba(255,170,80,' + (0.6 + Math.sin(t * 3) * 0.2).toFixed(2) + ')';
        fillEllipse(0, 1, 2.2, 2.2);

    } else if (id === 'scarecrow') {
        /* 稻草人：十字木架 + 草捆身子 + 草帽，眼睛会慢慢扫 */
        ctx.strokeStyle = '#8A6134';
        ctx.lineWidth = 3.4;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(0, 14); ctx.lineTo(0, -30);
        ctx.moveTo(-16, -16); ctx.lineTo(16, -16);
        ctx.stroke();

        ctx.fillStyle = '#DFC06A';
        ctx.beginPath(); ctx.ellipse(0, -6, 12, 13, 0, 0, TAU); ctx.fill();
        ctx.strokeStyle = '#B39242';
        ctx.lineWidth = 1.1;
        ctx.stroke();

        // 草茎纹（竖向才像稻草，横纹会糊成蜂巢）
        ctx.strokeStyle = 'rgba(163,122,50,0.5)';
        ctx.lineWidth = 1.1;
        ctx.beginPath();
        for (var sk = -3; sk <= 3; sk += 1) {
            ctx.moveTo(sk * 3.1, -16.5);
            ctx.lineTo(sk * 3.7, 5.5);
        }
        ctx.stroke();
        // 腰上两道捆绳
        ctx.strokeStyle = 'rgba(120,86,38,0.72)';
        ctx.lineWidth = 1.4;
        ctx.beginPath();
        ctx.moveTo(-11.4, -8); ctx.lineTo(11.4, -8);
        ctx.moveTo(-10.6, -1); ctx.lineTo(10.6, -1);
        ctx.stroke();

        ctx.strokeStyle = '#C9A64E';
        ctx.lineWidth = 1.6;
        ctx.beginPath();
        for (var q = 0; q < 4; q += 1) {
            ctx.moveTo(-16, -16); ctx.lineTo(-22 - q * 1.2, -8 + q * 3);
            ctx.moveTo(16, -16); ctx.lineTo(22 + q * 1.2, -8 + q * 3);
        }
        ctx.stroke();

        ctx.fillStyle = '#EBD79E';
        ctx.beginPath(); ctx.arc(0, -24, 9.4, 0, TAU); ctx.fill();
        ctx.strokeStyle = '#B39242';
        ctx.lineWidth = 1.2;
        ctx.stroke();

        ctx.fillStyle = '#C99A4E';
        ctx.beginPath(); ctx.ellipse(0, -29.5, 13.5, 4.4, 0, 0, TAU); ctx.fill();
        ctx.beginPath(); ctx.ellipse(0, -33, 7, 4.4, 0, Math.PI, TAU); ctx.fill();

        var look = Math.sin(t * 0.9) * 1.3;
        ctx.fillStyle = '#4A3826';
        fillEllipse(-3.2 + look, -25.5, 1.6, 1.8);
        fillEllipse(3.2 + look, -25.5, 1.6, 1.8);
        ctx.strokeStyle = 'rgba(74,56,38,0.8)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(-3.4 + look, -21); ctx.lineTo(3.4 + look, -21);
        ctx.stroke();

    } else if (id === 'basket') {
        /* 野餐篮：竹编篮 + 格布 + 露一角面包 */
        ctx.fillStyle = '#C79A5C';
        ctx.beginPath();
        ctx.moveTo(-15, -9); ctx.lineTo(15, -9); ctx.lineTo(11, 10); ctx.lineTo(-11, 10);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = '#8A6134';
        ctx.lineWidth = 1.3;
        ctx.stroke();

        ctx.strokeStyle = 'rgba(138,97,52,0.45)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        for (var bb = -6; bb <= 9; bb += 5) {
            var inset = (bb + 9) / 19 * 2;
            ctx.moveTo(-15 + inset, bb); ctx.lineTo(15 - inset, bb);
        }
        ctx.stroke();

        ctx.strokeStyle = '#A9793E';
        ctx.lineWidth = 2.6;
        ctx.beginPath(); ctx.arc(0, -9, 13, Math.PI * 1.04, Math.PI * 1.96); ctx.stroke();

        ctx.save();
        ctx.beginPath();
        ctx.moveTo(-16, -9); ctx.lineTo(16, -9); ctx.lineTo(12, -1); ctx.lineTo(-12, -1);
        ctx.closePath();
        ctx.clip();
        ctx.fillStyle = '#F2E6D2';
        ctx.fillRect(-17, -10, 34, 10);
        ctx.fillStyle = '#D8626E';
        for (var gi = -16; gi < 18; gi += 7) { ctx.fillRect(gi, -10, 3.2, 10); }
        for (var gj = -9; gj < -1; gj += 5) { ctx.fillRect(-17, gj, 34, 2.2); }
        ctx.restore();

        ctx.fillStyle = '#E8B96A';
        ctx.beginPath(); ctx.ellipse(6, -8.5, 5, 3.2, -0.3, 0, TAU); ctx.fill();

    } else {
        /* 树洞信箱：老树桩上开了个口子，信露在外面 */
        ctx.fillStyle = '#8A6134';
        rr(-12, -22, 24, 34, 5);
        ctx.fill();
        ctx.strokeStyle = '#5E3E1E';
        ctx.lineWidth = 1.4;
        ctx.stroke();

        ctx.fillStyle = 'rgba(255,240,200,0.16)';
        rr(-9, -21, 6.5, 32, 3);
        ctx.fill();

        ctx.fillStyle = '#3E2A16';
        ctx.beginPath(); ctx.ellipse(1, -6, 7.2, 8.8, 0, 0, TAU); ctx.fill();

        ctx.save();
        ctx.translate(1, -7);
        ctx.rotate(-0.22 + Math.sin(t * 1.2) * 0.04);
        ctx.fillStyle = '#F7F1E2';
        rr(-6, -6.5, 12, 9.5, 1);
        ctx.fill();
        ctx.strokeStyle = '#C9BCA4';
        ctx.lineWidth = 0.9;
        ctx.stroke();
        ctx.fillStyle = '#C0503E';
        fillEllipse(0, 1.4, 2.3, 2.3);
        ctx.restore();

        ctx.fillStyle = 'rgba(120,160,90,0.55)';
        fillEllipse(-8, 8, 4, 2.2);
        fillEllipse(7, 6, 3, 1.8);
    }

    ctx.lineCap = 'butt';
}

/* 老木箱：草丛里的一点金光 */
function drawChests() {
    for (var i = 0; i < state.chests.length; i += 1) {
        var c = state.chests[i];
        if (c.opened && c.openT <= 0) { continue; }
        var fade = c.opened ? c.openT / 1.2 : 1;
        var pulse = 0.30 + Math.sin(c.t * 2.4) * 0.12;

        ctx.save();
        ctx.globalAlpha = fade;
        ctx.globalAlpha = fade * (c.opened ? 0.5 : pulse + 0.2);
        ctx.fillStyle = '#FFE08A';
        fillEllipse(c.x, c.y - 4, 34, 24);
        ctx.globalAlpha = fade;

        ctx.translate(c.x, c.y + Math.sin(c.t * 1.8) * 1.6);
        // 影子
        ctx.fillStyle = 'rgba(58,88,46,0.2)';
        fillEllipse(0, 15, 19, 5);
        // 箱体
        ctx.fillStyle = '#A9743C';
        rr(-16, -6, 32, 22, 4);
        ctx.fill();
        ctx.strokeStyle = '#6E451E';
        ctx.lineWidth = 1.6;
        rr(-16, -6, 32, 22, 4);
        ctx.stroke();
        // 铁箍
        ctx.fillStyle = '#8A5A2E';
        ctx.fillRect(-10, -6, 4, 22);
        ctx.fillRect(6, -6, 4, 22);
        // 盖子
        ctx.save();
        ctx.translate(0, -6);
        if (c.opened) { ctx.rotate(-0.72); }
        ctx.fillStyle = '#C08A4A';
        rr(-17, -10, 34, 11, 4);
        ctx.fill();
        ctx.strokeStyle = '#6E451E';
        ctx.lineWidth = 1.6;
        rr(-17, -10, 34, 11, 4);
        ctx.stroke();
        ctx.restore();
        // 锁扣
        ctx.fillStyle = '#F2CC66';
        fillEllipse(0, 1, 3.4, 4.6);
        ctx.fillStyle = '#8A5A2E';
        fillEllipse(0, 2, 1.4, 1.8);
        ctx.restore();
    }
}

/* 星屑碎片 */
function drawShard() {
    var s = state.shard;
    if (!s) { return; }
    var pu = 0.5 + Math.sin(s.t * 3) * 0.5;

    ctx.globalAlpha = 0.16 + pu * 0.16;
    ctx.fillStyle = '#9AD7FF';
    fillEllipse(s.x, s.y - 6, 30 + pu * 8, 26 + pu * 8);
    ctx.globalAlpha = 1;

    ctx.save();
    ctx.translate(s.x, s.y - 6 + Math.sin(s.t * 2) * 3.2);
    ctx.rotate(Math.sin(s.t * 1.4) * 0.28);
    var g = ctx.createLinearGradient(-10, -15, 10, 15);
    g.addColorStop(0, '#F4FAFF');
    g.addColorStop(0.45, '#9AD7FF');
    g.addColorStop(1, '#5A78D8');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(0, -15);
    ctx.lineTo(9.5, 0);
    ctx.lineTo(0, 15);
    ctx.lineTo(-9.5, 0);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.9)';
    ctx.lineWidth = 1.3;
    ctx.stroke();
    // 内折光
    ctx.strokeStyle = 'rgba(255,255,255,0.5)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(0, -15);
    ctx.lineTo(0, 15);
    ctx.stroke();
    ctx.restore();

    for (var i = 0; i < 3; i += 1) {
        var a = s.t * 1.8 + i * (TAU / 3);
        glowDot(s.x + Math.cos(a) * 24, s.y - 6 + Math.sin(a) * 18, 2.2, '#DFF0FF', 0.65);
    }
}

function drawPickups() {
    for (var i = 0; i < state.pickups.length; i += 1) {
        var it = state.pickups[i];
        var pulse = 1 + Math.sin(it.t * 6) * 0.1;
        ctx.save();
        ctx.translate(it.x, it.y - Math.sin(it.t * 3) * 3);
        ctx.scale(pulse, pulse);
        ctx.globalAlpha = 0.35;
        ctx.fillStyle = '#FF6B81';
        fillEllipse(0, 0, 18, 18);
        ctx.globalAlpha = 1;
        ctx.fillStyle = '#FF6B81';
        ctx.beginPath();
        ctx.moveTo(0, 9);
        ctx.bezierCurveTo(-13, -1, -6, -12, 0, -4);
        ctx.bezierCurveTo(6, -12, 13, -1, 0, 9);
        ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.75)';
        fillEllipse(-4, -4, 2.6, 1.7);
        ctx.restore();
    }
}

function drawEffects() {
    for (var i = 0; i < state.effects.length; i += 1) {
        var ef = state.effects[i];
        var a = Math.max(0, ef.life / ef.max);

        if (ef.type === 'ring') {
            ctx.strokeStyle = ef.color;
            ctx.globalAlpha = a * 0.9;
            ctx.lineWidth = 5 * a + 1;
            ctx.beginPath();
            ctx.arc(ef.x, ef.y, ef.r, 0, TAU);
            ctx.stroke();
            ctx.globalAlpha = a * 0.12;
            ctx.fillStyle = ef.color;
            ctx.beginPath();
            ctx.arc(ef.x, ef.y, ef.r, 0, TAU);
            ctx.fill();
            ctx.globalAlpha = 1;

        } else if (ef.type === 'zap') {
            ctx.globalAlpha = a;
            ctx.strokeStyle = ef.color;
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(ef.pts[0].x, ef.pts[0].y);
            for (var k = 1; k < ef.pts.length; k += 1) { ctx.lineTo(ef.pts[k].x, ef.pts[k].y); }
            ctx.stroke();
            ctx.strokeStyle = '#FFFFFF';
            ctx.lineWidth = 1.6;
            ctx.stroke();
            ctx.globalAlpha = 1;

        } else if (ef.type === 'beam') {
            // 藤蔓穿刺：一根抽出去的藤枪 —— 外围一层柔光，藤身根粗尖细，沿路斜插几片叶子
            var bdx = ef.x2 - ef.x1, bdy = ef.y2 - ef.y1;
            var blen = Math.sqrt(bdx * bdx + bdy * bdy) || 1;
            var ux = bdx / blen, uy = bdy / blen;
            var nx = -uy, ny = ux;
            var w0 = ef.w * 0.34;
            var w1 = ef.w * 0.05;
            var tipX = ef.x2 + ux * ef.w * 0.6, tipY = ef.y2 + uy * ef.w * 0.6;

            // 外层柔光：颜色淡，只负责把枪身从草地里托出来
            ctx.globalAlpha = a * 0.22;
            ctx.strokeStyle = '#FF9ADF';
            ctx.lineWidth = ef.w * 1.9;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(ef.x1, ef.y1);
            ctx.lineTo(ef.x2, ef.y2);
            ctx.stroke();

            // 藤身
            ctx.globalAlpha = a * 0.95;
            var bg = ctx.createLinearGradient(ef.x1, ef.y1, ef.x2, ef.y2);
            bg.addColorStop(0, '#E96FC4');
            bg.addColorStop(0.5, '#FF8FD8');
            bg.addColorStop(1, '#FFC6EC');
            ctx.fillStyle = bg;
            ctx.beginPath();
            ctx.moveTo(ef.x1 + nx * w0, ef.y1 + ny * w0);
            ctx.lineTo(ef.x2 + nx * w1, ef.y2 + ny * w1);
            ctx.lineTo(tipX, tipY);
            ctx.lineTo(ef.x2 - nx * w1, ef.y2 - ny * w1);
            ctx.lineTo(ef.x1 - nx * w0, ef.y1 - ny * w0);
            ctx.closePath();
            ctx.fill();

            // 中轴高光：细到不抢轮廓
            ctx.strokeStyle = 'rgba(255,255,255,0.5)';
            ctx.lineWidth = Math.max(1, ef.w * 0.09);
            ctx.beginPath();
            ctx.moveTo(ef.x1 + ux * 4, ef.y1 + uy * 4);
            ctx.lineTo(ef.x2 - ux * ef.w * 0.5, ef.y2 - uy * ef.w * 0.5);
            ctx.stroke();

            // 藤叶：斜着撑开，浅叶面 + 深叶脉
            var nLeaf = Math.max(3, (ef.leaf || 1) + 1);
            var baseA = Math.atan2(uy, ux);
            for (var li = 0; li < nLeaf; li += 1) {
                var lt = 0.24 + li * (0.62 / nLeaf);
                var lx2 = ef.x1 + bdx * lt;
                var ly2 = ef.y1 + bdy * lt;
                var side = (li % 2 === 0) ? 1 : -1;
                var lLen = ef.w * 0.85 + 3;
                var lWid = lLen * 0.44;
                ctx.save();
                ctx.translate(lx2, ly2);
                ctx.rotate(baseA + side * (0.95 + (li % 3) * 0.18));
                ctx.fillStyle = 'rgba(158,236,176,0.96)';
                ctx.beginPath();
                ctx.ellipse(lLen * 0.5, 0, lLen * 0.5, lWid * 0.5, 0, 0, TAU);
                ctx.fill();
                ctx.strokeStyle = 'rgba(48,116,66,0.75)';
                ctx.lineWidth = 0.8;
                ctx.stroke();
                ctx.strokeStyle = 'rgba(48,116,66,0.5)';
                ctx.lineWidth = 0.7;
                ctx.beginPath();
                ctx.moveTo(1, 0);
                ctx.lineTo(lLen * 0.92, 0);
                ctx.stroke();
                ctx.restore();
            }
            ctx.lineCap = 'butt';
            ctx.globalAlpha = 1;
        }
    }
}

function drawParticles() {
    for (var i = 0; i < state.particles.length; i += 1) {
        var p = state.particles[i];
        ctx.globalAlpha = Math.max(0, p.life / p.max) * 0.95;
        ctx.fillStyle = p.color;
        var s = p.r * 1.8;
        ctx.fillRect(p.x - s * 0.5, p.y - s * 0.5, s, s);
    }
    ctx.globalAlpha = 1;
}

function drawTexts() {
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (var i = 0; i < state.texts.length; i += 1) {
        var t = state.texts[i];
        ctx.globalAlpha = Math.max(0, t.life / t.max);
        ctx.font = '700 ' + Math.round(t.size) + 'px system-ui, -apple-system, sans-serif';
        ctx.lineWidth = 3;
        ctx.strokeStyle = 'rgba(0,0,0,0.6)';
        ctx.strokeText(t.text, t.x, t.y);
        ctx.fillStyle = t.color;
        ctx.fillText(t.text, t.x, t.y);
    }
    ctx.globalAlpha = 1;
}

/* ------------------------------------------------------------ HUD */
function drawHUD() {
    var p = state.player;
    var th = state.theme;

    // 顶部淡白底衬：亮草地上的深色字靠它读得清
    var hsH = Math.min(118, H * 0.44);
    var hg = ctx.createLinearGradient(0, 0, 0, hsH);
    hg.addColorStop(0, 'rgba(255,255,255,0.88)');
    hg.addColorStop(0.45, 'rgba(255,255,255,0.46)');
    hg.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = hg;
    ctx.fillRect(0, 0, W, hsH);

    /* 左栏按三行排：计时 + 精英倒计时胶囊 / 关卡名 / 金币 + 等级，
       再往下是经验条与血条。所有元素的基线都对齐到同一条线上。 */

    // 第一行：计时
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    var tstr = fmtTime(state.time);
    ctx.font = '800 21px system-ui, -apple-system, sans-serif';
    ctx.fillStyle = '#1E3016';
    ctx.fillText(tstr, 16, 5);
    var tW = ctx.measureText(tstr).width;

    // 第一行右侧：精英倒计时做成一颗胶囊，跟计时拉开距离
    var eTxt = state.phase === 'wave'
        ? '距头目 ' + fmtTime(Math.max(0, state.levelDef.duration - state.time))
        : '头目已现身';
    ctx.font = '700 10px system-ui, sans-serif';
    var eW = ctx.measureText(eTxt).width;
    var eX = 16 + tW + 10;
    var eY = 8;
    var eH = 17;
    ctx.fillStyle = state.phase === 'wave' ? 'rgba(255,255,255,0.66)' : 'rgba(255,214,222,0.86)';
    rr(eX, eY, eW + 16, eH, eH / 2);
    ctx.fill();
    ctx.strokeStyle = state.phase === 'wave' ? 'rgba(56,80,44,0.16)' : 'rgba(214,74,102,0.3)';
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.textBaseline = 'middle';
    ctx.fillStyle = state.phase === 'wave' ? 'rgba(40,58,32,0.78)' : '#C0324E';
    ctx.fillText(eTxt, eX + 8, eY + eH / 2 + 0.5);

    // 第二行：关卡名
    ctx.textBaseline = 'top';
    ctx.font = '700 10.5px system-ui, sans-serif';
    ctx.fillStyle = th.accent;
    ctx.fillText(state.levelDef.name + ' · ' + state.levelDef.sub, 16, 34);

    // 第三行：金币（图标与数字同一中线）
    var coinCx = 22, coinCy = 61;
    ctx.fillStyle = '#E8A81E';
    ctx.beginPath();
    ctx.arc(coinCx, coinCy, 5.2, 0, TAU);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.beginPath();
    ctx.arc(coinCx - 1.4, coinCy - 1.6, 1.5, 0, TAU);
    ctx.fill();
    ctx.textBaseline = 'middle';
    ctx.font = '800 12px system-ui, sans-serif';
    ctx.fillStyle = '#B9821A';
    ctx.fillText(String(state.gold), coinCx + 9, coinCy + 0.5);

    // 右上：分数 + 暂停
    ctx.textAlign = 'right';
    ctx.textBaseline = 'top';
    ctx.font = '800 16px system-ui, sans-serif';
    ctx.fillStyle = '#1E3016';
    ctx.fillText(String(state.score), W - 58, 12);
    ctx.font = '600 9.5px system-ui, sans-serif';
    ctx.fillStyle = 'rgba(40,58,32,0.55)';
    ctx.fillText('SCORE', W - 58, 32);

    var pb = { x: W - 46, y: 13, w: 32, h: 32 };
    /* 视觉是 32×32，但触摸热区向外扩到 ≥44（手指标准）。
       右上角没有别的可点元素，往外扩不会抢到别的按钮。 */
    ui.pauseBtn = { x: pb.x - 6, y: pb.y - 6, w: pb.w + 12, h: pb.h + 12, vx: pb.x, vy: pb.y, vw: pb.w, vh: pb.h };
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    rr(pb.x, pb.y, pb.w, pb.h, 10);
    ctx.fill();
    ctx.strokeStyle = 'rgba(56,80,44,0.22)';
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.fillStyle = '#24361C';
    ctx.fillRect(pb.x + 11, pb.y + 10, 3.5, 12);
    ctx.fillRect(pb.x + 18, pb.y + 10, 3.5, 12);

    // 第三行右侧：等级
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';
    ctx.font = '800 11px system-ui, sans-serif';
    ctx.fillStyle = 'rgba(40,58,32,0.9)';
    ctx.fillText('Lv.' + state.level, W - 16, coinCy + 0.5);

    // 经验条：细，两端留出与血条同样的边距
    var xpY = 76;
    var xpW = W - 32;
    ctx.fillStyle = 'rgba(56,80,44,0.16)';
    rr(16, xpY, xpW, 5, 2.5);
    ctx.fill();
    var ratio = clamp(state.xp / state.xpNext, 0, 1);
    if (ratio > 0) {
        var lg = ctx.createLinearGradient(16, 0, 16 + xpW, 0);
        lg.addColorStop(0, '#FFB03A');
        lg.addColorStop(1, '#FFE45C');
        ctx.fillStyle = lg;
        rr(16, xpY, Math.max(4, xpW * ratio), 5, 2.5);
        ctx.fill();
    }

    // 血条：底槽 + 填充 + 高光，数字放在右侧同一中线
    var hpW = Math.min(184, W * 0.47);
    var hpY = 89;
    var hpH = 11;
    var hpRatio = clamp(p.hp / p.maxHp, 0, 1);
    ctx.fillStyle = 'rgba(40,58,32,0.26)';
    rr(16 - 2, hpY - 2, hpW + 4, hpH + 4, (hpH + 4) / 2);
    ctx.fill();
    ctx.fillStyle = hpRatio > 0.4 ? '#FF5D73' : (Math.sin(state.time * 14) > 0 ? '#FF3355' : '#FF7A8C');
    rr(16, hpY, Math.max(hpH, hpW * hpRatio), hpH, hpH / 2);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.42)';
    rr(16, hpY, Math.max(hpH, hpW * hpRatio), 4, 2);
    ctx.fill();
    // 低血时条尾闪一下，余光里也能察觉
    if (hpRatio <= 0.28) {
        ctx.globalAlpha = 0.25 + 0.25 * Math.sin(state.time * 9);
        ctx.fillStyle = '#FFFFFF';
        rr(16, hpY, Math.max(hpH, hpW * hpRatio), hpH, hpH / 2);
        ctx.fill();
        ctx.globalAlpha = 1;
    }

    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.font = '800 10px system-ui, sans-serif';
    var hpTxt = Math.ceil(p.hp) + ' / ' + Math.round(p.maxHp);
    ctx.lineWidth = 2.6;
    ctx.strokeStyle = 'rgba(255,255,255,0.8)';
    ctx.strokeText(hpTxt, 16 + hpW + 9, hpY + hpH / 2 + 0.5);
    ctx.fillStyle = 'rgba(30,48,22,0.92)';
    ctx.fillText(hpTxt, 16 + hpW + 9, hpY + hpH / 2 + 0.5);
    ctx.textBaseline = 'top';

    // BOSS 血条
    if (state.bossRef && !state.bossRef.dead) {
        var b = state.bossRef;
        var bw = W - 60;
        var by = Math.max(118, H * 0.145);
        ctx.fillStyle = 'rgba(0,0,0,0.55)';
        rr(30, by, bw, 12, 6);
        ctx.fill();
        var br = clamp(b.hp / b.maxHp, 0, 1);
        var bg2 = ctx.createLinearGradient(30, 0, 30 + bw, 0);
        bg2.addColorStop(0, '#FF3355');
        bg2.addColorStop(1, '#FF6B8A');
        ctx.fillStyle = bg2;
        rr(30, by, Math.max(5, bw * br), 12, 6);
        ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.25)';
        rr(30, by, Math.max(4, bw * br), 4, 2);
        ctx.fill();

        ctx.textAlign = 'center';
        ctx.font = '700 11px system-ui, sans-serif';
        ctx.fillStyle = '#FFFFFF';
        ctx.fillText(b.name + '　第 ' + b.phaseNo + ' 阶段', W / 2, by + 26);
    }

    drawSkillBar();

    // 连斩：屏幕上不来打扰，压在下方
    if (state.combo >= 3) {
        var ca2 = clamp(state.comboT / 2.2, 0, 1);
        var ccx = W / 2;
        var ccy = H * 0.74;
        var csz = Math.min(34, W * 0.085) * (1 + (1 - ca2) * 0.1);
        ctx.save();
        ctx.globalAlpha = 0.32 + ca2 * 0.62;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.font = '800 ' + Math.round(csz) + 'px system-ui, -apple-system, sans-serif';
        ctx.fillStyle = 'rgba(255,255,255,0.72)';
        ctx.fillText(String(state.combo), ccx, ccy + 1.5);
        ctx.fillStyle = '#B8860B';
        ctx.fillText(String(state.combo), ccx, ccy);
        ctx.font = '700 11px system-ui, sans-serif';
        ctx.fillStyle = 'rgba(40,58,32,0.62)';
        ctx.fillText('连斩', ccx, ccy + csz * 0.78);
        ctx.restore();
    }
}

function drawSkillBar() {
    var owned = [];
    for (var i = 0; i < WEAPON_IDS.length; i += 1) {
        if (upLv(WEAPON_IDS[i]) > 0) { owned.push(WEAPON_IDS[i]); }
    }
    if (!owned.length) { return; }

    var gap = 6;
    var maxTotal = W - 40;
    var size = Math.min(36, (maxTotal - gap * (owned.length - 1)) / owned.length);
    var total = owned.length * size + (owned.length - 1) * gap;
    var sx = W / 2 - total / 2;
    var sy = H - size - 18;

    for (var k = 0; k < owned.length; k += 1) {
        var id = owned[k];
        var x = sx + k * (size + gap);
        var col = WEAPONS[id].color;

        ctx.fillStyle = 'rgba(0,0,0,0.42)';
        rr(x, sy, size, size, size * 0.28);
        ctx.fill();
        ctx.strokeStyle = col;
        ctx.globalAlpha = 0.55;
        ctx.lineWidth = 1.4;
        rr(x + 0.5, sy + 0.5, size - 1, size - 1, size * 0.28);
        ctx.stroke();
        ctx.globalAlpha = 1;

        ctx.save();
        ctx.translate(x + size / 2, sy + size / 2);
        drawWeaponIcon(id, size * 0.32);
        ctx.restore();

        // 等级点
        var lv = upLv(id);
        for (var d = 0; d < Math.min(lv, 5); d += 1) {
            ctx.fillStyle = col;
            ctx.globalAlpha = 0.9;
            ctx.fillRect(x + 3 + d * 4, sy + size - 5, 3, 2.5);
        }
        ctx.globalAlpha = 1;
    }
}

/* ============================================================ 装备小图标
   每件装备都要有个"样子"，而且要看得出是"哪个名字"，不只是"哪一类"。
   分三层画：底牌（品质）+ 器形（gearShape）+ 纹样（gearMotif）。
   品质越高外框越花：普通素底，精良双环，稀有角饰+扫光，史诗旋弧，传说放射脉冲。 */
function drawGearIcon(it, x, y, r, t) {
    if (!it) { return; }
    var rar = gearRarity(it);
    var ord = rar.order;
    var shape = gearShape(it);
    var motif = gearMotif(it);
    var fx = (it.fx && it.fx !== 'none') ? GEAR_FX[it.fx] : null;
    var tt = t || 0;
    var ink = deepen(rar.color, 0.62);

    ctx.save();

    /* ---- 1. 外层气场：品质越高越亮，还带呼吸 ---- */
    if (ord >= 2) {
        var breath = 0.5 + 0.5 * Math.sin(tt * 2.2 + x * 0.05);
        glowDot(x, y, r * (1.18 + ord * 0.07 + breath * 0.10), rar.color,
            0.07 + 0.045 * (ord - 2) + breath * 0.03);
    }

    /* ---- 2. 底牌：斜向渐变 + 顶部高光 + 底边暗角，做出厚度 ---- */
    var gg = ctx.createLinearGradient(x - r, y - r, x + r * 0.6, y + r);
    gg.addColorStop(0, withA(rar.color, 0.42));
    gg.addColorStop(0.55, withA(rar.color, 0.20));
    gg.addColorStop(1, withA(rar.color, 0.08));
    ctx.fillStyle = gg;
    rr(x - r, y - r, r * 2, r * 2, r * 0.34);
    ctx.fill();

    // 上半层那圈更亮的薄膜，制造球面感
    var sh = ctx.createLinearGradient(x, y - r, x, y + r * 0.2);
    sh.addColorStop(0, 'rgba(255,255,255,0.42)');
    sh.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.save();
    rr(x - r, y - r, r * 2, r * 2, r * 0.34);
    ctx.clip();
    ctx.fillStyle = sh;
    ctx.fillRect(x - r, y - r, r * 2, r * 2);
    ctx.restore();

    /* ---- 3. 框：品质越高越重 ---- */
    ctx.strokeStyle = withA(rar.color, ord >= 4 ? 0.98 : 0.72);
    ctx.lineWidth = ord >= 4 ? 2.1 : 1.3;
    rr(x - r + 0.5, y - r + 0.5, r * 2 - 1, r * 2 - 1, r * 0.34);
    ctx.stroke();

    // 精良起加一道内环
    if (ord >= 1) {
        ctx.strokeStyle = withA(rar.color, 0.36);
        ctx.lineWidth = 0.9;
        rr(x - r + r * 0.17, y - r + r * 0.17, r * 1.66, r * 1.66, r * 0.24);
        ctx.stroke();
    }

    // 稀有起四角小刻线
    if (ord >= 2) {
        ctx.strokeStyle = withA(rar.color, 0.85);
        ctx.lineWidth = 1.3;
        for (var cn = 0; cn < 4; cn += 1) {
            var cx2 = x + (cn === 0 || cn === 3 ? -1 : 1) * r * 0.74;
            var cy2 = y + (cn < 2 ? -1 : 1) * r * 0.74;
            var dx = (cn === 0 || cn === 3 ? 1 : -1) * r * 0.22;
            var dy = (cn < 2 ? 1 : -1) * r * 0.22;
            ctx.beginPath();
            ctx.moveTo(cx2, cy2); ctx.lineTo(cx2 + dx, cy2 + dy);
            ctx.stroke();
        }
    }

    // 史诗 / 传说：外圈转着的双弧
    if (ord >= 4) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(tt * (ord >= 5 ? 1.15 : 0.7));
        ctx.strokeStyle = withA(rar.color, 0.8);
        ctx.lineWidth = Math.max(1.3, r * 0.095);
        ctx.beginPath(); ctx.arc(0, 0, r * 0.94, -0.55, 0.55); ctx.stroke();
        ctx.beginPath(); ctx.arc(0, 0, r * 0.94, Math.PI - 0.55, Math.PI + 0.55); ctx.stroke();
        ctx.restore();
    }

    // 传说：反向转的放射短芒 + 一圈脉冲
    if (ord >= 5) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(-tt * 0.75);
        ctx.strokeStyle = 'rgba(255,255,255,0.75)';
        ctx.lineWidth = 1;
        for (var sp = 0; sp < 6; sp += 1) {
            var a2 = sp * TAU / 6 + 0.35;
            var r1 = r * 1.02;
            var r2 = r * (1.16 + 0.10 * Math.sin(tt * 4 + sp));
            ctx.beginPath();
            ctx.moveTo(Math.cos(a2) * r1, Math.sin(a2) * r1);
            ctx.lineTo(Math.cos(a2) * r2, Math.sin(a2) * r2);
            ctx.stroke();
        }
        ctx.restore();

        ctx.strokeStyle = 'rgba(255,255,255,' + (0.30 + 0.22 * Math.sin(tt * 3)) + ')';
        ctx.lineWidth = 1.1;
        ctx.beginPath();
        ctx.arc(x, y, r * (1.0 + 0.05 * Math.sin(tt * 3)), 0, TAU);
        ctx.stroke();
    }

    /* ---- 4. 器形本體 ---- */
    drawGearShape(shape, x, y, r * 0.70, rar.color, tt);

    /* ---- 5. 纹样：叠在器形上，用器形的深色去画，看得出细节又不抢主形 ---- */
    if (motif) { drawGearMotif(motif, x, y, r * 0.70, ink, rar.color, tt); }

    /* ---- 6. 斜向扫光：稀有以上，隔一会儿从左上扫到右下 ---- */
    if (ord >= 2) {
        var sw = ((tt * 0.55) % 1.0) * 2.6 - 0.8;          // 循环的进度
        if (sw > -0.3 && sw < 1.3) {
            ctx.save();
            rr(x - r, y - r, r * 2, r * 2, r * 0.34);
            ctx.clip();
            var gx0 = x - r + r * 2 * sw;
            var sg = ctx.createLinearGradient(gx0 - r * 0.5, y - r, gx0 + r * 0.5, y + r);
            sg.addColorStop(0, 'rgba(255,255,255,0)');
            sg.addColorStop(0.5, 'rgba(255,255,255,' + (ord >= 4 ? 0.34 : 0.22) + ')');
            sg.addColorStop(1, 'rgba(255,255,255,0)');
            ctx.fillStyle = sg;
            ctx.fillRect(x - r, y - r, r * 2, r * 2);
            ctx.restore();
        }
    }

    /* ---- 7. 元素珠：带攻击特效的在右上角点一颗对应色的小珠，也带呼吸 ---- */
    if (fx) {
        var fb = 0.5 + 0.5 * Math.sin(tt * 4.2);
        glowDot(x + r * 0.66, y - r * 0.66, r * (0.28 + fb * 0.06), fx.color, 0.8);
        ctx.fillStyle = fx.color;
        ctx.beginPath();
        ctx.arc(x + r * 0.66, y - r * 0.66, r * 0.135, 0, TAU);
        ctx.fill();
    }

    // 稀有以上在左下角补一颗小星
    if (ord >= 3) { starDot(x - r * 0.62, y + r * 0.62, r * 0.19, 'rgba(255,255,255,0.92)', 0.9); }

    ctx.restore();
}

/* 纹样层：每个名字各有一两笔特征，尺寸跟着图标走。
   s 是半个器形尺寸，ink 是器形用的深色，col 是品质色。 */
function drawGearMotif(m, x, y, s, ink, col, t) {
    if (!m) { return; }
    ctx.save();
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    var W = Math.max(1.1, s * 0.11);

    if (m === 'carrot') {                                  // 木柄萝卜叉：叉尖上一根萝卜
        ctx.fillStyle = '#E8792A';
        ctx.beginPath();
        ctx.moveTo(x + s * 0.72, y - s * 1.15);
        ctx.quadraticCurveTo(x + s * 1.12, y - s * 0.72, x + s * 0.60, y - s * 0.34);
        ctx.quadraticCurveTo(x + s * 0.34, y - s * 0.78, x + s * 0.72, y - s * 1.15);
        ctx.closePath(); ctx.fill();
        ctx.strokeStyle = '#3E8E32'; ctx.lineWidth = W * 0.9;
        ctx.beginPath();
        ctx.moveTo(x + s * 0.78, y - s * 1.12); ctx.lineTo(x + s * 0.96, y - s * 1.44);
        ctx.stroke();

    } else if (m === 'gale') {                             // 风：右侧两道细风线
        ctx.strokeStyle = ink; ctx.lineWidth = W * 0.85;
        ctx.globalAlpha = 0.55;
        for (var gi = 0; gi < 2; gi += 1) {
            var gy2 = y - s * 0.28 + gi * s * 0.62;
            ctx.beginPath();
            ctx.moveTo(x + s * 0.24, gy2);
            ctx.quadraticCurveTo(x + s * 0.86, gy2 - s * 0.18,
                x + s * 0.94, gy2 + s * 0.06);
            ctx.stroke();
        }

    } else if (m === 'thorn') {                            // 荆棘：沿边缘一圈尖刺
        ctx.fillStyle = ink; ctx.globalAlpha = 0.8;
        for (var ti = 0; ti < 8; ti += 1) {
            var ta2 = ti * TAU / 8 + 0.2;
            var bx = x + Math.cos(ta2) * s * 0.86, by = y + Math.sin(ta2) * s * 0.86;
            ctx.beginPath();
            ctx.moveTo(bx, by);
            ctx.lineTo(bx + Math.cos(ta2 + 0.5) * s * 0.3, by + Math.sin(ta2 + 0.5) * s * 0.3);
            ctx.lineTo(bx + Math.cos(ta2 - 0.1) * s * 0.26, by + Math.sin(ta2 - 0.1) * s * 0.26);
            ctx.closePath(); ctx.fill();
        }

    } else if (m === 'shock') {                            // 电：一道折线
        ctx.strokeStyle = col; ctx.lineWidth = W * 1.25;
        ctx.globalAlpha = 0.95;
        ctx.beginPath();
        ctx.moveTo(x + s * 0.34, y - s * 0.92);
        ctx.lineTo(x - s * 0.18, y - s * 0.1);
        ctx.lineTo(x + s * 0.20, y + s * 0.06);
        ctx.lineTo(x - s * 0.34, y + s * 0.92);
        ctx.stroke();

    } else if (m === 'frost') {                            // 霜：六角雪纹
        ctx.strokeStyle = '#9FE4F5'; ctx.lineWidth = W;
        ctx.globalAlpha = 0.9;
        for (var fi = 0; fi < 3; fi += 1) {
            var fa = fi * Math.PI / 3;
            ctx.beginPath();
            ctx.moveTo(x - Math.cos(fa) * s * 0.62, y - Math.sin(fa) * s * 0.62);
            ctx.lineTo(x + Math.cos(fa) * s * 0.62, y + Math.sin(fa) * s * 0.62);
            ctx.stroke();
        }

    } else if (m === 'ember') {                            // 火：三簇小火苗
        for (var ei = 0; ei < 3; ei += 1) {
            var ex = x + (ei - 1) * s * 0.46;
            var ey = y - s * 0.42 + Math.abs(ei - 1) * s * 0.12;
            var eh = s * (0.46 - Math.abs(ei - 1) * 0.09) + 1.1 * Math.sin(t * 6 + ei);
            ctx.fillStyle = ei === 1 ? '#FFD05A' : '#FF8A32';
            ctx.globalAlpha = 0.92;
            ctx.beginPath();
            ctx.moveTo(ex, ey - eh);
            ctx.quadraticCurveTo(ex + s * 0.17, ey - eh * 0.3, ex, ey);
            ctx.quadraticCurveTo(ex - s * 0.17, ey - eh * 0.3, ex, ey - eh);
            ctx.closePath(); ctx.fill();
        }

    } else if (m === 'venom') {                            // 毒：两滴垂液
        ctx.fillStyle = '#8CD23A';
        ctx.globalAlpha = 0.95;
        for (var vi = 0; vi < 2; vi += 1) {
            var vx = x + (vi ? s * 0.4 : -s * 0.34);
            var vy = y + s * (vi ? 0.72 : 0.5);
            var vr = s * 0.15;
            ctx.beginPath();
            ctx.moveTo(vx, vy - vr * 2.1);
            ctx.quadraticCurveTo(vx + vr, vy - vr * 0.3, vx, vy);
            ctx.quadraticCurveTo(vx - vr, vy - vr * 0.3, vx, vy - vr * 2.1);
            ctx.closePath(); ctx.fill();
        }

    } else if (m === 'stone') {                            // 岩：几道裂痕
        ctx.strokeStyle = ink; ctx.lineWidth = W; ctx.globalAlpha = 0.85;
        ctx.beginPath();
        ctx.moveTo(x - s * 0.6, y - s * 0.4); ctx.lineTo(x - s * 0.05, y - s * 0.05);
        ctx.lineTo(x - s * 0.3, y + s * 0.5);
        ctx.moveTo(x - s * 0.05, y - s * 0.05); ctx.lineTo(x + s * 0.55, y + s * 0.2);
        ctx.stroke();

    } else if (m === 'void') {                             // 虚空：向内旋的螺线
        ctx.strokeStyle = ink; ctx.lineWidth = W; ctx.globalAlpha = 0.9;
        ctx.beginPath();
        for (var qi = 0; qi < 22; qi += 1) {
            var qa = qi * 0.52 + t * 0.8;
            var qr = s * 0.92 * (1 - qi / 24);
            var qx = x + Math.cos(qa) * qr, qy = y + Math.sin(qa) * qr;
            if (qi === 0) { ctx.moveTo(qx, qy); } else { ctx.lineTo(qx, qy); }
        }
        ctx.stroke();

    } else if (m === 'star') {                             // 星屑：几颗散落小星
        for (var si = 0; si < 3; si += 1) {
            var sa = si * 2.1 + 0.6;
            var sx2 = x + Math.cos(sa) * s * 0.62, sy2 = y + Math.sin(sa) * s * 0.62;
            starDot(sx2, sy2, s * (0.16 + 0.05 * Math.sin(t * 4 + si)), '#FFE9A8', 0.95);
        }

    } else if (m === 'bloom') {                            // 花：五瓣小花的轮廓
        ctx.strokeStyle = ink; ctx.lineWidth = W; ctx.globalAlpha = 0.8;
        for (var bi = 0; bi < 5; bi += 1) {
            var ba = bi * TAU / 5;
            ctx.beginPath();
            ctx.ellipse(x + Math.cos(ba) * s * 0.34, y + Math.sin(ba) * s * 0.34,
                s * 0.26, s * 0.16, ba, 0, TAU);
            ctx.stroke();
        }

    } else if (m === 'tide') {                             // 潮：三道水波
        ctx.strokeStyle = '#7FD3EA'; ctx.lineWidth = W; ctx.globalAlpha = 0.9;
        for (var wi = 0; wi < 3; wi += 1) {
            ctx.beginPath();
            ctx.moveTo(x - s * 0.68, y + s * (wi - 1) * 0.42);
            ctx.quadraticCurveTo(x - s * 0.22, y + s * (wi - 1) * 0.42 - s * 0.2,
                x, y + s * (wi - 1) * 0.42);
            ctx.quadraticCurveTo(x + s * 0.22, y + s * (wi - 1) * 0.42 + s * 0.2,
                x + s * 0.68, y + s * (wi - 1) * 0.42);
            ctx.stroke();
        }

    } else if (m === 'patch') {                            // 补丁：两块错位方片 + 针脚
        ctx.strokeStyle = ink; ctx.lineWidth = W * 0.85; ctx.globalAlpha = 0.8;
        rr(x - s * 0.62, y - s * 0.5, s * 0.62, s * 0.55, s * 0.1); ctx.stroke();
        rr(x + s * 0.04, y + s * 0.02, s * 0.58, s * 0.5, s * 0.1); ctx.stroke();

    } else if (m === 'shell') {                            // 贝甲：放射状的甲片缝
        ctx.strokeStyle = ink; ctx.lineWidth = W * 0.8; ctx.globalAlpha = 0.7;
        for (var hi2 = 0; hi2 < 5; hi2 += 1) {
            var ha = Math.PI * (0.15 + hi2 * 0.175);
            ctx.beginPath();
            ctx.moveTo(x - Math.cos(ha) * s * 0.72, y + s * 0.5);
            ctx.lineTo(x - Math.cos(ha) * s * 0.2, y - s * 0.6);
            ctx.stroke();
        }

    } else if (m === 'bark') {                             // 树皮：几道纵向沟
        ctx.strokeStyle = ink; ctx.lineWidth = W * 0.9; ctx.globalAlpha = 0.55;
        ctx.beginPath();
        ctx.moveTo(x - s * 0.34, y - s * 0.7); ctx.lineTo(x - s * 0.28, y + s * 0.66);
        ctx.moveTo(x + s * 0.14, y - s * 0.75); ctx.lineTo(x + s * 0.08, y + s * 0.6);
        ctx.stroke();

    } else if (m === 'chime') {                            // 铃：一颗铃舌 + 两道声纹
        ctx.fillStyle = ink;
        ctx.beginPath(); ctx.arc(x, y + s * 0.52, s * 0.13, 0, TAU); ctx.fill();
        ctx.strokeStyle = ink; ctx.lineWidth = W * 0.8; ctx.globalAlpha = 0.6;
        for (var ci2 = 0; ci2 < 2; ci2 += 1) {
            ctx.beginPath();
            ctx.arc(x, y, s * (0.78 + ci2 * 0.18), -0.5, 0.5);
            ctx.stroke();
        }

    } else if (m === 'dew') {                              // 露：坠下的一滴水珠
        ctx.fillStyle = 'rgba(255,255,255,0.92)';
        ctx.beginPath();
        ctx.moveTo(x + s * 0.46, y + s * 0.34);
        ctx.quadraticCurveTo(x + s * 0.56, y + s * 0.5, x + s * 0.46, y + s * 0.56);
        ctx.quadraticCurveTo(x + s * 0.36, y + s * 0.5, x + s * 0.46, y + s * 0.34);
        ctx.closePath(); ctx.fill();

    } else if (m === 'moon') {                             // 月：缺口里一点月华
        ctx.strokeStyle = 'rgba(255,255,255,0.85)'; ctx.lineWidth = W * 0.8;
        ctx.beginPath(); ctx.arc(x - s * 0.16, y + s * 0.12, s * 0.3, 0.3, Math.PI * 1.5); ctx.stroke();

    } else if (m === 'heart') {                            // 心：一道心跳折线
        ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineWidth = W * 0.9;
        ctx.beginPath();
        ctx.moveTo(x - s * 0.62, y + s * 0.1);
        ctx.lineTo(x - s * 0.24, y + s * 0.1);
        ctx.lineTo(x - s * 0.08, y - s * 0.3);
        ctx.lineTo(x + s * 0.1, y + s * 0.42);
        ctx.lineTo(x + s * 0.26, y + s * 0.1);
        ctx.lineTo(x + s * 0.62, y + s * 0.1);
        ctx.stroke();

    } else if (m === 'fang') {                             // 牙：护符上那颗兽牙的尖
        ctx.fillStyle = 'rgba(255,255,255,0.9)';
        ctx.beginPath();
        ctx.moveTo(x - s * 0.12, y - s * 0.12);
        ctx.lineTo(x + s * 0.16, y - s * 0.12);
        ctx.lineTo(x + s * 0.02, y + s * 0.42);
        ctx.closePath(); ctx.fill();
    }
    ctx.restore();
}

/* 一颗四角星，给高品质装备当点缀 */
function starDot(x, y, r, color, alpha) {
    ctx.save();
    ctx.globalAlpha = alpha === undefined ? 1 : alpha;
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(x, y - r);
    ctx.lineTo(x + r * 0.34, y - r * 0.34);
    ctx.lineTo(x + r, y);
    ctx.lineTo(x + r * 0.34, y + r * 0.34);
    ctx.lineTo(x, y + r);
    ctx.lineTo(x - r * 0.34, y + r * 0.34);
    ctx.lineTo(x - r, y);
    ctx.lineTo(x - r * 0.34, y - r * 0.34);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
}

/* 具体的器形。以 (x, y) 为中心，s 是半尺寸 */
function drawGearShape(shape, x, y, s, color, t) {
    var ink = deepen(color, 0.62);
    var hi = 'rgba(255,255,255,0.78)';
    ctx.save();
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.strokeStyle = ink;
    ctx.fillStyle = ink;

    if (shape === 'blade') {
        ctx.beginPath();                                  // 剑身
        ctx.moveTo(x, y - s); ctx.lineTo(x + s * 0.30, y - s * 0.30);
        ctx.lineTo(x + s * 0.22, y + s * 0.42); ctx.lineTo(x - s * 0.22, y + s * 0.42);
        ctx.lineTo(x - s * 0.30, y - s * 0.30); ctx.closePath(); ctx.fill();
        ctx.strokeStyle = hi; ctx.lineWidth = 1;          // 刃口高光
        ctx.beginPath(); ctx.moveTo(x, y - s * 0.9); ctx.lineTo(x, y + s * 0.3); ctx.stroke();
        ctx.strokeStyle = ink; ctx.lineWidth = Math.max(1.6, s * 0.16);
        ctx.beginPath();                                  // 护手 + 柄
        ctx.moveTo(x - s * 0.55, y + s * 0.46); ctx.lineTo(x + s * 0.55, y + s * 0.46);
        ctx.moveTo(x, y + s * 0.46); ctx.lineTo(x, y + s * 0.95); ctx.stroke();

    } else if (shape === 'dagger') {
        ctx.beginPath();
        ctx.moveTo(x, y - s * 0.95); ctx.lineTo(x + s * 0.26, y - s * 0.1);
        ctx.lineTo(x, y + s * 0.18); ctx.lineTo(x - s * 0.26, y - s * 0.1); ctx.closePath(); ctx.fill();
        ctx.strokeStyle = ink; ctx.lineWidth = Math.max(1.5, s * 0.16);
        ctx.beginPath();
        ctx.moveTo(x - s * 0.4, y + s * 0.22); ctx.lineTo(x + s * 0.4, y + s * 0.22);
        ctx.moveTo(x, y + s * 0.22); ctx.lineTo(x, y + s * 0.95); ctx.stroke();

    } else if (shape === 'spear') {

        ctx.stroke();

    } else if (shape === 'seal') {
        // 印：方印台 + 顶上的钮
        ctx.beginPath(); rr(x - s * 0.9, y - s * 0.15, s * 1.8, s * 1.0, s * 0.18); ctx.fill();
        ctx.strokeStyle = ink; ctx.lineWidth = Math.max(1.6, s * 0.17);
        ctx.beginPath();
        ctx.moveTo(x - s * 0.28, y - s * 0.15); ctx.lineTo(x - s * 0.28, y - s * 0.62);
        ctx.arc(x, y - s * 0.62, s * 0.28, Math.PI, 0);
        ctx.lineTo(x + s * 0.28, y - s * 0.15); ctx.stroke();
        ctx.strokeStyle = hi; ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(x - s * 0.55, y + s * 0.32); ctx.lineTo(x + s * 0.55, y + s * 0.32);
        ctx.stroke();

    } else if (shape === 'coilring') {
        // 环：两道同心环，中间空
        ctx.lineWidth = Math.max(2.2, s * 0.24);
        ctx.beginPath(); ctx.arc(x, y, s * 0.78, 0, TAU); ctx.stroke();
        ctx.lineWidth = Math.max(1.2, s * 0.11);
        ctx.beginPath(); ctx.arc(x, y, s * 0.4, 0, TAU); ctx.stroke();

    } else if (shape === 'fangcharm') {
        // 兽牙护符：绳 + 一颗弯牙
        ctx.strokeStyle = ink; ctx.lineWidth = Math.max(1.3, s * 0.13);
        ctx.beginPath();
        ctx.moveTo(x - s * 0.76, y - s * 0.92);
        ctx.quadraticCurveTo(x, y - s * 0.28, x + s * 0.76, y - s * 0.92);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(x - s * 0.3, y - s * 0.2);
        ctx.quadraticCurveTo(x - s * 0.36, y + s * 0.78, x + s * 0.34, y + s * 0.95);
        ctx.quadraticCurveTo(x - s * 0.02, y + s * 0.5, x + s * 0.12, y - s * 0.2);
        ctx.closePath(); ctx.fill();

    } else {
        ctx.beginPath(); ctx.arc(x, y, s * 0.6, 0, TAU); ctx.fill();
        ctx.strokeStyle = hi; ctx.lineWidth = 1.2; ctx.stroke();
    }
    ctx.restore();
}

function drawWeaponIcon(id, r) {
    if (id === 'dart') {
        ctx.fillStyle = '#FFC35C';
        ctx.beginPath();
        ctx.moveTo(r * 0.9, 0);
        ctx.lineTo(-r * 0.5, -r * 0.55);
        ctx.lineTo(-r * 0.2, 0);
        ctx.lineTo(-r * 0.5, r * 0.55);
        ctx.closePath();
        ctx.fill();
    } else if (id === 'orb') {
        ctx.strokeStyle = '#9AD7FF';
        ctx.lineWidth = 1.4;
        ctx.beginPath();
        ctx.ellipse(0, 0, r * 0.95, r * 0.5, 0.6, 0, TAU);
        ctx.stroke();
        ctx.fillStyle = '#E8F8FF';
        fillEllipse(0, 0, r * 0.34, r * 0.34);
    } else if (id === 'nova') {
        ctx.strokeStyle = '#FFB84D';
        ctx.lineWidth = 1.6;
        ctx.beginPath(); ctx.arc(0, 0, r * 0.32, 0, TAU); ctx.stroke();
        ctx.beginPath(); ctx.arc(0, 0, r * 0.68, 0, TAU); ctx.stroke();
        ctx.beginPath(); ctx.arc(0, 0, r * 0.98, 0, TAU); ctx.stroke();
    } else if (id === 'bolt') {
        ctx.fillStyle = '#8FD6FF';
        ctx.beginPath();
        ctx.moveTo(r * 0.2, -r * 0.9);
        ctx.lineTo(-r * 0.4, r * 0.05);
        ctx.lineTo(r * 0.02, r * 0.05);
        ctx.lineTo(-r * 0.15, r * 0.9);
        ctx.lineTo(r * 0.5, -r * 0.1);
        ctx.lineTo(r * 0.06, -r * 0.1);
        ctx.closePath();
        ctx.fill();
    } else if (id === 'blade') {
        ctx.strokeStyle = '#7CFFB2';
        ctx.lineWidth = 2.2;
        ctx.beginPath(); ctx.arc(0, 0, r * 0.8, 0.3, 2.6); ctx.stroke();
        ctx.beginPath(); ctx.arc(0, 0, r * 0.8, 3.4, 5.7); ctx.stroke();
    } else if (id === 'lance') {
        ctx.strokeStyle = '#FF7BD5';
        ctx.lineWidth = 2.4;
        ctx.beginPath();
        ctx.moveTo(-r * 0.95, 0);
        ctx.lineTo(r * 0.95, 0);
        ctx.stroke();
        ctx.fillStyle = '#FFD6F0';
        fillEllipse(r * 0.8, 0, r * 0.2, r * 0.2);
    } else if (id === 'mine') {
        ctx.fillStyle = '#FF8A5C';
        fillEllipse(0, r * 0.15, r * 0.62, r * 0.62);
        ctx.strokeStyle = '#FFB08C';
        ctx.lineWidth = 1.6;
        ctx.beginPath();
        ctx.arc(0, r * 0.15, r * 0.92, 0.2, Math.PI - 0.2);
        ctx.stroke();
    } else if (id === 'halo') {
        ctx.strokeStyle = '#6BE0FF';
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(0, 0, r * 0.85, 0, TAU); ctx.stroke();
        ctx.globalAlpha = 0.3;
        ctx.fillStyle = '#6BE0FF';
        ctx.beginPath(); ctx.arc(0, 0, r * 0.85, 0, TAU); ctx.fill();
        ctx.globalAlpha = 1;
    } else if (id === 'chain') {
        ctx.strokeStyle = '#8FD6FF';
        ctx.lineWidth = 2.2;
        ctx.beginPath();
        ctx.moveTo(-r * 0.8, -r * 0.6);
        ctx.lineTo(-r * 0.1, -r * 0.05);
        ctx.lineTo(-r * 0.45, r * 0.1);
        ctx.lineTo(r * 0.75, r * 0.62);
        ctx.stroke();
        ctx.fillStyle = '#DFF6FF';
        fillEllipse(-r * 0.8, -r * 0.6, r * 0.18, r * 0.18);
        fillEllipse(r * 0.75, r * 0.62, r * 0.18, r * 0.18);
    } else if (id === 'shock') {
        ctx.strokeStyle = '#FFC35C';
        ctx.lineWidth = 1.8;
        ctx.beginPath(); ctx.arc(0, 0, r * 0.34, 0, TAU); ctx.stroke();
        ctx.globalAlpha = 0.6;
        ctx.beginPath(); ctx.arc(0, 0, r * 0.72, 0, TAU); ctx.stroke();
        ctx.globalAlpha = 1;
        ctx.lineWidth = 1.6;
        for (var q = 0; q < 4; q += 1) {
            var qa = q * TAU / 4 + 0.7;
            ctx.beginPath();
            ctx.moveTo(Math.cos(qa) * r * 0.82, Math.sin(qa) * r * 0.82);
            ctx.lineTo(Math.cos(qa) * r * 1.05, Math.sin(qa) * r * 1.05);
            ctx.stroke();
        }
    } else if (id === 'hole') {
        ctx.globalAlpha = 0.35;
        ctx.fillStyle = '#C08CFF';
        fillEllipse(0, 0, r * 1.0, r * 1.0);
        ctx.globalAlpha = 1;
        ctx.fillStyle = '#0B0418';
        fillEllipse(0, 0, r * 0.46, r * 0.46);
        ctx.strokeStyle = '#C08CFF';
        ctx.lineWidth = 1.8;
        ctx.beginPath();
        ctx.ellipse(0, 0, r * 0.86, r * 0.5, 0.6, 0, TAU);
        ctx.stroke();
    } else if (id === 'drone') {
        ctx.fillStyle = '#7CFFB2';
        ctx.beginPath();
        ctx.moveTo(0, -r * 0.8);
        ctx.lineTo(r * 0.62, r * 0.5);
        ctx.lineTo(0, r * 0.22);
        ctx.lineTo(-r * 0.62, r * 0.5);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = '#FFFFFF';
        fillEllipse(0, -r * 0.2, r * 0.18, r * 0.18);
    } else {
        ctx.strokeStyle = '#8A8F98';
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(0, 0, r * 0.7, 0, TAU); ctx.stroke();
    }
}

function drawJoystick() {
    if (!input.joyActive) { return; }

/* ------------------------------------------------------------ 按钮 */
function neonBtn(rect, label, color, sub, t) {
    if (!rect) { return; }
    var pulse = 0.85 + 0.15 * Math.sin((t || 0) * 3);
    ctx.fillStyle = 'rgba(255,255,255,0.78)';
    rr(rect.x, rect.y, rect.w, rect.h, rect.h * 0.32);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    rr(rect.x + 2, rect.y + 2, rect.w - 4, rect.h * 0.44, rect.h * 0.28);
    ctx.fill();
    ctx.strokeStyle = color;
    ctx.globalAlpha = 0.7 * pulse;
    ctx.lineWidth = 1.8;
    rr(rect.x + 0.5, rect.y + 0.5, rect.w - 1, rect.h - 1, rect.h * 0.32);
    ctx.stroke();
    ctx.globalAlpha = 1;

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#25341F';
    ctx.font = '700 ' + Math.round(Math.min(17, rect.h * 0.38)) + 'px system-ui, sans-serif';
    ctx.fillText(label, rect.x + rect.w / 2, rect.y + rect.h / 2 + (sub ? -5 : 0));
    if (sub) {
        ctx.font = '600 ' + Math.round(Math.min(9, rect.h * 0.22)) + 'px system-ui, sans-serif';
        ctx.fillStyle = color;
        ctx.globalAlpha = 0.8;
        ctx.fillText(sub, rect.x + rect.w / 2, rect.y + rect.h / 2 + 11);
        ctx.globalAlpha = 1;
    }
}

function card(x, y, w, h, highlight) {
    ctx.fillStyle = 'rgba(255,255,255,0.62)';
    rr(x, y, w, h, 14);
    ctx.fill();
    ctx.strokeStyle = highlight || 'rgba(56,80,44,0.22)';
    ctx.lineWidth = 1.4;
    rr(x + 0.5, y + 0.5, w - 1, h - 1, 14);

}

var CLOUDS = [
    { x: 0.16, y: 0.09, s: 1.00, sp: 7.0 },
    { x: 0.70, y: 0.15, s: 0.76, sp: 10.5 },
    { x: 0.44, y: 0.28, s: 1.22, sp: 5.2 },
    { x: 0.94, y: 0.05, s: 0.58, sp: 13.0 },
    { x: 0.03, y: 0.36, s: 0.62, sp: 8.4 }
];

/* 界面背景：飘动的云 + 远树线（取代星空） */
function drawStarsBg(t) {
    var i, c, cx, cy, s;

    // 云
    for (i = 0; i < CLOUDS.length; i += 1) {
        c = CLOUDS[i];
        s = c.s * Math.min(W, H) * 0.16;
        cx = ((c.x * W + t * c.sp) % (W + s * 4)) - s * 2;
        cy = c.y * H;
        ctx.fillStyle = 'rgba(255,255,255,0.62)';
        ctx.beginPath();
        ctx.arc(cx - s * 0.8, cy + s * 0.2, s * 0.66, 0, TAU);
        ctx.arc(cx, cy, s * 0.9, 0, TAU);
        ctx.arc(cx + s * 0.9, cy + s * 0.16, s * 0.62, 0, TAU);
        ctx.arc(cx + s * 0.2, cy + s * 0.42, s * 0.7, 0, TAU);
        ctx.fill();
    }

    // 远处树线
    var baseY = H * 0.80;
    ctx.fillStyle = 'rgba(110,164,72,0.20)';
    ctx.beginPath();
    for (i = -1; i < 12; i += 1) {
        var tx = i * (W / 9) + 20;
        var tr = W * 0.085 + Math.abs(Math.sin(i * 2.3)) * W * 0.05;
        ctx.moveTo(tx - tr, baseY + tr * 0.5);
        ctx.arc(tx, baseY, tr, Math.PI, 0);
    }
    ctx.fill();

    // 地面
    ctx.fillStyle = 'rgba(126,180,82,0.28)';
    ctx.fillRect(0, baseY, W, H - baseY);
}

/* ============================================================ 地图特色
   地面层：溪水、孢子雾、落石预警。都跟着镜头一起平移，所以画在世界坐标里。 */
function drawGimmickGround(t) {
    var g = state ? state.gim : null;
    if (!g) { return; }
    var i, z, rk, rg, k;

    if (g.kind === 'water') {
        for (i = 0; i < g.zones.length; i += 1) {
            z = g.zones[i];
            ctx.fillStyle = 'rgba(126,205,232,0.28)';
            ctx.beginPath();
            ctx.ellipse(z.x, z.y, z.r, z.r * 0.7, 0, 0, TAU);
            ctx.fill();
            ctx.strokeStyle = 'rgba(84,164,200,0.42)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.ellipse(z.x, z.y, z.r * (0.58 + 0.1 * Math.sin(z.t * 2)), z.r * 0.62, 0, 0, TAU);
            ctx.stroke();
            ctx.fillStyle = 'rgba(255,255,255,0.35)';
            for (var w = 0; w < 3; w += 1) {
                var wa = z.t * 0.9 + w * 2.1;
                ctx.beginPath();
                ctx.arc(z.x + Math.cos(wa) * z.r * 0.42, z.y + Math.sin(wa) * z.r * 0.3, 3, 0, TAU);
                ctx.fill();
            }
        }
    } else if (g.kind === 'spore') {
        for (i = 0; i < g.zones.length; i += 1) {
            z = g.zones[i];
            rg = ctx.createRadialGradient(z.x, z.y, 0, z.x, z.y, z.r);
            rg.addColorStop(0, 'rgba(146,190,104,0.4)');
            rg.addColorStop(0.65, 'rgba(146,190,104,0.2)');
            rg.addColorStop(1, 'rgba(146,190,104,0)');
            ctx.fillStyle = rg;
            ctx.beginPath();
            ctx.arc(z.x, z.y, z.r, 0, TAU);
            ctx.fill();
            ctx.fillStyle = 'rgba(210,236,170,0.5)';
            for (var s = 0; s < 4; s += 1) {
                var sa = z.t * 0.6 + s * 1.7;
                ctx.beginPath();
                ctx.arc(z.x + Math.cos(sa) * z.r * 0.5, z.y + Math.sin(sa * 1.3) * z.r * 0.4, 2.4, 0, TAU);
                ctx.fill();
            }
        }
    } else if (g.kind === 'fall') {
        for (i = 0; i < g.rocks.length; i += 1) {
            rk = g.rocks[i];
            if (rk.land) { continue; }
            k = 1 - rk.t / 1.1;
            ctx.strokeStyle = 'rgba(198,92,58,' + (0.22 + 0.5 * k) + ')';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(rk.x, rk.y, 62 * (0.45 + 0.55 * k), 0, TAU);
            ctx.stroke();
            ctx.fillStyle = 'rgba(198,92,58,0.12)';
            ctx.fill();
            ctx.fillStyle = 'rgba(96,64,40,' + (0.45 * k + 0.2) + ')';
            ctx.beginPath();
            ctx.arc(rk.x, rk.y - 170 * (1 - k), 6 + 12 * k, 0, TAU);
            ctx.fill();
        }
    }
}

/* 屏幕层：竹林与月夜靠压暗视野，阵风靠几道风线 */
function drawGimmickOverlay(t) {
    var g = state ? state.gim : null;
    if (!g || state.mode === 'title') { return; }
    var p = state.player;
    var px = p.x - state.cam.x;
    var py = p.y - state.cam.y;
    var rg;

    if (g.kind === 'lamp' || g.kind === 'night') {
        var rad = Math.min(W, H) * (g.kind === 'lamp' ? 0.42 : 0.6);
        var dark = g.kind === 'lamp' ? 0.80 : 0.58;
        rg = ctx.createRadialGradient(px, py, rad * 0.35, px, py, rad * 1.5);
        rg.addColorStop(0, 'rgba(12,16,30,0)');
        rg.addColorStop(0.55, 'rgba(12,16,30,' + (dark * 0.55).toFixed(3) + ')');
        rg.addColorStop(1, 'rgba(12,16,30,' + dark + ')');
        ctx.fillStyle = rg;
        ctx.fillRect(0, 0, W, H);
        // 顶部留一层亮雾，HUD 的深色字才看得清
        var topG = ctx.createLinearGradient(0, 0, 0, H * 0.145);
        topG.addColorStop(0, 'rgba(255,255,255,0.72)');
        topG.addColorStop(0.65, 'rgba(255,255,255,0.32)');
        topG.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = topG;
        ctx.fillRect(0, 0, W, H * 0.145);
        if (g.kind === 'lamp') {
            ctx.fillStyle = 'rgba(255,190,90,0.10)';
            ctx.beginPath();
            ctx.arc(px, py, rad * 0.62, 0, TAU);
            ctx.fill();
        }
    } else if (g.kind === 'wind' && g.windDur > 0) {
        var a = Math.min(0.55, g.windDur * 0.3);
        ctx.strokeStyle = 'rgba(255,255,255,' + a.toFixed(2) + ')';
        ctx.lineWidth = 2;
        for (var i = 0; i < 10; i += 1) {
            var yy = (i * 131 + t * 60) % (H + 90) - 45;
            var xx = (i * 97 + t * 260) % (W + 200) - 100;
            ctx.beginPath();
            ctx.moveTo(xx, yy);
            ctx.lineTo(xx + g.windX * 52, yy + g.windY * 22);
            ctx.stroke();
        }
    } else if (g.kind === 'spore' && g.inFog) {
        ctx.fillStyle = 'rgba(120,170,86,0.12)';
        ctx.fillRect(0, 0, W, H);
    }
}

/* ============================================================
   萝卜猎手 · screens — 大厅 / 玩法指引 / 选角色 / 选关 / 升级 / 结算
   ============================================================ */

function txt(s, x, y, size, color, align, weight) {
    ctx.textAlign = align || 'center';
    ctx.textBaseline = 'middle';
    ctx.font = (weight || 600) + ' ' + Math.round(size) + 'px system-ui, -apple-system, sans-serif';
    ctx.fillStyle = color;
    ctx.fillText(s, x, y);
}

function wrapText(text, x, y, maxW, size, color, lineH) {
    ctx.font = '500 ' + Math.round(size) + 'px system-ui, -apple-system, sans-serif';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = color;
    var line = '';
    var yy = y;
    for (var i = 0; i < text.length; i += 1) {
        var ch = text.charAt(i);
        if (ctx.measureText(line + ch).width > maxW && line.length) {
            // 中文避头点：句读不另起一行，宁可多挤一个字
            if ('，。、；：？！）》」』】”’,.;:?!)]}%'.indexOf(ch) >= 0) {
                line += ch;
                continue;
            }
            ctx.fillText(line, x, yy);
            line = ch;
            yy += lineH || size * 1.62;
        } else {
            line += ch;
        }
    }
    if (line) { ctx.fillText(line, x, yy); }
    return yy;
}

/* 折行但不画：返回最多 maxLines 行文字，放不下的用省略号收尾。
   中文标点不做行首，所以遇到标点宁愿多挤一个字到上一行。 */
function wrapLines(text, maxW, size, maxLines) {
    ctx.font = '500 ' + Math.round(size) + 'px system-ui, -apple-system, sans-serif';
    var lines = [];
    var line = '';
    var limit = maxLines || 2;
    for (var i = 0; i < text.length; i += 1) {
        var ch = text.charAt(i);
        if (ctx.measureText(line + ch).width > maxW && line.length) {
            if ('，。、；：？！）》」』】”’,.;:?!)]}%'.indexOf(ch) >= 0) {
                line += ch;
                continue;
            }
            // 已经是最后一行：剩下的全塞进去，塞不下就截断加省略号
            if (lines.length === limit - 1) {
                var rest = line + text.slice(i);
                while (rest.length > 1 && ctx.measureText(rest + '…').width > maxW) {
                    rest = rest.slice(0, -1);
                }
                lines.push(rest + (rest.length < line.length + text.length - i ? '…' : ''));
                return lines;
            }
            lines.push(line);
            line = ch;
        } else {
            line += ch;
        }
    }
    if (line) { lines.push(line); }
    return lines;
}

/* 日间天空底色：淡蓝 → 嫩绿，取代原来的深紫黑 */
function darkBg() {
    var g = ctx.createLinearGradient(0, 0, W * 0.18, H);
    g.addColorStop(0, '#E4F5FF');
    g.addColorStop(0.38, '#D8F1CE');
    g.addColorStop(0.72, '#C2E79A');
    g.addColorStop(1, '#A9DC74');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    // 底部草地压深一点，让按钮区有依托
    var g2 = ctx.createLinearGradient(0, H * 0.72, 0, H);
    g2.addColorStop(0, 'rgba(120,170,80,0)');
    g2.addColorStop(1, 'rgba(96,148,62,0.34)');
    ctx.fillStyle = g2;
    ctx.fillRect(0, H * 0.72, W, H * 0.28);
}

/* 飘浮的花粉（原来的星尘） */
function dustParticles(t) {
    for (var i = 0; i < 26; i += 1) {
        var sx = (i * 97 + t * 9) % (W + 60) - 30;
        var sy = (i * 61 + Math.sin(t * 0.6 + i) * 18 + H * 0.3) % (H + 40) - 20;
        var a = 0.16 + 0.24 * (0.5 + 0.5 * Math.sin(t * 2 + i));
        glowDot(sx, sy, 2.0, '#FFFFFF', a);
    }
}

/* ============================================================ 标题 */
function countCleared() {
    var n = 0;
    for (var i = 0; i < STAGES.length; i += 1) {
        if (save.cleared[STAGES[i].id]) { n += 1; }
    }
    return n;
}

/* 大厅「继续」落到哪一小关：上次选的能打就打上次的，否则找第一个能打又没通的 */
function lobbyLevelIdx() {
    var last = clamp(save.lastLevel || 0, 0, STAGES.length - 1);
    if (stageUnlocked(last)) { return last; }
    for (var i = 0; i < STAGES.length; i += 1) {
        if (stageUnlocked(i) && !save.cleared[STAGES[i].id]) { return i; }
    }
    return last;
}

/* 大厅里的「当前出战」面板 */
function drawLobbyPanel(x, y, w, h, t) {
    var ch = getChar(save.char);
    var L = STAGES[lobbyLevelIdx()];
    var th = THEMES[L.theme];
    var cleared = countCleared();

    ctx.fillStyle = 'rgba(255,255,255,0.52)';
    rr(x, y, w, h, 14);
    ctx.fill();
    ctx.strokeStyle = 'rgba(56,80,44,0.22)';
    ctx.lineWidth = 1.2;
    rr(x + 0.5, y + 0.5, w - 1, h - 1, 14);
    ctx.stroke();

    var cy = y + h / 2;
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.beginPath();
    ctx.arc(x + 42, cy, 25, 0, TAU);
    ctx.fill();
    drawCharShape(save.char, x + 42, cy, 17, t * 1.3, 1, 0, 1);

    var tx = x + 78;
    txt(ch.name, tx, y + 24, 16, '#22331C', 'left', 700);
    var nw = ctx.measureText(ch.name).width;
    ctx.fillStyle = ch.color;
    ctx.globalAlpha = 0.22;
    rr(tx + nw + 9, y + 16, 30, 16, 8);
    ctx.fill();
    ctx.globalAlpha = 1;
    txt(ch.tag, tx + nw + 9 + 15, y + 24, 9.5, deepen(ch.color, 0.7), 'center', 700);

    txt('当前 ' + L.mapId + '-' + L.stageNo + ' ' + L.name + ' · ' + L.tag, tx, y + 47, 11, th.accent, 'left', 600);

    // 进度点：一个点代表一张地图，按通了几个小关填色
    var dotY = y + h - 22;
    var dotW = Math.min(15, (w - 130) / LEVELS.length);
    for (var i = 0; i < LEVELS.length; i += 1) {
        var got = mapClearedCount(i);
        var dx = tx + i * dotW;
        ctx.fillStyle = 'rgba(56,80,44,0.18)';
        rr(dx, dotY - 3, dotW - 4, 5, 2.5);
        ctx.fill();
        if (got > 0) {

            rr(dx, dotY - 3, Math.max(3, (dotW - 4) * got / STAGE_COUNT), 5, 2.5);

    txt('通关 ' + cleared + ' / ' + STAGES.length, tx + LEVELS.length * dotW + 4, dotY, 10,

    var coinS = String(save.coins || 0);

    ctx.textBaseline = 'middle';
    ctx.font = '700 12px system-ui, sans-serif';

    var pc2 = curProfile();

    var px = x + w - pw - 9;
    var py = y + 9;
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    rr(px, py, pw, ph, ph / 2);
