<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#DDF0C6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>萝卜猎手</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #DDF0C6;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none; user-select: none;
    touch-action: none;
    overscroll-behavior: none;
  }
  #game {
    display: block;
    position: fixed;
    left: 0; top: 0;
    touch-action: none;
    background: #DDF0C6;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
(function () {
"use strict";
window.__SHARD_ORIENT = "port";
/* ===== core.js ===== */
/* ============================================================
   星屑猎手 · core — 基础工具 / 画布 / 存档 / 输入
   ============================================================ */

var TAU = Math.PI * 2;

function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
function lerp(a, b, t) { return a + (b - a) * t; }
function rand(a, b) { return a + Math.random() * (b - a); }
function randInt(a, b) { return Math.floor(a + Math.random() * (b - a + 1)); }
function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function dist2(ax, ay, bx, by) { var dx = ax - bx, dy = ay - by; return dx * dx + dy * dy; }
function easeOut(t) { return 1 - (1 - t) * (1 - t); }
function sign(v) { return v < 0 ? -1 : 1; }

/* 把 #RRGGBB 按比例压深，用于亮底上的小字/描边（浅色霓虹在浅底会看不清） */
function deepen(hex, f) {
    if (typeof hex !== 'string' || hex.charAt(0) !== '#' || hex.length < 7) { return hex; }
    var r = parseInt(hex.substr(1, 2), 16),
        g = parseInt(hex.substr(3, 2), 16),
        b = parseInt(hex.substr(5, 2), 16);
    f = (f === undefined) ? 0.62 : f;
    r = Math.round(r * f); g = Math.round(g * f); b = Math.round(b * f);
    return 'rgb(' + r + ',' + g + ',' + b + ')';
}

/* 给颜色套一个透明度，hex 与 rgb() 两种写法都吃 */
function withA(c, a) {
    if (typeof c !== 'string') { return c; }
    if (c.charAt(0) === '#') {
        var r = parseInt(c.substr(1, 2), 16),
            g = parseInt(c.substr(3, 2), 16),
            b = parseInt(c.substr(5, 2), 16);
        return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')';
    }
    if (c.indexOf('rgb(') === 0) { return 'rgba(' + c.slice(4, -1) + ',' + a + ')'; }
    return c;
}

function hash2(x, y) {
    var n = (x * 374761393 + y * 668265263) | 0;
    n = (n ^ (n >> 13)) * 1274126177;
    n = n ^ (n >> 16);
    return ((n >>> 0) % 100000) / 100000;
}

function fmtTime(t) {
    var m = Math.floor(t / 60);
    var s = Math.floor(t % 60);
    return m + ':' + (s < 10 ? '0' + s : s);
}

function shuffle(arr) {
    for (var i = arr.length - 1; i > 0; i -= 1) {
        var j = Math.floor(Math.random() * (i + 1));
        var tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
    }
    return arr;
}

/* ------------------------------------------------------------ 画布 */
var canvas = document.getElementById('game');
var ctx = canvas.getContext('2d');
var W = 360, H = 640, DPR = 1, LAND = false;

/* 构建版本方向：竖屏版 / 横屏版各出一份，由构建脚本注入 */
var BUILD_ORIENT = (typeof window !== 'undefined' && window.__SHARD_ORIENT) ? window.__SHARD_ORIENT : 'auto';
var needRotate = false;

function resize() {
    var dw = window.innerWidth || 360;
    var dh = window.innerHeight || 640;
    var rawLand = (window.innerWidth || 360) > (window.innerHeight || 640);
    DPR = Math.min(window.devicePixelRatio || 1, 2);

    // 超宽/超高时收窄可视宽高，避免视野过度拉伸
    // 横屏版放宽横向比例，尽量吃满手机横屏的全宽（约 2.16:1）
    var maxRatio = (BUILD_ORIENT === 'land') ? 2.45 : 1.85;
    var maxTall = (BUILD_ORIENT === 'port') ? 2.05 : 1.7;
    if (dw / dh > maxRatio) { dw = Math.round(dh * maxRatio); }
    if (dh / dw > maxTall) { dh = Math.round(dw * maxTall); }

    W = dw; H = dh;
    // 旋转提示只在手机（触屏 + 小屏）上出现，桌面浏览器照常进入
    var touchy = (typeof navigator !== 'undefined') &&
        ((navigator.maxTouchPoints || 0) > 0 || 'ontouchstart' in window);
    var smallSide = Math.min(window.innerWidth || 360, window.innerHeight || 640) < 620;
    if (BUILD_ORIENT === 'land') { LAND = true; needRotate = !rawLand; }
    else if (BUILD_ORIENT === 'port') { LAND = false; needRotate = rawLand; }
    else { LAND = W > H * 1.04; needRotate = false; }
    if (!touchy || !smallSide) { needRotate = false; }
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    canvas.style.left = Math.round(((window.innerWidth || W) - W) / 2) + 'px';
    canvas.style.top = Math.round(((window.innerHeight || H) - H) / 2) + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    DPR_READY = true;
}

var DPR_READY = false;

/* ------------------------------------------------------------ 存档
   一台设备上可以有多位玩家，每人的进度各存一个 key，互不影响。
   名单（id / 名字 / 头像色）单独存一份，和真正的进度分开。 */
var LEGACY_KEY = 'star_shard_save_v1';   // 老的单档，只用来迁移
var PROFILES_KEY = 'carrot_profiles_v1';
var SAVE_PREFIX = 'carrot_save_';
var SESSION_KEY = 'carrot_session_v1';   // 本机记住的登录状态
var MAX_PROFILES = 8;

function lsGet(k) {
    try { return window.localStorage.getItem(k); } catch (e) { return null; }
}
function lsSet(k, v) {
    try { window.localStorage.setItem(k, v); return true; } catch (e) { return false; }
}
function lsDel(k) {
    try { window.localStorage.removeItem(k); } catch (e) { /* 忽略 */ }
}
function readObj(k) {
    var raw = lsGet(k);
    if (!raw) { return null; }
    try {
        var d = JSON.parse(raw);
        return (d && typeof d === 'object') ? d : null;
    } catch (e) { return null; }
}

var profiles = null;       // 玩家名单 { cur, seq, list: [{id,name,col,born,seen}] }
var profileMem = {};       // localStorage 被禁用时的内存兜底

function profileRec(id) {
    var p = loadProfiles();
    for (var i = 0; i < p.list.length; i += 1) {
        if (p.list[i].id === id) { return p.list[i]; }
    }
    return null;
}

function loadProfiles() {
    if (profiles) { return profiles; }
    var p = readObj(PROFILES_KEY);
    var ok = p && Array.isArray(p.list);
    if (ok) {
        p.list = p.list.filter(function (r) { return r && typeof r.id === 'string'; });
    }
    if (!ok) {
        // 第一次跑到这个版本：有老的单档就整体接过来当第一个账号；
        // 全新安装则先空着，让玩家自己去注册。
        var legacy = readObj(LEGACY_KEY);
        if (legacy) {
            p = {
                cur: 'p1', seq: 2,
                list: [{ id: 'p1', name: '玩家 1', col: '#E8734A', born: Date.now(), seen: Date.now(), photo: '', uid: makeUid([]) }]
            };
            lsSet(SAVE_PREFIX + 'p1', JSON.stringify(legacy));
        } else {
            p = { cur: '', seq: 1, list: [] };
        }
        lsSet(PROFILES_KEY, JSON.stringify(p));   // 立刻落盘，下次进来还是这样
    }
    for (var i = 0; i < p.list.length; i += 1) {
        var r = p.list[i];
        if (typeof r.name !== 'string' || !r.name) { r.name = '玩家 ' + (i + 1); }
        if (typeof r.col !== 'string') { r.col = '#E8734A'; }
        if (typeof r.seen !== 'number') { r.seen = 0; }
        if (typeof r.born !== 'number') { r.born = 0; }
        // 玩家从相册挑的头像（dataURL）；为空就用「名字首字 + 配色」兜底
        if (typeof r.photo !== 'string') { r.photo = ''; }
        // 游戏账号：老档第一次跑到这里时补发一个
        if (typeof r.uid !== 'string' || !/^[0-9]{8}$/.test(r.uid)) { r.uid = makeUid(p.list); }
    }
    // 游戏账号必须互不相同：万一有重复（手工改档、旧数据），按顺序重发
    var seenUid = {};
    var ui2;
    for (ui2 = 0; ui2 < p.list.length; ui2 += 1) {
        var uu = p.list[ui2].uid;
        if (seenUid[uu]) {
            p.list[ui2].uid = makeUid(p.list);
            uu = p.list[ui2].uid;
        }
        seenUid[uu] = 1;
    }

    if (!p.cur || !profileRecIn(p, p.cur)) { p.cur = p.list.length ? p.list[0].id : ''; }
    if (typeof p.seq !== 'number' || p.seq < 2) { p.seq = p.list.length + 1; }
    profiles = p;
    return profiles;
}

/* 游戏账号：8 位数字，自动分配，同设备内不重复 */
function makeUid(list) {
    var used = {};
    var i;
    for (i = 0; i < list.length; i += 1) {
        if (list[i] && list[i].uid) { used[list[i].uid] = 1; }
    }
    var n = 0;
    var uid = '';
    while (n < 40) {
        uid = String(Math.floor(10000000 + Math.random() * 89999999));
        if (!used[uid]) { return uid; }
        n += 1;
    }
    return String(10000000 + list.length * 7919 + Math.floor(Math.random() * 97));
}

function profileRecIn(p, id) {
    for (var i = 0; i < p.list.length; i += 1) {
        if (p.list[i].id === id) { return p.list[i]; }
    }
    return null;
}

function saveProfiles() { lsSet(PROFILES_KEY, JSON.stringify(loadProfiles())); }

function curProfile() { return profileRec(loadProfiles().cur); }
function curProfileName() { var r = curProfile(); return r ? r.name : '玩家'; }

/* 把读到的 JSON 补齐成结构完整的存档（老版本的档也能直接吃） */
function normalizeSave(data) {
    if (!data || typeof data !== 'object') { data = {}; }
    if (!data.unlocked) { data.unlocked = 1; }
    if (!data.cleared) { data.cleared = {}; }
    // 老版本的关卡键是 "1".."9"，现在每张图拆成四小关 "1-1".."9-4"。
    // 当年能打通整张图，四小关自然都算过，进度和解锁都不丢。
    var oldKeys = [];
    for (var ck in data.cleared) {
        if (Object.prototype.hasOwnProperty.call(data.cleared, ck) && /^[0-9]+$/.test(ck)) { oldKeys.push(ck); }
    }
    for (var oi = 0; oi < oldKeys.length; oi += 1) {
        var ok = oldKeys[oi];
        var orec = data.cleared[ok];
        delete data.cleared[ok];
        for (var os = 1; os <= 4; os += 1) { data.cleared[ok + '-' + os] = orec; }
    }
    if (!data.char) { data.char = 'robin'; }
    if (typeof data.sound !== 'boolean') { data.sound = true; }
    if (typeof data.music !== 'boolean') { data.music = true; }
    if (data.musicMode !== 'local' && data.musicMode !== 'synth') { data.musicMode = 'synth'; }
    if (typeof data.tutDone !== 'boolean') { data.tutDone = false; }
    // 大厅存档：上次选的关卡 / 总场次 / 总击杀 / 最高分
    if (typeof data.lastLevel !== 'number' || data.lastLevel < 0) { data.lastLevel = 0; }
    if (typeof data.runs !== 'number') { data.runs = 0; }
    if (typeof data.kills !== 'number') { data.kills = 0; }
    if (typeof data.best !== 'number') { data.best = 0; }
    // 金币与商店：局外成长
    if (typeof data.coins !== 'number') { data.coins = 0; }
    if (!data.chars || typeof data.chars !== 'object') { data.chars = {}; }
    if (!data.shop || typeof data.shop !== 'object') { data.shop = {}; }
    // 装备：已拥有的 / 每个角色身上穿的
    if (!data.gearOwn || typeof data.gearOwn !== 'object') { data.gearOwn = {}; }
    if (!data.gearEq || typeof data.gearEq !== 'object') { data.gearEq = {}; }
    if (!data.eggs || typeof data.eggs !== 'object') { data.eggs = {}; }
    // 成就 / 任务 / 攻击特效
    if (typeof data.clears !== 'number') { data.clears = 0; }
    if (typeof data.bosses !== 'number') { data.bosses = 0; }
    if (typeof data.chests !== 'number') { data.chests = 0; }
    if (typeof data.relics !== 'number') { data.relics = 0; }
    if (typeof data.goldEarned !== 'number') { data.goldEarned = 0; }
    if (typeof data.bestCombo !== 'number') { data.bestCombo = 0; }
    if (typeof data.bestLv !== 'number') { data.bestLv = 0; }
    if (!data.ach || typeof data.ach !== 'object') { data.ach = {}; }
    if (typeof data.questDate !== 'string') { data.questDate = ''; }
    if (!Array.isArray(data.questList)) { data.questList = []; }
    if (!data.questProg || typeof data.questProg !== 'object') { data.questProg = {}; }
    if (!data.questClaimed || typeof data.questClaimed !== 'object') { data.questClaimed = {}; }
    if (!data.fx || typeof data.fx !== 'object') { data.fx = { plain: 1 }; }
    if (!data.fx.plain) { data.fx.plain = 1; }
    if (!data.fxCur || !data.fx[data.fxCur]) { data.fxCur = 'plain'; }
    // 挑战类统计：SSS 速杀次数 / 无伤通关次数 / 累计领过的任务数
    if (typeof data.sss !== 'number') { data.sss = 0; }
    if (typeof data.noHit !== 'number') { data.noHit = 0; }
    if (typeof data.questDone !== 'number') { data.questDone = 0; }
    // ---- 家园 / 夺宝 ----
    // 资源：木材与水源（夺宝带回来），金币沿用 save.coins
    if (typeof data.wood !== 'number') { data.wood = 0; }
    if (typeof data.water !== 'number') { data.water = 0; }
    // 种子背包：{ seedId: 数量 }
    if (!data.seeds || typeof data.seeds !== 'object') { data.seeds = {}; }
    // 药剂背包：{ potionId: 数量 }
    if (!data.potions || typeof data.potions !== 'object') { data.potions = {}; }
    // 种子图鉴：打通关卡解锁的种子种类（通关任务奖励）
    if (!data.seedUnlocked || typeof data.seedUnlocked !== 'object') { data.seedUnlocked = {}; }
    // 家园：房子风格 / 已建成地块 / 装饰 / 在种的作物
    if (!data.home || typeof data.home !== 'object') {
        data.home = { house: '', style: 'cottage', plots: [], deco: [], crops: [] };
    }
    var hm = data.home;
    if (typeof hm.house !== 'string') { hm.house = ''; }
    if (typeof hm.style !== 'string') { hm.style = 'cottage'; }
    if (!Array.isArray(hm.plots)) { hm.plots = []; }
    if (!Array.isArray(hm.deco)) { hm.deco = []; }
    if (!Array.isArray(hm.crops)) { hm.crops = []; }
    // 地块与作物槽必须一一对应：老档或异常档补齐，免得渲染/交互读到 undefined
    while (hm.crops.length < hm.plots.length) { hm.crops.push(null); }
    if (hm.crops.length > hm.plots.length) { hm.crops.length = hm.plots.length; }
    // 夺宝统计
    if (typeof data.treasureRuns !== 'number') { data.treasureRuns = 0; }
    if (typeof data.treasureBest !== 'number') { data.treasureBest = 0; }
    if (typeof data.harvestTotal !== 'number') { data.harvestTotal = 0; }
    // 本轮排行（每天 0 点清零重排）
    if (data.season !== null && (typeof data.season !== 'object' || !data.season)) { data.season = null; }
    return data;
}

function loadProfileSave(id) {
    var d = readObj(SAVE_PREFIX + id);
    if (!d) { d = profileMem[id] || null; }
    return normalizeSave(d);
}

/* 兼容老调用：读当前玩家的档 */
function loadSave() { return loadProfileSave(loadProfiles().cur); }

var save = loadSave();

function writeSave() {
    var id = loadProfiles().cur;
    if (!id) { return; }           // 还没登录，没地方可写
    profileMem[id] = save;
    lsSet(SAVE_PREFIX + id, JSON.stringify(save));
    rankCache = null;          // 有新成绩，排行榜要重算
}

/* ------------------------------------------------------------ 登录状态
   这一版不设口令：挑一个账号点进去就行。设备上记住上次那位，打开直接进。 */
var session = { id: '', at: 0, remember: false };

function loadSession() {
    var d = readObj(SESSION_KEY);
    if (!d || typeof d.id !== 'string') { return; }
    if (!d.at || Date.now() - d.at > 90 * 24 * 3600 * 1000) { return; }
    session = { id: d.id, at: d.at, remember: !!d.remember };
}

function saveSession() {
    if (!session.id) { lsDel(SESSION_KEY); return; }
    lsSet(SESSION_KEY, JSON.stringify(session));
}

function isLoggedIn() {
    return !!(session.id && profileRec(session.id));
}

function logout() {
    if (isLoggedIn()) { writeSave(); }
    session = { id: '', at: 0, remember: false };
    saveSession();
}

function loginAs(id, remember) {
    if (!profileRec(id)) { return 'nouser'; }
    if (!switchProfile(id)) { return 'nouser'; }
    session = { id: id, at: Date.now(), remember: remember !== false };
    saveSession();
    return 'ok';
}

/* ------------------------------------------------------------ 玩家切换 */
function switchProfile(id) {
    var p = loadProfiles();
    var rec = profileRecIn(p, id);
    if (!rec) { return false; }
    if (p.cur === id && save) { return true; }
    writeSave();                     // 先把当前这位的进度落盘
    p.cur = id;
    rec.seen = Date.now();
    saveProfiles();
    save = loadProfileSave(id);
    return true;
}

function createProfile(name, col, photo) {
    var p = loadProfiles();
    if (p.list.length >= MAX_PROFILES) { return null; }
    if (!name) { return null; }
    var id = 'p' + p.seq;
    p.seq += 1;
    var rec = {
        id: id, name: name, col: col,
        born: Date.now(), seen: Date.now(),
        photo: typeof photo === 'string' ? photo : '',
        uid: makeUid(p.list)
    };
    p.list.push(rec);
    p.cur = id;
    saveProfiles();
    rankCache = null;
    save = loadProfileSave(id);
    return id;
}

function renameProfile(id, name) {
    var rec = profileRec(id);
    if (!rec || !name) { return false; }
    rec.name = name;
    saveProfiles();
    rankCache = null;
    return true;
}

function deleteProfile(id) {
    var p = loadProfiles();
    if (p.list.length <= 1) { return false; }      // 至少留一位
    for (var i = 0; i < p.list.length; i += 1) {
        if (p.list[i].id !== id) { continue; }
        p.list.splice(i, 1);
        lsDel(SAVE_PREFIX + id);
        delete profileMem[id];
        rankCache = null;
        if (p.cur === id) {
            p.cur = p.list[0].id;
            saveProfiles();
            save = loadProfileSave(p.cur);
            if (session.id === id) { logout(); }
        } else {
            saveProfiles();
        }
        if (session.id === id) { logout(); }
        return true;
    }
    return false;
}

/* ------------------------------------------------------------ 输入 */
var input = {
    joyActive: false,
    joyId: null,               // 正在控制摇杆的那根手指的 identifier（鼠标为 null）
    baseX: 0, baseY: 0, knobX: 0, knobY: 0,
    dx: 0, dy: 0, mag: 0,
    keys: Object.create(null),
    touched: false
};

/* touchId 是触点的 identifier（鼠标路径不传）。摇杆记住"是谁按下的"，
   这样别的手指移动/抬起都不会干扰它——手机上左右手同时操作时必需。 */
function joyStart(x, y, touchId) {
    input.joyActive = true;
    input.joyId = (touchId === undefined) ? null : touchId;
    input.baseX = x; input.baseY = y;
    input.knobX = x; input.knobY = y;
    input.dx = 0; input.dy = 0; input.mag = 0;
}

function joyMove(x, y, touchId) {
    if (!input.joyActive) { return; }
    /* 只有当初按下摇杆的那根手指能驱动它，别的手指移动一律忽略 */
    if (input.joyId !== null && touchId !== undefined && touchId !== input.joyId) { return; }
    var maxR = Math.max(48, Math.min(W, H) * 0.13);
    var dx = x - input.baseX;
    var dy = y - input.baseY;
    var len = Math.sqrt(dx * dx + dy * dy);
    if (len > maxR) {
        dx = dx / len * maxR;
        dy = dy / len * maxR;
        input.baseX = x - dx;
        input.baseY = y - dy;
        len = maxR;
    }
    input.knobX = input.baseX + dx;
    input.knobY = input.baseY + dy;
    input.dx = dx / maxR;
    input.dy = dy / maxR;
    input.mag = Math.min(1, len / maxR);
}

function joyEnd() {
    input.joyActive = false;
    input.joyId = null;
    input.dx = 0; input.dy = 0; input.mag = 0;
}

/* ------------------------------------------------------------ 轻量音效 */
var audio = {
    ac: null,
    ok: function () {
        if (!save.sound) { return false; }
        if (!this.ac) {
            try {
                var AC = window.AudioContext || window.webkitAudioContext;
                if (!AC) { return false; }
                this.ac = new AC();
            } catch (e) { return false; }
        }
        if (this.ac.state === 'suspended' && this.ac.resume) { try { this.ac.resume(); } catch (e) { /* 忽略 */ } }
        return true;
    },
    blip: function (freq, dur, type, vol) {
        if (!this.ok()) { return; }
        try {
            var ac = this.ac;
            var o = ac.createOscillator();
            var g = ac.createGain();
            o.type = type || 'sine';
            o.frequency.value = freq;
            g.gain.value = vol || 0.06;
            g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + dur);
            o.connect(g); g.connect(ac.destination);
            o.start(); o.stop(ac.currentTime + dur);
        } catch (e) { /* 忽略 */ }
    },
    hit: function () { this.blip(rand(520, 640), 0.05, 'square', 0.025); },
    level: function () { this.blip(660, 0.09, 'sine', 0.06); this.blip(880, 0.12, 'sine', 0.05); },
    hurt: function () { this.blip(180, 0.16, 'sawtooth', 0.05); },
    boom: function () { this.blip(90, 0.22, 'sawtooth', 0.06); },
    ui: function () { this.blip(480, 0.05, 'sine', 0.04); },
    pick: function () { this.blip(760, 0.05, 'triangle', 0.035); }
};

var STAGES = (function () {
    var list = [];
    var total = LEVELS.length * STAGE_COUNT;
    for (var m = 0; m < LEVELS.length; m += 1) {
        var map = LEVELS[m];
        for (var s = 0; s < STAGE_COUNT; s += 1) {
            var k = m * STAGE_COUNT + s;          // 全局第几关（0 起）
            var q = k / (total - 1);              // 0 → 1
            list.push({
                idx: list.length,
                mapIdx: m,
                mapId: map.id,
                stageNo: s + 1,
                id: map.id + '-' + (s + 1),
                name: map.name,
                sub: map.sub,
                tag: STAGE_TAGS[s],
                theme: map.theme,
                duration: Math.round(58 + 206 * Math.pow(q, 0.90)),
                // 前半程放缓、后半程陡起：越到后面越吃构筑，不再是一路线性堆数值
                hpMul: 0.62 + 2.35 * Math.pow(q, 1.35),
                dmgMul: 0.66 + 1.22 * Math.pow(q, 1.25),
                spawnMul: 0.80 + 0.46 * Math.pow(q, 1.1),
                startLv: Math.round(map.startLv + s * 1.5),
                pool: map.pool,
                boss: map.boss,
                tip: map.tip,
                feature: MAP_FEATURE[map.id] || MAP_FEATURE[1]
            });
        }
    }
    return list;
})();

function mapClearedCount(mapIdx) {
    var n = 0;
    var mid = LEVELS[mapIdx].id;
    for (var s = 1; s <= STAGE_COUNT; s += 1) {
        if (save.cleared[mid + '-' + s]) { n += 1; }
    }
    return n;
}

var STAGE_OPEN_NEED = 3;

/* 血量以 100 为基准，各角色在这上下浮动；敌方伤害同比缩放，保证"能挨几下"不变 */
var HP_BASE = 100;

var CLEAR_COIN = 15;

function mapCleared(mapIdx) { return mapClearedCount(mapIdx) >= STAGE_OPEN_NEED; }

function mapDoneCount() {
    var n = 0;
    for (var i = 0; i < LEVELS.length; i += 1) {
        if (mapCleared(i)) { n += 1; }
    }
    return n;
}

/* 小关解锁：地图内逐个开，地图之间通三关即开下一张 */
function stageUnlocked(idx) {
    if (idx < 0 || idx >= STAGES.length) { return false; }
    var st = STAGES[idx];
    if (st.stageNo === 1) {
        if (st.mapIdx === 0) { return true; }
        return mapCleared(st.mapIdx - 1);
    }
    return !!save.cleared[STAGES[idx - 1].id];
}

/* ------------------------------------------------------------ 评级 */
function rankOf(level, cleared, time) {
    if (!cleared) { return { r: 'D', c: '#8A8F98', t: '未能通关' }; }
    var over = time - level.duration;
    if (over < 8) { return { r: 'SSS', c: '#FFD166', t: '速杀' }; }
    if (over < 20) { return { r: 'SS', c: '#FFB03A', t: '干净利落' }; }
    if (over < 40) { return { r: 'S', c: '#7CFFB2', t: '稳' }; }
    return { r: 'A', c: '#5CC8FF', t: '过关' };
}

/* 评级排序用：越大越好 */
function rankOrder(r) {
    return { D: 0, A: 1, S: 2, SS: 3, SSS: 4 }[r] || 0;
}

/* 当前这一身穿出来的攻击特效：
   武器给"主特效"，护甲饰品给"副特效"；副特效和主特效同属性时把主特效抬一档，
   不同属性则减半单独生效。返回 { main, subs:[], amp } */
function gearFxOf(charId) {
    var out = { main: 'none', subs: [], amp: 1 };
    var eq = (save.gearEq && save.gearEq[charId || save.char]) || {};
    var i, it, f, k;
    for (k = 0; k < GEAR_SLOTS.length; k += 1) {
        it = gearOf(eq[GEAR_SLOTS[k].id]);
        if (!it || !gearFits(it, charId || save.char)) { continue; }
        f = it.fx;
        if (!f || f === 'none') { continue; }
        if (it.slot === 'weapon') { out.main = f; }
        else if (out.subs.indexOf(f) < 0) { out.subs.push(f); }
    }
    if (out.main !== 'none' && out.subs.indexOf(out.main) >= 0) {
        out.amp = 1.4;                       // 同一套属性互相加成
    }
    return out;
}

/* 近战 / 远攻判定 */
function isMeleeChar(charId) {
    var ch = getChar(charId || (save && save.char));
    return !!(ch && ch.range === 'melee');
}

   萝卜猎手 · music — 背景音乐
   两套来源：
   1) synth：内置抒情流行合成（钢琴 + 弦乐 + 软鼓），原创旋律，
      走华语情歌常见的 4536251 和声，慢速、留白、副歌抬情绪。
   2) local：用户自己选的本机音频文件（只在本机解码播放，不上传）。
   ============================================================ */

var music = {
    ac: null, master: null, noise: null,
    cur: '', step: 0, nextT: 0, timer: 0, cut: 0
};

var musicLocal = { el: null, url: '', name: '', ready: false };

/* ------------------------------------------------------------ 音频上下文 */
/* 注意：这个函数是在 onDown 的最开头（touchStartAudio）被调用的。
   一旦它抛异常，整个点击分发就被打断——表现就是「点了没反应」。
   所以从创建上下文到搭好 master/noise 的每一步都不能漏 try/catch：
   任何一步失败都干净地返回 null，让游戏照常可玩。 */
function mAC() {
    if (!save.music) { return null; }
    if (!music.ac) {
        var AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) { return null; }
        var ac;
        try { ac = new AC(); } catch (e) { return null; }
        try {
            music.master = ac.createGain();
            music.master.gain.value = 0;
            music.master.connect(ac.destination);
            var len = Math.floor(ac.sampleRate * 0.4);
            var buf = ac.createBuffer(1, len, ac.sampleRate);
            var d = buf.getChannelData(0);
            for (var i = 0; i < len; i += 1) { d[i] = Math.random() * 2 - 1; }
            music.noise = buf;
        } catch (e2) {
            /* 建图失败：把状态清干净，当成「没有音乐」，但不影响其它功能 */
            try { if (music.master && music.master.disconnect) { music.master.disconnect(); } } catch (e3) { /* 忽略 */ }
            music.master = null;
            music.noise = null;
            try { if (ac.close) { ac.close(); } } catch (e4) { /* 忽略 */ }
            return null;
        }
        music.ac = ac;
    }
    if (music.ac.state === 'suspended' && music.ac.resume) {
        try { music.ac.resume(); } catch (e) { /* 忽略 */ }
    }
    return music.ac;
}

function nf(midi) { return 440 * Math.pow(2, (midi - 69) / 12); }

/* ------------------------------------------------------------ 音色 */
/* 钢琴：正弦谐波叠加 + 两段衰减，比锯齿波柔和，接近真钢的"毛边" */
function mPiano(t, midi, dur, v, tilt) {
    var ac = music.ac;
    if (!ac) { return; }
    var f0 = nf(midi);
    var bus = ac.createGain();
    bus.gain.setValueAtTime(0.0001, t);
    bus.gain.exponentialRampToValueAtTime(v, t + 0.014);
    bus.gain.exponentialRampToValueAtTime(v * 0.34, t + Math.min(0.26, dur * 0.4));
    bus.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    bus.connect(music.master);

    var harm = [[1, 1], [2, 0.32], [3, 0.12], [4, 0.055]];
    for (var i = 0; i < harm.length; i += 1) {
        var o = ac.createOscillator();
        var g = ac.createGain();
        o.type = 'sine';
        o.frequency.setValueAtTime(f0 * harm[i][0] * (1 + (i ? 0.0006 : 0)), t);
        g.gain.value = harm[i][1] * (tilt === undefined ? 1 : tilt);
        o.connect(g); g.connect(bus);
        o.start(t); o.stop(t + dur + 0.02);
    }
}

/* 弦乐 / 和声铺底：慢起慢收，锯齿去齿后用低通压住 */
function mStrings(t, chord, dur, v) {
    var ac = music.ac;
    if (!ac) { return; }
    var lp = ac.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.setValueAtTime(900, t);
    lp.frequency.linearRampToValueAtTime(1500, t + dur * 0.4);
    lp.frequency.linearRampToValueAtTime(800, t + dur);
    lp.Q.value = 0.6;
    var bus = ac.createGain();
    bus.gain.setValueAtTime(0.0001, t);
    bus.gain.linearRampToValueAtTime(v, t + dur * 0.34);
    bus.gain.linearRampToValueAtTime(v * 0.8, t + dur * 0.72);
    bus.gain.linearRampToValueAtTime(0.0001, t + dur);
    lp.connect(bus); bus.connect(music.master);

    for (var k = 0; k < chord.length; k += 1) {
        for (var d = 0; d < 2; d += 1) {
            var o = ac.createOscillator();
            var g = ac.createGain();
            o.type = 'sawtooth';
            o.frequency.setValueAtTime(nf(chord[k]), t);
            o.detune.value = d ? 7 : -7;
            g.gain.value = 0.3;
            o.connect(g); g.connect(lp);
            o.start(t); o.stop(t + dur + 0.05);
        }
    }
    // 高八度一抹亮色，副歌才不闷
    var hi = ac.createOscillator();
    var hg = ac.createGain();
    hi.type = 'triangle';
    hi.frequency.setValueAtTime(nf(chord[chord.length - 1] + 12), t);
    hg.gain.value = 0.25;
    hi.connect(hg); hg.connect(lp);
    hi.start(t); hi.stop(t + dur + 0.05);
}

/* 贝斯：正弦打底 + 三角谐波，圆而不炸 */
function mBass(t, midi, dur, v) {
    var ac = music.ac;
    if (!ac) { return; }
    var bus = ac.createGain();
    bus.gain.setValueAtTime(0.0001, t);
    bus.gain.exponentialRampToValueAtTime(v, t + 0.02);
    bus.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    bus.connect(music.master);
    var o = ac.createOscillator(), o2 = ac.createOscillator();
    var g2 = ac.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(nf(midi), t);
    o2.type = 'triangle';
    o2.frequency.setValueAtTime(nf(midi), t);
    g2.gain.value = 0.35;
    o.connect(bus); o2.connect(g2); g2.connect(bus);
    o.start(t); o.stop(t + dur + 0.02);
    o2.start(t); o2.stop(t + dur + 0.02);
}

/* 软底鼓：不抢人声位置，像手掌轻拍 */
function mKick(t, v) {
    var ac = music.ac;
    if (!ac) { return; }
    var o = ac.createOscillator(), g = ac.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(126, t);
    o.frequency.exponentialRampToValueAtTime(50, t + 0.11);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(v, t + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.26);
    o.connect(g); g.connect(music.master);
    o.start(t); o.stop(t + 0.28);
}

function mNoise(t, dur, v, type, freq, q) {
    var ac = music.ac;
    if (!ac) { return; }
    var s = ac.createBufferSource(), g = ac.createGain(), f = ac.createBiquadFilter();
    s.buffer = music.noise;
    f.type = type; f.frequency.value = freq;
    if (q) { f.Q.value = q; }
    g.gain.setValueAtTime(v, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(music.master);
    s.start(t); s.stop(t + dur + 0.03);
}

/* ------------------------------------------------------------ 曲目 */
/* 和声走向：F - G - Em - Am - F - G - C - C（华语抒情最常用的一条）
   旋律为原创，按四分音符手写，副歌上行抬情绪，落句回收。 */
var CH_F = [53, 57, 60];
var CH_G = [55, 59, 62];
var CH_Em = [52, 55, 59];
var CH_Am = [57, 60, 64];
var CH_C = [48, 55, 60, 64];

var HOOK_A = [
    [69, 72, 74, 72],
    [74, 71, 74, 76],
    [76, 74, 71, 67],
    [69, 72, 76, 74],
    [72, 74, 76, 79],
    [77, 76, 74, 71],
    [72, 76, 74, 72],
    [69, 0, 67, 0]
];

var SONGS = {
    /* 大厅：只有钢琴与弦乐，慢速，留白多，像前奏 */
    menu: {
        bpm: 72, drums: 0, padV: 0.028, leadV: 0.95, low: 0.1,
        prog: [CH_F, CH_G, CH_Em, CH_Am, CH_F, CH_G, CH_C, CH_C],
        mel: HOOK_A
    },
    /* 战斗：同一条和声推进到副歌，加软鼓与八分音符推进 */
    battle: {
        bpm: 100, drums: 1, padV: 0.036, leadV: 1.0, low: 0.14,
        prog: [CH_F, CH_G, CH_Em, CH_Am, CH_F, CH_G, CH_C, CH_C],
        mel: HOOK_A
    },
    /* 精英战：弦乐加强，低音八度跟走，情绪最满 */
    boss: {
        bpm: 118, drums: 2, padV: 0.05, leadV: 1.1, low: 0.16,
        prog: [CH_Am, CH_F, CH_C, CH_G, CH_Am, CH_F, CH_G, CH_G],
        mel: HOOK_A
    }
};

function mStep(t, i, S, spb) {
    var bar = Math.floor(i / 16) % S.prog.length;
    var s = i % 16;
    var chord = S.prog[bar];
    var mel = S.mel[bar];

    // 主旋律（四分音符）
    if (s % 4 === 0) {
        var n = mel[s / 4];
        if (n > 0) {
            mPiano(t, n, spb * 7.5, 0.17 * S.leadV);
            mPiano(t, n - 12, spb * 5, 0.05 * S.leadV, 0.7);
        }
    }

    // 左手分解和弦（八分音符）
    if (s % 2 === 0 && bar !== 7) {
        var k = (s / 2) % 4;
        var idx = [0, 1, 2, 1][k];
        mPiano(t, chord[idx], spb * 3.2, S.low * (k === 0 ? 1 : 0.72), 0.85);
    }

    // 贝斯跟根音
    if (S.drums >= 1) {
        if (s === 0 || s === 6 || s === 8 || s === 14) {
            mBass(t, chord[0] - 12, spb * (s === 0 ? 3.4 : 2.2), s === 0 ? 0.15 : 0.09);
        }
    }

    // 鼓：软底鼓 + 刷镲
    if (S.drums >= 1) {
        if (s === 0 || s === 8 || (S.drums >= 2 && s === 11)) { mKick(t, 0.4); }
        if (s === 4 || s === 12) { mNoise(t, 0.16, 0.07, 'bandpass', 1500, 0.7); }
        if (s % 4 === 2) { mNoise(t, 0.05, 0.02, 'highpass', 7800); }
    }
    if (S.drums >= 2) {
        if (s % 2 === 0) { mNoise(t, 0.04, 0.024, 'highpass', 8600); }
        if (s === 0) { mPiano(t, chord[0] + 12, spb * 8, 0.07, 1.1); }
    }

    // 和声铺底（每小节一次）
    if (s === 0) { mStrings(t, chord, spb * 16, S.padV); }
}

function mTick() {
    try {
        var ac = music.ac;
        if (!ac || !music.cur || !music.master) { return; }
        if (ac.state !== 'running') { music.nextT = ac.currentTime + 0.05; return; }
        var S = SONGS[music.cur];
        if (!S) { return; }
        var spb = 60 / S.bpm / 4;
        var guard = 0;
        while (music.nextT < ac.currentTime + 0.24 && guard < 40) {
            mStep(music.nextT, music.step, S, spb);
            music.nextT += spb;
            music.step += 1;
            guard += 1;
        }
    } catch (e) {
        /* 某一拍出错就停掉定时器，别每 60ms 报一次错刷爆主线程 */
        music.cur = '';
        if (music.timer) { clearInterval(music.timer); music.timer = 0; }
    }
}

/* ------------------------------------------------------------ 本机音乐 */
function musicLocalStop() {
    if (musicLocal.el) {
        try { musicLocal.el.pause(); } catch (e) { /* 忽略 */ }
    }
}

function musicLocalPlay() {
    if (!musicLocal.el) { return false; }
    try {
        musicLocal.el.volume = 0.55;
        var p = musicLocal.el.play();
        if (p && p.catch) { p.catch(function () { /* 用户还没交互，等下一点 */ }); }
        return true;
    } catch (e) { return false; }
}

/* 弹系统文件选择框。只在用户点击后调用，避免浏览器拦截 */
function musicPickLocal() {
    var inp = document.createElement('input');
    inp.type = 'file';
    inp.accept = 'audio/*';
    inp.style.position = 'fixed';
    inp.style.left = '-9999px';
    document.body.appendChild(inp);
    inp.addEventListener('change', function () {
        var f = inp.files && inp.files[0];
        try { document.body.removeChild(inp); } catch (e) { /* 忽略 */ }
        if (!f) { return; }
        if (musicLocal.url) { try { URL.revokeObjectURL(musicLocal.url); } catch (e) { /* 忽略 */ } }
        var el = musicLocal.el;
        if (!el) {
            el = new Audio();
            el.loop = true;
            el.preload = 'auto';
            musicLocal.el = el;
        }
        musicLocal.url = URL.createObjectURL(f);
        musicLocal.name = f.name.replace(/\.[^.]+$/, '');
        el.src = musicLocal.url;
        save.music = true;
        save.musicMode = 'local';
        writeSave();
        musicStop();
        musicLocalPlay();
        if (typeof audio !== 'undefined') { audio.ui(); }
    });
    inp.click();
}

function musicLabel() {
    if (!save.music) { return '音乐 关'; }
    if (save.musicMode === 'local' && musicLocal.el) { return '音乐 本机'; }
    return '音乐 开';
}

/* ------------------------------------------------------------ 开关与切曲 */
/* musicStop / musicPlay 都在主循环的 musicSync() 里被调用，
   而主循环只把 render 包在 try/catch 里 —— 这里抛异常会直接打断整帧，
   等于整个游戏卡住。所以摸音频节点的每一处都得自己兜住。 */
function musicStop() {
    music.cur = '';
    if (music.timer) { clearInterval(music.timer); music.timer = 0; }
    if (music.ac && music.master) {
        try {
            music.master.gain.cancelScheduledValues(music.ac.currentTime);
            music.master.gain.setTargetAtTime(0, music.ac.currentTime, 0.2);
        } catch (e) { /* 忽略：音频节点可能已被回收 */ }
    }
}

function musicPlay(name) {
    if (!save.music || !name) { musicStop(); return; }
    if (music.cur === name) { return; }
    var ac = mAC();
    if (!ac || !music.master) { return; }
    music.cur = name;
    music.step = 0;
    music.nextT = ac.currentTime + 0.08;
    try {
        music.master.gain.cancelScheduledValues(ac.currentTime);
        music.master.gain.setTargetAtTime(0.17, ac.currentTime, 0.5);
    } catch (e) { /* 忽略：音频节点可能已被回收 */ }
    if (!music.timer) { music.timer = setInterval(mTick, 60); }
}

/* 按当前界面切换曲目 */
function musicSync() {
    if (!state) { return; }
    if (!save.music) {
        if (music.cur) { musicStop(); }
        musicLocalStop();
        return;
    }
    if (save.musicMode === 'local' && musicLocal.el) {
        if (music.cur) { musicStop(); }
        if (musicLocal.el.paused) { musicLocalPlay(); }
        return;
    }
    var m = state.mode;
    var want = 'menu';
    if (m === 'playing' || m === 'levelup' || m === 'paused') {
        want = (state.bossRef && !state.bossRef.dead) ? 'boss' : 'battle';
    }
    musicPlay(want);
}


/* ===== game.js ===== */
/* ============================================================
   星屑猎手 · game — 状态机 / 刷怪 / 武器 / 升级 / BOSS / 关卡流程
   ============================================================ */

var state = null;

/* 所有升级项 id 全集 */
var ALL_UP_IDS = WEAPON_IDS.concat(PASSIVE_IDS, ENDLESS_IDS);

function newState() {
    var ch = getChar(save.char);
    var lv = getLevel(0);
    var up = {};
    for (var i = 0; i < ALL_UP_IDS.length; i += 1) { up[ALL_UP_IDS[i]] = 0; }
    up[ch.start] = 1;

    return {
        mode: 'title',
        charId: ch.id,
        melee: isMeleeChar(ch.id),
        palette: { color: ch.color, glow: ch.glow },
        levelIdx: 0,
        levelDef: lv,
        theme: themeOf(lv),
        phase: 'wave',            // wave | boss | done
        time: 0,
        kills: 0,
        hits: 0,                  // 本局挨了多少下，0 就是无伤
        score: 0,
        level: 1,
        xp: 0,
        xpNext: 9,
        pending: 0,
        rerolls: 2,

        player: {
            x: 0, y: 0, r: 15,
            hp: ch.hp, maxHp: ch.hp,
            speed: ch.speed,
            face: 1, walk: 0, iframe: 0, hurt: 0, vx: 0, vy: 0,
            dmgMul: ch.dmg,
            shield: 0, shieldCd: 0,
            trail: []
        },
        up: up,
        cd: { dart: 0.25, nova: 0.8, bolt: 1.6, blade: 0.9, lance: 1.2, mine: 1.4, chain: 1.8, shock: 2.4, hole: 3.6, drone: 1.0, slam: 1.5 },

        enemies: [],
        ebullets: [],
        bullets: [],
        orbs: [],
        mines: [],
        holes: [],
        drones: [],
        gems: [],
        coins: [],
        gold: 0,
        pickups: [],
        chests: [],
        relics: [],
        gim: null,                // 地图特色（风 / 水 / 雾 / 落石 / 树心）
        shard: null,
        particles: [],
        texts: [],
        effects: [],

        /* 彩蛋与临时事件 */
        combo: 0,
        comboT: 0,
        comboBest: 0,
        eggs: {},
        event: null,
        eventCd: 24,
        goldSpawned: 0,
        goldCd: 18,
        bossN: 0,
        chestN: 0,
        relicN: 0,

        cam: { x: 0, y: 0 },
        spawnTimer: 1.1,
        shake: 0,
        flash: 0,
        hurtVig: 0,
        orbAngle: 0,
        bossRef: null,
        bossSpawned: false,
        bossWarn: 0,
        clearDelay: 0,
        clearBulletAt: null,
        tipTimer: 0,
        tipText: '',
        slowmo: 0,
        growT: 0,
        fxOn: { main: 'none', subs: [], amp: 1 },
        quakes: [],

        toast: null,
        toastT: 0,

        /* 夺宝与家园 */
        treasure: false,
        trLoots: [],
        trGot: 0,
        trCaught: 0,
        trEndT: 0,
        trHide: 0,
        trMsg: '',
        trMsgT: 0,
        trCoins: 0,
        trYield: { wood: 0, water: 0, coins: 0 },
        home: false,
        homePanel: false,
        homeTab: 'build',
        homePick: -1
    };
}

function upLv(id) { return state.up[id] || 0; }

/* ------------------------------------------------------------ 开始一局 */
function startRun(levelIdx) {
    var prevChar = save.char;
    state = newState();
    save.char = prevChar;
    state.charId = save.char;
    state.levelIdx = clamp(levelIdx, 0, STAGES.length - 1);
    state.levelDef = getLevel(state.levelIdx);
    state.theme = themeOf(state.levelDef);

    // 存档：记住这次选的关卡，下次大厅直接从这里继续
    save.lastLevel = state.levelIdx;
    writeSave();

    var ch = getChar(state.charId);
    var gm = gearMods(state.charId);
    state.melee = isMeleeChar(state.charId);
    state.palette = { color: ch.color, glow: ch.glow };
    state.player.maxHp = ch.hp + shopLv('hp') * HP_SHOP_STEP + (gm.hp || 0);
    state.player.hp = state.player.maxHp;
    state.player.speed = ch.speed * (1 + shopLv('speed') * 0.04) * (1 + (gm.speed || 0));
    state.player.dmgMul = ch.dmg * (1 + (gm.atk || 0));
    state.gearMod = gm;
    state.fxOn = gearFxOf(state.charId);     // 装备带出来的攻击特效

    // 高级角色自带一点被动，用来体现"贵有贵的道理"
    if (ch.perk) {
        state.up[ch.perk.id] = (state.up[ch.perk.id] || 0) + ch.perk.lv;
    }

    state.mode = 'playing';
    state.cam.x = -W / 2;
    state.cam.y = -H / 2;
    state.tipText = state.levelDef.tip;
    state.tipTimer = 5;

    // 高关卡开局预置基础构筑：否则从 1 级硬扛高系数血量，杀不动就永远升不上去
    var preLv = (state.levelDef.startLv || 0) + shopLv('start');
    for (var i = 0; i < preLv; i += 1) {
        var cand = rollChoices();
        var chosen = null;
        var wantWeapon = (i % 2 === 0);
        for (var c = 0; c < cand.length; c += 1) {
            if (wantWeapon && WEAPONS[cand[c]]) { chosen = cand[c]; break; }
            if (!wantWeapon && PASSIVES[cand[c]]) { chosen = cand[c]; break; }
        }
        if (!chosen) { chosen = cand[0]; }
        applyUpgrade(chosen);
    }
    if (preLv > 0) {
        state.level = 1 + preLv;
        state.xpNext = nextXp(state.level);
    }

    buildWorldSeed(state.theme);
    initGimmick(state.levelDef);

    // 彩蛋：田里埋着两只老木箱，得自己走过去撞开
    var ci, ca, cr;
    for (ci = 0; ci < 2; ci += 1) {
        ca = rand(0, TAU);
        cr = rand(380, 820);
        state.chests.push({
            x: Math.cos(ca) * cr, y: Math.sin(ca) * cr,
            r: 17, t: rand(0, 4), opened: 0, openT: 0
        });
    }
    // 彩蛋：地图上散着四件说不清来历的东西，每局抽四种，跑图时才会撞见
    var rp = RELIC_IDS.slice();
    var rIdx;
    for (rIdx = 0; rIdx < 4 && rp.length; rIdx += 1) {
        var rid = rp.splice(Math.floor(Math.random() * rp.length), 1)[0];
        var ra = rand(0, TAU) + rIdx * (TAU / 4);
        var rr2 = rand(470, 1150);
        state.relics.push({
            id: rid,
            x: Math.cos(ra) * rr2, y: Math.sin(ra) * rr2,
            t: rand(0, 4), used: 0, useT: 0, hinted: 0
        });
    }

    // 彩蛋：星屑碎片——三成概率在附近闪一下
    if (Math.random() < 0.3) {
        var sa = rand(0, TAU);
        var sr = rand(520, 1080);
        state.shard = { x: Math.cos(sa) * sr, y: Math.sin(sa) * sr, t: 0 };
    }

    rebuildOrbs();
    rebuildDrones();
    joyEnd();
    input.touched = false;
    audio.level();
}

/* ------------------------------------------------------------ 升级 */
function rollChoices() {
    var pool = [];
    var i;

    // 已有武器权重更高，方便专精
    var melee0 = isMeleeChar(save.char);
    for (i = 0; i < WEAPON_IDS.length; i += 1) {
        var wid = WEAPON_IDS[i];
        if (WEAPONS[wid].melee && !melee0) { continue; }
        if (upLv(wid) >= WEAPONS[wid].max) { continue; }
        var wLv = upLv(wid);
        var wWeight = wLv > 0 ? 4 : 1;
        for (var a = 0; a < wWeight; a += 1) { pool.push(wid); }
    }
    var melee = isMeleeChar(save.char);
    for (i = 0; i < PASSIVE_IDS.length; i += 1) {
        var pid = PASSIVE_IDS[i];
        if (PASSIVES[pid].melee && !melee) { continue; }
        if (upLv(pid) >= PASSIVES[pid].max) { continue; }
        var pLv = upLv(pid);
        var pWeight = pLv > 0 ? 3 : 1;
        for (var b = 0; b < pWeight; b += 1) { pool.push(pid); }
    }

    shuffle(pool);

    var out = [];
    var seen = Object.create(null);
    for (i = 0; i < pool.length && out.length < 3; i += 1) {
        if (seen[pool[i]]) { continue; }
        seen[pool[i]] = 1;
        out.push(pool[i]);
    }

    // 保底：池子抽干也必须有卡可选（无限项不会满级）
    var eIdx = 0;
    while (out.length < 3) {
        var eid = ENDLESS_IDS[eIdx % ENDLESS_IDS.length];
        eIdx += 1;
        if (seen[eid]) { continue; }
        seen[eid] = 1;
        out.push(eid);
        if (eIdx > 12) { break; }
    }
    return out;
}

function openLevelUp() {
    state.mode = 'levelup';
    joyEnd();
    ui.cards = rollChoices();
    ui.cardRects = [];
    audio.level();
}

function rerollCards() {
    if (state.rerolls <= 0) { return; }
    state.rerolls -= 1;
    ui.cards = rollChoices();
    ui.cardRects = [];
    audio.ui();
}

/* 纯应用一次升级（不触发界面流转），开局预置构筑也用它 */
function applyUpgrade(id) {
    var m = metaOf(id);
    if (!m) { return false; }
    state.up[id] = upLv(id) + 1;
    var p = state.player;
    if (id === 'hp') {
        p.maxHp += 22;
        p.hp = Math.min(p.maxHp, p.hp + 22);
    }
    if (id === 'bulwark') {
        p.maxHp += 14;
        p.hp = Math.min(p.maxHp, p.hp + 14);
    }
    if (id === 'orb') { rebuildOrbs(); }
    if (id === 'drone') { rebuildDrones(); }
    if (id === 'guard') { p.shieldCd = guardInterval(); }
    return true;
}

function chooseUpgrade(id) {
    if (!id) { closeLevelUp(); return; }
    applyUpgrade(id);
    audio.pick();
    closeLevelUp();
}

function guardInterval() {
    var lv = upLv('guard');
    if (lv <= 0) { return 999; }
    return 14 - lv * 3;
}

function closeLevelUp() {
    ui.cards = [];
    ui.cardRects = [];
    state.pending -= 1;
    if (state.pending > 0) {
        openLevelUp();
    } else {
        state.mode = 'playing';
    }
}

function nextXp(level) {
    // 前期几级很快建立构筑，之后每级成本快速抬升（二次项），
    // 保证一关下来大约十几到二十次升级，而不是一路无脑堆到四五十级。
    return Math.floor(9 + level * 4 + level * level * 0.47);
}

/* 升级瞬间：给足「变强了」的爽感——金光冲击波 + 粒子喷泉 + 角色短暂放大 + 闪白。
   growT 驱动绘制层的体型弹性缩放，1.2 秒内从 1.45 弹回 1。 */
function levelUpBurst() {
    var p = state.player;
    state.growT = 1.2;
    addRing(p.x, p.y, Math.max(W, H) * 0.42, '#FFD166', 0.65);
    addRing(p.x, p.y, 130, '#FFFFFF', 0.4);
    addParticles(p.x, p.y, '#FFD166', 26, 1.7);
    addParticles(p.x, p.y, '#FFF3B0', 14, 1.2);
    state.flash = Math.max(state.flash, 0.5);
    state.shake = Math.max(state.shake, 0.14);
    addText(p.x, p.y - 34, '变强！Lv.' + state.level, '#E8A81E', 1.15);
    audio.level();
}

function gainXp(v) {
    var mul = 1 + upLv('bounty') * 0.18;
    state.xp += v * mul;
    while (state.xp >= state.xpNext) {
        state.xp -= state.xpNext;
        state.level += 1;
        state.xpNext = nextXp(state.level);
        state.pending += 1;
        levelUpBurst();
    }
    if (state.pending > 0 && state.mode === 'playing') { openLevelUp(); }
}

function rebuildOrbs() {
    var lv = upLv('orb');
    state.orbs = [];
    for (var i = 0; i < lv; i += 1) {
        state.orbs.push({ angle: 0, hit: Object.create(null), x: 0, y: 0 });
    }
}

/* ------------------------------------------------------------ 伤害与死亡 */
/* 当前角色身上穿的装备，把三个槽位的加成合到一起 */
function gearMods(charId) {
    var out = { atk: 0, hp: 0, dr: 0, speed: 0, crit: 0 };
    if (!save.gearEq) { return out; }
    var eq = save.gearEq[charId || save.char] || {};
    for (var k = 0; k < GEAR_SLOTS.length; k += 1) {
        var it = gearOf(eq[GEAR_SLOTS[k].id]);
        if (!it || !gearFits(it, charId || save.char)) { continue; }
        var m = it.mod || {};
        if (m.atk) { out.atk += m.atk; }
        if (m.hp) { out.hp += m.hp; }
        if (m.dr) { out.dr += m.dr; }
        if (m.speed) { out.speed += m.speed; }
        if (m.crit) { out.crit += m.crit; }
    }
    return out;
}

/* 怪物伤害减免：近战天生 MELEE_DR_BASE，格挡再往上加；装备另算 */
function playerDR() {
    var dr = 0;
    if (state && state.melee) {
        dr = Math.min(MELEE_DR_MAX, MELEE_DR_BASE + upLv('ward') * MELEE_DR_STEP);
    }
    var gm = (state && state.gearMod) ? state.gearMod : gearMods(state ? state.charId : save.char);
    dr += (gm.dr || 0);
    return Math.max(0, Math.min(0.55, dr));
}

/* 近战攻击范围系数（横扫） */
function meleeRangeMul() {
    return 1 + upLv('cleave') * 0.12;
}

/* 屏幕里有没有活着的敌人：没有就不开火 */
function enemyOnScreen() {
    if (!state) { return false; }
    var pad = 60;
    var x0 = state.cam.x - pad, y0 = state.cam.y - pad;
    var x1 = state.cam.x + W + pad, y1 = state.cam.y + H + pad;
    for (var i = 0; i < state.enemies.length; i += 1) {
        var e = state.enemies[i];
        if (e.dead) { continue; }
        if (e.x + e.r > x0 && e.x - e.r < x1 && e.y + e.r > y0 && e.y - e.r < y1) { return true; }
    }
    return false;
}

function playerDamageMul() {
    var gm = (state && state.gearMod) ? state.gearMod : gearMods(state ? state.charId : save.char);
    return state.player.dmgMul * (1 + upLv('power') * 0.15) * (1 + upLv('core') * 0.06) * (1 + shopLv('dmg') * 0.05) * (1 + (gm.atk || 0));
}

function rollCrit(dmg) {
    var gm = (state && state.gearMod) ? state.gearMod : gearMods(state ? state.charId : save.char);
    var c = upLv('crit') * 0.08 + (gm.crit || 0);
    if (c > 0 && Math.random() < c) {
        return { dmg: dmg * 2, crit: true };
    }
    return { dmg: dmg, crit: false };
}

/* ------------------------------------------------------------ 装备特效
   武器决定主特效，护甲饰品同属性时把强度抬一档、异属性则减半单独算。
   opts.sub 说明这次是"防具那一半"触发的，强度减半。 */
function hitFxColor() {
    var f = (state && state.fxOn) ? state.fxOn.main : 'none';
    return (GEAR_FX[f] && f !== 'none') ? GEAR_FX[f].color : '#FFFFFF';
}

function applyHitFx(e, dmg, opts) {
    if (!state || !state.fxOn) { return; }
    opts = opts || {};
    var order = [state.fxOn.main];
    var i, f, F, amp;
    for (i = 0; i < state.fxOn.subs.length; i += 1) {
        if (state.fxOn.subs[i] !== state.fxOn.main) { order.push(state.fxOn.subs[i]); }
    }

    for (i = 0; i < order.length; i += 1) {
        f = order[i];
        F = GEAR_FX[f];
        if (!F || f === 'none') { continue; }
        // 主属性被同系列装备加成过；副属性只有一半强度
        amp = (i === 0) ? state.fxOn.amp : 0.5;
        applyOneFx(e, dmg, F, amp, opts);
    }
}

function applyOneFx(e, dmg, F, amp, opts) {
    if (!e.dead) { addParticles(e.x, e.y, F.color, 3, 0.85); }

    // 持续伤害：灼烧 / 剧毒 / 湮灭
    if (F.dot) {
        if (!e.dot) { e.dot = { t: 0, dps: 0 }; }
        e.dot.t = Math.max(e.dot.t, 1.6 * amp);
        e.dot.dps = Math.max(e.dot.dps, dmg * 0.26 * F.dot * amp);
        e.dotColor = F.color;
    }
    // 减速：冰封 / 潮涌 / 湮灭
    if (F.chill) {
        var cv = Math.min(0.62, F.chill * amp);
        e.slow = Math.max(e.slow || 0, cv);
    }
    // 击退：疾风 / 潮涌
    if (F.knock) {
        var ang2 = Math.atan2(e.y - state.player.y, e.x - state.player.x);
        var push = (e.isBoss ? 60 : 190) * amp;
        e.kb.x += Math.cos(ang2) * push;
        e.kb.y += Math.sin(ang2) * push;
    }
    // 连锁：跳到附近另一只身上（严禁再连锁，否则会一路传导到整屏）
    if (F.chain && !opts.noChain) {
        var near = null, best = 150 * 150, d;
        for (var i = 0; i < state.enemies.length; i += 1) {
            var o = state.enemies[i];
            if (o === e || o.dead) { continue; }
            d = dist2(o.x, o.y, e.x, e.y);
            if (d < best) { best = d; near = o; }
        }
        if (near) {
            addLightning(e.x, e.y, near.x, near.y, F.color);
            damageEnemy(near, dmg * 0.45 * amp, F.color, { noChain: true });
        }
    }
    // 地面破坏：崩岩 / 星陨，0.2~0.3 秒内恢复原样
    if (F.quake) {
        addQuake(e.x, e.y, (26 + Math.min(30, dmg * 0.12)) * amp, F.color);
    }
    // 花语：小概率顺手回一点血
    if (F.heal && Math.random() < 0.07 * amp) {
        var heal = Math.min(6, Math.max(1, Math.round(state.player.maxHp * 0.02)));
        state.player.hp = Math.min(state.player.maxHp, state.player.hp + heal);
        addText(state.player.x, state.player.y - 30, '+' + heal, F.color, 0.8);
    }
}

function addLightning(x1, y1, x2, y2, color) {
    if (state.effects.length > 40) { return; }
    state.effects.push({
        type: 'bolt', x: x1, y: y1, x2: x2, y2: y2,
        life: 0.16, max: 0.16, color: color
    });
}

/* 地面的裂口：0.2~0.3 秒之内淡干净，之后地貌恢复如初 */
function addQuake(x, y, r, color) {
    if (!state || state.quakes.length > 26) { return; }
    state.quakes.push({
        x: x, y: y, r: r,
        life: rand(0.2, 0.3), t: 0,
        seed: rand(0, 1000),
        color: color || '#8A6438'
    });
}

function updateQuakes(dt) {
    if (!state) { return; }
    for (var i = state.quakes.length - 1; i >= 0; i -= 1) {
        var q = state.quakes[i];
        q.t += dt;
        if (q.t >= q.life) { state.quakes.splice(i, 1); }
    }
}

function damageEnemy(e, rawDmg, color, opt) {
    if (e.dead) { return; }

    // 处决：对残血目标额外增伤
    var execLv = upLv('execute');
    if (execLv > 0 && e.maxHp > 0 && e.hp / e.maxHp < (0.20 + execLv * 0.10)) {
        rawDmg *= 1.4 + execLv * 0.3;
    }

    var res = rollCrit(rawDmg);
    e.hp -= res.dmg;
    e.flash = 0.12;
    var show = (color === undefined || color === null) ? hitFxColor() : color;
    if (res.crit) {
        addText(e.x + rand(-5, 5), e.y - e.r - 6, Math.round(res.dmg) + '!', '#FFD166', 1.15);
        addParticles(e.x, e.y, '#FFD166', 3, 0.8);
    } else {
        addText(e.x + rand(-4, 4), e.y - e.r - 4, Math.round(res.dmg), show, 0.88);
    }
    applyHitFx(e, res.dmg, opt);
    audio.hit();
    if (e.hp <= 0) { killEnemy(e); }
}

function killEnemy(e) {
    if (e.dead) { return; }
    e.dead = true;
    state.kills += 1;
    state.score += e.isBoss ? 500 : 10 + Math.round(e.maxHp * 0.2);

    // 连斩：2.2 秒内持续击杀累积，整数关口给点奖励
    state.combo += 1;
    state.comboT = 2.2;
    if (state.combo > state.comboBest) { state.comboBest = state.combo; }
    if (state.combo === 10) { markEgg('combo'); }
    if (state.combo % 15 === 0) {
        state.score += state.combo * 5;
        state.player.hp = Math.min(state.player.maxHp, state.player.hp + 3);
        showToast(state.combo + ' 连斩 · 手感来了', '#FFD166', 1.5);
        audio.level();
    }

    if (e.isBoss) {
        state.bossN = (state.bossN || 0) + 1;
        addParticles(e.x, e.y, '#FFD166', 46, 2.4);
        addParticles(e.x, e.y, '#FFFFFF', 24, 1.8);
        addRing(e.x, e.y, 220, '#FFD166', 0.8);
        addRing(e.x, e.y, 130, '#FFFFFF', 0.55);
        state.shake = 1.0;
        state.flash = 1;
        state.slowmo = 0.9;
        audio.boom();
        for (var i = 0; i < 26; i += 1) {
            state.gems.push({
                x: e.x + rand(-50, 50), y: e.y + rand(-50, 50),
                v: 3, vx: rand(-90, 90), vy: rand(-90, 90), t: rand(0, 4)
            });
        }
        state.pickups.push({ x: e.x + 30, y: e.y, r: 13, t: 0, kind: 'heart' });
        state.pickups.push({ x: e.x - 30, y: e.y, r: 13, t: 0, kind: 'heart' });
        for (var bc = 0; bc < 34; bc += 1) {
            state.coins.push({
                x: e.x + rand(-30, 30), y: e.y + rand(-30, 30),
                v: 1, vx: rand(-120, 120), vy: rand(-120, 120), t: rand(0, 4)
            });
        }
        state.bossRef = null;
        state.phase = 'done';
        state.clearDelay = 2.0;
        return;
    }

    var def = ENEMIES[e.type];
    addParticles(e.x, e.y, def.color, 9, 1);
    addRing(e.x, e.y, e.r * 2.6, def.color, 0.32);
    audio.boom();

    var gems = e.type === 'shell' || e.type === 'elite' ? 3 : 1;
    if (def.gold) {
        gems = 9;
        markEgg('gold');
        showToast('金色蚱蜢！它把攒的运气都带走了', '#FFD24A', 2.2);
        state.score += 300;
        addParticles(e.x, e.y, '#FFD24A', 22, 1.8);
        addRing(e.x, e.y, 90, '#FFD24A', 0.5);
    }
    for (var g = 0; g < gems; g += 1) {
        state.gems.push({
            x: e.x + rand(-9, 9), y: e.y + rand(-9, 9),
            v: e.xp, vx: rand(-80, 80), vy: rand(-80, 80), t: rand(0, 4)
        });
    }

    // 孢子菇：倒下时炸出一圈毒泡
    if (def.poison) {
        for (var pb = 0; pb < 7; pb += 1) {
            var pba = (TAU / 7) * pb + rand(-0.2, 0.2);
            state.ebullets.push({
                x: e.x, y: e.y,
                vx: Math.cos(pba) * 105, vy: Math.sin(pba) * 105,
                r: 5.5, dmg: e.dmg * 0.5, life: 2.4, color: '#C77BB0'
            });
        }
        addRing(e.x, e.y, 62, '#C77BB0', 0.4);
    }

    if (e.type === 'split') {
        for (var s = 0; s < 2; s += 1) {
            var child = spawnEnemy('mite', e.x + rand(-16, 16), e.y + rand(-16, 16));
            child.r = 8; child.hp = 7; child.maxHp = 7; child.speed *= 1.3;
        }
    }

    if (upLv('leech') > 0) {
        var heal = upLv('leech') * 1.2;
        var p = state.player;
        p.hp = Math.min(p.maxHp, p.hp + heal);
    }

    // 连锁爆：小怪死亡时炸开，可以连锁但限层数
    var boomLv = upLv('boom');
    if (boomLv > 0 && !e.noBoom) {
        var bR = 32 + boomLv * 12;
        var bDmg = (9 + boomLv * 6) * playerDamageMul();
        addRing(e.x, e.y, bR, '#FF8A5C', 0.26);
        addParticles(e.x, e.y, '#FF8A5C', 4, 0.9);
        if ((e.boomDepth || 0) < 2) {
            for (var bi = 0; bi < state.enemies.length; bi += 1) {
                var bo = state.enemies[bi];
                if (bo === e || bo.dead) { continue; }
                if (dist2(bo.x, bo.y, e.x, e.y) < (bR + bo.r) * (bR + bo.r)) {
                    bo.noBoom = true;
                    bo.boomDepth = (e.boomDepth || 0) + 1;
                    damageEnemy(bo, bDmg, '#FFC0A8');
                    bo.noBoom = false;
                }
            }
        }
    }

    var dropChance = 0.024 + (e.type === 'elite' ? 0.3 : 0);
    if (Math.random() < dropChance) {
        state.pickups.push({ x: e.x, y: e.y, r: 11, t: 0, kind: 'heart' });
    }

    // 金币：普通怪零星掉，精英和金色怪一把一把掉
    var coinN = 0;
    if (def.gold) { coinN = 14; }
    else if (e.type === 'elite') { coinN = 8; }
    else if (Math.random() < 0.22) { coinN = (Math.random() < 0.3) ? 2 : 1; }
    for (var cnI = 0; cnI < coinN; cnI += 1) {
        state.coins.push({
            x: e.x + rand(-7, 7), y: e.y + rand(-7, 7),
            v: 1, vx: rand(-95, 95), vy: rand(-95, 95), t: rand(0, 4)
        });
    }
}

/* ------------------------------------------------------------ 敌人 */
var uidCounter = 1;

function spawnEnemy(type, x, y, hpBonus) {
    var t = ENEMIES[type];
    var lv = state.levelDef;
    var timeMul = 1 + state.time * 0.010;
    var hp = t.hp * lv.hpMul * timeMul * (hpBonus || 1);
    var e = {
        uid: uidCounter++,
        type: type,
        x: x, y: y,
        r: t.r,
        hp: hp, maxHp: hp,
        // 随时间小幅提速，但封顶 1.22 倍；不然后期老怪的腿比新怪还快
        // 竖屏视野窄、留给玩家的反应距离短，怪的接近速度再压一档，横屏保持原样
        speed: t.speed * Math.min(1.22, 1 + state.time * 0.0012) * (LAND ? 1 : 0.86),
        dmg: t.dmg * lv.dmgMul * (1 + state.time * 0.0024),
        xp: t.xp,
        flash: 0,
        t: rand(0, 10),
        kb: { x: 0, y: 0 },
        orbCd: 0,
        slow: 0,
        spawnT: 0.28,
        atkCd: rand(1.2, 2.6),
        fuse: 0,
        dead: false
    };
    state.enemies.push(e);
    return e;
}

function spawnPoint() {
    var p = state.player;
    var radius = Math.max(W, H) * 0.55 + 50;
    var a;

    var mvLen = Math.sqrt(p.vx * p.vx + p.vy * p.vy);
    if (mvLen > 0.2 && Math.random() < 0.62) {
        // 六成敌人拦在逃跑方向的前方扇形里，形成真正的包围
        var base = Math.atan2(p.vy, p.vx);
        a = base + rand(-1.05, 1.05);
        radius *= rand(0.72, 1.0);
    } else {
        a = rand(0, TAU);
    }

    return {
        x: p.x + Math.cos(a) * radius,
        y: p.y + Math.sin(a) * radius
    };
}

function poolAt(t) {
    var arr = [];
    var pool = state.levelDef.pool;
    for (var i = 0; i < pool.length; i += 1) {
        if (t >= pool[i].t) { arr.push(pool[i].e, pool[i].e); }
    }
    if (!arr.length) { arr.push('mite'); }
    return arr;
}

function spawnWave() {
    if (state.phase !== 'wave') { return; }
    var room = 120 - state.enemies.length;
    if (room <= 0) { return; }

    var t = state.time;
    var lv = state.levelDef;
    // 每波数量随关卡推进连续增长。小数部分用累加器攒，攒够一只就多刷一只：
    // 比按概率掷骰更稳，不会因为随机导致忽然涌出一群。
    var growth = t / 58 * (lv.spawnMul || 1);
    var whole = Math.floor(growth);
    state.spawnFrac = (state.spawnFrac || 0) + (growth - whole);
    var extra = 0;
    if (state.spawnFrac >= 1) { state.spawnFrac -= 1; extra = 1; }
    var count = 1 + whole + extra;
    count = Math.min(room, count, 5);

    var pool = poolAt(t);
    for (var i = 0; i < count; i += 1) {
        var pt = spawnPoint();
        spawnEnemy(pick(pool), pt.x, pt.y);
    }

    // 彩蛋：偶尔窜出一只金色蚱蜢，抓到就是一笔横财
    if (state.goldSpawned < 3 && state.goldCd <= 0) {
        state.goldSpawned += 1;
        state.goldCd = 46;
        var gp = spawnPoint();
        var gm = spawnEnemy('goldmite', gp.x, gp.y);
        gm.life = 20;
        showToast('草丛里窜出个金光闪闪的东西', '#B8860B', 2.0);
    }
}

/* ------------------------------------------------------------ BOSS */
function spawnBoss() {
    var bd = BOSSES[state.levelDef.boss];
    var pt = spawnPoint();
    var mul = 0.55;
    var boss = spawnEnemy('mite', pt.x, pt.y);
    // 改成 BOSS 数据
    boss.type = 'boss';
    boss.isBoss = true;
    boss.shape = bd.shape;
    boss.name = bd.name;
    boss.r = bd.r;
    boss.hp = bd.hp * (0.62 + (state.levelDef.hpMul || 1) * 0.5);
    boss.maxHp = boss.hp;
    boss.speed = bd.speed;
    boss.dmg = bd.dmg;
    boss.xp = bd.xp;
    boss.color = bd.color;
    boss.dark = bd.dark;
    boss.patterns = bd.patterns.slice();
    boss.patternIdx = 0;
    boss.patCd = 2.2;
    boss.burst = 0;
    boss.burstCd = 0;
    boss.dashV = 0;
    boss.dashDir = 0;
    boss.phaseNo = 1;
    boss.spawnT = 0.9;
    boss.turn = 0;
    state.bossRef = boss;
    state.phase = 'boss';
    state.bossSpawned = true;
    state.shake = 0.9;
    state.flash = 0.6;
    addText(boss.x, boss.y - 50, bd.name, '#FF4D6D', 1.7);
    addRing(boss.x, boss.y, 200, bd.color, 0.7);
    audio.boom();
}

function bossFireRing(boss, count, speed, offset) {
    var base = offset || 0;
    for (var i = 0; i < count; i += 1) {
        var a = base + (TAU / count) * i;
        state.ebullets.push({
            x: boss.x, y: boss.y,
            vx: Math.cos(a) * speed, vy: Math.sin(a) * speed,
            r: 6, dmg: boss.dmg * 0.55, life: 3.4,
            color: boss.color
        });
    }
    audio.hit();
}

/* 首领有没有走进画面 */
function bossOnScreen(b) {
    if (!state || !b) { return false; }
    var pad = 40;
    return b.x + b.r > state.cam.x - pad && b.x - b.r < state.cam.x + W + pad &&
        b.y + b.r > state.cam.y - pad && b.y - b.r < state.cam.y + H + pad;
}

function updateBoss(boss, dt) {
    // 没进画面之前只管赶路，不放技能也不掉血
    if (!boss.engaged) {
        if (boss.spawnT > 0) { boss.spawnT -= dt; return; }
        if (!bossOnScreen(boss)) {
            var bx = state.player.x - boss.x;
            var by = state.player.y - boss.y;
            var bd = Math.sqrt(bx * bx + by * by) || 1;
            boss.x += (bx / bd) * boss.speed * 1.35 * dt;
            boss.y += (by / bd) * boss.speed * 1.35 * dt;
            if (boss.patterns) { boss.patCd = Math.max(boss.patCd, 0.8); }
            return;
        }
        boss.engaged = true;
        addText(boss.x, boss.y - 66, '发现你', '#FF4D6D', 1.3);
    }
    var p = state.player;
    var dx = p.x - boss.x;
    var dy = p.y - boss.y;
    var d = Math.sqrt(dx * dx + dy * dy) || 1;

    // 阶段变化
    var ratio = boss.hp / boss.maxHp;
    var wantPhase = ratio > 0.66 ? 1 : (ratio > 0.33 ? 2 : 3);
    if (wantPhase > boss.phaseNo) {
        boss.phaseNo = wantPhase;
        boss.shakeT = 0.5;
        state.shake = 0.5;
        addRing(boss.x, boss.y, 150, '#FFFFFF', 0.5);
        addText(boss.x, boss.y - 60, '第 ' + boss.phaseNo + ' 阶段', '#FFD166', 1.2);
    }
    var speedUp = 1 + (boss.phaseNo - 1) * 0.22;

    // 冲刺中
    if (boss.dashV > 0) {
        boss.x += Math.cos(boss.dashDir) * boss.dashV * dt;
        boss.y += Math.sin(boss.dashDir) * boss.dashV * dt;
        boss.dashV -= 620 * dt;
        if (boss.dashV < 0) { boss.dashV = 0; }
        if (Math.random() < 0.5) {
            addParticles(boss.x, boss.y + boss.r * 0.5, boss.color, 1, 0.5);
        }
    } else {
        var moveSpeed = boss.speed * speedUp;
        boss.x += (dx / d) * moveSpeed * dt;
        boss.y += (dy / d) * moveSpeed * dt;
    }

    // 连续弹幕
    if (boss.burst > 0) {
        boss.burstCd -= dt;
        if (boss.burstCd <= 0) {
            boss.burst -= 1;
            boss.burstCd = 0.13;
            var ba = Math.atan2(dy, dx) + rand(-0.24, 0.24);
            state.ebullets.push({
                x: boss.x, y: boss.y,
                vx: Math.cos(ba) * 250, vy: Math.sin(ba) * 250,
                r: 5, dmg: boss.dmg * 0.45, life: 3.2, color: boss.color
            });
        }
    }

    // 攻击模式
    boss.patCd -= dt;
    if (boss.patCd <= 0) {
        var pat = boss.patterns[boss.patternIdx % boss.patterns.length];
        boss.patternIdx += 1;
        var cd = 2.6 / speedUp;

        if (pat === 'ring') {
            bossFireRing(boss, 10 + boss.phaseNo * 3, 150 + boss.phaseNo * 18, rand(0, TAU));
            cd = 2.3 / speedUp;
        } else if (pat === 'charge') {
            boss.dashDir = Math.atan2(dy, dx);
            boss.dashV = 620 + boss.phaseNo * 60;
            state.shake = 0.25;
            cd = 2.4 / speedUp;
        } else if (pat === 'summon') {
            for (var s = 0; s < 2 + boss.phaseNo; s += 1) {
                var a2 = rand(0, TAU);
                var pt2 = { x: boss.x + Math.cos(a2) * 70, y: boss.y + Math.sin(a2) * 70 };
                var minion = spawnEnemy(pick(['mite', 'wisp', 'charger']), pt2.x, pt2.y);
                minion.spawnT = 0.3;
            }
            addRing(boss.x, boss.y, 110, '#FFB03A', 0.4);
            cd = 3.2 / speedUp;
        } else if (pat === 'spiral') {
            boss.burst = 10 + boss.phaseNo * 5;
            boss.burstCd = 0;
            boss.spiralA = rand(0, TAU);
            cd = 3.0 / speedUp;
        }
        boss.patCd = cd;
    }
}

/* ------------------------------------------------------------ 武器 */
function nearestEnemy(x, y, maxDist, exclude) {
    var best = null;
    var bd = (maxDist || 99999) * (maxDist || 99999);
    for (var i = 0; i < state.enemies.length; i += 1) {
        var e = state.enemies[i];
        if (e.dead) { continue; }
        if (exclude && exclude.indexOf(e) >= 0) { continue; }
        var d = dist2(x, y, e.x, e.y);
        if (d < bd) { bd = d; best = e; }
    }
    return best;
}

function hasteMul() {
    var h = upLv('haste') * 0.07 + upLv('overclock') * 0.04;
    return Math.max(0.30, 1 - h);
}

function fireDarts() {
    var lv = upLv('dart');
    if (lv <= 0) { return; }
    var volley = upLv('volley');
    var n = 1 + Math.floor((lv - 1) / 2) + volley;
    var dmg = (8 + lv * 3) * playerDamageMul();
    var p = state.player;
    var used = [];
    for (var i = 0; i < n; i += 1) {
        var target = nearestEnemy(p.x, p.y, 640, used);
        if (!target) {
            target = null;
        }
        if (target) { used.push(target); }
        var a = target ? Math.atan2(target.y - p.y, target.x - p.x) : rand(0, TAU);
        state.bullets.push({
            x: p.x, y: p.y,
            vx: Math.cos(a) * 560, vy: Math.sin(a) * 560,
            r: 6, dmg: dmg, pierce: 2, life: 1.3,
            hitSet: [], kind: 'dart', color: '#FFC35C'
        });
    }
}

function fireBlades() {
    var lv = upLv('blade');
    if (lv <= 0) { return; }
    var n = 1 + Math.floor(lv / 2) + upLv('volley');
    var dmg = (12 + lv * 4) * playerDamageMul();
    var p = state.player;
    var used = [];
    for (var i = 0; i < n; i += 1) {
        var target = nearestEnemy(p.x, p.y, 520, used);
        if (target) { used.push(target); }
        var a = target ? Math.atan2(target.y - p.y, target.x - p.x) + rand(-0.18, 0.18) : rand(0, TAU);
        state.bullets.push({
            x: p.x, y: p.y,
            vx: Math.cos(a) * 400, vy: Math.sin(a) * 400,
            r: 9, dmg: dmg, pierce: 99, life: 1.6,
            hitSet: [], kind: 'blade', color: '#7CFFB2',
            boomerang: true, bt: 0, spin: 0
        });
    }
}

function fireNova() {
    var lv = upLv('nova');
    if (lv <= 0) { return; }
    var radius = 72 + lv * 16;
    var dmg = (10 + lv * 5) * playerDamageMul();
    var p = state.player;
    addRing(p.x, p.y, radius, '#FFB84D', 0.45);
    for (var i = 0; i < state.enemies.length; i += 1) {
        var e = state.enemies[i];
        if (e.dead) { continue; }
        if (dist2(p.x, p.y, e.x, e.y) < (radius + e.r) * (radius + e.r)) {
            damageEnemy(e, dmg, '#FFD48A');
            var ang = Math.atan2(e.y - p.y, e.x - p.x);
            e.kb.x += Math.cos(ang) * 180;
            e.kb.y += Math.sin(ang) * 180;
        }
    }
    audio.boom();
}

function fireBolt() {
    var lv = upLv('bolt');
    if (lv <= 0) { return; }
    var strikes = 1 + lv;
    var dmg = (13 + lv * 6) * playerDamageMul();
    var p = state.player;
    var used = [];
    for (var i = 0; i < strikes; i += 1) {
        var target = nearestEnemy(p.x, p.y, 520, used);
        if (!target) { break; }
        used.push(target);
        var pts = [{ x: target.x, y: target.y - 300 }];
        for (var s = 1; s < 5; s += 1) {
            pts.push({
                x: target.x + rand(-18, 18),
                y: target.y - 300 + 300 * (s / 5) + rand(-10, 10)
            });
        }
        pts.push({ x: target.x, y: target.y });
        state.effects.push({ type: 'zap', pts: pts, life: 0.24, max: 0.24, color: '#8FD6FF' });
        damageEnemy(target, dmg, '#BFE9FF');
        addParticles(target.x, target.y, '#8FD6FF', 7, 1);
    }
}

function fireLance() {
    var lv = upLv('lance');
    if (lv <= 0) { return; }
    var p = state.player;
    var target = nearestEnemy(p.x, p.y, 700);
    if (!target) { return; }
    var a = Math.atan2(target.y - p.y, target.x - p.x);
    // 长度只比目标远一截，不再一路捅到屏幕外
    var len = clamp(Math.sqrt(dist2(p.x, p.y, target.x, target.y)) + 160, 240, 620);
    var wdt = 9 + lv * 2;
    var dmg = (16 + lv * 7) * playerDamageMul();
    var ex = p.x + Math.cos(a) * len;
    var ey = p.y + Math.sin(a) * len;

    state.effects.push({
        type: 'beam', x1: p.x, y1: p.y, x2: ex, y2: ey,
        life: 0.22, max: 0.22, color: '#FF7BD5', w: 7 + lv * 1.2,
        leaf: 1 + Math.floor(lv / 2)
    });

    for (var i = 0; i < state.enemies.length; i += 1) {
        var e = state.enemies[i];
        if (e.dead) { continue; }
        if (segDist(p.x, p.y, ex, ey, e.x, e.y) < e.r + wdt * 0.5) {
            damageEnemy(e, dmg, '#FFB3E8');
        }
    }
    audio.hit();
}

function segDist(x1, y1, x2, y2, px, py) {
    var dx = x2 - x1, dy = y2 - y1;
    var l2 = dx * dx + dy * dy;
    if (l2 === 0) { return Math.sqrt(dist2(px, py, x1, y1)); }
    var t = clamp(((px - x1) * dx + (py - y1) * dy) / l2, 0, 1);
    return Math.sqrt(dist2(px, py, x1 + dx * t, y1 + dy * t));
}

function placeMines() {
    var lv = upLv('mine');
    if (lv <= 0) { return; }
    var count = 1 + Math.floor(lv / 2);
    var p = state.player;
    for (var i = 0; i < count; i += 1) {
        var a = rand(0, TAU);
        var r = rand(30, 90);
        state.mines.push({
            x: p.x + Math.cos(a) * r,
            y: p.y + Math.sin(a) * r,
            r: 60 + lv * 10,
            dmg: (20 + lv * 8) * playerDamageMul(),
            t: 1.0, max: 1.0, armed: true
        });
    }
}


/* ---- 回响：概率再触发一次 ---- */
function withEcho(fn) {
    fn();
    var lv = upLv('echo');
    if (lv > 0 && Math.random() < (0.12 + lv * 0.11)) { fn(); }
}

function spawnZap(x1, y1, x2, y2, color) {
    var pts = [{ x: x1, y: y1 }];
    var steps = 4;
    for (var i = 1; i < steps; i += 1) {
        var k = i / steps;
        pts.push({
            x: x1 + (x2 - x1) * k + rand(-14, 14),
            y: y1 + (y2 - y1) * k + rand(-14, 14)
        });
    }
    pts.push({ x: x2, y: y2 });
    state.effects.push({ type: 'zap', pts: pts, life: 0.22, max: 0.22, color: color });
}

/* ---- 连锁闪电 ---- */
function fireChain() {
    var lv = upLv('chain');
    if (lv <= 0) { return; }
    var p = state.player;
    var cur = nearestEnemy(p.x, p.y, 560);
    if (!cur) { return; }
    var jumps = 2 + lv;
    var dmg = (10 + lv * 5) * playerDamageMul();
    var used = [];
    var fx = p.x, fy = p.y;
    for (var i = 0; i < jumps && cur; i += 1) {
        spawnZap(fx, fy, cur.x, cur.y, '#8FD6FF');
        addParticles(cur.x, cur.y, '#8FD6FF', 3, 0.8);
        damageEnemy(cur, dmg, '#BFE9FF');
        used.push(cur);
        fx = cur.x; fy = cur.y;
        dmg *= 0.86;
        cur = nearestEnemy(fx, fy, 185, used);
    }
    audio.hit();
}

/* ---- 冲击波 ---- */
/* ---- 熊掌砸地（近战专属起手）---- */
function fireSlam() {
    var lv = upLv('slam');
    if (lv <= 0) { return; }
    var p = state.player;
    var radius = (84 + lv * 18) * meleeRangeMul();
    var dmg = (16 + lv * 8) * playerDamageMul();
    addRing(p.x, p.y, radius * 0.7, '#C9A87C', 0.28);
    addRing(p.x, p.y, radius, '#E8D3AE', 0.42);
    addParticles(p.x, p.y, '#C9A87C', 12, 1.3);

    for (var i = 0; i < state.enemies.length; i += 1) {
        var e = state.enemies[i];

        if (d > (radius + e.r) * (radius + e.r)) { continue; }
        damageEnemy(e, dmg, '#FFE8C4');
        var ang = Math.atan2(e.y - p.y, e.x - p.x);
        var push = e.isBoss ? 120 : 300;
        e.kb.x = Math.cos(ang) * push;
        e.kb.y = Math.sin(ang) * push;
    }

}

function fireShock() {

    if (lv <= 0) { return; }

    var radius = (100 + lv * 22) * (state.melee ? meleeRangeMul() : 1);
    var dmg = (12 + lv * 7) * playerDamageMul();
    addRing(p.x, p.y, radius, '#FFC35C', 0.40);
    addParticles(p.x, p.y, '#FFC35C', 9, 1.2);

    for (var i = 0; i < state.enemies.length; i += 1) {
        var e = state.enemies[i];

        if (dist2(p.x, p.y, e.x, e.y) < (radius + e.r) * (radius + e.r)) {

            e.kb.x += Math.cos(a) * 420;
            e.kb.y += Math.sin(a) * 420;
        }
    }
    audio.boom();
}

/* ---- 引力井 ---- */
function placeHole() {
    var lv = upLv('hole');
    if (lv <= 0) { return; }
    var p = state.player;
    var target = nearestEnemy(p.x, p.y, 460);
    var hx = target ? target.x : p.x + rand(-70, 70);
    var hy = target ? target.y : p.y + rand(-70, 70);
    state.holes.push({
        x: hx, y: hy,
        r: 130 + lv * 14,
        t: 2.6, max: 2.6,
        dps: (6 + lv * 4) * playerDamageMul()
    });
}

function updateHoles(dt) {
    for (var i = state.holes.length - 1; i >= 0; i -= 1) {
        var h = state.holes[i];
        h.t -= dt;
        if (h.t <= 0) { state.holes.splice(i, 1); continue; }
        for (var j = 0; j < state.enemies.length; j += 1) {
            var e = state.enemies[j];
            if (e.dead) { continue; }
            var d2 = dist2(h.x, h.y, e.x, e.y);
            if (d2 < (h.r + e.r) * (h.r + e.r)) {
                var d = Math.sqrt(d2) || 1;
                e.x += (h.x - e.x) / d * 190 * dt;
                e.y += (h.y - e.y) / d * 190 * dt;
                e.holeTick = (e.holeTick || 0) + dt;
                if (e.holeTick > 0.4) {
                    e.holeTick = 0;
                    damageEnemy(e, h.dps * 0.4, '#D9B8FF');
                }
            }
        }
    }
}

/* ---- 僚机 ---- */
function rebuildDrones() {
    var lv = upLv('drone');
    state.drones = [];
    var n = Math.max(1, lv);
    for (var i = 0; i < lv; i += 1) {
        state.drones.push({ angle: (TAU / n) * i, cd: rand(0, 0.7), x: 0, y: 0 });
    }
}

function updateDrones(dt) {
    var lv = upLv('drone');
    if (lv <= 0) { if (state.drones.length) { state.drones = []; } return; }
    if (state.drones.length !== lv) { rebuildDrones(); }

    var p = state.player;
    var dmg = (7 + lv * 3) * playerDamageMul();
    for (var i = 0; i < state.drones.length; i += 1) {
        var d = state.drones[i];
        var a = state.orbAngle * 0.7 + (TAU / state.drones.length) * i;
        d.x = p.x + Math.cos(a) * 48;
        d.y = p.y + Math.sin(a) * 34 - 10;
        d.cd -= dt;
        if (d.cd > 0) { continue; }
        var target = nearestEnemy(d.x, d.y, 440);
        if (!target) { d.cd = 0.2; continue; }
        d.cd = 0.85 - lv * 0.06;
        var ang = Math.atan2(target.y - d.y, target.x - d.x);
        state.bullets.push({
            x: d.x, y: d.y,
            vx: Math.cos(ang) * 520, vy: Math.sin(ang) * 520,
            r: 4.5, dmg: dmg, pierce: 1, life: 1.1,
            hitSet: [], kind: 'drone', color: '#7CFFB2'
        });
    }
}

function updateOrbs(dt) {
    var lv = upLv('orb');
    if (lv <= 0) { state.orbs = []; return; }
    if (state.orbs.length !== lv) { rebuildOrbs(); }

    var p = state.player;
    var radius = (46 + lv * 6) * (state.melee ? meleeRangeMul() : 1);
    var dmg = (6 + lv * 2) * playerDamageMul();
    state.orbAngle += dt * 2.4;

    for (var i = 0; i < state.orbs.length; i += 1) {
        var orb = state.orbs[i];
        orb.angle = state.orbAngle + (TAU / state.orbs.length) * i;
        orb.x = p.x + Math.cos(orb.angle) * radius;
        orb.y = p.y + Math.sin(orb.angle) * radius * 0.82;

        for (var j = 0; j < state.enemies.length; j += 1) {
            var e = state.enemies[j];
            if (e.dead) { continue; }
            if (orb.hit[e.uid] > 0) { continue; }
            var rr = 13 + e.r;
            if (dist2(orb.x, orb.y, e.x, e.y) < rr * rr) {
                orb.hit[e.uid] = 0.4;
                damageEnemy(e, dmg, '#9AD7FF');
            }
        }
        for (var k in orb.hit) {
            if (orb.hit[k] > 0) {
                orb.hit[k] -= dt;
                if (orb.hit[k] <= 0) { delete orb.hit[k]; }
            }
        }
    }
}

function updateHalo(dt) {
    var lv = upLv('halo');
    if (lv <= 0) { return; }
    var p = state.player;
    var radius = 92 + lv * 18;
    var slow = Math.min(0.62, 0.22 + lv * 0.05);
    var dps = (2 + lv * 1.6) * playerDamageMul();
    for (var i = 0; i < state.enemies.length; i += 1) {
        var e = state.enemies[i];
        if (e.dead) { continue; }
        if (dist2(p.x, p.y, e.x, e.y) < (radius + e.r) * (radius + e.r)) {
            e.slow = Math.max(e.slow, slow);
            e.haloTick = (e.haloTick || 0) + dt;
            if (e.haloTick > 0.5) {
                e.haloTick = 0;
                damageEnemy(e, dps * 0.5, '#6BE0FF');
            }
        }
    }
}

/* ------------------------------------------------------------ 玩家受击 */
function hurtPlayer(dmg, fromX, fromY) {
    var p = state.player;
    if (p.iframe > 0 || state.mode !== 'playing') { return; }

    if (p.shield > 0) {
        p.shield -= 1;
        p.iframe = 0.8;
        addRing(p.x, p.y, 46, '#5CC8FF', 0.4);
        addText(p.x, p.y - 28, '护盾', '#5CC8FF', 1.1);
        audio.hit();
        return;
    }

    // 血量基准改成 100 之后，敌方伤害同比缩放，再乘上减伤
    var dr = playerDR();
    var taken = Math.max(1, Math.round((dmg - upLv('armor')) * DMG_SCALE * (1 - dr)));
    p.hp -= taken;
    p.iframe = 0.95;
    p.hurt = 1;
    state.hits = (state.hits || 0) + 1;
    state.shake = 0.35;
    state.flash = 0.7;
    state.hurtVig = 1;
    addText(p.x, p.y - 28, '-' + Math.round(taken), '#FF5D73', 1.2);
    addParticles(p.x, p.y, '#FF5D73', 10, 1.1);
    audio.hurt();

    // 反击（近战专属）：挨打时朝最近的敌人回敬一下
    var ripLv = upLv('riposte');
