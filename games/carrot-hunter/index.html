    if (ripLv > 0 && state.melee) {
        var rt = nearestEnemy(p.x, p.y, 460);
        if (rt) {
            spawnZap(p.x, p.y, rt.x, rt.y, '#D9B8FF');
            damageEnemy(rt, (18 + ripLv * 14) * playerDamageMul(), '#E6CCFF');
        }
    }

    // 尖刺：被击中时反击周围
    var thornLv = upLv('thorns');
    if (thornLv > 0) {
        var tR = 120;
        var tDmg = (14 + thornLv * 9) * playerDamageMul();
        addRing(p.x, p.y, tR, '#B06BFF', 0.3);
        for (var th = 0; th < state.enemies.length; th += 1) {
            var te = state.enemies[th];
            if (te.dead) { continue; }
            if (dist2(p.x, p.y, te.x, te.y) < (tR + te.r) * (tR + te.r)) {
                damageEnemy(te, tDmg, '#D9B8FF');
            }
        }
    }

    // 登记清弹请求：不在这里改数组，避免打断外层正在进行的遍历
    state.clearBulletAt = { x: p.x, y: p.y, r: 130 };

    // 受击把小怪震开，避免被贴死
    if (fromX !== undefined) {
        var ang = Math.atan2(p.y - fromY, p.x - fromX);
        for (var i = 0; i < state.enemies.length; i += 1) {
            var e = state.enemies[i];
            if (dist2(p.x, p.y, e.x, e.y) < 90 * 90) {
                e.kb.x += Math.cos(ang) * 320;
                e.kb.y += Math.sin(ang) * 320;
            }
        }
    }

    if (p.hp <= 0) {
        p.hp = 0;
        endRun(false);
    }
}

/* ------------------------------------------------------------ 更新 */
function addParticles(x, y, color, count, power) {
    if (state.particles.length > 240) { return; }
    for (var i = 0; i < count; i += 1) {
        var a = rand(0, TAU);
        var sp = rand(40, 170) * (power || 1);
        state.particles.push({
            x: x, y: y,
            vx: Math.cos(a) * sp,
            vy: Math.sin(a) * sp - 40,
            life: rand(0.24, 0.62),
            max: 0.62,
            r: rand(1.4, 3.6),
            color: color
        });
    }
}

function addText(x, y, text, color, scale) {
    if (state.texts.length > 70) { return; }
    state.texts.push({
        x: x, y: y, text: String(text), color: color || '#FFFFFF',
        life: 0.8, max: 0.8, size: (scale || 1) * 14
    });
}

function addRing(x, y, maxR, color, dur) {
    if (state.effects.length > 40) { return; }
    state.effects.push({
        type: 'ring', x: x, y: y, r: 6, maxR: maxR,
        life: dur || 0.4, max: dur || 0.4, color: color
    });
}

function update(dt) {
    var p = state.player;
    var lv = state.levelDef;

    // 家园作物：只要游戏开着就一直长（出猎/夺宝/蹲家园都算）
    updateHomeGrowth(dt);

    // 夺宝与家园走自己的更新链路
    if (state.treasure) { updateTreasure(dt); return; }
    if (state.home) { updateHome(dt); return; }

    state.time += dt;
    state.shake = Math.max(0, state.shake - dt * 1.6);
    state.flash = Math.max(0, state.flash - dt * 2.4);
    state.hurtVig = Math.max(0, state.hurtVig - dt * 1.6);
    state.tipTimer = Math.max(0, state.tipTimer - dt);
    state.slowmo = Math.max(0, state.slowmo - dt);
    state.growT = Math.max(0, (state.growT || 0) - dt);
    updateQuakes(dt);

    // 连斩窗口：2.2 秒内没有新击杀就断
    if (state.comboT > 0) {
        state.comboT -= dt;
        if (state.comboT <= 0) { state.combo = 0; state.comboT = 0; }
    }
    state.goldCd = Math.max(0, state.goldCd - dt);

    // 地图特色（阵风 / 溪水 / 孢子 / 落石 / 树心）
    updateGimmick(dt);

    // 随机事件：一局里来个两三次，只是气氛，不刷怪
    if (state.eventCd > 0) {
        state.eventCd -= dt;
        if (state.eventCd <= 0 && state.phase === 'wave' && state.time > 22) { triggerEvent(); }
    }
    if (state.event) {
        state.event.t -= dt;
        if (state.event.kind === 'wind' && state.event.t > 0) {
            for (var wI = 0; wI < state.enemies.length; wI += 1) {
                state.enemies[wI].slow = Math.max(state.enemies[wI].slow || 0, 0.55);
            }
        }
        if (state.event.t <= 0) { state.event = null; }
    }

    if (state.toastT > 0) { state.toastT -= dt; }

    /* ---------------- 移动 */
    var kx = 0, ky = 0;
    if (input.keys['a'] || input.keys['arrowleft']) { kx -= 1; }
    if (input.keys['d'] || input.keys['arrowright']) { kx += 1; }
    if (input.keys['w'] || input.keys['arrowup']) { ky -= 1; }
    if (input.keys['s'] || input.keys['arrowdown']) { ky += 1; }
    if (input.joyActive && input.mag > 0.12) {
        kx += input.dx; ky += input.dy;
    }
    var kl = Math.sqrt(kx * kx + ky * ky);
    if (kl > 1) { kx /= kl; ky /= kl; }

    var speed = p.speed * (1 + upLv('speed') * 0.08) * (state.gim ? state.gim.speedMul : 1);
    p.x += kx * speed * dt;
    p.y += ky * speed * dt;
    if (Math.abs(kx) > 0.05) { p.face = kx > 0 ? 1 : -1; }
    if (kl > 0.08) { p.vx = kx; p.vy = ky; }
    p.walk += dt * (kl > 0.05 ? 10 : 3);

    // 拖影
    p.trail.push({ x: p.x, y: p.y, t: 0 });
    if (p.trail.length > 10) { p.trail.shift(); }
    for (var ti = 0; ti < p.trail.length; ti += 1) { p.trail[ti].t += dt; }

    p.iframe = Math.max(0, p.iframe - dt);
    p.hurt = Math.max(0, p.hurt - dt * 3);

    // 再生与护盾
    if (upLv('regen') > 0 && p.hp < p.maxHp) {
        p.hp = Math.min(p.maxHp, p.hp + upLv('regen') * 0.7 * dt);
    }
    if (upLv('guard') > 0) {
        p.shieldCd -= dt;
        if (p.shieldCd <= 0 && p.shield < 1) {
            p.shield = 1;
            p.shieldCd = guardInterval();
            addRing(p.x, p.y, 40, '#5CC8FF', 0.35);
        }
    }

    // 相机
    state.cam.x += ((p.x - W / 2) - state.cam.x) * Math.min(1, dt * 7);
    state.cam.y += ((p.y - H / 2) - state.cam.y) * Math.min(1, dt * 7);

    /* ---------------- 武器（屏幕里没有怪就不出手） */
    var hm = hasteMul();
    var live = enemyOnScreen();
    state.cd.dart -= dt;
    if (state.cd.dart <= 0) {
        if (upLv('dart') > 0 && live) { withEcho(fireDarts); }
        state.cd.dart = (0.66 - 0.05 * (upLv('dart') - 1)) * hm;
    }
    state.cd.nova -= dt;
    if (state.cd.nova <= 0) {
        if (upLv('nova') > 0 && live) { withEcho(fireNova); }
        state.cd.nova = (2.3 - upLv('nova') * 0.16) * hm;
    }
    state.cd.bolt -= dt;
    if (state.cd.bolt <= 0) {
        if (upLv('bolt') > 0 && live) { withEcho(fireBolt); }
        state.cd.bolt = (2.1 - upLv('bolt') * 0.13) * hm;
    }
    state.cd.blade -= dt;
    if (state.cd.blade <= 0) {
        if (upLv('blade') > 0 && live) { withEcho(fireBlades); }
        state.cd.blade = (1.7 - upLv('blade') * 0.13) * hm;
    }
    state.cd.lance -= dt;
    if (state.cd.lance <= 0) {
        if (upLv('lance') > 0 && live) { withEcho(fireLance); }
        state.cd.lance = (1.9 - upLv('lance') * 0.12) * hm;
    }
    state.cd.mine -= dt;
    if (state.cd.mine <= 0) {
        if (upLv('mine') > 0 && live) { withEcho(placeMines); }
        state.cd.mine = (2.7 - upLv('mine') * 0.15) * hm;
    }
    state.cd.chain -= dt;
    if (state.cd.chain <= 0) {
        if (upLv('chain') > 0 && live) { withEcho(fireChain); }
        state.cd.chain = (2.2 - upLv('chain') * 0.14) * hm;
    }
    state.cd.shock -= dt;
    if (state.cd.shock <= 0) {
        if (upLv('shock') > 0 && live) { withEcho(fireShock); }
        state.cd.shock = (3.2 - upLv('shock') * 0.18) * hm;
    }
    state.cd.hole -= dt;
    if (state.cd.hole <= 0) {
        if (upLv('hole') > 0 && live) { placeHole(); }
        state.cd.hole = (6.4 - upLv('hole') * 0.4) * hm;
    }
    updateOrbs(dt);
    updateHalo(dt);
    updateDrones(dt);
    updateHoles(dt);

    /* ---------------- 关卡流程 */
    if (state.phase === 'wave') {
        state.spawnTimer -= dt;
        if (state.spawnTimer <= 0) {
            spawnWave();
            // 波间隔按关卡进度线性收紧，不再用"敌人一多就整段变慢 1.75 倍"的硬开关
            var ramp = clamp(state.time / lv.duration, 0, 1);
            var base = (0.98 - 0.44 * ramp) / lv.spawnMul;
            var crowd = clamp((state.enemies.length - 42) / 30, 0, 1);
            base *= 1 + crowd * 0.7;
            state.spawnTimer = base;
        }
        if (state.time >= lv.duration) {
            state.bossWarn = 2.0;
            showToast('精英信号接近', '#FF4D6D', 2.0);
            spawnBoss();
        }
    }
    if (state.phase === 'done') {
        state.clearDelay -= dt;
        if (state.clearDelay <= 0) {
            state.clearDelay = 0;
            endRun(true);
            return;
        }
    }

    /* ---------------- 敌人 */
    for (var i = state.enemies.length - 1; i >= 0; i -= 1) {
        var e = state.enemies[i];
        if (e.dead) { state.enemies.splice(i, 1); continue; }
        e.t += dt;
        e.flash = Math.max(0, e.flash - dt);
        e.spawnT = Math.max(0, e.spawnT - dt);
        e.slow = Math.max(0, e.slow - dt * 0.8);

        // 装备附带的持续伤害：灼烧 / 剧毒 / 湮灭，跳数不触发二次特效
        if (e.dot && e.dot.t > 0) {
            e.dot.t -= dt;
            var dotDmg = e.dot.dps * dt;
            e.hp -= dotDmg;
            e.flash = Math.max(e.flash, 0.06);
            if (Math.floor(e.dot.t * 4) !== Math.floor((e.dot.t + dt) * 4)) {
                addParticles(e.x, e.y - e.r * 0.4, e.dotColor || '#FF6B2C', 1, 0.5);
            }
            if (e.hp <= 0) { killEnemy(e); }
            if (e.dot.t <= 0) { e.dot = null; }
        }

        if (e.isBoss) {
            updateBoss(e, dt);
            var bd2 = dist2(p.x, p.y, e.x, e.y);
            if (bd2 < (e.r + p.r) * (e.r + p.r) && p.iframe <= 0) {
                hurtPlayer(e.dmg * 0.8, e.x, e.y);
            }
            continue;
        }

        var dx = p.x - e.x;
        var dy = p.y - e.y;
        var d = Math.sqrt(dx * dx + dy * dy) || 1;
        var def = ENEMIES[e.type];
        // 远处只轻微提速：一是避免玩家靠速度无限风筝，二是别让屏幕边缘的怪突然窜进来
        // 阈值取视口长边 72%，基本在视野之外；从阈值起再往外跑一段才逐步加到 1.2 倍
        var farD = Math.max(W, H) * 0.72;
        var chase = 1 + clamp((d - farD) / (farD * 1.6), 0, 1) * 0.2;
        var slowMul = (1 - e.slow) * chase * (state.gim ? state.gim.rageMul : 1);
        var wob = Math.sin(e.t * 3 + e.x * 0.01) * (e.type === 'wisp' ? 26 : 8);

        if (e.spawnT <= 0) {
            if (def.flee) {
                // 金蚱蜢：不追人，掉头就跑，跑不掉就钻回草里
                e.x -= (dx / d) * e.speed * dt * 1.12;
                e.y -= (dy / d) * e.speed * dt * 1.12;
                e.life = (e.life === undefined ? 20 : e.life) - dt;
                if (e.life <= 0) { e.dead = true; continue; }
            } else if (def.ranged) {
                // 远程：保持中距离并射击
                var want = 220;
                var dir = d > want + 30 ? 1 : (d < want - 60 ? -1 : 0);
                e.x += (dx / d) * e.speed * slowMul * dir * dt;
                e.y += (dy / d) * e.speed * slowMul * dir * dt;
                e.x += (dy / d) * wob * 0.5 * dt;
                e.y -= (dx / d) * wob * 0.5 * dt;
                e.atkCd -= dt;
                if (e.atkCd <= 0 && d < 420) {
                    e.atkCd = rand(2.0, 2.9);
                    var a3 = Math.atan2(dy, dx);
                    state.ebullets.push({
                        x: e.x, y: e.y - 4,
                        vx: Math.cos(a3) * 185, vy: Math.sin(a3) * 185,
                        r: 5, dmg: e.dmg * 0.8, life: 3.0, color: def.color
                    });
                }
            } else if (def.suicide) {
                // 自爆：贴近后引爆
                if (d < 54) {
                    e.fuse += dt;
                    if (e.fuse > 0.55) {
                        explodeBomber(e);
                        continue;
                    }
                } else {
                    e.x += (dx / d) * e.speed * slowMul * dt;
                    e.y += (dy / d) * e.speed * slowMul * dt;
                }
            } else {
                e.x += (dx / d) * e.speed * slowMul * dt + (dy / d) * wob * dt;
                e.y += (dy / d) * e.speed * slowMul * dt - (dx / d) * wob * dt;
            }
        }

        if (e.kb.x || e.kb.y) {
            e.x += e.kb.x * dt;
            e.y += e.kb.y * dt;
            e.kb.x *= 0.85; e.kb.y *= 0.85;
            if (Math.abs(e.kb.x) < 4) { e.kb.x = 0; }
            if (Math.abs(e.kb.y) < 4) { e.kb.y = 0; }
        }

        if (d > 2400) { state.enemies.splice(i, 1); continue; }

        // 首领得先走进画面才会动手，不许隔着屏幕阴人
        if (e.isBoss && !e.engaged) {
            if (bossOnScreen(e)) {
                e.engaged = true;
                addText(e.x, e.y - 66, '发现你', '#FF4D6D', 1.3);
            }
        }
        if (e.spawnT <= 0 && d < e.r + p.r && p.iframe <= 0 && !(e.isBoss && !e.engaged)) {
            hurtPlayer(e.dmg, e.x, e.y);
            var ang = Math.atan2(e.y - p.y, e.x - p.x);
            e.kb.x = Math.cos(ang) * 240;
            e.kb.y = Math.sin(ang) * 240;
            if (state.mode !== 'playing') { return; }
        }
    }

    /* ---------------- 我方子弹 */
    for (var b = state.bullets.length - 1; b >= 0; b -= 1) {
        var bu = state.bullets[b];
        bu.life -= dt;
        if (bu.life <= 0) { state.bullets.splice(b, 1); continue; }

        if (bu.boomerang) {
            bu.bt += dt;
            bu.spin += dt * 16;
            if (bu.bt > 0.42) {
                var hx = p.x - bu.x;
                var hy = p.y - bu.y;
                var hl = Math.sqrt(hx * hx + hy * hy) || 1;
                bu.vx = lerp(bu.vx, (hx / hl) * 520, Math.min(1, dt * 6));
                bu.vy = lerp(bu.vy, (hy / hl) * 520, Math.min(1, dt * 6));
                bu.hitSet.length = 0;
                if (hl < 20) { state.bullets.splice(b, 1); continue; }
            }
        }

        bu.x += bu.vx * dt;
        bu.y += bu.vy * dt;

        var removed = false;
        for (var j = 0; j < state.enemies.length; j += 1) {
            var en = state.enemies[j];
            if (en.dead || bu.hitSet.indexOf(en.uid) >= 0) { continue; }
            var rr2 = (bu.r + en.r) * (bu.r + en.r);
            if (dist2(bu.x, bu.y, en.x, en.y) < rr2) {
                bu.hitSet.push(en.uid);
                damageEnemy(en, bu.dmg, bu.kind === 'blade' ? '#B7FFD6' : '#FFE0A8');
                addParticles(bu.x, bu.y, bu.color, 4, 1);
                bu.pierce -= 1;
                if (bu.pierce <= 0) { state.bullets.splice(b, 1); removed = true; break; }
            }
        }
        if (removed) { continue; }
    }

    /* ---------------- 地雷 */
    for (var m = state.mines.length - 1; m >= 0; m -= 1) {
        var mi = state.mines[m];
        mi.t -= dt;
        if (mi.t <= 0) {
            state.mines.splice(m, 1);
            addRing(mi.x, mi.y, mi.r, '#FF8A5C', 0.4);
            addParticles(mi.x, mi.y, '#FF8A5C', 14, 1.4);
            state.shake = Math.max(state.shake, 0.22);
            audio.boom();
            for (var q = 0; q < state.enemies.length; q += 1) {
                var eq = state.enemies[q];
                if (eq.dead) { continue; }
                if (dist2(mi.x, mi.y, eq.x, eq.y) < (mi.r + eq.r) * (mi.r + eq.r)) {
                    damageEnemy(eq, mi.dmg, '#FFC0A8');
                }
            }
        }
    }

    /* ---------------- 敌人子弹 */
    for (var eb = state.ebullets.length - 1; eb >= 0; eb -= 1) {
        var ebu = state.ebullets[eb];
        ebu.x += ebu.vx * dt;
        ebu.y += ebu.vy * dt;
        ebu.life -= dt;
        if (ebu.life <= 0) { state.ebullets.splice(eb, 1); continue; }
        if (dist2(ebu.x, ebu.y, p.x, p.y) < (ebu.r + p.r * 0.8) * (ebu.r + p.r * 0.8)) {
            if (p.iframe <= 0) {
                hurtPlayer(ebu.dmg, ebu.x, ebu.y);
                state.ebullets.splice(eb, 1);
                if (state.mode !== 'playing') { return; }
            }
        }
    }

    // 处理受击清弹（放在遍历结束后，避免索引失效）
    if (state.clearBulletAt) {
        var cb = state.clearBulletAt;
        state.clearBulletAt = null;
        for (var cbI = state.ebullets.length - 1; cbI >= 0; cbI -= 1) {
            var cbE = state.ebullets[cbI];
            if (dist2(cb.x, cb.y, cbE.x, cbE.y) < cb.r * cb.r) {
                addParticles(cbE.x, cbE.y, cbE.color, 2, 0.6);
                state.ebullets.splice(cbI, 1);
            }
        }
    }

    /* ---------------- 经验 */
    var pickupR = 118 + upLv('magnet') * 0.30 * 118;
    for (var g = state.gems.length - 1; g >= 0; g -= 1) {
        var gem = state.gems[g];
        gem.t += dt;
        gem.x += gem.vx * dt;
        gem.y += gem.vy * dt;
        gem.vx *= 0.90;
        gem.vy *= 0.90;
        var gd = dist2(gem.x, gem.y, p.x, p.y);
        var gl = Math.sqrt(gd) || 1;
        if (gl > 1) {
            // 近处强力吸附；远处也慢慢飘过来，避免经验白白落在身后
            var pull = gl < pickupR
                ? 320 + 540 * (1 - gl / pickupR)
                : 46 + Math.min(120, gl * 0.02);
            gem.x += (p.x - gem.x) / gl * pull * dt;
            gem.y += (p.y - gem.y) / gl * pull * dt;
        }
        if (gd < 22 * 22) {
            gainXp(gem.v);
            state.gems.splice(g, 1);
            addParticles(p.x, p.y, '#FFC14D', 2, 0.6);
            if (state.mode !== 'playing') { return; }
        }
    }
    if (state.gems.length > 240) { state.gems.splice(0, state.gems.length - 240); }

    /* ---------------- 道具 */
    for (var k2 = state.pickups.length - 1; k2 >= 0; k2 -= 1) {
        var it = state.pickups[k2];
        it.t += dt;
        if (dist2(it.x, it.y, p.x, p.y) < (p.r + it.r + 8) * (p.r + it.r + 8)) {
            var heal = Math.min(Math.round(p.maxHp * 0.22), p.maxHp - p.hp);
            if (heal > 0) {
                p.hp += heal;
                addText(p.x, p.y - 30, '+' + Math.round(heal), '#6BE08A', 1.1);
                addParticles(it.x, it.y, '#6BE08A', 10, 1);
                audio.pick();
            }
            state.pickups.splice(k2, 1);
        }
    }

    /* ---------------- 彩蛋：木箱与星屑 */
    for (var chI = 0; chI < state.chests.length; chI += 1) {
        var chst = state.chests[chI];
        chst.t += dt;
        if (chst.opened) {
            if (chst.openT > 0) { chst.openT = Math.max(0, chst.openT - dt); }
            continue;
        }
        if (dist2(chst.x, chst.y, p.x, p.y) < 44 * 44) { openChest(chst); }
    }
    for (var rl = 0; rl < state.relics.length; rl += 1) {
        var rc = state.relics[rl];
        rc.t += dt;
        if (rc.used) {
            if (rc.useT > 0) { rc.useT = Math.max(0, rc.useT - dt); }
            continue;
        }
        if (dist2(rc.x, rc.y, p.x, p.y) < 46 * 46) { takeRelic(rc); }
    }

    if (state.shard) {
        state.shard.t += dt;
        if (dist2(state.shard.x, state.shard.y, p.x, p.y) < 48 * 48) { takeShard(); }
    }

    /* ---------------- 金币 */
    for (var co = state.coins.length - 1; co >= 0; co -= 1) {
        var cn = state.coins[co];
        cn.t += dt;
        cn.x += cn.vx * dt;
        cn.y += cn.vy * dt;
        cn.vx *= 0.90;
        cn.vy *= 0.90;
        var cd2 = dist2(cn.x, cn.y, p.x, p.y);
        var cl = Math.sqrt(cd2) || 1;
        if (cl < pickupR * 1.15) {
            var cPull = 300 + 520 * (1 - Math.min(1, cl / (pickupR * 1.15)));
            cn.x += (p.x - cn.x) / cl * cPull * dt;
            cn.y += (p.y - cn.y) / cl * cPull * dt;
        }
        if (cd2 < 24 * 24) {
            state.gold += cn.v;
            state.score += cn.v * 2;
            state.coins.splice(co, 1);
            addParticles(p.x, p.y, '#FFD24A', 2, 0.5);
            audio.pick();
        }
    }
    if (state.coins.length > 160) { state.coins.splice(0, state.coins.length - 160); }

    /* ---------------- 特效与粒子 */
    for (var f = state.effects.length - 1; f >= 0; f -= 1) {
        var ef = state.effects[f];
        ef.life -= dt;
        if (ef.type === 'ring') {
            ef.r = ef.maxR * (1 - Math.max(0, ef.life) / ef.max);
        }
        if (ef.life <= 0) { state.effects.splice(f, 1); }
    }
    for (var pi = state.particles.length - 1; pi >= 0; pi -= 1) {
        var pa = state.particles[pi];
        pa.life -= dt;
        if (pa.life <= 0) { state.particles.splice(pi, 1); continue; }
        pa.x += pa.vx * dt;
        pa.y += pa.vy * dt;
        pa.vx *= 0.94;
        pa.vy *= 0.94;
    }
    for (var txi = state.texts.length - 1; txi >= 0; txi -= 1) {
        var tx = state.texts[txi];
        tx.life -= dt;
        if (tx.life <= 0) { state.texts.splice(txi, 1); continue; }
        tx.y -= 36 * dt;
    }

    if (state.pending > 0 && state.mode === 'playing') { openLevelUp(); }
}

function explodeBomber(e) {
    e.dead = true;
    state.kills += 1;
    addRing(e.x, e.y, 86, '#FF6B8A', 0.34);
    addParticles(e.x, e.y, '#FF6B8A', 16, 1.5);
    state.shake = Math.max(state.shake, 0.3);
    audio.boom();
    var p = state.player;
    if (dist2(p.x, p.y, e.x, e.y) < 86 * 86) {
        hurtPlayer(e.dmg * 0.7, e.x, e.y);
    }
    for (var i = 0; i < state.enemies.length; i += 1) {
        var o = state.enemies[i];
        if (o === e || o.dead) { continue; }
        if (dist2(o.x, o.y, e.x, e.y) < 76 * 76) {
            damageEnemy(o, e.dmg * 0.6, '#FFC0D0');
        }
    }
}

/* ============================================================ 地图特色
   九张地图各自有一件事在发生：田垄最安静，越往后越不安分。
   风推人、水拖脚、雾掉血、石砸人、树心震全场；竹林与月夜是"看不清"。 */
function initGimmick(def) {
    var f = (def && def.feature) || MAP_FEATURE[1];
    var g = {
        kind: f.key,
        name: f.name,
        speedMul: 1,
        rageMul: 1,
        tick: rand(3, 6),
        windDur: 0,
        windX: 0, windY: 0,
        dotT: 0,
        rageT: 0,
        pulseT: 9,
        inWater: 0,
        inFog: 0,
        zones: [],
        rocks: []
    };
    var i, a, r;
    if (f.key === 'water') {
        for (i = 0; i < 7; i += 1) {
            a = rand(0, TAU);
            r = rand(140, 680);
            g.zones.push({ x: Math.cos(a) * r, y: Math.sin(a) * r, r: rand(80, 155), t: rand(0, 6) });
        }
    } else if (f.key === 'spore') {
        for (i = 0; i < 5; i += 1) {
            a = rand(0, TAU);
            r = rand(180, 720);
            g.zones.push({
                x: Math.cos(a) * r, y: Math.sin(a) * r, r: rand(115, 195), t: rand(0, 6),
                ax: Math.cos(a), ay: Math.sin(a), drift: rand(6, 14)
            });
        }
    }
    state.gim = g;
}

/* 直接扣血（不吃无敌帧），用于地形持续伤害 */
function gimHurt(n) {
    var p = state.player;
    if (state.mode !== 'playing' || n <= 0) { return; }
    p.hp -= n;
    state.hurtVig = Math.min(1, state.hurtVig + 0.35);
    if (p.hp <= 0) {
        p.hp = 0;
        endRun(false);
    }
}

function updateGimmick(dt) {
    var g = state.gim;
    if (!g) { return; }
    var p = state.player;
    g.speedMul = 1;
    g.rageMul = 1;
    g.tick -= dt;
    var i, z;

    if (g.kind === 'wind') {
        if (g.tick <= 0) {
            var a = rand(0, TAU);
            g.windX = Math.cos(a);
            g.windY = Math.sin(a);
            g.windDur = 3.2;
            g.tick = rand(11, 16);
            showToast('起风了', '#4E9E2A', 1.5);
        }
        if (g.windDur > 0) {
            g.windDur -= dt;
            var push = 86 * Math.min(1, g.windDur / 0.7);
            p.x += g.windX * push * dt;
            p.y += g.windY * push * dt;
        }
    } else if (g.kind === 'water') {
        for (i = 0; i < g.zones.length; i += 1) {
            z = g.zones[i];
            z.t += dt;
            if (dist2(p.x, p.y, z.x, z.y) < z.r * z.r) {
                g.speedMul = 0.72;
                g.inWater = 1;
                break;
            }
        }
    } else if (g.kind === 'spore') {
        g.dotT += dt;
        var inside = 0;
        for (i = 0; i < g.zones.length; i += 1) {
            z = g.zones[i];
            z.t += dt;
            z.x += z.ax * z.drift * dt;
            z.y += z.ay * z.drift * dt;
            if (dist2(p.x, p.y, z.x, z.y) < z.r * z.r) { inside = 1; }
        }
        g.inFog = inside;
        if (inside && g.dotT > 0.9) {
            g.dotT = 0;
            gimHurt(Math.max(1, Math.round(p.maxHp * 0.012)));
            addText(p.x, p.y - 30, '-孢', '#6EA84E', 0.9);
        }
    } else if (g.kind === 'fall') {
        if (g.tick <= 0) {
            g.tick = rand(2.1, 3.2);
            g.rocks.push({ x: p.x + rand(-230, 230), y: p.y + rand(-230, 230), t: 1.1, land: 0, boom: 0.5 });
        }
        for (i = g.rocks.length - 1; i >= 0; i -= 1) {
            var rk = g.rocks[i];
            rk.t -= dt;
            if (rk.t > 0) { continue; }
            if (!rk.land) {
                rk.land = 1;
                addRing(rk.x, rk.y, 62, '#C98A5A', 0.4);
                addParticles(rk.x, rk.y, '#C9A26A', 12, 1.2);
                state.shake = Math.max(state.shake, 0.32);
                audio.boom();
                if (dist2(p.x, p.y, rk.x, rk.y) < 62 * 62) {
                    hurtPlayer(11 * (state.levelDef.dmgMul || 1), rk.x, rk.y);
                }
            }
            rk.boom -= dt;
            if (rk.boom <= 0) { g.rocks.splice(i, 1); }
        }
    } else if (g.kind === 'heart') {
        if (g.tick <= 0) {
            g.tick = 14;
            g.rageT = 3.6;
            addRing(p.x, p.y, Math.max(W, H) * 0.85, '#4E9E2A', 0.45);
            showToast('树心震荡', '#2E7A4E', 1.3);
            state.shake = Math.max(state.shake, 0.45);
        }
        if (g.rageT > 0) {
            g.rageT -= dt;
            g.rageMul = 1.25;
        }
    }
}

/* ------------------------------------------------------------ 结算 */
/* 通关掉落装备：越到后面的关卡，越容易掉高品质
   低品质（普通 / 精良）基本靠闯关白拿，高品质的多半得掏钱买。 */
function rollGearDrop(stageIdx) {
    if (!save.gearOwn) { save.gearOwn = {}; }
    var q = clamp(stageIdx / Math.max(1, STAGES.length - 1), 0, 1);
    var boost = 1 + q * 1.6;
    var pool = [];
    var i, r;
    for (i = 0; i < GEAR_RARITY_IDS.length; i += 1) {
        r = GEAR_RARITY[GEAR_RARITY_IDS[i]];
        var w = Math.round(r.weight * Math.pow(boost, r.order - 1));
        for (var k = 0; k < w; k += 1) { pool.push(r.id); }
    }
    var want = pool.length ? pool[Math.floor(Math.random() * pool.length)] : 'common';

    var cands = [];
    for (i = 0; i < GEAR.length; i += 1) {
        if (GEAR[i].rarity !== want) { continue; }
        if (save.gearOwn[GEAR[i].id]) { continue; }
        cands.push(GEAR[i]);
    }
    if (!cands.length) {
        for (i = 0; i < GEAR.length; i += 1) {
            if (!save.gearOwn[GEAR[i].id]) { cands.push(GEAR[i]); }
        }
    }
    if (!cands.length) { return null; }          // 全都齐了
    var it = cands[Math.floor(Math.random() * cands.length)];
    save.gearOwn[it.id] = 1;
    return it;
}

function endRun(cleared) {
    var lv = state.levelDef;
    var rank = rankOf(lv, cleared, state.time - lv.duration);
    state.mode = cleared ? 'clear' : 'dead';
    state.won = cleared;
    state.rank = rank;
    state.score = Math.round(state.score + state.time * 6 + state.kills * 4);
    state.clearAt = world.tick;    // 结算页庆祝动画的时间基准

    var key = String(lv.id);
    var rec = save.cleared[key] || { score: 0, kills: 0, time: 0, rank: '' };
    if (state.score > rec.score) { rec.score = state.score; }
    if (state.kills > rec.kills) { rec.kills = state.kills; }
    if (cleared) {
        if (!rec.rank || rankOrder(rank.r) > rankOrder(rec.rank)) { rec.rank = rank.r; }
        if (rec.time === 0) { rec.time = state.time; }
    }
    save.cleared[key] = rec;

    // 金币：通关固定给 CLEAR_COIN 个，不看评级/地图/小关；路上捡的另外算，幸运值只加成路上捡的
    var coinBonus = cleared ? CLEAR_COIN : 0;
    var luck = 1 + shopLv('luck') * 0.08;
    state.goldBonus = coinBonus;
    state.gold = Math.round(state.gold * luck) + coinBonus;
    save.coins = (save.coins || 0) + state.gold;
    save.goldEarned = (save.goldEarned || 0) + state.gold;

    // 累计统计：场次/击杀/头目/开箱/彩蛋累加，成绩类取最好
    save.runs = (save.runs || 0) + 1;
    save.kills = (save.kills || 0) + state.kills;
    save.bosses = (save.bosses || 0) + (state.bossN || 0);
    save.chests = (save.chests || 0) + (state.chestN || 0);
    save.relics = (save.relics || 0) + (state.relicN || 0);
    save.clears = countCleared();
    if (state.comboBest > (save.bestCombo || 0)) { save.bestCombo = state.comboBest; }
    if (state.level > (save.bestLv || 0)) { save.bestLv = state.level; }
    if (state.score > (save.best || 0)) { save.best = state.score; }

    // 挑战类统计：SSS 速杀 / 一次没挨打就通关
    if (cleared && rank.r === 'SSS') { save.sss = (save.sss || 0) + 1; }
    if (cleared && !state.hits) {
        save.noHit = (save.noHit || 0) + 1;
        state.flawless = 1;
    }

    // 本轮榜：每天 0 点清零，只累计这一轮的战绩
    // 通关掉一件装备
    state.newGear = cleared ? rollGearDrop(state.levelIdx) : null;

    state.seasonNew = touchSeason();
    var sea = save.season;
    sea.runs = (sea.runs || 0) + 1;
    sea.kills = (sea.kills || 0) + state.kills;
    sea.coins = (sea.coins || 0) + state.gold;
    if (cleared) {
        sea.clears = (sea.clears || 0) + 1;
        sea.stars = (sea.stars || 0) + rankOrder(rank.r);
        if (state.levelIdx + 1 > (sea.maxLv || 0)) { sea.maxLv = state.levelIdx + 1; }
    }

    // 任务进度与成就结算
    state.questReady = applyQuestProgress(state);
    state.newAch = checkAchievements();
    // 成就发的金币可能把「累计金币」推过下一个成就的线，多跑两轮把连锁的也发掉
    for (var cn2 = 0; cn2 < 2; cn2 += 1) {
        var more2 = checkAchievements();
        if (!more2.length) { break; }
        state.newAch = state.newAch.concat(more2);
    }

    writeSave();

    if (cleared) { audio.level(); } else { audio.boom(); }
}

/* ------------------------------------------------------------ 成就与任务 */
function unlockedCharCount() {
    var n = 0;
    for (var i = 0; i < CHARS.length; i += 1) {
        if (charUnlocked(CHARS[i])) { n += 1; }
    }
    return n;
}

/* 成就：读累计存档，达标的立刻发金币、解锁特效，返回到结算页展示 */
function checkAchievements() {
    var got = [];
    for (var i = 0; i < ACHIEVEMENTS.length; i += 1) {
        var a = ACHIEVEMENTS[i];
        if (save.ach[a.id]) { continue; }
        if ((a.get() || 0) < a.goal) { continue; }
        save.ach[a.id] = 1;
        save.coins = (save.coins || 0) + (a.coin || 0);
        save.goldEarned = (save.goldEarned || 0) + (a.coin || 0);
        if (state) { state.achCoin = (state.achCoin || 0) + (a.coin || 0); }
        if (a.fx && !save.fx[a.fx]) { save.fx[a.fx] = 1; }
        got.push(a);
    }
    return got;
}

/* ------------------------------------------------------------ 本轮排行
   排行榜以 24 小时为一轮（每天 0 点清零重排），比的是这一轮里打出来的成绩。 */
function seasonOf(sv) {
    var key = todayKey();
    if (!sv.season || sv.season.key !== key) { return null; }
    return sv.season;
}

function seasonLeftText() {
    var d = new Date();
    var next = new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1, 0, 0, 0, 0);
    var s = Math.max(0, Math.floor((next.getTime() - d.getTime()) / 1000));
    var h = Math.floor(s / 3600);
    var m = Math.floor((s % 3600) / 60);
    return (h < 10 ? '0' + h : h) + ':' + (m < 10 ? '0' + m : m);
}

/* 跨轮就把本轮成绩清零，返回是不是刚翻了一轮 */
function touchSeason() {
    var key = todayKey();
    if (save.season && save.season.key === key) { return false; }
    var wasFresh = !!(save.season && save.season.key);
    save.season = { key: key, clears: 0, stars: 0, maxLv: 0, kills: 0, coins: 0, runs: 0 };
    return wasFresh;
}

/* ------------------------------------------------------------ 本机排行
   把每一位玩家的存档都读出来排一遍。同一台设备上的人互相看得见。 */
var rankCache = null;

function profileStats(id) {
    var sv = loadProfileSave(id);
    var rec = profileRec(id) || {};
    var sea = seasonOf(sv);
    var histClears = 0, histStars = 0;
    for (var i = 0; i < STAGES.length; i += 1) {
        var r = sv.cleared[STAGES[i].id];
        if (!r) { continue; }
        histClears += 1;
        histStars += rankOrder(r.rank || 'D');
    }
    return {
        id: id,
        name: rec.name || '玩家',
        col: rec.col || '#E8734A',
        clears: sea ? (sea.clears || 0) : 0,
        stars: sea ? (sea.stars || 0) : 0,
        maxLv: sea ? (sea.maxLv || 0) : 0,
        kills: sea ? (sea.kills || 0) : 0,
        coins: sea ? (sea.coins || 0) : 0,
        runs: sea ? (sea.runs || 0) : 0,
        histClears: histClears,
        histStars: histStars,
        coinsTotal: sv.coins || 0,
        goldEarned: sv.goldEarned || 0,
        bosses: sv.bosses || 0
    };
}

/* 排名口径：本轮通关数 → 本轮星数 → 本轮击杀 → 本轮金币，全持平时看历史 */
function rankRows() {
    if (rankCache) { return rankCache; }
    var p = loadProfiles();
    var rows = [];
    for (var i = 0; i < p.list.length; i += 1) { rows.push(profileStats(p.list[i].id)); }
    rows.sort(function (a, b) {
        if (b.clears !== a.clears) { return b.clears - a.clears; }
        if (b.stars !== a.stars) { return b.stars - a.stars; }
        if (b.kills !== a.kills) { return b.kills - a.kills; }
        if (b.coins !== a.coins) { return b.coins - a.coins; }
        if (b.histClears !== a.histClears) { return b.histClears - a.histClears; }
        return b.histStars - a.histStars;
    });
    for (var k = 0; k < rows.length; k += 1) { rows[k].pos = k + 1; }
    rankCache = rows;
    return rows;
}

function myRankPos() {
    var rows = rankRows();
    var cur = loadProfiles().cur;
    for (var i = 0; i < rows.length; i += 1) {
        if (rows[i].id === cur) { return rows[i].pos; }
    }
    return 0;
}

function todayKey() {
    var d = new Date();
    return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
}

function questById(id) {
    for (var i = 0; i < QUEST_POOL.length; i += 1) {
        if (QUEST_POOL[i].id === id) { return QUEST_POOL[i]; }
    }
    return null;
}

/* 每天抽几条任务（QUEST_PER_DAY），跨天自动换一批并清空进度 */
function ensureQuests() {
    var key = todayKey();
    var want = Math.min(QUEST_PER_DAY || 4, QUEST_POOL.length);
    // 老存档只抽过三条，条数对不上就重抽一批
    if (save.questDate === key && save.questList && save.questList.length >= want) { return; }
    save.questDate = key;
    var pool = QUEST_POOL.slice();
    var list = [];
    var perDay = want;
    for (var i = 0; i < perDay; i += 1) {
        var idx = Math.floor(Math.random() * pool.length);
        list.push(pool.splice(idx, 1)[0].id);
    }
    save.questList = list;
    save.questProg = {};
    save.questClaimed = {};
    writeSave();
}

/* 一局结束后把战绩折算成任务进度，返回可领取的任务 id */
function applyQuestProgress(st) {
    ensureQuests();
    var ready = [];
    for (var i = 0; i < save.questList.length; i += 1) {
        var q = questById(save.questList[i]);
        if (!q) { continue; }
        var cur = save.questProg[q.id] || 0;
        if (q.type === 'kill') { cur += st.kills; }
        else if (q.type === 'run') { cur += 1; }
        else if (q.type === 'clear') { cur += st.won ? 1 : 0; }
        else if (q.type === 'chest') { cur += st.chestN || 0; }
        else if (q.type === 'relic') { cur += st.relicN || 0; }
        else if (q.type === 'boss') { cur += st.bossN || 0; }
        else if (q.type === 'sss') { cur += (st.won && st.rank && st.rank.r === 'SSS') ? 1 : 0; }
        else if (q.type === 'nohit') { cur += (st.won && !st.hits) ? 1 : 0; }
        else if (q.type === 'gold') { cur = Math.max(cur, st.gold); }
        else if (q.type === 'level') { cur = Math.max(cur, st.level); }
        else if (q.type === 'combo') { cur = Math.max(cur, st.comboBest); }
        else if (q.type === 'chars') { cur = Math.max(cur, unlockedCharCount()); }
        save.questProg[q.id] = Math.min(cur, q.goal);
        if (cur >= q.goal && !save.questClaimed[q.id]) { ready.push(q.id); }
    }
    return ready;
}

function questReadyCount() {
    var n = 0;
    for (var i = 0; i < save.questList.length; i += 1) {
        var id = save.questList[i];
        var q = questById(id);
        if (!q || save.questClaimed[id]) { continue; }
        if ((save.questProg[id] || 0) >= q.goal) { n += 1; }
    }
    return n;
}

/* 领任务奖励：金币 + 可能解锁一件攻击特效 */
function claimQuest(id) {
    var q = questById(id);
    if (!q || save.questClaimed[id]) { return false; }
    if ((save.questProg[id] || 0) < q.goal) { return false; }
    save.questClaimed[id] = 1;
    save.questDone = (save.questDone || 0) + 1;
    save.coins = (save.coins || 0) + q.coin;
    save.goldEarned = (save.goldEarned || 0) + q.coin;
    if (q.fx && !save.fx[q.fx]) { save.fx[q.fx] = 1; }
    /* 任务奖励种子：发到手的同时解锁这种子 */
    if (q.seed && SEEDS[q.seed]) {
        save.seeds[q.seed] = (save.seeds[q.seed] || 0) + (q.seedN || 1);
        save.seedUnlocked[q.seed] = 1;
    }
    writeSave();
    return true;
}

/* 换攻击特效 */
function equipFx(id) {
    if (!FX_SKINS[id] || !save.fx[id]) { return false; }
    save.fxCur = id;
    writeSave();
    return true;
}

function explodeBomber(e) {
    e.dead = true;
    state.kills += 1;
    addRing(e.x, e.y, 86, '#FF6B8A', 0.34);
    addParticles(e.x, e.y, '#FF6B8A', 16, 1.5);
    state.shake = Math.max(state.shake, 0.3);
    audio.boom();
    var p = state.player;
    if (dist2(p.x, p.y, e.x, e.y) < 86 * 86) {
        hurtPlayer(e.dmg * 0.7, e.x, e.y);
    }
    for (var i = 0; i < state.enemies.length; i += 1) {
        var o = state.enemies[i];
        if (o === e || o.dead) { continue; }
        if (dist2(o.x, o.y, e.x, e.y) < 76 * 76) {
            damageEnemy(o, e.dmg * 0.6, '#FFC0D0');
        }
    }
}

/* 屏幕上方的短提示 */
function showToast(text, color, dur) {
    state.toast = { text: text, color: color };
    state.toastT = dur || 2;
}

/* 记一条图鉴：第一次见到某样东西时写盘 */
function markEgg(id) {
    if (!EGGS[id]) { return; }
    state.eggs[id] = 1;
    if (!save.eggs) { save.eggs = {}; }
    if (!save.eggs[id]) {
        save.eggs[id] = 1;
        writeSave();
    }
}

function eggCount() {
    var n = 0;
    if (!save.eggs) { return 0; }
    for (var i = 0; i < EGG_IDS.length; i += 1) {
        if (save.eggs[EGG_IDS[i]]) { n += 1; }
    }
    return n;
}

/* 打开一只木箱：四选一的随机奖励 */
function openChest(c) {
    c.opened = 1;
    c.openT = 1.2;
    state.chestN = (state.chestN || 0) + 1;
    markEgg('chest');
    audio.level();
    state.shake = Math.max(state.shake, 0.2);
    addParticles(c.x, c.y, '#FFD166', 16, 1.4);
    addRing(c.x, c.y, 110, '#FFD166', 0.55);

    var p = state.player;
    var roll = Math.random();
    var i;

    if (roll < 0.30) {
        /* 一包晒干的种子：散成一地经验 */
        var unit = Math.max(2, Math.round((18 + state.level * 7) / 6));
        for (i = 0; i < 12; i += 1) {
            state.gems.push({
                x: c.x + rand(-26, 26), y: c.y + rand(-26, 26),
                v: unit, vx: rand(-120, 120), vy: rand(-120, 120), t: rand(0, 4)
            });
        }
        showToast('木箱里是一包晒干的种子', '#FFC14D', 2.2);
    } else if (roll < 0.60) {
        /* 一壶蜜水 */
        var heal = Math.round(p.maxHp * 0.4);
        p.hp = Math.min(p.maxHp, p.hp + heal);
        addText(p.x, p.y - 30, '+' + heal, '#6BE08A', 1.2);
        addParticles(p.x, p.y, '#6BE08A', 12, 1);
        showToast('谁在这儿存了一壶蜜水', '#4E9E2A', 2.2);
    } else if (roll < 0.86) {
        /* 一本手抄本：随手给件武器升一级 */
        var cands = [];
        for (i = 0; i < WEAPON_IDS.length; i += 1) {
            if (upLv(WEAPON_IDS[i]) > 0 && upLv(WEAPON_IDS[i]) < WEAPONS[WEAPON_IDS[i]].max) {
                cands.push(WEAPON_IDS[i]);
            }
        }
        if (!cands.length) {
            for (i = 0; i < WEAPON_IDS.length; i += 1) {
                if (upLv(WEAPON_IDS[i]) < WEAPONS[WEAPON_IDS[i]].max) { cands.push(WEAPON_IDS[i]); }
            }
        }
        if (cands.length) {
            var wid = pick(cands);
            applyUpgrade(wid);
            showToast('箱底压着 ' + WEAPONS[wid].name + ' 的手抄本', '#B8860B', 2.4);
        } else {
            applyUpgrade(pick(ENDLESS_IDS));
            showToast('箱底压着一张写满字的旧纸', '#B8860B', 2.4);
        }
    } else {
        /* 一箱土制火药：把附近掀一遍 */
        addRing(c.x, c.y, 330, '#FF8A5C', 0.7);
        state.shake = 0.6;
        audio.boom();
        for (i = 0; i < state.enemies.length; i += 1) {
            var en = state.enemies[i];
            if (en.dead) { continue; }
            if (dist2(c.x, c.y, en.x, en.y) < 330 * 330) {
                damageEnemy(en, en.isBoss ? en.maxHp * 0.05 : en.maxHp * 0.7 + 40, '#FFC0A8');
            }
        }
        showToast('箱子里全是土制的火药', '#C25E14', 2.2);
    }
}

/* 星屑碎片：老玩家会认出来的东西 */
function takeShard() {
    var s = state.shard;
    if (!s) { return; }
    state.shard = null;
    markEgg('shard');
    state.flash = 0.85;
    state.shake = 0.7;
    addRing(s.x, s.y, 460, '#9AD7FF', 1.0);
    addRing(s.x, s.y, 260, '#FFFFFF', 0.7);
    addParticles(s.x, s.y, '#BFE9FF', 34, 2.2);
    audio.level();
    audio.boom();
    state.player.iframe = Math.max(state.player.iframe, 2.0);
    showToast('……原来星星也在这里。', '#7FB6FF', 3.4);
    for (var i = 0; i < state.enemies.length; i += 1) {
        var en = state.enemies[i];
        if (en.dead) { continue; }
        damageEnemy(en, en.isBoss ? en.maxHp * 0.08 : 99999, '#BFE9FF');
    }
}

/* 随机给一件已有武器升一级，全满则返回 null */
function relicWeaponUp() {
    var cands = [];
    var i;
    for (i = 0; i < WEAPON_IDS.length; i += 1) {
        var w = WEAPON_IDS[i];
        if (upLv(w) > 0 && upLv(w) < WEAPONS[w].max) { cands.push(w); }
    }
    if (!cands.length) {
        for (i = 0; i < WEAPON_IDS.length; i += 1) {
            if (upLv(WEAPON_IDS[i]) < WEAPONS[WEAPON_IDS[i]].max) { cands.push(WEAPON_IDS[i]); }
        }
    }
    if (!cands.length) { return null; }
    var wid = pick(cands);
    applyUpgrade(wid);
    return WEAPONS[wid].name;
}

/* 撒一圈经验，单位量跟木箱保持一致 */
function spillGems(x, y, n, mult) {
    var unit = Math.max(2, Math.round((18 + state.level * 7) * (mult || 1) / 6));
    for (var i = 0; i < n; i += 1) {
        state.gems.push({
            x: x + rand(-26, 26), y: y + rand(-26, 26),
            v: unit, vx: rand(-120, 120), vy: rand(-120, 120), t: rand(0, 4)
        });
    }
}

/* ---------------- 地图彩蛋：走上去才触发一次 */
function takeRelic(r) {
    var def = RELICS[r.id];
    if (!def) { return; }
    var p = state.player;
    var say;

    // 许愿井要投币。没钱就只提示一次，之后玩家攒够了再来还能用
    if (r.id === 'wish' && state.gold < def.cost) {
        if (!r.hinted) {
            r.hinted = 1;
            showToast('井口沁凉，得投点什么它才肯开口', '#8FA8C8', 2.8);
        }
        return;
    }

    r.used = 1;
    r.useT = 1.1;
    state.relicN = (state.relicN || 0) + 1;
    markEgg(r.id);
    audio.level();
    addRing(r.x, r.y, 132, def.color, 0.6);
    addParticles(r.x, r.y, def.color, 14, 1.2);
    state.shake = Math.max(state.shake, 0.18);
    say = pick(def.lines);

    if (r.id === 'wish') {
        /* 许愿井：投一枚，换三样里的一样 */
        state.gold -= def.cost;
        var roll = Math.random();
        if (roll < 0.40) {
            spillGems(r.x, r.y, 14, 1.7);
            say += '，井底涌出一小簇光';
            audio.pick();
        } else if (roll < 0.72) {
            var heal = Math.round(p.maxHp * 0.5);
            p.hp = Math.min(p.maxHp, p.hp + heal);
            addText(p.x, p.y - 30, '+' + heal, '#6BE08A', 1.2);
            addParticles(p.x, p.y, '#6BE08A', 12, 1);
            say += '，一股凉意顺着脚底往上爬';
        } else {
            var upName = relicWeaponUp();
            say += upName ? '，手里那件东西忽然顺手了（' + upName + ' +1）' : '，井里什么也没给出';
        }

    } else if (r.id === 'shrine') {
        /* 土地庙：回一大口血，再保你几秒 */
        var h2 = Math.round(p.maxHp * 0.35);
        p.hp = Math.min(p.maxHp, p.hp + h2);
        p.iframe = Math.max(p.iframe, 4);
        addText(p.x, p.y - 30, '+' + h2, '#6BE08A', 1.2);
        addParticles(p.x, p.y, '#FFE0A8', 12, 1);
        say += '，四秒之内没人伤得了你';

    } else if (r.id === 'scarecrow') {
        /* 稻草人：一袖子的谷子撒出来 */
        spillGems(r.x, r.y, 16, 1.2);
        state.score += 40;
        audio.pick();

    } else if (r.id === 'basket') {
        /* 野餐篮：篮底还剩几枚铜板和两块饼 */
        state.gold += 25;
        addText(r.x, r.y - 24, '+25 金币', '#E0A21A', 1.2);
        spillGems(r.x, r.y, 6, 1);
        audio.pick();

    } else if (r.id === 'mailbox') {
        /* 树洞信箱：一封没寄出去的信，附一件顺手的东西 */
        var name2 = relicWeaponUp();
        state.score += 60;
        if (name2) { say += '，夹页里写着 ' + name2 + ' 的用法'; }
        audio.pick();
    }

    showToast(say, def.color, 2.9);
}

/* 路上的随机事件：不来怪物，只来点气氛 */
function triggerEvent() {
    var p = state.player;
    var i;
    if (Math.random() < 0.52) {
        state.event = { kind: 'wind', t: 9, dur: 9 };
        for (i = 0; i < state.enemies.length; i += 1) {
            var en = state.enemies[i];
            en.slow = Math.max(en.slow || 0, 0.62);
        }
        showToast('起风了 · 蒲公英糊了虫子一脸', '#3E9E7A', 2.6);
        addRing(p.x, p.y, 460, '#DFF6E6', 0.9);
    } else {
        state.event = { kind: 'rain', t: 0.6, dur: 0.6 };
        for (i = 0; i < 14; i += 1) {
            var a = rand(0, TAU);
            var r = rand(70, 280);
            state.gems.push({
                x: p.x + Math.cos(a) * r, y: p.y + Math.sin(a) * r,
                v: 2 + state.level, vx: rand(-50, 50), vy: rand(-50, 50), t: 0
            });
        }
        showToast('蜜糖雨 · 天上掉下来一堆甜的', '#B8860B', 2.6);
    }
    state.eventCd = rand(36, 50);
}



/* ===== home.js ===== */
/* ============================================================
   家园 & 夺宝 · 核心逻辑
   ------------------------------------------------------------
   夺宝（treasure）：遗迹里搜刮藏宝点，带回木材 / 水源 / 金币
     - 沿用夜巡那套潜行手感：守卫有扇形视线，站着不动能藏身
     - 藏宝点走近自动搜，搜完掉落对应资源
     - 被守卫撞到会掉一件战利品并被弹开
     - 搜够目标数或者时间到，自动撤离结算

   家园（home）：玩家自己盖房、垦地、种菜
     - 房子风格玩家自己挑（茅草屋 / 木屋 / 林间 / 石屋 / 洋房）
     - 菜园地块要花钱开垦，地块上可以种蔬菜或水果
     - 种子从通关任务奖励或商城买，成熟要很久
     - 商城卖催芽露 / 速熟剂 / 厚肥，帮作物快熟
*/

/* ============================================================ 夺宝 */

/* 藏宝点产出：木材 / 水源 / 金币，工具箱两种都给 */
var TRES_YIELD = {
    wood:  { wood: 4,  water: 0, coins: 6 },
    water: { wood: 0,  water: 4, coins: 6 },
    coin:  { wood: 1,  water: 1, coins: 22 },
    both:  { wood: 5,  water: 5, coins: 14 }
};

/* 遗迹分区：五个废墟各有各的看点，藏宝点按片区成组摆放 */
var TR_ZONES = [
    { name: '前庭', x: 0,    y: -660, r: 250, loots: 4, guards: 1, deco: 'gate' },
    { name: '水渠', x: -580, y: -40,  r: 270, loots: 4, guards: 2, deco: 'canal' },
    { name: '作坊', x: 600,  y: 20,   r: 270, loots: 4, guards: 2, deco: 'workshop' },
    { name: '祭坛', x: 40,   y: 640,  r: 260, loots: 3, guards: 1, deco: 'altar' },
    { name: '坍塌口', x: -540, y: 600, r: 240, loots: 3, guards: 1, deco: 'collapse' }
];

function startTreasure() {
    var prevChar = save.char;
    state = newState();
    save.char = prevChar;
    state.charId = save.char;
    state.mode = 'treasure';
    state.treasure = true;
    state.theme = THEMES.dusk;
    state.levelDef = getLevel(0);
    state.time = 0;

    var ch = getChar(state.charId);
    state.palette = { color: ch.color, glow: ch.glow };
    state.player.maxHp = ch.hp;
    state.player.hp = ch.hp;
    /* 落在前庭正中，一睁眼就能看到大门 */
    state.player.x = 0;
    state.player.y = -660;
    state.cam.x = state.player.x - W / 2;
    state.cam.y = state.player.y - H / 2;

    var i, j, ang, dist;

    /* ---- 藏宝点：按片区成组撒，每组围着该区的中心散开 ---- */
    state.trLoots = [];
    for (i = 0; i < TR_ZONES.length; i += 1) {
        var zn = TR_ZONES[i];
        for (j = 0; j < zn.loots; j += 1) {
            ang = rand(0, TAU);
            dist = rand(60, zn.r * 0.78);
            state.trLoots.push({
                x: zn.x + Math.cos(ang) * dist,
                y: zn.y + Math.sin(ang) * dist,
                kind: pickTreasureKind(),
                t: rand(0, 6),
                got: false,
                hl: 0,
                zone: zn.name
            });
        }
    }
    /* 保底：目标数不够就从远处再补几个，保证一趟能搜满 */
    var need = TREASURE_GOAL + 6;
    while (state.trLoots.length < need) {
        ang = rand(0, TAU);
        dist = rand(TR_HALF_W * 0.5, TR_HALF_W * 0.82);
        state.trLoots.push({
            x: Math.cos(ang) * dist,
            y: Math.sin(ang) * dist,
            kind: pickTreasureKind(),
            t: rand(0, 6),
            got: false,
            hl: 0,
            zone: '野地'
        });
    }

    /* ---- 石灯台：沿各片区之间的空地摆几座，夜里能看清路 ---- */
    state.trLamps = [];
    for (i = 0; i < TR_ZONES.length; i += 1) {
        var zl = TR_ZONES[i];
        state.trLamps.push({
            x: zl.x + Math.cos(i * 1.9) * (zl.r + 88),
            y: zl.y + Math.sin(i * 1.9) * (zl.r + 88),
            t: rand(0, 6)
        });
    }
    state.trLamps.push({ x: 0, y: -140, t: rand(0, 6) });
    state.trLamps.push({ x: 0, y: 300, t: rand(0, 6) });

    /* ---- 守卫：分派到各片区，一半游走一半站桩扫视 ---- */
    state.guards = [];
    var gn = TREASURE_GUARDS;
    for (i = 0; i < gn; i += 1) {
        var zg = TR_ZONES[i % TR_ZONES.length];
        ang = rand(0, TAU);
        dist = rand(70, zg.r * 0.72);
        var gx0 = zg.x + Math.cos(ang) * dist;
        var gy0 = zg.y + Math.sin(ang) * dist;
        state.guards.push({
            x: gx0, y: gy0,
            hx: gx0, hy: gy0,
            r: 17 + (i % 2) * 5,
            ang: rand(0, TAU),
            spin: (i % 2 === 0) ? rand(0.5, 0.9) * (i % 4 < 2 ? 1 : -1) : 0,
            roam: (i % 2 === 0) ? 0 : 1,
            tx: gx0, ty: gy0,
            speed: 46 + rand(0, 26),
            alert: 0,
            chase: 0,
            mode: 'patrol',
            cd: 0, walk: rand(0, 6), hurt: 0
        });
    }

    state.trGot = 0;        // 已搜到的藏宝点数
    state.trCaught = 0;     // 被守卫逮住次数
    state.trEndT = 0;       // 撤离倒计时
    state.trHide = 0;       // 藏身蓄力
    state.trMsg = '';
    state.trMsgT = 0;
    state.trYield = { wood: 0, water: 0, coins: 0 };   // 本趟收获
    state.toastT = 0;
    audio.level();
    showToast('遗迹里散着木料和泉水，守卫在巡逻——站着不动能藏身', '#FFD166', 3.4);
}

/* 按权重挑藏宝点类型 */
function pickTreasureKind() {
    var total = 0, i;
    for (i = 0; i < TREASURE_KINDS.length; i += 1) { total += TREASURE_KINDS[i].w; }
    var r = rand(0, total);
    for (i = 0; i < TREASURE_KINDS.length; i += 1) {
        r -= TREASURE_KINDS[i].w;
        if (r <= 0) { return TREASURE_KINDS[i]; }
    }
    return TREASURE_KINDS[0];
}

/* 把角色/守卫夹在残墙之内 */
function trClampX(x) { return clamp(x, -TR_HALF_W + TR_FREE, TR_HALF_W - TR_FREE); }
function trClampY(y) { return clamp(y, -TR_HALF_H + TR_FREE, TR_HALF_H - TR_FREE); }

/* 夺宝的一帧：没有武器没有波次，走位 + 搜刮 + 躲守卫 */
function updateTreasure(dt) {
    var p = state.player;
    var tl = state.trLoots;
    var gd = state.guards;
    var i, g;

    state.time += dt;
    state.shake = Math.max(0, state.shake - dt * 1.6);
    state.flash = Math.max(0, state.flash - dt * 2.4);
    state.hurtVig = Math.max(0, state.hurtVig - dt * 1.6);
    if (state.toastT > 0) { state.toastT -= dt; }
    if (state.trMsgT > 0) { state.trMsgT -= dt; }
    p.iframe = Math.max(0, p.iframe - dt);
    p.hurt = Math.max(0, p.hurt - dt * 3);

    /* ---------------- 移动 */
    var kx = 0, ky = 0;
    if (input.keys['a'] || input.keys['arrowleft']) { kx -= 1; }
    if (input.keys['d'] || input.keys['arrowright']) { kx += 1; }
    if (input.keys['w'] || input.keys['arrowup']) { ky -= 1; }
    if (input.keys['s'] || input.keys['arrowdown']) { ky += 1; }
    if (input.joyActive && input.mag > 0.12) { kx += input.dx; ky += input.dy; }
    var kl = Math.sqrt(kx * kx + ky * ky);
    if (kl > 1) { kx /= kl; ky /= kl; }
    var moving = kl > 0.08;
    var ch = getChar(state.charId);
    var speed = ch.speed * 0.94;
    p.x += kx * speed * dt;
    p.y += ky * speed * dt;
    /* 残墙之内活动 */
    p.x = trClampX(p.x);
    p.y = trClampY(p.y);
    if (Math.abs(kx) > 0.05) { p.face = kx > 0 ? 1 : -1; }
    p.walk += dt * (moving ? 10 : 3);

    /* 藏身：站着不动 0.8 秒进入隐蔽，一动就解除 */
    state.trHide = moving ? 0 : Math.min(1.2, state.trHide + dt);
    var hiding = state.trHide >= 0.8;

    state.cam.x += ((p.x - W / 2) - state.cam.x) * Math.min(1, dt * 6);
    state.cam.y += ((p.y - H / 2) - state.cam.y) * Math.min(1, dt * 6);

    /* ---------------- 搜刮藏宝点 */
    var pick = 128;
    for (i = 0; i < tl.length; i += 1) {
        var lo = tl[i];
        lo.t += dt;
        if (lo.got) { continue; }
        var lx = p.x - lo.x, ly = p.y - lo.y;
        var ld = Math.sqrt(lx * lx + ly * ly);
        if (ld < pick) {
            lo.hl = Math.min(1, lo.hl + dt * 2.4);
            if (ld < 30) {
                lo.got = true;
                state.trGot += 1;
                var y = TRES_YIELD[lo.kind.kind] || TRES_YIELD.wood;
                state.trYield.wood += y.wood;
                state.trYield.water += y.water;
                state.trYield.coins += y.coins;
                addParticles(lo.x, lo.y, lo.kind.col, 14, 0.9);
                addRing(lo.x, lo.y, 52, lo.kind.col, 0.4);
                var detail = [];
                if (y.wood) { detail.push('木材+' + y.wood); }
                if (y.water) { detail.push('水源+' + y.water); }
                if (y.coins) { detail.push('金币+' + y.coins); }
                addText(lo.x, lo.y - 22, lo.kind.name + ' ' + detail.join(' '), lo.kind.col, 0.9);
                audio.pick();
                if (state.trGot >= TREASURE_GOAL) {
                    showToast('搜够了！趁守卫没围上来快撤', '#FFD166', 2.6);
                }
            }
        } else {
            lo.hl = Math.max(0, lo.hl - dt * 2);
        }
    }

    /* ---------------- 守卫 */
    for (i = 0; i < gd.length; i += 1) {
        g = gd[i];
        g.walk += dt * 4;
        g.hurt = Math.max(0, g.hurt - dt * 3);
        g.cd = Math.max(0, g.cd - dt);
        var gx = p.x - g.x, gy = p.y - g.y;
        var gd2 = Math.sqrt(gx * gx + gy * gy) || 1;
        /* 视线：扇形 100° 内 265 距离可见；藏身且距 150 开外看不见 */
        var look = Math.cos(1.6);
        var toP = { x: gx / gd2, y: gy / gd2 };
        var facing = { x: Math.cos(g.ang), y: Math.sin(g.ang) };
        var dot = facing.x * toP.x + facing.y * toP.y;
        var seen = !hiding && gd2 < 265 && dot > look;

        if (g.mode === 'patrol') {
            if (g.roam) {
                var tx2 = g.tx - g.x, ty2 = g.ty - g.y;
                var tl2 = Math.sqrt(tx2 * tx2 + ty2 * ty2);
                if (tl2 < 14) {
                    g.tx = trClampX(g.hx + rand(-220, 220));
                    g.ty = trClampY(g.hy + rand(-220, 220));
                } else {
                    g.x += (tx2 / tl2) * g.speed * dt;
                    g.y += (ty2 / tl2) * g.speed * dt;
                    g.ang = Math.atan2(ty2, tx2);
                }
            } else {
                g.ang += g.spin * dt;
            }
            g.x = trClampX(g.x); g.y = trClampY(g.y);
            if (seen) {
                g.alert += dt * 1.5;
                if (g.alert >= 1) {
                    g.mode = 'chase';
                    g.chase = 4.5;
                    audio.hurt();
                    state.trMsg = '被发现了！';
                    state.trMsgT = 1.4;
                    state.shake = Math.max(state.shake, 0.2);
                } else if (g.alert > 0.45 && g.mode !== 'suspect') {
                    g.mode = 'suspect';
                    state.trMsg = '有守卫朝这边看过来了……';
                    state.trMsgT = 1.2;
                }
            } else {
                g.alert = Math.max(0, g.alert - dt * 0.5);
                if (g.mode === 'suspect' && g.alert <= 0) { g.mode = 'patrol'; }
            }
        } else if (g.mode === 'suspect') {
            var ta2 = Math.atan2(gy, gx);
            var da2 = ta2 - g.ang;
            while (da2 > Math.PI) { da2 -= TAU; }
            while (da2 < -Math.PI) { da2 += TAU; }
            g.ang += clamp(da2, -1.6 * dt, 1.6 * dt);
            if (seen) {
                g.alert += dt * 1.6;
                if (g.alert >= 1) {
                    g.mode = 'chase'; g.chase = 4.5; audio.hurt();
                    state.trMsg = '被发现了！'; state.trMsgT = 1.4;
                }
            } else {
                g.alert = Math.max(0, g.alert - dt * 0.55);
                if (g.alert <= 0) { g.mode = 'patrol'; }
            }
        } else if (g.mode === 'chase') {
            g.chase -= dt;
            g.ang = Math.atan2(gy, gx);
            var chaseSp = g.speed * 1.75;
            if (!hiding || gd2 < 120) {
                g.x += (gx / gd2) * chaseSp * dt;
                g.y += (gy / gd2) * chaseSp * dt;
            }
            if (hiding && gd2 > 300) { g.chase = Math.min(g.chase, 0.5); }
            g.x = trClampX(g.x); g.y = trClampY(g.y);
            if (gd2 < g.r + p.r + 6 && p.iframe <= 0) {
                p.iframe = 1.4;
                p.hurt = 1;
                state.trCaught += 1;
                state.shake = Math.max(state.shake, 0.5);
                state.flash = Math.max(state.flash, 0.4);
                addParticles(p.x, p.y, '#FF6B8A', 18, 1.1);
                if (state.trGot > 0) {
                    state.trGot -= 1;
                    var dropped = null;
                    for (var di = 0; di < tl.length; di += 1) { if (tl[di].got) { dropped = tl[di]; break; } }
                    if (dropped) {
                        dropped.got = false;
                        dropped.hl = 1;
                        dropped.x = p.x + rand(-90, 90);
                        dropped.y = p.y + rand(-90, 90);
                        /* 掉出来的那份资源也要从收获里扣回去 */
                        var dy2 = TRES_YIELD[dropped.kind.kind] || TRES_YIELD.wood;
                        state.trYield.wood = Math.max(0, state.trYield.wood - dy2.wood);
                        state.trYield.water = Math.max(0, state.trYield.water - dy2.water);
                        state.trYield.coins = Math.max(0, state.trYield.coins - dy2.coins);
                    }
                    state.trMsg = '战利品被抢走一份！';
                } else {
                    state.trMsg = '被守卫逮住了，快跑！';
                }
                state.trMsgT = 1.5;
                audio.boom();
                g.chase = Math.min(g.chase, 1.2);
            }
            if (g.chase <= 0) { g.mode = 'patrol'; g.alert = 0; g.tx = g.hx; g.ty = g.hy; }
        }
    }

    /* ---------------- 收尾：搜够或者时间到就撤 */
    var allGot = state.trGot >= TREASURE_GOAL;
    var out = state.time >= TREASURE_LEN;
    if ((allGot || out) && state.trEndT === 0) {
        state.trEndT = 1.6;
        state.flash = Math.max(state.flash, 0.3);
        showToast(allGot ? '满载而归！' : '时候不早了，撤回吧', '#FFD166', 1.6);
    }
    if (state.trEndT > 0) {
        state.trEndT -= dt;
        if (state.trEndT <= 0) { endTreasure(); return; }
    }
}

/* 夺宝结算：木材与水源入库，金币照旧入账 */
function endTreasure() {
    var luck = 1 + shopLv('luck') * 0.08;
    var y = state.trYield || { wood: 0, water: 0, coins: 0 };
    var coins = Math.round(y.coins * luck);
    save.wood = (save.wood || 0) + y.wood;
    save.water = (save.water || 0) + y.water;
    save.coins = (save.coins || 0) + coins;
    save.goldEarned = (save.goldEarned || 0) + coins;
    save.treasureRuns = (save.treasureRuns || 0) + 1;
    if (state.trGot > (save.treasureBest || 0)) { save.treasureBest = state.trGot; }
    state.trCoins = coins;
    writeSave();
    audio.level();
    state.mode = 'treasuredone';
}

/* ============================================================ 家园 */

/* 院子：世界坐标，中心为原点。地方给得足，能在里头撒欢跑，不是个小框
   尺寸按「两屏宽 × 一屏七」来定：横向能走一个屏，纵向能走大半个屏 */
var HOME_W = 780;
var HOME_H = 1240;
var HOME_HALF_W = HOME_W / 2;
var HOME_HALF_H = HOME_H / 2;
var HOME_EDGE = 62;                 // 角色离院墙的余量

/* 三块功能区，逻辑与渲染都按这套坐标走 */
var HOME_HOUSE_POS = { x: 0, y: -330 };     // 房子
var HOME_PLAZA_POS = { x: 0, y: 40 };       // 中央石板小广场
var HOME_FARM_POS = { x: -150, y: 280 };    // 菜园：第一块地
var HOME_SPAWN = { x: 0, y: -40 };          // 进院子的落脚点

/* 菜园网格：一行三格，往下折行，每格是一块方正的菜畦 */
var HOME_PLOT_COLS = 3;
var HOME_PLOT_DX = 104;          // 格子中心横向间距
var HOME_PLOT_DY = 104;          // 格子中心纵向间距
var HOME_PLOT_HW = 46;           // 格子半宽
var HOME_PLOT_HH = 46;           // 格子半高

/* 装饰各归其位，院子才像有人打理过 */
var HOME_DECO_SPOT = {
    fence: { x: -270, y: 150, s: 1.35 },
    pond: { x: -250, y: -240, s: 1.1 },
    well: { x: 250, y: -120, s: 1.0 },
    tree: { x: 270, y: 160, s: 1.35 },
    lamp: { x: 115, y: -210, s: 1.15 },
    windmill: { x: 255, y: -340, s: 1.2 }
};

/* 屋子内部：一间屋子的世界坐标范围（角色可活动区域） */
var HOME_ROOM = {
    x0: -170, y0: -230,
    x1: 170, y1: 230,
    cx: 0, cy: 0
};

/* 相机夹在院子边界内，别把墙外的空白露出来 */
function homeClampCam() {
    var c = state.cam;
    var minX = -HOME_HALF_W, maxX = HOME_HALF_W - W;
    var minY = -HOME_HALF_H, maxY = HOME_HALF_H - H;
    c.x = (maxX < minX) ? (minX + maxX) / 2 : clamp(c.x, minX, maxX);
    c.y = (maxY < minY) ? (minY + maxY) / 2 : clamp(c.y, minY, maxY);
}

/* 家园里的加成：井 +15% 水源，果树 +20% 成熟速度，风车 +15% 成熟速度 */
function homeBonus() {
    var d = save.home && save.home.deco ? save.home.deco : [];
    var b = { water: 1, grow: 1 };
    if (d.indexOf('well') >= 0) { b.water = 1.15; }
    if (d.indexOf('tree') >= 0) { b.grow *= 1.2; }
    if (d.indexOf('windmill') >= 0) { b.grow *= 1.15; }
    return b;
}

/* 种子有没有解锁：通关模式任务奖励会解锁 */
function seedUnlocked(id) {
    var u = save.seedUnlocked || {};
    if (u[id]) { return true; }
    /* 第一个种子默认有，不然玩家没法起步 */
    return id === 'radish';
}

/* 买种子 */
function buySeed(id) {
    var sd = seedOf(id);
    if (!sd) { return false; }
    if (!seedUnlocked(id)) { return false; }
    if ((save.coins || 0) < sd.seed) { return false; }
    save.coins -= sd.seed;
    save.seeds[id] = (save.seeds[id] || 0) + 1;
    writeSave();
    audio.pick();
    return true;
}

/* 买药剂 */
function buyPotion(id) {
    var pt = potionOf(id);
    if (!pt) { return false; }
    if ((save.coins || 0) < pt.price) { return false; }
    save.coins -= pt.price;
    save.potions[id] = (save.potions[id] || 0) + 1;
    writeSave();
    audio.pick();
    return true;
}

/* 能不能造得起 */
function homeCanBuild(id) {
    var it = homeItemOf(id);
    if (!it) { return false; }
    var c = it.cost || {};
    if ((save.wood || 0) < (c.wood || 0)) { return false; }
    if ((save.water || 0) < (c.water || 0)) { return false; }
    if ((save.coins || 0) < (c.coins || 0)) { return false; }
    return true;
}

/* 建造：房子是替换（先退回旧房子的成本一半），地块和装饰是新增 */
function homeBuild(id) {
    var it = homeItemOf(id);
    if (!it) { return false; }
    var hm = save.home;
    if (it.type === 'house') {
        if (hm.house === id) { return false; }
        if (!homeCanBuild(id)) { return false; }
        /* 换房子：旧房子折半退款 */
        if (hm.house) {
            var old = homeItemOf(hm.house);
            if (old) {
                save.wood = (save.wood || 0) + Math.floor((old.cost.wood || 0) * 0.5);
                save.water = (save.water || 0) + Math.floor((old.cost.water || 0) * 0.5);
                save.coins = (save.coins || 0) + Math.floor((old.cost.coins || 0) * 0.5);
            }
        }
        payBuildCost(it);
        hm.house = id;
        hm.style = it.style;
        writeSave();
        audio.level();
        showToast('盖好了：' + it.name, '#8CD258', 2.2);
        return true;
    }
    if (it.type === 'plot') {
        /* 地块可以反复开垦，菜园想多大就多大（最多六块，摆得下） */
        if (hm.plots.length >= 6) { showToast('院子已经满了，六块地够种啦', '#C98A18', 2.2); return false; }
        if (!homeCanBuild(id)) { return false; }
        payBuildCost(it);
        hm.plots.push(id);
        hm.crops.push(null);
        while (hm.crops.length < hm.plots.length) { hm.crops.push(null); }
        writeSave();
        audio.level();
        showToast('开垦了一块' + it.name, '#C9A227', 2.2);
        return true;
    }
    /* deco */
    if (hm.deco.indexOf(id) >= 0) { return false; }
    if (!homeCanBuild(id)) { return false; }
    payBuildCost(it);
    hm.deco.push(id);
    writeSave();
    audio.level();
    showToast('院子里多了' + it.name, '#7BC86C', 2.2);
    return true;
}

function payBuildCost(it) {
    var c = it.cost || {};
    save.wood = (save.wood || 0) - (c.wood || 0);
    save.water = (save.water || 0) - (c.water || 0);
    save.coins = (save.coins || 0) - (c.coins || 0);
}

/* 地块索引是否合法：挡住负数、越界、非整数（点了空白处传来的 -1 等） */
function homeValidPlot(plotIdx) {
    var hm = save.home;
    if (typeof plotIdx !== 'number' || !isFinite(plotIdx)) { return false; }
    if (plotIdx !== Math.floor(plotIdx)) { return false; }
    return plotIdx >= 0 && plotIdx < hm.plots.length;
}

/* 种一株：需要背包里有种子 + 有空地块 */
function homePlant(plotIdx, seedId) {
    var sd = seedOf(seedId);
    if (!sd) { return false; }
    if ((save.seeds[seedId] || 0) <= 0) { return false; }
    var hm = save.home;
    if (!homeValidPlot(plotIdx)) { return false; }
    var slot = hm.crops[plotIdx];
    if (slot) { return false; }
    save.seeds[seedId] -= 1;
    var b = homeBonus();
    hm.crops[plotIdx] = {
        seed: seedId,
        plant: 0,                 // 已生长秒数
        need: Math.round(sd.grow / b.grow),
        yieldMul: (hm.plots[plotIdx] === 'field' ? 1.1 : 1)
    };
    writeSave();
    audio.pick();
    return true;
}

/* 站着能操作到的格子范围（角色中心到格子中心的距离） */
var HOME_REACH = 88;

/* 站到哪个格子旁就返回哪一格；都不挨着就返回 -1 */
function homePlotAt(x, y) {
    var hm = save.home;
    var best = -1, bd = 1e9;
    for (var i = 0; i < hm.plots.length; i += 1) {
        var pp = homePlotPos(i);
        var dx = x - pp.x, dy = y - pp.y;
        var d = Math.sqrt(dx * dx + dy * dy);
        if (d < bd) { bd = d; best = i; }
    }
    return (bd <= HOME_REACH) ? best : -1;
}

/* 收一株成熟的作物 */
function homeHarvest(plotIdx) {
    var hm = save.home;
    if (!homeValidPlot(plotIdx)) { return false; }
    var slot = hm.crops[plotIdx];
    if (!slot) { return false; }
    if (slot.plant < slot.need) { return false; }
    var sd = seedOf(slot.seed);
    if (!sd) { return false; }
    var coins = Math.round(sd.yield * slot.yieldMul);
    save.coins = (save.coins || 0) + coins;
    save.goldEarned = (save.goldEarned || 0) + coins;
    save.harvestTotal = (save.harvestTotal || 0) + 1;
    hm.crops[plotIdx] = null;
    writeSave();
    audio.level();
    return coins;
}

/* 浇一瓢水：花 1 水源，作物往前赶一截（长势更旺） */
function homeWater(plotIdx) {
    var hm = save.home;
    if (!homeValidPlot(plotIdx)) { return false; }
    var slot = hm.crops[plotIdx];
    if (!slot || slot.plant >= slot.need) { return false; }
    if ((save.water || 0) < 1) { return false; }
    save.water -= 1;
    slot.plant = Math.min(slot.need, slot.plant + Math.max(1, Math.round(slot.need * 0.12)));
    slot.wet = 1;
    writeSave();
    audio.pick();
    return true;
}

/* 施一把肥：花 6 金币，作物往前赶一大截 */
function homeFertilize(plotIdx) {
    var hm = save.home;
    if (!homeValidPlot(plotIdx)) { return false; }
    var slot = hm.crops[plotIdx];
    if (!slot || slot.plant >= slot.need) { return false; }
    if ((save.coins || 0) < 6) { return false; }
    save.coins -= 6;
    slot.plant = Math.min(slot.need, slot.plant + Math.max(1, Math.round(slot.need * 0.28)));
    slot.fert = 1;
    writeSave();
    audio.pick();
    return true;
}

/* 用药剂催熟：sprout 前进三成 / ripen 直接熟 / fertilizer 全部前进两成 */
function homeUsePotion(id, plotIdx) {
    var hm = save.home;
    if ((save.potions[id] || 0) <= 0) { return false; }
    if (id === 'fertilizer') {
        var any = false;
        for (var i = 0; i < hm.crops.length; i += 1) {
            var s = hm.crops[i];
            if (s && s.plant < s.need) {
                s.plant = Math.min(s.need, s.plant + Math.round(s.need * 0.2));
                any = true;
            }
        }
        if (!any) { return false; }
    } else {
        if (!homeValidPlot(plotIdx)) { return false; }
        var slot = hm.crops[plotIdx];
        if (!slot || slot.plant >= slot.need) { return false; }
        if (id === 'ripen') { slot.plant = slot.need; }
        else { slot.plant = Math.min(slot.need, slot.plant + Math.round(slot.need * 0.3)); }
    }
    save.potions[id] -= 1;
    writeSave();
    audio.pick();
    return true;
}

/* 作物生长推进（家园每帧调） */
function updateHomeGrowth(dt) {
    var hm = save.home;
    var changed = false;
    for (var i = 0; i < hm.crops.length; i += 1) {
        var s = hm.crops[i];
        if (s && s.plant < s.need) {
            s.plant = Math.min(s.need, s.plant + dt);
            changed = true;
        }
    }
    if (changed) { writeSave(); }
}

/* 作物阶段：0 种子 / 1 出苗 / 2 长大 / 3 成熟 */
function cropStage(slot) {
    if (!slot) { return -1; }
    var r = slot.need > 0 ? slot.plant / slot.need : 0;
    if (r >= 1) { return 3; }
    if (r >= 0.62) { return 2; }
    if (r >= 0.22) { return 1; }
    return 0;
}

/* ============================================================ 入口 */
function startHome() {
    state = newState();
    state.charId = save.char;
    state.mode = 'home';
    state.home = true;
    state.theme = THEMES.meadow;
    state.levelDef = getLevel(0);
    state.time = 0;
    var ch = getChar(state.charId);
    state.palette = { color: ch.color, glow: ch.glow };
    state.player.maxHp = ch.hp;
    state.player.hp = ch.hp;
    /* 落在房前，进屋就能看到房子和广场 */
    state.player.x = HOME_SPAWN.x;
    state.player.y = HOME_SPAWN.y;
    state.cam.x = state.player.x - W / 2;
    state.cam.y = clamp(state.player.y - H / 2, -HOME_HALF_H, -HOME_HALF_H + 120);
    homeClampCam();
    state.toastT = 0;
    state.homeTab = 'build';     // build | plant | bag
    state.homePick = -1;         // 选中的地块
    state.homeNear = -1;         // 当前站着的格子
    state.homeInside = false;    // 是否在屋子里
    state.homeNearDoor = false;  // 是否站在门口
    audio.level();
    showToast('这是你的地盘，想怎么建就怎么建', '#8CD258', 2.6);
}

/* 家园里的一帧：角色自由走动，相机跟着走，作物慢慢长 */
function updateHome(dt) {
    var p = state.player;
    state.time += dt;
    state.shake = Math.max(0, state.shake - dt * 1.6);
    if (state.toastT > 0) { state.toastT -= dt; }

    /* ---- 屋里：走的是室内坐标系，撞墙就停 ---- */
    if (state.homeInside) {
        updateHomeInside(dt);
        return;
    }

    var kx = 0, ky = 0;
    if (input.keys['a'] || input.keys['arrowleft']) { kx -= 1; }
    if (input.keys['d'] || input.keys['arrowright']) { kx += 1; }
    if (input.keys['w'] || input.keys['arrowup']) { ky -= 1; }
    if (input.keys['s'] || input.keys['arrowdown']) { ky += 1; }
    if (input.joyActive && input.mag > 0.12) { kx += input.dx; ky += input.dy; }
    var kl = Math.sqrt(kx * kx + ky * ky);
    if (kl > 1) { kx /= kl; ky /= kl; }
    var moving = kl > 0.08;
    var ch = getChar(state.charId);
    var speed = ch.speed * 0.86;
    p.x += kx * speed * dt;
    p.y += ky * speed * dt;
    /* 院墙之内随便逛，不再把人锁在一小格里 */
    p.x = clamp(p.x, -HOME_HALF_W + HOME_EDGE, HOME_HALF_W - HOME_EDGE);
    p.y = clamp(p.y, -HOME_HALF_H + HOME_EDGE, HOME_HALF_H - HOME_EDGE);
    if (Math.abs(kx) > 0.05) { p.face = kx > 0 ? 1 : -1; }
    p.walk += dt * (moving ? 10 : 3);

    /* 相机跟着角色，边界处贴住院墙 */
    var tx = p.x - W / 2, ty = p.y - H / 2;
    state.cam.x += (tx - state.cam.x) * Math.min(1, dt * 5);
    state.cam.y += (ty - state.cam.y) * Math.min(1, dt * 5);
    homeClampCam();

    /* 站在哪一格：供渲染高亮与"就地操作"用 */
    state.homeNear = homePlotAt(p.x, p.y);
    /* 停住时自然面向脚下那一格 */
    if (state.homeNear >= 0 && !moving) {
        var np = homePlotPos(state.homeNear);
        if (Math.abs(np.x - p.x) > 4) { p.face = (np.x > p.x) ? 1 : -1; }
    }

    /* 站在房子门口（门槛下方一小片）就提示进屋 */
    var hx = HOME_HOUSE_POS.x, hy = HOME_HOUSE_POS.y;
    var nearDoor = (Math.abs(p.x - hx) < 54) && (p.y > hy + 34) && (p.y < hy + 96);
    state.homeNearDoor = nearDoor && !!(save.home && save.home.house);
}

/* 屋外：按 E / 回车 与最近的格子交互（种 / 收 / 浇水 / 施肥） */
function homeActOnNear(seedId) {
    var idx = state.homeNear;
    if (idx < 0) { return false; }
    var hm = save.home;
    var slot = hm.crops[idx];
    if (!slot) {
        /* 空格：优先用指定种子，否则背包里挑一种 */
        var sid = seedId;
        if (!sid) {
            if (save.seeds && save.seeds.radish > 0) { sid = 'radish'; }
            else if (save.seeds) {
                for (var k in save.seeds) {
                    if (save.seeds.hasOwnProperty(k) && save.seeds[k] > 0 && seedOf(k)) { sid = k; break; }
                }
            }
        }
        if (!sid) { showToast('没有种子了，去商城买', '#C25E14', 1.8); return true; }
        if (homePlant(idx, sid)) {
            showToast('种下了 ' + seedOf(sid).name, '#5EB62E', 1.6);
        }
        return true;
    }
    if (cropStage(slot) === 3) {
        var got = homeHarvest(idx);
        showToast('收获 ' + seedOf(slot.seed).name + ' +' + got + ' 金币', '#C98A18', 1.8);
        return true;
    }
    /* 没熟：优先浇水，水源不够就施肥 */
    if ((save.water || 0) >= 1 && homeWater(idx)) {
        showToast('浇了水，' + seedOf(slot.seed).name + '长得更旺了', '#4FA8D8', 1.5);
        return true;
    }
    if (homeFertilize(idx)) {
        showToast('施了肥，' + seedOf(slot.seed).name + '窜了一截', '#8A7A3E', 1.5);
        return true;
    }
    showToast('还没熟，水源和金币都不够了', '#C25E14', 1.6);
    return true;
}

/* 进屋子 */
function enterHome() {
    state.homeInside = true;
    state.homeNearDoor = false;
    /* 站在门口内侧 */
    state.player.x = 0;
    state.player.y = 96;
    var ch = getChar(state.charId);
    state.player.face = 1;
    state.cam.x = state.player.x - W / 2;
    state.cam.y = state.player.y - H / 2;
    homeClampCam();
    audio.ui();
    showToast('进了屋，走到门口再按一下就能出去', '#8CD258', 2.4);
}

/* 出屋子 */
function exitHome() {
    state.homeInside = false;
    state.player.x = HOME_HOUSE_POS.x;
    state.player.y = HOME_HOUSE_POS.y + 96;
    state.cam.x = state.player.x - W / 2;
    state.cam.y = state.player.y - H / 2;
    homeClampCam();
    audio.ui();
}

/* 屋内一帧：室内空间里走动，碰到墙和家具就停 */
function updateHomeInside(dt) {
    var p = state.player;
    var kx = 0, ky = 0;
    if (input.keys['a'] || input.keys['arrowleft']) { kx -= 1; }
    if (input.keys['d'] || input.keys['arrowright']) { kx += 1; }
    if (input.keys['w'] || input.keys['arrowup']) { ky -= 1; }
    if (input.keys['s'] || input.keys['arrowdown']) { ky += 1; }
    if (input.joyActive && input.mag > 0.12) { kx += input.dx; ky += input.dy; }
    var kl = Math.sqrt(kx * kx + ky * ky);
    if (kl > 1) { kx /= kl; ky /= kl; }
    var moving = kl > 0.08;
    var ch = getChar(state.charId);
    var speed = ch.speed * 0.7;
    p.x += kx * speed * dt;
    p.y += ky * speed * dt;
    /* 室内墙内活动（房间见 HOME_ROOM） */
    p.x = clamp(p.x, HOME_ROOM.x0 + 26, HOME_ROOM.x1 - 26);
    p.y = clamp(p.y, HOME_ROOM.y0 + 30, HOME_ROOM.y1 + 6);
    if (Math.abs(kx) > 0.05) { p.face = kx > 0 ? 1 : -1; }
    p.walk += dt * (moving ? 9 : 3);

    /* 室内相机固定居中（房间不大，整间看得下） */
    state.cam.x = HOME_ROOM.cx - W / 2;
    state.cam.y = HOME_ROOM.cy - H / 2;
    homeClampCam();

    /* 走到门口区就提示可以出去 */
    state.homeNearDoor = (Math.abs(p.x) < 40) && (p.y > HOME_ROOM.y1 - 42);
}


/* ===== homerender.js ===== */
/* ============================================================
   家园 & 夺宝 · 渲染层
   ------------------------------------------------------------
   drawTreasure*   遗迹搜刮场景（藏宝点 / 守卫 / HUD / 结算）
   drawHome*       家园院子（房子 / 菜园 / 作物 / 建造面板）
   drawHomeBuild   建造与种植界面
*/

/* ============================================================ 夺宝渲染 */

/* 遗迹地面：踩实的废墟大地 + 分区 + 残垣 + 尘埃光束 */
function drawTreasureGround(t) {
    var camX = state.cam.x, camY = state.cam.y;
    var i;

    /* ---- 底色：跟随相机铺满屏幕 ---- */
    var plx = state.player.x - camX, ply = state.player.y - camY;
    var g0 = ctx.createRadialGradient(plx, ply, 0, plx, ply, Math.max(W, H) * 0.72);
    g0.addColorStop(0, '#8E7C5C');
    g0.addColorStop(0.45, '#736349');
    g0.addColorStop(1, '#3E3629');
    ctx.fillStyle = g0;
    ctx.fillRect(0, 0, W, H);

    /* ---- 地面小碎石与土斑（世界坐标，稀疏、不规则，不要瓷砖感） ---- */
    ctx.save();
    ctx.translate(-camX, -camY);
    for (i = 0; i < 760; i += 1) {
        var px = hash2(i, 13) * TR_HALF_W * 2 - TR_HALF_W;
        var py = hash2(29, i) * TR_HALF_H * 2 - TR_HALF_H;
        if (px < camX - 90 || px > camX + W + 90) { continue; }
        if (py < camY - 90 || py > camY + H + 90) { continue; }
        var hv = hash2(i, 41);
        if (hv < 0.4) {
            /* 细碎石粒 */
            ctx.fillStyle = hv < 0.2 ? 'rgba(190,176,144,0.26)' : 'rgba(52,44,32,0.3)';
            ctx.beginPath();
            ctx.ellipse(px, py, 2.4 + hv * 5, 1.6 + hv * 3, hv * 3, 0, TAU);
            ctx.fill();
        } else if (hv < 0.6) {
            /* 土色斑块 */
            ctx.fillStyle = 'rgba(120,100,70,0.16)';
            ctx.beginPath();
            ctx.ellipse(px, py, 16 + hv * 34, 10 + hv * 20, hv * 4, 0, TAU);
            ctx.fill();
        } else if (hv < 0.74) {
            /* 一块碎石 */
            ctx.fillStyle = 'rgba(46,38,28,0.4)';
            ctx.beginPath();
            ctx.ellipse(px + 2, py + 4, 11, 4, 0, 0, TAU);
            ctx.fill();
            ctx.fillStyle = '#78694F';
            rr(px - 9, py - 6, 18, 12, 4);
            ctx.fill();
            ctx.fillStyle = 'rgba(196,182,150,0.35)';
            rr(px - 9, py - 6, 18, 4, 2);
            ctx.fill();
        } else if (hv < 0.88) {
            /* 一丛枯草：几根细线 */
            var gc = 3 + Math.floor(hv * 10) % 4;
            ctx.strokeStyle = 'rgba(126,116,74,0.42)';
            ctx.lineWidth = 1.2;
            ctx.lineCap = 'round';
            for (var gi = 0; gi < gc; gi += 1) {
                var gx = px + (gi - gc / 2) * 3.4;
                var gh2 = 7 + hash2(i, 60 + gi) * 9;
                ctx.beginPath();
                ctx.moveTo(gx, py + 2);
                ctx.quadraticCurveTo(gx + (hash2(i, 70 + gi) - 0.5) * 7, py - gh2 * 0.6,
                    gx + (hash2(i, 80 + gi) - 0.5) * 11, py - gh2);
                ctx.stroke();
            }
        } else {
            /* 半埋在土里的石板残片 */
            ctx.save();
            ctx.translate(px, py);
            ctx.rotate((hash2(i, 91) - 0.5) * 1.4);
            ctx.fillStyle = 'rgba(44,36,26,0.34)';
            rr(-15, -4, 32, 12, 3);
            ctx.fill();
            ctx.fillStyle = 'rgba(126,114,90,0.5)';
            rr(-14, -8, 30, 13, 3);
            ctx.fill();
            ctx.fillStyle = 'rgba(198,184,152,0.28)';
            rr(-14, -8, 30, 4, 2);
            ctx.fill();
            ctx.restore();
        }
    }
    ctx.restore();

    /* ---- 各片区：地面色调 + 踩实的空地 + 区名 ---- */
    ctx.save();
    ctx.translate(-camX, -camY);
    for (i = 0; i < TR_ZONES.length; i += 1) {
        var zn = TR_ZONES[i];
        if (zn.x < camX - zn.r - 240 || zn.x > camX + W + zn.r + 240) { continue; }
        if (zn.y < camY - zn.r - 240 || zn.y > camY + H + zn.r + 240) { continue; }
        /* 片区地面：被踩实的一片土 */
        var zg = ctx.createRadialGradient(zn.x, zn.y, 0, zn.x, zn.y, zn.r);
        zg.addColorStop(0, 'rgba(206,186,142,0.24)');
        zg.addColorStop(0.66, 'rgba(178,158,118,0.10)');
        zg.addColorStop(1, 'rgba(178,158,118,0)');
        ctx.fillStyle = zg;
        ctx.beginPath();
        ctx.arc(zn.x, zn.y, zn.r, 0, TAU);
        ctx.fill();
        /* 外圈踩出来的脚印痕迹 */
        ctx.strokeStyle = 'rgba(92,78,56,0.3)';
        ctx.lineWidth = 3;
        ctx.setLineDash([18, 22]);
        ctx.beginPath();
        ctx.arc(zn.x, zn.y, zn.r * 0.86, 0, TAU);
        ctx.stroke();
        ctx.setLineDash([]);
        /* 区名 */
        var nx = zn.x - camX, ny = zn.y - camY;
        if (nx > 30 && nx < W - 30 && ny > 90 && ny < H - 30) {
            ctx.globalAlpha = 0.42;
            txt(zn.name, nx, ny + zn.r * 0.72, 17, '#2C2418', 'center', 800);
            ctx.globalAlpha = 0.92;
            txt(zn.name, nx, ny + zn.r * 0.72 - 1.5, 17, 'rgba(240,228,196,0.95)', 'center', 800);
            ctx.globalAlpha = 1;
        }
    }
    ctx.restore();

    /* ---- 片区地标建筑 ---- */
    for (i = 0; i < TR_ZONES.length; i += 1) {
        var zb = TR_ZONES[i];
        if (zb.x < camX - 420 || zb.x > camX + W + 420) { continue; }
