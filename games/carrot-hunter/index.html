/* 家园小地图：右上角，院子轮廓 + 房子 / 菜园 / 角色 */
function drawHomeMiniMap(t) {
    var hm = save.home;
    var mw = 92, mh = 92;
    var mx = W - mw - 12, my = 44;
    ctx.fillStyle = 'rgba(255,255,255,0.72)';
    rr(mx, my, mw, mh, 10);
    ctx.fill();
    ctx.strokeStyle = 'rgba(120,150,90,0.55)';
    ctx.lineWidth = 1.4;
    rr(mx + 0.5, my + 0.5, mw - 1, mh - 1, 10);
    ctx.stroke();

    var pad = 8;
    var sx = (mw - pad * 2) / HOME_W, sy = (mh - pad * 2) / HOME_H;
    function m2s(wx, wy) {
        return { x: mx + pad + (wx + HOME_HALF_W) * sx, y: my + pad + (wy + HOME_HALF_H) * sy };
    }
    /* 房子 */
    if (hm.house) {
        var hp = m2s(HOME_HOUSE_POS.x, HOME_HOUSE_POS.y);
        ctx.fillStyle = '#C2543A';
        rr(hp.x - 7, hp.y - 6, 14, 12, 3);
        ctx.fill();
    }
    /* 菜园 */
    if (hm.plots.length > 0) {
        var fp1 = m2s(HOME_FARM_POS.x - 84, HOME_FARM_POS.y - 56);
        var fp2 = m2s(HOME_FARM_POS.x + 84 + 2 * HOME_PLOT_DX, HOME_FARM_POS.y + 56);
        ctx.fillStyle = 'rgba(168,129,78,0.85)';
        rr(fp1.x, fp1.y, Math.max(10, fp2.x - fp1.x), Math.max(9, fp2.y - fp1.y), 3);
        ctx.fill();
    }
    /* 角色 */
    var pp = m2s(state.player.x, state.player.y);
    var pl = 0.5 + 0.5 * Math.sin(t * 4);
    ctx.fillStyle = withA(save.char ? getChar(save.char).color : '#FF8FA8', 0.4 + pl * 0.4);
    ctx.beginPath();
    ctx.arc(pp.x, pp.y, 5.5, 0, TAU);
    ctx.fill();
    ctx.fillStyle = '#FFFFFF';
    ctx.beginPath();
    ctx.arc(pp.x, pp.y, 2.4, 0, TAU);
    ctx.fill();
}

/* 家园顶部资源条 */
function drawHomeTopBar(t) {
    var pad = Math.min(16, W * 0.04);
    var chips = [
        { label: '木材', val: save.wood || 0, col: '#C98A18' },
        { label: '水源', val: save.water || 0, col: '#4FA8D8' },
        { label: '金币', val: save.coins || 0, col: '#E0A21A' }
    ];
    ctx.font = '700 11px system-ui, sans-serif';
    var cx = pad;
    for (var i = 0; i < chips.length; i += 1) {
        var c = chips[i];
        var label = c.label + ' ' + c.val;
        var tw = ctx.measureText(label).width;
        ctx.fillStyle = 'rgba(255,255,255,0.78)';
        rr(cx, pad, tw + 22, 21, 10);
        ctx.fill();
        ctx.fillStyle = c.col;
        ctx.beginPath();
        ctx.arc(cx + 11, pad + 10.5, 4.4, 0, TAU);
        ctx.fill();
        ctx.fillStyle = '#4A3A20';
        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';
        ctx.fillText(label, cx + 20, pad + 11);
        cx += tw + 28;
    }
}

/* ============================================================ 家园界面（建造/种植） */

/* 建造面板的卡片画法 */
function drawHomeBuildPanel(t) {
    var hm = save.home;
    var tab = state.homeTab || 'build';
    var pad = Math.min(16, W * 0.04);

    /* 铺底：面板要盖住整个场景，不然上一帧的院子会透出来 */
    var bg = ctx.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, '#EAF4DC');
    bg.addColorStop(0.6, '#DCEBC8');
    bg.addColorStop(1, '#CFE2B8');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);
    /* 远景山，和家园场景连成一气 */
    ctx.fillStyle = 'rgba(150,188,122,0.35)';
    ctx.beginPath();
    ctx.moveTo(0, H * 0.22);
    ctx.quadraticCurveTo(W * 0.25, H * 0.12, W * 0.5, H * 0.21);
    ctx.quadraticCurveTo(W * 0.75, H * 0.12, W, H * 0.22);
    ctx.lineTo(W, H * 0.36);
    ctx.lineTo(0, H * 0.36);
    ctx.closePath();
    ctx.fill();

    /* 顶部资源条 */
    drawHomeTopBar(t);

    /* 页签 */
    var tabs = [
        { id: 'build', name: '建造', col: '#C98A18' },
        { id: 'plant', name: '种植', col: '#5EB62E' },
        { id: 'bag', name: '背包', col: '#1E7E96' }
    ];
    var tw = Math.min(92, (W - pad * 2) / 3);
    for (var i = 0; i < tabs.length; i += 1) {
        var tb = tabs[i];
        var tx = pad + i * (tw + 6);
        var on = (tab === tb.id);
        ui['homeTab_' + tb.id] = { x: tx, y: pad + 30, w: tw, h: 30 };
        ctx.fillStyle = on ? tb.col : 'rgba(255,255,255,0.6)';
        rr(tx, pad + 30, tw, 30, 8);
        ctx.fill();
        ctx.fillStyle = on ? '#FFFFFF' : 'rgba(70,90,50,0.7)';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.font = '700 12.5px system-ui, sans-serif';
        ctx.fillText(tb.name, tx + tw / 2, pad + 46);
    }

    var topY = pad + 68;
    var botY = H - 52;
    var colW = W - pad * 2;

    /* 页底可用高度：下面几页都用它来把卡片撑满，免得出大片留白 */
    var availH = botY - topY;

    if (tab === 'build') {
        /* ---- 建造：房子 / 地块 / 装饰 ---- */
        var sections = [
            { title: '房子风格', ids: HOME_HOUSE_IDS },
            { title: '菜园地块', ids: HOME_PLOT_IDS },
            { title: '院子装饰', ids: HOME_DECO_IDS }
        ];
        ui.homeCards = [];
        var avail = botY - topY;
        /* 先按「每行卡片高度 = 统一值」把三段的行数加总，再反推出一个能填满的高度 */
        var totalRows = 0;
        var s;
        for (s = 0; s < sections.length; s += 1) {
            var c0 = sections[s].ids.length > 3 ? 2 : sections[s].ids.length;
            totalRows += Math.ceil(sections[s].ids.length / c0);
        }
        /* 每段标题 20px + 段后留白 8px */
        var chrome = sections.length * 28;
        var chh = Math.max(46, Math.min(72, (avail - chrome - totalRows * 6) / Math.max(1, totalRows)));
        var y = topY;
        for (s = 0; s < sections.length; s += 1) {
            var sec = sections[s];
            txt(sec.title, pad, y + 8, 11, 'rgba(60,80,44,0.8)', 'left', 800);
            y += 20;
            var cols = sec.ids.length > 3 ? 2 : sec.ids.length;
            var rows = Math.ceil(sec.ids.length / cols);
            var cwid = (colW - (cols - 1) * 8) / cols;
            for (var k = 0; k < sec.ids.length; k += 1) {
                var id = sec.ids[k];
                var it = homeItemOf(id);
                var cxx = pad + (k % cols) * (cwid + 8);
                var cyy = y + Math.floor(k / cols) * (chh + 6);
                ui.homeCards.push({ x: cxx, y: cyy, w: cwid, h: chh, id: id, type: it.type });
            }
            y += rows * (chh + 6) + 8;
        }

        /* 画卡片 */
        for (var c2 = 0; c2 < ui.homeCards.length; c2 += 1) {
            var cd = ui.homeCards[c2];
            var item = homeItemOf(cd.id);
            var builtCount = (item.type === 'house') ? (hm.house === cd.id ? 1 : 0)
                : (item.type === 'plot' ? hm.plots.filter(function (x) { return x === cd.id; }).length : (hm.deco.indexOf(cd.id) >= 0 ? 1 : 0));
            var built = builtCount > 0;
            var afford = homeCanBuild(cd.id);

            ctx.fillStyle = built ? 'rgba(200,235,170,0.9)' : 'rgba(255,255,255,0.8)';
            rr(cd.x, cd.y, cd.w, cd.h, 10);
            ctx.fill();
            ctx.strokeStyle = built ? 'rgba(90,160,50,0.7)' : withA(item.color, 0.5);
            ctx.lineWidth = 1.4;
            rr(cd.x + 0.5, cd.y + 0.5, cd.w - 1, cd.h - 1, 10);
            ctx.stroke();

            /* 图标 */
            var icx = cd.y + cd.h / 2;
            ctx.fillStyle = withA(item.color, 0.22);
            ctx.beginPath();
            ctx.arc(cd.x + 24, icx, Math.min(18, cd.h * 0.34), 0, TAU);
            ctx.fill();
            txt(item.ch, cd.x + 24, icx, Math.min(15, cd.h * 0.28), deepen(item.color, 0.7), 'center', 800);

            var txx = cd.x + 46;
            txt(item.name, txx, cd.y + cd.h * 0.32, 12, '#2C3E1C', 'left', 700);

            /* 成本 */
            var costTxt = '';
            if (item.cost.wood) { costTxt += '木' + item.cost.wood + ' '; }
            if (item.cost.water) { costTxt += '水' + item.cost.water + ' '; }
            if (item.cost.coins) { costTxt += '金' + item.cost.coins; }
            var costCol = afford ? 'rgba(90,80,50,0.75)' : 'rgba(200,90,90,0.85)';
            txt(costTxt.trim() || '免费', txx, cd.y + cd.h * 0.66, 9.5, costCol, 'left', 600);

            if (built) {
                txt(item.type === 'plot' ? '已有 ×' + builtCount : '已建成', cd.x + cd.w - 8, cd.y + cd.h * 0.32, 10, 'rgba(70,130,40,0.9)', 'right', 800);
            }
        }
    } else if (tab === 'plant') {
        /* ---- 种植：选地块 + 选种子 ---- */
        var plotN2 = hm.plots.length;
        var pick = state.homePick;

        /* 按可用高度反推卡片高度，别在底部留一大片空 */
        var plotRows2 = plotN2 > 0 ? Math.ceil(plotN2 / 4) : 0;
        var seedRows2 = Math.ceil(SEED_IDS.length / 4);
        var fixed2 = 20 + 14 + 18;
        var per2 = (availH - fixed2) / Math.max(1, plotRows2 + seedRows2);
        var ph2 = Math.max(62, Math.min(118, per2 - 8));
        var sh2 = Math.max(56, Math.min(104, per2 - 8));

        txt('菜园地块（点一块地选中）', pad, topY + 8, 11, 'rgba(60,80,44,0.8)', 'left', 800);
        var gy = topY + 20;
        ui.homePlots = [];
        var colsP = Math.min(4, Math.max(1, plotN2));
        var pw = (colW - (colsP - 1) * 8) / colsP;
        for (var pp = 0; pp < plotN2; pp += 1) {
            var pxx2 = pad + (pp % 4) * (pw + 8);
            var pyy2 = gy + Math.floor(pp / 4) * (ph2 + 8);
            ui.homePlots.push({ x: pxx2, y: pyy2, w: pw, h: ph2, idx: pp });
            var sel3 = (pick === pp);

            ctx.fillStyle = sel3 ? 'rgba(255,244,214,0.95)' : 'rgba(255,255,255,0.72)';
            rr(pxx2, pyy2, pw, ph2, 10);
            ctx.fill();
            ctx.strokeStyle = sel3 ? 'rgba(94,182,46,0.95)' : 'rgba(150,140,110,0.5)';
            ctx.lineWidth = sel3 ? 2.2 : 1.3;
            rr(pxx2 + 0.5, pyy2 + 0.5, pw - 1, ph2 - 1, 10);
            ctx.stroke();

            txt('第 ' + (pp + 1) + ' 块', pxx2 + pw / 2, pyy2 + 13, 10, 'rgba(60,80,44,0.85)', 'center', 700);
            /* 迷你地块缩略图 */
            var miniY = pyy2 + ph2 * 0.5;
            ctx.fillStyle = hm.plots[pp] === 'field' ? '#A8814E' : '#96754A';
            rr(pxx2 + pw / 2 - 22, miniY - 14, 44, 28, 5);
            ctx.fill();
            drawHomeCrop(hm.crops[pp], pxx2 + pw / 2, miniY + 3, 23, t);

            var st4 = hm.crops[pp] ? cropStage(hm.crops[pp]) : -1;
            var stTxt = st4 === 3 ? '可收获' : (st4 === -1 ? '空地' : (st4 === 0 ? '刚播种' : '生长中'));
            var stCol = st4 === 3 ? '#C98A18' : (st4 === -1 ? 'rgba(120,110,90,0.8)' : 'rgba(94,140,50,0.9)');
            txt(stTxt, pxx2 + pw / 2, pyy2 + ph2 - 12, 9.5, stCol, 'center', 700);
        }
        if (plotN2 === 0) {
            txt('还没有菜地——先到「建造」里开垦一块', pad, gy + 22, 11, 'rgba(140,90,60,0.8)', 'left', 600);

        ui.homeSeeds = [];

            var usable = unlocked && own > 0 && pick >= 0 && !(hm.crops[pick]);
            ctx.fillStyle = usable ? 'rgba(255,255,255,0.88)' : 'rgba(232,232,228,0.6)';
            rr(sxx, syy, sw, sh2, 10);
            ctx.fill();
            ctx.strokeStyle = usable ? withA(sdata.color, 0.7) : 'rgba(150,150,150,0.35)';
            ctx.lineWidth = 1.3;
            rr(sxx + 0.5, syy + 0.5, sw - 1, sh2 - 1, 10);
            ctx.stroke();

            /* 种子小圆牌 */
            var sRad = Math.min(15, sh2 * 0.24);

            ctx.arc(sxx + sw / 2, syy + sh2 * 0.32, sRad, 0, TAU);

            txt(unlocked ? sdata.name : '未解锁', sxx + sw / 2, syy + sh2 * 0.63, 9.5,

            txt('×' + own, sxx + sw / 2, syy + sh2 * 0.85, 9.5,

        txt('种子', pad, by + 8, 11, 'rgba(60,80,44,0.8)', 'left', 800);
        by += 20;
        ui.homeBag = [];
        var bw = (colW - 3 * 8) / 4;
        for (var b2 = 0; b2 < SEED_IDS.length; b2 += 1) {

            ctx.lineWidth = 1.3;

            var bRad = Math.min(14, bchh * 0.22);

            ctx.arc(bxx + bw / 2, byy + bchh * 0.31, bRad, 0, TAU);

            txt(bdata.ch, bxx + bw / 2, byy + bchh * 0.31, Math.min(13, bchh * 0.22), deepen(bdata.color, 0.72), 'center', 800);
            txt(bunl ? bdata.name : '未解锁', bxx + bw / 2, byy + bchh * 0.62, 9,

        var py3 = by + Math.ceil(SEED_IDS.length / 4) * (bchh + 8) + 4;

        for (var b3 = 0; b3 < POTION_IDS.length; b3 += 1) {

            var pxx3 = pad + (b3 % 3) * (phw + 8);

            ctx.lineWidth = 1.3;
            rr(pxx3 + 0.5, pyy3 + 0.5, phw - 1, bchh - 1, 10);

            var pRad = Math.min(15, bchh * 0.24);
            ctx.fillStyle = withA(pdata.color, 0.26);
            ctx.beginPath();
            ctx.arc(pxx3 + phw / 2, pyy3 + bchh * 0.31, pRad, 0, TAU);

            txt(pdata.ch, pxx3 + phw / 2, pyy3 + bchh * 0.31, Math.min(14, bchh * 0.23), deepen(pdata.color, 0.7), 'center', 800);

            txt(pdata.name, pxx3 + phw / 2, pyy3 + bchh * 0.60, 10, '#2C3E1C', 'center', 700);

                withA(deepen(pdata.color, 0.6), 0.85), 'center', 600);

    /* 返回按钮：退回院子（不是退回大厅） */
    var bh = Math.min(44, H * 0.062);
    ui.homeBack = { x: pad, y: H - bh - 8, w: Math.min(120, W * 0.34), h: bh };
    neonBtn(ui.homeBack, '← 回院子', '#5E7E4E', null, t);

    /* 提示：选中的地块 */
    if (tab === 'plant' && state.homePick >= 0) {
        var pickTxt = '已选中 第 ' + (state.homePick + 1) + ' 块地';
        ctx.font = '700 11px system-ui, sans-serif';

        rr(W - pad - ptw - 18, H - bh - 8, ptw + 18, bh, bh * 0.4);
        ctx.fill();
        ctx.fillStyle = '#FFFFFF';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(pickTxt, W - pad - ptw / 2 - 9, H - bh / 2 - 8);
    }
}


/* ===== relief.js ===== */
/* ============================================================
   九张地图的专属地貌
   每个主题在 THEMES.xxx.relief.kind 里指定一种地貌写法，
   这里按 cell 网格只画视野内的部分，画面外一律不画，保证手机帧率。
   坐标约定：调用时外层已经把原点摆到屏幕左上角，
   屏幕上某点 = 世界坐标 - 相机 × 视差系数。
   ============================================================ */

var RELIEF_DEFAULT = {
    kind: 'rows', marks: 'farm', label: '开阔草场',
    lake: 0.06, trail: 0.52, scatter: 0.74, foliage: 0.70,
    grass: 0.30, giant: 1000, tintRows: '#C7AE6E'
};

function reliefCfg(th) {
    return (th && th.relief) ? th.relief : RELIEF_DEFAULT;
}

/* ------------------------------------------------------------ 地面破坏
   崩岩 / 星陨一类攻击砸出来的口子：先炸开一道裂口，0.2~0.3 秒内收干净，
   之后地面又是原来那副地貌，不留疤。画的时候用世界坐标，跟着镜头走。 */
function drawQuakes() {
    if (!state || !state.quakes || !state.quakes.length) { return; }
    for (var i = 0; i < state.quakes.length; i += 1) {
        var q = state.quakes[i];
        var k = q.t / q.life;                 // 0 → 1
        // 前 30% 张开，之后往回收，最后淡没了就是"恢复地貌"
        var open = k < 0.3 ? (k / 0.3) : (1 - (k - 0.3) / 0.7);
        var fade = 1 - k * k;
        if (open <= 0 || fade <= 0) { continue; }

        var r = q.r * (0.55 + open * 0.45);
        ctx.save();
        ctx.translate(q.x, q.y);

        // 凹陷：比地面深一号的暗块
        ctx.globalAlpha = 0.42 * fade;
        var pit = ctx.createRadialGradient(0, 0, r * 0.1, 0, 0, r);
        pit.addColorStop(0, 'rgba(58,42,26,0.72)');
        pit.addColorStop(0.6, 'rgba(74,56,34,0.42)');
        pit.addColorStop(1, 'rgba(74,56,34,0)');
        ctx.fillStyle = pit;
        ctx.beginPath();
        ctx.ellipse(0, 0, r, r * 0.62, 0, 0, TAU);
        ctx.fill();

        // 放射状裂纹：几条从中心甩出去的折线
        ctx.globalAlpha = 0.72 * fade;
        ctx.strokeStyle = 'rgba(46,32,18,0.85)';
        ctx.lineWidth = 2.2;
        ctx.lineCap = 'round';
        ctx.beginPath();
        for (var j = 0; j < 7; j += 1) {
            var a = (j / 7) * TAU + hash2(q.seed + j, 3) * 0.8;
            var len = r * (0.72 + hash2(q.seed + j, 11) * 0.7) * (0.5 + open * 0.5);
            var mx = Math.cos(a) * len * 0.55, my = Math.sin(a) * len * 0.34;
            ctx.moveTo(0, 0);
            ctx.quadraticCurveTo(mx, my, Math.cos(a) * len, Math.sin(a) * len * 0.62);
        }
        ctx.stroke();

        // 翻出来的碎土
        ctx.globalAlpha = 0.66 * fade * open;
        ctx.fillStyle = q.color;
        for (var m = 0; m < 6; m += 1) {
            var ma = hash2(q.seed + m, 21) * TAU;
            var md = r * (0.5 + hash2(q.seed + m, 31) * 0.6) * (0.6 + open * 0.5);
            ctx.beginPath();
            ctx.ellipse(Math.cos(ma) * md, Math.sin(ma) * md * 0.62,
                1.6 + hash2(q.seed + m, 41) * 2.2, 1.2 + hash2(m, q.seed) * 1.4, ma, 0, TAU);
            ctx.fill();
        }

        // 刚砸开的瞬间来一圈冲击亮边
        if (k < 0.35) {
            ctx.globalAlpha = (1 - k / 0.35) * 0.5;
            ctx.strokeStyle = q.color;
            ctx.lineWidth = 2.4;
            ctx.beginPath();
            ctx.ellipse(0, 0, r * 1.25, r * 0.78, 0, 0, TAU);
            ctx.stroke();
        }

        ctx.globalAlpha = 1;
        ctx.restore();
    }
}

function drawRelief(camX, camY, th) {
    var R = reliefCfg(th);
    if (R.kind === 'rows') { drawReliefRows(camX, camY, th, R); }
    else if (R.kind === 'hills') { drawReliefHills(camX, camY, th, R); }
    else if (R.kind === 'creek') { drawReliefCreek(camX, camY, th, R); }
    else if (R.kind === 'roots') { drawReliefRoots(camX, camY, th, R); }
    else if (R.kind === 'ridge') { drawReliefRidge(camX, camY, th, R); }
    else if (R.kind === 'bamboo') { drawReliefBamboo(camX, camY, th, R); }
    else if (R.kind === 'plots') { drawReliefPlots(camX, camY, th, R); }
    else if (R.kind === 'bloom') { drawReliefBloom(camX, camY, th, R); }
    else if (R.kind === 'rings') { drawReliefRings(camX, camY, th, R); }
}

/* --------------------------------------------------- 1. 胡萝卜田：规整田垄
   一条条平行耕垄 + 每隔几垄一条宽田埂，垄上有一撮撮胡萝卜苗 */
function drawReliefRows(camX, camY, th, R) {
    var gap = 56;
    var soil = R.tintRows || '#C7AE6E';
    var y0 = Math.floor(camY / gap) - 1;
    var y1 = Math.floor((camY + H) / gap) + 1;
    var gy, row, y, band, i, sx;

    for (gy = y0; gy <= y1; gy += 1) {
        row = gy;
        y = gy * gap - camY;
        band = wrapMod(row, 7) === 0;          // 每 7 垄一条田埂

        if (band) {
            ctx.fillStyle = withA(deepen(soil, 0.80), 0.40);
            ctx.fillRect(0, y - 4, W, 11);
            ctx.fillStyle = withA('#FFF3C4', 0.16);
            ctx.fillRect(0, y - 5, W, 2);
        } else {
            // 垄的暗側 + 亮脊，凑出翻耕过的立体感
            ctx.fillStyle = withA(deepen(soil, 1.02), 0.20);
            ctx.fillRect(0, y, W, 3.2);
            ctx.fillStyle = withA('#FFFBE0', 0.20);
            ctx.fillRect(0, y - 1.6, W, 1.8);
        }

        // 垄上的萝卜苗：每 46px 一撮，长得整整齐齐
        if (!band && wrapMod(row, 2) === 0) {
            ctx.fillStyle = withA(th.accent, 0.5);
            for (sx = wrapMod(-camX, 46); sx < W; sx += 46) {
                var hh2 = hash2(Math.floor((sx + camX) / 46) + 5, row + 13);
                if (hh2 > 0.62) { continue; }
                ctx.beginPath();
                ctx.ellipse(sx, y - 3.4, 4.2, 2.6, 0, 0, TAU);
                ctx.fill();
            }
        }
    }

    // 地头的水渠：一条竖着穿过田地的窄水沟
    var chGap = 640;
    var c0 = Math.floor(camX / chGap) - 1;
    var c1 = Math.floor((camX + W) / chGap) + 1;
    for (i = c0; i <= c1; i += 1) {
        if (hash2(i + 77, 3) > 0.55) { continue; }
        var cx = i * chGap + hash2(i + 9, 21) * 120 - camX;
        var wch = 12 + hash2(i + 33, 8) * 8;
        ctx.fillStyle = withA(deepen(th.water || '#8FDCF0', 0.86), 0.42);
        ctx.fillRect(cx, 0, wch, H);
        ctx.fillStyle = withA('#FFFFFF', 0.22);
        ctx.fillRect(cx + 1, 0, 2, H);
    }
}

/* --------------------------------------------------- 2. 蒲公英坡：等高线缓丘
   一个个椭圆丘体，沿等高线画圈，坡面受光的一侧亮、背光的一侧暗 */
function drawReliefHills(camX, camY, th, R) {
    var cell = 620;
    var px = camX * 0.74, py = camY * 0.74;
    var x0 = Math.floor(px / cell) - 1;
    var x1 = Math.floor((px + W) / cell) + 1;
    var y0 = Math.floor(py / cell) - 1;
    var y1 = Math.floor((py + H) / cell) + 1;
    var gx, gy, h, cx, cy, rx, ry, k, f;

    for (gy = y0; gy <= y1; gy += 1) {
        for (gx = x0; gx <= x1; gx += 1) {
            h = hash2(gx + 27, gy + 63);
            if (h > 0.66) { continue; }
            cx = gx * cell + (0.2 + hash2(gx + 5, gy + 91) * 0.6) * cell - px;
            cy = gy * cell + (0.2 + hash2(gx + 71, gy + 3) * 0.6) * cell - py;
            rx = cell * (0.52 + hash2(gx + 15, gy + 47) * 0.34);
            ry = rx * (0.46 + hash2(gx + 39, gy + 11) * 0.24);
            if (cx + rx < 0 || cx - rx > W || cy + ry < 0 || cy - ry > H) { continue; }

            // 丘体：中心偏亮、边缘压暗，做出鼓起来的感觉
            var gg = ctx.createRadialGradient(cx - rx * 0.22, cy - ry * 0.28, rx * 0.05, cx, cy, rx);
            gg.addColorStop(0, withA('#FFF6CE', 0.26));
            gg.addColorStop(0.55, withA(th.g2, 0.16));
            gg.addColorStop(1, withA(deepen(th.accent, 0.9), 0.20));
            ctx.fillStyle = gg;
            ctx.save();
            ctx.translate(cx, cy);
            ctx.scale(1, ry / rx);
            ctx.beginPath();
            ctx.arc(0, 0, rx, 0, TAU);
            ctx.fill();
            ctx.restore();

            // 等高线：两三圈由外到内逐渐变淡
            ctx.save();
            ctx.translate(cx, cy);
            ctx.scale(1, ry / rx);
            for (k = 2; k >= 0; k -= 1) {
                f = 0.42 + k * 0.26;
                ctx.strokeStyle = withA(deepen(th.accent, 1.05), 0.13 - k * 0.028);
                ctx.lineWidth = 2.2 - k * 0.4;
                ctx.beginPath();
                ctx.ellipse(rx * 0.1 * k, ry * 0.06 * k, rx * f, rx * f, 0, 0, TAU);
                ctx.stroke();
            }
            ctx.restore();
        }
    }
}

/* --------------------------------------------------- 3. 清溪浅滩：纵横河网
   横向主河道 + 纵向支流，都按正弦连续推算，跨格不会出现断头 */
function drawReliefCreek(camX, camY, th, R) {
    var per = 760;
    var water = th.water || '#8FDCF0';
    var i0 = Math.floor(camY / per) - 1;
    var i1 = Math.floor((camY + H) / per) + 1;
    var i, base, A1, A2, p1, p2, wd, pts, sx, wx, yc, n, k;

    for (i = i0; i <= i1; i += 1) {
        base = i * per + hash2(i + 3, 17) * 220;
        A1 = 46 + hash2(i + 11, 5) * 96;
        A2 = 16 + hash2(i + 23, 9) * 42;
        p1 = hash2(i + 31, 2) * TAU;
        p2 = hash2(i + 41, 6) * TAU;
        wd = 22 + hash2(i + 51, 4) * 40;
        pts = [];
        for (sx = -20; sx <= W + 20; sx += 20) {
            wx = camX + sx;
            yc = base + A1 * Math.sin(wx * 0.0015 + p1) + A2 * Math.sin(wx * 0.0044 + p2);
            pts.push(sx, yc - camY);
        }
        drawRiverBand(pts, wd, water, th);
    }

    // 纵向支流：细一点，把主流串成网
    per = 980;
    i0 = Math.floor(camX / per) - 1;
    i1 = Math.floor((camX + W) / per) + 1;
    for (i = i0; i <= i1; i += 1) {
        if (hash2(i + 61, 13) > 0.6) { continue; }
        base = i * per + hash2(i + 7, 29) * 260;
        A1 = 40 + hash2(i + 19, 3) * 70;
        wd = 13 + hash2(i + 37, 8) * 16;
        p1 = hash2(i + 43, 5) * TAU;
        pts = [];
        for (n = -20; n <= H + 20; n += 20) {
            var wy = camY + n;
            var xc = base + A1 * Math.sin(wy * 0.0019 + p1);
            pts.push(xc - camX, n);
        }
        drawRiverBand(pts, wd, water, th);
    }
}

/* 把一串中心点画成一条连续水道：暗岸 → 水面 → 波纹 */
function drawRiverBand(pts, wd, water, th) {
    var n = pts.length / 2;
    if (n < 2) { return; }
    var i, px2, py2, half;

    // 上下沿先按相邻点法线算一半宽度，保证拐弯处不会被拉细
    var top = [], bot = [];
    for (i = 0; i < n; i += 1) {
        var ax = pts[i * 2], ay = pts[i * 2 + 1];
        var bx = pts[(i + 1 < n ? i + 1 : i) * 2], by = pts[(i + 1 < n ? i + 1 : i) * 2 + 1];
        var cx2 = pts[(i - 1 >= 0 ? i - 1 : 0) * 2], cy2 = pts[(i - 1 >= 0 ? i - 1 : 0) * 2 + 1];
        var dx = bx - cx2, dy = by - cy2;
        var len = Math.sqrt(dx * dx + dy * dy) || 1;
        var nx = -dy / len, ny = dx / len;
        half = wd * 0.5;
        top.push(ax + nx * half, ay + ny * half);
        bot.push(ax - nx * half, ay - ny * half);
    }

    // 湿岸
    ctx.strokeStyle = withA(deepen(th.grid, 0.72), 0.30);
    ctx.lineWidth = wd + 9;
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(pts[0], pts[1]);
    for (i = 1; i < n; i += 1) { ctx.lineTo(pts[i * 2], pts[i * 2 + 1]); }
    ctx.stroke();

    // 水体
    ctx.beginPath();
    ctx.moveTo(top[0], top[1]);
    for (i = 1; i < n; i += 1) { ctx.lineTo(top[i * 2], top[i * 2 + 1]); }
    for (i = n - 1; i >= 0; i -= 1) { ctx.lineTo(bot[i * 2], bot[i * 2 + 1]); }
    ctx.closePath();
    ctx.fillStyle = withA(water, 0.60);
    ctx.fill();

    // 水面反光：几段短横白线，随时间错开
    var t = world.tick;
    ctx.strokeStyle = 'rgba(255,255,255,0.34)';
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    for (i = 2; i < n - 2; i += 3) {
        px2 = pts[i * 2] + Math.sin(i * 1.7 + t * 1.6) * wd * 0.16;
        py2 = pts[i * 2 + 1];
        ctx.moveTo(px2 - wd * 0.16, py2 - Math.sin(t * 1.2 + i) * 1.2);
        ctx.lineTo(px2 + wd * 0.16, py2 + Math.sin(t * 1.2 + i) * 1.2);
    }
    ctx.stroke();
}

/* --------------------------------------------------- 4. 蘑菇古林：根网与菌斑
   每格几条从中心爬出去的粗根，根间散布发光菌斑 */
function drawReliefRoots(camX, camY, th, R) {
    var cell = 520;
    var x0 = Math.floor(camX / cell) - 1;
    var x1 = Math.floor((camX + W) / cell) + 1;
    var y0 = Math.floor(camY / cell) - 1;
    var y1 = Math.floor((camY + H) / cell) + 1;
    var gx, gy, h, cx, cy, i, ang, len, ex, ey, bendx, bendy;

    for (gy = y0; gy <= y1; gy += 1) {
        for (gx = x0; gx <= x1; gx += 1) {
            h = hash2(gx + 57, gy + 19);
            if (h > 0.72) { continue; }
            cx = gx * cell + (0.25 + hash2(gx + 3, gy + 67) * 0.5) * cell - camX;
            cy = gy * cell + (0.25 + hash2(gx + 83, gy + 7) * 0.5) * cell - camY;
            if (cx < -cell || cx > W + cell || cy < -cell || cy > H + cell) { continue; }

            var cnt = 3 + Math.floor(hash2(gx + 23, gy + 41) * 3);
            for (i = 0; i < cnt; i += 1) {
                ang = (i / cnt) * TAU + hash2(gx + i * 7, gy + 5) * 0.9;
                len = cell * (0.4 + hash2(gx + i * 11, gy + 13) * 0.34);
                ex = cx + Math.cos(ang) * len;
                ey = cy + Math.sin(ang) * len;
                bendx = (ex - cx) * 0.5 - Math.sin(ang) * len * 0.28;
                bendy = (ey - cy) * 0.5 + Math.cos(ang) * len * 0.28;

                ctx.strokeStyle = withA(deepen(th.accent, 0.62), 0.30);
                ctx.lineWidth = 9 + hash2(gx + i, gy) * 6;
                ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(cx, cy);
                ctx.quadraticCurveTo(cx + bendx, cy + bendy, ex, ey);
                ctx.stroke();

                ctx.strokeStyle = withA('#C7A472', 0.22);
                ctx.lineWidth = 3.4;
                ctx.beginPath();
                ctx.moveTo(cx, cy);
                ctx.quadraticCurveTo(cx + bendx, cy + bendy, ex, ey);
                ctx.stroke();
            }

            // 菌斑：暗紫的一摊，边缘带一圈微光
            if (hash2(gx + 97, gy + 31) < 0.55) {
                var sx = cx + (hash2(gx + 61, gy + 9) - 0.5) * cell * 0.5;
                var sy = cy + (hash2(gx + 29, gy + 53) - 0.5) * cell * 0.5;
                var rr2 = 26 + hash2(gx + 47, gy + 77) * 40;
                var mg = ctx.createRadialGradient(sx, sy, rr2 * 0.1, sx, sy, rr2);
                mg.addColorStop(0, withA(th.decoA || '#D06AAE', 0.34));
                mg.addColorStop(0.7, withA(th.decoA || '#D06AAE', 0.16));
                mg.addColorStop(1, withA(th.decoA || '#D06AAE', 0));
                ctx.fillStyle = mg;
                ctx.beginPath();
                ctx.ellipse(sx, sy, rr2, rr2 * 0.66, 0, 0, TAU);
                ctx.fill();
            }
        }
    }
}

/* --------------------------------------------------- 5. 落霞山脊：阶梯状岩脊
   横向的一道道岩坎，坎下压一道深影，做出梯田式台地 */
function drawReliefRidge(camX, camY, th, R) {
    var gap = 124;
    var y0 = Math.floor(camY / gap) - 1;
    var y1 = Math.floor((camY + H) / gap) + 1;
    var gy, sx, base, yy, i;

    for (gy = y0; gy <= y1; gy += 1) {
        base = gy * gap - camY;
        var amp = 10 + hash2(gy + 13, 5) * 16;
        var ph = hash2(gy + 29, 9) * TAU;

        // 岩脊线本身：一条起伏的高光阶梯边
        ctx.beginPath();
        ctx.moveTo(-4, base + Math.sin(ph) * amp);
        for (sx = 40; sx <= W + 40; sx += 40) {
            yy = base + Math.sin((camX + sx) * 0.0026 + ph) * amp
                + Math.sin((camX + sx) * 0.0071 + ph * 1.7) * amp * 0.4;
            ctx.lineTo(sx, yy);
        }
        ctx.strokeStyle = withA('#F6D9A4', 0.30);
        ctx.lineWidth = 3.2;
        ctx.stroke();

        // 坎下的阴影带：越往下越淡
        ctx.beginPath();
        ctx.moveTo(-4, base + Math.sin(ph) * amp);
        for (sx = 40; sx <= W + 40; sx += 40) {
            yy = base + Math.sin((camX + sx) * 0.0026 + ph) * amp
                + Math.sin((camX + sx) * 0.0071 + ph * 1.7) * amp * 0.4;
            ctx.lineTo(sx, yy);
        }
        ctx.lineTo(W + 4, base + 26);
        ctx.lineTo(-4, base + 26);
        ctx.closePath();
        ctx.fillStyle = withA(deepen(th.accent, 0.72), 0.16);
        ctx.fill();

        // 坡上的碎石
        ctx.fillStyle = withA('#9A8874', 0.22);
        for (i = 0; i < 6; i += 1) {
            var rx2 = hash2(gy * 13 + i, Math.floor(camX / 220) + i) * W;
            ctx.beginPath();
            ctx.ellipse(rx2, base + 8 + hash2(i, gy) * 18, 3 + hash2(i + 5, gy) * 4,
                1.6 + hash2(i + 9, gy) * 2, hash2(i, gy + 3) * 2, 0, TAU);
            ctx.fill();
        }
    }
}

/* --------------------------------------------------- 6. 竹影幽径：竹竿柱阵
   一格几根竹子，竿身分节、顶部带叶，密度高到能挡住视线 */
function drawReliefBamboo(camX, camY, th, R) {
    var cell = 150;
    var x0 = Math.floor(camX / cell) - 1;
    var x1 = Math.floor((camX + W) / cell) + 1;
    var y0 = Math.floor(camY / cell) - 1;
    var y1 = Math.floor((camY + H) / cell) + 1;
    var gx, gy, i, bx, by, hh2, w, k;

    for (gy = y0; gy <= y1; gy += 1) {
        for (gx = x0; gx <= x1; gx += 1) {
            var n = 1 + Math.floor(hash2(gx + 17, gy + 71) * 3);
            for (i = 0; i < n; i += 1) {
                bx = gx * cell + hash2(gx + i * 13, gy + 3) * cell - camX;
                by = gy * cell + hash2(gx + i * 29, gy + 11) * cell - camY;
                hh2 = 108 + hash2(gx + i * 7, gy + 19) * 92;
                w = 3.4 + hash2(gx + i * 5, gy + 23) * 2.6;
                if (bx < -20 || bx > W + 20) { continue; }

                // 根部的叶影
                ctx.fillStyle = 'rgba(38,64,34,0.16)';
                ctx.beginPath();
                ctx.ellipse(bx + w, by, w * 2.2, w * 0.9, 0, 0, TAU);
                ctx.fill();

                // 竿：左暗右亮的渐变，撑出圆管质感
                var lg = ctx.createLinearGradient(bx - w, 0, bx + w, 0);
                lg.addColorStop(0, '#5E9E46');
                lg.addColorStop(0.42, '#9ECF74');
                lg.addColorStop(1, '#6AA84E');
                ctx.fillStyle = lg;
                ctx.fillRect(bx - w, by - hh2, w * 2, hh2);

                // 竹节
                ctx.strokeStyle = 'rgba(52,96,40,0.5)';
                ctx.lineWidth = 1;
                ctx.beginPath();
                for (k = 1; k * 26 < hh2; k += 1) {
                    ctx.moveTo(bx - w, by - k * 26);
                    ctx.lineTo(bx + w, by - k * 26 - 0.6);
                }
                ctx.stroke();

                // 叶：梢部三对细长叶
                ctx.fillStyle = 'rgba(120,178,86,0.72)';
                for (k = 0; k < 3; k += 1) {
                    var ly = by - hh2 + 6 + k * 13;
                    var dirv = (k % 2) ? 1 : -1;
                    ctx.save();
                    ctx.translate(bx, ly);
                    ctx.rotate(dirv * (0.5 + hash2(gx + k, gy + i) * 0.5));
                    ctx.beginPath();
                    ctx.ellipse(dirv * 13, 0, 13, 2.6, 0, 0, TAU);
                    ctx.fill();
                    ctx.restore();
                }

                // 落在地上的横向竹影，把光斑剁碎
                ctx.fillStyle = 'rgba(40,70,36,0.09)';
                ctx.beginPath();
                ctx.ellipse(bx + 10, by + 3, 22, 4, 0.2, 0, TAU);
                ctx.fill();
            }
        }
    }
}

/* --------------------------------------------------- 7. 南瓜灯谷：方格瓜田
   一格一块矩形田，田里起垄，有的种着南瓜，有的只剩瓜藤 */
function drawReliefPlots(camX, camY, th, R) {
    var cell = 420;
    var x0 = Math.floor(camX / cell) - 1;
    var x1 = Math.floor((camX + W) / cell) + 1;
    var y0 = Math.floor(camY / cell) - 1;
    var y1 = Math.floor((camY + H) / cell) + 1;
    var gx, gy, px2, py2, sw, sh, i, k;

    for (gy = y0; gy <= y1; gy += 1) {
        for (gx = x0; gx <= x1; gx += 1) {
            px2 = gx * cell - camX;
            py2 = gy * cell - camY;
            if (px2 + cell < 0 || px2 > W || py2 + cell < 0 || py2 > H) { continue; }

            // 田块底色：同一块田一个色调，块与块之间自然分界
            ctx.fillStyle = withA(hash2(gx + 7, gy + 31) > 0.5 ? '#C9A85C' : '#B8984E', 0.15);
            ctx.fillRect(px2, py2, cell, cell);

            // 田埂边界
            ctx.strokeStyle = withA(deepen(th.accent, 0.66), 0.26);
            ctx.lineWidth = 3;
            ctx.strokeRect(px2, py2, cell, cell);

            var horiz = hash2(gx + 41, gy + 13) > 0.5;
            var rows = 5;
            ctx.strokeStyle = withA('#8A6A32', 0.20);
            ctx.lineWidth = 1.8;
            ctx.beginPath();
            for (i = 1; i < rows; i += 1) {
                var f = px2 + i * (cell / rows);
                var g2 = py2 + i * (cell / rows);
                if (horiz) { ctx.moveTo(f, py2 + 6); ctx.lineTo(f, py2 + cell - 6); }
                else { ctx.moveTo(px2 + 6, g2); ctx.lineTo(px2 + cell - 6, g2); }
            }
            ctx.stroke();

            // 瓜：有的田种上了，有的还空着
            if (hash2(gx + 53, gy + 71) < 0.62) {
                var cnt = 2 + Math.floor(hash2(gx + 19, gy + 3) * 3);
                for (k = 0; k < cnt; k += 1) {
                    var wx = px2 + (0.16 + hash2(gx + k * 11, gy + 5) * 0.68) * cell;
                    var wy = py2 + (0.16 + hash2(gx + k * 23, gy + 9) * 0.68) * cell;
                    drawPumpkinBody(wx, wy, 8 + hash2(gx + k, gy + 7) * 5);
                }
            }
        }
    }
}

function drawPumpkinBody(x, y, r) {
    ctx.fillStyle = 'rgba(60,44,20,0.18)';
    ctx.beginPath();
    ctx.ellipse(x, y + r * 0.5, r * 1.1, r * 0.42, 0, 0, TAU);
    ctx.fill();
    ctx.fillStyle = '#E07C22';
    ctx.beginPath();
    ctx.ellipse(x, y, r, r * 0.8, 0, 0, TAU);
    ctx.fill();
    ctx.strokeStyle = 'rgba(150,72,16,0.5)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(x - r * 0.34, y - r * 0.62);
    ctx.lineTo(x - r * 0.34, y + r * 0.62);
    ctx.moveTo(x + r * 0.34, y - r * 0.62);
    ctx.lineTo(x + r * 0.34, y + r * 0.62);
    ctx.stroke();
    ctx.fillStyle = '#5E8E32';
    ctx.fillRect(x - 1.6, y - r * 0.95, 3.2, r * 0.4);
}

/* --------------------------------------------------- 8. 月见草坡：花海与月光
   低频分区铺出成片的花田，花色按区变化，再叠几道斜月光柱 */
function drawReliefBloom(camX, camY, th, R) {
    var zone = 620;
    var zx0 = Math.floor(camX / zone) - 1;
    var zx1 = Math.floor((camX + W) / zone) + 1;
    var zy0 = Math.floor(camY / zone) - 1;
    var zy1 = Math.floor((camY + H) / zone) + 1;
    var gx, gy, zh, x0w, y0w, n, i, fx, fy;

    for (gy = zy0; gy <= zy1; gy += 1) {
        for (gx = zx0; gx <= zx1; gx += 1) {
            zh = hash2(gx + 83, gy + 29);
            if (zh > 0.62) { continue; }          // 其余是普通草坡
            x0w = gx * zone - camX;
            y0w = gy * zone - camY;

            // 花田底色
            var cols = ['#EFD8F4', '#F2DCE8', '#E4DCF8'];
            var col = cols[Math.floor(hash2(gx + 5, gy + 9) * cols.length) % cols.length];
            var gg = ctx.createRadialGradient(x0w + zone / 2, y0w + zone / 2, zone * 0.08,
                x0w + zone / 2, y0w + zone / 2, zone * 0.62);
            gg.addColorStop(0, withA(col, 0.42));
            gg.addColorStop(1, withA(col, 0));
            ctx.fillStyle = gg;
            ctx.fillRect(x0w, y0w, zone, zone);

            // 一朵朵小花
            n = 34;
            for (i = 0; i < n; i += 1) {
                fx = x0w + hash2(gx * 31 + i, gy + 3) * zone;
                fy = y0w + hash2(gx + i * 7, gy * 17 + 5) * zone;
                if (fx < -6 || fx > W + 6 || fy < -6 || fy > H + 6) { continue; }
                ctx.fillStyle = withA(th.flower || '#F0C8F0', 0.8);
                ctx.beginPath();
                ctx.ellipse(fx, fy, 2.6, 2.2, i, 0, TAU);
                ctx.fill();
                ctx.fillStyle = 'rgba(255,246,200,0.7)';
                ctx.beginPath();
                ctx.arc(fx, fy, 0.9, 0, TAU);
                ctx.fill();
            }
        }
    }

    // 月光：几道斜着落下来的淡白光柱
    for (i = 0; i < 3; i += 1) {
        var bx = wrapMod(-camX * 0.34 + i * 420, W + 520) - 140;
        var lg = ctx.createLinearGradient(bx, 0, bx + 120, H);
        lg.addColorStop(0, 'rgba(255,255,255,0)');
        lg.addColorStop(0.42, 'rgba(255,255,255,0.10)');
        lg.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = lg;
        ctx.beginPath();
        ctx.moveTo(bx, 0);
        ctx.lineTo(bx + 74, 0);
        ctx.lineTo(bx + 74 + 120, H);
        ctx.lineTo(bx + 120, H);
        ctx.closePath();
        ctx.fill();
    }
}

/* --------------------------------------------------- 9. 古树之心：同心环脉动
   以世界原点为心的年轮状环纹，随 tick 一圈圈亮起来 */
function drawReliefRings(camX, camY, th, R) {
    var cx = -camX, cy = -camY;                 // 世界原点在屏幕上的位置
    var t = world.tick;
    var step = 320;
    var diag = Math.sqrt(W * W + H * H);
    var dcx = W / 2 - cx, dcy = H / 2 - cy;
    var dc = Math.sqrt(dcx * dcx + dcy * dcy);
    var k0 = Math.max(0, Math.floor((dc - diag * 0.5) / step));
    var k1 = Math.floor((dc + diag * 0.5) / step);
    var k, r;

    for (k = k0; k <= k1; k += 1) {
        r = k * step;
        if (r < 1) { continue; }
        var pulse = 0.10 + 0.09 * Math.sin(t * 1.1 - k * 0.5);
        ctx.strokeStyle = withA(th.accent, pulse);
        ctx.lineWidth = 3.4;
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, TAU);
        ctx.stroke();
        ctx.strokeStyle = withA('#FFFFFF', pulse * 0.4);
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.arc(cx, cy, r - 6, 0, TAU);
        ctx.stroke();
    }

    // 放射根：从树心往外的粗根，只在屏内那一截上图
    var rays = 12;
    for (k = 0; k < rays; k += 1) {
        var ang = k / rays * TAU + hash2(k + 3, 7) * 0.2;
        var dxr = Math.cos(ang), dyr = Math.sin(ang);
        // 沿射线找到进入/离开屏幕的半径区间
        var rr2 = Math.max(0, Math.floor((dc - diag * 0.55) / step)) * step;
        var rrEnd = rr2 + step * Math.ceil((diag * 1.1) / step) + step;
        ctx.strokeStyle = withA(deepen(th.accent, 0.66), 0.16);
        ctx.lineWidth = 8 + hash2(k + 11, 5) * 5;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(cx + dxr * rr2, cy + dyr * rr2);
        ctx.lineTo(cx + dxr * rrEnd, cy + dyr * rrEnd);
        ctx.stroke();
        ctx.strokeStyle = withA('#C7A472', 0.12);
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(cx + dxr * rr2, cy + dyr * rr2);
        ctx.lineTo(cx + dxr * rrEnd, cy + dyr * rrEnd);
        ctx.stroke();
    }
}

};

var world = { stars: [], decos: [], tint: null, grad: null, gradKey: '', tick: 0 };

function rr(x, y, w, h, r) {
    var rad = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + rad, y);
    ctx.lineTo(x + w - rad, y);
    ctx.arcTo(x + w, y, x + w, y + rad, rad);
    ctx.lineTo(x + w, y + h - rad);
    ctx.arcTo(x + w, y + h, x + w - rad, y + h, rad);
    ctx.lineTo(x + rad, y + h);
    ctx.arcTo(x, y + h, x, y + h - rad, rad);
    ctx.lineTo(x, y + rad);
    ctx.arcTo(x, y, x + rad, y, rad);
    ctx.closePath();
}

function fillEllipse(x, y, rx, ry) {
    ctx.beginPath();
    ctx.ellipse(x, y, Math.max(0.1, rx), Math.max(0.1, ry), 0, 0, TAU);
    ctx.fill();
}

function wrapMod(v, span) {
    return v - Math.floor(v / span) * span;
}

function glowDot(x, y, r, color, alpha) {
    ctx.globalAlpha = alpha;
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, TAU);
    ctx.fill();
    ctx.globalAlpha = 1;
}

/* ------------------------------------------------------------ 世界种子 */
/* 日间自然场景：地面用确定性 hash 铺开色斑、草纹、野花、灌木与溪流，
   不依赖任何外部图片，断网也能跑。 */
function buildWorldSeed(theme) {
    world.tint = theme;
    world.stars = [];
    world.decos = [];
    world.grad = null;
    world.gradKey = '';
    for (var i = 0; i < 22; i += 1) {
        world.decos.push({
            x: Math.random(), y: Math.random(),
            s: rand(2.2, 5.0), vy: rand(6, 16), vx: rand(-9, 9),
            rot: rand(0, TAU), spin: rand(-1.3, 1.3), ph: rand(0, TAU)
        });
    }
}

function drawBackground(camX, camY) {
    // 以当前这一局的主题为准；world.tint 可能被大厅重置过
    var th = (state && state.theme) ? state.theme : (world.tint || THEMES.meadow);
    var t = world.tick;

    // 渐变按尺寸缓存（手机上 createLinearGradient 不便宜）
    var key = W + 'x' + H + th.b + th.g2;
    if (!world.grad || world.gradKey !== key) {
        var bg = ctx.createLinearGradient(0, 0, 0, H);
        bg.addColorStop(0, th.b);
        bg.addColorStop(0.5, th.b);
        bg.addColorStop(1, th.g2);

        var sky = ctx.createLinearGradient(0, 0, 0, H * 0.62);
        sky.addColorStop(0, th.a);
        sky.addColorStop(1, th.b);

        var sun = ctx.createRadialGradient(W * 0.16, -H * 0.1, 0,
            W * 0.16, -H * 0.1, Math.max(W, H) * 1.1);
        sun.addColorStop(0, 'rgba(255,255,240,0.6)');
        sun.addColorStop(0.4, 'rgba(255,255,225,0.18)');
        sun.addColorStop(1, 'rgba(255,255,225,0)');

        var vig = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.36,
            W / 2, H / 2, Math.max(W, H) * 0.78);
        vig.addColorStop(0, 'rgba(26,52,20,0)');
        vig.addColorStop(0.62, 'rgba(24,48,18,0.05)');
        vig.addColorStop(1, 'rgba(18,40,14,0.22)');

        world.grad = { bg: bg, sky: sky, sun: sun, vig: vig };
        world.gradKey = key;
    }

    /* 外层已经把画布按相机平移过了。底色/晨光/阳光要铺满整个屏幕，
       所以先抵消平移回到屏幕坐标，否则只填到世界原点那一小块。 */
    ctx.save();
    ctx.translate(camX, camY);

    // 1) 草地底色
    ctx.fillStyle = world.grad.bg;
    ctx.fillRect(0, 0, W, H);

    // 2) 顶部晨光（低透明度，避免出现天空硬分割线）
    ctx.globalAlpha = 0.08;
    ctx.fillStyle = world.grad.sky;
    ctx.fillRect(0, 0, W, H * 0.62);
    ctx.globalAlpha = 1;

    // 3) 阳光斑
    ctx.globalAlpha = 0.1;
    ctx.fillStyle = world.grad.sun;
    ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 1;
    ctx.restore();

    /* 4~11 地形层：各层内部已经减掉了自己的视差偏移（px/py），
       外层世界变换是 -camX，这里再补一次 +camX，
       屏幕坐标才会等于「世界坐标 - 视差偏移」。少了这一步，
       相机一离开原点整片地形就飘出屏幕。 */
    ctx.save();
    ctx.translate(camX, camY);

    // 4) 地图专属地貌：九张图各有各的地形形态（田垄 / 丘陵 / 河网 ……）
    drawRelief(camX, camY, th);

    // 4.2) 大尺度地貌：把地图分成一片片的"地形"，而不是均匀撒满
    drawBiomes(camX, camY, th);

    // 5) 深浅草块
    drawBlotches(camX, camY, th);

    // 6) 草纹
    drawGrassTufts(camX, camY, th);

    // 7) 兽径：草被踩出来的浅土色弯道
    drawTrails(camX, camY, th);

    // 8) 溪流 / 水塘 / 大湖
    drawWater(camX, camY, th, t);
    drawLakes(camX, camY, th, t);

    // 9) 野花 / 石头 / 蘑菇等小物
    drawScatter(camX, camY, th);

    // 9.5) 长草丛：中尺度的草堆，把大片空草地填出起伏
    drawTallGrass(camX, camY, th);

    // 10) 地标：石堆 / 倒木 / 花坡 / 树桩 / 栅栏 / 蘑菇圈
    drawLandmarks(camX, camY, th);

    // 11) 灌木与树（大件，慢视差）
    drawFoliage(camX, camY, th);

    // 11.2) 专属大地标：画在灌木之后，才不会长在树后面看不见
    //      （每张图一种：稻草人 / 果树 / 木桥 / 巨蘑菇 ……）
    drawThemeLandmark(camX, camY, th);

    // 11.5) 巨树：少量但很大，给地图一个尺度参照
    drawGiants(camX, camY, th);

    ctx.restore();

    // 12) 飘落的花瓣（屏幕空间）
    ctx.save();
    ctx.translate(camX, camY);
    drawFalling(t, th);
    ctx.restore();

    // 13) 边缘压暗：视线收在中间，画面才有纵深
    ctx.save();
    ctx.translate(camX, camY);
    ctx.fillStyle = world.grad.vig;
    ctx.fillRect(0, 0, W, H);
    ctx.restore();
}

/* 大尺度地貌：每个大格一种地表，用柔和的径向渐变过渡，
   边缘透明淡出，避免出现硬边"污渍" */
function drawBiomes(camX, camY, th) {
    var cell = 1000;
    var px = camX * 0.52;
    var py = camY * 0.52;
    var x0 = Math.floor(px / cell) - 1;
    var x1 = Math.floor((px + W) / cell) + 1;
    var y0 = Math.floor(py / cell) - 1;
    var y1 = Math.floor((py + H) / cell) + 1;

    for (var gy = y0; gy <= y1; gy += 1) {
        for (var gx = x0; gx <= x1; gx += 1) {
            var h = hash2(gx + 201, gy + 307);
            var cx = gx * cell + (0.15 + hash2(gx + 17, gy + 71) * 0.7) * cell - px;
            var cy = gy * cell + (0.15 + hash2(gx + 53, gy + 29) * 0.7) * cell - py;
            var R = cell * (0.62 + hash2(gx + 9, gy + 33) * 0.4);
            if (cx + R < 0 || cx - R > W || cy + R < 0 || cy - R > H) { continue; }

            var col, a;
            if (h < 0.26) {
                // 阳面草坡：偏黄亮，像被晒透
                col = '#E8F6AC'; a = 0.46;
            } else if (h < 0.5) {
                // 背阴深草
                col = deepen(th.g2, 0.76); a = 0.38;
            } else if (h < 0.68) {
                // 干土滩
                col = '#C9B27A'; a = 0.24;
            } else if (h < 0.86) {
                // 密林地表，压深一圈
                col = th.bush; a = 0.2;
            } else {
                // 湿地/田埂：麦田主题里做成一条条青绿的田埂
                col = (th.deco === 'wheat') ? '#8AA854' : '#A6D4A2'; a = 0.34;
            }

            var g = ctx.createRadialGradient(cx, cy, R * 0.08, cx, cy, R);
            g.addColorStop(0, withA(col, a));
            g.addColorStop(0.5, withA(col, a * 0.58));
            g.addColorStop(1, withA(col, 0));
            ctx.fillStyle = g;
            ctx.fillRect(cx - R, cy - R, R * 2, R * 2);
        }
    }
}

/* 兽径：一段一段的浅土色弯道，两端淡出，像被踩秃的小路 */
function drawTrails(camX, camY, th) {
    var R = reliefCfg(th);
    var cell = 470;
    var px = camX * 0.9;
    var py = camY * 0.9;
    var x0 = Math.floor(px / cell) - 1;
    var x1 = Math.floor((px + W) / cell) + 1;
    var y0 = Math.floor(py / cell) - 1;
    var y1 = Math.floor((py + H) / cell) + 1;

    for (var gy = y0; gy <= y1; gy += 1) {
        for (var gx = x0; gx <= x1; gx += 1) {
            var h = hash2(gx + 301, gy + 97);
            if (h > R.trail) { continue; }
            var x = gx * cell + (0.2 + hash2(gx + 61, gy + 13) * 0.6) * cell - px;
            var y = gy * cell + (0.2 + hash2(gx + 7, gy + 83) * 0.6) * cell - py;
            var ang = hash2(gx + 11, gy + 43) * Math.PI;
            var len = 150 + hash2(gx + 23, gy + 5) * 130;
            var bend = (hash2(gx + 31, gy + 59) - 0.5) * 100;
            if (x + len < 0 || x - len > W || y + len < 0 || y - len > H) { continue; }

            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(ang);
            var lg = ctx.createLinearGradient(-len / 2, 0, len / 2, 0);
            var tc = '#C7B686';
            lg.addColorStop(0, withA(tc, 0));
            lg.addColorStop(0.28, withA(tc, 0.42));
            lg.addColorStop(0.72, withA(tc, 0.42));
            lg.addColorStop(1, withA(tc, 0));
            ctx.strokeStyle = lg;
            ctx.lineWidth = 16 + h * 30;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(-len / 2, 0);
            ctx.quadraticCurveTo(0, bend, len / 2, 0);
            ctx.stroke();
            ctx.restore();
        }
    }
}

/* 大湖：超大水面，给地图制造"地形尺度" */
function drawLakes(camX, camY, th, t) {
    var R = reliefCfg(th);
    if (!R.lake) { return; }                 // 山上没有水塘
    var cell = 1800;
    var x0 = Math.floor(camX / cell) - 1;
    var x1 = Math.floor((camX + W) / cell) + 1;
    var y0 = Math.floor(camY / cell) - 1;
    var y1 = Math.floor((camY + H) / cell) + 1;
    var water = th.water || '#8ED0DC';

    for (var gy = y0; gy <= y1; gy += 1) {
        for (var gx = x0; gx <= x1; gx += 1) {
            var h = hash2(gx + 401, gy + 211);
            if (h > R.lake) { continue; }
            var cx = gx * cell + (0.3 + hash2(gx + 12, gy + 91) * 0.4) * cell - camX;
            var cy = gy * cell + (0.3 + hash2(gx + 44, gy + 18) * 0.4) * cell - camY;
            var rx = 120 + hash2(gx + 5, gy + 63) * 110;
            var ry = rx * (0.46 + hash2(gx + 77, gy + 39) * 0.26);
            if (cx + rx * 1.6 < 0 || cx - rx * 1.6 > W) { continue; }
            if (cy + ry * 1.7 < 0 || cy - ry * 1.7 > H) { continue; }

            // 岸：一圈浅色湿泥 + 一圈草绿过渡
            ctx.fillStyle = withA('#8FBE7E', 0.2);
            ctx.beginPath();
            ctx.ellipse(cx, cy, rx * 1.14, ry * 1.2, 0, 0, TAU);
            ctx.fill();
            ctx.fillStyle = withA('#C6D79E', 0.22);
            ctx.beginPath();
            ctx.ellipse(cx, cy, rx * 1.06, ry * 1.1, 0, 0, TAU);
            ctx.fill();

            // 水面：中间深、边缘浅，像有深度的水
            var wg = ctx.createRadialGradient(cx - rx * 0.2, cy - ry * 0.3, 0, cx, cy, rx * 1.05);
            wg.addColorStop(0, withA(water, 1));
            wg.addColorStop(0.62, withA(water, 0.95));
            wg.addColorStop(1, withA(deepen(water.charAt(0) === '#' ? water : '#93D9E8', 0.82), 0.95));
            ctx.fillStyle = wg;
            ctx.beginPath();
            ctx.ellipse(cx, cy, rx, ry, 0, 0, TAU);
            ctx.fill();

            // 岸线
            ctx.strokeStyle = withA('#4E8E60', 0.24);
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.ellipse(cx, cy, rx, ry, 0, 0, TAU);
            ctx.stroke();

            // 波光
            ctx.strokeStyle = 'rgba(255,255,255,0.5)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            for (var k = 0; k < 5; k += 1) {
                var off = Math.sin(t * 1.1 + gx * 0.7 + k * 1.7) * rx * 0.06;
                var wy2 = cy - ry * 0.5 + k * ry * 0.24;
                var wl = rx * (0.16 + (k % 3) * 0.1);
                ctx.moveTo(cx - wl + off, wy2);
                ctx.lineTo(cx + wl * 0.6 + off, wy2);
            }
            ctx.stroke();

            // 岸边芦苇
            ctx.strokeStyle = withA(deepen(th.grid, 0.62), 0.55);
            ctx.lineWidth = 1.6;
            ctx.beginPath();
            for (var j = 0; j < 14; j += 1) {
                var aa = hash2(gx * 7 + j, gy * 3 + j * 5) * TAU;
                var ex = cx + Math.cos(aa) * rx * 0.97;
                var ey = cy + Math.sin(aa) * ry * 0.97;
                var hh2 = 7 + hash2(j, gx + gy) * 9;
                ctx.moveTo(ex, ey);
                ctx.quadraticCurveTo(ex + 2, ey - hh2 * 0.6, ex + 3.5, ey - hh2);
            }
            ctx.stroke();
        }
    }
}

/* 地标：中件装饰，比小物件大、比树小，随机散但也稳定 */
/* 小地标：种类由主题的 lmk 配比决定，九张图各有各的「地上长什么」 */
function drawLandmarks(camX, camY, th) {
    var cell = 214;
    var px = camX * 0.92;
    var py = camY * 0.92;
    var x0 = Math.floor(px / cell) - 1;
    var x1 = Math.floor((px + W) / cell) + 1;
    var y0 = Math.floor(py / cell) - 1;
    var y1 = Math.floor((py + H) / cell) + 1;
    var mix = th.lmk || ['boulder', 'rocks', 'log', 'flower', 'stump', 'fence', 'mush'];

    for (var gy = y0; gy <= y1; gy += 1) {
        for (var gx = x0; gx <= x1; gx += 1) {
            var h = hash2(gx + 41, gy + 67);
            if (h > 0.82) { continue; }
            var x = gx * cell + (0.18 + hash2(gx + 6, gy + 92) * 0.64) * cell - px;
            var y = gy * cell + (0.18 + hash2(gx + 74, gy + 13) * 0.64) * cell - py;
            var kind = mix[Math.floor(hash2(gx + 83, gy + 11) * mix.length * 0.999)];
            var sc = 0.78 + hash2(gx + 5, gy + 91) * 0.55;
            if (kind === 'hay') { drawHaystack(x, y, th, sc); }
            else if (kind === 'boulder') { drawBoulder(x, y, th, sc, h); }
            else if (kind === 'rocks') { drawRocks(x, y, th, sc, h); }
            else if (kind === 'log') { drawLog(x, y, th, sc); }
            else if (kind === 'flower') { drawFlowerBed(x, y, th, sc, h); }
            else if (kind === 'stump') { drawStump(x, y, th, sc); }
            else if (kind === 'fence') { drawFence(x, y, th, sc, sc > 1 ? 1 : 0); }
            else { drawMushRing(x, y, th, sc, h); }
        }
    }
}

/* 大地标：每张地图一种专属大件（稻草人 / 果树 / 木桥 / 巨蘑菇 ……），
   间距由主题 bigGap 决定，视差 1.0 贴着地面站，不会从地貌上滑走 */
function drawThemeLandmark(camX, camY, th) {
    var kind = th.landmark;
    if (!kind) { return; }
    var gap = th.bigGap || 1900;
    var t = world.tick;
    var x0 = Math.floor(camX / gap) - 1;
    var x1 = Math.floor((camX + W) / gap) + 1;
    var y0 = Math.floor(camY / gap) - 1;
    var y1 = Math.floor((camY + H) / gap) + 1;

    for (var gy = y0; gy <= y1; gy += 1) {
        for (var gx = x0; gx <= x1; gx += 1) {
            var h = hash2(gx + 131, gy + 197);
            if (h > 0.82) { continue; }            // 八成格子有地标，跑图时两三屏能遇到一个
            var x = gx * gap + (0.16 + hash2(gx + 27, gy + 61) * 0.68) * gap - camX;
            var y = gy * gap + (0.16 + hash2(gx + 73, gy + 17) * 0.68) * gap - camY;
            if (x < -260 || x > W + 260 || y < -320 || y > H + 160) { continue; }
            var sc = 0.82 + hash2(gx + 11, gy + 43) * 0.36;

            if (kind === 'scarecrow') { drawLmScarecrow(x, y, sc, t, h); }
            else if (kind === 'tree') { drawLmTree(x, y, sc, th, h); }
            else if (kind === 'bridge') { drawLmBridge(x, y, sc, th, t); }
            else if (kind === 'giantshroom') { drawLmGiantShroom(x, y, sc, th, t, h); }
            else if (kind === 'windmill') { drawLmWindmill(x, y, sc, t); }
            else if (kind === 'lantern') { drawLmLantern(x, y, sc, t, h); }
            else if (kind === 'barn') { drawLmBarn(x, y, sc, th, h); }
            else if (kind === 'arch') { drawLmArch(x, y, sc, th, t); }
            else if (kind === 'totem') { drawLmTotem(x, y, sc, th, h); }
        }
    }
}

/* 萝卜田 · 稻草人：十字木架 + 草帽 + 迎风摆的破布袖子 */
function drawLmScarecrow(x, y, sc, t, h) {
    var pole = 118 * sc;
    ctx.fillStyle = 'rgba(52,82,42,0.16)';
    ctx.beginPath();
    ctx.ellipse(x, y + 4 * sc, 34 * sc, 9 * sc, 0, 0, TAU);
    ctx.fill();

    // 立柱与横臂
    ctx.strokeStyle = '#9A7648';
    ctx.lineWidth = 5.4 * sc;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x, y - pole);
    ctx.moveTo(x - 34 * sc, y - pole * 0.72);
    ctx.lineTo(x + 34 * sc, y - pole * 0.72);
    ctx.stroke();

    // 破布袖子：挂在横臂两头，随时间轻轻摆
    var sway = Math.sin(t * 1.4 + h * 6) * 0.16;
    ctx.fillStyle = '#C89A5E';
    for (var s = -1; s <= 1; s += 2) {
        ctx.save();
        ctx.translate(x + s * 30 * sc, y - pole * 0.72 + 4 * sc);
        ctx.rotate(s * sway);
        ctx.beginPath();
        ctx.moveTo(-7 * sc, 0);
        ctx.lineTo(7 * sc, 0);
        ctx.lineTo(4 * sc, 34 * sc);
        ctx.lineTo(-4 * sc, 32 * sc);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
    }

    // 身上的麻布衣
    ctx.fillStyle = '#B08A54';
    ctx.beginPath();
    ctx.moveTo(x - 15 * sc, y - pole * 0.8);
    ctx.lineTo(x + 15 * sc, y - pole * 0.8);
    ctx.lineTo(x + 19 * sc, y - pole * 0.3);
    ctx.lineTo(x - 19 * sc, y - pole * 0.3);
    ctx.closePath();
    ctx.fill();

    // 头（麻袋）+ 五官
    ctx.fillStyle = '#E4CB94';
    ctx.beginPath();
    ctx.arc(x, y - pole * 0.88, 12.5 * sc, 0, TAU);
    ctx.fill();
    ctx.strokeStyle = 'rgba(60,44,24,0.85)';
    ctx.lineWidth = 2 * sc;
    ctx.beginPath();
    ctx.moveTo(x - 7 * sc, y - pole * 0.91); ctx.lineTo(x - 2.6 * sc, y - pole * 0.87);
    ctx.moveTo(x - 2.6 * sc, y - pole * 0.91); ctx.lineTo(x - 7 * sc, y - pole * 0.87);
    ctx.moveTo(x + 2.6 * sc, y - pole * 0.91); ctx.lineTo(x + 7 * sc, y - pole * 0.87);
    ctx.moveTo(x + 7 * sc, y - pole * 0.91); ctx.lineTo(x + 2.6 * sc, y - pole * 0.87);
    ctx.stroke();
    ctx.strokeStyle = 'rgba(60,44,24,0.6)';
    ctx.lineWidth = 1.6 * sc;
    ctx.beginPath();
    ctx.arc(x, y - pole * 0.845, 4 * sc, 0.3, Math.PI - 0.3);
    ctx.stroke();

    // 草帽：宽檐 + 帽冠 + 红帽带
    ctx.fillStyle = '#E8C878';
    ctx.beginPath();
    ctx.ellipse(x, y - pole * 0.945, 21 * sc, 5 * sc, 0, 0, TAU);
    ctx.fill();
    ctx.strokeStyle = 'rgba(150,110,50,0.55)';
    ctx.lineWidth = 1.2 * sc;
    ctx.stroke();
    ctx.fillStyle = '#F0D488';
    ctx.beginPath();
    ctx.ellipse(x, y - pole * 0.985, 10.5 * sc, 7 * sc, 0, 0, TAU);
    ctx.fill();
    ctx.fillStyle = '#B8452E';
    ctx.beginPath();
    ctx.ellipse(x, y - pole * 0.962, 10.6 * sc, 3.2 * sc, 0, 0, TAU);
    ctx.fill();
}

/* 蒲公英坡 · 大果树：粗干 + 团状树冠 + 满树果子 */
function drawLmTree(x, y, sc, th, h) {
    var trH = 96 * sc;
    ctx.fillStyle = 'rgba(52,82,42,0.18)';
    ctx.beginPath();
    ctx.ellipse(x, y + 4 * sc, 66 * sc, 14 * sc, 0, 0, TAU);
    ctx.fill();

    // 树干：下粗上细两段，分叉
    ctx.strokeStyle = '#8A6A44';
    ctx.lineWidth = 15 * sc;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x - 2 * sc, y - trH * 0.6);
    ctx.stroke();
    ctx.lineWidth = 9 * sc;
    ctx.beginPath();
    ctx.moveTo(x - 2 * sc, y - trH * 0.55);
    ctx.lineTo(x - 26 * sc, y - trH * 0.86);
    ctx.moveTo(x - 2 * sc, y - trH * 0.55);
    ctx.lineTo(x + 24 * sc, y - trH * 0.9);
    ctx.stroke();

    // 树冠：三团圆球叠出体积
    var cy0 = y - trH * 1.06;
    var blobs = [[-40, 8, 40], [38, 4, 37], [0, -18, 46]];
    for (var i = 0; i < 3; i += 1) {
        var b = blobs[i];
        ctx.fillStyle = ['#6FA83E', '#7EB84A', '#8CC658'][i];
        ctx.beginPath();
        ctx.arc(x + b[0] * sc, cy0 + b[1] * sc, b[2] * sc, 0, TAU);
        ctx.fill();
    }
    // 受光的亮面
    ctx.fillStyle = 'rgba(240,255,190,0.24)';
    ctx.beginPath();
    ctx.arc(x - 14 * sc, cy0 - 26 * sc, 30 * sc, 0, TAU);
    ctx.fill();

    // 果子：点缀在冠上
    ctx.fillStyle = th.flower || '#FFD84D';
    for (var k = 0; k < 9; k += 1) {
        var fx = x + (hash2(k + 5, 13) - 0.5) * 86 * sc;
        var fy = cy0 + (hash2(k + 9, 21) - 0.5) * 56 * sc - 6 * sc;
        ctx.beginPath();
        ctx.arc(fx, fy, 3.4 * sc, 0, TAU);
        ctx.fill();
    }
}

/* 清溪浅滩 · 木拱桥：一条真拱 + 栏杆桩 + 桥下水纹 */
function drawLmBridge(x, y, sc, th, t) {
    var R0 = 92 * sc;                 // 拱半径
    var cy = y + 46 * sc;             // 圆心在地面以下，拱顶正好抬起
    var a0 = Math.PI * 1.12, a1 = Math.PI * 1.88;

    // 桥影
    ctx.fillStyle = 'rgba(20,60,70,0.16)';
    ctx.beginPath();
    ctx.ellipse(x, y + 8 * sc, 96 * sc, 15 * sc, 0, 0, TAU);
    ctx.fill();

    // 桥下水
    ctx.fillStyle = withA(th.water || '#8FDCF0', 0.55);
    ctx.beginPath();
    ctx.ellipse(x, y + 5 * sc, 86 * sc, 12 * sc, 0, 0, TAU);
    ctx.fill();

    // 桥面：厚木拱
    ctx.strokeStyle = '#A87C4C';
    ctx.lineWidth = 11 * sc;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.arc(x, cy, R0, a0, a1);
    ctx.stroke();
    // 受光的上缘
    ctx.strokeStyle = '#CFA26A';
    ctx.lineWidth = 3.4 * sc;
    ctx.beginPath();
    ctx.arc(x, cy, R0 + 4 * sc, a0, a1);
    ctx.stroke();

    // 桥板：沿拱短径向刻线
    ctx.strokeStyle = 'rgba(120,84,44,0.5)';
    ctx.lineWidth = 1.4 * sc;
    ctx.beginPath();
    for (var i = 1; i < 9; i += 1) {
        var a = a0 + (a1 - a0) * (i / 9);
        ctx.moveTo(x + Math.cos(a) * (R0 - 5.5 * sc), cy + Math.sin(a) * (R0 - 5.5 * sc));
        ctx.lineTo(x + Math.cos(a) * (R0 + 5.5 * sc), cy + Math.sin(a) * (R0 + 5.5 * sc));
    }
    ctx.stroke();

    // 栏杆：立柱 + 顺着拱走的扶手
    ctx.strokeStyle = '#8A6438';
    ctx.lineWidth = 3.2 * sc;
    ctx.beginPath();
    for (var k = 0; k < 5; k += 1) {
        var ak = a0 + (a1 - a0) * (0.06 + k * 0.22);
        ctx.moveTo(x + Math.cos(ak) * R0, cy + Math.sin(ak) * R0);
        ctx.lineTo(x + Math.cos(ak) * (R0 + 19 * sc), cy + Math.sin(ak) * (R0 + 19 * sc));
    }
    ctx.stroke();
    ctx.lineWidth = 2.6 * sc;
    ctx.beginPath();
    ctx.arc(x, cy, R0 + 19 * sc, a0 + 0.09, a1 - 0.09);
    ctx.stroke();

    // 水面反光
    ctx.strokeStyle = 'rgba(255,255,255,0.55)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    for (var m = 0; m < 4; m += 1) {
        var wx = x - 58 * sc + m * 34 * sc + Math.sin(t * 1.8 + m) * 5;
        ctx.moveTo(wx - 10 * sc, y + 6 * sc + Math.sin(t * 2 + m) * 1.6);
        ctx.lineTo(wx + 10 * sc, y + 6 * sc - Math.sin(t * 2 + m) * 1.6);
    }
    ctx.stroke();
}

/* 蘑菇古林 · 巨型发光蘑菇：粗柄 + 大菌盖 + 呼吸的冷光 */
function drawLmGiantShroom(x, y, sc, th, t, h) {
    var capR = 52 * sc;
    var stH = 74 * sc;
    var glow = 0.5 + 0.5 * Math.sin(t * 1.1 + h * 9);
    var col = th.decoA || '#D06AAE';

    // 地上的光晕
    var lg = ctx.createRadialGradient(x, y - stH * 0.4, 6, x, y - stH * 0.4, capR * 2.4);
    lg.addColorStop(0, withA(col, 0.13 + glow * 0.09));
    lg.addColorStop(1, withA(col, 0));
    ctx.fillStyle = lg;
    ctx.fillRect(x - capR * 2.4, y - stH * 2.4, capR * 4.8, capR * 4.8);

    // 柄：下宽上窄的圆柱
    ctx.fillStyle = '#E4D2BC';
    ctx.beginPath();
    ctx.moveTo(x - 13 * sc, y);
    ctx.quadraticCurveTo(x - 10 * sc, y - stH * 0.6, x - 9 * sc, y - stH);
    ctx.lineTo(x + 9 * sc, y - stH);
    ctx.quadraticCurveTo(x + 10 * sc, y - stH * 0.6, x + 13 * sc, y);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = 'rgba(150,110,90,0.4)';
    ctx.lineWidth = 1.6;
    ctx.stroke();

    // 菌盖：半个扁球，边缘微翘
    var cg = ctx.createLinearGradient(x, y - stH - capR * 0.6, x, y - stH + capR * 0.3);
    cg.addColorStop(0, '#C46AA0');
    cg.addColorStop(1, '#8E4470');
    ctx.fillStyle = cg;
    ctx.beginPath();
    ctx.ellipse(x, y - stH, capR, capR * 0.56, 0, Math.PI, 0);
    ctx.quadraticCurveTo(x, y - stH + capR * 0.62, x - capR, y - stH);
    ctx.fill();
    // 盖沿亮边
    ctx.strokeStyle = withA('#FFD8F0', 0.5 + glow * 0.3);
    ctx.lineWidth = 2.4;
    ctx.beginPath();
    ctx.ellipse(x, y - stH, capR * 0.97, capR * 0.5, 0, Math.PI * 0.06, Math.PI * 0.94, true);
    ctx.stroke();

    // 盖上的发光斑点
    ctx.fillStyle = withA('#FFE8F8', 0.5 + glow * 0.4);
    for (var i = 0; i < 7; i += 1) {
        var sx = x + (hash2(i + 3, h * 31 | 0) - 0.5) * capR * 1.5;
        var sy = y - stH - hash2(i + 7, 11) * capR * 0.4;
        ctx.beginPath();
        ctx.ellipse(sx, sy, 3.6 * sc, 2.6 * sc, 0, 0, TAU);
        ctx.fill();
    }
}

/* 落霞山脊 · 风车磨坊：石塔 + 锥顶 + 四叶迎风转 */
function drawLmWindmill(x, y, sc, t) {
    var th2 = 104 * sc;
    ctx.fillStyle = 'rgba(70,50,30,0.2)';
    ctx.beginPath();
    ctx.ellipse(x, y + 3 * sc, 52 * sc, 11 * sc, 0, 0, TAU);
    ctx.fill();

    // 塔身：下宽上窄
    var wg = ctx.createLinearGradient(x - 30 * sc, 0, x + 30 * sc, 0);
    wg.addColorStop(0, '#B08A5E');
    wg.addColorStop(0.5, '#D8B888');
    wg.addColorStop(1, '#A0784C');
    ctx.fillStyle = wg;
    ctx.beginPath();
    ctx.moveTo(x - 30 * sc, y);
    ctx.lineTo(x - 19 * sc, y - th2);
    ctx.lineTo(x + 19 * sc, y - th2);
    ctx.lineTo(x + 30 * sc, y);
    ctx.closePath();
    ctx.fill();

    // 石缝
    ctx.strokeStyle = 'rgba(120,90,58,0.4)';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    for (var i = 1; i < 5; i += 1) {
        var yy = y - i * th2 / 5;
        ctx.moveTo(x - 28 * sc + i * 1.6 * sc, yy);
        ctx.lineTo(x + 28 * sc - i * 1.6 * sc, yy);
    }
    ctx.stroke();

    // 小窗与门
    ctx.fillStyle = '#5A4028';
    rr(x - 5 * sc, y - th2 * 0.82, 10 * sc, 14 * sc, 4 * sc); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(x - 10 * sc, y);
    ctx.lineTo(x - 10 * sc, y - 22 * sc);
    ctx.arc(x, y - 22 * sc, 10 * sc, Math.PI, 0);
    ctx.lineTo(x + 10 * sc, y);
    ctx.closePath();
    ctx.fill();

    // 锥顶
    ctx.fillStyle = '#8E5A32';
    ctx.beginPath();
    ctx.moveTo(x - 24 * sc, y - th2);
    ctx.lineTo(x, y - th2 - 26 * sc);
    ctx.lineTo(x + 24 * sc, y - th2);
    ctx.closePath();
    ctx.fill();

    // 风叶：四片绕轴转
    var cx = x, cy = y - th2 - 6 * sc;
    var ang = t * 0.5;
    ctx.save();
    ctx.translate(cx, cy);
    for (var k = 0; k < 4; k += 1) {
        ctx.save();
        ctx.rotate(ang + k * Math.PI / 2);
        ctx.fillStyle = '#F2E4C8';
        ctx.beginPath();
        ctx.moveTo(0, -3 * sc);
        ctx.lineTo(52 * sc, -9 * sc);
        ctx.lineTo(52 * sc, 9 * sc);
        ctx.lineTo(0, 3 * sc);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = 'rgba(140,100,60,0.55)';
        ctx.lineWidth = 1.4;
        ctx.stroke();
        ctx.restore();
    }
    ctx.fillStyle = '#6A4826';
    ctx.beginPath();
    ctx.arc(0, 0, 5 * sc, 0, TAU);
    ctx.fill();
    ctx.restore();
}

/* 竹影幽径 · 石灯笼：柱座 + 灯窗 + 暖光闪烁 */
function drawLmLantern(x, y, sc, t, h) {
    var H2 = 112 * sc;
    var flick = 0.84 + 0.16 * Math.sin(t * 5.2 + h * 8) * Math.sin(t * 2.1 + h);
    var boxY = y - H2 * 0.74;          // 火袋中心

    // 暖光晕：两层，内亮外散，白天也能看出它在发光
    var lg = ctx.createRadialGradient(x, boxY, 3, x, boxY, 70 * sc);
    lg.addColorStop(0, 'rgba(255,226,150,' + (0.52 * flick).toFixed(3) + ')');
    lg.addColorStop(0.4, 'rgba(255,206,110,' + (0.24 * flick).toFixed(3) + ')');
    lg.addColorStop(1, 'rgba(255,206,110,0)');
    ctx.fillStyle = lg;
    ctx.fillRect(x - 70 * sc, boxY - 70 * sc, 140 * sc, 140 * sc);
    // 地上的一摊暖光
    var pool = ctx.createRadialGradient(x, y - 2 * sc, 2, x, y - 2 * sc, 46 * sc);
    pool.addColorStop(0, 'rgba(255,214,130,' + (0.22 * flick).toFixed(3) + ')');
    pool.addColorStop(1, 'rgba(255,214,130,0)');
    ctx.fillStyle = pool;
    ctx.beginPath();
    ctx.ellipse(x, y - 2 * sc, 46 * sc, 14 * sc, 0, 0, TAU);
    ctx.fill();

    // 投影
    ctx.fillStyle = 'rgba(40,70,36,0.2)';
    ctx.beginPath();
    ctx.ellipse(x, y + 2 * sc, 27 * sc, 7 * sc, 0, 0, TAU);
    ctx.fill();

    var S1 = '#96A18C', S2 = '#B4BFA8', S3 = '#7C8874', DARK = '#69745F';

    // 基座：两级石台，下宽上窄
    ctx.fillStyle = S3;
    rr(x - 19 * sc, y - 8 * sc, 38 * sc, 8 * sc, 1.5 * sc); ctx.fill();
    ctx.fillStyle = S2;
    rr(x - 16 * sc, y - 12 * sc, 32 * sc, 5 * sc, 1.2 * sc); ctx.fill();

    // 灯柱：下粗上细的梯形，中段一道束腰
    var shaftBot = y - 12 * sc, shaftTop = y - H2 * 0.50;
    ctx.fillStyle = S1;
    ctx.beginPath();
    ctx.moveTo(x - 7.5 * sc, shaftBot);
    ctx.lineTo(x - 5 * sc, shaftTop);
    ctx.lineTo(x + 5 * sc, shaftTop);
    ctx.lineTo(x + 7.5 * sc, shaftBot);
    ctx.closePath();
    ctx.fill();
    // 柱身右侧一层暗面，柱子才有体积
    ctx.fillStyle = 'rgba(70,84,62,0.22)';
    ctx.beginPath();
    ctx.moveTo(x + 1.5 * sc, shaftBot);
    ctx.lineTo(x + 1.5 * sc, shaftTop);
    ctx.lineTo(x + 5 * sc, shaftTop);
    ctx.lineTo(x + 7.5 * sc, shaftBot);
    ctx.closePath();
    ctx.fill();
    // 束腰
    ctx.fillStyle = S2;
    rr(x - 7 * sc, shaftBot - H2 * 0.28, 14 * sc, 4 * sc, 1 * sc); ctx.fill();

    // 中台：六角石盘，比灯柱宽一截
    ctx.fillStyle = S2;
    rr(x - 13 * sc, shaftTop - 5 * sc, 26 * sc, 5 * sc, 1.5 * sc); ctx.fill();
    ctx.fillStyle = S3;
    rr(x - 11 * sc, shaftTop - 1.5 * sc, 22 * sc, 2.5 * sc, 1 * sc); ctx.fill();

    // 火袋：四角立柱 + 中间透光的窗
    var bw2 = 26 * sc, bh2 = 26 * sc;
    var bx2 = x - bw2 / 2, by2 = shaftTop - 5 * sc - bh2;
    ctx.fillStyle = S1;
    rr(bx2, by2, bw2, bh2, 2 * sc); ctx.fill();
    // 窗洞（上圆下方，像石灯笼的火口）
    ctx.fillStyle = 'rgba(255,214,126,' + (0.92 * flick).toFixed(3) + ')';
    ctx.beginPath();
    ctx.moveTo(x - 8 * sc, by2 + bh2 - 5 * sc);
    ctx.lineTo(x - 8 * sc, by2 + 8 * sc);
    ctx.quadraticCurveTo(x, by2 + 3 * sc, x + 8 * sc, by2 + 8 * sc);
    ctx.lineTo(x + 8 * sc, by2 + bh2 - 5 * sc);
    ctx.closePath();
    ctx.fill();
    // 灯心
    ctx.fillStyle = 'rgba(255,252,232,' + (0.86 * flick).toFixed(3) + ')';
    ctx.beginPath();
    ctx.ellipse(x, by2 + bh2 * 0.55, 3.4 * sc, 4.6 * sc, 0, 0, TAU);
    ctx.fill();
    // 四角柱
    ctx.fillStyle = S3;
    ctx.fillRect(bx2 + 0.5 * sc, by2 + 2 * sc, 2.6 * sc, bh2 - 4 * sc);
    ctx.fillRect(bx2 + bw2 - 3.1 * sc, by2 + 2 * sc, 2.6 * sc, bh2 - 4 * sc);
    ctx.fillStyle = 'rgba(255,255,255,0.16)';
    ctx.fillRect(bx2 + 1 * sc, by2 + 2 * sc, 1 * sc, bh2 - 4 * sc);

    // 顶盖：中间起脊，两端翘角的石檐
    ctx.fillStyle = S2;
    ctx.beginPath();
    ctx.moveTo(x - 21 * sc, by2 - 1 * sc);
    ctx.quadraticCurveTo(x - 15 * sc, by2 - 6 * sc, x - 8 * sc, by2 - 9 * sc);
    ctx.lineTo(x, by2 - 12 * sc);
    ctx.lineTo(x + 8 * sc, by2 - 9 * sc);
    ctx.quadraticCurveTo(x + 15 * sc, by2 - 6 * sc, x + 21 * sc, by2 - 1 * sc);
    ctx.quadraticCurveTo(x + 12 * sc, by2 + 1.5 * sc, x, by2 + 1.5 * sc);
    ctx.quadraticCurveTo(x - 12 * sc, by2 + 1.5 * sc, x - 21 * sc, by2 - 1 * sc);
    ctx.closePath();
    ctx.fill();
    // 檐口压一道深边，别跟灰底糊在一起
    ctx.strokeStyle = 'rgba(96,108,86,0.5)';
    ctx.lineWidth = 1 * sc;
    ctx.stroke();

    // 宝珠
    ctx.fillStyle = S2;
    ctx.beginPath();
    ctx.arc(x, by2 - 15 * sc, 3.6 * sc, 0, TAU);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    ctx.beginPath();
    ctx.arc(x - 1.2 * sc, by2 - 16.2 * sc, 1.1 * sc, 0, TAU);
    ctx.fill();

    // 石面上的一点青苔，跟竹林配
    ctx.fillStyle = 'rgba(86,132,74,0.4)';
    ctx.beginPath();
    ctx.ellipse(x - 12 * sc, y - 3 * sc, 5 * sc, 2 * sc, 0.2, 0, TAU);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(x + 11 * sc, y - 10 * sc, 3 * sc, 1.6 * sc, -0.2, 0, TAU);
    ctx.fill();
}

/* 南瓜灯谷 · 小谷仓：红墙 + 深顶 + 门口一堆南瓜 */
function drawLmBarn(x, y, sc, th, h) {
    var wB = 108 * sc, hB = 62 * sc;
    ctx.fillStyle = 'rgba(70,50,30,0.2)';
    ctx.beginPath();
    ctx.ellipse(x, y + 3 * sc, wB * 0.62, 12 * sc, 0, 0, TAU);
    ctx.fill();

    // 墙体
    ctx.fillStyle = '#C25E4A';
    ctx.fillRect(x - wB / 2, y - hB, wB, hB);
    // 墙板横线
    ctx.strokeStyle = 'rgba(140,60,44,0.5)';
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    for (var i = 1; i < 4; i += 1) {
        ctx.moveTo(x - wB / 2, y - hB + i * hB / 4);
        ctx.lineTo(x + wB / 2, y - hB + i * hB / 4);
    }
    ctx.stroke();

    // 大屋顶
    ctx.fillStyle = '#7A4A2E';
    ctx.beginPath();
    ctx.moveTo(x - wB * 0.58, y - hB);
    ctx.lineTo(x, y - hB - 40 * sc);
    ctx.lineTo(x + wB * 0.58, y - hB);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = 'rgba(255,240,200,0.18)';
    ctx.beginPath();
    ctx.moveTo(x - wB * 0.2, y - hB - 27 * sc);
    ctx.lineTo(x, y - hB - 40 * sc);
    ctx.lineTo(x + wB * 0.2, y - hB - 27 * sc);
    ctx.closePath();
    ctx.fill();

    // 门 + 干草窗
    ctx.fillStyle = '#5A3A22';
    ctx.beginPath();
    ctx.moveTo(x - 14 * sc, y);
    ctx.lineTo(x - 14 * sc, y - 30 * sc);
    ctx.arc(x, y - 30 * sc, 14 * sc, Math.PI, 0);
    ctx.lineTo(x + 14 * sc, y);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#3E2818';
    rr(x - 7 * sc, y - hB * 0.86, 14 * sc, 12 * sc, 2 * sc); ctx.fill();

    // 门口的南瓜堆
    for (var k = 0; k < 3; k += 1) {
        drawPumpkinBody(x - wB * 0.44 + k * 15 * sc, y - 4 * sc - (k === 1 ? 9 * sc : 0), 9 * sc);
    }
}

/* 月见草坡 · 月亮石拱门：双柱石梁 + 刻纹发微光 */
function drawLmArch(x, y, sc, th, t) {
    var hA = 92 * sc, wA = 74 * sc;
    var col = th.decoA || '#B98AC8';
    var glow = 0.6 + 0.4 * Math.sin(t * 0.9);

    ctx.fillStyle = 'rgba(60,70,90,0.16)';
    ctx.beginPath();
    ctx.ellipse(x, y + 3 * sc, wA * 0.8, 12 * sc, 0, 0, TAU);
    ctx.fill();

    // 左右柱
    ctx.fillStyle = '#A9A2BE';
    ctx.fillRect(x - wA / 2 - 9 * sc, y - hA, 18 * sc, hA);
    ctx.fillRect(x + wA / 2 - 9 * sc, y - hA, 18 * sc, hA);
    ctx.fillStyle = 'rgba(120,116,150,0.35)';
    ctx.fillRect(x - wA / 2 - 9 * sc, y - hA, 5 * sc, hA);
    ctx.fillRect(x + wA / 2 - 9 * sc, y - hA, 5 * sc, hA);

    // 柱头 + 拱梁
    ctx.fillStyle = '#BBB4D0';
    rr(x - wA / 2 - 13 * sc, y - hA - 8 * sc, 26 * sc, 10 * sc, 2 * sc); ctx.fill();
    rr(x + wA / 2 - 13 * sc, y - hA - 8 * sc, 26 * sc, 10 * sc, 2 * sc); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(x - wA / 2 - 15 * sc, y - hA - 6 * sc);
    ctx.quadraticCurveTo(x, y - hA - 48 * sc, x + wA / 2 + 15 * sc, y - hA - 6 * sc);
    ctx.lineTo(x + wA / 2 + 15 * sc, y - hA - 22 * sc);
    ctx.quadraticCurveTo(x, y - hA - 62 * sc, x - wA / 2 - 15 * sc, y - hA - 22 * sc);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = 'rgba(96,90,124,0.45)';
    ctx.lineWidth = 1.6;
    ctx.stroke();

    // 拱心石 + 刻纹微光
    ctx.fillStyle = '#B0A8C8';
    rr(x - 9 * sc, y - hA - 46 * sc, 18 * sc, 18 * sc, 2 * sc); ctx.fill();
    ctx.strokeStyle = withA(col, 0.4 + glow * 0.5);
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(x, y - hA * 0.52, 6 * sc, 0, TAU);
    ctx.moveTo(x, y - hA * 0.52 - 9 * sc);
    ctx.lineTo(x, y - hA * 0.52 + 9 * sc);
    ctx.stroke();
    // 柱身符文点
    ctx.fillStyle = withA(col, 0.5 + glow * 0.4);
    for (var i = 0; i < 3; i += 1) {
        ctx.beginPath();
        ctx.arc(x - wA / 2, y - hA * (0.3 + i * 0.22), 2.4 * sc, 0, TAU);
        ctx.arc(x + wA / 2, y - hA * (0.3 + i * 0.22), 2.4 * sc, 0, TAU);
        ctx.fill();
    }
}

/* 古树之心 · 苔石图腾：叠石 + 刻着笑脸 + 缠藤 */
function drawLmTotem(x, y, sc, th, h) {
    var hT = 104 * sc;
    ctx.fillStyle = 'rgba(40,80,40,0.2)';
    ctx.beginPath();
    ctx.ellipse(x, y + 3 * sc, 40 * sc, 10 * sc, 0, 0, TAU);
    ctx.fill();

    // 三块叠石：下大上小
    var stones = [[34, 30, 0], [28, 27, 0.55], [20, 23, 1.06]];
    for (var i = 0; i < 3; i += 1) {
        var s2 = stones[i];
        var sy = y - s2[1] * 0.5 - s2[2] * hT * 0.5;
        ctx.fillStyle = ['#9AAAA0', '#86988A', '#A2B0A4'][i];
        rr(x - s2[0] * sc, sy - s2[1] * sc * 0.5, s2[0] * 2 * sc, s2[1] * sc, 8 * sc);
        ctx.fill();
        ctx.strokeStyle = 'rgba(64,92,62,0.75)';
        ctx.lineWidth = 1.8;
        ctx.stroke();
    }

    // 刻出来的脸：两眼一嘴
    var fy = y - hT * 0.55;
    ctx.fillStyle = 'rgba(46,66,42,0.75)';
    ctx.beginPath();
    ctx.arc(x - 7 * sc, fy - 2 * sc, 3.2 * sc, 0, TAU);
    ctx.arc(x + 7 * sc, fy - 2 * sc, 3.2 * sc, 0, TAU);
    ctx.fill();
    ctx.strokeStyle = 'rgba(46,66,42,0.7)';
    ctx.lineWidth = 2.4;
    ctx.beginPath();
    ctx.arc(x, fy + 2 * sc, 6 * sc, 0.25, Math.PI - 0.25);
    ctx.stroke();

    // 苔藓与垂藤
    ctx.fillStyle = 'rgba(110,170,90,0.55)';
    ctx.beginPath();
    ctx.ellipse(x - 14 * sc, y - hT * 0.72, 10 * sc, 5 * sc, 0.3, 0, TAU);
    ctx.ellipse(x + 16 * sc, y - hT * 0.38, 9 * sc, 4.4 * sc, -0.2, 0, TAU);
    ctx.fill();
    ctx.strokeStyle = 'rgba(90,150,70,0.6)';
    ctx.lineWidth = 1.8;
    ctx.beginPath();
    for (var k = 0; k < 3; k += 1) {
        var vx = x - 20 * sc + k * 20 * sc;
        ctx.moveTo(vx, y - hT * 0.9);
        ctx.quadraticCurveTo(vx - 4 * sc, y - hT * 0.6, vx + 2 * sc, y - hT * 0.34);
    }
    ctx.stroke();
}

function drawRocks(x, y, th, sc, h) {
    var n = 3 + Math.floor(h * 3);
    var i, ang;
    ctx.fillStyle = 'rgba(52,82,42,0.13)';
    ctx.beginPath();
    ctx.ellipse(x, y + 9 * sc, 30 * sc, 10 * sc, 0, 0, TAU);
    ctx.fill();

    for (i = 0; i < n; i += 1) {
        ang = i / n * TAU + h * 4;
        var rr2 = 9 * sc + (i % 2) * 4.5 * sc;
        var cx = x + Math.cos(ang) * 16 * sc;
        var cy = y + Math.sin(ang) * 7 * sc - rr2 * 0.3;
        ctx.fillStyle = (i % 2) ? '#98A68E' : '#AFBBA4';
        ctx.beginPath();
        ctx.ellipse(cx, cy, rr2, rr2 * 0.8, ang * 0.5, 0, TAU);
        ctx.fill();
        ctx.strokeStyle = 'rgba(86,100,80,0.62)';
        ctx.lineWidth = 1.2;
        ctx.stroke();
        ctx.fillStyle = 'rgba(255,255,255,0.5)';
        ctx.beginPath();
        ctx.ellipse(cx - rr2 * 0.24, cy - rr2 * 0.3, rr2 * 0.4, rr2 * 0.24, ang * 0.5, 0, TAU);
        ctx.fill();
    }
    // 石缝里的草
    ctx.strokeStyle = deepen(th.grid, 0.7);
    ctx.lineWidth = 1.8;
    ctx.beginPath();
    for (i = 0; i < 4; i += 1) {
        var gxx = x + (i - 1.5) * 7 * sc;
        ctx.moveTo(gxx, y + 4 * sc);
        ctx.quadraticCurveTo(gxx + 2 * sc, y - 3 * sc, gxx + 4 * sc, y - 8 * sc);
    }
    ctx.stroke();
}

function drawFlowerBed(x, y, th, sc, h) {
    var i, a;
    ctx.fillStyle = 'rgba(246,255,214,0.22)';
    ctx.beginPath();
    ctx.ellipse(x, y, 30 * sc, 17 * sc, h * TAU, 0, TAU);
    ctx.fill();
    ctx.strokeStyle = deepen(th.grid, 0.72);
    ctx.lineWidth = 1.8;
    ctx.beginPath();
    for (i = 0; i < 7; i += 1) {
        var gx2 = x + (hash2(i + 3, 7) - 0.5) * 52 * sc;
        var gy2 = y + (hash2(i + 9, 2) - 0.5) * 26 * sc;
        ctx.moveTo(gx2, gy2);
        ctx.quadraticCurveTo(gx2 + 1.5, gy2 - 5, gx2 + 3, gy2 - 9 * sc);
    }
    ctx.stroke();

    for (i = 0; i < 9; i += 1) {
        var fx = x + (hash2(i + 21, 11) - 0.5) * 56 * sc;
        var fy = y + (hash2(i + 31, 5) - 0.5) * 28 * sc;
        var fs = (2.6 + hash2(i + 41, 9) * 1.8) * sc;
        ctx.fillStyle = (i % 3 === 0) ? th.accent : th.flower;
        ctx.beginPath();
        for (a = 0; a < 5; a += 1) {
            var aa2 = a / 5 * TAU;
            ctx.moveTo(fx, fy);
            ctx.arc(fx + Math.cos(aa2) * fs * 0.6, fy + Math.sin(aa2) * fs * 0.6, fs * 0.52, 0, TAU);
        }
        ctx.fill();
        ctx.fillStyle = 'rgba(255,236,160,0.95)';
        ctx.beginPath();
        ctx.arc(fx, fy, fs * 0.34, 0, TAU);
        ctx.fill();
    }
}
