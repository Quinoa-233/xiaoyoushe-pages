function drawGuideArt(page, x, y, w, h, t) {
    ctx.fillStyle = 'rgba(255,255,255,0.62)';
    rr(x, y, w, h, 12);
    ctx.fill();
    ctx.strokeStyle = 'rgba(72,110,40,0.22)';
    ctx.lineWidth = 1;
    rr(x + 0.5, y + 0.5, w - 1, h - 1, 12);
    ctx.stroke();

    var cx = x + w / 2;
    var cy = y + h / 2;

    if (page === 0) {
        // 角色 + 星屑
        for (var i = 0; i < 12; i += 1) {
            var a = i * 0.7 + t * 0.6;
            var rr2 = h * 0.2 + (i % 4) * (h * 0.075);
            glowDot(cx + Math.cos(a) * rr2, cy + Math.sin(a) * rr2 * 0.6, 2.2, '#E0A62A', 0.5);
        }
        drawCharShape('bunny', cx, cy + h * 0.06, clamp(h * 0.24, 18, 42), t * 1.5, 1, 0, 1);

    } else if (page === 1) {
        // 摇杆示意
        var jx = cx - 46;
        var jy = cy + 8;
        ctx.strokeStyle = 'rgba(30,126,150,0.5)';
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(jx, jy, 26, 0, TAU); ctx.stroke();
        ctx.fillStyle = 'rgba(30,126,150,0.2)';
        ctx.beginPath(); ctx.arc(jx + 12, jy - 5, 11, 0, TAU); ctx.fill();
        ctx.strokeStyle = '#1E7E96';
        ctx.lineWidth = 1.6;
        ctx.beginPath();
        ctx.moveTo(jx, jy);
        ctx.lineTo(jx + 34, jy - 14);
        ctx.stroke();
        // 箭头
        ctx.beginPath();
        ctx.moveTo(jx + 34, jy - 14);
        ctx.lineTo(jx + 26, jy - 12);
        ctx.moveTo(jx + 34, jy - 14);
        ctx.lineTo(jx + 31, jy - 5);
        ctx.stroke();

        // 星屑
        for (var g = 0; g < 5; g += 1) {
            glowDot(cx + 26 + g * 9, cy - 22 + Math.sin(t * 3 + g) * 3, 3, '#E0A62A', 0.9);
        }
        txt('拖动移动', cx + 40, cy + 26, 10, 'rgba(58,78,48,0.72)', 'center', 500);

    } else if (page === 2) {
        // 三张强化卡示意（中间那张高亮，像一个真的三选一）
        var cwid = Math.min(w * 0.24, 104);
        var chgt = Math.min(h * 0.68, 132);
        var gapK = (w - cwid * 3) / 4;
        var accK = ['#C6762C', '#C98A18', '#1E7E96'];
        for (var k = 0; k < 3; k += 1) {
            var cxk = x + gapK + k * (cwid + gapK);
            var cyk = cy - chgt / 2 - (k === 1 ? 6 : 0);
            ctx.fillStyle = k === 1 ? 'rgba(255,255,255,0.92)' : 'rgba(255,255,255,0.66)';
            rr(cxk, cyk, cwid, chgt, 10);
            ctx.fill();
            ctx.strokeStyle = accK[k];
            ctx.globalAlpha = k === 1 ? 0.85 : 0.4;
            ctx.lineWidth = k === 1 ? 1.8 : 1.3;
            rr(cxk + 0.5, cyk + 0.5, cwid - 1, chgt - 1, 10);
            ctx.stroke();
            ctx.globalAlpha = 1;

            // 顶部色晕
            var kg = ctx.createLinearGradient(cxk, cyk, cxk, cyk + chgt * 0.5);
            kg.addColorStop(0, accK[k]);
            kg.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.globalAlpha = 0.14;
            ctx.fillStyle = kg;
            rr(cxk, cyk, cwid, chgt * 0.5, 10);
            ctx.fill();
            ctx.globalAlpha = 1;

            ctx.save();
            ctx.translate(cxk + cwid / 2, cyk + chgt * 0.3);
            drawWeaponIcon(['dart', 'nova', 'orb'][k], cwid * 0.28);
            ctx.restore();

            ctx.fillStyle = 'rgba(56,80,44,0.42)';
            rr(cxk + cwid * 0.2, cyk + chgt * 0.54, cwid * 0.6, 5, 2.5);
            ctx.fill();
            ctx.fillStyle = 'rgba(56,80,44,0.24)';
            rr(cxk + cwid * 0.26, cyk + chgt * 0.66, cwid * 0.48, 4, 2);
            ctx.fill();
            ctx.fillStyle = 'rgba(56,80,44,0.18)';
            rr(cxk + cwid * 0.32, cyk + chgt * 0.78, cwid * 0.36, 4, 2);
            ctx.fill();
        }

    } else if (page === 3) {
        // 敌人示意：自爆 / 远射 / 厚甲
        var er = clamp(h * 0.13, 14, 24);
        var ex = x + w * 0.18;
        var step = w * 0.32;
        var types = ['bomber', 'spitter', 'shell'];
        for (var e2 = 0; e2 < 3; e2 += 1) {
            var fake = {
                x: ex + e2 * step, y: cy - er * 0.35, r: er, type: types[e2],
                flash: 0, t: t + e2, spawnT: 0, hp: 1, maxHp: 1, slow: 0
            };
            drawEnemy(fake);
        }
        txt('自爆', ex, cy + er * 1.5, 10, 'rgba(168,42,62,0.9)', 'center', 600);
        txt('远射', ex + step, cy + er * 1.5, 10, 'rgba(158,110,16,0.95)', 'center', 600);
        txt('厚甲', ex + step * 2, cy + er * 1.5, 10, 'rgba(84,102,74,0.9)', 'center', 600);

    } else if (page === 4) {
        // 九个区域节点
        var startX = x + w * 0.09;
        var stepX = (w * 0.82) / 8;
        var colors = ['#8FBF5E', '#B07C14', '#1E7E96', '#7A4A8E', '#B84E22',
            '#2E7A4E', '#C25E14', '#7A5A9E', '#1F6E3E'];
        ctx.strokeStyle = 'rgba(56,80,44,0.24)';
        ctx.lineWidth = 1.6;
        ctx.beginPath();
        for (var n = 0; n < 9; n += 1) {
            var nx = startX + n * stepX;
            var ny = cy + Math.sin(n * 0.9) * 10;
            if (n === 0) { ctx.moveTo(nx, ny); } else { ctx.lineTo(nx, ny); }
        }
        ctx.stroke();
        for (var n2 = 0; n2 < 9; n2 += 1) {
            var nx2 = startX + n2 * stepX;
            var ny2 = cy + Math.sin(n2 * 0.9) * 10;
            glowDot(nx2, ny2, 7, colors[n2], 0.25);
            ctx.fillStyle = colors[n2];
            ctx.beginPath(); ctx.arc(nx2, ny2, 3.4, 0, TAU); ctx.fill();
            txt(String(n2 + 1), nx2, ny2 + 19, 9, 'rgba(58,78,48,0.7)', 'center', 600);
        }
    } else if (page === 5) {
        // 金币 / 木箱 / 星屑
        var gy2 = cy + h * 0.04;
        // 金币堆
        var coinR = clamp(h * 0.075, 7, 13);
        for (var ci = 0; ci < 5; ci += 1) {
            var cxp = x + w * 0.24 + (ci % 3) * coinR * 0.9;
            var cyp = gy2 + Math.floor(ci / 3) * coinR * 0.55;
            ctx.fillStyle = '#E0A21A';
            ctx.beginPath(); ctx.arc(cxp, cyp, coinR, 0, TAU); ctx.fill();
            ctx.strokeStyle = '#B8860B';
            ctx.lineWidth = 1.2;
            ctx.stroke();
            ctx.fillStyle = '#FFE38A';
            ctx.beginPath(); ctx.arc(cxp - coinR * 0.28, cyp - coinR * 0.28, coinR * 0.34, 0, TAU); ctx.fill();
        }
        // 木箱
        ctx.fillStyle = '#A9743C';
        rr(x + w * 0.44, gy2 - 13, 34, 26, 4);
        ctx.fill();
        ctx.strokeStyle = '#6E451E';
        ctx.lineWidth = 1.6;
        rr(x + w * 0.44, gy2 - 13, 34, 26, 4);
        ctx.stroke();
        ctx.fillStyle = '#F2CC66';
        fillEllipse(x + w * 0.44 + 17, gy2 + 1, 3.2, 4.2);
        txt('?', x + w * 0.44 + 17, gy2 - 26, 12, '#8A5A2E', 'center', 800);
        // 星屑
        var sx3 = x + w * 0.76;
        glowDot(sx3, gy2, 20, '#9AD7FF', 0.4);
        ctx.fillStyle = '#9AD7FF';
        ctx.beginPath();
        ctx.moveTo(sx3, gy2 - 16);
        ctx.lineTo(sx3 + 10, gy2);
        ctx.lineTo(sx3, gy2 + 16);
        ctx.lineTo(sx3 - 10, gy2);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = '#FFFFFF';
        ctx.lineWidth = 1.3;
        ctx.stroke();
    } else {
        // 成就：一枚奖章 + 一张打勾的清单
        var mx = x + w * 0.26;
        var my = cy + h * 0.02;
        var mr = clamp(h * 0.13, 15, 26);
        // 绶带
        ctx.fillStyle = '#7A5A9E';
        ctx.beginPath();
        ctx.moveTo(mx - mr * 0.42, my + mr * 0.7);
        ctx.lineTo(mx - mr * 0.16, my + mr * 1.5);
        ctx.lineTo(mx, my + mr * 0.95);
        ctx.lineTo(mx + mr * 0.16, my + mr * 1.5);
        ctx.lineTo(mx + mr * 0.42, my + mr * 0.7);
        ctx.closePath();
        ctx.fill();
        // 章体
        glowDot(mx, my, mr * 1.7, '#E0A21A', 0.28);
        ctx.fillStyle = '#E8A81E';
        ctx.beginPath();
        ctx.arc(mx, my, mr, 0, TAU);
        ctx.fill();
        ctx.strokeStyle = '#B8860B';
        ctx.lineWidth = 1.6;
        ctx.stroke();
        ctx.fillStyle = '#8A5E0E';
        ctx.beginPath();
        ctx.arc(mx, my, mr * 0.68, 0, TAU);
        ctx.fill();
        // 对勾
        ctx.strokeStyle = '#FFE9A8';
        ctx.lineWidth = Math.max(2, mr * 0.16);
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(mx - mr * 0.32, my + mr * 0.02);
        ctx.lineTo(mx - mr * 0.08, my + mr * 0.28);
        ctx.lineTo(mx + mr * 0.36, my - mr * 0.28);
        ctx.stroke();
        ctx.lineCap = 'butt';

        // 清单
        var lx2 = x + w * 0.56;
        var ly2 = cy - h * 0.28;
        var lw2 = w * 0.32;
        var lh2 = h * 0.62;
        ctx.fillStyle = 'rgba(255,255,255,0.9)';
        rr(lx2, ly2, lw2, lh2, 6);
        ctx.fill();
        ctx.strokeStyle = 'rgba(122,90,158,0.4)';
        ctx.lineWidth = 1.2;
        rr(lx2 + 0.5, ly2 + 0.5, lw2 - 1, lh2 - 1, 6);
        ctx.stroke();
        for (var li = 0; li < 3; li += 1) {
            var rowY = ly2 + lh2 * (0.26 + li * 0.26);
            ctx.fillStyle = li < 2 ? '#4E9E2A' : 'rgba(56,80,44,0.22)';
            ctx.beginPath();
            ctx.arc(lx2 + 11, rowY, 4, 0, TAU);
            ctx.fill();
            if (li < 2) {
                ctx.strokeStyle = '#FFFFFF';
                ctx.lineWidth = 1.4;
                ctx.beginPath();
                ctx.moveTo(lx2 + 9, rowY);
                ctx.lineTo(lx2 + 10.6, rowY + 1.8);
                ctx.lineTo(lx2 + 13.2, rowY - 1.8);
                ctx.stroke();
            }
            ctx.fillStyle = 'rgba(58,78,48,0.28)';
            rr(lx2 + 19, rowY - 1.6, lw2 * 0.55, 3.2, 1.6);
            ctx.fill();
        }
    }
}

function wrapCount(text, maxW, size) {
    ctx.font = '500 ' + Math.round(size) + 'px system-ui, -apple-system, sans-serif';
    var line = '', n = 1;
    for (var i = 0; i < text.length; i += 1) {
        var ch = text.charAt(i);
        if (ctx.measureText(line + ch).width > maxW && line.length) { n += 1; line = ch; }
        else { line += ch; }
    }
    return n;
}

function drawGuide(t) {
    darkBg();
    drawStarsBg(t);
    dustParticles(t);

    var page = GUIDE[clamp(guidePage, 0, GUIDE.length - 1)];

    var pad = Math.min(22, W * 0.055);
    var topY = H * 0.09;

    txt('玩法指引', pad, topY, 12, 'rgba(47,90,32,0.92)', 'left', 700);
    txt('BRIEFING 0' + (guidePage + 1) + ' / 0' + GUIDE.length,
        W - pad, topY, 10.5, 'rgba(150,168,200,0.6)', 'right', 600);

    // 页码点
    for (var d = 0; d < GUIDE.length; d += 1) {
        var on = d === guidePage;
        ctx.fillStyle = on ? page.color : 'rgba(56,80,44,0.4)';
        rr(W / 2 - (GUIDE.length * 11) / 2 + d * 11, topY + 20, on ? 10 : 6, 3, 1.5);
        ctx.fill();
    }

    // 正文先量高度；竖屏整块居中，横屏左图右文
    var bodySize = LAND ? 11.5 : 12.5;
    var lineH = LAND ? 18 : 21;
    var paraGap = LAND ? 6 : 8;
    var btnTop = H - Math.min(76, H * 0.11);
    var areaTop = topY + 42;
    var areaBot = btnTop - 26;

    var artW, artH, artX, artY, tx, tyFirst, bodyW;

    if (LAND) {
        artW = Math.min(W * 0.38, 330);
        artH = areaBot - areaTop;
        artX = pad;
        artY = areaTop;
        bodyW = W - (artX + artW + 22) - pad;
        tx = artX + artW + 22;
        drawGuideArt(guidePage, artX, artY, artW, artH, t);
        txt(page.title, tx, artY + 12, Math.min(19, W * 0.036), page.color, 'left', 800);
        tyFirst = artY + 42;
    } else {
        artW = Math.min(W - pad * 2, 420);
        artH = clamp(H * 0.235, 132, 180);
        bodyW = artW - 8;
        var nLines = 0;
        for (var i2 = 0; i2 < page.lines.length; i2 += 1) {
            nLines += wrapCount(page.lines[i2], bodyW, bodySize);
        }
        var bodyH = nLines * lineH + (page.lines.length - 1) * paraGap;
        var blockH = artH + 34 + 24 + bodyH;
        var slack = Math.max(0, areaBot - areaTop - blockH);
        artX = W / 2 - artW / 2;
        artY = areaTop + slack * 0.5;
        drawGuideArt(guidePage, artX, artY, artW, artH, t);
        txt(page.title, pad, artY + artH + 32, Math.min(21, W * 0.058), page.color, 'left', 800);
        tx = pad;
        tyFirst = artY + artH + 62;
    }

    // 正文（段间距 = 一个行高 + 段距，避免段与段粘连）
    var ty = tyFirst;
    for (var i = 0; i < page.lines.length; i += 1) {
        ty = wrapText(page.lines[i], tx, ty, bodyW, bodySize, 'rgba(38,56,32,0.9)', lineH);
        ty += lineH + paraGap;
    }

    // 按钮
    var by = btnTop;
    var bh = Math.min(50, H * 0.072);
    var halfW = (W - pad * 2 - 12) / 2;

    if (LAND) {
        ui.guideSkip = { x: pad, y: by, w: 84, h: bh };
        txt('跳过简报', pad + 4, by + bh / 2, 11, 'rgba(74,94,64,0.66)', 'left', 500);
        if (guidePage > 0) {
            ui.guidePrev = { x: pad + 92, y: by, w: 104, h: bh };
            neonBtn(ui.guidePrev, '上一步', '#5E7E4E', null, t);
        } else {
            ui.guidePrev = null;
        }
    } else {
        if (guidePage > 0) {
            ui.guidePrev = { x: pad, y: by, w: halfW * 0.62, h: bh };
            neonBtn(ui.guidePrev, '上一步', '#5E7E4E', null, t);
            ui.guideSkip = { x: pad + halfW * 0.62 + 6, y: by, w: 62, h: bh };
            txt('跳过', pad + halfW * 0.62 + 10, by + bh / 2, 11, 'rgba(74,94,64,0.68)', 'left', 500);
        } else {
            ui.guidePrev = null;
            ui.guideSkip = { x: pad, y: by, w: 88, h: bh };
            txt('跳过简报', pad + 4, by + bh / 2, 11.5, 'rgba(74,94,64,0.7)', 'left', 500);
        }
    }

    var isLast = guidePage >= GUIDE.length - 1;
    var nw = halfW * (guidePage > 0 ? 1.02 : 1.5);
    ui.guideNext = { x: W - pad - nw, y: by, w: nw, h: bh };

    var nx = ui.guideNext.x;
    var ng = ctx.createLinearGradient(nx, by, nx, by + bh);
    ng.addColorStop(0, isLast ? '#4E9E2A' : '#8FBF5E');
    ng.addColorStop(1, isLast ? '#3F8E22' : '#3F8E22');
    ctx.fillStyle = ng;
    rr(nx, by, nw, bh, bh * 0.3);
    ctx.fill();
    ctx.fillStyle = '#0A0518';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = '800 ' + Math.round(Math.min(17, bh * 0.36)) + 'px system-ui, sans-serif';
    ctx.fillText(isLast ? '选角色 →' : '下一步 →', nx + nw / 2, by + bh / 2 + 1);
}

/* ============================================================ 选角色 */
function drawCharSelect(t) {
    darkBg();
    drawStarsBg(t);

    var pad = Math.min(20, W * 0.05);
    var headY = LAND ? H * 0.08 : H * 0.062;
    txt('选择猎手', W / 2, headY, Math.min(22, W * 0.055), '#22331C', 'center', 800);
    txt(LAND ? '点卡片出战 · 带锁的角色攒金币解锁' : '点卡片出战，带锁的角色攒金币解锁',
        W / 2, headY + 22, 11, 'rgba(58,78,48,0.72)', 'center', 500);

    // 金币余额
    var coinTxt = '金币 ' + (save.coins || 0);
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';
    ctx.font = '700 12px system-ui, sans-serif';
    var cwTxt = ctx.measureText(coinTxt).width;
    ctx.fillStyle = 'rgba(255,255,255,0.78)';
    rr(W - pad - cwTxt - 26, headY - 24, cwTxt + 26, 20, 10);
    ctx.fill();
    ctx.fillStyle = '#E0A21A';
    fillEllipse(W - pad - cwTxt - 15, headY - 14, 4.6, 4.6);
    txt(coinTxt, W - pad - 5, headY - 14, 11.5, '#8A5E0E', 'right', 700);

    var colW = Math.min(W - pad * 2, LAND ? W : 430);
    var cx0 = W / 2 - colW / 2;
    var btmH = LAND ? 54 : Math.min(78, H * 0.105);
    var top = LAND ? headY + 42 : H * 0.12;
    var bottom = H - btmH;
    var gap = LAND ? Math.max(7, W * 0.01) : 9;
    var i, c, sel;

    ui.charCards = [];

    var cols = LAND ? 4 : 2;
    var rows = Math.ceil(CHARS.length / cols);
    var cw = (colW - gap * (cols - 1)) / cols;
    var availH = bottom - top;
    var chh = Math.min((availH - gap * (rows - 1)) / rows, 142);
    top += Math.max(0, (availH - (chh * rows + gap * (rows - 1))) / 2);

    for (i = 0; i < CHARS.length; i += 1) {
        c = CHARS[i];
        var x = cx0 + (i % cols) * (cw + gap);
        var y = top + Math.floor(i / cols) * (chh + gap);
        sel = save.char === c.id;
        var unlocked = charUnlocked(c);
        ui.charCards.push({ x: x, y: y, w: cw, h: chh, id: c.id, price: unlocked ? 0 : c.price });

        ctx.fillStyle = sel ? 'rgba(255,255,255,0.74)'
            : (unlocked ? 'rgba(255,255,255,0.54)' : 'rgba(255,255,255,0.32)');
        rr(x, y, cw, chh, 13);
        ctx.fill();
        ctx.strokeStyle = sel ? c.color : 'rgba(56,80,44,0.2)';
        ctx.lineWidth = sel ? 2 : 1.2;
        rr(x + 0.5, y + 0.5, cw - 1, chh - 1, 13);
        ctx.stroke();

        // 头像：略微收小，给下面两行介绍腾地方
        var avR = Math.min(19, chh * 0.185, cw * 0.115);
        var avX = x + 12 + avR * 1.28;
        var avY = y + 16 + avR;
        ctx.fillStyle = 'rgba(255,255,255,0.6)';
        ctx.beginPath();
        ctx.arc(avX, avY, avR * 1.28, 0, TAU);
        ctx.fill();
        drawCharShape(c.id, avX, avY, avR, t * 1.3 + i, 1, 0, unlocked ? (sel ? 1 : 0.85) : 0.45);

        // 名字
        var nx = avX + avR * 1.28 + 7;
        var nameS = Math.min(14, chh * 0.13, cw * 0.14);
        txt(c.name, nx, avY - 6, nameS, unlocked ? '#22331C' : 'rgba(38,54,30,0.5)', 'left', 700);
        // 标签
        ctx.fillStyle = c.color;
        ctx.globalAlpha = unlocked ? 0.24 : 0.12;
        rr(nx, avY + 3, 30, 13, 6.5);
        ctx.fill();
        ctx.globalAlpha = 1;
        txt(c.tag, nx + 15, avY + 9.5, 8.6, unlocked ? deepen(c.color, 0.72) : 'rgba(56,80,44,0.45)', 'center', 700);
        // 近战 / 远攻 小牌
        var rngMelee = c.range === 'melee';
        var rngX = nx + 34, rngW = 30;
        ctx.fillStyle = rngMelee ? '#FF7A1A' : '#1E7E96';
        ctx.globalAlpha = unlocked ? 0.22 : 0.10;
        rr(rngX, avY + 3, rngW, 13, 6.5);
        ctx.fill();
        ctx.globalAlpha = 1;
        txt(rngMelee ? '近战' : '远攻', rngX + rngW / 2, avY + 9.5, 8.6,
            unlocked ? (rngMelee ? '#B44E00' : '#12657E') : 'rgba(56,80,44,0.45)', 'center', 700);

        var eggOk = !c.needEgg || !!(save.eggs && save.eggs[c.needEgg]);
        var affordable = eggOk && (save.coins || 0) >= c.price;

        if (!unlocked) {
            // 右上角一把锁：点开还能看介绍，只是买不了
            var lx = x + cw - 26, ly = y + 30;
            ctx.strokeStyle = 'rgba(56,80,44,0.5)';
            ctx.lineWidth = 1.7;
            ctx.beginPath();
            ctx.arc(lx, ly - 4, 6, Math.PI, 0);
            ctx.stroke();
            ctx.fillStyle = 'rgba(56,80,44,0.32)';
            rr(lx - 8, ly - 4, 16, 13, 3);
            ctx.fill();
        }

        // 介绍：两行折行，从头像底下开始，不压头像也不压属性条
        var dSize = LAND ? Math.min(9.4, chh * 0.095) : Math.min(9.4, chh * 0.092);
        var dGap = Math.max(10.2, chh * 0.104);
        var dTop = avY + avR * 1.28 + Math.max(5, chh * 0.055);
        var dLines = wrapLines(c.desc, cw - 24, dSize, 2);
        for (var dl = 0; dl < dLines.length; dl += 1) {
            txt(dLines[dl], x + 12, dTop + dl * dGap, dSize,
                unlocked ? 'rgba(58,78,48,0.74)' : 'rgba(58,78,48,0.46)', 'left', 500);
        }

        if (!unlocked) {
            // 价格 + 一行提示，底边跟属性条对齐
            txt(eggOk ? (c.price + ' 金') : '???', x + 12, y + chh - 10,
                Math.min(12, chh * 0.113),
                affordable ? '#8A5E0E' : 'rgba(120,86,66,0.62)', 'left', 700);
            txt(eggOk ? '点开看介绍' : '先找那件东西', x + cw - 12, y + chh - 10,
                8.2, 'rgba(58,78,48,0.42)', 'right', 500);
            continue;
        }

        // 三条属性
        var barY = y + chh - 14;
        var barW = cw - 24;
        var stats = [
            { v: c.hp / 210, col: '#FF5D73' },
            { v: c.speed / 230, col: '#1E7E96' },
            { v: c.dmg / 1.42, col: '#C98A18' }
        ];
        for (var s = 0; s < 3; s += 1) {
            var sw = barW / 3 - 6;
            var sx2 = x + 12 + s * (barW / 3);
            ctx.fillStyle = 'rgba(255,255,255,0.72)';
            rr(sx2, barY, sw, 4, 2);
            ctx.fill();
            ctx.fillStyle = stats[s].col;
            rr(sx2, barY, Math.max(3, sw * clamp(stats[s].v, 0, 1)), 4, 2);
            ctx.fill();
        }

        if (sel) {
            ctx.fillStyle = c.color;
            ctx.globalAlpha = 0.9;
            rr(x + cw - 44, y + 8, 36, 15, 7.5);
            ctx.fill();
            ctx.globalAlpha = 1;
            txt('出战中', x + cw - 26, y + 15.5, 8.5, '#FFFFFF', 'center', 700);
        }
    }

    // 底部按钮
    var by = bottom + 6;
    var bh = Math.min(LAND ? 42 : 50, H * 0.072);
    var bw = (colW - 20) * 0.26;
    ui.backBtn = { x: cx0, y: by, w: bw, h: bh };
    neonBtn(ui.backBtn, '返回', '#5E7E4E', null, t);

    ui.gearBtn = { x: cx0 + bw + 10, y: by, w: bw, h: bh };
    neonBtn(ui.gearBtn, '装备', '#7A5A9E', null, t);

    var goX = cx0 + (bw + 10) * 2;
    var goW = colW - (bw + 10) * 2;
    ui.startRunBtn = { x: goX, y: by, w: goW, h: bh };
    var ch2 = getChar(save.char);
    var gg = ctx.createLinearGradient(goX, by, goX, by + bh);
    gg.addColorStop(0, ch2.color);
    gg.addColorStop(1, ch2.glow);
    ctx.fillStyle = gg;
    rr(goX, by, goW, bh, bh * 0.3);
    ctx.fill();
    ctx.fillStyle = '#0A0518';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = '800 ' + Math.round(Math.min(17, bh * 0.4)) + 'px system-ui, sans-serif';
    ctx.fillText('选择区域 →', goX + goW / 2, by + bh / 2 + 1);
}


/* ---------------------------------------------------------- 装备 */
var gearSlot = 'weapon';        // 正在挑哪个槽位
var gearScroll = 0;             // 装备列表滚到哪了（件数变多之后得能翻）

function gearModText(it) {
    if (!it || !it.mod) { return ''; }
    var out = [];
    var m = it.mod;
    if (m.atk) { out.push('攻击 +' + Math.round(m.atk * 100) + '%'); }
    if (m.hp) { out.push('生命 +' + m.hp); }
    if (m.dr) { out.push('减伤 +' + Math.round(m.dr * 100) + '%'); }
    if (m.speed) { out.push('移速 +' + Math.round(m.speed * 100) + '%'); }
    if (m.crit) { out.push('暴击 +' + Math.round(m.crit * 100) + '%'); }
    return out.join('　');
}

function gearSumText(gm) {
    var out = [];
    if (gm.atk) { out.push('攻击 +' + Math.round(gm.atk * 100) + '%'); }
    if (gm.hp) { out.push('生命 +' + gm.hp); }
    if (gm.dr) { out.push('减伤 +' + Math.round(gm.dr * 100) + '%'); }
    if (gm.speed) { out.push('移速 +' + Math.round(gm.speed * 100) + '%'); }
    if (gm.crit) { out.push('暴击 +' + Math.round(gm.crit * 100) + '%'); }
    return out.length ? out.join('　') : '还没穿东西';
}

function equipOf(charId, slot) {
    var eq = save.gearEq[charId || save.char];
    return eq ? eq[slot] : '';
}

/* 装备页：三个槽位 */
function drawGear(t) {
    darkBg();
    drawStarsBg(t);

    var pad = Math.min(20, W * 0.05);
    var ch = getChar(save.char);
    var headY = LAND ? H * 0.08 : H * 0.062;
    txt('装备', W / 2, headY, Math.min(22, W * 0.055), '#22331C', 'center', 800);
    txt(ch.name + '　' + (ch.range === 'melee' ? '近战' : '远攻') + '　金币 ' + (save.coins || 0),
        W / 2, headY + 22, 11, 'rgba(58,78,48,0.72)', 'center', 500);

    var colW = Math.min(W - pad * 2, LAND ? W * 0.72 : 430);
    var cx0 = W / 2 - colW / 2;
    var rowH = Math.min(72, H * 0.098);
    var y0 = headY + 44;

    ui.gearSlots = [];
    for (var i = 0; i < GEAR_SLOTS.length; i += 1) {
        var sl = GEAR_SLOTS[i];
        var y = y0 + i * (rowH + 10);
        var it = gearOf(equipOf(save.char, sl.id));
        var rar = gearRarity(it);
        ui.gearSlots.push({ x: cx0, y: y, w: colW, h: rowH, slot: sl.id });

        ctx.fillStyle = 'rgba(255,255,255,0.66)';
        rr(cx0, y, colW, rowH, 14);
        ctx.fill();
        ctx.strokeStyle = it ? rar.color : 'rgba(56,80,44,0.22)';
        ctx.lineWidth = it ? 2 : 1.2;
        rr(cx0 + 0.5, y + 0.5, colW - 1, rowH - 1, 14);
        ctx.stroke();

        // 左侧：穿上就画出它的样子，空着就留槽位图标
        if (it) {
            drawGearIcon(it, cx0 + 27, y + rowH / 2, 15, t);
        } else {
            ctx.fillStyle = 'rgba(56,80,44,0.18)';
            ctx.globalAlpha = 0.12;
            rr(cx0 + 12, y + rowH / 2 - 15, 30, 30, 9);
            ctx.fill();
            ctx.globalAlpha = 1;
            txt(sl.icon, cx0 + 27, y + rowH / 2, 14, 'rgba(56,80,44,0.5)', 'center', 800);
        }

        txt(sl.name, cx0 + 50, y + rowH * 0.34, 12, '#22331C', 'left', 800);
        txt(it ? it.name : '空着，点这里挑一件', cx0 + 50, y + rowH * 0.68, 11.5,
            it ? deepen(rar.color, 0.62) : 'rgba(58,78,48,0.5)', 'left', 700);
        if (it) {
            txt(rar.name, cx0 + colW - 46, y + rowH * 0.34, 10, rar.color, 'right', 700);
            txt(gearModText(it), cx0 + colW - 14, y + rowH * 0.68, 9.6, 'rgba(58,78,48,0.72)', 'right', 500);
        }
        // 右侧箭头
        var ax = cx0 + colW - 20;
        ctx.strokeStyle = 'rgba(58,78,48,0.45)';
        ctx.lineWidth = 1.8;
        ctx.beginPath();
        ctx.moveTo(ax - 4, y + rowH / 2 - 5);
        ctx.lineTo(ax + 1, y + rowH / 2);
        ctx.lineTo(ax - 4, y + rowH / 2 + 5);
        ctx.stroke();
    }

    var sumY = y0 + GEAR_SLOTS.length * (rowH + 10) + 10;

    /* 穿上后的样子：实时立绘，改穿什么立刻能看到 */
    var pvH = Math.min(96, H * 0.135);
    var pvW = pvH * 1.9;
    var pvX = W / 2 - pvW / 2;
    var pvY = sumY + 2;
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    rr(pvX, pvY, pvW, pvH, 12);
    ctx.fill();
    ctx.strokeStyle = 'rgba(56,80,44,0.18)';
    ctx.lineWidth = 1;
    rr(pvX + 0.5, pvY + 0.5, pvW - 1, pvH - 1, 12);
    ctx.stroke();
    // 地台
    ctx.fillStyle = 'rgba(150,206,92,0.4)';
    ctx.beginPath();
    ctx.ellipse(W / 2, pvY + pvH * 0.86, pvW * 0.3, pvH * 0.1, 0, 0, TAU);
    ctx.fill();
    sandboxSafeChar(save.char, W / 2, pvY + pvH * 0.58, pvH * 0.3, t);
    txt('穿上后的样子', pvX + 8, pvY + 13, 8.5, 'rgba(58,78,48,0.55)', 'left', 600);

    txt('合计：' + gearSumText(gearMods(save.char)), W / 2, pvY + pvH + 16, 10.5, 'rgba(58,78,48,0.8)', 'center', 600);
    if (isMeleeChar(save.char)) {
        txt('近战天生减伤 ' + Math.round(MELEE_DR_BASE * 100) + '%，升级「格挡」可继续加',
            W / 2, pvY + pvH + 33, 9.5, 'rgba(58,78,48,0.6)', 'center', 500);
    }

    /* 这一身穿出来的攻击特效：武器给主特效，别的槽位撞属性会加成 */
    var fxY = pvY + pvH + (isMeleeChar(save.char) ? 56 : 38);
    var fxOn = gearFxOf(save.char);
    if (fxOn.main !== 'none') {
        var mf = GEAR_FX[fxOn.main];
        txt('攻击特效', W / 2, fxY, 10, 'rgba(58,78,48,0.62)', 'center', 600);
        txt(mf.name + '　' + mf.desc, W / 2, fxY + 16, 12, mf.color, 'center', 800);
        if (fxOn.subs.length) {
            var subTxt = '';
            for (var si = 0; si < fxOn.subs.length; si += 1) {
                subTxt += (si ? ' · ' : '') + GEAR_FX[fxOn.subs[si]].name;
            }
            if (fxOn.amp > 1) { subTxt += '　（同属性加成 ' + Math.round(fxOn.amp * 100 - 100) + '%）'; }
            txt('附加：' + subTxt, W / 2, fxY + 31, 9.6, 'rgba(58,78,48,0.66)', 'center', 500);
        }
    } else {
        txt('没穿带特效的武器，攻击就是普通打击', W / 2, fxY + 6, 10.5, 'rgba(58,78,48,0.55)', 'center', 500);
    }

    var bh = Math.min(46, H * 0.07);
    ui.gearBack = { x: W / 2 - Math.min(colW, 280) / 2, y: H - bh - 14, w: Math.min(colW, 280), h: bh };
    neonBtn(ui.gearBack, '返回', '#5E7E4E', null, t);
}

/* 穿戴预览用的角色绘制：大厅与战斗里同一条链路，装备会一起画出来 */
function sandboxSafeChar(id, x, y, r, t) {
    try {
        drawCharShape(id, x, y, r, t, 1, 0, 1);
    } catch (e) { /* 兜底：预览失败别把整页拖崩 */ }
}

/* 装备列表：某一槽位的所有装备，能穿就穿，没有的可以买 */
function drawGearList(t) {
    darkBg();
    drawStarsBg(t);

    var pad = Math.min(20, W * 0.05);
    var ch = getChar(save.char);
    var slName = '';
    for (var q = 0; q < GEAR_SLOTS.length; q += 1) {
        if (GEAR_SLOTS[q].id === gearSlot) { slName = GEAR_SLOTS[q].name; }
    }
    var headY = LAND ? H * 0.08 : H * 0.062;
    txt('挑一件' + slName, W / 2, headY, Math.min(20, W * 0.05), '#22331C', 'center', 800);
    txt('金币 ' + (save.coins || 0) + '　低品质靠闯关掉，高品质的得花钱',
        W / 2, headY + 22, 10.5, 'rgba(58,78,48,0.72)', 'center', 500);

    // 左上角也放一个返回，滑到哪儿都能随时退出
    /* 视觉是 66×30，但手指点击热区向外放宽到约 46 高、78 宽：
       手机上点这个「← 返回」不用像素级精准（图上看不出差别）。
       左下与下方没有别的可点元素，向外扩不会抢走其它操作。 */
    ui.gearBack2 = { x: 6, y: headY - 23, w: 78, h: 46 };
    neonBtn({ x: 12, y: headY - 15, w: 66, h: 30 }, '← 返回', '#5E7E4E', null, t);

    var colW = Math.min(W - pad * 2, LAND ? W * 0.8 : 430);
    var cx0 = W / 2 - colW / 2;
    var top = headY + 40;
    var bottom = H - 14;                  // 底部不放按钮了，列表直接铺到底
    var rowH = Math.min(54, (bottom - top) / 6);

    ui.gearRows = [];

    /* 一个槽位有十几件，先把这一个槽位的东西挑出来，
       再按品质从高到低分档，每档顶一条小标题，档与档之间留一截空隙 */
    var pool = [];
    for (var s = 0; s < GEAR.length; s += 1) {
        if (GEAR[s].slot === gearSlot) { pool.push(GEAR[s]); }
    }
    var tiers = GEAR_RARITY_IDS.slice().sort(function (p, q2) {
        return GEAR_RARITY[p].order - GEAR_RARITY[q2].order;     // 普通在上，传说压轴
    });
    var bands = [];
    for (var ti = 0; ti < tiers.length; ti += 1) {
        var group = [];
        for (var pi = 0; pi < pool.length; pi += 1) {
            if (pool[pi].rarity === tiers[ti]) { group.push(pool[pi]); }
        }
        if (group.length) { bands.push({ rarity: tiers[ti], items: group }); }
    }

    // 逐档排版，算出整份列表的总高度，给滚动留底
    var layout = [];
    var totalH = 0;
    var headH = 20, bandGap = 9;
    for (var bi = 0; bi < bands.length; bi += 1) {
        totalH += headH;
        layout.push({ kind: 'head', rarity: bands[bi].rarity, y: totalH - headH, count: bands[bi].items.length });
        for (var ii = 0; ii < bands[bi].items.length; ii += 1) {
            layout.push({ kind: 'item', item: bands[bi].items[ii], y: totalH });
            totalH += rowH + 7;
        }
        totalH += bandGap;
    }

    var viewH = bottom - top;
    var maxScroll = Math.max(0, totalH - viewH);
    gearScroll = clamp(gearScroll, 0, maxScroll);
    ui.gearScrollMax = maxScroll;

    ctx.save();
    ctx.beginPath();
    ctx.rect(cx0 - 6, top - 4, colW + 12, viewH + 8);
    ctx.clip();

    for (var li = 0; li < layout.length; li += 1) {
        var node = layout[li];
        var y = top + node.y - gearScroll;
        if (y > bottom + rowH || y + rowH < top - headH) { continue; }

        if (node.kind === 'head') {
            var rarH = GEAR_RARITY[node.rarity];
            txt(rarH.name + '　' + node.count + ' 件', cx0 + 4, y + headH * 0.66, 11.5, rarH.color, 'left', 800);
            ctx.strokeStyle = withA(rarH.color, 0.4);
            ctx.lineWidth = 1.2;
            ctx.beginPath();
            ctx.moveTo(cx0 + 4, y + headH - 3);
            ctx.lineTo(cx0 + colW, y + headH - 3);
            ctx.stroke();
            continue;
        }
        drawGearRow(node.item, cx0, y, colW, rowH);
    }
    ctx.restore();

    // 右侧滚动条：列表比视野长的时候才出现
    if (maxScroll > 0) {
        var sbx = cx0 + colW + 5;
        var sbTrackH = viewH;
        var sbH = Math.max(26, sbTrackH * (viewH / totalH));
        var sbY = top + (sbTrackH - sbH) * (gearScroll / maxScroll);
        ctx.fillStyle = 'rgba(56,80,44,0.14)';
        rr(sbx, top, 4, sbTrackH, 2);
        ctx.fill();
        ctx.fillStyle = 'rgba(58,84,46,0.42)';
        rr(sbx, sbY, 4, sbH, 2);
        ctx.fill();
    }

    ui.gearBack = null;                   // 底部返回撤掉，只留左上角那个常驻的
}

/* 装备列表里的一行；穿戴 / 脱下 / 购买都在 tapGearRow 里处理 */
function drawGearRow(it, cx0, y, colW, rowH) {
    var owned = !!save.gearOwn[it.id];
    var on = equipOf(save.char, it.slot) === it.id;
    var fits = gearFits(it, save.char);
    var rar = gearRarity(it);

    ui.gearRows.push({ x: cx0, y: y, w: colW, h: rowH, id: it.id, owned: owned, equipped: on, fits: fits });

    ctx.fillStyle = on ? 'rgba(255,255,255,0.8)' : 'rgba(255,255,255,0.56)';
    rr(cx0, y, colW, rowH, 12);
    ctx.fill();
    ctx.strokeStyle = on ? rar.color : (fits ? 'rgba(56,80,44,0.2)' : 'rgba(120,60,60,0.28)');
    ctx.lineWidth = on ? 2 : 1.1;
    rr(cx0 + 0.5, y + 0.5, colW - 1, rowH - 1, 12);
    ctx.stroke();

    // 左边画出这件装备的样子
    var ic = rowH - 12;
    ctx.save();
    if (!fits) { ctx.globalAlpha = 0.45; }
    drawGearIcon(it, cx0 + 9 + ic / 2, y + rowH / 2, ic / 2, 0);
    ctx.restore();

    // 品质色条
    ctx.fillStyle = rar.color;
    ctx.globalAlpha = fits ? 0.85 : 0.35;
    rr(cx0 + ic + 18, y + 9, 4, rowH - 18, 2);
    ctx.fill();
    ctx.globalAlpha = 1;

    var tx = cx0 + ic + 30;
    txt(it.name, tx, y + rowH * 0.34, 12, fits ? '#22331C' : 'rgba(90,60,60,0.7)', 'left', 700);

    // 第二行：词条 + 这件装备带出来的攻击特效
    var line2 = gearModText(it);
    var fx = it.fx && it.fx !== 'none' ? GEAR_FX[it.fx] : null;
    if (fx) {
        txt(line2, tx, y + rowH * 0.72, 9.4,
            fits ? 'rgba(58,78,48,0.72)' : 'rgba(120,70,70,0.6)', 'left', 500);
        var lw = ctx.measureText(line2).width;
        txt('· ' + fx.name, tx + lw + 8, y + rowH * 0.72, 9.4, fx.color, 'left', 700);
    } else {
        txt(line2, tx, y + rowH * 0.72, 9.4,
            fits ? 'rgba(58,78,48,0.72)' : 'rgba(120,70,70,0.6)', 'left', 500);
    }

    var right, rightCol;
    if (!fits) { right = '仅近战'; rightCol = 'rgba(150,70,70,0.8)'; }
    else if (on) { right = '脱下'; rightCol = '#5E7E4E'; }
    else if (owned) { right = '穿戴'; rightCol = '#4E9E2A'; }
    else { right = it.price + ' 金'; rightCol = (save.coins || 0) >= it.price ? '#8A5E0E' : 'rgba(120,86,66,0.62)'; }
    txt(right, cx0 + colW - 14, y + rowH / 2, 11.5, rightCol, 'right', 700);
}

/* ============================================================ 任务：任务 / 成就 / 特效 / 排行 */
/* ============================================================ 账号：谁在玩 / 我的账号
   每人一个账号（自己起的名字 + 自己从相册挑的头像），点一下名字就进，不用口令。
   同一台设备上所有人的进度、金币、成就、任务互不影响。 */
var delArm = '';          // 删除确认：第一次点只上膛，第二次才真删
var newName = '';         // 注册 / 改名页里的名字
var newCol = '#E8734A';
var signPhoto = '';       // 注册时从相册选好的头像（dataURL）
var nameField = '';       // 'signup' | 'rename'，当前在改哪个名字
var loginSel = '';        // 登录页里被点中的账号（进页面前的一点点延迟）

/* 取一个还没人用的名字 */
function suggestName() {
    var p = loadProfiles();
    var used = {};
    for (var i = 0; i < p.list.length; i += 1) { used[p.list[i].name] = 1; }
    var pool = [];
    for (var j = 0; j < USER_NAMES.length; j += 1) {
        if (!used[USER_NAMES[j]]) { pool.push(USER_NAMES[j]); }
    }
    if (pool.length) { return pool[Math.floor(Math.random() * pool.length)]; }
    return '玩家 ' + (p.list.length + 1);
}

function suggestCol() {
    var p = loadProfiles();
    var used = 0;
    for (var i = 0; i < p.list.length; i += 1) {
        if (p.list[i].col === USER_COLS[used % USER_COLS.length]) { used += 1; }
    }
    return USER_COLS[used % USER_COLS.length];
}

function playerStatsLine(rec) {
    var r = profileStats(rec.id);
    return '通关 ' + r.histClears + '/' + STAGES.length +
        '　今日 ' + r.clears +
        '　金币 ' + r.coinsTotal;
}

function seenText(rec) {
    if (!rec.seen) { return '还没玩过'; }
    var d = new Date(rec.seen);
    return (d.getMonth() + 1) + ' 月 ' + d.getDate() + ' 日玩过';
}

/* ---------------------------------------------------------- 系统键盘
   canvas 里没有输入框，就把一个完全透明的 <input> 贴在名字框上（同一位置、同样大小）。
   点它 = 点名字框，系统键盘 + 玩家自己的输入法就会弹出来，中文/英文/表情都能打。
   注意：不能像以前那样把 input 扔到屏幕外（left:-200px），那样很多 WebView 根本不弹键盘。 */
var NAME_MAX = 12;
var nameEl = null;
var nameScreen = 'signup';      // 当前这个框属于注册页还是改名页
var nameBoxKey = '';            // 上一次贴的位置，变了才改样式

function ensureNameEl() {
    if (nameEl) { return nameEl; }
    try {
        if (typeof document === 'undefined' || !document.body || !document.body.appendChild) { return null; }
        var el = document.createElement('input');
        el.type = 'text';
        el.maxLength = NAME_MAX;
        el.setAttribute('autocomplete', 'off');
        el.setAttribute('autocorrect', 'off');
        el.setAttribute('autocapitalize', 'off');
        el.setAttribute('spellcheck', 'false');
        el.setAttribute('inputmode', 'text');
        el.setAttribute('enterkeyhint', 'done');
        el.style.cssText = 'position:fixed;opacity:0;border:0;margin:0;padding:0;' +
            'background:transparent;color:transparent;font-size:16px;z-index:30;' +
            'left:0;top:0;width:1px;height:1px;pointer-events:none;display:none;';
        function take() {
            newName = String(el.value || '').slice(0, NAME_MAX);
        }
        el.addEventListener('input', take);
        el.addEventListener('compositionend', take);   // 中文输入法上屏时再取一次
        el.addEventListener('focus', function () { nameField = nameScreen; });
        el.addEventListener('keydown', function (e) {
            if (e.key === 'Enter') { blurNameEl(); }   // 回车收键盘，不提交
        });
        document.body.appendChild(el);
        nameEl = el;
    } catch (e) { nameEl = null; }
    return nameEl;
}

/* 每帧把输入框贴到画布上名字框的位置（键盘弹出导致画布变矮时也跟着走） */
function placeNameEl(rc, screen) {
    var el = ensureNameEl();
    if (!el || !rc) { return; }
    nameScreen = screen || nameScreen;
    var r = null;
    try {
        if (typeof canvas !== 'undefined' && canvas && canvas.getBoundingClientRect) {
            r = canvas.getBoundingClientRect();
        }
    } catch (e) { r = null; }
    if (!r || !r.width || !r.height) { r = { left: 0, top: 0, width: W, height: H }; }
    var sx = r.width / (W || 1);
    var sy = r.height / (H || 1);
    var left = Math.round(r.left + rc.x * sx);
    var top = Math.round(r.top + rc.y * sy);
    var w = Math.max(28, Math.round(rc.w * sx));
    var h = Math.max(28, Math.round(rc.h * sy));
    el.style.display = 'block';
    el.style.pointerEvents = 'auto';
    var key = left + '/' + top + '/' + w + '/' + h;
    if (key !== nameBoxKey) {
        nameBoxKey = key;
        el.style.left = left + 'px';
        el.style.top = top + 'px';
        el.style.width = w + 'px';
        el.style.height = h + 'px';
    }
}

function hideNameEl() {
    if (!nameEl) { return; }
    nameBoxKey = '';
    try {
        if (typeof document !== 'undefined' && document.activeElement === nameEl) { nameEl.blur(); }
        nameEl.style.display = 'none';
        nameEl.style.pointerEvents = 'none';
    } catch (e) { /* 忽略 */ }
}

function syncNameEl() {
    if (!nameEl) { return; }
    try { nameEl.value = newName || ''; } catch (e) { /* 忽略 */ }
}

function focusNameEl() {
    var el = ensureNameEl();
    if (!el) { return false; }
    try {
        if (el.value !== (newName || '')) { el.value = newName || ''; }
        el.focus();
        if (el.setSelectionRange) {
            var n = (el.value || '').length;
            el.setSelectionRange(n, n);
        }
        return true;
    } catch (e) { return false; }
}

function blurNameEl() {
    if (!nameEl) { return; }
    try {
        if (typeof document !== 'undefined' && document.activeElement === nameEl) { nameEl.blur(); }
    } catch (e) { /* 忽略 */ }
}

/* ---------------------------------------------------------- 相册选头像
   挂一个隐藏的 <input type="file" accept="image/*">，点按钮就调起系统相册。
   选完缩到 112x112 的 JPEG 存进账号记录，几 KB，塞 localStorage 没问题。 */
var photoEl = null;
var photoFor = '';        // 'signup' | 'account'

function ensurePhotoEl() {
    if (photoEl) { return photoEl; }
    try {
        if (typeof document === 'undefined' || !document.body || !document.body.appendChild) { return null; }
        var el = document.createElement('input');
        el.type = 'file';
        el.setAttribute('accept', 'image/*');
        el.style.cssText = 'position:fixed;left:-200px;top:0;width:10px;height:10px;opacity:0;';
        el.addEventListener('change', onPhotoPicked);
        document.body.appendChild(el);
        photoEl = el;
    } catch (e) { photoEl = null; }
    return photoEl;
}

function pickPhoto(forWhat) {
    photoFor = forWhat;
    var el = ensurePhotoEl();
    if (!el) { showToast('这台设备打不开相册'); return; }
    try {
        el.value = '';
        el.click();
    } catch (e) {
        showToast('这台设备打不开相册');
    }
}

function onPhotoPicked(ev) {
    var f = ev && ev.target && ev.target.files ? ev.target.files[0] : null;
    if (!f) { return; }
    if (f.size > 12 * 1024 * 1024) { showToast('这张太大了，换一张'); return; }
    try {
        var url = URL.createObjectURL(f);
        var img = new Image();
        img.onload = function () {
            var d = shrinkPhoto(img);
            try { URL.revokeObjectURL(url); } catch (e2) { /* 忽略 */ }
            if (d) { applyPhoto(d); } else { showToast('这张图读不出来'); }
        };
        img.onerror = function () { showToast('这张图读不出来'); };
        img.src = url;
    } catch (e) {
        showToast('这张图读不出来');
    }
}

/* 居中裁成正方形再缩小，省空间也统一尺寸 */
function shrinkPhoto(img) {
    try {
        var S = 112;
        var c = document.createElement('canvas');
        c.width = S;
        c.height = S;
        var g = c.getContext('2d');
        var iw = img.width || img.naturalWidth || S;
        var ih = img.height || img.naturalHeight || S;
        var k = Math.max(S / iw, S / ih);
        var dw = iw * k;
        var dh = ih * k;
        g.fillStyle = '#FFFFFF';
        g.fillRect(0, 0, S, S);
        g.drawImage(img, (S - dw) / 2, (S - dh) / 2, dw, dh);
        return c.toDataURL('image/jpeg', 0.82);
    } catch (e) { return null; }
}

function applyPhoto(dataUrl) {
    if (photoFor === 'account') {
        var rec = curProfile();
        if (rec) {
            rec.photo = dataUrl;
            saveProfiles();
            showToast('头像换好了');
        }
    } else {
        signPhoto = dataUrl;
    }
}

/* ---------------------------------------------------------- 谁在玩 */
function drawLogin(t) {
    darkBg();
    drawStarsBg(t);
    ui.loginRows = [];
    ui.loginAdd = null;

    var p = loadProfiles();
    var pad = Math.min(20, W * 0.05);
    var headY = LAND ? H * 0.10 : H * 0.078;
    txt('谁来玩', W / 2, headY, Math.min(24, W * 0.062), '#22331C', 'center', 800);
    txt('点自己的名字就进去，每个人的进度分开存', W / 2, headY + 24, 10.5,
        'rgba(58,78,48,0.7)', 'center', 500);

    var colW = Math.min(W - pad * 2, LAND ? W * 0.94 : 430);
    var cx0 = W / 2 - colW / 2;
    var listTop = headY + (LAND ? 42 : 56);
    var footH = Math.min(LAND ? 38 : 44, H * 0.058);
    var listBottom = H - footH - 16;

    var canAdd = p.list.length < MAX_PROFILES;
    var n = p.list.length + (canAdd ? 1 : 0);
    var cols = LAND ? 2 : 1;
    var rows = Math.max(1, Math.ceil(n / cols));
    var gap = 8;
    var cw = (colW - (cols - 1) * gap) / cols;
    var rowH = Math.min((listBottom - listTop - (rows - 1) * 7) / rows, LAND ? 58 : 72);
    var totalH = rows * rowH + (rows - 1) * 7;
    var oy = Math.max(0, (listBottom - listTop - totalH) / 2);

    var lastId = session.id;
    var i;
    for (i = 0; i < p.list.length; i += 1) {
        var rec = p.list[i];
        var x = cx0 + (i % cols) * (cw + gap);
        var y = listTop + oy + Math.floor(i / cols) * (rowH + 7);
        drawLoginRow(x, y, cw, rowH, rec, rec.id === lastId);
        ui.loginRows.push({ x: x, y: y, w: cw, h: rowH, id: rec.id });
    }

    if (canAdd) {
        var ai = p.list.length;
        var ax = cx0 + (ai % cols) * (cw + gap);
        var ay = listTop + oy + Math.floor(ai / cols) * (rowH + 7);
        ctx.fillStyle = 'rgba(255,255,255,0.34)';
        rr(ax, ay, cw, rowH, 12);
        ctx.fill();
        ctx.save();
        ctx.setLineDash([5, 4]);
        ctx.strokeStyle = 'rgba(56,80,44,0.34)';
        ctx.lineWidth = 1.4;
        rr(ax + 0.5, ay + 0.5, cw - 1, rowH - 1, 12);
        ctx.stroke();
        ctx.restore();
        var mr = Math.min(rowH * 0.26, 15);
        ctx.strokeStyle = 'rgba(58,78,48,0.5)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(ax + 12 + mr, ay + rowH / 2, mr, 0, TAU);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(ax + 12 + mr - mr * 0.45, ay + rowH / 2);
        ctx.lineTo(ax + 12 + mr + mr * 0.45, ay + rowH / 2);
        ctx.moveTo(ax + 12 + mr, ay + rowH / 2 - mr * 0.45);
        ctx.lineTo(ax + 12 + mr, ay + rowH / 2 + mr * 0.45);
        ctx.stroke();
        txt('新玩家？点这里', ax + 12 + mr * 2 + 11, ay + rowH / 2 - 6, LAND ? 11.5 : 12.5, '#2A3C22', 'left', 700);
        txt('起个名字，挑张照片当头像', ax + 12 + mr * 2 + 11, ay + rowH / 2 + 10, 9.5,
            'rgba(58,78,48,0.6)', 'left', 500);
        ui.loginAdd = { x: ax, y: ay, w: cw, h: rowH };
    }

    txt('这台设备最多 ' + MAX_PROFILES + ' 个账号，成绩会一起进本机排行',
        W / 2, H - footH - 12, 9, 'rgba(58,78,48,0.5)', 'center', 500);
}

    ctx.fill();
    ctx.strokeStyle = 'rgba(56,80,44,0.16)';
    ctx.lineWidth = 1;
    rr(x + 0.5, y + 0.5, w - 1, h - 1, 12);
    ctx.stroke();

    var ar = Math.min(h * 0.32, LAND ? 15 : 20);

    var ay = y + h / 2;

    // 名字下面挂一个游戏账号

        'rgba(58,78,48,0.55)', 'left', 600);

    // 右侧：一个进入箭头
    var ax2 = x + w - 20;
    ctx.strokeStyle = 'rgba(58,78,48,0.45)';
    ctx.lineWidth = 1.8;
    ctx.beginPath();
    ctx.moveTo(ax2 - 4, y + h / 2 - 5);
    ctx.lineTo(ax2 + 1, y + h / 2);
    ctx.lineTo(ax2 - 4, y + h / 2 + 5);
    ctx.stroke();
}

/* 注册页的头像预览：有照片就画照片，没有就一个虚线框 + 人形图标 */
function drawFacePreview(x, y, r, photo, col) {
    ctx.save();
    ctx.beginPath();
    ctx.arc(x, y, r, 0, TAU);
    ctx.clip();
    ctx.fillStyle = 'rgba(255,255,255,0.86)';
    ctx.fillRect(x - r, y - r, r * 2, r * 2);
    var img = photo ? getPhoto(photo) : null;
    if (img) {
        ctx.drawImage(img, x - r, y - r, r * 2, r * 2);
    } else {
        ctx.strokeStyle = 'rgba(56,80,44,0.3)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(x, y - r * 0.16, r * 0.26, 0, TAU);
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(x, y + r * 0.34, r * 0.46, Math.PI * 1.12, Math.PI * 1.88);
        ctx.stroke();
    }
    ctx.restore();
    ctx.strokeStyle = withA(col, 0.55);
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, TAU);
    ctx.stroke();
}

function drawNameField(rc, field) {
    var on = nameField === field;
    ctx.fillStyle = on ? 'rgba(78,158,42,0.1)' : 'rgba(255,255,255,0.82)';
    rr(rc.x, rc.y, rc.w, rc.h, 9);
    ctx.fill();
    ctx.strokeStyle = on ? 'rgba(78,158,42,0.75)' : 'rgba(56,80,44,0.22)';
    ctx.lineWidth = on ? 1.6 : 1.1;
    rr(rc.x + 0.5, rc.y + 0.5, rc.w - 1, rc.h - 1, 9);
    ctx.stroke();
    var show = newName || '点这里写名字';
    txt(show, rc.x + rc.w / 2, rc.y + rc.h / 2 + 1, rc.h > 34 ? 15 : 13,
        newName ? '#22331C' : 'rgba(58,78,48,0.42)', 'center', 700);
}

function drawMiniBtn(rc, label) {
    ctx.fillStyle = 'rgba(122,90,158,0.14)';

    ctx.fill();

    txt(label, rc.x + rc.w / 2, rc.y + rc.h / 2 + 1, fs2, '#5B4478', 'center', 700);
}

            hint: '循环切换：关 → 内置钢琴 → 本机音乐'
        },
        {

            val: save.sound ? '开' : '关',
            hint: '打击、拾取、升级的提示声'
        }
    ];

    ui.msRows = [];
    for (var i = 0; i < rows.length; i += 1) {

        ui.msRows.push({ x: cx0, y: y, w: colW, h: rowH, act: rw.act });

        ctx.fillStyle = 'rgba(255,255,255,0.72)';
        rr(cx0, y, colW, rowH, 14);
        ctx.fill();
        ctx.strokeStyle = rw.color;
        ctx.globalAlpha = 0.5;
        ctx.lineWidth = 1.4;
        rr(cx0 + 0.5, y + 0.5, colW - 1, rowH - 1, 14);
        ctx.stroke();
        ctx.globalAlpha = 1;

        // 左侧图标圆牌
        ctx.fillStyle = rw.color;
        ctx.globalAlpha = 0.16;
        rr(cx0 + 12, y + rowH / 2 - 15, 30, 30, 9);
        ctx.fill();
        ctx.globalAlpha = 1;
        txt(rw.icon, cx0 + 27, y + rowH / 2, 14, rw.color, 'center', 800);

        txt(rw.name, cx0 + 50, y + rowH * 0.33, 12.5, '#22331C', 'left', 800);
        txt(rw.hint, cx0 + 50, y + rowH * 0.70, 9.6, 'rgba(58,78,48,0.62)', 'left', 500);

        txt(rw.val, cx0 + colW - 44, y + rowH / 2 - 2, 13, rw.color, 'right', 800);
        // 右侧箭头
        var ax = cx0 + colW - 20;
        ctx.strokeStyle = 'rgba(58,78,48,0.45)';
        ctx.lineWidth = 1.8;
        ctx.beginPath();
        ctx.moveTo(ax - 4, y + rowH / 2 - 5);
        ctx.lineTo(ax + 1, y + rowH / 2);
        ctx.lineTo(ax - 4, y + rowH / 2 + 5);
        ctx.stroke();
    }

    var bh = Math.min(46, H * 0.062);
    var by = Math.min(H - bh - 20, y0 + rows.length * (rowH + 12) + 24);
    ui.msBack = { x: W / 2 - Math.min(colW, 240) / 2, y: by, w: Math.min(colW, 240), h: bh };
    neonBtn(ui.msBack, '返回', '#5E7E4E', null, t);
}

/* 通用确认框：中间那个位置放什么由 cfg.paint 决定，确认后才扣钱 */
function drawConfirmBox(cfg, t) {
    ctx.fillStyle = 'rgba(18,30,14,0.46)';
    ctx.fillRect(0, 0, W, H);

    var bw = Math.min(W - 44, LAND ? 400 : 330);
    var hasDesc = !!(cfg.desc && !cfg.stats);
    var bh = Math.min(H * (hasDesc ? 0.50 : 0.42), hasDesc ? 286 : 250);
    var bx = W / 2 - bw / 2;
    var by = H / 2 - bh / 2;
    var cx = bx + bw / 2;

    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,0.28)';
    ctx.shadowBlur = 22;
    ctx.shadowOffsetY = 6;
    ctx.fillStyle = '#FFFDF4';
    rr(bx, by, bw, bh, 20);
    ctx.fill();
    ctx.restore();
    ctx.strokeStyle = 'rgba(56,80,44,0.22)';
    ctx.lineWidth = 1.4;
    rr(bx + 0.5, by + 0.5, bw - 1, bh - 1, 20);
    ctx.stroke();

    // 顶部一条跟它同色的窄条
    ctx.save();
    rr(bx, by, bw, bh, 20);
    ctx.clip();
    ctx.fillStyle = cfg.color;
    ctx.globalAlpha = 0.16;
    ctx.fillRect(bx, by, bw, 44);
    ctx.globalAlpha = 1;
    ctx.restore();

    txt(cfg.title, cx, by + 24, 14.5, '#22331C', 'center', 800);
    cfg.paint(cx, by + 72);
    txt(cfg.name, cx, by + 104, 12.5, deepen(cfg.color, 0.66), 'center', 800);
    txt(cfg.tag, cx, by + 120, 9.6, 'rgba(58,78,48,0.66)', 'center', 500);

    // 中段：给角色放三条属性条（跟角色卡上同一个读法），给装备放两行介绍
    var coinY = by + 146;
    if (cfg.stats) {
        var sbw = Math.min(bw - 56, 216);
        var sbx = cx - sbw / 2;
        var sby = by + 150;
        for (var si = 0; si < cfg.stats.length; si += 1) {
            var sw2 = sbw / 3 - 6;
            var sx3 = sbx + si * (sbw / 3);
            ctx.fillStyle = 'rgba(56,80,44,0.13)';
            rr(sx3, sby, sw2, 4, 2);
            ctx.fill();
            ctx.fillStyle = cfg.stats[si].col;
            rr(sx3, sby, Math.max(3, sw2 * clamp(cfg.stats[si].v, 0, 1)), 4, 2);
            ctx.fill();
        }
        txt(cfg.statsNote || '', cx, sby + 15, 8.4, 'rgba(58,78,48,0.52)', 'center', 500);
        coinY = sby + 26;
    } else if (hasDesc) {
        var dLines = wrapLines(cfg.desc, bw - 44, 9.8, 2);
        var dy0 = by + 142;
        for (var di = 0; di < dLines.length; di += 1) {
            txt(dLines[di], cx, dy0 + di * 13, 9.8, 'rgba(58,78,48,0.78)', 'center', 500);
        }
        coinY = dy0 + dLines.length * 13 + 14;
    }

    if (cfg.price > 0) {
        var after = (save.coins || 0) - cfg.price;
        txt('金币 ' + (save.coins || 0) + '　−　' + cfg.price + '　=　' + after,
            cx, coinY, 11.5, cfg.disabled ? 'rgba(150,90,60,0.75)' : '#8A5E0E', 'center', 700);
    } else {
        txt(cfg.note || '', cx, coinY, 10.5, 'rgba(150,90,60,0.8)', 'center', 600);
    }

    var pw = (bw - 40 - 12) / 2;
    var ph = Math.min(44, bh * 0.19);
    var py = by + bh - ph - 18;
    ui.buyCancel = { x: bx + 20, y: py, w: pw, h: ph };
    ui.buyOk = { x: bx + 20 + pw + 12, y: py, w: pw, h: ph };
    ui.buyOkLocked = !!cfg.disabled;
    neonBtn(ui.buyCancel, '取消', '#5E7E4E', null, t);
    neonBtn(ui.buyOk, cfg.okLabel || '确认购买', cfg.disabled ? '#8C7A62' : '#C25E14', null, t);
}

/* 买猎手 */
function drawBuyAsk(t) {
    if (!buyAsk) { return; }
    var ch = getChar(buyAsk);
    if (!ch) { return; }
    var eggOk = !ch.needEgg || !!(save.eggs && save.eggs[ch.needEgg]);
    var canBuy = eggOk && (save.coins || 0) >= ch.price;
    drawConfirmBox({
        title: canBuy ? '买下这只猎手？' : '这只猎手还带不走',
        color: ch.color, price: ch.price,
        paint: function (x, y) { drawCharShape(ch.id, x, y, 22, t * 1.6, 1, 0, 1); },
        name: ch.name + '　' + ch.tag,
        tag: (ch.range === 'melee' ? '近战' : '远攻') + '　生命 ' + ch.hp,
        stats: [
            { v: ch.hp / 210, col: '#FF5D73' },
            { v: ch.speed / 230, col: '#1E7E96' },
            { v: ch.dmg / 1.42, col: '#C98A18' }
        ],
        statsNote: '生命　移速　伤害',
        disabled: !canBuy,
        note: eggOk ? '金币不够，还差 ' + (ch.price - (save.coins || 0)) : '要先在地里见过那样东西',
        okLabel: canBuy ? '确认购买' : (eggOk ? '金币不足' : '还差一样东西')
    }, t);
}

/* 买装备 */
function drawGearAsk(t) {
    if (!gearAsk) { return; }
    var it = gearOf(gearAsk);
    if (!it) { return; }
    var rar = gearRarity(it);
    var fx = (it.fx && it.fx !== 'none') ? GEAR_FX[it.fx] : null;
    var slName = '';
    for (var q = 0; q < GEAR_SLOTS.length; q += 1) {
        if (GEAR_SLOTS[q].id === it.slot) { slName = GEAR_SLOTS[q].name; }
    }
    drawConfirmBox({
        title: '买下这件' + slName + '？', color: rar.color, price: it.price,
        paint: function (x, y) { drawGearIcon(it, x, y, 26, t); },
        name: it.name,
        tag: rar.name + (fx ? '　· ' + fx.name : '') + '　' + gearModText(it),
        desc: it.desc
    }, t);
}

var recordTab = 0;
var recordPage = 0;

function achDoneCount() {
    var n = 0;
    for (var i = 0; i < ACHIEVEMENTS.length; i += 1) {
        if (save.ach[ACHIEVEMENTS[i].id]) { n += 1; }
    }
    return n;
}

function drawRecords(t) {
    darkBg();
    drawStarsBg(t);

    var pad = Math.min(20, W * 0.05);
    var headY = LAND ? H * 0.085 : H * 0.058;
    txt('任务', W / 2, headY, Math.min(22, W * 0.055), '#22331C', 'center', 800);
    if (recordTab === 3) {
        txt('本轮排行 · 每天 0 点清零重排　还剩 ' + seasonLeftText(),
            W / 2, headY + 22, 10.5, '#8A5E0E', 'center', 600);
    } else {
        txt('任务每天一换，成就按累计算，做完都发金币',
            W / 2, headY + 22, 10.5, 'rgba(58,78,48,0.7)', 'center', 500);
    }

    // 金币余额
    var coinTxt = '金币 ' + (save.coins || 0);
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';
    ctx.font = '700 12px system-ui, sans-serif';
    var cwTxt = ctx.measureText(coinTxt).width;
    ctx.fillStyle = 'rgba(255,255,255,0.78)';
    rr(W - pad - cwTxt - 26, headY - 24, cwTxt + 26, 20, 10);
    ctx.fill();
    ctx.fillStyle = '#E0A21A';
    fillEllipse(W - pad - cwTxt - 15, headY - 14, 4.6, 4.6);
    txt(coinTxt, W - pad - 5, headY - 14, 11.5, '#8A5E0E', 'right', 700);

    var colW = Math.min(W - pad * 2, LAND ? W * 0.92 : 430);
    var cx0 = W / 2 - colW / 2;

    // 四个页签
    var tabY = headY + (LAND ? 36 : 42);
    var tabH = LAND ? 30 : 36;
    var tabGap = 7;
    var names = ['任务', '成就', '特效', '排行'];
    var tabW = (colW - tabGap * (names.length - 1)) / names.length;
    var ready = questReadyCount();
    var i;

    ui.recTabs = [];
    for (i = 0; i < names.length; i += 1) {
        var tx = cx0 + i * (tabW + tabGap);
        ui.recTabs.push({ x: tx, y: tabY, w: tabW, h: tabH, idx: i });
        var on = recordTab === i;
        ctx.fillStyle = on ? '#4E9E2A' : 'rgba(255,255,255,0.62)';
        rr(tx, tabY, tabW, tabH, 9);
        ctx.fill();
        if (!on) {
            ctx.strokeStyle = 'rgba(56,80,44,0.16)';
            ctx.lineWidth = 1.1;
            rr(tx + 0.5, tabY + 0.5, tabW - 1, tabH - 1, 9);
            ctx.stroke();
        }
        txt(names[i], tx + tabW / 2, tabY + tabH / 2, LAND ? 11 : 12,
            on ? '#FFFFFF' : '#2A3C22', 'center', 700);
        if (i === 0 && ready > 0) {
            ctx.fillStyle = '#E5453A';
            ctx.beginPath();
            ctx.arc(tx + tabW - 7, tabY + 7, 3.4, 0, TAU);
            ctx.fill();
        }
    }

    // 列表
    var items = [];
    if (recordTab === 0) {
        ensureQuests();
        for (i = 0; i < save.questList.length; i += 1) {
            var q = questById(save.questList[i]);
            if (q) { items.push({ kind: 'quest', q: q }); }
        }
    } else if (recordTab === 1) {
        for (i = 0; i < ACHIEVEMENTS.length; i += 1) {
            items.push({ kind: 'ach', a: ACHIEVEMENTS[i] });
        }
    } else if (recordTab === 2) {
        for (i = 0; i < FX_IDS.length; i += 1) {
            items.push({ kind: 'fx', f: FX_SKINS[FX_IDS[i]], id: FX_IDS[i] });
        }
    } else {
        var rows2 = rankRows();
        for (i = 0; i < rows2.length; i += 1) {
            items.push({ kind: 'rank', r: rows2[i] });
        }
    }

    var listTop = tabY + tabH + 10;
    var footH = Math.min(LAND ? 40 : 46, H * 0.062);
    var listBottom = H - footH - 20;
    var cols = LAND ? 2 : 1;
    var perPage = LAND ? 4 : 6;
    var pages = Math.max(1, Math.ceil(items.length / perPage));
    if (recordPage >= pages) { recordPage = pages - 1; }
    if (recordPage < 0) { recordPage = 0; }

    var cw = (colW - (cols - 1) * 8) / cols;
    var rows = Math.ceil(Math.min(perPage, items.length) / cols);
    var rowH = Math.min((listBottom - listTop) / Math.max(1, rows) - 7, LAND ? 66 : 70);
    var rowGap = 7;

    // 条目少的时候把列表整体居中，别都堆在顶上
    var totalH = rows * rowH + (rows - 1) * rowGap;
    var offsetY = Math.max(0, (listBottom - listTop - totalH) / 2);

    ui.recRows = [];
    for (i = 0; i < perPage; i += 1) {
        var it = items[recordPage * perPage + i];
        if (!it) { break; }
        var x = cx0 + (i % cols) * (cw + 8);
        var y = listTop + offsetY + Math.floor(i / cols) * (rowH + rowGap);
        drawRecRow(x, y, cw, rowH, it, t);
    }

    // 分页 + 返回
    var by = H - footH - 8;
    var navW = Math.min(LAND ? 74 : 84, colW * 0.22);
    ui.recPrev = { x: cx0, y: by, w: navW, h: footH };
    ui.recNext = { x: cx0 + colW - navW, y: by, w: navW, h: footH };
    neonBtn(ui.recPrev, '← 上页', pages > 1 && recordPage > 0 ? '#5E7E4E' : '#3E4C38', null, t);
    neonBtn(ui.recNext, '下页 →', pages > 1 && recordPage < pages - 1 ? '#5E7E4E' : '#3E4C38', null, t);

    if (pages > 1) {
        txt(recordPage + 1 + ' / ' + pages, W / 2, by + footH / 2, 11, 'rgba(58,78,48,0.62)', 'center', 600);
    } else {
        ui.recBackBtn = null;
    }

    ui.recBack = { x: cx0 + navW + 10, y: by, w: colW - navW * 2 - 20, h: footH };
    neonBtn(ui.recBack, '返回大厅', '#1E7E96', null, t);
}

function drawRecRow(x, y, w, h, it, t) {
    var i;
    var title, sub, ch, chip, chipCol, pct, prog, goal, doneFlag = false, btnTxt = '', btnOn = false;

    if (it.kind === 'quest') {
        var q = it.q;
        var cur = save.questProg[q.id] || 0;
        var claimed = !!save.questClaimed[q.id];
        goal = q.goal;
        prog = Math.min(cur, goal);
        pct = prog / goal;
        title = q.desc;
        sub = prog + ' / ' + goal + '　奖励 ' + q.coin + ' 金'
            + (q.seed ? ' + ' + SEEDS[q.seed].name + '种子×' + (q.seedN || 1) : '')
            + (q.fx ? ' + ' + FX_SKINS[q.fx].name : '');
        ch = '务';
        chipCol = claimed ? '#7A8A70' : (pct >= 1 ? '#E0A21A' : '#4E9E2A');
        doneFlag = pct >= 1;
        btnTxt = claimed ? '已领' : (doneFlag ? '领取' : '进行中');
        btnOn = !claimed && doneFlag;
        chip = q.coin + '';
    } else if (it.kind === 'ach') {
        var a = it.a;
        var agot = !!save.ach[a.id];
        goal = a.goal;
        prog = Math.min(a.get() || 0, goal);
        pct = prog / goal;
        title = a.name;
        sub = a.desc + '　' + prog + ' / ' + goal + '　' + a.coin + ' 金' + (a.fx ? ' + ' + FX_SKINS[a.fx].name : '');
        ch = a.ch;
        chipCol = agot ? (ACH_GRADES[(a.grade || 1) - 1] || ACH_GRADES[0]).c : '#9AA2A8';
        doneFlag = agot;
        btnTxt = agot ? (ACH_GRADES[(a.grade || 1) - 1] || ACH_GRADES[0]).t : '未达成';
        btnOn = false;
    } else if (it.kind === 'rank') {
        var pr = it.r;
        var isMe = pr.id === loadProfiles().cur;
        goal = STAGES.length;
        prog = pr.clears;
        pct = goal ? prog / goal : 0;
        title = pr.name;
        sub = '本轮通关 ' + pr.clears +
            '　星 ' + pr.stars +
            '　击杀 ' + pr.kills +
            '　金币 ' + pr.coins;
        ch = String(pr.pos);
        chipCol = pr.pos === 1 ? '#E0A21A' : (pr.pos === 2 ? '#9AA6B0' : (pr.pos === 3 ? '#C08050' : '#7A8A70'));
        doneFlag = isMe;
        btnTxt = isMe ? '这是我' : (pr.pos === 1 ? '榜首' : '');
        btnOn = false;
    } else {
        var f = it.f;
        var owned = !!save.fx[it.id];
        var cur2 = save.fxCur === it.id;
        goal = 1;
        prog = owned ? 1 : 0;
        pct = prog;
        title = f.name;
        sub = f.desc + (owned ? '' : '　（未解锁）');
        ch = f.ch;
        chipCol = cur2 ? '#E0A21A' : '#7A8A70';
        doneFlag = cur2;
        btnTxt = cur2 ? '已装备' : (owned ? '装备' : '未解锁');
        btnOn = owned && !cur2;
    }

    // 卡片
    var meRow = (it.kind === 'rank' && doneFlag);
    ctx.fillStyle = (doneFlag || meRow) ? 'rgba(255,255,255,0.66)' : 'rgba(255,255,255,0.52)';
    rr(x, y, w, h, 11);
    ctx.fill();
    ctx.strokeStyle = meRow ? 'rgba(78,158,42,0.8)' : (btnOn ? 'rgba(224,162,26,0.75)' : 'rgba(56,80,44,0.14)');
    ctx.lineWidth = (meRow || btnOn) ? 1.6 : 1;
    rr(x + 0.5, y + 0.5, w - 1, h - 1, 11);
    ctx.stroke();

    // 图标
    var icR = Math.min(LAND ? 14 : 16, h * 0.3);
    var icX = x + 12 + icR;
    var icY = y + h / 2;
    ctx.fillStyle = withA(chipCol, 0.18);
    ctx.beginPath();
    ctx.arc(icX, icY, icR, 0, TAU);
    ctx.fill();
    txt(ch, icX, icY, icR * 0.95, deepen(chipCol, 0.82), 'center', 800);

    // 文本区
    var tx = icX + icR + 10;
    var tw = w - (tx - x) - 78;
    ctx.font = '700 ' + (LAND ? 11.5 : 12.5) + 'px system-ui, sans-serif';
    var showTitle = title;
    while (showTitle.length > 2 && ctx.measureText(showTitle).width > tw) {
        showTitle = showTitle.slice(0, -1);
    }
    if (showTitle !== title) { showTitle += '…'; }
    txt(showTitle, tx, y + h * 0.33, LAND ? 11.5 : 12.5, '#22331C', 'left', 700);

    ctx.font = '500 ' + (LAND ? 9 : 9.6) + 'px system-ui, sans-serif';
    var showSub = sub;
    while (showSub.length > 2 && ctx.measureText(showSub).width > w - (tx - x) - 20) {
        showSub = showSub.slice(0, -1);
    }
    if (showSub !== sub) { showSub += '…'; }
    txt(showSub, tx, y + h * 0.6, LAND ? 9 : 9.6, 'rgba(58,78,48,0.66)', 'left', 500);

    // 进度条
    var bx = tx;
    var by = y + h - 12;
    var bw = w - (tx - x) - 20;
    ctx.fillStyle = 'rgba(56,80,44,0.14)';
    rr(bx, by, bw, 4, 2);
    ctx.fill();
    if (pct > 0) {
        ctx.fillStyle = pct >= 1 ? '#4E9E2A' : '#C98A18';
        rr(bx, by, Math.max(3, bw * pct), 4, 2);
        ctx.fill();
    }

    // 右侧状态
    if (it.kind === 'quest' && btnOn) {
        var bW = 54;
        var bH = Math.min(26, h * 0.44);
        var bX = x + w - bW - 10;
        var bY = y + h / 2 - bH / 2;
        ctx.fillStyle = '#E8A81E';
        rr(bX, bY, bW, bH, 7);
        ctx.fill();
        ctx.strokeStyle = '#B8860B';
        ctx.lineWidth = 1.1;
        rr(bX + 0.5, bY + 0.5, bW - 1, bH - 1, 7);
        ctx.stroke();
        txt('领取', bX + bW / 2, bY + bH / 2, Math.min(12, bH * 0.46), '#3A2606', 'center', 800);
        ui.recRows.push({ x: bX, y: bY, w: bW, h: bH, kind: 'claim', id: it.q.id });
        // 整行也可点
        ui.recRows.push({ x: x, y: y, w: w - bW - 14, h: h, kind: 'row', id: it.q.id });
    } else if (it.kind === 'fx' && btnOn) {
        var fW = 52;
        var fH = Math.min(24, h * 0.42);
        var fX = x + w - fW - 10;
        var fY = y + h / 2 - fH / 2;
        ctx.fillStyle = 'rgba(78,158,42,0.18)';
        rr(fX, fY, fW, fH, 7);
        ctx.fill();
        ctx.strokeStyle = 'rgba(78,158,42,0.6)';
        ctx.lineWidth = 1.1;
        rr(fX + 0.5, fY + 0.5, fW - 1, fH - 1, 7);
        ctx.stroke();
        txt('装备', fX + fW / 2, fY + fH / 2, Math.min(11.5, fH * 0.5), '#2C5E12', 'center', 700);
        ui.recRows.push({ x: x, y: y, w: w, h: h, kind: 'equip', id: it.id });
    } else {
        txt(btnTxt, x + w - 12, y + h / 2, LAND ? 9.5 : 10,
            doneFlag ? '#8A5E0E' : 'rgba(90,104,80,0.55)', 'right', 700);
    }
}

/* ============================================================ 商城 */
function drawShop(t) {
    darkBg();
    drawStarsBg(t);

    var pad = Math.min(20, W * 0.05);
    var headY = LAND ? H * 0.09 : H * 0.068;
    txt('商城', W / 2, headY, Math.min(22, W * 0.055), '#22331C', 'center', 800);
    txt('用金币换底子，一局一局攒下来的都算数', W / 2, headY + 24, 11, 'rgba(58,78,48,0.72)', 'center', 500);

    // 余额
    var coinTxt = '金币 ' + (save.coins || 0);
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';
    ctx.font = '700 12px system-ui, sans-serif';
    var cwTxt = ctx.measureText(coinTxt).width;
    ctx.fillStyle = 'rgba(255,255,255,0.8)';
    rr(W - pad - cwTxt - 26, headY - 26, cwTxt + 26, 20, 10);
    ctx.fill();
    ctx.fillStyle = '#E0A21A';
    fillEllipse(W - pad - cwTxt - 15, headY - 16, 4.6, 4.6);
    txt(coinTxt, W - pad - 5, headY - 16, 11.5, '#8A5E0E', 'right', 700);

    var colW = Math.min(W - pad * 2, LAND ? W : 430);
    var cx0 = W / 2 - colW / 2;
    var btmH = LAND ? 52 : Math.min(72, H * 0.1);
    var top = LAND ? headY + 46 : H * 0.145;
    var bottom = H - btmH;
    var gap = LAND ? Math.max(8, W * 0.012) : 9;
    var i;

    /* ---- 页签：强化 / 种子 / 药剂 ---- */
    var tab = shopTab || 'up';
    var tabDefs = [
        { id: 'up', name: '强化', col: '#4E9E2A' },
        { id: 'seed', name: '种子', col: '#C98A18' },
        { id: 'potion', name: '药剂', col: '#1E7E96' }
    ];
    var tabW = Math.min(96, (colW - gap * 2) / 3);
    var tabY = LAND ? headY + 22 : H * 0.115;
    ui.shopTabs = [];
    for (i = 0; i < tabDefs.length; i += 1) {
        var td = tabDefs[i];
        var tx = cx0 + i * (tabW + gap);
        ui.shopTabs.push({ x: tx, y: tabY, w: tabW, h: 30, id: td.id });
        var on = (tab === td.id);
        ctx.fillStyle = on ? td.col : 'rgba(255,255,255,0.55)';
        rr(tx, tabY, tabW, 30, 8);
        ctx.fill();
        if (on) {
            ctx.strokeStyle = 'rgba(255,255,255,0.7)';
            ctx.lineWidth = 1.4;
            rr(tx + 0.5, tabY + 0.5, tabW - 1, 29, 8);
            ctx.stroke();
        }
        txt(td.name, tx + tabW / 2, tabY + 15, 12.5, on ? '#FFFFFF' : 'rgba(58,78,48,0.72)', 'center', 700);
    }
    top = tabY + 38;

    ui.shopCards = [];

    if (tab === 'seed') {
        drawShopSeedPage(t, cx0, colW, top, bottom, gap);
        drawShopBottom(t, cx0, colW, bottom, gap);
        return;
    }
    if (tab === 'potion') {
        drawShopPotionPage(t, cx0, colW, top, bottom, gap);
        drawShopBottom(t, cx0, colW, bottom, gap);
        return;
    }

    var cols = LAND ? 5 : 1;
    var rows = Math.ceil(SHOP_UP_IDS.length / cols);
    var cw = (colW - gap * (cols - 1)) / cols;
    var availH = bottom - top;
    var chh = Math.min((availH - gap * (rows - 1)) / rows, LAND ? 230 : 92);
    top += Math.max(0, (availH - (chh * rows + gap * (rows - 1))) / 2);

    for (i = 0; i < SHOP_UP_IDS.length; i += 1) {
        var id = SHOP_UP_IDS[i];
        var it = SHOP_UP[id];
        var lv = shopLv(id);
        var maxed = lv >= it.max;
        var price = shopPrice(id);
        var canBuy = !maxed && (save.coins || 0) >= price;

        var x = cx0 + (i % cols) * (cw + gap);
        var y = top + Math.floor(i / cols) * (chh + gap);
        ui.shopCards.push({ x: x, y: y, w: cw, h: chh, id: id });

        ctx.fillStyle = 'rgba(255,255,255,0.56)';
        rr(x, y, cw, chh, 12);
        ctx.fill();
        ctx.strokeStyle = maxed ? 'rgba(56,80,44,0.16)' : withA(it.color, 0.45);
        ctx.lineWidth = 1.4;
        rr(x + 0.5, y + 0.5, cw - 1, chh - 1, 12);
        ctx.stroke();

        var icX, icY, tx2, ty2;
        if (LAND) {
            icX = x + cw / 2; icY = y + 40;
            tx2 = cx0;
        } else {
            icX = x + 34; icY = y + chh / 2;
            tx2 = x + 62;
        }

        // 图标
        ctx.fillStyle = withA(it.color, 0.2);
        ctx.beginPath();
        ctx.arc(icX, icY, LAND ? 19 : 20, 0, TAU);
        ctx.fill();
        txt(it.ch, icX, icY, LAND ? 16 : 17, deepen(it.color, 0.72), 'center', 800);

        if (LAND) {
            txt(it.name, x + cw / 2, y + 78, 13.5, '#22331C', 'center', 700);
            // 等级点
            var dotsW = it.max * 10 - 3;
            for (var d = 0; d < it.max; d += 1) {
                ctx.fillStyle = d < lv ? it.color : 'rgba(56,80,44,0.18)';
                rr(x + cw / 2 - dotsW / 2 + d * 10, y + 94, 7, 4.5, 2);
                ctx.fill();
            }
            txt(it.desc(), x + cw / 2, y + 110, 9, 'rgba(58,78,48,0.64)', 'center', 500);
        } else {
            txt(it.name, tx2, y + 26, 14, '#22331C', 'left', 700);
            for (var d2 = 0; d2 < it.max; d2 += 1) {
                ctx.fillStyle = d2 < lv ? it.color : 'rgba(56,80,44,0.18)';
                rr(tx2 + d2 * 10, y + 40, 7, 4.5, 2);
                ctx.fill();
            }
            txt(it.desc(), tx2, y + 60, 9.6, 'rgba(58,78,48,0.64)', 'left', 500);
        }

        // 购买按钮
        var bw2 = LAND ? cw - 26 : 84;
        var bh2 = 30;
        var bx2 = LAND ? x + 13 : x + cw - bw2 - 13;
        var by2 = LAND ? y + chh - bh2 - 12 : y + (chh - bh2) / 2;

        ctx.fillStyle = maxed ? 'rgba(56,80,44,0.12)'
            : (canBuy ? '#E8A81E' : 'rgba(56,80,44,0.14)');
        rr(bx2, by2, bw2, bh2, 8);
        ctx.fill();
        if (!maxed && canBuy) {
            ctx.strokeStyle = '#B8860B';
            ctx.lineWidth = 1.2;
            rr(bx2 + 0.5, by2 + 0.5, bw2 - 1, bh2 - 1, 8);
            ctx.stroke();
        }
        var btnTxt = maxed ? '已满' : (price + ' 金');
        txt(btnTxt, bx2 + bw2 / 2, by2 + bh2 / 2,
            Math.min(13, bh2 * 0.44),
            maxed ? 'rgba(56,80,44,0.5)' : (canBuy ? '#3A2606' : 'rgba(70,80,62,0.62)'),
            'center', 700);
    }

    drawShopBottom(t, cx0, colW, bottom, gap);
}

/* 商城底部：返回大厅 + 解锁猎手 */

        ctx.fillStyle = !unlocked ? 'rgba(90,90,90,0.16)' : (canBuy ? '#E8A81E' : 'rgba(56,80,44,0.14)');
        rr(bx2, by2, bw2, bh2, 8);

        txt(btnTxt, bx2 + bw2 / 2, by2 + bh2 / 2,

            !unlocked ? 'rgba(110,110,110,0.85)' : (canBuy ? '#3A2606' : 'rgba(70,80,62,0.62)'),
            'center', 700);

}
