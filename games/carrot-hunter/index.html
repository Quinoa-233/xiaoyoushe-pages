/* 木栅栏：一段歪歪的木桩 + 两道横杆，田园味最重的一件 */
function drawFence(x, y, th, sc, variant) {
    var i, px, py;
    var w = 62 * sc;
    var n = 4;
    ctx.fillStyle = 'rgba(52,82,42,0.14)';
    ctx.beginPath();
    ctx.ellipse(x, y + 6 * sc, w * 0.56, 6 * sc, 0, 0, TAU);
    ctx.fill();

    // 横杆（先画，柱子压在上面）
    ctx.strokeStyle = '#B08553';
    ctx.lineWidth = 3.4 * sc;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(x - w / 2, y - 15 * sc);
    ctx.lineTo(x + w / 2, y - 17 * sc);
    ctx.moveTo(x - w / 2, y - 6 * sc);
    ctx.lineTo(x + w / 2, y - 8 * sc);
    ctx.stroke();

    // 立柱
    for (i = 0; i < n; i += 1) {
        px = x - w / 2 + i * (w / (n - 1));
        py = y - 20 * sc - (i % 2) * 2 * sc;
        ctx.fillStyle = (i % 2) ? '#C79A63' : '#B98D58';
        rr(px - 2.6 * sc, py, 5.2 * sc, 26 * sc, 2 * sc);
        ctx.fill();
        ctx.strokeStyle = '#8A6438';
        ctx.lineWidth = 1.1;
        ctx.stroke();
        // 顶面高光
        ctx.fillStyle = 'rgba(255,246,214,0.5)';
        ctx.beginPath();
        ctx.ellipse(px, py + 1.6 * sc, 2.4 * sc, 1.2 * sc, 0, 0, TAU);
        ctx.fill();
    }

    // 杆上爬的藤/草
    if (variant) {
        ctx.strokeStyle = '#7BB84A';
        ctx.lineWidth = 1.6;
        ctx.beginPath();
        ctx.moveTo(x - w * 0.34, y - 13 * sc);
        ctx.quadraticCurveTo(x - w * 0.1, y - 22 * sc, x + w * 0.16, y - 14 * sc);
        ctx.stroke();
        ctx.fillStyle = '#8FCF5E';
        ctx.beginPath();
        ctx.ellipse(x - w * 0.12, y - 19 * sc, 3.4 * sc, 2 * sc, -0.5, 0, TAU);
        ctx.ellipse(x + w * 0.08, y - 16 * sc, 3 * sc, 1.8 * sc, 0.4, 0, TAU);
        ctx.fill();
    }
}

/* 稻草垛：黄昏麦田区的专属地标 */
function drawHaystack(x, y, th, sc) {
    var i, w = 46 * sc, h = 36 * sc;
    ctx.fillStyle = 'rgba(96,78,34,0.2)';
    ctx.beginPath();
    ctx.ellipse(x, y + h * 0.32, w * 0.6, h * 0.24, 0, 0, TAU);
    ctx.fill();

    // 垛身：圆顶草垛，不是尖帐篷
    ctx.fillStyle = '#DDB44E';
    ctx.beginPath();
    ctx.moveTo(x - w * 0.5, y + h * 0.3);
    ctx.lineTo(x - w * 0.46, y - h * 0.1);
    ctx.quadraticCurveTo(x - w * 0.4, y - h * 0.62, x, y - h * 0.76);
    ctx.quadraticCurveTo(x + w * 0.4, y - h * 0.62, x + w * 0.46, y - h * 0.1);
    ctx.lineTo(x + w * 0.5, y + h * 0.3);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = '#A8853C';
    ctx.lineWidth = 1.4;
    ctx.stroke();

    // 受光面
    ctx.fillStyle = 'rgba(255,246,198,0.44)';
    ctx.beginPath();
    ctx.moveTo(x - w * 0.44, y + h * 0.24);
    ctx.lineTo(x - w * 0.42, y - h * 0.1);
    ctx.quadraticCurveTo(x - w * 0.34, y - h * 0.54, x - w * 0.02, y - h * 0.66);
    ctx.lineTo(x - w * 0.06, y + h * 0.26);
    ctx.closePath();
    ctx.fill();

    // 麦秆纹
    ctx.strokeStyle = 'rgba(168,133,60,0.6)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (i = 0; i < 5; i += 1) {
        var yy = y + h * 0.22 - i * h * 0.14;
        ctx.moveTo(x - w * (0.46 - i * 0.03), yy);
        ctx.lineTo(x + w * (0.46 - i * 0.03), yy);
    }
    ctx.stroke();

    // 捆绳
    ctx.strokeStyle = 'rgba(140,96,44,0.75)';
    ctx.lineWidth = 2 * sc;
    ctx.beginPath();
    ctx.moveTo(x - w * 0.42, y - h * 0.04);
    ctx.lineTo(x + w * 0.42, y - h * 0.04);
    ctx.stroke();

    // 顶上的穗
    ctx.strokeStyle = '#C9A348';
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    for (i = 0; i < 5; i += 1) {
        var tx = x + (i - 2) * w * 0.13;
        ctx.moveTo(tx, y - h * 0.72);
        ctx.lineTo(tx + (i - 2) * 1.8, y - h * 0.94);
    }
    ctx.stroke();
}

/* 蘑菇圈：林子里最童话的一件，一圈小蘑菇围着淡一圈的草 */
function drawMushRing(x, y, th, sc, h) {
    var i, a, mx, my, ms;
    var R = 30 * sc;
    ctx.fillStyle = 'rgba(246,255,214,0.16)';
    ctx.beginPath();
    ctx.ellipse(x, y, R * 1.05, R * 0.66, 0, 0, TAU);
    ctx.fill();
    ctx.strokeStyle = deepen(th.grid, 0.76);
    ctx.lineWidth = 1.4;
    ctx.globalAlpha = 0.5;
    ctx.beginPath();
    ctx.ellipse(x, y, R * 0.72, R * 0.46, 0, 0, TAU);
    ctx.stroke();
    ctx.globalAlpha = 1;

    var n = 5 + Math.floor(h * 4);
    for (i = 0; i < n; i += 1) {
        a = i / n * TAU + h * 5;
        mx = x + Math.cos(a) * R;
        my = y + Math.sin(a) * R * 0.62;
        ms = (5.5 + hash2(i + 3, 11) * 3.4) * sc;
        // 柄
        ctx.fillStyle = '#F5EEDC';
        rr(mx - ms * 0.24, my - ms * 0.7, ms * 0.48, ms * 0.95, ms * 0.22);
        ctx.fill();
        // 伞
        ctx.fillStyle = (i % 3 === 0) ? '#E2705C' : th.decoA;
        ctx.beginPath();
        ctx.ellipse(mx, my - ms * 0.72, ms * 0.82, ms * 0.62, 0, Math.PI, 0);
        ctx.fill();
        // 白点
        ctx.fillStyle = 'rgba(255,252,244,0.85)';
        ctx.beginPath();
        ctx.arc(mx - ms * 0.3, my - ms * 0.9, ms * 0.14, 0, TAU);
        ctx.arc(mx + ms * 0.28, my - ms * 0.84, ms * 0.11, 0, TAU);
        ctx.fill();
    }
}

/* 深浅草块：大块不规则色斑，让地面不平 */
function drawBlotches(camX, camY, th) {
    var cell = 104;
    var px = camX * 0.62;
    var py = camY * 0.62;
    var x0 = Math.floor(px / cell) - 1;
    var x1 = Math.floor((px + W) / cell) + 1;
    var y0 = Math.floor(py / cell) - 1;
    var y1 = Math.floor((py + H) / cell) + 1;

    ctx.fillStyle = th.g2;
    ctx.globalAlpha = 0.16;
    for (var gy = y0; gy <= y1; gy += 1) {
        for (var gx = x0; gx <= x1; gx += 1) {
            var h = hash2(gx + 31, gy - 17);
            if (h > 0.66) { continue; }
            var cx = gx * cell + hash2(gx + 4, gy + 8) * cell - px;
            var cy = gy * cell + hash2(gx - 6, gy + 3) * cell - py;
            var rx = 9 + h * 13;
            var ry = 6 + hash2(gx + 2, gy - 1) * 9;
            if (h < 0.14) {
                // 泥土 / 干草斑：让地面不只是绿
                ctx.fillStyle = 'rgba(200,172,112,0.26)';
            } else if (h > 0.52) {
                // 深色草块
                ctx.fillStyle = deepen(th.g2, 0.88);
            } else {
                ctx.fillStyle = th.g2;
            }
            ctx.beginPath();
            ctx.ellipse(cx, cy, rx, ry, h * TAU, 0, TAU);
            ctx.fill();
        }
    }
    ctx.globalAlpha = 1;
}

/* 水洼与浅溪：按网格散布，任何位置都能遇到水 */
function drawWater(camX, camY, th, t) {
    var cell = 340;
    var x0 = Math.floor(camX / cell) - 1;
    var x1 = Math.floor((camX + W) / cell) + 1;
    var y0 = Math.floor(camY / cell) - 1;
    var y1 = Math.floor((camY + H) / cell) + 1;
    var gx, gy, h, h2, wx, wy, rx, ry;
    var water = th.water || '#8ED0DC';

    for (var gy = y0; gy <= y1; gy += 1) {
        for (var gx = x0; gx <= x1; gx += 1) {
            // 每格固定一个水洼，只用哈希决定大小与位置，避免整屏都没水
            // 但只让四成格子有水，不然一屏七八个水洼像下雨后的菜地
            if (hash2(gx + 91, gy + 37) > 0.26) { continue; }
            h = hash2(gx * 3 + 7, gy * 5 + 11);
            h2 = hash2(gx * 11 + 3, gy * 7 + 19);
            wx = gx * cell + (0.24 + hash2(gx + 3, gy + 6) * 0.52) * cell - camX;
            wy = gy * cell + (0.24 + hash2(gx + 9, gy + 1) * 0.52) * cell - camY;
            rx = 28 + h * 30;
            ry = rx * (0.6 + h2 * 0.26);
            if (wx < -rx * 1.6 || wx > W + rx * 1.6) { continue; }
            if (wy < -ry * 1.6 || wy > H + ry * 1.6) { continue; }

            // 湿泥岸
            ctx.fillStyle = 'rgba(92,140,96,0.24)';
            ctx.beginPath();
            ctx.ellipse(wx, wy, rx * 1.09, ry * 1.09, 0, 0, TAU);
            ctx.fill();

            // 水面
            ctx.fillStyle = water;
            ctx.beginPath();
            ctx.ellipse(wx, wy, rx, ry, 0, 0, TAU);
            ctx.fill();

            // 浅水边
            ctx.fillStyle = 'rgba(226,250,255,0.3)';
            ctx.beginPath();
            ctx.ellipse(wx, wy + ry * 0.3, rx * 0.62, ry * 0.42, 0, 0, TAU);
            ctx.fill();

            // 水岸线
            ctx.strokeStyle = 'rgba(64,116,84,0.2)';
            ctx.lineWidth = 1.6;
            ctx.beginPath();
            ctx.ellipse(wx, wy, rx, ry, 0, 0, TAU);
            ctx.stroke();

            // 波光
            ctx.strokeStyle = 'rgba(255,255,255,0.7)';
            ctx.lineWidth = 1.8;
            ctx.beginPath();
            var k, off;
            for (k = 0; k < 3; k += 1) {
                off = Math.sin(t * 1.5 + gx + k * 2) * rx * 0.18;
                ctx.moveTo(wx - rx * 0.42 + off, wy - ry * 0.34 + k * ry * 0.32);
                ctx.lineTo(wx + rx * 0.1 + off, wy - ry * 0.34 + k * ry * 0.32);
            }
            ctx.stroke();

            // 岸边水草：让圆边不那么规整
            ctx.strokeStyle = withA(deepen(th.grid, 0.6), 0.6);
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            for (var q = 0; q < 10; q += 1) {
                var qa = hash2(gx * 5 + q, gy * 9 + q * 3) * TAU;
                var qx = wx + Math.cos(qa) * rx * 1.02;
                var qy = wy + Math.sin(qa) * ry * 1.02;
                var qh = 5 + hash2(q, gx + gy) * 7;
                ctx.moveTo(qx, qy);
                ctx.quadraticCurveTo(qx + 1.5, qy - qh * 0.6, qx + 2.6, qy - qh);
            }
            ctx.stroke();
        }
    }
}

/* 草纹：一条路径批量画完，省绘制调用 */
function drawGrassTufts(camX, camY, th) {
    var cell = 50;
    var x0 = Math.floor(camX / cell) - 1;
    var x1 = Math.floor((camX + W) / cell) + 1;
    var y0 = Math.floor(camY / cell) - 1;
    var y1 = Math.floor((camY + H) / cell) + 1;

    ctx.strokeStyle = deepen(th.bush, 0.62);
    ctx.lineWidth = 2.4;
    ctx.globalAlpha = 0.7;
    ctx.beginPath();
    for (var gy = y0; gy <= y1; gy += 1) {
        for (var gx = x0; gx <= x1; gx += 1) {
            var h = hash2(gx + 5, gy + 19);
            // 留白让草成簇，不是满天小刻痕
            if (h > 0.66) { continue; }
            var bx = gx * cell + hash2(gx + 9, gy + 2) * cell - camX;
            var by = gy * cell + hash2(gx - 3, gy + 7) * cell - camY;
            var sway = Math.sin(world.tick * 1.3 + (gx + gy) * 0.7) * 1.6;
            var n = 2 + Math.floor(hash2(gx + 12, gy + 30) * 3);
            var sc = 0.7 + hash2(gx + 21, gy + 8) * 0.95;
            for (var k = 0; k < n; k += 1) {
                var ox = (k - (n - 1) / 2) * 3.5;
                var hh = (4 + h * 9) * sc + (k % 2) * 2;
                var lean = (hash2(gx + k * 13, gy + 3) - 0.5) * 6;
                ctx.moveTo(bx + ox, by);
                ctx.quadraticCurveTo(bx + ox + lean * 0.5 + sway * 0.4, by - hh * 0.62,
                    bx + ox + lean + sway, by - hh);
            }
        }
    }
    ctx.stroke();
    ctx.globalAlpha = 1;
}

/* 小物件铺撒 */
function drawScatter(camX, camY, th) {
    var R = reliefCfg(th);
    var cell = 98;
    var x0 = Math.floor(camX / cell) - 1;
    var x1 = Math.floor((camX + W) / cell) + 1;
    var y0 = Math.floor(camY / cell) - 1;
    var y1 = Math.floor((camY + H) / cell) + 1;

    for (var gy = y0; gy <= y1; gy += 1) {
        for (var gx = x0; gx <= x1; gx += 1) {
            var h = hash2(gx + 13, gy + 5);
            if (h > R.scatter) { continue; }
            var x = gx * cell + (0.12 + hash2(gx + 1, gy + 11) * 0.76) * cell - camX;
            var y = gy * cell + (0.12 + hash2(gx + 7, gy + 3) * 0.76) * cell - camY;
            // 低频分区：花成片、石子成堆，而不是均匀撒满
            var zone = hash2(Math.floor(gx * cell / 640) + 61, Math.floor(gy * cell / 640) + 17);
            var hh = h;
            if (zone > 0.58) { hh = h * 0.72; }
            else if (zone < 0.34) { hh = 0.5 + h * 0.5; }
            drawScatterItem(x, y, th, hh);
        }
    }
}

/* 长草丛：比草纹大、比灌木小，专门填大片空草地 */
function drawTallGrass(camX, camY, th) {
    var R = reliefCfg(th);
    var cell = 132;
    var x0 = Math.floor(camX / cell) - 1;
    var x1 = Math.floor((camX + W) / cell) + 1;
    var y0 = Math.floor(camY / cell) - 1;
    var y1 = Math.floor((camY + H) / cell) + 1;
    var dark = deepen(th.bush, 0.52);
    var lite = withA(deepen(th.bush, 0.86), 0.85);

    for (var gy = y0; gy <= y1; gy += 1) {
        for (var gx = x0; gx <= x1; gx += 1) {
            var h = hash2(gx + 71, gy + 29);
            var gzone = hash2(Math.floor(gx * cell / 760) + 401, Math.floor(gy * cell / 760) + 13);
            if (h > (gzone > 0.56 ? R.grass * 2.4 : R.grass)) { continue; }
            var x = gx * cell + (0.16 + hash2(gx + 33, gy + 51) * 0.7) * cell - camX;
            var y = gy * cell + (0.16 + hash2(gx + 19, gy + 87) * 0.7) * cell - camY;
            var sc = 0.72 + hash2(gx + 7, gy + 61) * 0.85;
            var n = 5 + Math.floor(hash2(gx + 3, gy + 93) * 5);
            var sway = Math.sin(world.tick * 1.05 + (gx + gy) * 0.6) * 1.6;

            // 根部影子
            ctx.fillStyle = 'rgba(44,72,36,0.13)';
            ctx.beginPath();
            ctx.ellipse(x, y + 1.5 * sc, 11 * sc, 3.6 * sc, 0, 0, TAU);
            ctx.fill();

            ctx.lineCap = 'round';
            // 深色底叶
            ctx.strokeStyle = dark;
            ctx.lineWidth = 2.1 * sc;
            ctx.beginPath();
            for (var k = 0; k < n; k += 1) {
                var bx = x + (k - (n - 1) / 2) * 3.1 * sc;
                var bh = (9 + hash2(gx + k * 13, gy + k * 7) * 15) * sc;
                var lean = (hash2(gx + k * 31, gy + 5) - 0.5) * 13 * sc;
                ctx.moveTo(bx, y);
                ctx.quadraticCurveTo(bx + lean * 0.45 + sway * 0.5, y - bh * 0.62,
                    bx + lean + sway, y - bh);
            }
            ctx.stroke();

            // 亮色顶叶（少量，制造体积）
            ctx.strokeStyle = lite;
            ctx.lineWidth = 1.5 * sc;
            ctx.beginPath();
            for (var m = 0; m < 3; m += 1) {
                var mx = x + (hash2(gx + m * 17, gy + 41) - 0.5) * 14 * sc;
                var mh = (11 + hash2(m, gx + gy) * 12) * sc;
                ctx.moveTo(mx, y - 1 * sc);
                ctx.quadraticCurveTo(mx + 2 + sway * 0.5, y - mh * 0.62, mx + 3.5 + sway, y - mh);
            }
            ctx.stroke();

            // 三分之一带花穗
            if (h < 0.16) {
                ctx.fillStyle = th.flower;
                ctx.beginPath();
                for (var f = 0; f < 3; f += 1) {
                    var fx = x + (hash2(gx + f * 23, gy + 13) - 0.5) * 15 * sc;
                    var fy = y - (12 + hash2(f, gx) * 12) * sc;
                    ctx.arc(fx, fy, 1.9 * sc, 0, TAU);
                }
                ctx.fill();
            }
        }
    }
}

/* 单个小物件：按主题换内容 */
function drawScatterItem(x, y, th, h) {
    var s = 5.5 + h * 7;
    var i, a;

    if (th.deco === 'grass') {
        if (h < 0.36) {
            // 小野花
            ctx.fillStyle = th.flower;
            ctx.beginPath();
            for (i = 0; i < 5; i += 1) {
                a = i / 5 * TAU;
                ctx.moveTo(x + Math.cos(a) * s * 0.5, y + Math.sin(a) * s * 0.5);
                ctx.arc(x + Math.cos(a) * s * 0.52, y + Math.sin(a) * s * 0.52, s * 0.42, 0, TAU);
            }
            ctx.fill();
            ctx.fillStyle = '#F2B23C';
            ctx.beginPath();
            ctx.arc(x, y, s * 0.3, 0, TAU);
            ctx.fill();
        } else if (h < 0.58) {
            // 露出土的小胡萝卜
            ctx.fillStyle = '#6FAE3C';
            ctx.beginPath();
            ctx.ellipse(x - s * 0.34, y - s * 0.5, s * 0.26, s * 0.44, -0.4, 0, TAU);
            ctx.ellipse(x + s * 0.34, y - s * 0.5, s * 0.26, s * 0.44, 0.4, 0, TAU);
            ctx.fill();
            ctx.fillStyle = '#F0913C';
            ctx.beginPath();
            ctx.moveTo(x - s * 0.36, y - s * 0.2);
            ctx.lineTo(x + s * 0.36, y - s * 0.2);
            ctx.lineTo(x, y + s * 0.72);
            ctx.closePath();
            ctx.fill();
        } else {
            // 小石子
            ctx.fillStyle = 'rgba(138,148,130,0.46)';
            ctx.beginPath();
            ctx.ellipse(x, y, s * 0.62, s * 0.42, h, 0, TAU);
            ctx.fill();
            ctx.fillStyle = 'rgba(255,255,255,0.35)';
            ctx.beginPath();
            ctx.ellipse(x - s * 0.16, y - s * 0.14, s * 0.24, s * 0.16, h, 0, TAU);
            ctx.fill();
        }
        return;
    }

    if (th.deco === 'dandelion') {
        if (h < 0.4) {
            // 黄蒲公英
            ctx.strokeStyle = '#6FAE3C';
            ctx.lineWidth = 1.6;
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.lineTo(x, y - s * 1.1);
            ctx.stroke();
            ctx.fillStyle = '#F5C63C';
            ctx.beginPath();
            for (i = 0; i < 7; i += 1) {
                a = i / 7 * TAU;
                ctx.moveTo(x + Math.cos(a) * s * 0.34, y - s * 1.1 + Math.sin(a) * s * 0.34);
                ctx.arc(x + Math.cos(a) * s * 0.38, y - s * 1.1 + Math.sin(a) * s * 0.38, s * 0.3, 0, TAU);
            }
            ctx.fill();
        } else if (h < 0.66) {
            // 白绒球
            ctx.strokeStyle = 'rgba(120,170,90,0.7)';
            ctx.lineWidth = 1.4;
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.lineTo(x, y - s * 1.2);
            ctx.stroke();
            ctx.fillStyle = 'rgba(255,255,255,0.9)';
            ctx.beginPath();
            ctx.arc(x, y - s * 1.3, s * 0.46, 0, TAU);
            ctx.fill();
        } else {
            // 三叶草
            ctx.fillStyle = 'rgba(110,180,70,0.65)';
            ctx.beginPath();
            for (i = 0; i < 3; i += 1) {
                a = i / 3 * TAU - Math.PI / 2;
                ctx.moveTo(x, y);
                ctx.ellipse(x + Math.cos(a) * s * 0.36, y + Math.sin(a) * s * 0.36,
                    s * 0.38, s * 0.3, a, 0, TAU);
            }
            ctx.fill();
        }
        return;
    }

    if (th.deco === 'reed') {
        if (h < 0.5) {
            // 芦苇
            ctx.strokeStyle = th.decoA;
            ctx.lineWidth = 1.7;
            ctx.beginPath();
            for (i = 0; i < 3; i += 1) {
                var rx = x + (i - 1) * s * 0.34;
                ctx.moveTo(rx, y);
                ctx.quadraticCurveTo(rx + s * 0.3, y - s * 0.9, rx + s * 0.1, y - s * 1.7);
            }
            ctx.stroke();
            ctx.fillStyle = '#B08A4A';
            ctx.beginPath();
            ctx.ellipse(x + s * 0.1, y - s * 1.7, s * 0.18, s * 0.5, 0, 0, TAU);
            ctx.fill();
        } else {
            // 鹅卵石
            ctx.fillStyle = 'rgba(158,168,158,0.62)';
            ctx.beginPath();
            ctx.ellipse(x, y, s * 0.78, s * 0.5, h * 2, 0, TAU);
            ctx.fill();
            ctx.fillStyle = 'rgba(255,255,255,0.45)';
            ctx.beginPath();
            ctx.ellipse(x - s * 0.2, y - s * 0.16, s * 0.3, s * 0.18, h * 2, 0, TAU);
            ctx.fill();
        }
        return;
    }

    if (th.deco === 'mushroom') {
        if (h < 0.55) {
            // 蘑菇
            ctx.fillStyle = 'rgba(250,244,232,0.95)';
            ctx.fillRect(x - s * 0.16, y - s * 0.5, s * 0.32, s * 0.7);
            ctx.fillStyle = th.decoA;
            ctx.beginPath();
            ctx.ellipse(x, y - s * 0.5, s * 0.62, s * 0.46, 0, Math.PI, 0);
            ctx.fill();
            ctx.fillStyle = 'rgba(255,255,255,0.75)';
            ctx.beginPath();
            ctx.arc(x - s * 0.2, y - s * 0.62, s * 0.11, 0, TAU);
            ctx.arc(x + s * 0.22, y - s * 0.55, s * 0.09, 0, TAU);
            ctx.fill();
        } else {
            // 苔藓石
            ctx.fillStyle = 'rgba(140,150,130,0.55)';
            ctx.beginPath();
            ctx.ellipse(x, y, s * 0.7, s * 0.46, h, 0, TAU);
            ctx.fill();
            ctx.fillStyle = 'rgba(120,190,90,0.55)';
            ctx.beginPath();
            ctx.ellipse(x, y - s * 0.2, s * 0.46, s * 0.26, h, 0, TAU);
            ctx.fill();
        }
        return;
    }

    // wheat 麦穗
    if (h < 0.6) {
        ctx.strokeStyle = th.decoA;
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x + s * 0.2, y - s * 1.5);
        ctx.stroke();
        ctx.fillStyle = th.decoA;
        ctx.beginPath();
        for (i = 0; i < 4; i += 1) {
            var my = y - s * 0.5 - i * s * 0.26;
            ctx.ellipse(x + s * 0.2 - s * 0.22, my, s * 0.2, s * 0.11, -0.5, 0, TAU);
            ctx.ellipse(x + s * 0.2 + s * 0.22, my, s * 0.2, s * 0.11, 0.5, 0, TAU);
        }
        ctx.fill();
    } else {
        ctx.fillStyle = 'rgba(150,160,140,0.45)';
        ctx.beginPath();
        ctx.ellipse(x, y, s * 0.6, s * 0.4, h, 0, TAU);
        ctx.fill();
    }
}

/* 灌木与树：慢视差的大件，撑起画面层次 */
function drawFoliage(camX, camY, th) {
    var R = reliefCfg(th);
    var cell = 268;
    var px = camX * 0.84;
    var py = camY * 0.84;
    var x0 = Math.floor(px / cell) - 1;
    var x1 = Math.floor((px + W) / cell) + 1;
    var y0 = Math.floor(py / cell) - 1;
    var y1 = Math.floor((py + H) / cell) + 1;

    for (var gy = y0; gy <= y1; gy += 1) {
        for (var gx = x0; gx <= x1; gx += 1) {
            var h = hash2(gx + 21, gy + 33);
            // 低频分区：有的地方是密林，有的地方是开阔草场（片区尺度 ~1300px）
            var zone = hash2(Math.floor(gx * cell / 1300) + 301, Math.floor(gy * cell / 1300) + 77);
            // 0.7 是原本的密度基准，配方里的 foliage 直接当倍率用
            var dens = clamp(R.foliage / 0.7, 0.3, 1.9);
            var edge = zone > 0.56 ? Math.min(0.95, 0.92 * dens)
                : (zone < 0.3 ? 0.52 * dens : Math.min(0.95, 0.76 * dens));
            if (h > edge) { continue; }
            var x = gx * cell + (0.16 + hash2(gx + 8, gy + 4) * 0.68) * cell - px;
            var y = gy * cell + (0.16 + hash2(gx + 2, gy + 14) * 0.68) * cell - py;
            if (zone > 0.56 ? (h < 0.5) : (h < 0.3)) { drawTree(x, y, th, h * 5); }
            else { drawBush(x, y, th, h); }
        }
    }
}

function drawTree(x, y, th, hh) {
    var r = 34 + hh * 10;
    ctx.globalAlpha = 0.94;

    // 树影
    ctx.fillStyle = 'rgba(44,72,36,0.2)';
    ctx.beginPath();
    ctx.ellipse(x + r * 0.2, y + r * 0.6, r * 0.86, r * 0.42, 0, 0, TAU);
    ctx.fill();

    // 树干
    ctx.fillStyle = '#8A6438';
    ctx.beginPath();
    ctx.moveTo(x - r * 0.1, y + r * 0.54);
    ctx.lineTo(x + r * 0.1, y + r * 0.54);
    ctx.lineTo(x + r * 0.14, y + r * 0.02);
    ctx.lineTo(x - r * 0.14, y + r * 0.02);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = 'rgba(255,240,210,0.18)';
    ctx.beginPath();
    ctx.moveTo(x - r * 0.1, y + r * 0.54);
    ctx.lineTo(x - r * 0.02, y + r * 0.54);
    ctx.lineTo(x - r * 0.02, y + r * 0.02);
    ctx.lineTo(x - r * 0.14, y + r * 0.02);
    ctx.closePath();
    ctx.fill();

    // 树冠底层：最深，先压出轮廓
    ctx.fillStyle = deepen(th.bush, 0.74);
    ctx.beginPath();
    ctx.arc(x - r * 0.38, y + r * 0.1, r * 0.62, 0, TAU);
    ctx.arc(x + r * 0.38, y + r * 0.06, r * 0.58, 0, TAU);
    ctx.arc(x, y - r * 0.42, r * 0.66, 0, TAU);
    ctx.fill();

    // 树冠中层
    ctx.fillStyle = th.bush;
    ctx.beginPath();
    ctx.arc(x - r * 0.3, y - r * 0.06, r * 0.5, 0, TAU);
    ctx.arc(x + r * 0.3, y - r * 0.1, r * 0.46, 0, TAU);
    ctx.arc(x, y - r * 0.46, r * 0.52, 0, TAU);
    ctx.fill();

    // 顶光
    ctx.fillStyle = 'rgba(255,255,255,0.22)';
    ctx.beginPath();
    ctx.arc(x - r * 0.2, y - r * 0.56, r * 0.26, 0, TAU);
    ctx.arc(x + r * 0.12, y - r * 0.4, r * 0.16, 0, TAU);
    ctx.fill();

    // 果子
    ctx.fillStyle = 'rgba(240,150,90,0.9)';
    ctx.beginPath();
    ctx.arc(x + r * 0.3, y - r * 0.16, r * 0.1, 0, TAU);
    ctx.arc(x - r * 0.46, y + r * 0.16, r * 0.09, 0, TAU);
    ctx.arc(x + r * 0.02, y + r * 0.3, r * 0.075, 0, TAU);
    ctx.fill();

    ctx.globalAlpha = 1;
}

/* 巨石：地图上的视觉锚点，比石堆大一圈，带苔藓 */
function drawBoulder(x, y, th, sc, h) {
    var R = (16 + h * 12) * sc;
    ctx.fillStyle = 'rgba(44,72,36,0.18)';
    ctx.beginPath();
    ctx.ellipse(x + R * 0.16, y + R * 0.62, R * 1.1, R * 0.42, 0, 0, TAU);
    ctx.fill();

    // 主石
    ctx.fillStyle = '#A9A896';
    ctx.beginPath();
    ctx.moveTo(x - R, y + R * 0.3);
    ctx.lineTo(x - R * 0.72, y - R * 0.5);
    ctx.lineTo(x - R * 0.1, y - R * 0.86);
    ctx.lineTo(x + R * 0.62, y - R * 0.5);
    ctx.lineTo(x + R, y + R * 0.22);
    ctx.lineTo(x + R * 0.4, y + R * 0.5);
    ctx.lineTo(x - R * 0.5, y + R * 0.5);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = 'rgba(96,96,80,0.5)';
    ctx.lineWidth = 1.4;
    ctx.stroke();

    // 受光面
    ctx.fillStyle = 'rgba(255,252,236,0.26)';
    ctx.beginPath();
    ctx.moveTo(x - R * 0.68, y - R * 0.42);
    ctx.lineTo(x - R * 0.1, y - R * 0.7);
    ctx.lineTo(x + R * 0.1, y - R * 0.2);
    ctx.lineTo(x - R * 0.5, y + R * 0.02);
    ctx.closePath();
    ctx.fill();

    // 裂缝
    ctx.strokeStyle = 'rgba(96,108,90,0.5)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(x + R * 0.1, y - R * 0.3);
    ctx.lineTo(x + R * 0.24, y + R * 0.1);
    ctx.stroke();

    // 苔藓
    ctx.fillStyle = 'rgba(120,186,92,0.62)';
    ctx.beginPath();
    ctx.ellipse(x + R * 0.34, y + R * 0.26, R * 0.3, R * 0.14, -0.3, 0, TAU);
    ctx.ellipse(x - R * 0.5, y + R * 0.3, R * 0.22, R * 0.11, 0.4, 0, TAU);
    ctx.fill();
}

/* 巨树：一屏最多碰上一棵，用来撑起世界的尺度 */
function drawGiants(camX, camY, th) {
    var R = reliefCfg(th);
    var cell = R.giant || 940;
    if (!cell) { return; }                   // 竹林里没有孤立的巨树
    var px = camX * 0.9;
    var py = camY * 0.9;
    var x0 = Math.floor(px / cell) - 1;
    var x1 = Math.floor((px + W) / cell) + 1;
    var y0 = Math.floor(py / cell) - 1;
    var y1 = Math.floor((py + H) / cell) + 1;

    for (var gy = y0; gy <= y1; gy += 1) {
        for (var gx = x0; gx <= x1; gx += 1) {
            var h = hash2(gx + 617, gy + 233);
            if (h > 0.15) { continue; }
            var x = gx * cell + (0.24 + hash2(gx + 5, gy + 47) * 0.52) * cell - px;
            var y = gy * cell + (0.24 + hash2(gx + 29, gy + 11) * 0.52) * cell - py;
            var r = 54 + hash2(gx + 13, gy + 79) * 26;
            if (x + r * 2 < 0 || x - r * 2 > W || y + r * 2 < 0 || y - r * 2 > H) { continue; }
            drawGiantTree(x, y, th, r, h);
        }
    }
}

function drawGiantTree(x, y, th, r, h) {
    var i, a, cx, cy;
    // 大阴影
    ctx.fillStyle = 'rgba(40,68,32,0.2)';
    ctx.beginPath();
    ctx.ellipse(x + r * 0.26, y + r * 0.7, r * 1.02, r * 0.46, 0, 0, TAU);
    ctx.fill();

    // 粗树干
    ctx.fillStyle = '#8A6438';
    ctx.beginPath();
    ctx.moveTo(x - r * 0.17, y + r * 0.66);
    ctx.lineTo(x + r * 0.17, y + r * 0.66);
    ctx.lineTo(x + r * 0.22, y + r * 0.02);
    ctx.lineTo(x - r * 0.22, y + r * 0.02);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = 'rgba(96,66,38,0.7)';
    ctx.lineWidth = 1.6;
    ctx.stroke();
    // 树皮亮面
    ctx.fillStyle = 'rgba(255,238,205,0.2)';
    ctx.beginPath();
    ctx.moveTo(x - r * 0.17, y + r * 0.66);
    ctx.lineTo(x - r * 0.04, y + r * 0.66);
    ctx.lineTo(x - r * 0.05, y + r * 0.02);
    ctx.lineTo(x - r * 0.22, y + r * 0.02);
    ctx.closePath();
    ctx.fill();
    // 树根
    ctx.fillStyle = '#7C5A34';
    ctx.beginPath();
    ctx.ellipse(x - r * 0.26, y + r * 0.62, r * 0.16, r * 0.07, -0.3, 0, TAU);
    ctx.ellipse(x + r * 0.26, y + r * 0.62, r * 0.16, r * 0.07, 0.3, 0, TAU);
    ctx.fill();

    // 树冠：5 个圆拼出不规则冠形，先深后浅
    ctx.fillStyle = deepen(th.bush, 0.72);
    ctx.beginPath();
    for (i = 0; i < 6; i += 1) {
        a = i / 6 * TAU + h * 3;
        cx = x + Math.cos(a) * r * 0.42;
        cy = y - r * 0.34 + Math.sin(a) * r * 0.3;
        ctx.arc(cx, cy, r * 0.46, 0, TAU);
    }
    ctx.fill();

    ctx.fillStyle = th.bush;
    ctx.beginPath();
    for (i = 0; i < 6; i += 1) {
        a = i / 6 * TAU + h * 3 + 0.3;
        cx = x + Math.cos(a) * r * 0.34;
        cy = y - r * 0.38 + Math.sin(a) * r * 0.24;
        ctx.arc(cx, cy, r * 0.37, 0, TAU);
    }
    ctx.fill();

    // 顶端受光
    ctx.fillStyle = 'rgba(255,255,255,0.2)';
    ctx.beginPath();
    ctx.arc(x - r * 0.26, y - r * 0.66, r * 0.3, 0, TAU);
    ctx.arc(x + r * 0.14, y - r * 0.5, r * 0.18, 0, TAU);
    ctx.fill();

    // 叶簇小点，破掉圆边的机械感
    ctx.fillStyle = withA(deepen(th.bush, 0.86), 0.7);
    ctx.beginPath();
    for (i = 0; i < 14; i += 1) {
        a = hash2(gx2(i, h), gy2(i, h)) * TAU;
        var rr3 = r * (0.5 + hash2(i + 5, 9) * 0.42);
        ctx.arc(x + Math.cos(a) * rr3, y - r * 0.36 + Math.sin(a) * rr3 * 0.7, r * 0.08, 0, TAU);
    }
    ctx.fill();

    // 果子
    ctx.fillStyle = 'rgba(240,150,90,0.85)';
    ctx.beginPath();
    ctx.arc(x + r * 0.34, y - r * 0.44, r * 0.06, 0, TAU);
    ctx.arc(x - r * 0.5, y - r * 0.2, r * 0.055, 0, TAU);
    ctx.arc(x + r * 0.06, y - r * 0.1, r * 0.05, 0, TAU);
    ctx.fill();
}

function gx2(i, h) { return i * 7 + Math.floor(h * 97); }
function gy2(i, h) { return i * 13 + Math.floor(h * 61); }

function drawBush(x, y, th, h) {
    var r = 17 + h * 17;
    ctx.globalAlpha = 0.92;
    ctx.fillStyle = 'rgba(52,82,42,0.16)';
    ctx.beginPath();
    ctx.ellipse(x + r * 0.16, y + r * 0.42, r * 0.8, r * 0.38, 0, 0, TAU);
    ctx.fill();

    ctx.fillStyle = th.bush;
    ctx.beginPath();
    ctx.arc(x - r * 0.42, y + r * 0.1, r * 0.54, 0, TAU);
    ctx.arc(x + r * 0.42, y + r * 0.06, r * 0.5, 0, TAU);
    ctx.arc(x, y - r * 0.24, r * 0.6, 0, TAU);
    ctx.fill();

    ctx.fillStyle = 'rgba(28,56,22,0.26)';
    ctx.beginPath();
    ctx.arc(x, y + r * 0.28, r * 0.42, 0, TAU);
    ctx.fill();

    ctx.fillStyle = 'rgba(255,255,255,0.26)';
    ctx.beginPath();
    ctx.arc(x - r * 0.18, y - r * 0.32, r * 0.28, 0, TAU);
    ctx.fill();

    // 花点
    if (h > 0.34) {
        ctx.fillStyle = th.flower;
        ctx.beginPath();
        ctx.arc(x + r * 0.26, y + r * 0.1, r * 0.13, 0, TAU);
        ctx.arc(x - r * 0.32, y - r * 0.12, r * 0.1, 0, TAU);
        ctx.arc(x + r * 0.04, y - r * 0.38, r * 0.09, 0, TAU);
        ctx.fill();
    }
    ctx.globalAlpha = 1;
}

/* 飘落花瓣 */
function drawFalling(t, th) {
    var n = world.decos.length;
    if (!n) { return; }
    ctx.fillStyle = th.decoA;
    for (var i = 0; i < n; i += 1) {
        var d = world.decos[i];
        var yy = (d.y + t * d.vy / 900) % 1;
        var xx = (d.x + t * d.vx / 900 + Math.sin(t * 0.5 + d.ph) * 0.03) % 1;
        if (xx < 0) { xx += 1; }
        if (yy < 0) { yy += 1; }
        ctx.globalAlpha = 0.12 + 0.2 * Math.abs(Math.sin(t * 1.2 + d.ph));
        ctx.save();
        ctx.translate(xx * W, yy * H);
        ctx.rotate(d.rot + t * d.spin);
        ctx.beginPath();
        ctx.ellipse(0, 0, d.s, d.s * 0.52, 0, 0, TAU);
        ctx.fill();
        ctx.restore();
    }
    ctx.globalAlpha = 1;
}

/* ------------------------------------------------------------ 角色绘制 */
/* 四只小动物都用正面剪影区分：耳朵形状 / 尾巴 / 尖刺，一眼能认出来 */
/* 带描边的椭圆 / 圆：Q 版卡通感全靠这圈线 */
function chEll(x, y, rx, ry, rot) {
    ctx.beginPath();
    ctx.ellipse(x, y, Math.max(0.1, rx), Math.max(0.1, ry), rot || 0, 0, TAU);
    ctx.fill();
    ctx.stroke();
}

function chCircle(x, y, rad) {
    ctx.beginPath();
    ctx.arc(x, y, Math.max(0.1, rad), 0, TAU);
    ctx.fill();
    ctx.stroke();
}

/* 大眼 + 高光：可爱度的关键 */
function chEyes(lx, rx2, ey, er, warm) {
    var hx = er * 0.42, hy = er * 0.5;
    ctx.fillStyle = warm ? '#3B3026' : '#3A3340';
    fillEllipse(lx, ey, er * 0.86, er);
    fillEllipse(rx2, ey, er * 0.86, er);
    ctx.fillStyle = 'rgba(255,255,255,0.95)';
    fillEllipse(lx - hx, ey - hy, er * 0.34, er * 0.34);
    fillEllipse(rx2 - hx, ey - hy, er * 0.34, er * 0.34);
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    fillEllipse(lx + hx * 0.8, ey + hy * 0.9, er * 0.15, er * 0.15);
    fillEllipse(rx2 + hx * 0.8, ey + hy * 0.9, er * 0.15, er * 0.15);
}

/* 微笑的小嘴（两段小弧） */
function chSmile(x, y, w, col) {
    ctx.strokeStyle = col;
    ctx.beginPath();
    ctx.moveTo(x - w, y);
    ctx.quadraticCurveTo(x - w * 0.5, y + w * 0.72, x, y);
    ctx.quadraticCurveTo(x + w * 0.5, y + w * 0.72, x + w, y);
    ctx.stroke();
}

/* 账号头像：玩家从相册传的照片；没传过就退回「名字首字 + 配色」
   size 是外框边长，画在 (x,y) 居中 */
var photoCache = {};

function getPhoto(url) {
    if (!url) { return null; }
    var c = photoCache[url];
    if (c) { return c.ok ? c.img : null; }
    var slot = { ok: false, img: null };
    photoCache[url] = slot;
    try {
        if (typeof Image !== 'function') { return null; }
        var im = new Image();
        im.onload = function () { slot.ok = true; slot.img = im; };
        im.onerror = function () { slot.ok = false; };
        im.src = url;
    } catch (e) { return null; }
    return null;
}

function drawFaceOrLetter(x, y, size, rec) {
    var r = size / 2;
    var col = (rec && rec.col) || '#E8734A';
    var name = (rec && rec.name) || '?';
    var img = rec && rec.photo ? getPhoto(rec.photo) : null;
    var rad = Math.max(3, size * 0.2);

    if (img) {
        var x0 = x - r;
        var y0 = y - r;
        ctx.save();
        ctx.beginPath();
        if (ctx.roundRect) { ctx.roundRect(x0, y0, size, size, rad); }
        else { ctx.rect(x0, y0, size, size); }
        ctx.clip();
        ctx.drawImage(img, x0, y0, size, size);
        ctx.restore();
        ctx.strokeStyle = 'rgba(255,255,255,0.9)';
        ctx.lineWidth = Math.max(1, size * 0.05);
        ctx.beginPath();
        if (ctx.roundRect) { ctx.roundRect(x0 + 0.5, y0 + 0.5, size - 1, size - 1, rad); }
        else { ctx.rect(x0 + 0.5, y0 + 0.5, size - 1, size - 1); }
        ctx.stroke();
        return;
    }

    ctx.fillStyle = withA(col, 0.22);
    ctx.beginPath();
    ctx.arc(x, y, r, 0, TAU);
    ctx.fill();
    ctx.strokeStyle = withA(col, 0.6);
    ctx.lineWidth = Math.max(1, size * 0.05);
    ctx.stroke();
    txt(name.charAt(0), x, y + 1, r * 0.95, deepen(col, 0.72), 'center', 800);
}

/* ------------------------------------------------------------ 穿戴可视化
   把当前角色穿戴的装备直接画到角色身上：
   披风垫在身后（behind），护甲/武器/饰品叠在身前（front）。
   每件装备按自己的名字给「穿在身上的颜色」，武器握在侧手、
   饰品挂胸口或腰间，特效装备还会带元素光点。 */
function wornOf(id) {
    var eq = (save.gearEq && save.gearEq[id]) || {};
    return {
        weapon: gearOf(eq.weapon),
        armor: gearOf(eq.armor),
        trinket: gearOf(eq.trinket)
    };
}

/* 每件装备穿在身上的主色（按名字定色，比品质色更直观） */
var WORN_COLOR = {
    w1: '#A8793E', w2: '#B8C4C8', w3: '#7C9A4E', w4: '#E8E0CE', w5: '#B48CFF',
    w6: '#5E4A3C', w7: '#9FD2E8', w8: '#8FB054', w9: '#9CC26A', w10: '#F0B8C8',
    w11: '#8E8E96', w12: '#8E7CC8', w13: '#F0A8C8', w14: '#E85438', w15: '#A8D8F0',
    m2: '#9A9AA4', m4: '#E86A38',
    a1: '#C9BCA4', a2: '#8FA84E', a3: '#6E7F3E', a4: '#8A6E4A', a5: '#7A5A38',
    a6: '#D8C9A0', a7: '#6E6A66', a8: '#9FB4C4', a9: '#7C9A5A', a10: '#8E8E96',
    a11: '#7E8E4E', a12: '#7E6EC8', a13: '#C98A3E', a14: '#6E6480', m1: '#5E7E3E',
    t1: '#C9A23E', t2: '#A8D8F0', t3: '#C8B088', t4: '#B0C8E8', t5: '#8ED8A8',
    t6: '#E8823E', t7: '#B8E4F0', t8: '#D8C88A', t9: '#E8D05E', t10: '#A89A8E',
    t11: '#B8A8E8', t12: '#F0C8B0', t13: '#9AB85E', t14: '#7E6EC8', t15: '#F0B8D0',
    m3: '#5E8EA8', m5: '#A8D8E8'
};

function wornColor(it) {
    return (it && WORN_COLOR[it.id]) || (it ? gearRarity(it).color : '#CCCCCC');
}

/* 装备描边色（比主色深两档） */
function ink2(col) {
    return deepen(col, 0.45);
}

/* 垫在身后的部分：目前只有斗篷类护甲 */
function drawWornBehind(id, r, t) {
    var it = wornOf(id).armor;
    if (!it) { return; }
    var sh = gearShape(it);
    if (sh !== 'cloak') { return; }
    var col = wornColor(it);
    var sway = Math.sin(t * 2.6) * r * 0.05;

    ctx.save();
    // 从肩后垂到脚边的斗篷主体
    ctx.fillStyle = deepen(col, 0.82);
    ctx.beginPath();
    ctx.moveTo(-r * 0.55, -r * 0.5);
    ctx.quadraticCurveTo(0, -r * 0.68, r * 0.55, -r * 0.5);
    ctx.quadraticCurveTo(r * 0.85 + sway, r * 0.5, r * 0.62 + sway, r * 1.02);
    ctx.quadraticCurveTo(0, r * 1.12, -r * 0.62 + sway, r * 1.02);
    ctx.quadraticCurveTo(-r * 0.85 + sway, r * 0.5, -r * 0.55, -r * 0.5);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = deepen(col, 0.5);
    ctx.lineWidth = Math.max(1, r * 0.055);
    ctx.stroke();
    // 虚影斗篷：边缘再罩一层若隐若现的紫雾
    if (it.id === 'a14') {
        ctx.globalAlpha *= 0.4;
        ctx.fillStyle = '#B0A8E8';
        ctx.beginPath();
        ctx.moveTo(-r * 0.55, -r * 0.5);
        ctx.quadraticCurveTo(0, -r * 0.68, r * 0.55, -r * 0.5);
        ctx.quadraticCurveTo(r * 0.85 + sway, r * 0.5, r * 0.62 + sway, r * 1.02);
        ctx.quadraticCurveTo(0, r * 1.12, -r * 0.62 + sway, r * 1.02);
        ctx.quadraticCurveTo(-r * 0.85 + sway, r * 0.5, -r * 0.55, -r * 0.5);
        ctx.closePath();
        ctx.fill();
        ctx.globalAlpha /= 0.4;
    }
    // 灰烬披风：下摆飘火星
    if (it.id === 'a7') {
        ctx.fillStyle = '#FF9A4E';
        for (var i = 0; i < 4; i += 1) {
            var ex = -r * 0.4 + (i % 2) * r * 0.8;
            var ey = r * 0.4 + Math.floor(i / 2) * r * 0.45 + Math.sin(t * 5 + i) * r * 0.05;
            ctx.globalAlpha *= 0.45 + 0.35 * Math.sin(t * 6 + i * 2);
            fillEllipse(ex, ey, r * 0.06, r * 0.06);
            ctx.globalAlpha /= (0.45 + 0.35 * Math.sin(t * 6 + i * 2));
        }
    }
    ctx.restore();
}

/* 叠在身前：护甲 */
function drawWornArmor(it, r, f, t) {
    var col = wornColor(it);
    var sh = gearShape(it);
    var ink = deepen(col, 0.52);
    var hi = 'rgba(255,255,255,0.55)';

    ctx.save();
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';

    // 斗篷主体已在身后画过，这里只补胸前系带和肩扣
    if (sh === 'cloak') {
        ctx.strokeStyle = ink;
        ctx.lineWidth = Math.max(1.2, r * 0.06);
        ctx.beginPath();
        ctx.moveTo(-r * 0.26, -r * 0.3);
        ctx.quadraticCurveTo(0, r * 0.02, r * 0.26, -r * 0.3);
        ctx.stroke();
        ctx.fillStyle = ink;
        fillEllipse(0, -r * 0.34, r * 0.08, r * 0.08);
        ctx.restore();
        return;
    }
    // 荆棘护腕：两只手腕各一圈，带小刺
    if (sh === 'bracer') {
        for (var bi = 0; bi < 2; bi += 1) {
            ctx.save();
            ctx.translate((bi ? 1 : -1) * f * r * 0.38, r * 0.55);
            ctx.fillStyle = col;
            rr(-r * 0.09, -r * 0.16, r * 0.18, r * 0.3, r * 0.06);
            ctx.fill();
            ctx.strokeStyle = ink;
            ctx.lineWidth = 1;
            rr(-r * 0.09, -r * 0.16, r * 0.18, r * 0.3, r * 0.06);
            ctx.stroke();
            ctx.fillStyle = ink;
            ctx.beginPath();
            ctx.moveTo(-r * 0.04, -r * 0.16);
            ctx.lineTo(0, -r * 0.26);
            ctx.lineTo(r * 0.04, -r * 0.16);
            ctx.closePath();
            ctx.fill();
            ctx.restore();
        }
        ctx.restore();
        return;
    }
    // 引雷铜环：套在腰间的一圈铜环
    if (sh === 'coilring') {

        ctx.lineWidth = Math.max(1, r * 0.045);

}

/* 叠在身前：武器（握在侧手 / 拳套套手 / 长鞭缠手） */
function drawWornWeapon(it, r, f, t) {
    var col = wornColor(it);
    var sh = gearShape(it);
    var fxc = (it.fx && it.fx !== 'none') ? GEAR_FX[it.fx].color : null;

    ctx.save();
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';

    if (sh === 'fist') {
        // 拳套：套在侧手上
        ctx.translate(f * r * 0.36, r * 0.62);
        ctx.fillStyle = col;
        rr(-r * 0.17, -r * 0.15, r * 0.34, r * 0.32, r * 0.1);
        ctx.fill();
        ctx.strokeStyle = deepen(col, 0.5);
        ctx.lineWidth = 1;
        rr(-r * 0.17, -r * 0.15, r * 0.34, r * 0.32, r * 0.1);
        ctx.stroke();
        ctx.fillStyle = 'rgba(255,255,255,0.6)';
        for (var k = 0; k < 3; k += 1) {
            ctx.beginPath();
            ctx.arc(-r * 0.09 + k * r * 0.09, -r * 0.06, r * 0.026, 0, TAU);
            ctx.fill();
        }
        if (fxc) { glowDot(0, -r * 0.2, r * 0.28, fxc, 0.4 + 0.2 * Math.sin(t * 5)); }
        ctx.restore();
        return;
    }
    if (sh === 'whip') {
        // 长鞭：从侧手垂下去甩起来，鞭身缠刺

        ctx.lineWidth = Math.max(2.2, r * 0.1);
        ctx.beginPath();
        ctx.moveTo(f * r * 0.32, r * 0.5);
        ctx.bezierCurveTo(f * r * 0.86, r * 0.86, f * r * 0.4, r * 1.2, f * r * 0.95, r * 0.94);
        ctx.stroke();
        ctx.strokeStyle = 'rgba(255,255,255,0.55)';   // 鞭芯提亮
        ctx.lineWidth = Math.max(1, r * 0.035);
        ctx.beginPath();
        ctx.moveTo(f * r * 0.32, r * 0.5);
        ctx.bezierCurveTo(f * r * 0.86, r * 0.86, f * r * 0.4, r * 1.2, f * r * 0.95, r * 0.94);
        ctx.stroke();
        ctx.fillStyle = ink2(col);                 // 缠刺
        for (var wn = 0; wn < 4; wn += 1) {

            var wx = f * (r * 0.32 + (r * 0.86 - r * 0.32) * wp + Math.sin(wp * 6) * r * 0.16);
            var wy = r * 0.5 + (r * 0.94 - r * 0.5) * wp + Math.cos(wp * 7) * r * 0.1;
            ctx.beginPath();
            ctx.arc(wx, wy, r * 0.045, 0, TAU);
            ctx.fill();

    var s = big ? r * 0.52 : r * 0.4;
    ctx.translate(f * r * 0.68, r * 0.16);
    ctx.rotate(f * 0.42);

    ctx.fillStyle = '#FFE9D6';
    fillEllipse(0, s * 0.5, r * 0.11, r * 0.11);
    ctx.strokeStyle = 'rgba(120,90,70,0.5)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(0, s * 0.5, r * 0.11, 0, TAU);
    ctx.stroke();
    drawGearShape(sh, 0, -s * 0.12, s, col, t);
    // 元素特效光：贴着武器头一闪一闪
    if (fxc) {
        glowDot(0, -s * 1.05, s * 0.5, fxc, 0.38 + 0.22 * Math.sin(t * 5));
        starDot(0, -s * 1.08, s * 0.15, fxc, 0.85);

/* 叠在身前：饰品（挂胸口 / 腰间 / 脚上） */
function drawWornTrinket(it, r, f, t) {
    var col = wornColor(it);
    var sh = gearShape(it);
    var s = r * 0.22;
    var fxc = (it.fx && it.fx !== 'none') ? GEAR_FX[it.fx].color : null;

    ctx.save();
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';

    if (sh === 'pouch' || sh === 'seal') {

            ctx.fill();
            ctx.strokeStyle = deepen(col, 0.5);
            ctx.lineWidth = 1;

            ctx.stroke();

        fillEllipse(-r * 0.32, r * 1.02 + Math.sin(t * 6) * r * 0.03, r * 0.05, r * 0.03);

        ctx.lineWidth = Math.max(1.6, r * 0.05);
        ctx.strokeStyle = col;
        ctx.beginPath(); ctx.arc(0, 0, s * 0.8, 0, TAU); ctx.stroke();
        ctx.fillStyle = 'rgba(200,240,255,0.85)';
        ctx.beginPath(); ctx.arc(0, 0, s * 0.55, 0, TAU); ctx.fill();
        ctx.fillStyle = '#FFFFFF';
        fillEllipse(-s * 0.18, -s * 0.2, s * 0.16, s * 0.16);
    } else {

            ctx.lineWidth = Math.max(1, r * 0.03);
            ctx.beginPath();
            ctx.moveTo(-r * 0.14, -r * 0.18);
            ctx.quadraticCurveTo(0, r * 0.02, r * 0.14, -r * 0.18);
            ctx.stroke();

        ctx.translate(0, r * 0.1);
        ctx.rotate(Math.sin(t * 3.4) * 0.16);
        drawGearShape(sh, 0, s * 0.55, s, col, t);

}

/* 身前穿戴总入口：护甲 → 饰品 → 武器（武器在最上） */
function drawWornFront(id, r, f, t) {
    var w = wornOf(id);
    if (w.armor) { drawWornArmor(w.armor, r, f, t); }
    if (w.trinket) { drawWornTrinket(w.trinket, r, f, t); }
    if (w.weapon) { drawWornWeapon(w.weapon, r, f, t); }

function drawCharShape(id, x, y, r, t, face, hurt, alpha) {
    var ch = getChar(id);    var shape = ch.shape;
    var hurtOn = hurt > 0.4;
    var body = hurtOn ? '#FFDDE2' : ch.color;
    var deepBody = hurtOn ? '#F2AFBB' : ch.glow;
    var line = hurtOn ? '#C4707F' : deepen(ch.glow, 0.68);

    ctx.translate(x, y + bob);

    drawWornBehind(id, r, t);

    if (shape === 'bunny') {

        var earSw = Math.sin(t * 3.1) * 0.07;
        for (i = 0; i < 2; i += 1) {
            sgn = i ? 1 : -1;
            ctx.save();
            ctx.translate(sgn * r * 0.36, -r * 0.8);
            ctx.rotate(sgn * (0.18 + earSw * sgn));
            ctx.fillStyle = body;
            chEll(0, -r * 0.42, r * 0.205, r * 0.52);
            ctx.fillStyle = '#FFC2D2';
            fillEllipse(0, -r * 0.42, r * 0.09, r * 0.36);
            ctx.restore();
        }

        // 身体 + 小脚
        ctx.fillStyle = body;
        chEll(0, r * 0.66, r * 0.52, r * 0.4);
        ctx.fillStyle = '#FFF3F6';
        fillEllipse(-r * 0.25, r * 0.94, r * 0.2, r * 0.13);
        fillEllipse(r * 0.25, r * 0.94, r * 0.2, r * 0.13);

        // 胡萝卜（抱在身前，略斜）
        ctx.save();
        ctx.translate(f * r * 0.06, r * 0.6);
        ctx.rotate(-f * 0.42);
        ctx.fillStyle = '#F49A3E';
        ctx.beginPath();
        ctx.moveTo(-r * 0.17, -r * 0.24);
        ctx.lineTo(r * 0.17, -r * 0.24);
        ctx.quadraticCurveTo(r * 0.1, r * 0.2, 0, r * 0.34);

        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = '#79B845';
        fillEllipse(-r * 0.08, -r * 0.34, r * 0.08, r * 0.16);
        fillEllipse(r * 0.08, -r * 0.34, r * 0.08, r * 0.16);
        ctx.restore();

        // 小手扶胡萝卜
        ctx.fillStyle = body;
        chCircle(-r * 0.34, r * 0.6, r * 0.14);
        chCircle(r * 0.34, r * 0.56, r * 0.14);

        // 头
        ctx.fillStyle = body;
        chEll(0, hy, hr, hr * 0.94);
        // 额前小毛
        ctx.fillStyle = body;
        fillEllipse(-r * 0.1, hy - hr * 0.92, r * 0.1, r * 0.09);
        fillEllipse(r * 0.1, hy - hr * 0.92, r * 0.1, r * 0.09);

        fillEllipse(f * r * 0.06 + r * 0.46, hy + r * 0.2, r * 0.15, r * 0.095);

        // 鼻 + ω

        fillEllipse(f * r * 0.06, hy + r * 0.28, r * 0.062, r * 0.046);

        ctx.lineWidth = lw;

        ctx.save();

        ctx.rotate(-f * 0.68 + wag * f);
        ctx.fillStyle = deepBody;
        chEll(0, 0, r * 0.38, r * 0.66);
        ctx.fillStyle = '#FFF3E6';
        chEll(0, -r * 0.5, r * 0.3, r * 0.26);
        ctx.restore();

        // 尖耳
        for (i = 0; i < 2; i += 1) {

            ctx.translate(sgn * r * 0.42, hy - hr * 0.6);
            ctx.rotate(sgn * 0.16);
            ctx.fillStyle = body;

            ctx.quadraticCurveTo(-r * 0.06, -r * 0.72, r * 0.1, -r * 0.6);
            ctx.quadraticCurveTo(r * 0.24, -r * 0.34, r * 0.26, r * 0.18);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
            ctx.fillStyle = '#5C3324';
            ctx.beginPath();
            ctx.moveTo(-r * 0.13, r * 0.12);
            ctx.quadraticCurveTo(-r * 0.02, -r * 0.46, r * 0.06, -r * 0.4);
            ctx.quadraticCurveTo(r * 0.13, -r * 0.2, r * 0.14, r * 0.12);
            ctx.closePath();
            ctx.fill();
            ctx.restore();
        }

        chEll(0, r * 0.64, r * 0.5, r * 0.4);

        fillEllipse(0, r * 0.74, r * 0.3, r * 0.26);
        ctx.fillStyle = '#5C3324';
        fillEllipse(-r * 0.24, r * 0.94, r * 0.17, r * 0.11);

        // 头
        ctx.fillStyle = body;
        chEll(0, hy, hr, hr * 0.94);

        // 腮红
        ctx.fillStyle = 'rgba(255,138,110,0.42)';

        fillEllipse(f * r * 0.05 + r * 0.5, hy + r * 0.14, r * 0.14, r * 0.09);

        ctx.lineWidth = lw;

        for (i = 0; i < 6; i += 1) {
            var ba = Math.PI * 1.12 + i * 0.34;
            fillEllipse(Math.cos(ba) * r * 0.54, Math.sin(ba) * r * 0.54, r * 0.05, r * 0.05);
        }

        // 小脚
        ctx.fillStyle = '#8A6034';
        fillEllipse(-r * 0.26, r * 0.76, r * 0.16, r * 0.1);
        fillEllipse(r * 0.26, r * 0.76, r * 0.16, r * 0.1);

        // 米色脸
        ctx.fillStyle = '#F7E4C8';
        chEll(f * r * 0.08, r * 0.34, r * 0.54, r * 0.4);

        // 腮红 / 眼 / 鼻
