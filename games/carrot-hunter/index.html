/* ============================================================ 选关 */
var levelMap = -1;          // 选关页当前翻到哪张地图
var shopTab = 'up';         // 商城页签：up 强化 / seed 种子 / potion 药剂

function drawLevelSelect(t) {
    darkBg();
    drawStarsBg(t);
    ui.lvCards = [];

    if (levelMap < 0 || levelMap >= LEVELS.length) {
        levelMap = clamp(STAGES[lobbyLevelIdx()].mapIdx, 0, LEVELS.length - 1);
    }

    var pad = Math.min(20, W * 0.05);
    var headY = LAND ? H * 0.075 : H * 0.055;
    txt('选择区域', W / 2, headY, Math.min(21, W * 0.052), '#22331C', 'center', 800);

    var colW = Math.min(W - pad * 2, LAND ? W * 0.94 : 430);
    var cx0 = W / 2 - colW / 2;
    var map = LEVELS[levelMap];
    var th = THEMES[map.theme];
    var mapOpen = (levelMap === 0) || mapCleared(levelMap - 1);
    var doneN = mapClearedCount(levelMap);

    /* ---- 地图切换条 ---- */
    var barH = LAND ? 38 : 44;
    var barY = headY + (LAND ? 22 : 26);
    var navW = LAND ? 40 : 44;
    ui.mapPrev = { x: cx0, y: barY, w: navW, h: barH };
    ui.mapNext = { x: cx0 + colW - navW, y: barY, w: navW, h: barH };
    ctx.fillStyle = 'rgba(255,255,255,0.72)';
    rr(cx0, barY, colW, barH, barH * 0.32);
    ctx.fill();
    ctx.strokeStyle = withA(th.accent, 0.55);
    ctx.lineWidth = 1.4;
    rr(cx0 + 0.5, barY + 0.5, colW - 1, barH - 1, barH * 0.32);
    ctx.stroke();
    neonBtn(ui.mapPrev, '←', levelMap > 0 ? th.accent : '#8A9585', null, t);
    neonBtn(ui.mapNext, '→', levelMap < LEVELS.length - 1 ? th.accent : '#8A9585', null, t);

    var numS = LAND ? 16 : 18;
    txt('0' + map.id, cx0 + navW + 10, barY + barH / 2, numS, deepen(th.accent, 0.8), 'left', 800);
    txt(map.name, cx0 + navW + 10 + numS * 1.7, barY + barH / 2 - (LAND ? 0 : 6), LAND ? 13 : 14.5,
        mapOpen ? '#22331C' : '#7A8574', 'left', 700);
    if (!LAND) {
        txt(map.sub + '　' + doneN + '/' + STAGE_COUNT + ' 小关', cx0 + navW + 10 + numS * 1.7, barY + barH / 2 + 9,
            9.5, 'rgba(58,78,48,0.62)', 'left', 500);
    }
    if (!mapOpen) {
        var lx0 = cx0 + colW - navW - 20;
        ctx.strokeStyle = 'rgba(56,80,44,0.5)';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(lx0, barY + barH / 2 - 4, 5, Math.PI, 0);
        ctx.stroke();
        ctx.strokeRect(lx0 - 6.5, barY + barH / 2 - 4, 13, 10);
    }

    /* ---- 这张地图的脾气 ---- */
    var featY = barY + barH + (LAND ? 16 : 20);
    var ft = MAP_FEATURE[map.id] || MAP_FEATURE[1];
    ctx.fillStyle = 'rgba(255,255,255,0.44)';
    rr(cx0, featY - 11, colW, 22, 8);
    ctx.fill();
    txt('特色', cx0 + 10, featY, 9, deepen(th.accent, 0.85), 'left', 700);
    var featTxt = ft.name + '：' + ft.desc;
    ctx.font = '500 9.5px system-ui, sans-serif';
    while (featTxt.length > 4 && ctx.measureText(featTxt).width > colW - 52) {
        featTxt = featTxt.slice(0, -1);
    }
    txt(featTxt.slice(0, featTxt.length), cx0 + 40, featY, 9.5, 'rgba(58,78,48,0.78)', 'left', 500);

    /* ---- 四个小关 ---- */
    var footH = Math.min(LAND ? 40 : 44, H * 0.062);
    var listTop = featY + (LAND ? 16 : 20);
    var listBottom = H - footH - 18;
    var cols = LAND ? 4 : 1;
    var rows = Math.ceil(STAGE_COUNT / cols);
    var gap = LAND ? 8 : 8;
    var cw = (colW - gap * (cols - 1)) / cols;
    var availH = listBottom - listTop;
    var chh = Math.min((availH - gap * (rows - 1)) / rows, LAND ? 200 : 86);
    var oy = 0;

    var i;
    for (i = 0; i < STAGE_COUNT; i += 1) {
        var st = STAGES[levelMap * STAGE_COUNT + i];
        var open = mapOpen && stageUnlocked(st.idx);
        var rec = save.cleared[st.id];
        var x = cx0 + (i % cols) * (cw + gap);
        var y = listTop + oy + Math.floor(i / cols) * (chh + gap);
        ui.lvCards.push({ x: x, y: y, w: cw, h: chh, idx: st.idx, locked: !open });

        ctx.fillStyle = open ? 'rgba(255,255,255,0.62)' : 'rgba(255,255,255,0.24)';
        rr(x, y, cw, chh, 11);
        ctx.fill();
        ctx.strokeStyle = open ? withA(th.accent, 0.5) : 'rgba(56,80,44,0.14)';
        ctx.lineWidth = 1.3;
        rr(x + 0.5, y + 0.5, cw - 1, chh - 1, 11);
        ctx.stroke();
        // 今天已通的打个绿勾
        if (rec) {
            ctx.fillStyle = 'rgba(78,158,42,0.12)';
            rr(x, y, cw, chh, 11);
            ctx.fill();
        }

        var bigS = LAND ? 15 : 17;
        txt(map.id + '-' + st.stageNo, x + 12, y + chh * 0.3, bigS,
            open ? deepen(th.accent, 0.85) : 'rgba(56,80,44,0.35)', 'left', 800);
        txt(st.tag, x + 12, y + chh * 0.58, LAND ? 10 : 11,
            open ? '#22331C' : 'rgba(56,80,44,0.45)', 'left', 700);
        txt('时长 ' + fmtTime(st.duration), x + 12, y + chh * 0.84, 9,
            open ? 'rgba(58,78,48,0.55)' : 'rgba(56,80,44,0.3)', 'left', 500);

        // 难度：按 36 关的整体进度给星，满格 5 点
        var stars = clamp(st.stageNo, 1, 5);
        var dx0 = x + cw - 12 - stars * 9;
        for (var d = 0; d < 5; d += 1) {
            ctx.fillStyle = d < stars ? (open ? deepen(th.accent, 0.9) : 'rgba(56,80,44,0.2)')
                : 'rgba(56,80,44,0.14)';
            ctx.beginPath();
            ctx.arc(x + cw - 14 - (4 - d) * 9, y + chh * 0.84, 2.6, 0, TAU);
            ctx.fill();
        }

        // 通关戳 / 未通关
        if (!open) {
            ctx.strokeStyle = 'rgba(56,80,44,0.4)';
            ctx.lineWidth = 1.4;
            var lx = x + cw - 26, ly = y + chh * 0.3;
            ctx.beginPath();
            ctx.arc(lx, ly - 3, 4.4, Math.PI, 0);
            ctx.stroke();
            ctx.strokeRect(lx - 5.6, ly - 3, 11.2, 8.6);
        } else if (rec) {
            txt(rec.rank || 'A', x + cw - 22, y + chh * 0.33, LAND ? 13 : 15, '#E0A62A', 'center', 800);
        } else {
            txt('未通关', x + cw - 30, y + chh * 0.33, 8.5, 'rgba(72,90,62,0.7)', 'center', 600);
        }
    }

    /* ---- 这张图的进度 + 返回 ---- */
    var by = H - footH - 6;
    var need = STAGE_OPEN_NEED;
    var nextMap = LEVELS[levelMap + 1];
    var tipTxt;
    if (!mapOpen) {
        tipTxt = '先拿下「' + LEVELS[levelMap - 1].name + '」的 ' + need + ' 个小关';
    } else if (doneN >= need) {
        tipTxt = nextMap ? ('这张图已拿下，' + nextMap.name + ' 已解锁') : '九张地图全部走完';
    } else {
        tipTxt = '本图已通 ' + doneN + '/' + STAGE_COUNT + '，再通 ' + (need - doneN) +
            ' 关解锁' + (nextMap ? '「' + nextMap.name + '」' : '');
    }
    var boxY = by - (LAND ? 30 : 40);
    if (boxY - listTop - rows * (chh + gap) > -4 || true) {
        ctx.fillStyle = 'rgba(255,255,255,0.42)';
        rr(cx0, boxY - 9, colW, 26, 8);
        ctx.fill();
        txt(tipTxt, W / 2, boxY + 4, 10, doneN >= need ? '#2C5E12' : 'rgba(58,78,48,0.72)', 'center', 600);
    }

    ui.backBtn = { x: cx0, y: by, w: colW, h: footH };
    neonBtn(ui.backBtn, '← 换角色', '#5E7E4E', null, t);
}

/* ============================================================ 升级面板 */
function drawLevelUp(t) {
    // 半透明墨绿遮罩：压住战斗画面但不刷白，卡片才跳得出来
    var mk = ctx.createLinearGradient(0, 0, 0, H);
    mk.addColorStop(0, 'rgba(16,32,14,0.52)');
    mk.addColorStop(0.5, 'rgba(12,26,10,0.58)');
    mk.addColorStop(1, 'rgba(8,20,8,0.7)');
    ctx.fillStyle = mk;
    ctx.fillRect(0, 0, W, H);

    // 顶部再压一层，避免战斗 HUD 的文字透上来抢注意力
    var topMask = ctx.createLinearGradient(0, 0, 0, Math.min(150, H * 0.3));
    topMask.addColorStop(0, 'rgba(10,24,10,0.55)');
    topMask.addColorStop(1, 'rgba(10,24,10,0)');
    ctx.fillStyle = topMask;
    ctx.fillRect(0, 0, W, Math.min(150, H * 0.3));

    var pad = Math.min(18, W * 0.045);
    var cards = ui.cards;
    var n = cards.length;
    var i, id, m, cur, next, accent;
    ui.cardRects = [];

    var rbW = 132, rbH = 34;

    if (LAND) {
        /* ---------------- 横屏：三张竖卡并排 ---------------- */
        var gapL = 12;
        var cwL = Math.min(310, (W - pad * 2 - gapL * (n - 1)) / Math.max(1, n));
        var totL = cwL * n + gapL * (n - 1);
        var sxL = W / 2 - totL / 2;
        var cardHL = clamp(H * 0.52, 156, 216);
        var startYL = H * 0.27;

        txt('等级提升', W / 2, H * 0.115, Math.min(24, W * 0.05), '#FFFFFF', 'center', 800);
        txt('Lv.' + state.level + '　选一张强化', W / 2, H * 0.115 + 25, 11, 'rgba(226,240,214,0.78)', 'center', 500);

        for (i = 0; i < n; i += 1) {
            id = cards[i];
            m = metaOf(id);
            if (!m) { continue; }
            cur = upLv(id);
            next = cur + 1;
            accent = m.def.color || '#8FBF5E';
            var x = sxL + i * (cwL + gapL), y = startYL;
            ui.cardRects.push({ x: x, y: y, w: cwL, h: cardHL });

            ctx.save();
            ctx.shadowColor = 'rgba(6,16,6,0.38)';
            ctx.shadowBlur = 18;
            ctx.shadowOffsetY = 6;
            ctx.fillStyle = 'rgba(255,255,255,0.96)';
            rr(x, y, cwL, cardHL, 16);
            ctx.fill();
            ctx.restore();
            ctx.strokeStyle = accent;
            ctx.globalAlpha = 0.5;
            ctx.lineWidth = 1.4;
            rr(x + 0.5, y + 0.5, cwL - 1, cardHL - 1, 16);
            ctx.stroke();
            ctx.globalAlpha = 1;

            // 顶部色晕
            var tg = ctx.createLinearGradient(x, y, x, y + 96);
            tg.addColorStop(0, accent);
            tg.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.globalAlpha = 0.16;
            ctx.fillStyle = tg;
            rr(x, y, cwL, 96, 16);
            ctx.fill();
            ctx.globalAlpha = 1;

            var mx = x + cwL / 2;
            var yIcon = y + cardHL * 0.22;
            var yName = y + cardHL * 0.42;
            var yDesc = y + cardHL * 0.58;

            ctx.save();
            ctx.translate(mx, yIcon);
            if (m.kind === 'weapon') { drawWeaponIcon(id, 18); } else { drawPassiveIcon(id, 17); }
            ctx.restore();

            txt(m.name, mx, yName, 15, '#22331C', 'center', 700);
            var kindLabel2 = m.kind === 'weapon' ? '武器' : (m.kind === 'endless' ? '无限强化' : '被动');
            txt(kindLabel2, mx, yName + 19, 9, deepen(accent, 0.66), 'center', 600);

            ctx.save();
            if (m.kind === 'endless') {
                wrapText('无限叠加 · 等级 ' + next, x + 16, yDesc, cwL - 32, 10.5, 'rgba(50,70,42,0.74)', 15);
            } else {
                wrapText(m.def.desc(next), x + 16, yDesc, cwL - 32, 10.5, 'rgba(50,70,42,0.74)', 15);
            }
            ctx.restore();

            // 右上等级标
            txt(cur === 0 ? 'NEW' : 'Lv.' + cur + ' → ' + next, x + cwL - 14, y + 20,
                10.5, cur === 0 ? '#4E9E2A' : 'rgba(176,124,20,0.95)', 'right', 700);

            // 底部等级点
            if (m.kind !== 'endless') {
                var dots2 = m.max;
                var dotStart = mx - ((dots2 - 1) * 9) / 2;
                for (var d2 = 0; d2 < dots2; d2 += 1) {
                    ctx.fillStyle = d2 < next ? accent : 'rgba(56,80,44,0.22)';
                    ctx.beginPath();
                    ctx.arc(dotStart + d2 * 9, y + cardHL - 20, 2.4, 0, TAU);
                    ctx.fill();
                }
            }
        }

        ui.rerollBtn = { x: W / 2 - rbW / 2, y: startYL + cardHL + 16, w: rbW, h: rbH };
        var canRL = state.rerolls > 0;
        ctx.fillStyle = canRL ? 'rgba(255,255,255,0.94)' : 'rgba(255,255,255,0.1)';
        rr(ui.rerollBtn.x, ui.rerollBtn.y, rbW, rbH, 17);
        ctx.fill();
        ctx.strokeStyle = canRL ? 'rgba(246,214,140,0.85)' : 'rgba(255,255,255,0.2)';
        ctx.lineWidth = 1.3;
        rr(ui.rerollBtn.x + 0.5, ui.rerollBtn.y + 0.5, rbW - 1, rbH - 1, 17);
        ctx.stroke();
        txt(canRL ? '换一批（剩 ' + state.rerolls + '）' : '换一批（已用完）',
            W / 2, ui.rerollBtn.y + rbH / 2, 11.5,
            canRL ? '#8A5E0E' : 'rgba(226,240,214,0.5)', 'center', 700);
        return;
    }

    /* ---------------- 竖屏：三张横卡纵排 ---------------- */
    var cardH = Math.min(88, H * 0.125);
    var gap = 11;
    var totalH = n * cardH + (n - 1) * gap;
    var startY = H / 2 - totalH / 2 + 20;

    txt('等级提升', W / 2, startY - 66, Math.min(26, W * 0.07), '#FFFFFF', 'center', 800);
    txt('Lv.' + state.level + '　选一张强化', W / 2, startY - 38, 11.5, 'rgba(226,240,214,0.78)', 'center', 500);

    for (i = 0; i < n; i += 1) {
        id = cards[i];
        m = metaOf(id);
        if (!m) { continue; }
        cur = upLv(id);
        next = cur + 1;
        var cw = Math.min(360, W - pad * 2);
        var cx = W / 2 - cw / 2;
        var cy = startY + i * (cardH + gap);
        ui.cardRects.push({ x: cx, y: cy, w: cw, h: cardH });

        accent = m.def.color || '#8FBF5E';
        ctx.save();
        ctx.shadowColor = 'rgba(6,16,6,0.36)';
        ctx.shadowBlur = 16;
        ctx.shadowOffsetY = 5;
        ctx.fillStyle = 'rgba(255,255,255,0.96)';
        rr(cx, cy, cw, cardH, 14);
        ctx.fill();
        ctx.restore();
        ctx.strokeStyle = accent;
        ctx.globalAlpha = 0.5;
        ctx.lineWidth = 1.4;
        rr(cx + 0.5, cy + 0.5, cw - 1, cardH - 1, 14);
        ctx.stroke();
        ctx.globalAlpha = 1;

        ctx.fillStyle = accent;
        rr(cx + 7, cy + 12, 3, cardH - 24, 1.5);
        ctx.fill();

        ctx.save();
        ctx.translate(cx + 46, cy + cardH / 2);
        if (m.kind === 'weapon') { drawWeaponIcon(id, 15); } else { drawPassiveIcon(id, 14); }
        ctx.restore();

        var nameSize = Math.min(16.5, cardH * 0.2);
        txt(m.name, cx + 76, cy + cardH * 0.34, nameSize, '#22331C', 'left', 700);

        var kindLabel = m.kind === 'weapon' ? '武器' : (m.kind === 'endless' ? '无限强化' : '被动');
        var nameW = ctx.measureText(m.name).width;
        txt(kindLabel, cx + 76 + nameW + 9, cy + cardH * 0.34 + 1, 9, deepen(accent, 0.66), 'left', 600);

        ctx.save();
        if (m.kind === 'endless') {
            wrapText('无限叠加 · 等级 ' + next, cx + 76, cy + cardH * 0.62, cw - 150, 10.5, 'rgba(50,70,42,0.74)', 14);
        } else {
            wrapText(m.def.desc(next), cx + 76, cy + cardH * 0.62, cw - 150, 10.5, 'rgba(50,70,42,0.74)', 14);
        }
        ctx.restore();

        txt(cur === 0 ? 'NEW' : 'Lv.' + cur + ' → ' + next,
            cx + cw - 16, cy + cardH * 0.34, cur === 0 ? 10.5 : 11.5,
            cur === 0 ? '#4E9E2A' : 'rgba(176,124,20,0.95)', 'right', 700);

        if (m.kind !== 'endless') {
            var dots = m.max;
            for (var d = 0; d < dots; d += 1) {
                ctx.fillStyle = d < next ? accent : 'rgba(56,80,44,0.22)';
                ctx.beginPath();
                ctx.arc(cx + cw - 20 - (dots - 1 - d) * 9, cy + cardH * 0.68, 2.4, 0, TAU);
                ctx.fill();
            }
        }
    }

    ui.rerollBtn = { x: W / 2 - rbW / 2, y: startY + totalH + 22, w: rbW, h: rbH };
    var canR = state.rerolls > 0;
    ctx.fillStyle = canR ? 'rgba(255,255,255,0.94)' : 'rgba(255,255,255,0.1)';
    rr(ui.rerollBtn.x, ui.rerollBtn.y, rbW, rbH, 17);
    ctx.fill();
    ctx.strokeStyle = canR ? 'rgba(246,214,140,0.85)' : 'rgba(255,255,255,0.2)';
    ctx.lineWidth = 1.3;
    rr(ui.rerollBtn.x + 0.5, ui.rerollBtn.y + 0.5, rbW - 1, rbH - 1, 17);
    ctx.stroke();
    txt(canR ? '换一批（剩 ' + state.rerolls + '）' : '换一批（已用完）',
        W / 2, ui.rerollBtn.y + rbH / 2, 11.5,
        canR ? '#8A5E0E' : 'rgba(226,240,214,0.5)', 'center', 700);
}

function drawPassiveIcon(id, r) {
    var def = PASSIVES[id] || ENDLESS[id] || { ch: '?', color: '#8A8F98' };
    ctx.fillStyle = def.color;
    rr(-r, -r, r * 2, r * 2, r * 0.55);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.92)';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = '800 ' + Math.round(r * 1.2) + 'px system-ui, -apple-system, sans-serif';
    ctx.fillText(def.ch, 0, r * 0.06);
}

/* ============================================================ 结算 */
function drawResult(t, cleared) {
    ui.nextBtn = null;
    ui.homeBtn = null;
    var maskA = cleared ? 0.72 : 0.78;
    ctx.fillStyle = 'rgba(244,250,238,' + maskA + ')';
    ctx.fillRect(0, 0, W, H);

    // 通关庆祝：金色光柱扫过全屏 + 彩带粒子，让「过了」这件事有仪式感
    if (cleared) {
        var sweep = (t - (state.clearAt || 0)) / 1.1;
        if (sweep < 0) { sweep = 0; }
        if (sweep < 1) {
            // 光柱从左到右扫一遍
            var beamX = -W * 0.3 + easeOut(clamp(sweep, 0, 1)) * W * 1.6;
            var lg2 = ctx.createLinearGradient(beamX - W * 0.24, 0, beamX + W * 0.24, 0);
            lg2.addColorStop(0, 'rgba(255,214,102,0)');
            lg2.addColorStop(0.5, 'rgba(255,222,120,0.5)');
            lg2.addColorStop(1, 'rgba(255,214,102,0)');
            ctx.fillStyle = lg2;
            ctx.fillRect(beamX - W * 0.24, 0, W * 0.48, H);
            // 顶部撒彩带：通关后 2 秒内持续飘
            var confN = 26;
            for (var cf = 0; cf < confN; cf += 1) {
                var seedA = hash2(cf + 13, 7);
                var seedB = hash2(cf + 41, 29);
                var cfx = seedA * W + Math.sin(t * 2.2 + cf * 1.7) * 26;
                var cfy = ((seedB * 1.3 + t * (0.22 + seedA * 0.2)) % 1.3 - 0.15) * H;
                var cfCol = ['#FFD166', '#7CBB4A', '#6FC8F0', '#FF8FA8', '#B48CFF'][cf % 5];
                ctx.save();
                ctx.translate(cfx, cfy);
                ctx.rotate(t * 3 + cf);
                ctx.globalAlpha = 0.85;
                ctx.fillStyle = cfCol;
                ctx.fillRect(-3.2, -1.6, 6.4, 3.2);
                ctx.restore();
            }
            ctx.globalAlpha = 1;
        }
    }

    var cw = Math.min(LAND ? 620 : 320, W - 36);
    var o1 = LAND ? 22 : 30;
    var o2 = LAND ? 62 : 78;
    var o3 = LAND ? 94 : 112;
    var o4 = LAND ? 122 : 148;

    /* 中部这些信息「有没有、占几行」每局都不一样（金币 / 掉落装备 / 成就 / 名次 / 无伤）。
       先数出行数再定卡高，行数多了卡片自动长高，不能再用固定间距硬排——之前装备行和
       任务行正好差 2px，直接叠成了一团。 */
    var metaStep = LAND ? 17 : 19;
    var metaLines = 1
        + (state.newGear ? 2 : 0)
        + (((state.newAch && state.newAch.length) || (state.questReady && state.questReady.length)) ? 1 : 0)
        + (loadProfiles().list.length > 1 ? 1 : 0)
        + (state.seasonNew ? 1 : 0)
        + (state.flawless ? 1 : 0);
    var bh = Math.min(46, H * 0.068);
    var linkH = LAND ? 26 : 30;           // 底部「返回大厅」那一条的高度
    var minH = LAND ? H - 44 : Math.min(370, H * 0.52);
    var needH = o4 + (LAND ? 42 : 52) + 24 + metaLines * metaStep + bh + linkH + 22;
    var ch2 = Math.min(Math.max(minH, needH), LAND ? H - 30 : H * 0.78);
    var cx = W / 2 - cw / 2;
    var cy = H / 2 - ch2 / 2;

    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    rr(cx, cy, cw, ch2, 20);
    ctx.fill();
    ctx.strokeStyle = cleared ? 'rgba(78,158,42,0.55)' : 'rgba(168,42,62,0.5)';
    ctx.lineWidth = 1.6;
    rr(cx + 0.5, cy + 0.5, cw - 1, ch2 - 1, 20);
    ctx.stroke();

    if (cleared) {
        var rank = state.rank || { r: 'A', c: '#1E7E96', t: '过关' };
        txt('区域清剿完成', W / 2, cy + o1, 12, 'rgba(36,104,66,0.9)', 'center', 600);
        ctx.save();
        ctx.shadowColor = rank.c;
        ctx.shadowBlur = 20;
        txt(rank.r, W / 2, cy + o2, Math.min(LAND ? 40 : 52, W * 0.13), rank.c, 'center', 800);
        ctx.restore();
        txt(rank.t, W / 2, cy + o3, 11.5, 'rgba(52,72,44,0.7)', 'center', 500);
    } else {
        txt('猎手信号中断', W / 2, cy + o1, 12, 'rgba(168,40,60,0.92)', 'center', 600);
        txt('再试一次', W / 2, cy + o2, Math.min(28, W * 0.075), '#B93A50', 'center', 800);
        txt('坚持到倒计时结束，头目就会出现', W / 2, cy + o3, 11, 'rgba(52,72,44,0.64)', 'center', 500);
    }

    // 数据
    var stats = [
        { k: '用时', v: fmtTime(state.time) },
        { k: '击杀', v: String(state.kills) },
        { k: '得分', v: String(state.score) }
    ];
    var sy = cy + o4;
    for (var i = 0; i < 3; i += 1) {
        var sx = cx + cw / 2 + (i - 1) * (cw / 3.3);
        txt(stats[i].v, sx, sy, Math.min(19, cw * 0.062), '#22331C', 'center', 700);
        txt(stats[i].k, sx, sy + 22, 10, 'rgba(58,78,48,0.64)', 'center', 500);
    }

    // 构筑回顾
    var owned = [];
    for (var w = 0; w < WEAPON_IDS.length; w += 1) {
        if (upLv(WEAPON_IDS[w]) > 0) { owned.push(WEAPON_IDS[w]); }
    }
    var rowY = sy + (LAND ? 42 : 52);
    txt('武器 ' + owned.length + ' 种　·　等级 Lv.' + state.level, W / 2, rowY, 10.5, 'rgba(58,78,48,0.64)', 'center', 500);
    rowY += 15;

    /* 一行一行往下排：每行长度不同，y 由游标推，间距不再写死 */
    function metaRow(str, size, color, weight, dot, step) {
        ctx.font = (weight || 600) + ' ' + Math.round(size) + 'px system-ui, -apple-system, sans-serif';
        var tw = ctx.measureText(str).width;
        if (dot) {
            ctx.fillStyle = dot;
            fillEllipse(W / 2 - tw / 2 - 8, rowY, 3.6, 3.6);
        }
        txt(str, W / 2, rowY, size, color, 'center', weight);
        rowY += step;
    }

    var coinLine = '本局金币 +' + state.gold;
    if (state.goldBonus) { coinLine += '（含通关 ' + state.goldBonus + '）'; }
    metaRow(coinLine, 10.5, '#8A5E0E', 700, '#E0A21A', metaStep);

    if (state.newGear) {
        var gr = gearRarity(state.newGear);
        metaRow('捡到 ' + gr.name + '·' + state.newGear.name, 10.5, deepen(gr.color, 0.62), 700, gr.color, metaStep - 4);
        metaRow('可在「选择猎手 → 装备」里穿上', 9, 'rgba(58,78,48,0.55)', 500, null, metaStep);
    }

    // 本局成就 / 可领的任务
    if (state.newAch && state.newAch.length) {
        metaRow('达成成就 ' + state.newAch.length + ' 项　+' + (state.achCoin || 0) + ' 金', 10, '#8A5E0E', 700, null, metaStep);
    } else if (state.questReady && state.questReady.length) {
        metaRow('有 ' + state.questReady.length + ' 个任务可领，去大厅「任务」拿', 10, 'rgba(58,78,48,0.72)', 600, null, metaStep);
    }

    // 本机名次：多人才有意义（按本轮成绩排，每天 0 点清零）
    var total = loadProfiles().list.length;
    if (total > 1) {
        var myPos = myRankPos();
        metaRow('本轮排行 第 ' + myPos + ' / ' + total + ' 位', 10,
            myPos === 1 ? '#8A5E0E' : 'rgba(58,78,48,0.66)', 700, null, metaStep);
    }
    if (state.seasonNew) {
        metaRow('新一轮排行已开始', 10, '#8A5E0E', 700, null, metaStep);
    }
    if (state.flawless) {
        metaRow('无伤通关', 10, '#2C5E12', 700, null, metaStep);
    }

    // 按钮：主行动两颗并排，下面留一条次级出口「返回大厅」
    var by = cy + ch2 - 22 - linkH - bh;

    if (cleared && state.levelIdx < STAGES.length - 1 && stageUnlocked(state.levelIdx + 1)) {
        var halfW = (cw - 44) / 2;
        ui.retryBtn = { x: cx + 16, y: by, w: halfW, h: bh };
        neonBtn(ui.retryBtn, '再打一次', '#1E7E96', null, t);
        ui.nextBtn = { x: cx + 16 + halfW + 12, y: by, w: halfW, h: bh };
        var ng = ctx.createLinearGradient(0, by, 0, by + bh);
        ng.addColorStop(0, '#4E9E2A');
        ng.addColorStop(1, '#3F8E22');
        ctx.fillStyle = ng;
        rr(ui.nextBtn.x, by, halfW, bh, bh * 0.3);
        ctx.fill();
        ctx.fillStyle = '#062015';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.font = '800 15px system-ui, sans-serif';
        ctx.fillText('下一小关 →', ui.nextBtn.x + halfW / 2, by + bh / 2 + 1);

        // 不想连打、也不想立刻进下一关时，给一条直接回大厅的路
        var hw3 = Math.min(LAND ? 176 : 156, cw * 0.54);
        var hh3 = linkH - 6;
        ui.homeBtn = { x: W / 2 - hw3 / 2, y: by + bh + 9, w: hw3, h: hh3 };
        ctx.fillStyle = 'rgba(78,158,42,0.10)';
        rr(ui.homeBtn.x, ui.homeBtn.y, hw3, hh3, hh3 / 2);
        ctx.fill();
        ctx.strokeStyle = 'rgba(66,138,36,0.46)';
        ctx.lineWidth = 1.2;
        rr(ui.homeBtn.x + 0.6, ui.homeBtn.y + 0.6, hw3 - 1.2, hh3 - 1.2, (hh3 - 1.2) / 2);
        ctx.stroke();
        // 小房子 + 文字作为一个整体居中，别让图标孤零零贴在左边
        var label = '返回大厅';
        ctx.font = '700 12px system-ui, -apple-system, sans-serif';
        var tw3 = ctx.measureText(label).width;
        var grpW = 11 + 6 + tw3;
        var gx = W / 2 - grpW / 2;
        var hy = ui.homeBtn.y + hh3 / 2 + 0.5;
        var icx = gx + 5.5;
        ctx.fillStyle = '#3F7E22';
        ctx.beginPath();
        ctx.moveTo(icx - 5.4, hy + 0.2);
        ctx.lineTo(icx, hy - 4.8);
        ctx.lineTo(icx + 5.4, hy + 0.2);
        ctx.closePath();
        ctx.fill();
        ctx.fillRect(icx - 3.5, hy + 0, 7, 4.6);

/* ============================================================ 暂停 */

    txt('区域：' + state.levelDef.name, W / 2, LAND ? titleY + 20 : H * 0.42 - 30, 11.5, 'rgba(226,240,214,0.72)', 'center', 500);
}

/* ============================================================ 主渲染分发 */
function render() {
    var t = world.tick;
    var mode = state ? state.mode : 'title';

    // 版本方向与设备方向不一致时，提示旋转
    if (needRotate) {
        darkBg();
        ctx.fillStyle = 'rgba(248,253,243,0.72)';
        ctx.fillRect(0, 0, W, H);
        var cxr = W / 2, cyr = H / 2 - 20;
        var tilt = Math.sin(t * 2) * 0.42;
        ctx.save();
        ctx.translate(cxr, cyr);
        ctx.rotate(BUILD_ORIENT === 'land' ? -Math.PI / 2 + tilt : tilt);
        ctx.strokeStyle = 'rgba(78,158,42,0.9)';
        ctx.lineWidth = 3;
        rr(-20, -34, 40, 68, 8);
        ctx.stroke();
        ctx.fillStyle = 'rgba(78,158,42,0.18)';
        rr(-16, -30, 32, 58, 5);
        ctx.fill();
        ctx.fillStyle = 'rgba(78,158,42,0.9)';
        ctx.beginPath();
        ctx.arc(0, 28, 2.6, 0, TAU);
        ctx.fill();
        ctx.restore();

        txt(BUILD_ORIENT === 'land' ? '请把手机横过来' : '请竖握手机', W / 2, H / 2 + 78, 17, '#22331C', 'center', 700);
        txt(BUILD_ORIENT === 'land' ? '这是横屏版本，横过来体验更好' : '这是竖屏版本，竖过来体验更好',
            W / 2, H / 2 + 104, 11, 'rgba(58,78,48,0.6)', 'center', 500);
        return;
    }

    // 只有注册页 / 改名页才贴出隐形输入框，别的页面一律收掉
    if (mode !== 'signup' && mode !== 'rename') { hideNameEl(); }

    if (mode === 'title') { drawTitle(t); return; }
    if (mode === 'guide') { drawGuide(t); return; }
    if (mode === 'treasure') {
        drawTreasure(t);
        drawTreasureHud(t);
        drawJoystick();
        if (state.mode === 'paused') { drawPaused(t); }
        return;
    }
    if (mode === 'treasuredone') { drawTreasureDone(t); return; }
    if (mode === 'home') {
        if (state.homePanel) { drawHomeBuildPanel(t); }
        else {
            drawHome(t);
            drawJoystick();
        }
        if (state.mode === 'paused') { drawPaused(t); }
        return;
    }
    if (mode === 'char') { drawCharSelect(t); drawBuyAsk(t); return; }
    if (mode === 'gear') { drawGear(t); return; }
    if (mode === 'gearlist') { drawGearList(t); drawGearAsk(t); return; }
    if (mode === 'level') { drawLevelSelect(t); return; }
    if (mode === 'shop') { drawShop(t); return; }
    if (mode === 'records') { drawRecords(t); return; }
    if (mode === 'musicset') { drawMusicSet(t); return; }
    if (mode === 'login') { drawLogin(t); return; }
    if (mode === 'signup') { drawSignup(t); return; }
    if (mode === 'account') { drawAccount(t); return; }
    if (mode === 'rename') { drawRename(t); return; }

    // ---- 以下都是局内
    var shakeX = 0, shakeY = 0;
    if (state.shake > 0) {
        shakeX = rand(-1, 1) * 12 * state.shake;
        shakeY = rand(-1, 1) * 12 * state.shake;
    }

    ctx.save();
    ctx.translate(-state.cam.x + shakeX, -state.cam.y + shakeY);
    drawBackground(state.cam.x, state.cam.y);
    drawQuakes();
    drawGimmickGround(t);
    drawMines();
    drawHoles();
    drawChests();
    drawRelics();
    drawShard();
    drawGems();
    drawCoins();
    drawPickups();
    drawEffects();

    var list = state.enemies.slice().sort(function (a, b) { return a.y - b.y; });
    for (var i = 0; i < list.length; i += 1) { drawEnemy(list[i]); }

    drawPlayer();
    drawOrbs();
    drawDrones();
    drawBullets();
    drawEnemyBullets();
    drawParticles();
    drawTexts();
    ctx.restore();

    // 地图环境光（竹林压暗 / 月夜压暗 / 风线）
    drawGimmickOverlay(t);

    // 受伤红光
    if (state.hurtVig > 0) {
        var vg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.25, W / 2, H / 2, Math.max(W, H) * 0.72);
        vg.addColorStop(0, 'rgba(255,40,70,0)');
        vg.addColorStop(1, 'rgba(255,40,70,' + (state.hurtVig * 0.55) + ')');
        ctx.fillStyle = vg;
        ctx.fillRect(0, 0, W, H);
    }

    if (state.flash > 0) {
        ctx.fillStyle = 'rgba(255,255,255,' + Math.min(0.35, state.flash * 0.3) + ')';
        ctx.fillRect(0, 0, W, H);
    }

    drawHUD();
    drawJoystick();

    // 关卡开场提示
    if (state.tipTimer > 0 && state.mode === 'playing') {
        var a = Math.min(1, state.tipTimer / 1.2);
        ctx.globalAlpha = a * 0.9;
        var ldef = state.levelDef;
        var feat = ldef.feature || { name: '', desc: '' };
        txt(ldef.mapId + '-' + ldef.stageNo + '　' + ldef.name, W / 2, H * 0.235, Math.min(23, W * 0.063), '#22331C', 'center', 800);
        txt(feat.name + '：' + feat.desc, W / 2, H * 0.235 + 25, 11, '#2E5A1E', 'center', 700);
        txt(ldef.tip, W / 2, H * 0.235 + 44, 10, 'rgba(46,66,38,0.82)', 'center', 500);
        ctx.globalAlpha = 1;
    }

    // 提示条
    if (state.toastT > 0 && state.toast) {
        var ta = Math.min(1, state.toastT / 0.4);
        ctx.globalAlpha = ta;
        var tw = Math.min(240, W - 80);
        ctx.fillStyle = 'rgba(255,255,255,0.92)';
        rr(W / 2 - tw / 2, H * 0.2, tw, 34, 17);
        ctx.fill();
        ctx.strokeStyle = deepen(state.toast.color, 0.8);
        ctx.lineWidth = 1.2;
        rr(W / 2 - tw / 2 + 0.5, H * 0.2 + 0.5, tw - 1, 33, 17);
        ctx.stroke();
        txt(state.toast.text, W / 2, H * 0.2 + 17, 12.5, deepen(state.toast.color, 0.72), 'center', 700);
        ctx.globalAlpha = 1;
    }

    if (state.mode === 'levelup') { drawLevelUp(t); }
    else if (state.mode === 'paused') { drawPaused(t); }
    else if (state.mode === 'clear') { drawResult(t, true); }
    else if (state.mode === 'dead') { drawResult(t, false); }
}

/* ============================================================
   星屑猎手 · main — 主循环 / 输入分发 / 启动
   ============================================================ */

var guidePage = 0;

function hitRect(r, x, y) {
    return !!r && x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h;
}

function touchStartAudio() {
    /* 音频只是点缀：任何一步失败都不能连累点击分发，
       否则一次异常就会让整个界面「点了没反应」。 */
    try { if (save.sound) { audio.ok(); } } catch (e) { /* 忽略 */ }
    try { if (save.music) { mAC(); } } catch (e) { /* 忽略 */ }
}

/* 音乐三态循环：关 → 内置抒情钢琴 → 本机音乐（弹文件选择框） */
function musicCycle() {
    if (!save.music) {
        save.music = true;
        save.musicMode = 'synth';
        writeSave();
        mAC();
        music.cur = '';
        musicSync();
        return;
    }
    if (save.musicMode === 'synth') {
        save.musicMode = 'local';
        writeSave();
        musicPickLocal();
        return;
    }
    save.music = false;
    writeSave();
    musicStop();
    musicLocalStop();
}

/* 买角色：够钱就直接扣，锁着且条件不足就只出声 */
function buyChar(ch) {
    if (!ch) { return false; }
    if (charUnlocked(ch)) {
        save.char = ch.id;
        writeSave();
        audio.pick();
        return true;
    }
    if (ch.needEgg && !(save.eggs && save.eggs[ch.needEgg])) {
        audio.hurt();
        return false;
    }
    if ((save.coins || 0) < ch.price) {
        audio.hurt();
        return false;
    }
    save.coins -= ch.price;
    if (!save.chars) { save.chars = {}; }
    save.chars[ch.id] = 1;
    save.char = ch.id;
    writeSave();
    audio.level();
    return true;
}

/* 点角色卡：已解锁的直接用；要花钱的先弹确认框，确认了才扣 */
function askBuyChar(id) {
    var ch = getChar(id);
    if (!ch) { return false; }
    if (charUnlocked(ch)) {                       // 已经是你的人，直接换上
        return buyChar(ch);
    }
    // 带锁的一律弹框：就算买不起，也能在框里读到这只猎手的介绍
    buyAsk = ch.id;
    audio.ui();
    return false;
}

/* 买永久强化 */
function buyShopUp(id) {
    var it = SHOP_UP[id];
    if (!it || shopLv(id) >= it.max) { audio.ui(); return false; }
    var price = shopPrice(id);
    if ((save.coins || 0) < price) { audio.hurt(); return false; }
    save.coins -= price;
    if (!save.shop) { save.shop = {}; }
    save.shop[id] = shopLv(id) + 1;
    writeSave();
    audio.level();
    return true;
}

/* 换人 / 新建之后，按新档重新校准一遍：角色回退、每日任务、成就补算 */
function refreshProfileUi() {
    if (!charUnlocked(getChar(save.char))) { save.char = 'bunny'; writeSave(); }
    ensureQuests();
    touchSeason();
    if (checkAchievements().length) { writeSave(); }
    if (state) {
        state.toast = null;
        state.toastT = 0;
        state.achCoin = 0;
        state.newAch = [];
        state.questReady = [];
    }
}

/* 打开注册页 */
function openSignup() {
    newName = suggestName();
    newCol = suggestCol();
    signPhoto = '';
    nameField = '';
    if (state) { state.mode = 'signup'; }
}

/* 打开改名页 */
function openRename() {
    var rec = curProfile();
    if (!rec) { return; }
    newName = rec.name;
    newCol = rec.col;
    nameField = '';
    if (state) { state.mode = 'rename'; }
}

/* 注册：名字不能空、不能重名，填好就进大厅 */
function submitSignup() {
    blurNameEl();
    var name = (newName || '').replace(/\s+/g, '');
    if (!name) { name = suggestName(); }
    var p = loadProfiles();
    var i;
    for (i = 0; i < p.list.length; i += 1) {
        if (p.list[i].name === name) {
            showToast('「' + name + '」有人用了，换个名字');
            audio.hurt();
            return;
        }
    }
    var id = createProfile(name, newCol, signPhoto);
    if (!id) {
        showToast(p.list.length >= MAX_PROFILES ? '这台设备最多 ' + MAX_PROFILES + ' 个账号' : '创建失败，换个名字试试');
        audio.hurt();
        return;
    }
    loginAs(id, true);
    refreshProfileUi();
    signPhoto = '';
    nameField = '';
    state.mode = 'title';
    audio.level();
    showToast('欢迎 ' + name);
}

var gearDrag = null;            // 装备列表的拖拽状态；抬手时看位移决定算拖还是算点
var gearReturn = 'char';        // 装备页返回去哪：角色页进的回角色页，大厅进的回大厅
var buyAsk = null;              // 买猎手时先弹确认框，确认后才真的扣金币
var gearAsk = null;             // 买装备同理

/* 装备行：没买的买，买了的穿上，穿着的脱下 */
function tapGearRow(row) {
    var it = gearOf(row.id);
    if (!it) { return; }
    if (!gearFits(it, save.char)) {
        showToast('这件只有近战角色能穿');
        audio.hurt();
        return;
    }
    if (!save.gearEq[save.char]) { save.gearEq[save.char] = {}; }
    var eq = save.gearEq[save.char];

    if (eq[it.slot] === it.id) {           // 正穿着 → 脱下
        delete eq[it.slot];
        writeSave();
        audio.ui();
        showToast('脱下 ' + it.name);
        return;
    }
    if (!save.gearOwn[it.id]) {            // 没买 → 先弹确认框，确认了才扣钱
        if ((save.coins || 0) < it.price) {
            showToast('金币不够，还差 ' + (it.price - (save.coins || 0)));
            audio.hurt();
            return;
        }
        gearAsk = it.id;
        audio.ui();
        return;
    }
    audio.ui();
    eq[it.slot] = it.id;                   // 穿上
    writeSave();
    refreshProfileUi();
}

/* 确认框里点了「确认购买」：这才真的扣金币，买完直接穿上 */
function buyGear(id) {
    var it = gearOf(id);
    if (!it) { return false; }
    if ((save.coins || 0) < it.price) {
        showToast('金币不够，还差 ' + (it.price - (save.coins || 0)));
        audio.hurt();
        return false;
    }
    save.coins -= it.price;
    save.gearOwn[it.id] = 1;
    if (!save.gearEq[save.char]) { save.gearEq[save.char] = {}; }
    save.gearEq[save.char][it.slot] = it.id;
    writeSave();
    audio.level();
    showToast('买到并穿上 ' + it.name);
    refreshProfileUi();
    return true;
}

/* touchId 是这根手指的 identifier（鼠标路径不传 = undefined）。
   手机上一屏可以有好几根手指：左手推摇杆、右手点按钮。
   按钮判定对所有手指都生效；但摇杆 / 列表拖拽这类"持续手势"
   只认最初按下的那根，别的手指不能把它抢走。 */
function onDown(x, y, touchId) {
    input.touched = true;
    if (!state) { return; }
    touchStartAudio();
    var mode = state.mode;

    // 确认框是最上层：开着的时候只认取消 / 确认
    if (buyAsk || gearAsk) {
        if (hitRect(ui.buyOk, x, y)) {
            if (ui.buyOkLocked) {                 // 买不起 / 还没见过：只提示，不扣钱也不关框
                audio.hurt();
                showToast(gearAsk ? '金币不够' : '金币不够，还差 ' + (getChar(buyAsk).price - (save.coins || 0)));
                return;
            }
            audio.ui();
            if (buyAsk) {
                var ch0 = getChar(buyAsk);
                buyAsk = null;
                if (ch0) { buyChar(ch0); }
            } else {
                var gid = gearAsk;
                gearAsk = null;
                buyGear(gid);
            }
            refreshProfileUi();
            return;
        }
        if (hitRect(ui.buyCancel, x, y)) { audio.ui(); buyAsk = null; gearAsk = null; return; }
        return;                                  // 点框外的空白处也算没确认
    }

    if (mode === 'title') {
        if (hitRect(ui.userBtn, x, y)) { audio.ui(); delArm = ''; state.mode = 'account'; return; }
        if (hitRect(ui.startBtn, x, y)) {
            audio.ui();
            if (!save.tutDone) { guidePage = 0; state.mode = 'guide'; }
            else { startRun(lobbyLevelIdx()); }
            return;
        }
        if (hitRect(ui.charBtn, x, y)) { audio.ui(); state.mode = 'char'; return; }
        if (hitRect(ui.levelBtn, x, y)) { audio.ui(); levelMap = -1; state.mode = 'level'; return; }
        if (hitRect(ui.treasureBtn, x, y)) { audio.ui(); startTreasure(); return; }
        if (hitRect(ui.homeBtn, x, y)) { audio.ui(); startHome(); return; }
        if (hitRect(ui.guideBtn, x, y)) { audio.ui(); guidePage = 0; state.mode = 'guide'; return; }
        if (hitRect(ui.shopBtn, x, y)) { audio.ui(); state.mode = 'shop'; return; }
        if (hitRect(ui.recBtn, x, y)) { audio.ui(); recordTab = 0; recordPage = 0; state.mode = 'records'; return; }
        if (hitRect(ui.musicBtn, x, y)) { audio.ui(); state.mode = 'musicset'; return; }
        // 装备：从大厅直接进，返回时也回大厅
        if (hitRect(ui.gearBtn2, x, y)) {
            audio.ui();
            gearReturn = 'title';
            state.mode = 'gear';
            return;
        }
        return;
    }

    /* ---------------- 音乐与音效设置 */
    if (mode === 'musicset') {
        for (var mi = 0; mi < ui.msRows.length; mi += 1) {
            if (!hitRect(ui.msRows[mi], x, y)) { continue; }
            audio.ui();
            if (ui.msRows[mi].act === 'music') { musicCycle(); }
            else {
                save.sound = !save.sound;
                writeSave();
                if (save.sound) { audio.ok(); }
            }
            return;
        }
        if (hitRect(ui.msBack, x, y)) { audio.ui(); state.mode = 'title'; return; }
        return;
    }

    /* ---------------- 谁在玩：点名字直接进 */
    if (mode === 'login') {
        var li;
        for (li = 0; li < ui.loginRows.length; li += 1) {
            if (!hitRect(ui.loginRows[li], x, y)) { continue; }
            var lid = ui.loginRows[li].id;
            if (loginAs(lid, true) !== 'ok') { audio.hurt(); return; }
            refreshProfileUi();
            audio.level();
            state.mode = 'title';
            return;
        }
        if (ui.loginAdd && hitRect(ui.loginAdd, x, y)) { audio.ui(); openSignup(); return; }
        return;
    }

    /* ---------------- 注册 */
    if (mode === 'signup') {
        if (hitRect(ui.signName, x, y)) {
            nameField = 'signup';
            audio.ui();
            if (!focusNameEl()) { showToast('这台设备打不了字，用「换一个」吧'); }
            return;
        }
        if (hitRect(ui.signPick, x, y) || hitRect(ui.signPhoto, x, y)) {
            audio.ui();
            pickPhoto('signup');
            return;
        }
        if (hitRect(ui.signRoll, x, y)) {
            audio.ui();
            newName = suggestName();
            syncNameEl();
            return;
        }
        blurNameEl();     // 点别的地方就收键盘
        if (hitRect(ui.signOk, x, y)) { submitSignup(); return; }
        if (hitRect(ui.signCancel, x, y)) {
            audio.ui();
            blurNameEl();
            nameField = '';
            state.mode = isLoggedIn() ? 'account' : 'login';
            return;
        }
        return;
    }

    /* ---------------- 我的账号 */
    if (mode === 'account') {
        if (hitRect(ui.accFace, x, y) || hitRect(ui.accAvatar, x, y)) {
            audio.ui();
            pickPhoto('account');

        }
        if (hitRect(ui.accName, x, y)) { audio.ui(); openRename(); return; }

                } else {

            } else {

            return;
        }
        if (hitRect(ui.playerBack, x, y)) { audio.ui(); delArm = ''; state.mode = 'title'; return; }
        return;
    }

    /* ---------------- 改名 */
    if (mode === 'rename') {
        if (hitRect(ui.renName, x, y)) {
            nameField = 'rename';
            audio.ui();
            if (!focusNameEl()) { showToast('这台设备打不了字，用「换一个」吧'); }

        if (hitRect(ui.renOk, x, y)) {

            nameField = '';

            var dup = false;
            var ri;
            for (ri = 0; ri < pp.list.length; ri += 1) {
                if (pp.list[ri].id !== pid && pp.list[ri].name === nm) { dup = true; }
            }
            if (!nm) { audio.hurt(); showToast('名字不能空着'); return; }
            if (dup) { audio.hurt(); showToast('「' + nm + '」有人用了'); return; }
            renameProfile(pid, nm);
            state.mode = 'account';
            audio.pick();
            return;
        }
        if (hitRect(ui.renCancel, x, y)) {
            audio.ui();
            blurNameEl();
            nameField = '';
            state.mode = 'account';
            return;
        }
        return;
    }

    if (mode === 'guide') {
        if (hitRect(ui.guideNext, x, y)) {
            audio.ui();
            if (guidePage < GUIDE.length - 1) {
                guidePage += 1;
            } else {
                save.tutDone = true;
                writeSave();
                state.mode = 'char';
            }
            return;
        }
        if (hitRect(ui.guidePrev, x, y) && guidePage > 0) { audio.ui(); guidePage -= 1; return; }
        if (hitRect(ui.guideSkip, x, y)) {
            audio.ui();
            save.tutDone = true;
            writeSave();
            state.mode = 'char';
            return;
        }
        return;
    }

    if (mode === 'char') {
        for (var i = 0; i < ui.charCards.length; i += 1) {
            if (hitRect(ui.charCards[i], x, y)) {
                askBuyChar(ui.charCards[i].id);
                return;
            }
        }
        if (hitRect(ui.startRunBtn, x, y)) { audio.ui(); levelMap = -1; state.mode = 'level'; return; }
        // 从角色页进装备，返回时回角色页
        if (ui.gearBtn && hitRect(ui.gearBtn, x, y)) { audio.ui(); gearReturn = 'char'; state.mode = 'gear'; return; }
        if (hitRect(ui.backBtn, x, y)) { audio.ui(); state.mode = 'title'; return; }
        return;
    }

    /* ---------------- 装备 */
    if (mode === 'gear') {
        for (var gi = 0; gi < ui.gearSlots.length; gi += 1) {
            if (hitRect(ui.gearSlots[gi], x, y)) {
                audio.ui();
                gearSlot = ui.gearSlots[gi].slot;
                gearScroll = 0;
                ui.gearScrollMax = 0;
                state.mode = 'gearlist';
                return;
            }
        }
        if (hitRect(ui.gearBack, x, y)) { audio.ui(); state.mode = gearReturn || 'char'; return; }
        return;
    }

    /* 装备列表可以上下拖。为了区分"拖"和"戳"，按下先记着，抬手时没挪过才当点击 */
    if (mode === 'gearlist') {
        if (gearDrag) { return; }          // 已有手指在拖列表，别抢
        gearDrag = { x: x, y: y, y0: y, start: gearScroll, moved: 0, id: (touchId === undefined ? null : touchId) };
        return;
    }

    if (mode === 'level') {
        if (hitRect(ui.mapPrev, x, y) && levelMap > 0) { audio.ui(); levelMap -= 1; return; }
        if (hitRect(ui.mapNext, x, y) && levelMap < LEVELS.length - 1) { audio.ui(); levelMap += 1; return; }
        for (var j = 0; j < ui.lvCards.length; j += 1) {
            var lc = ui.lvCards[j];
            if (hitRect(lc, x, y)) {
                if (lc.locked) { audio.hurt(); return; }
                audio.ui();
                startRun(lc.idx);
                return;
            }
        }
        if (hitRect(ui.backBtn, x, y)) { audio.ui(); state.mode = 'char'; return; }
        return;
    }

    if (mode === 'shop') {
        var sti;
        for (sti = 0; sti < (ui.shopTabs || []).length; sti += 1) {
            if (hitRect(ui.shopTabs[sti], x, y)) {
                audio.ui();
                shopTab = ui.shopTabs[sti].id;
                return;
            }
        }
        for (var m = 0; m < ui.shopCards.length; m += 1) {
            if (hitRect(ui.shopCards[m], x, y)) {
                buyShopUp(ui.shopCards[m].id);
                return;
            }
        }
        for (var sm = 0; sm < (ui.shopSeedCards || []).length; sm += 1) {
            if (hitRect(ui.shopSeedCards[sm], x, y)) {
                if (buySeed(ui.shopSeedCards[sm].id)) { showToast('买到 ' + seedOf(ui.shopSeedCards[sm].id).name + '种子', '#C98A18', 1.8); }
                else { showToast('金币不够，或者还没解锁', '#C25E14', 1.6); }
                return;
            }
        }
        for (var sp = 0; sp < (ui.shopPotionCards || []).length; sp += 1) {
            if (hitRect(ui.shopPotionCards[sp], x, y)) {
                if (buyPotion(ui.shopPotionCards[sp].id)) { showToast('买到 ' + potionOf(ui.shopPotionCards[sp].id).name, '#1E7E96', 1.8); }
                else { showToast('金币不够', '#C25E14', 1.6); }
                return;
            }
        }
        if (hitRect(ui.homeFromShopBtn, x, y)) { audio.ui(); startHome(); return; }
        if (hitRect(ui.shopCharBtn, x, y)) { audio.ui(); state.mode = 'char'; return; }
        if (hitRect(ui.backBtn, x, y)) { audio.ui(); state.mode = 'title'; return; }
        return;
    }

    if (mode === 'records') {
        var ti;
        for (ti = 0; ti < ui.recTabs.length; ti += 1) {
            if (hitRect(ui.recTabs[ti], x, y)) {
                audio.ui();
                recordTab = ui.recTabs[ti].idx;
                recordPage = 0;
                return;
            }
        }
        var ri;
        for (ri = 0; ri < ui.recRows.length; ri += 1) {
            var row = ui.recRows[ri];
            if (!hitRect(row, x, y)) { continue; }
            if (row.kind === 'claim') {
                if (claimQuest(row.id)) { audio.level(); } else { audio.hurt(); }
                return;
            }
            if (row.kind === 'equip') {
                if (equipFx(row.id)) { audio.pick(); } else { audio.hurt(); }
                return;
            }
            if (row.kind === 'row') {
                // 点整行也算领奖
                if (claimQuest(row.id)) { audio.level(); } else { audio.ui(); }
                return;
            }
        }
        if (hitRect(ui.recPrev, x, y)) { audio.ui(); recordPage = Math.max(0, recordPage - 1); return; }
        if (hitRect(ui.recNext, x, y)) { audio.ui(); recordPage += 1; return; }
        if (hitRect(ui.recBack, x, y)) { audio.ui(); state.mode = 'title'; return; }
        return;
    }

    if (mode === 'playing') {
        if (hitRect(ui.pauseBtn, x, y)) {
            state.mode = 'paused';
            joyEnd();
            audio.ui();
            return;
        }
        /* 已经有手指在推摇杆了 → 这根手指以降下来的只是搭一下，别抢 */
        if (input.joyActive) { return; }
        joyStart(x, y, touchId);
        return;
    }

    /* ---- 夺宝：遗迹搜刮 ---- */
    if (mode === 'treasure') {
        if (state.mode === 'paused') {
            if (hitRect(ui.resumeBtn, x, y)) { audio.ui(); state.mode = 'treasure'; return; }
            if (hitRect(ui.restartBtn, x, y)) { audio.ui(); startTreasure(); return; }
            if (hitRect(ui.homeBtn, x, y)) { audio.ui(); state.mode = 'title'; return; }
            if (hitRect(ui.pauseMusicBtn, x, y)) { audio.ui(); musicCycle(); return; }
            return;
        }
        if (hitRect(ui.trPauseBtn, x, y)) {
            state.mode = 'paused';
            joyEnd();
            audio.ui();
            return;
        }
        if (input.joyActive) { return; }   // 已有手指在推摇杆，别抢
        joyStart(x, y, touchId);
        return;
    }

    if (mode === 'treasuredone') {
        if (hitRect(ui.trDoneHome, x, y)) { audio.ui(); state.mode = 'title'; return; }
        return;
    }

    /* ---- 家园：逛院子 / 开建造面板 ---- */
    if (mode === 'home') {
        if (state.homePanel) {
            var hti;
            for (hti = 0; hti < 3; hti += 1) {
                var tabKey = ['build', 'plant', 'bag'][hti];
                if (hitRect(ui['homeTab_' + tabKey], x, y)) {
                    audio.ui();
                    state.homeTab = tabKey;
                    return;
                }
            }
            /* 建造卡片 */
            var hci;
            for (hci = 0; hci < (ui.homeCards || []).length; hci += 1) {
                var hc = ui.homeCards[hci];
                if (hitRect(hc, x, y)) {
                    if (homeBuild(hc.id)) { return; }
                    showToast('材料不够', '#C25E14', 1.4);
                    return;
                }
            }
            /* 种植页：选地块 */
            var hpi;
            for (hpi = 0; hpi < (ui.homePlots || []).length; hpi += 1) {
                var hp = ui.homePlots[hpi];
                if (hitRect(hp, x, y)) {
                    audio.ui();
                    var slot = save.home.crops[hp.idx];
                    if (slot && cropStage(slot) === 3) {
                        var got = homeHarvest(hp.idx);
                        showToast('收获 ' + seedOf(slot.seed).name + ' +' + got + ' 金币', '#C98A18', 2);
                    } else if (slot) {
                        showToast('还在长（' + Math.round(slot.plant) + '/' + slot.need + '）', '#5E7E4E', 1.5);
                    } else {
                        state.homePick = hp.idx;
                    }
                    return;
                }
            }
            /* 种植页：点种子播种 */
            var hsi;
            for (hsi = 0; hsi < (ui.homeSeeds || []).length; hsi += 1) {
                var hs = ui.homeSeeds[hsi];
                if (hitRect(hs, x, y)) {
                    if (state.homePick < 0) {
                        showToast('先选一块地', '#C25E14', 1.4);
                    } else if ((save.seeds[hs.id] || 0) <= 0) {
                        showToast('没有这种种子了，去商城买', '#C25E14', 1.6);
                    } else if (homePlant(state.homePick, hs.id)) {
                        showToast('种下了 ' + seedOf(hs.id).name, '#5EB62E', 1.6);
                    }
                    return;
                }
            }
            /* 背包页：用药剂 */
            var hbi;
            for (hbi = 0; hbi < (ui.homeBag || []).length; hbi += 1) {
                var hb = ui.homeBag[hbi];
                if (hitRect(hb, x, y)) {
                    if (hb.kind === 'potion') {
                        if ((save.potions[hb.id] || 0) <= 0) {
                            showToast('没有这种药剂，去商城买', '#C25E14', 1.6);
                        } else if (homeUsePotion(hb.id, state.homePick)) {
                            showToast('用了' + potionOf(hb.id).name, '#1E7E96', 1.6);
                        } else {
                            showToast('先在「种植」里选一株作物', '#C25E14', 1.6);
                        }
                    }
                    return;
                }
            }
            if (hitRect(ui.homeBack, x, y)) { audio.ui(); state.homePanel = false; return; }
            return;
        }
        /* 门口提示：点一下进屋 / 出屋 */
        if (ui.homeDoorBtn && hitRect(ui.homeDoorBtn, x, y)) {
            if (ui.homeDoorBtn.act === 'exit') { exitHome(); } else { enterHome(); }
            return;
        }
        /* 场景里：先看就地操作气泡（种 / 收 / 浇水 / 施肥） */
        var hai;
        for (hai = 0; hai < (ui.homeActBtns || []).length; hai += 1) {
            var hab = ui.homeActBtns[hai];
            if (hitRect(hab, x, y)) {
                if (hab.key === 'plant') {
                    var sid = (save.seeds && save.seeds.radish > 0) ? 'radish' : null;
                    if (!sid && save.seeds) {
                        for (var sk in save.seeds) {
                            if (save.seeds.hasOwnProperty(sk) && save.seeds[sk] > 0 && seedOf(sk)) { sid = sk; break; }
                        }
                    }
                    if (!sid) { showToast('没有种子了，去商城买', '#C25E14', 1.6); }
                    else { homePlant(hab.idx, sid); showToast('种下了 ' + seedOf(sid).name, '#5EB62E', 1.5); }
                } else if (hab.key === 'harvest') {
                    var got = homeHarvest(hab.idx);
                    if (got) { showToast('收获 +' + got + ' 金币', '#C98A18', 1.8); }
                } else if (hab.key === 'water') {
                    if (homeWater(hab.idx)) { showToast('浇水完成', '#4FA8D8', 1.5); }
                    else { showToast('水源不够了', '#C25E14', 1.5); }
                } else if (hab.key === 'fert') {
                    if (homeFertilize(hab.idx)) { showToast('施肥完成', '#8A7A3E', 1.5); }
                    else { showToast('金币不够了', '#C25E14', 1.5); }
                }
                return;
            }
        }
        /* 场景里：点建造按钮开面板 */
        if (hitRect(ui.homeBuildBtn, x, y)) {
            audio.ui();
            state.homePanel = true;
            state.homeTab = 'build';
            /* 面板打开时，默认选中脚下那一格 */
            if (state.homeNear >= 0) { state.homePick = state.homeNear; }
            return;
        }
        if (hitRect(ui.homeSceneBack, x, y)) { audio.ui(); state.mode = 'title'; return; }
        if (input.joyActive) { return; }   // 已有手指在推摇杆，别抢（否则走位会断）
        joyStart(x, y, touchId);
        return;
    }

    if (mode === 'levelup') {
        for (var k = 0; k < ui.cardRects.length; k += 1) {
            if (hitRect(ui.cardRects[k], x, y)) {
                chooseUpgrade(ui.cards[k]);
                return;
            }
        }
        if (hitRect(ui.rerollBtn, x, y)) { rerollCards(); return; }
        return;
    }

    if (mode === 'paused') {
        if (hitRect(ui.resumeBtn, x, y)) { audio.ui(); state.mode = 'playing'; return; }
        if (hitRect(ui.restartBtn, x, y)) { audio.ui(); startRun(state.levelIdx); return; }
        if (hitRect(ui.homeBtn, x, y)) { audio.ui(); state.mode = 'title'; return; }
        if (hitRect(ui.pauseMusicBtn, x, y)) { audio.ui(); musicCycle(); return; }
        return;
    }

    if (mode === 'clear' || mode === 'dead') {
        if (hitRect(ui.retryBtn, x, y)) { audio.ui(); startRun(state.levelIdx); return; }
        if (mode === 'clear' && hitRect(ui.nextBtn, x, y)) {
            audio.ui();
            startRun(Math.min(STAGES.length - 1, state.levelIdx + 1));
            return;
        }
        if (hitRect(ui.homeBtn, x, y)) { audio.ui(); state.mode = 'title'; return; }
        return;
    }
}

function onMove(x, y, touchId) {
    if (!state) { return; }
    if ((state.mode === 'playing' || state.mode === 'treasure' || (state.mode === 'home' && !state.homePanel)) && input.joyActive) {
        joyMove(x, y, touchId);
    }
    if (state.mode === 'gearlist' && gearDrag) {
        /* 只有当初拖列表的那根手指能滚，别的手指移动忽略 */
        if (gearDrag.id !== null && touchId !== undefined && touchId !== gearDrag.id) { return; }
        var dy = y - gearDrag.y0;
        gearDrag.moved = Math.max(gearDrag.moved, Math.abs(dy));
        gearScroll = clamp(gearDrag.start - dy, 0, ui.gearScrollMax || 0);
    }
}

function onUp(touchId) {
    /* 摇杆：只有推摇杆那根手指抬起才结束（别的手指抬起不影响） */
    if (!(input.joyId !== null && touchId !== undefined && touchId !== input.joyId)) {
        joyEnd();
    }
    if (state && state.mode === 'gearlist' && gearDrag) {
        if (gearDrag.id !== null && touchId !== undefined && touchId !== gearDrag.id) { return; }
        var d = gearDrag;
        gearDrag = null;
        if (d.moved < 8) { tapGearListAt(d.x, d.y); }   // 挪得不多，算点击
    }
}

/* 装备列表的落点：行内是穿脱/购买，底部是返回 */
function tapGearListAt(x, y) {
    // 左上角那个返回是浮在列表上面的，先认它——不然滚到中间时会被底下的行抢走
    if (hitRect(ui.gearBack2, x, y) || hitRect(ui.gearBack, x, y)) {
        audio.ui();
        gearScroll = 0;
        state.mode = 'gear';
        return;
    }
    for (var gj = 0; gj < ui.gearRows.length; gj += 1) {
        if (!hitRect(ui.gearRows[gj], x, y)) { continue; }
        tapGearRow(ui.gearRows[gj]);
        return;
    }
}

/* ------------------------------------------------------------ 绑定 */

/* 画布在桌面上是居中定位的（left/top 会留出空白），
   浏览器给的 clientX/Y 是视口坐标，直接当游戏坐标用会整体点偏——
   按钮越窄越明显（「← 返回」66px 宽，基本必点空）。这里统一换算回来。
   rect 每帧缓存一次，避免 touchmove 高频调用时反复触发布局计算。 */
var _rectFrame = -1, _rectCache = null;
function canvasRect() {
    if (_rectCache && _rectFrame === world.tick) { return _rectCache; }
    var r = null;
    try {
        if (typeof canvas !== 'undefined' && canvas && canvas.getBoundingClientRect) {
            var got = canvas.getBoundingClientRect();
            if (got && got.width && got.height) { r = got; }
        }
    } catch (e) { r = null; }
    if (!r) { r = { left: 0, top: 0, width: W, height: H }; }
    _rectCache = r;
    _rectFrame = world.tick;
    return r;
}
/* 视口坐标 → 游戏坐标 */
function toGame(clientX, clientY) {
    var r = canvasRect();
    return {
        x: (clientX - r.left) * (W / (r.width || W)),
        y: (clientY - r.top) * (H / (r.height || H))
    };
}
function evX(cx) { return toGame(cx, 0).x; }
function evY(cy) { return toGame(0, cy).y; }

function bindInput() {
    /* 手机浏览器在 touch 之后常会补一发合成 mousedown（ghost click）。
       主流浏览器靠 touchstart 里的 preventDefault 就能抑制，
       但部分旧内核 / 国产浏览器会漏，一旦漏掉就是「点一次触发两次」
       （种一颗种子扣两颗、浇一次水扣两点）。这里记下触摸时间，
       给鼠标分支兜一道，彻底断开这条重复路径。 */
    var lastTouchMs = 0;

    /* 手机是一屏多指：左手推摇杆、右手点按钮是常态。
       下面把每根手指的 identifier 一路传到 onDown/onMove/onUp，
       由摇杆/拖拽自己记住「是谁按下的」，别的手指就抢不走。
       不这么做的话：右手碰一下屏幕就把摇杆基点挪走、右手一抬摇杆就断。 */
    canvas.addEventListener('touchstart', function (e) {
        e.preventDefault();
        lastTouchMs = Date.now();
        var list = e.changedTouches;
        for (var i = 0; i < list.length; i += 1) {
            var t = list[i];
            var g = toGame(t.clientX, t.clientY);
            onDown(g.x, g.y, t.identifier);
        }
    }, { passive: false });

    canvas.addEventListener('touchmove', function (e) {
        e.preventDefault();
        var list = e.changedTouches;
        for (var i = 0; i < list.length; i += 1) {
            var t = list[i];
            var g = toGame(t.clientX, t.clientY);
            onMove(g.x, g.y, t.identifier);
        }
    }, { passive: false });

    canvas.addEventListener('touchend', function (e) {
        e.preventDefault();
        var list = e.changedTouches;
        for (var i = 0; i < list.length; i += 1) {
            onUp(list[i].identifier);
        }
    }, { passive: false });
    canvas.addEventListener('touchcancel', function (e) {
        e.preventDefault();
        /* 取消没有可靠的 identifier（可能整批撤销），直接结束所有手势 */
        joyEnd();
        if (gearDrag) { gearDrag = null; }
    }, { passive: false });

    canvas.addEventListener('mousedown', function (e) {
        /* 触摸刚发生过 → 这一发 mouse 是浏览器补的，忽略掉 */
        if (Date.now() - lastTouchMs < 700) { return; }
        var g = toGame(e.clientX, e.clientY);
        onDown(g.x, g.y);
    });
    window.addEventListener('mousemove', function (e) {
        var g = toGame(e.clientX, e.clientY);
        onMove(g.x, g.y);
    });
    window.addEventListener('mouseup', function () { onUp(); });

    window.addEventListener('keydown', function (e) {
        var k = e.key.toLowerCase();
        input.keys[k] = true;              // 移动键要按住一直有效
        var again = !!e.repeat;            // 长按时浏览器会狂发 keydown
        if (again) { return; }             // 动作类按键只认第一次，别重复触发
        if (k === 'escape' || k === 'p') {
            if (state && (state.mode === 'playing' || state.mode === 'treasure' || state.mode === 'home')) {
                state.pausedFrom = state.mode;
                state.mode = 'paused';
                joyEnd();
            }
            else if (state && state.mode === 'paused') { state.mode = state.pausedFrom || 'playing'; state.pausedFrom = ''; }
        }
        if (k === ' ' || k === 'enter') {
            if (state && state.mode === 'levelup') {
                if (ui.cards.length) { chooseUpgrade(ui.cards[0]); }
            }
        }
        /* 家园：E / 回车 跟脚下最近的格子交互，或进出屋子 */
        if ((k === 'e' || k === 'enter' || k === ' ') && state && state.mode === 'home' && !state.homePanel) {
            if (state.homeNearDoor) {
                if (state.homeInside) { exitHome(); } else { enterHome(); }
            } else if (state.homeInside) {
                exitHome();
            } else {
                homeActOnNear();
            }
        }
        if (k === 'r' && state && (state.mode === 'dead' || state.mode === 'clear')) {
            startRun(state.levelIdx);
        }
    });
    window.addEventListener('keyup', function (e) { input.keys[e.key.toLowerCase()] = false; });

    window.addEventListener('resize', function () {
        resize();
        if (state) {
            state.cam.x = state.player.x - W / 2;
            state.cam.y = state.player.y - H / 2;
        }
    });
    window.addEventListener('orientationchange', function () {
        setTimeout(function () {
            resize();
            if (state) {
                state.cam.x = state.player.x - W / 2;
                state.cam.y = state.player.y - H / 2;
            }
        }, 150);
    });

    // 切到后台自动暂停，避免回来时已经死了
    document.addEventListener('visibilitychange', function () {
        if (document.hidden && state && (state.mode === 'playing' || state.mode === 'treasure' || state.mode === 'home')) {
            state.pausedFrom = state.mode === 'treasure' ? 'treasure' : (state.mode === 'home' ? 'home' : 'playing');
            state.mode = 'paused';
            joyEnd();
        }
    });
}

/* ------------------------------------------------------------ 主循环 */
var lastTs = 0;

function loop(ts) {
    if (!lastTs) { lastTs = ts; }
    var dt = (ts - lastTs) / 1000;
    lastTs = ts;
    if (!isFinite(dt) || dt <= 0) { dt = 0.016; }
    dt = Math.min(dt, 0.05);

    world.tick = ts / 1000;

    if (state && (state.mode === 'playing' || state.mode === 'treasure' || state.mode === 'home')) {
        var sdt = dt;
        if (state.slowmo > 0) { sdt = dt * 0.4; }
        /* update 出错不能连累整帧：否则一次异常就会卡住画面、
           并且让后续点击看起来「没反应」。和 render 一样兜住。 */
        try { update(sdt); } catch (err) {
            if (typeof console !== 'undefined' && console.error) {
                console.error('update error:', err && err.message ? err.message : err);
            }
        }
    }

    try { musicSync(); } catch (e) { /* 忽略音频异常 */ }

    try {
        render();
    } catch (err) {
        if (typeof console !== 'undefined' && console.error) {
            console.error('render error:', err && err.message ? err.message : err);
        }
    }

    requestAnimationFrame(loop);
}

/* ------------------------------------------------------------ 启动 */
function boot() {
    resize();
    buildWorldSeed(THEMES.meadow);

    loadSession();

    // 记住过就自动进上次那位；否则先在登录页挑账号
    if (isLoggedIn()) { switchProfile(session.id); }

    // 旧存档里若存着还没解锁的角色，安静回退到萝卜兔
    if (!charUnlocked(getChar(save.char))) {
        save.char = 'bunny';
        writeSave();
    }

    // 每天第一次打开就把任务抽好，本轮榜也一并翻篇
    ensureQuests();
    touchSeason();

    // 补一次成就检查：清完旧存档后累计值可能已经够了，不该一直显示未达成
    if (checkAchievements().length) { writeSave(); }

    state = newState();
    state.cam.x = -W / 2;
    state.cam.y = -H / 2;

    if (isLoggedIn()) {
        state.mode = 'title';
    } else if (!loadProfiles().list.length) {
        openSignup();          // 全新安装：直接去注册
    } else {
        state.mode = 'login';
    }
    bindInput();
    world.tick = 0;

    if (typeof window !== 'undefined') {
        window.STAR_SHARD = {
            getState: function () { return state; },
            getUi: function () { return ui; },
            setMode: function (m) { if (state) { state.mode = m; } },
            setShopTab: function (t) { shopTab = t; },
            setGearSlot: function (s) { gearSlot = s; },
            setPage: function (n) { guidePage = n; },
            getWorld: function () { return world; },
            startRun: startRun,
            rollChoices: rollChoices,
            upLv: upLv,
            LEVELS: LEVELS,
            STAGES: STAGES,
            STAGE_COUNT: STAGE_COUNT,
            STAGE_OPEN_NEED: STAGE_OPEN_NEED,
            mapCleared: mapCleared,
            mapClearedCount: mapClearedCount,
            mapDoneCount: mapDoneCount,
            stageUnlocked: stageUnlocked,
            CHARS: CHARS,
            SHOP_UP: SHOP_UP,
            EGGS: EGGS,
            shopLv: shopLv,
            ACHIEVEMENTS: ACHIEVEMENTS,
            QUEST_POOL: QUEST_POOL,
            FX_SKINS: FX_SKINS,
            ensureQuests: ensureQuests,
            checkAchievements: checkAchievements,
            applyQuestProgress: applyQuestProgress,
            WEAPONS: WEAPONS,
            PASSIVES: PASSIVES,
            ENDLESS: ENDLESS,
            USER_NAMES: USER_NAMES,
            profiles: function () { return loadProfiles(); },
            curProfile: curProfile,
            switchProfile: function (id) { var ok = switchProfile(id); if (ok) { refreshProfileUi(); } return ok; },
            createProfile: function (n, c, photo) { var id = createProfile(n, c, photo); if (id) { refreshProfileUi(); } return id; },
            loginAs: loginAs,
            logout: logout,
            isLoggedIn: isLoggedIn,
            session: function () { return session; },
            openSignup: openSignup,
            submitSignup: submitSignup,
            signPhotoSet: function (v) { signPhoto = v || ''; },
            deleteProfile: function (id) { var ok = deleteProfile(id); if (ok) { refreshProfileUi(); } return ok; },
            renameProfile: renameProfile,
            rankRows: rankRows,
            myRankPos: myRankPos,
            touchSeason: touchSeason,
            seasonOf: seasonOf,
            seasonLeftText: seasonLeftText,
            startTreasure: startTreasure,
            startHome: startHome,
            homeBuild: homeBuild,
            homePlant: homePlant,
            homeHarvest: homeHarvest,
            homeUsePotion: homeUsePotion,
            homeWater: homeWater,
            homeFertilize: homeFertilize,
            homePlotAt: homePlotAt,
            homeValidPlot: homeValidPlot,
            normalizeSave: normalizeSave,
            enterHome: enterHome,
            exitHome: exitHome,
            homeActOnNear: homeActOnNear,
            buySeed: buySeed,
            buyPotion: buyPotion,
            homeCanBuild: homeCanBuild,
            seedUnlocked: seedUnlocked,
            cropStage: cropStage,
            homeBonus: homeBonus,
            claimQuest: claimQuest,
            save: function () { return save; }
        };
    }

    requestAnimationFrame(loop);
}

boot();

})();
</script>
