const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const $=id=>document.getElementById(id),W=450,H=600;
const assets={};
// PNG 文件为可选资源；未提供时使用内置矢量绘制。
['background','player','enemy-scout','enemy-heavy','bullet-player','bullet-enemy','explosion'].forEach(name=>{const img=new Image();img.onload=()=>assets[name]=img;img.src=EMBEDDED_ASSETS[name] || `assets/${name}.png`;});
const STAGES=[{name:'霓虹前线',theme:'#183957',boss:'赤焰指挥官'},{name:'熔岩边境',theme:'#51302e',boss:'熔核巨兽'},{name:'极光禁区',theme:'#183e4a',boss:'深空猎手'},{name:'核心轨道',theme:'#362448',boss:'终焉核心'}];
let state='ready',t=0,score=0,life=10,level=1,spawn=0,fire=0,inv=0,player,enemies=[],bullets=[],shots=[],particles=[],pickups=[],keys={},pointer=null,last=0;
let stage=0,stageTime=0,boss=null,stageTransition=0,buff={damage:0,rapid:0,shield:0},buffDrops=0;
let shake=0,screenFlash=0,lastBuffDrop=-20;
let stars=Array.from({length:85},()=>({x:Math.random()*W,y:Math.random()*H,s:Math.random()*1.5+.3}));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function sprite(name,x,y,w,h,angle=0){const img=assets[name];if(!img)return false;const scale=Math.min(w/img.width,h/img.height);ctx.save();ctx.translate(x,y);ctx.rotate(angle);ctx.drawImage(img,-img.width*scale/2,-img.height*scale/2,img.width*scale,img.height*scale);ctx.restore();return true;}
function plane(x,y,size,enemy=false,heavy=false){ctx.save();ctx.translate(x,y);if(enemy)ctx.rotate(Math.PI);ctx.shadowColor=enemy?'#ff675e':'#42dcff';ctx.shadowBlur=12;ctx.fillStyle=enemy?(heavy?'#df8064':'#cc5265'):'#60dbf2';ctx.beginPath();ctx.moveTo(0,-size*.65);ctx.lineTo(size*.2,-size*.1);ctx.lineTo(size*.6,size*.33);ctx.lineTo(size*.55,size*.47);ctx.lineTo(size*.15,size*.3);ctx.lineTo(size*.12,size*.6);ctx.lineTo(-size*.12,size*.6);ctx.lineTo(-size*.15,size*.3);ctx.lineTo(-size*.55,size*.47);ctx.lineTo(-size*.6,size*.33);ctx.lineTo(-size*.2,-size*.1);ctx.closePath();ctx.fill();ctx.shadowBlur=0;ctx.fillStyle=enemy?'#ffdc9c':'#d5fbff';ctx.fillRect(-3,-size*.23,6,size*.4);ctx.fillStyle='#368eb0';ctx.fillRect(-4,size*.5,8,size*.3*(.5+Math.random()));ctx.restore();}
function reset(){lastBuffDrop=-20;shake=0;screenFlash=0;t=0;score=0;life=10;level=1;spawn=.4;fire=0;inv=0;player={x:W/2,y:H-85};enemies=[];bullets=[];shots=[];particles=[];pickups=[];stage=0;stageTime=0;boss=null;stageTransition=0;buff={damage:0,rapid:0,shield:0};buffDrops=0;pointer=null;keys={};state='playing';$('overlay').classList.add('hidden');$('pause').textContent='暂停 Ⅱ';hud();}
function beginBoss(){boss={x:W/2,y:170,hp:240+stage*95,maxHp:240+stage*95,shoot:.8,phase:0,name:STAGES[stage].boss,r:42};enemies=[];bullets=[];stageTransition=0;show('关底警报 / BOSS',''+boss.name,'重型单位进入战区！<br>集中火力，注意环形与追踪弹幕。','迎战 Boss →');state='bossIntro';$('bossbar').classList.remove('hidden');}
function nextStage(){stage++;if(stage>=STAGES.length){stage=STAGES.length-1;state='victory';boss=null;$('bossbar').classList.add('hidden');show('战区清空 / VICTORY','苍穹已守护',`最终得分 <strong>${score}</strong> · 全部 4 个战区已通关。`,'再次出击 ↻');return;}stageTime=0;buffDrops=0;spawn=1;stageTransition=0;enemies=[];bullets=[];boss=null;life=Math.min(10,life+1);show(`战区 ${stage+1} / ${STAGES[stage].name}`,'防线推进','战机整备完成，生命恢复 1 点。<br>前方侦测到新的敌方编队。','进入战区 →');state='stageIntro';$('bossbar').classList.add('hidden');}
function dropBuff(x,y,guaranteed=false){if(!guaranteed&&(t-lastBuffDrop<18||Math.random()>.07))return;const types=['damage','rapid','shield'];const type=types[Math.floor(Math.random()*types.length)];pickups.push({x,y,r:13,type,vy:65,ttl:12});lastBuffDrop=t;}
function applyBuff(type){if(type==='shield')buff.shield=1;else buff[type]=Math.min(60,buff[type]+24);burst(player.x,player.y,type==='shield'?'#a88aff':type==='damage'?'#ff8e69':'#51efff',9);}
function bossBurst(b){const count=12+stage*2;for(let i=0;i<count;i++){const a=i*Math.PI*2/count+(stage>=2?b.phase*.8:0);bullets.push({x:b.x,y:b.y,vx:Math.cos(a)*(95+stage*8),vy:Math.sin(a)*(95+stage*8),r:5});}const aim=Math.atan2(player.y-b.y,player.x-b.x);for(const side of (stage%2?[-2,-1,0,1,2]:[-1,0,1])){const a=aim+side*.18;bullets.push({x:b.x,y:b.y,vx:Math.cos(a)*155,vy:Math.sin(a)*155,r:6});}}
function hud(){const secs=Math.floor(t);$('score').textContent=String(score).padStart(5,'0');$('time').textContent=`${String(Math.floor(secs/60)).padStart(2,'0')}:${String(secs%60).padStart(2,'0')}`;$('life').innerHTML=`${life} <span>/ 10</span>`;$('hp').innerHTML=Array.from({length:10},(_,i)=>`<i class="${i>=life?'off':''}"></i>`).join('');const guns=['单发','双发','三向散射','五向散射'];$('level').textContent=`火力等级 ${String(level).padStart(2,'0')} · ${guns[Math.min(level-1,3)]}${buff.damage>0?' · 伤害强化':''}${buff.rapid>0?' · 极速射击':''}`;$('wave').textContent=`第 ${stage+1} 关 · ${STAGES[stage].name}`;$('progress').style.width=boss?`${100*boss.hp/boss.maxHp}%`:`${Math.min(100,stageTime/30*100)}%`;$('progress').style.background=boss?'#ff6478':'#49dcdf';$('bossbar').classList.toggle('hidden',!boss);if(boss)$('bosshp').style.width=`${100*boss.hp/boss.maxHp}%`;const tags=[];if(buff.damage>0)tags.push(`<span class="bufftag">伤害强化 ${Math.ceil(buff.damage)}s</span>`);if(buff.shield)tags.push('<span class="bufftag" style="color:#c6acff">护盾 · 可抵挡 1 次</span>');if(buff.rapid>0)tags.push(`<span class="bufftag">攻速强化 ${Math.ceil(buff.rapid)}s</span>`);$('buffbar').innerHTML=tags.join('');const pct=state==='victory'?100:((stage+(boss?(.7+.3*(1-boss.hp/boss.maxHp)):stageTransition>0?1:.7*Math.min(1,stageTime/30)))/STAGES.length)*100;$('routefill').style.height=`${pct}%`;$('routepct').textContent=`${Math.floor(pct)}%`;$('routelabel').textContent=boss?'BOSS 战':'闯关进度';$('routedots').innerHTML=STAGES.map((x,i)=>`<i class="${i<stage||state==='victory'?'done':i===stage?'active':''}" title="${x.name}">${i+1}</i>`).reverse().join('');}
function burst(x,y,color,n=18){if(n>=18){const big=n>=32;particles.push({x,y,vx:0,vy:0,ttl:big?.85:.46,max:big?.85:.46,color,explosion:true,size:big?125:45});shake=Math.max(shake,big?8:2.5);}for(let i=0;i<n;i++){let a=Math.random()*Math.PI*2,speed=40+Math.random()*170;particles.push({x,y,vx:Math.cos(a)*speed,vy:Math.sin(a)*speed,ttl:.2+Math.random()*.45,color});}}
function drawBoss(){const b=boss;ctx.save();ctx.translate(b.x,b.y);const accent=['#ff6459','#ffad36','#53d7ff','#c774ff'][stage];
 const poly=(pts,fill,stroke='#697c95')=>{ctx.beginPath();pts.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.closePath();ctx.fillStyle=fill;ctx.fill();ctx.strokeStyle=stroke;ctx.lineWidth=1;ctx.stroke();};
 const metal=ctx.createLinearGradient(-20,0,20,0);metal.addColorStop(0,'#172237');metal.addColorStop(.45,'#72829a');metal.addColorStop(.55,'#acb7ca');metal.addColorStop(1,'#253047');
 for(const side of [-1,1]){ctx.save();ctx.scale(side,1);
 ctx.shadowColor=accent;ctx.shadowBlur=12;const f=12+Math.sin(t*23)*4;poly([[24,-29],[29,-56-f],[34,-29]],accent,accent);ctx.shadowBlur=0;
 poly([[14,-33],[31,-45],[42,-30],[48,-6],[76,21],[65,38],[40,23],[24,31]],'#121e32');poly([[30,-31],[38,-25],[44,0],[67,21],[59,26],[37,12],[24,17]],'#3d4f6c');poly([[37,-13],[50,0],[66,17],[52,12],[39,2]],'#8794aa');
 poly([[21,-28],[34,-34],[38,-8],[31,8],[20,-3]],metal);ctx.fillStyle='#0b1324';ctx.fillRect(25,-22,8,17);ctx.fillStyle=accent;ctx.fillRect(27,-19,3,11);
 poly([[39,8],[52,17],[50,41],[39,41]],metal);ctx.fillStyle='#080f1c';ctx.fillRect(41,18,7,21);ctx.fillStyle=accent;ctx.shadowColor=accent;ctx.shadowBlur=8;ctx.fillRect(41,37,7,4);ctx.shadowBlur=0;
 ctx.strokeStyle='#9aabc1';ctx.beginPath();ctx.moveTo(38,5);ctx.lineTo(59,22);ctx.stroke();for(let j=0;j<3;j++){ctx.fillStyle='#101a2c';ctx.fillRect(27,-3+j*5,8,2);}ctx.fillStyle=accent;ctx.fillRect(61,21,4,3);ctx.restore();}
 poly([[0,-52],[14,-36],[20,-13],[17,25],[0,54],[-17,25],[-20,-13],[-14,-36]],metal);poly([[0,-41],[9,-24],[9,8],[0,23],[-9,8],[-9,-24]],'#07152a',accent);
 const glass=ctx.createLinearGradient(0,-33,0,14);glass.addColorStop(0,'#d5f8ff');glass.addColorStop(.35,accent);glass.addColorStop(1,'#172440');poly([[0,-34],[5,-22],[4,-3],[0,4],[-4,-3],[-5,-22]],glass,accent);
 ctx.shadowColor=accent;ctx.shadowBlur=14;ctx.fillStyle=accent;ctx.beginPath();ctx.arc(0,16,5+Math.sin(t*5)*.6,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;poly([[0,26],[6,33],[0,46],[-6,33]],'#16233b');ctx.strokeStyle=accent;ctx.beginPath();ctx.moveTo(0,31);ctx.lineTo(0,40);ctx.stroke();
 if(b.flash>0){ctx.globalCompositeOperation='screen';ctx.fillStyle='#fff9';ctx.beginPath();ctx.ellipse(0,0,29,42,0,0,Math.PI*2);ctx.fill();}ctx.restore();}
function show(tag,title,message,label){$('tag').textContent=tag;$('title').textContent=title;$('message').innerHTML=message;$('start').textContent=label;$('overlay').classList.remove('hidden');}
function pause(){if(state==='playing'||state==='boss'){state='paused';pointer=null;keys={};show('飞行暂停 / PAUSED','稍作休整','准备好后继续守卫天空。','继续作战 →');$('pause').textContent='继续 ▶';}else if(state==='paused'){state=boss?'boss':'playing';$('overlay').classList.add('hidden');$('pause').textContent='暂停 Ⅱ';}else if(state==='stageIntro'||state==='bossIntro'){state=boss?'boss':'playing';$('overlay').classList.add('hidden');$('pause').textContent='暂停 Ⅱ';}}
function update(dt){shake=Math.max(0,shake-dt*18);screenFlash=Math.max(0,screenFlash-dt*3);for(const e of enemies)e.flash=Math.max(0,(e.flash||0)-dt);if(boss)boss.flash=Math.max(0,(boss.flash||0)-dt);t+=dt;stageTime+=dt;level=Math.min(6,1+Math.floor(t/15));inv=Math.max(0,inv-dt);fire-=dt;spawn-=dt;buff.damage=Math.max(0,buff.damage-dt);buff.rapid=Math.max(0,buff.rapid-dt);
 let dx=(keys.ArrowRight||keys.d?1:0)-(keys.ArrowLeft||keys.a?1:0),dy=(keys.ArrowDown||keys.s?1:0)-(keys.ArrowUp||keys.w?1:0);const len=Math.hypot(dx,dy)||1;
 player.x=clamp(player.x+dx/len*280*dt,22,W-22);player.y=clamp(player.y+dy/len*280*dt,95,H-24);if(pointer){player.x=clamp(pointer.x,22,W-22);player.y=clamp(pointer.y,95,H-24);}
 if(fire<=0){fire=Math.max(.065,.24-level*.023-(buff.rapid>0?.075:0));const angles=level===1?[0]:level===2?[-.035,.035]:level===3?[-.18,0,.18]:[-.28,-.14,0,.14,.28];for(let a of angles)shots.push({x:player.x+(level===2?(a<0?-9:9):0),y:player.y-25,vx:Math.sin(a)*460,vy:-Math.cos(a)*460,r:3,damage:(level>=5?2:1)+(buff.damage>0?1:0)});}
 if(!boss&&stageTransition<=0&&stageTime>=20&&buffDrops===0&&t-lastBuffDrop>=18){const types=['damage','rapid','shield'];pickups.push({x:80+Math.random()*290,y:70,r:13,type:types[stage%3],vy:65,ttl:12});lastBuffDrop=t;buffDrops++;}if(!boss&&stageTransition<=0&&stageTime>=30){beginBoss();hud();return;}
 if(stageTransition>0){stageTransition-=dt;if(stageTransition<=0){nextStage();hud();return;} }
 if(!boss&&state==='playing'&&stageTransition<=0&&spawn<=0){spawn=Math.max(.32,1.08-stageTime*.012);let heavy=stageTime>12&&Math.random()<.24;enemies.push({x:25+Math.random()*(W-50),y:-30,r:heavy?23:17,hp:(heavy?6:2)+stage*2,speed:58+stage*12+Math.random()*45,shoot:.5+Math.random(),heavy});}
 for(const e of enemies){e.y+=e.speed*dt;if(stage===1)e.x=clamp(e.x+Math.sin(e.y*.035)*60*dt,25,W-25);if(stage===3)e.x=clamp(e.x+Math.sin(t*2+e.y*.01)*90*dt,25,W-25);e.shoot-=dt;if(e.shoot<=0&&e.y>20&&e.y<H-20){e.shoot=Math.max(.55,1.7-stage*.16);const angle=Math.atan2(player.y-e.y,player.x-e.x);for(const a of (e.heavy?[-.22,0,.22]:[0])){const speed=125+stage*18;bullets.push({x:e.x,y:e.y+12,vx:Math.cos(angle+a)*speed,vy:Math.sin(angle+a)*speed,r:5});}}}
 if(boss){boss.phase+=dt;boss.x=W/2+Math.sin(boss.phase*.72)*(W*.32);boss.y=165+Math.sin(boss.phase*1.1)*20;boss.shoot-=dt;if(boss.shoot<=0){boss.shoot=Math.max(.48,1.08-stage*.1);bossBurst(boss);}}
 for(const s of shots){s.x+=s.vx*dt;s.y+=s.vy*dt;for(const e of enemies){if(e.hp>0&&!s.dead&&Math.hypot(s.x-e.x,s.y-e.y)<e.r+s.r){s.dead=true;e.hp-=s.damage;e.flash=.09;burst(s.x,s.y,'#ffd59b',3);if(e.hp<=0){score+=10;burst(e.x,e.y,'#ff9568');dropBuff(e.x,e.y);}}}if(boss&&!s.dead&&Math.hypot(s.x-boss.x,s.y-boss.y)<boss.r+s.r){s.dead=true;boss.hp-=s.damage;boss.flash=.085;shake=Math.max(shake,1.4);burst(s.x,s.y,'#ffd59b',2);if(boss.hp<=0){score+=250+stage*100;burst(boss.x,boss.y,'#ff9568',60);shake=9;screenFlash=.35;dropBuff(boss.x,boss.y,true);boss=null;state='playing';$('bossbar').classList.add('hidden');stageTransition=2.2;bullets=[];stageTime=0;}}}
 for(const b of bullets){b.x+=b.vx*dt;b.y+=b.vy*dt;if(Math.hypot(b.x-player.x,b.y-player.y)<17&&!b.dead){b.dead=true;hit();}}
 for(const e of enemies)if(e.hp>0&&Math.hypot(e.x-player.x,e.y-player.y)<e.r+13){e.hp=0;burst(e.x,e.y,'#ff9568');hit();}
 for(const item of pickups){item.y+=item.vy*dt;item.ttl-=dt;if(Math.hypot(item.x-player.x,item.y-player.y)<25){item.ttl=0;applyBuff(item.type);} }
 enemies=enemies.filter(e=>e.hp>0&&e.y<H+40);pickups=pickups.filter(p=>p.ttl>0&&p.y<H+25);shots=shots.filter(s=>!s.dead&&s.y>-20&&s.x>-10&&s.x<W+10);bullets=bullets.filter(b=>!b.dead&&b.y<H+20&&b.y>-30&&b.x>-20&&b.x<W+20);
 for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.ttl-=dt;}particles=particles.filter(p=>p.ttl>0);hud();}
function hit(){if(inv>0||(state!=='playing'&&state!=='boss'))return;if(buff.shield){buff.shield=0;inv=1;shake=2;burst(player.x,player.y,'#b69cff',22);hud();return;}life--;inv=1;shake=5;screenFlash=.16;burst(player.x,player.y,'#54e9ff',12);if(life<=0){state='over';pointer=null;show('任务结束 / GAME OVER','天空等你归来',`最终得分 <strong>${score}</strong> · 到达第 ${stage+1} 关。`,'再次起飞 ↻');}}
function draw(dt){ctx.save();if(shake>0&&(state==='playing'||state==='boss'))ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);ctx.fillStyle='#091425';ctx.fillRect(0,0,W,H);if(assets.background){const bh=W*assets.background.height/assets.background.width;const y=(t*25)%bh;ctx.drawImage(assets.background,0,y,W,bh);ctx.drawImage(assets.background,0,y-bh,W,bh);ctx.fillStyle=STAGES[stage].theme+'24';ctx.fillRect(0,0,W,H);}else{ctx.strokeStyle='#13253b';ctx.lineWidth=1;for(let x=0;x<W;x+=50){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}for(let y=(t*25)%50;y<H;y+=50){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}for(const s of stars){if(state==='playing')s.y=(s.y+s.s*30*dt)%H;ctx.fillStyle=`rgba(160,212,255,${s.s*.35})`;ctx.fillRect(s.x,s.y,s.s,s.s*2);}}
 for(const item of pickups){ctx.save();ctx.translate(item.x,item.y);ctx.rotate(t*1.8);ctx.shadowBlur=16;ctx.shadowColor=item.type==='shield'?'#aa8bff':item.type==='damage'?'#ff745f':'#4ff5ff';ctx.fillStyle=ctx.shadowColor;ctx.fillRect(-9,-9,18,18);ctx.fillStyle='#071322';ctx.font='bold 12px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(item.type==='shield'?'S':item.type==='damage'?'D':'R',0,1);ctx.restore();}for(const e of enemies){const name=e.heavy?'enemy-heavy':'enemy-scout';if(!sprite(name,e.x,e.y,e.r*2.5,e.r*2.5))plane(e.x,e.y,e.r*1.8,true,e.heavy);if(e.flash>0){ctx.save();ctx.globalCompositeOperation='screen';ctx.fillStyle='#ffffffbb';ctx.beginPath();ctx.arc(e.x,e.y,e.r*.8,0,Math.PI*2);ctx.fill();ctx.restore();}}
 if(boss)drawBoss();ctx.shadowBlur=10;for(const s of shots){ctx.fillStyle='#7bfaff';ctx.shadowColor='#31dfff';if(!sprite('bullet-player',s.x,s.y,8,24,Math.atan2(s.vx,-s.vy)))ctx.fillRect(s.x-2,s.y-9,4,18);}for(const b of bullets){ctx.fillStyle='#ff9c76';ctx.shadowColor='#ff5d58';if(!sprite('bullet-enemy',b.x,b.y,12,12,Math.atan2(b.vy,b.vx)+Math.PI/2)){ctx.beginPath();ctx.arc(b.x,b.y,4,0,Math.PI*2);ctx.fill();}}ctx.shadowBlur=0;
 if(player&&buff.shield){ctx.save();ctx.strokeStyle='#bd9aff';ctx.shadowColor='#ae7dff';ctx.shadowBlur=14;ctx.lineWidth=2;ctx.fillStyle='#9765ff18';ctx.beginPath();ctx.ellipse(player.x,player.y,32,37,0,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.lineWidth=1;ctx.beginPath();ctx.arc(player.x,player.y,35,t, t+Math.PI*.7);ctx.stroke();ctx.restore();}if(player&&!(inv>0&&Math.floor(inv*15)%2)){if(!sprite('player',player.x,player.y,48,58))plane(player.x,player.y,36);if(inv>0){ctx.strokeStyle='#56e6ff80';ctx.beginPath();ctx.arc(player.x,player.y,30,0,Math.PI*2);ctx.stroke();}}
 for(const p of particles){ctx.globalAlpha=Math.min(1,p.ttl*2);ctx.fillStyle=p.color;if(p.explosion){const age=1-p.ttl/p.max,size=p.size*(.35+age*1.25);ctx.save();ctx.globalCompositeOperation='lighter';ctx.globalAlpha=Math.max(0,1-age);sprite('explosion',p.x,p.y,size,size);ctx.strokeStyle='#ffbc62';ctx.lineWidth=2*(1-age);ctx.beginPath();ctx.arc(p.x,p.y,size*.55,0,Math.PI*2);ctx.stroke();if(age<.22){ctx.fillStyle='#fff1b0';ctx.beginPath();ctx.arc(p.x,p.y,size*.3,0,Math.PI*2);ctx.fill();}ctx.restore();}else ctx.fillRect(p.x,p.y,3,3);}ctx.globalAlpha=1;if(screenFlash>0){ctx.fillStyle=`rgba(255,211,159,${screenFlash})`;ctx.fillRect(0,0,W,H);}ctx.restore();}
function loop(now){const dt=Math.min((now-last)/1000||0,.04);last=now;if(state==='playing'||state==='boss')update(dt);draw(dt);requestAnimationFrame(loop);}
function locationOf(e){const r=canvas.getBoundingClientRect();return {x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height};}
canvas.addEventListener('pointerdown',e=>{if(state!=='playing'&&state!=='boss')return;canvas.setPointerCapture(e.pointerId);pointer=locationOf(e);});canvas.addEventListener('pointermove',e=>{if(pointer&&(state==='playing'||state==='boss'))pointer=locationOf(e);});for(const event of ['pointerup','pointercancel','lostpointercapture'])canvas.addEventListener(event,()=>pointer=null);
window.addEventListener('keydown',e=>{const k=e.key.length===1?e.key.toLowerCase():e.key;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','w','a','s','d','p','Escape',' '].includes(k))e.preventDefault();keys[k]=true;if(!e.repeat&&(k==='p'||k==='Escape'))pause();});window.addEventListener('keyup',e=>keys[e.key.length===1?e.key.toLowerCase():e.key]=false);window.addEventListener('blur',()=>{keys={};pointer=null;if(state==='playing'||state==='boss')pause();});document.addEventListener('visibilitychange',()=>{if(document.hidden&&(state==='playing'||state==='boss'))pause();});$('start').onclick=()=>{if(state==='paused'){pause();return;}if(state==='stageIntro'||state==='bossIntro'){state=boss?'boss':'playing';$('overlay').classList.add('hidden');$('pause').textContent='暂停 Ⅱ';return;}reset();};$('pause').onclick=pause;player={x:W/2,y:H-85};hud();requestAnimationFrame(loop);

</script></body></html>
