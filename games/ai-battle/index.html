function drawAwakeArt(){
  if (!(G.artT > 0) && G.artE == null) return;

  /* 龙王觉醒走自己的演出，别把 DeepSeek 的立绘放上来 */
  if (G.awakeId && G.awakeId !== 'ds'){ drawAwakeGp(); return; }

  if (!DSQ_ART.complete || !DSQ_ART.naturalWidth) return;
  var T = 2.3, e = T - G.artT;
  if (G.artE != null) e = G.artE;
  var a;
  if (e < 0.22) a = e/0.22;
  else if (e < 1.78) a = 1;
  else a = Math.max(0, 1 - (e - 1.78)/0.52);
  if (a <= 0.002) return;

  var cx = VIEW_W*0.5, cy = VIEW_H*0.5;
  var hgt = VIEW_H*1.05;
  var wid = hgt*DSQ_ART.naturalWidth/DSQ_ART.naturalHeight;
  var zoom = 1.00 + Math.min(1, e/2.3)*0.085;
  var drift = -e*3.2;

  ctx.save();
  ctx.globalAlpha = 1;

  /* 1) 先铺一层极淡的星云底（覆盖全屏），再整体压暗，避免画面发灰 */
  var cs = Math.max(VIEW_W/DSQ_ART.naturalWidth, VIEW_H/DSQ_ART.naturalHeight);
  var dx0 = cx - DSQ_ART.naturalWidth*cs/2, dy0 = cy - DSQ_ART.naturalHeight*cs/2;
  ctx.globalAlpha = a*0.42;
  ctx.drawImage(DSQ_ART, dx0, dy0, DSQ_ART.naturalWidth*cs, DSQ_ART.naturalHeight*cs);
  ctx.globalAlpha = 1;

  ctx.fillStyle = 'rgba(4,6,14,' + (a*0.72) + ')';
  ctx.fillRect(0, 0, VIEW_W, VIEW_H);

  /* 2) 横向暗角：把星云底收到立绘附近，两侧回到深色 */
  var vx = Math.max(wid*0.55, 120), vgL = ctx.createLinearGradient(0, 0, cx - vx, 0);
  vgL.addColorStop(0, 'rgba(4,6,14,' + (a*0.90) + ')');
  vgL.addColorStop(1, 'rgba(4,6,14,0)');
  ctx.fillStyle = vgL;
  ctx.fillRect(0, 0, cx - vx, VIEW_H);
  var vgR = ctx.createLinearGradient(VIEW_W, 0, cx + vx, 0);
  vgR.addColorStop(0, 'rgba(4,6,14,' + (a*0.90) + ')');
  vgR.addColorStop(1, 'rgba(4,6,14,0)');
  ctx.fillStyle = vgR;
  ctx.fillRect(cx + vx, 0, VIEW_W - cx - vx, VIEW_H);

  /* 3) 星辉底光 + 放射光线 */
  var g = ctx.createRadialGradient(cx, cy, 8, cx, cy, hgt*0.66);
  g.addColorStop(0, 'rgba(168,224,255,' + (a*0.34) + ')');
  g.addColorStop(0.34, 'rgba(96,156,244,' + (a*0.15) + ')');
  g.addColorStop(1, 'rgba(40,70,160,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, VIEW_W, VIEW_H);

  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(e*0.13);
  ctx.globalCompositeOperation = 'lighter';
  for (var i = 0; i < 18; i++){
    var ang = i*Math.PI/9, r2 = hgt*0.95, hw = 0.010 + (i % 3)*0.007;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(Math.cos(ang - hw)*r2, Math.sin(ang - hw)*r2);
    ctx.lineTo(Math.cos(ang + hw)*r2, Math.sin(ang + hw)*r2);
    ctx.closePath();
    ctx.fillStyle = 'rgba(146,204,255,' + (a*0.05) + ')';
    ctx.fill();
  }
  ctx.restore();

  /* 4) 立绘本体 */
  ctx.save();
  ctx.translate(cx, cy + drift);
  ctx.scale(zoom, zoom);
  ctx.globalAlpha = a*0.98;
  ctx.drawImage(DSQ_ART, -wid/2, -hgt/2, wid, hgt);
  ctx.globalAlpha = 1;

  /* 5) 左右渐隐：向外多铺一段，和暗角无缝衔接 */
  var fw = wid*0.22, out = 90, k0 = out/(out + fw);
  var fadeL = ctx.createLinearGradient(-wid/2 - out, 0, -wid/2 + fw, 0);
  fadeL.addColorStop(0, 'rgba(5,7,16,' + (a*0.55) + ')');
  fadeL.addColorStop(k0*0.55, 'rgba(5,7,16,' + (a*0.88) + ')');
  fadeL.addColorStop(k0, 'rgba(5,7,16,' + a + ')');
  fadeL.addColorStop(k0 + (1 - k0)*0.5, 'rgba(5,7,16,' + (a*0.42) + ')');
  fadeL.addColorStop(1, 'rgba(5,7,16,0)');
  ctx.fillStyle = fadeL;
  ctx.fillRect(-wid/2 - out, -hgt/2, out + fw, hgt);
  var fwR = wid*0.16;
  var fadeR = ctx.createLinearGradient(wid/2 + out, 0, wid/2 - fwR, 0);
  fadeR.addColorStop(0, 'rgba(5,7,16,' + (a*0.55) + ')');
  fadeR.addColorStop(k0*0.55, 'rgba(5,7,16,' + (a*0.88) + ')');
  fadeR.addColorStop(k0, 'rgba(5,7,16,' + a + ')');
  fadeR.addColorStop(1, 'rgba(5,7,16,0)');
  ctx.fillStyle = fadeR;
  ctx.fillRect(wid/2 - fwR, -hgt/2, fwR + out, hgt);

  /* 6) 上下轻微压暗，避免立绘贴边 */
  var fadeT = ctx.createLinearGradient(0, -hgt/2, 0, -hgt/2 + hgt*0.14);
  fadeT.addColorStop(0, 'rgba(5,7,16,' + (a*0.85) + ')');
  fadeT.addColorStop(1, 'rgba(5,7,16,0)');
  ctx.fillStyle = fadeT;
  ctx.fillRect(-wid/2, -hgt/2, wid, hgt*0.14);
  var fadeB = ctx.createLinearGradient(0, hgt/2, 0, hgt/2 - hgt*0.12);
  fadeB.addColorStop(0, 'rgba(5,7,16,' + (a*0.85) + ')');
  fadeB.addColorStop(1, 'rgba(5,7,16,0)');
  ctx.fillStyle = fadeB;
  ctx.fillRect(-wid/2, hgt/2 - hgt*0.12, wid, hgt*0.12);
  ctx.restore();

  /* 7) 开幕白闪 */
  if (e < 0.28){
    var fa = Math.pow(1 - e/0.28, 2.6);
    ctx.fillStyle = 'rgba(226,246,255,' + (fa*0.62) + ')';
    ctx.fillRect(0, 0, VIEW_W, VIEW_H);
  }
  ctx.restore();
}

/* 龙王觉醒：紫雾 + 逆光里的龙影，比人形立绘更压场 */
function drawAwakeGp(){
  var T = 2.3, e = T - G.artT;
  if (G.artE != null) e = G.artE;
  var a;
  if (e < 0.22) a = e/0.22;
  else if (e < 1.80) a = 1;
  else a = Math.max(0, 1 - (e - 1.80)/0.50);
  if (a <= 0.002) return;

  var cx = VIEW_W*0.5, cy = VIEW_H*0.52;

  ctx.save();

  ctx.fillStyle = 'rgba(8,6,18,' + (a*0.80) + ')';
  ctx.fillRect(0,0,VIEW_W,VIEW_H);

  var g = ctx.createRadialGradient(cx, cy+80, 10, cx, cy+80, VIEW_H*0.92);
  g.addColorStop(0, 'rgba(226,214,255,' + (a*0.40) + ')');
  g.addColorStop(0.42, 'rgba(176,150,240,' + (a*0.18) + ')');
  g.addColorStop(1, 'rgba(60,40,110,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0,0,VIEW_W,VIEW_H);

  ctx.save();
  ctx.translate(cx, cy+80);
  ctx.rotate(-e*0.10);
  ctx.globalCompositeOperation = 'lighter';
  for (var i=0;i<20;i++){
    var ang = i*Math.PI/10, r2 = VIEW_H*0.95, hw = 0.008 + (i%3)*0.006;
    ctx.beginPath();
    ctx.moveTo(0,0);
    ctx.lineTo(Math.cos(ang-hw)*r2, Math.sin(ang-hw)*r2);
    ctx.lineTo(Math.cos(ang+hw)*r2, Math.sin(ang+hw)*r2);
    ctx.closePath();
    ctx.fillStyle = 'rgba(210,190,255,' + (a*0.045) + ')';
    ctx.fill();
  }
  ctx.restore();

  /* 觉醒演出直接用二形态原画：与战斗内立绘同源，不会出现两套画风 */
  if (GP2_OK && GP2_IMG.naturalWidth){
    var kA = (VIEW_H*0.80) / GP2_GEO.h;
    var dwA = GP2_GEO.w*kA, dhA = GP2_GEO.h*kA;
    var oxA = -GP2_GEO.axis*kA, oyA = -GP2_GEO.bot*kA;
    var rise = Math.min(1, e/0.55);
    var pop = 0.92 + rise*0.10;
    /* 谁变身就让谁面朝对手：原画龙头朝左，facing=-1 时不用翻 */
    var awHost = (P1 && P1.c.id === 'gp' && P1.form) ? P1 : ((P2 && P2.c.id === 'gp' && P2.form) ? P2 : null);
    var mirA = awHost ? -awHost.facing : 1;
    ctx.save();
    ctx.translate(cx, VIEW_H*0.97 + (1-a)*30 + (1-rise)*40);
    ctx.rotate(-0.035 + Math.sin(e*1.4)*0.005);
    ctx.scale(pop*mirA, pop);

    /* 逆光：白色剪影在后面撑出一圈光，龙才有“从光里压过来”的压迫感 */
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    var glowS = 1 + 0.02*Math.sin(e*2.2);
    ctx.globalAlpha = a*0.30;
    ctx.drawImage(GP2_WHITE || GP2_IMG, oxA-8, oyA-8, dwA+16, dhA+16);
    ctx.globalAlpha = a*0.14;
    ctx.drawImage(GP2_WHITE || GP2_IMG, oxA*glowS-18, oyA*glowS-18, dwA+36, dhA+36);
    ctx.restore();

    ctx.globalAlpha = a*0.98;
    ctx.drawImage(GP2_IMG, oxA, oyA, dwA, dhA);
    ctx.restore();
  }

  if (e < 0.26){
    var fa = Math.pow(1 - e/0.26, 2.4);
    ctx.fillStyle = 'rgba(238,230,255,' + (fa*0.66) + ')';
    ctx.fillRect(0,0,VIEW_W,VIEW_H);
  }

  ctx.restore();
}

/* 二形态的太刀：刀身微弧、刃口高光，挥砍时带一道斩击弧；不出刀时腰间挂鞘 */
function wKatana(f, D, P, sh, hd, aF){
  var R = D.headR;
  var hx, hy;
  if (aF){ hx = aF.ex; hy = aF.ey; }
  else { hx = R*1.30; hy = D.toes*0.24; }

  /* 收刀时刀尖斜指上前；挥砍时从抬刀（-2.30）扫到收势（+1.00） */
  var ang = -0.85, glow = 0.30, swing = 0;
  if (f.state === 'attack' && f.atk){
    var m = f.atk.m, e = f.st;
    if (e < m.startup){
      var u0 = clamp(e/Math.max(0.001, m.startup), 0, 1);
      ang = lerp(-0.85, -2.30, ease(u0));
    } else if (e < m.startup + m.active){
      var u1 = clamp((e - m.startup)/Math.max(0.001, m.active), 0, 1);
      ang = lerp(-2.30, 0.86, ease(u1)); swing = 1; glow = 1;
    } else {
      var u2 = clamp((e - m.startup - m.active)/Math.max(0.001, m.recovery), 0, 1);
      ang = lerp(0.86, -0.85, ease(u2)); glow = 0.5;
    }
  } else if (f.state === 'jump'){ ang = f.fly ? -0.95 : -1.25; }
  else if (f.state === 'block'){ ang = -0.28; }
  else if (f.state === 'hit'){ ang = -0.08; }
  else if (f.state === 'walk'){ ang = -0.85 + Math.sin(f.walkT*10)*0.09; }

  var LL = R*3.35, bw = Math.max(2.6, R*0.125);

  /* 腰间刀鞘（出招时不画） */
  if (!(f.state === 'attack' && f.atk)){
    ctx.save();
    ctx.translate(-R*0.42, D.toes*0.20);
    ctx.rotate(0.46);
    ctx.fillStyle = '#16224e';
    rr(-R*1.85, -bw*1.35, R*1.92, bw*2.7, bw*1.2); ctx.fill();
    ctx.strokeStyle = 'rgba(232,200,130,0.55)'; ctx.lineWidth = 1;
    rr(-R*1.85, -bw*1.35, R*1.92, bw*2.7, bw*1.2); ctx.stroke();
    ctx.fillStyle = '#f4dc9a';
    rr(-R*0.36, -bw*1.55, R*0.24, bw*3.1, 1.2); ctx.fill();
    ctx.restore();
  }

  ctx.save();
  ctx.translate(hx, hy);
  ctx.rotate(ang);

  /* 挥砍：一道拖在刀身后的刀光 */
  if (swing){
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 0.34 + 0.22*Math.sin(G.t*30);
    var sg = ctx.createLinearGradient(0, 0, LL, -bw*3);
    sg.addColorStop(0, 'rgba(255,255,255,0)');
    sg.addColorStop(0.5, 'rgba(226,248,255,0.80)');
    sg.addColorStop(1, 'rgba(170,225,255,0)');
    ctx.strokeStyle = sg; ctx.lineWidth = bw*3.6; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(0, 0);
    ctx.quadraticCurveTo(LL*0.55, -bw*2.4, LL, -bw*3.6);
    ctx.stroke();
    ctx.restore();
  }

  /* 刀身 */
  var bg = ctx.createLinearGradient(0, -bw*3, LL*0.25, bw*1.5);
  bg.addColorStop(0, '#ffffff');
  bg.addColorStop(0.40, '#eaf6ff');
  bg.addColorStop(1, '#8fb6d8');
  ctx.beginPath();
  ctx.moveTo(0, -bw*0.2);
  ctx.quadraticCurveTo(LL*0.52, -bw*1.7, LL, -bw*2.9);
  ctx.lineTo(LL*0.97, -bw*2.9 + bw*2.1);
  ctx.quadraticCurveTo(LL*0.52, -bw*0.05, 0, bw*1.4);
  ctx.closePath();
  ctx.fillStyle = bg; ctx.fill();
  ctx.strokeStyle = 'rgba(70,110,160,0.60)'; ctx.lineWidth = 0.9; ctx.stroke();

  /* 刃口高光 */
  ctx.strokeStyle = 'rgba(255,255,255,0.95)'; ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.moveTo(LL*0.04, -bw*0.20);
  ctx.quadraticCurveTo(LL*0.52, -bw*1.60, LL*0.96, -bw*2.86);
  ctx.stroke();

  /* 刀镡 */
  ctx.fillStyle = '#2c3f6b';
  ctx.beginPath(); ctx.ellipse(0, 0, bw*1.15, bw*2.5, 0, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = '#e8c882'; ctx.lineWidth = 1.0; ctx.stroke();

  /* 柄 */
  ctx.fillStyle = '#1b2a52';
  rr(-R*0.66, -bw*0.90, R*0.66, bw*1.8, bw*0.4); ctx.fill();
  ctx.strokeStyle = 'rgba(232,200,130,0.85)'; ctx.lineWidth = 0.9;
  for (var di=0; di<4; di++){
    var dx2 = -R*0.60 + di*R*0.16;
    ctx.beginPath(); ctx.moveTo(dx2, -bw*0.82); ctx.lineTo(dx2 + bw*0.95, bw*0.82); ctx.stroke();
  }

  if (glow > 0.5){
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 0.16*glow;
    ctx.fillStyle = '#dff3ff';
    ctx.beginPath(); ctx.ellipse(LL*0.5, -bw*1.3, LL*0.60, bw*2.8, 0, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }
  ctx.restore();
}

function drawWhaleFigure(f, D, P, sh, hd, lF, lB){

  /* 直接贴定稿立绘，保证与原画逐像素一致；二阶段同款立绘 + 星海光效 */

  if (f.form){

    var R2 = D.headR;

    wAura(f, sh, hd, D, R2);

    /* 脚下星海光池 */

    ctx.save();

    ctx.globalCompositeOperation = 'lighter';

    var gy = D.toes + 1.5;

    var rgd = ctx.createRadialGradient(0, gy, 1, 0, gy, R2*2.8);

    rgd.addColorStop(0, 'rgba(120,205,255,0.42)');

    rgd.addColorStop(0.55, 'rgba(90,160,255,0.16)');

    rgd.addColorStop(1, 'rgba(70,130,255,0)');

    ctx.fillStyle = rgd;

    ctx.beginPath(); ctx.ellipse(0, gy, R2*2.8, R2*0.62, 0, 0, Math.PI*2); ctx.fill();

    /* 星海浮游光点：呼应觉醒立绘里的星空 */
    var sH = D.toes + D.torso + D.headOff + D.headR*1.08;
    for (var si = 0; si < 16; si++){
      var sPh = si*0.7854, sSp = 0.55 + (si % 5)*0.14;
      var sT = G.t*sSp + sPh*3;
      var sX = Math.sin(sT*0.85 + sPh)*R2*2.15;
      var sY = D.toes - ((sT*26 + si*53) % sH);
      var sAl = 0.26 + 0.46*(0.5 + 0.5*Math.sin(sT*2.6 + sPh*2));
      var sR = 1.3 + (si % 3)*1.0;
      ctx.fillStyle = 'rgba(182,232,255,' + sAl.toFixed(3) + ')';
      ctx.beginPath(); ctx.arc(sX, sY, sR, 0, Math.PI*2); ctx.fill();
    }

    ctx.restore();

    if (drawWhaleSprite(f, D, P, sh, hd, true)) return;

  } else if (drawWhaleSprite(f, D, P, sh, hd, false)) return;

  var p = whalePal(f.c, f.form);

  var R = D.headR;

  var busy = (f.state === 'attack' || f.state === 'hit' || f.state === 'block' || f.state === 'jump');

  /* 站立时把手臂角度往「自然下垂」收一点，避免手糊在围裙上 */

  var kA = busy ? 1 : 0.30;

  var kL = busy ? 1 : 0.74;



  var arF = { x: sh.x + R*0.74, y: sh.y + R*0.30 };

  var arB = { x: sh.x - R*0.66, y: sh.y + R*0.24 };

  var aBias = busy ? 0 : 0.20;

  var aF = fk(arF.x, arF.y, P.armF[0]*kA + aBias, D.ua, P.armF[1]*kA, D.hand);

  var aB = fk(arB.x, arB.y, P.armB[0]*kA - aBias, D.ua, P.armB[1]*kA, D.hand);

  var lF2 = fk(0, 0, P.legF[0]*kL, D.leg, P.legF[1]*kL, D.leg);

  var lB2 = fk(0, 0, P.legB[0]*kL, D.leg, P.legB[1]*kL, D.leg);



  ctx.lineJoin = 'round';

  if (f.form) wVeil(f, sh, D);

  wHairBack(p, hd, R, f.t, f.form, D.toes);

  /* 脖子 */

  ctx.fillStyle = '#f3d7c8';

  rr(hd.x - R*0.19, hd.y + R*0.60, R*0.38, R*0.60, R*0.12); ctx.fill();

  wTail(f, p, D, sh);

  wLeg(lB2, p, D, true, false);

  wLeg(lF2, p, D, false, true);

  wArm(arB, aB, p, D, true);

  wDress(f, p, sh, hd, D, f.form);

  wArm(arF, aF, p, D, false);



  if (f.form) wAura(f, sh, hd, D, R);



  /* 头 */

  ctx.fillStyle = '#ffe7da';

  wHeadPath(hd, R); ctx.fill();

  var jg = ctx.createLinearGradient(hd.x, hd.y + R*0.24, hd.x, hd.y + R);

  jg.addColorStop(0, 'rgba(226,178,168,0)');

  jg.addColorStop(1, 'rgba(226,178,168,0.34)');

  ctx.save();

  wHeadPath(hd, R*0.995); ctx.clip();

  ctx.fillStyle = jg; ctx.fillRect(hd.x-R, hd.y, R*2, R);

  var rim = ctx.createRadialGradient(hd.x, hd.y - R*0.10, R*0.55, hd.x, hd.y - R*0.10, R*1.08);

  rim.addColorStop(0, 'rgba(226,178,168,0)');

  rim.addColorStop(1, 'rgba(226,178,168,0.30)');

  ctx.fillStyle = rim; ctx.fillRect(hd.x-R, hd.y-R, R*2, R*2);

  ctx.restore();



  wFace(hd, p, f, R);

  wHairFront(p, hd, R, f.t, f.form);

  wFinEar(hd, p, R, -1, true);

  wFinEar(hd, p, R, 1, false);

  wHeaddress(hd, p, R, f.t, f.form);

  wBow(hd, p, R, f.t, f.form);



  wHand(aF, p, false, R);

  wHand(aB, p, true, R);

  if (f.form && !DSQ_OK) wKatana(f, D, P, sh, hd, aF);

}



function drawFace(hd, c, f){

  var blink = (Math.sin(f.t*1.7) > 0.985) ? 0.15 : 1;

  /* 3/4 侧脸：本地 +x 恒为「对手所在的一侧」（外层已按 facing 镜像）。

     五官整体向 +x 偏移 + 近眼大远眼小 + 远侧脸颊压暗 + 朝对手轻侧头。

     以前是一张左右对称、正对镜头的脸，两个角色并排看着就像背对背。 */

  var fx = hd.x + 4.2;              // 五官簇中心

  var farX  = fx - 7.4;             // 远侧眼

  var nearX = fx + 4.6;             // 近侧眼



  ctx.save();

  ctx.translate(hd.x, hd.y);

  ctx.rotate(0.085);                // 朝对手轻轻歪头

  ctx.translate(-hd.x, -hd.y);



  // 远侧脸颊压暗（体积感，说明这半边转过去了）

  var gs = ctx.createRadialGradient(hd.x-11, hd.y+2, 1, hd.x-11, hd.y+2, 16);

  gs.addColorStop(0, 'rgba(196,142,138,0.40)');

  gs.addColorStop(0.6, 'rgba(196,142,138,0.16)');

  gs.addColorStop(1, 'rgba(196,142,138,0)');

  ctx.save();

  ctx.beginPath(); ctx.arc(hd.x, hd.y, HEAD_R-0.6, 0, Math.PI*2); ctx.clip();

  ctx.fillStyle = gs;

  ctx.fillRect(hd.x-HEAD_R, hd.y-HEAD_R, HEAD_R*2, HEAD_R*2);

  ctx.restore();



  // 眼：近大远小

  var eg = (c.id === 'gp') ? 1.30 : 1.0;

  ctx.fillStyle = c.pupil || '#2a2438';

  ctx.beginPath(); ctx.ellipse(farX,  hd.y+1.2, 2.10*eg, 3.85*blink*eg, 0.10, 0, Math.PI*2); ctx.fill();

  ctx.beginPath(); ctx.ellipse(nearX, hd.y+0.9, 3.40*eg, 4.70*blink*eg, -0.06, 0, Math.PI*2); ctx.fill();

  if (c.style === 'dragon'){

    /* 龙瞳：紫罗兰虹膜（上深下浅）+ 竖裂瞳孔 */

    var ic = c.eye || '#7b5ec8', ic2 = c.eye2 || '#bda6f5';

    var ig = ctx.createLinearGradient(nearX, hd.y-4*eg, nearX, hd.y+5*eg);

    ig.addColorStop(0, shade(ic, -0.22));

    ig.addColorStop(0.55, ic);

    ig.addColorStop(1, ic2);

    ctx.fillStyle = ig;

    ctx.beginPath(); ctx.ellipse(farX,  hd.y+1.4, 1.45*eg, 2.95*blink*eg, 0.10, 0, Math.PI*2); ctx.fill();

    ctx.beginPath(); ctx.ellipse(nearX, hd.y+1.0, 2.30*eg, 3.62*blink*eg, -0.06, 0, Math.PI*2); ctx.fill();

    ctx.fillStyle = c.pupil || '#16242f';

    ctx.beginPath(); ctx.ellipse(farX,  hd.y+1.4, 0.52*eg, 2.70*blink*eg, 0.10, 0, Math.PI*2); ctx.fill();

    ctx.beginPath(); ctx.ellipse(nearX, hd.y+1.0, 0.82*eg, 3.32*blink*eg, -0.06, 0, Math.PI*2); ctx.fill();

    ctx.fillStyle = 'rgba(255,255,255,0.5)';

    ctx.beginPath(); ctx.ellipse(nearX+0.4, hd.y+3.4*eg, 1.5*eg, 0.72, -0.06, 0, Math.PI*2); ctx.fill();

  }

  ctx.fillStyle = 'rgba(255,255,255,0.92)';

  ctx.beginPath(); ctx.arc(farX-0.8,  hd.y-0.9, 0.85*eg, 0, Math.PI*2); ctx.fill();

  ctx.beginPath(); ctx.arc(nearX-1.2, hd.y-1.2, 1.25*eg, 0, Math.PI*2); ctx.fill();

  /* GP：上睫毛加一撇，眼睛更像少女漫 */

  if (c.id === 'gp'){

    ctx.strokeStyle = 'rgba(58,42,74,0.85)'; ctx.lineWidth = 1.1; ctx.lineCap = 'round';

    ctx.beginPath(); ctx.arc(nearX, hd.y+1.0, 4.3*eg, Math.PI*1.12, Math.PI*1.92); ctx.stroke();

    ctx.beginPath(); ctx.arc(farX,  hd.y+1.3, 3.1*eg, Math.PI*1.14, Math.PI*1.90); ctx.stroke();

  }

  // 腮红：近侧大而靠前，远侧小而偏中线

  ctx.fillStyle = 'rgba(255,138,138,0.32)';

  ctx.beginPath(); ctx.ellipse(nearX+4.0, hd.y+7.0, 4.3, 2.5, -0.06, 0, Math.PI*2); ctx.fill();

  ctx.beginPath(); ctx.ellipse(farX-4.4,  hd.y+7.4, 3.0, 1.9, 0.05, 0, Math.PI*2); ctx.fill();

  // 鼻子：一个小钩，落在脸内侧（不凸出轮廓）

  ctx.strokeStyle = 'rgba(198,148,138,0.75)'; ctx.lineWidth = 1.15; ctx.lineCap = 'round';

  ctx.beginPath(); ctx.arc(fx+1.5, hd.y+4.6, 1.7, -0.45, 1.30); ctx.stroke();

  // 嘴

  ctx.strokeStyle = 'rgba(58,44,58,0.80)'; ctx.lineWidth = 1.4;

  ctx.beginPath();

  if (f.state === 'attack' || f.state === 'hit'){ ctx.arc(fx+0.6, hd.y+9.4, 3.2, 0.15, Math.PI-0.15); }

  else { ctx.arc(fx+0.2, hd.y+8.6, 2.6, 0.25, Math.PI-0.25); }

  ctx.stroke();



  if (c.style === 'dragon'){

    /* 颊侧鳞片：三片贴在远侧颧骨上 */

    ctx.fillStyle = 'rgba(150,205,255,0.45)';

    for (var s3=0;s3<3;s3++){

      ctx.beginPath();

      ctx.ellipse(farX-4.6, hd.y+3.4+s3*2.35, 2.05, 1.15, -0.55, 0, Math.PI*2);

      ctx.fill();

    }

    /* 小虎牙 */

    ctx.fillStyle = 'rgba(255,255,255,0.96)';

    ctx.beginPath();

    ctx.moveTo(fx-1.4, hd.y+9.5);

    ctx.lineTo(fx+0.2, hd.y+9.7);

    ctx.lineTo(fx-0.7, hd.y+12.5);

    ctx.closePath(); ctx.fill();

    /* 生气 / 出招时眼角红光 */

    if (f.state === 'attack' || f.state === 'hit'){

      ctx.globalAlpha = 0.35;

      ctx.fillStyle = '#bfe9ff';

      ctx.beginPath(); ctx.ellipse(nearX+0.6, hd.y+1.2, 4.2, 4.4, 0, 0, Math.PI*2); ctx.fill();

      ctx.globalAlpha = 1;

    }

  }

  ctx.restore();

}



function drawFighter(f){

  var c = f.c;

  var sx = f.x - G.cam, sy = FLOOR_Y - f.y;



  // 影子

  var shk = clamp(1 - f.y/300, 0.25, 1);

  ctx.save();

  ctx.globalAlpha = 0.3*shk;

  ctx.fillStyle = '#000';

  var shW = (c.id === 'gp' && f.form) ? 64 : 32;

  ctx.beginPath(); ctx.ellipse(sx, FLOOR_Y-2, shW*SC*shk, 8.5*SC*shk, 0, 0, Math.PI*2); ctx.fill();

  ctx.restore();



  // 闪避残影：身后拖几层渐隐的蓝影，速度感靠这个

  if (f.dodgeT > 0){

    var dd = f.dodgeDir || -f.facing;

    var dk = clamp(f.dodgeT/0.25, 0, 1);

    ctx.save();

    ctx.globalCompositeOperation = 'lighter';

    /* 三道速度线 */

    ctx.globalAlpha = 0.34*dk;

    ctx.strokeStyle = '#bfe8ff';

    ctx.lineCap = 'round';

    for (var li = 0; li < 3; li++){

      var ly = sy - (44 + li*26)*SC;

      ctx.lineWidth = (2.4 - li*0.5);

      ctx.beginPath();

      ctx.moveTo(sx - dd*10, ly);

      ctx.lineTo(sx - dd*(52 + li*12), ly);

      ctx.stroke();

    }

    ctx.restore();

  }

  // 护盾

  if (f.shield > 0){

    ctx.save();

    ctx.globalAlpha = 0.35 + Math.sin(G.t*14)*0.12;

    ctx.strokeStyle = '#f0c27b'; ctx.lineWidth = 3.5;

    ctx.beginPath(); ctx.ellipse(sx, sy-64*SC, 46*SC, 70*SC, 0, 0, Math.PI*2); ctx.stroke();

    ctx.globalAlpha = 0.16;

    ctx.fillStyle = '#f0c27b';

    ctx.beginPath(); ctx.ellipse(sx, sy-64*SC, 46*SC, 70*SC, 0, 0, Math.PI*2); ctx.fill();

    ctx.restore();

  }



  // 硬体 / 霸体：护体光（技能橙、必杀金）

  if (f.state === 'attack' && f.atk && f.atk.armor){

    var aCol = (f.atk.armor === 'super') ? '#ffd23f' : '#ffa63d';

    var pu = 0.5 + 0.5*Math.sin(G.t*13);

    var boost = f.atk.armorT > 0 ? clamp(f.atk.armorT/0.42, 0, 1) : 0;

    ctx.save();

    ctx.globalCompositeOperation = 'lighter';

    ctx.strokeStyle = aCol;

    ctx.globalAlpha = 0.16 + 0.14*pu + boost*0.55;

    ctx.lineWidth = 2.4 + boost*2.6;

    ctx.beginPath(); ctx.ellipse(sx, sy-62*SC, 42*SC, 68*SC, 0, 0, Math.PI*2); ctx.stroke();

    ctx.globalAlpha = 0.07 + 0.06*pu + boost*0.22;

    ctx.fillStyle = aCol;

    ctx.beginPath(); ctx.ellipse(sx, sy-62*SC, 42*SC, 68*SC, 0, 0, Math.PI*2); ctx.fill();

    ctx.restore();

  }



  var P = buildPose(f);

  var D = dimsOf(f);



  ctx.save();

  ctx.translate(sx, sy - D.toes*SC);

  ctx.scale(f.facing*SC, SC);



  if (f.state === 'ko'){

    var kk = clamp(f.koT/0.55, 0, 1);

    ctx.translate(0, kk*46);

    ctx.rotate(-kk*Math.PI*0.5);

  }



  var sh = { x: Math.sin(P.lean)*D.torso, y: -Math.cos(P.lean)*D.torso };

function drawFighterFX(f){

  if (f.state !== 'attack' || !f.atk) return;

function dragonMouth(f){

  var sh = { x: Math.sin(P.lean)*TORSO, y: -Math.cos(P.lean)*TORSO };

  var hd = { x: sh.x + Math.sin(P.lean+P.head)*HEAD_OFF, y: sh.y - Math.cos(P.lean+P.head)*HEAD_OFF };

function flameLayer(mo, len, half, col, alpha, tt, spd, fade){

  /* 从嘴里往外张开的锥形，边缘做锯齿抖动，像喷出来的寒气 */

  var N = 10;

  ctx.globalAlpha = alpha*fade;

  var g = ctx.createLinearGradient(mo.x, mo.y, mo.x + len, mo.y);

  g.addColorStop(0, 'rgba(255,255,255,0.98)');

  g.addColorStop(0.14, col);

  g.addColorStop(0.66, col);

  g.addColorStop(1, 'rgba(255,255,255,0)');

  ctx.fillStyle = g;

  ctx.beginPath();

  ctx.moveTo(mo.x - 2, mo.y - 1.6);

  for (var i=1;i<=N;i++){

    var u = i/N;

    var w = half*Math.pow(u, 0.72)*(1 + Math.sin(tt*spd + i*1.9)*0.16);

    ctx.lineTo(mo.x + len*u, mo.y - w);

  }

  for (var j=N;j>=1;j--){

    var u2 = j/N;

    var w2 = half*Math.pow(u2, 0.72)*(0.78 + Math.sin(tt*spd*1.25 + j*2.3)*0.13);

    ctx.lineTo(mo.x + len*u2, mo.y + w2);

  }

  ctx.closePath();

  ctx.fill();

}



function drawBreath(f, m){

  var mo = dragonMouth(f);

  var e = f.st, s0 = m.startup, s1 = s0 + m.active;

  var col = m.color || '#6dffd0';



  /* 蓄气：口腔聚起一团苍焰，四周火星被吸进去 */

  if (e < s0){

    var ch = clamp(e/Math.max(0.001,s0), 0, 1);

    ctx.save();

    ctx.globalAlpha = 0.55 + 0.45*Math.abs(Math.sin(G.t*9));

    var rg = ctx.createRadialGradient(mo.x, mo.y, 1, mo.x, mo.y, 15*ch + 5);

    rg.addColorStop(0, '#ffffff');

    rg.addColorStop(0.30, col);

    rg.addColorStop(1, 'rgba(207,238,255,0)');

    ctx.fillStyle = rg;

    ctx.beginPath(); ctx.arc(mo.x, mo.y, 15*ch + 5, 0, Math.PI*2); ctx.fill();

    for (var i=0;i<6;i++){

      var an = G.t*2.6 + i*1.05;

      var rr = 36*(1-ch) + 7;

      ctx.globalAlpha = 0.55*ch;

      ctx.fillStyle = col;

      ctx.beginPath(); ctx.arc(mo.x + Math.cos(an)*rr*0.75, mo.y + Math.sin(an)*rr*0.55, 1.7, 0, Math.PI*2); ctx.fill();

    }

    ctx.globalAlpha = 0.6*ch;

    ctx.fillStyle = '#ffffff';

    ctx.beginPath(); ctx.arc(mo.x-1.5, mo.y+1.5, 2.8, 0, Math.PI*2); ctx.fill();

    ctx.restore();

    return;

  }

  if (e > s1 + 0.12) return;



  var fade = e <= s1 ? 1 : 1 - (e - s1)/0.12;

  var len = (m.range || 130) + 5;

  var tt = G.t*22;

  ctx.save();

  flameLayer(mo, len*1.04, 30, col, 0.26, tt, 0.8, fade);

  flameLayer(mo, len*0.88, 10.5, '#ffffff', 0.92, tt, 1.9, fade);



  /* 寒气里翻卷的碎冰 */

  ctx.globalAlpha = fade*0.8;

  for (var k=0;k<10;k++){

    var u = ((k*0.103 + G.t*0.7) % 1);

    var ex = mo.x + len*u*1.02;

    var ey = mo.y + Math.sin(G.t*6 + k*2.1)*15*(0.25 + u);

    ctx.fillStyle = k%3 === 0 ? '#ffffff' : col;

    if (k % 2 === 0){

      ctx.beginPath();

      ctx.moveTo(ex - 2.6, ey);

      ctx.lineTo(ex, ey - 2.0);

      ctx.lineTo(ex + 2.6, ey);

      ctx.lineTo(ex, ey + 2.0);

      ctx.closePath(); ctx.fill();

    } else {

      ctx.beginPath(); ctx.arc(ex, ey, 1.9*(1-u*0.5), 0, Math.PI*2); ctx.fill();

    }

  }

  ctx.restore();

}

/* ---- 攻击特效通用层：挥击气刃 / 速度拉丝 / 法术光环 ---- */

var FX_MELEE = { line:1, spike:1, burst:1, pop:1, up:1, slam:1, claw:1, fang:1, splash:1, slash:1 };

function fxLayer(m, a, prog, gx, gy, cx, cy, col, sc){

  var e1 = ease(clamp(prog*1.25, 0, 1));

  if (!sc) sc = 1;

  /* 太刀斩：一道又细又利的拔刀弧，末端甩出刀光 */
  if (m.fx === 'slash'){
    var RR = 20 + (m.range||96)*0.30;
    var sw = 0.30 + 0.70*ease(clamp(prog*1.5, 0, 1));
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = a*0.90;
    ctx.lineCap = 'round';
    var g1 = ctx.createLinearGradient(gx, gy - RR, gx + RR*0.9, gy + RR*0.5);
    g1.addColorStop(0, 'rgba(255,255,255,0)');
    g1.addColorStop(0.45, 'rgba(240,252,255,0.85)');
    g1.addColorStop(1, 'rgba(150,215,255,0)');
    ctx.strokeStyle = g1;
    ctx.lineWidth = 6.5*sc;
    ctx.beginPath();
    ctx.arc(gx, gy, RR*sw, -1.30, -1.30 + 1.85*sw);
    ctx.stroke();
    ctx.globalAlpha = a;
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 2.0*sc;
    ctx.beginPath();
    ctx.arc(gx, gy, RR*sw*0.92, -1.22, -1.22 + 1.72*sw);
    ctx.stroke();
    ctx.globalAlpha = a*0.30;
    ctx.strokeStyle = (col || '#dff3ff');
    ctx.lineWidth = 12*sc;
    ctx.beginPath();
    ctx.arc(gx, gy, RR*sw*1.06, -1.34, -1.34 + 1.90*sw);
    ctx.stroke();
    ctx.restore();
    return;
  }

  ctx.save();

  ctx.globalCompositeOperation = 'lighter';

  if (FX_MELEE[m.fx]){

    /* 半月气刃：从拳后上方扫到正前方 */

    var R = 16 + (m.range||80)*0.22;

    R *= (0.78 + e1*0.5);

    var a0 = -1.88, a1 = a0 + 0.10 + 1.55*e1;

    var oxp = gx - R*0.55, oyp = gy + 1.5;

    var grd = ctx.createLinearGradient(oxp - R, 0, oxp + R*0.5, 0);

    grd.addColorStop(0, col);

    grd.addColorStop(0.62, col);

    grd.addColorStop(1, '#ffffff');

    ctx.globalAlpha = a*0.30*(0.55 + 0.45*prog);

    ctx.fillStyle = grd;

    ctx.beginPath();

    ctx.arc(oxp, oyp, R, a0, a1, false);

    ctx.arc(oxp, oyp, R*0.62, a1, a0, true);

    ctx.closePath();

    ctx.fill();

    ctx.globalAlpha = a*0.55;

    ctx.strokeStyle = '#ffffff';

    ctx.lineWidth = 1.4;

    ctx.lineCap = 'round';

    ctx.beginPath(); ctx.arc(oxp, oyp, R*0.66, a0, a1, false); ctx.stroke();

    /* 速度拉丝 */

    ctx.globalAlpha = a*0.45*(1 - prog*0.45);

    ctx.strokeStyle = '#e6f4ff';

    for (var i = 0; i < 3; i++){

      var off = (i - 1)*7.5;

      var l0 = 10 + i*4, l1 = l0 + 14 + prog*24;

      ctx.lineWidth = 2.1 - i*0.42;

      ctx.beginPath();

      ctx.moveTo(gx - l0, gy + off*0.5);

      ctx.lineTo(gx - l1, gy + off*1.1);

      ctx.stroke();

    }

  } else {

    /* 法术：外扩法环 + 环绕光点 */

    var RR = (18 + 26*e1)*sc;

    ctx.globalAlpha = a*0.32;

    ctx.strokeStyle = col; ctx.lineWidth = 2.4;

    ctx.beginPath(); ctx.arc(gx + 10*sc, cy, RR, 0, Math.PI*2); ctx.stroke();

    ctx.globalAlpha = a*0.18;

    ctx.beginPath(); ctx.arc(gx + 10*sc, cy, RR*1.52, 0, Math.PI*2); ctx.stroke();

    ctx.globalAlpha = a*0.72;

    ctx.fillStyle = '#ffffff';

    for (var q = 0; q < 5; q++){

      var qa = q*1.2566 + prog*1.6, qr = RR*1.05;

      ctx.beginPath();

      ctx.arc(gx + 10*sc + Math.cos(qa)*qr, cy + Math.sin(qa)*qr, 1.8, 0, Math.PI*2);

      ctx.fill();

    }

  }

  ctx.restore();

}

/* 施法蓄力：法环从外往里收、纸屑被吸进书脊，最后书心一亮把符文弹推出去 */
function drawCastCharge(f, m, aF){

  var e = f.st, s0 = m.startup;

  var gx = (f._fistX !== undefined) ? f._fistX : aF.ex;

      ctx.lineTo(fxp+7, fyp-3);

      ctx.lineTo(fxp+3, fyp+7);

      ctx.closePath(); ctx.fill();

    }

  } else if (m.fx === 'lash'){

    /* 甩尾：身前贴地的一道月牙，前端粗、尾端收细 */

    var lr = (m.range || 100)*0.56;

    var a0 = Math.PI*0.74;

    var a1 = a0 - Math.PI*0.66*clamp(prog, 0.001, 1);

    ctx.globalAlpha = a*0.85;

    var lg = ctx.createLinearGradient(1 - lr, 5, 1 + lr, 5);

    lg.addColorStop(0, 'rgba(255,255,255,0)');

    lg.addColorStop(0.45, col);

    lg.addColorStop(1, '#ffffff');

    ctx.fillStyle = lg;

    ctx.beginPath();

    ctx.arc(1, 5, lr, a0, a1, true);

    ctx.arc(1, 5, lr - 11, a1, a0, false);

    ctx.closePath(); ctx.fill();

    ctx.globalAlpha = a*0.5;

    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2;

    ctx.beginPath(); ctx.arc(1, 5, lr - 2, a0, a1, true); ctx.stroke();

  }

  ctx.restore();

}



function drawShoe(x,y,col,back){

  ctx.fillStyle = back ? shade(col,-0.2) : col;

  ctx.beginPath(); ctx.ellipse(x+1, y+2, 7, 5, 0, 0, Math.PI*2); ctx.fill();

}



/* ---------------- 战斗逻辑 ---------------- */

function hurtbox(f){

  /* 蹲下时受击框变矮：上段攻击从头顶掠过 */

  var squat = (f.state === 'block' && f.onGround);

  var hh = (squat ? 98 : 132) * SC;

  var ww = (squat ? 54 : 50) * SC;

  /* 龙王形态体宽翻倍，受击框跟着放宽，不然看着打不到 */
  if (f.c.id === 'gp' && f.form) ww = (squat ? 74 : 78) * SC;

  return { x: f.x-ww/2, y: FLOOR_Y - f.y - hh, w: ww, h: hh };

}

function hitboxOf(f, m){

  var w = (m.range || 90)*SC, h = (m.h || 48)*SC;

  var x = f.facing > 0 ? f.x + 8*SC : f.x - 8*SC - w;

  var y = FLOOR_Y - f.y + (m.y || -104)*SC;

  return { x:x, y:y, w:w, h:h };

}

function aabb(a,b){

  return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y;

}



function spawnSpark(x,y,big,col){

  var n = big ? 14 : 8;

  for (var i=0;i<n;i++){

    var a = Math.random()*Math.PI*2, sp = (big?260:150)*(0.4+Math.random());

    G.hitspark.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-40,life:0.32,max:0.32,col:col||'#ffd88a',r:big?4:2.6});

  }

}

function addPop(x,y,text,col,opt){

  opt = opt || {};

  G.pops.push({x:x,y:y,text:text,life:opt.life||0.8,col:col||'#fff',

               size:opt.size||20, crit:!!opt.crit});

}



function applyHit(att, def, m, hitX, hitY){

  /* 闪避无敌：滑步期间不吃任何判定，只在第一次挡下时弹提示 */

  if (def.dodgeT > 0){

    if (!def._dodgePop || G.t - def._dodgePop > 0.45){

      def._dodgePop = G.t;

      addPop(def.x, FLOOR_Y - def.y - 150*SC, '闪避', '#9fe8ff', { size:18, life:0.55 });

      G.rings.push({ x:def.x, y:FLOOR_Y - def.y - 70*SC, t:0, life:0.28, col:'#9fe8ff' });

      SFX.whiff();

    }

    return;

  }

  var dmgBase = m.dmg || 6;

  var crouching = (def.state === 'block');

  /* 下段（扫腿 / 上勾 / 推掌）无视蹲防，蹲着直接吃满 */

  var blocked = crouching && m.lvl !== 'low';

  var dmg = dmgBase * att.c.dmg * (att.power || 1) * (blocked ? 0.5 : 1);

  dmg = Math.max(1, Math.round(dmg));



  // 暴击：格挡不触发

  var crit = !blocked && Math.random() < CRIT_RATE;

  if (crit){

    dmg = Math.max(2, Math.round(dmg * CRIT_MULT));

    if (att === P1) G.crit[0]++; else G.crit[1]++;

  }



  // Claude 的宪法之盾：受击时反击

  if (!blocked && def.shield > 0 && def.state === 'attack' && def.atk.m.type === 'counter' && !def.atk.counterArmed){

    def.atk.counterArmed = true;

    def.shield = 0;

    // 反击成立：反打攻击者

    G.freeze = 0.09; G.shake = 10; G.flash = 0.18;

    SFX.heavy();

    spawnSpark(hitX, hitY, true, '#ffd79a');

    counterHit(def, att);

    return;

  }



  def.hp = Math.max(0, def.hp - dmg);

  def.flash = 0.18;

  def.hurtT = 0.22;

  att.meter = Math.min(100, att.meter + (m.meter || 8) * (blocked ? 0.35 : 1));

  def.meter = Math.min(100, def.meter + (blocked ? 5 : 4));



  if (blocked){

    G.freeze = 0.035; G.shake = 3;

    SFX.block();

    spawnSpark(hitX, hitY, false, '#cfe0ff');

    def.kbv = att.facing * (m.kb||80) * 0.35;

    if (def.hp <= 0) doKO(def, att);

    return;

  }



  /* ---------- 硬体 / 霸体：吃伤害但不进受击状态 ---------- */

  var arm = (def.state === 'attack' && def.atk) ? def.atk.armor : null;

  var armOn = (arm === 'super') || (arm === 'hard' && def.atk.armorLeft > 0);

  if (armOn && def.hp > 0){

    if (arm === 'hard') def.atk.armorLeft--;

    var armCol = (arm === 'super') ? '#ffd23f' : '#ffa63d';

    def.flash = 0.22;

    def.hurtT = Math.max(def.hurtT, 0.14);

    def.atk.armorT = 0.42;

    G.freeze = Math.max(G.freeze, 0.05);

    G.shake = Math.max(G.shake, 7);

    SFX.armor();

    spawnSpark(hitX, hitY, false, armCol);

    for (var aq = 0; aq < 2; aq++){

      G.rings.push({ x:hitX, y:hitY, t:-aq*0.05, life:0.34, col:armCol });

    }

    addPop(hitX, hitY - 46, (arm === 'super') ? '霸 体' : '硬 体', armCol, { size:17, life:0.5 });

    if (att.combo > 0){ att.combo = 0; att.comboT = 0; }

    if (def.hp <= 0) doKO(def, att);

    return;

  }



  // 连击

  if (crouching && !blocked) addPop(def.x, FLOOR_Y-158, '破 蹲', '#ff9a9a', { size:18, life:0.55 });

  if (att.atk) att.atk.hitCount = (att.atk.hitCount || 0) + 1;

  if (m.sig === 'steps' && att.atk){

    var stp = ['① 假设', '② 推导', '③ 结论'][Math.min(2, att.atk.hitCount-1)];

    addPop(att.x, FLOOR_Y-212, stp, '#8ab4ff');

  }

  if (m.sig === 'parallel' && att.atk && att.atk.hitCount % 2 === 0){

    addPop(att.x, FLOOR_Y-212, '并行 ' + att.atk.hitCount, '#8ee0c4');

  }

  att.combo++;

  att.comboT = 1.4;

  G.freeze = (m.type || m.kind === 'light3' || m.kind === 'heavy') ? 0.046 : 0.030;

  G.shake = 8 + Math.min(10, dmg*0.5);

  SFX.hit();

  if (crit){

    G.freeze += 0.028;

    G.shake += 7;

    G.critFlash = 0.24;

    spawnSpark(hitX, hitY, true, '#ffd84a');

    spawnSpark(hitX, hitY, true, '#fff4b8');

    G.rings.push({ x:hitX, y:hitY, t:0, life:0.36, col:'#ffe066' });

    addPop(hitX, hitY-74, '暴击 ' + dmg, '#ffdf5e', { size:32, life:1.05, crit:true });

    SFX.crit();

  } else {

    spawnSpark(hitX, hitY, dmg > 9, m.color || '#ffd88a');

    addPop(hitX, hitY-10, String(dmg), '#ffe9a8');

  }



  def.state = 'hit';

  def.st = 0;

  def.hitDur = m.hitstun || 0.3;

  def.atk = null;

  if (def.fly) exitFlight(def, true);

  def.shield = 0;

  def.kbv = att.facing * (m.kb || 80);

  def.facing = (att.x >= def.x) ? 1 : -1;   /* 按位置定朝向，别用取反 */

  def.lastHitBy = att;

  if (m.debuff === 'confuse'){ def.confuseT = Math.max(def.confuseT, 1.3); addPop(def.x, FLOOR_Y-206, '困惑', '#b48cff'); }

  if (m.launch){ def.vy = 340; def.onGround = false; }



  // 连击数飘字

  if (att.combo >= 2 && !att.isCPU){

    addPop(att.x, FLOOR_Y - 190, att.combo + ' HIT', '#8ee0c4');

  }



  if (def.hp <= 0) doKO(def, att);

}



/* 龙吼冲击波：近距离一击 + 视觉震屏，属于必杀的起手式 */

function roarBurst(f, o, m){

  var col = m.color || '#b6ffe4';

  G.shake = 22;

  G.flash = 0.28;

  G.freeze = 0.10;

  SFX.super();

  G.rings.push({ x:f.x + f.facing*26, y:FLOOR_Y - 120, t:0, life:0.55, col:col });

  G.rings.push({ x:f.x + f.facing*26, y:FLOOR_Y - 120, t:0, life:0.70, col:'#ffffff' });

  spawnSpark(f.x + f.facing*54, FLOOR_Y - 148, true, col);

  spawnSpark(f.x + f.facing*54, FLOOR_Y - 148, true, '#ffffff');

  if (!o.ko && Math.abs(o.x - f.x) < (m.roarRange || 300)){

    var rm = { dmg:(m.roarDmg || 10), kb:150, hitstun:0.46, lvl:'mid', meter:6, color:col };

    applyHit(f, o, rm, o.x, FLOOR_Y - 140);

  }

}



function counterHit(def, att){

  var m = def.atk.m;

  var crit = Math.random() < CRIT_RATE;

  var dmg = Math.round((m.dmg||14) * def.c.dmg * 1.25);

  if (crit){

    dmg = Math.round(dmg * CRIT_MULT);

    if (def === P1) G.crit[0]++; else G.crit[1]++;

  }

  att.hp = Math.max(0, att.hp - dmg);

  att.flash = 0.2; att.hurtT = 0.24;

  att.state = 'hit'; att.st = 0; att.hitDur = 0.5; att.atk = null;

  att.kbv = def.facing * 260;

  att.facing = (def.x >= att.x) ? 1 : -1;

  def.meter = Math.min(100, def.meter + 12);

  addPop(att.x, FLOOR_Y - 170, '反驳成立', '#ffd79a');

  if (crit){

    G.critFlash = 0.2; G.shake += 6;

    G.rings.push({ x:att.x, y:FLOOR_Y-190, t:0, life:0.34, col:'#ffe066' });

    addPop(att.x, FLOOR_Y - 214, '暴击 ' + dmg, '#ffdf5e', { size:30, life:1.0, crit:true });

    SFX.crit();

  }

  if (att.hp <= 0) doKO(att, def);

}



function doKO(def, att){

  if (def.ko) return;

  def.ko = true;

  def.state = 'ko';

  def.koT = 0;

  def.kbv = att.facing * 260;

  def.vy = 320;

  G.freeze = 0.22;

  G.shake = 16;

  G.flash = 0.3;

  SFX.ko();

  G.msg = 'K.O.';

  G.msgSub = att.c.name + ' 拿下这一回合';

}



function endRound(winner){

      G.state = 'result';

      G.resultSel = (G.winner === P2) ? 1 : 0;

      G.endT = 0;

      G.round++;

      resetRound();

    }

  }, 2100);

}

}



/* ---------------- 更新 ---------------- */

function fighterUpdate(f, o, dt){

  f.t += dt;

  if (f.flash > 0) f.flash -= dt;

  if (f.hurtT > 0) f.hurtT -= dt;

  if (f.comboT > 0){ f.comboT -= dt; if (f.comboT <= 0) f.combo = 0; }

  if (f.sayT > 0) f.sayT -= dt;

  if (f.confuseT > 0) f.confuseT -= dt;

  if (f.formT > 0) f.formT -= dt;

  if (f.atk && f.atk.armorT > 0) f.atk.armorT -= dt;



  // 二阶段：残血自动变身（一回合一次）

  if (!f.form && f.c.stage2 && f.hp > 0 && f.hp <= f.maxhp*0.45) awaken(f);



  if (f.state === 'ko'){

    f.koT += dt;

    f.x += f.kbv*dt; f.kbv *= Math.pow(0.02, dt);

    f.y += f.vy*dt; f.vy -= GRAV*dt;

    if (f.y <= 0){ f.y = 0; f.vy = 0; }

    return;

  }



  // 位移衰减

  f.x += f.kbv*dt; f.kbv *= Math.pow(0.0005, dt);



  /* 闪避滑步：起步快、末段收，整段判定为无敌 */

  if (f.dodgeT > 0){

    f.dodgeT -= dt;

    f.x += f.dodgeVX*dt;

    f.dodgeVX *= Math.pow(0.10, dt);

    if (f.dodgeT <= 0 || Math.abs(f.dodgeVX) < 24) f.dodgeVX = 0;

  } else if (f.dodgeVX !== 0){

    f.dodgeVX = 0;

  }



  var cmd = f.isCPU ? aiCommand(f, o, dt) : playerCommand(f);

  /* 跳跃按键的「按下瞬间」：二段跳必须靠边沿触发，长按不能连跳 */
  var jumpEdge = !!cmd.jump && !f._jumpHeld;

  /* 键盘点按缓冲：只在这一帧算一次边沿，然后立刻消费掉 */

  if (!f.isCPU && Input.jumpTap > 0){ jumpEdge = true; Input.jumpTap = 0; }
  if (cmd.jump) f._jumpHeld = true; else f._jumpHeld = false;

  /* 闪避键同样只认「按下瞬间」，按住不会连续翻滚 */
  var dodgeEdge = !!cmd.dodge && !f._dodgeHeld;

  if (!f.isCPU && Input.dodgeTap > 0){ dodgeEdge = true; Input.dodgeTap = 0; }

  /* 飞行模式的升降：按住跳跃上升、按住下蹲下降（手柄用上下） */
  var holdUp = f.isCPU ? !!cmd.jump : (Input.joy.active ? Input.joy.dy < -0.45 : Input.up);

  var holdDn = f.isCPU ? !!cmd.block : (Input.joy.active ? Input.joy.dy > 0.45 : Input.block);
  if (cmd.dodge) f._dodgeHeld = true; else f._dodgeHeld = false;

  if (f.dodgeCd > 0) f.dodgeCd -= dt;
  if (f.dodgeFx > 0) f.dodgeFx -= dt;

  if (f.airJumpT > 0) f.airJumpT -= dt;

  var actionable = (f.state === 'idle' || f.state === 'walk');



  /* 面向：除「出招中」锁定朝向以外，任何状态（含受击 / 蹲防 / 腾空）都

     立刻转向对手。旧版只在 idle/walk 且落地时才更新，被击退穿过对手后

     就会一直背对敌人，看起来就是「方向反了」。 */

  if (f.state !== 'attack' && !f.ko){

    f.facing = (o.x >= f.x) ? 1 : -1;

  }



  // 状态推进

  if (f.state === 'attack'){

    var m = f.atk.m;

    var e = f.st;

    /* 龙吼：起手过半先放一圈全屏龙威，再压上去撞 */

    if (m.roar && !f.atk.roared && e >= m.startup*m.roar){

      f.atk.roared = true;

      roarBurst(f, o, m);

    }

    // 冲刺位移

    if (m.lunge && e >= m.startup*0.6 && e <= m.startup + m.active){

      f.x += f.facing * m.lunge * dt;

    }

    // 发射弹幕

    if (m.type === 'shot' || m.type === 'rain'){

      var total = m.shots || 1;

      var window = m.active;

      /* 多发要均匀铺在 active 里，而且第一发必须在 startup 结束的那一帧就打出去。
         旧写法 floor(prog*total) 单发时要等 prog 到 1.0（active 最后一瞬）才成立，
         帧率一抖就整发丢掉，平A 看起来像没出手。 */
      var want = 0;

      if (e >= m.startup){

        var progS = clamp((e - m.startup)/Math.max(0.001, window), 0, 1);

        want = Math.min(total, 1 + Math.floor(progS * total * 0.999));

      }

      while (f.atk.shotsFired < want && f.atk.shotsFired < total){

        fireShot(f, m, f.atk.shotsFired);

        f.atk.shotsFired++;

      }

    }

    /* 瞬身：每一段都贴到对手身后，配合短 gap 打出连续斩 */
    if (m.type === 'blink' && o){
      /* 瞬身全程锁定「面向对手」，否则闪到背后会背身出刀 */
      f.facing = (o.x >= f.x) ? 1 : -1;
      var nb = m.blinks || 1;
      var t0 = m.startup*0.50;
      var per = Math.max(0.02, (m.active - 0.05)/Math.max(1, nb));
      if (e >= t0 && f.atk.blinked < nb){
        var wantB = Math.min(nb, Math.floor((e - t0)/per) + 1);
        while (f.atk.blinked < wantB && f.atk.blinked < nb){ blinkStep(f, o, m); f.atk.blinked++; }
      }
    }

    /* 俯冲类招式（龙翼俯冲 / 空中下劈）：把角色按着往下压，落点就是判定框 */

    if (m.sink){

      var sk = clamp((e - m.startup*0.45)/Math.max(0.001, m.startup*0.55), 0, 1);

      if (sk > 0 && f.vy > -m.sink) f.vy = lerp(f.vy, -m.sink, Math.min(1, dt*11));

    }



    if (e >= totalDur(m)){

      f.state = f.onGround ? 'idle' : 'jump'; f.st = 0; f.atk = null;

      f.shield = 0;

    }

  }

  else if (f.state === 'hit'){

    if (f.st >= f.hitDur){ f.state = 'idle'; f.st = 0; }

  }

  else if (f.state === 'block'){

    /* 蹲着按平A：直接扫地（不再起身），技能照旧起身 */

    if (!f.isCPU && Input.buf && Input.buf.act){

      var cb = Input.buf.act;

      if (cb === 'l' || cb === 'h'){

        if (startAttack(f, 'lS')){ f.chain = 0; Input.buf = null; }

      } else {

        f.state = 'idle'; f.st = 0;

      }

    }

    else if (!cmd.block){ f.state = 'idle'; f.st = 0; }

  }

  else if (f.state === 'jump'){

    /* 二段跳：空中还能再跳一次（按下的那一帧才生效） */

    if (jumpEdge && f.jumpsLeft > 0 && f.confuseT <= 0){

      /* GPT 白龙娘：第二次蹬空改为展翼悬停 */
      if (f.c.id === 'gp') enterFlight(f);
      else if (f.c.id === 'cl') enterHover(f);
      else doAirJump(f);

    }

    /* 空中平A：按轻/重都能出，落招后落地即取消后摇 */

    var abuf = f.isCPU ? cmd.atk : (Input.buf && Input.buf.act ? Input.buf.act : null);

    }

    if (f.state !== 'jump'){ /* 已经进入闪避，跳过空中平A */ }

    else if (abuf && f.y > 12 && f.confuseT <= 0 && airKit(f)){

      var fkey = null;

    }

  }

  else if (actionable && dodgeEdge && f.dodgeCd <= 0 && f.confuseT <= 0){

    /* 闪避优先级最高：地面随时可用，能打断走位，用来穿技能 */

  }

  else if (actionable){

      } else if (buf === 'h'){

        key = 'hv';

      } else if (buf === 's1'){ key = 's1'; }

      else if (buf === 's2'){ key = 's2'; }

      else if (buf === 'su'){ key = 'su'; }



      if (key === 's1' && f.meter >= f.c.s1.cost){ key = 's1'; }

      else if (key === 's1'){ key = null; }



      if (key){

        var ok = startAttack(f, key);

        if (ok){

          if (buf === 'l'){ f.chain = (f.chainT>0) ? (f.chain+1)%3 : 1; f.chainT = 0.85; }

          else f.chain = 0;

          if (!f.isCPU) Input.buf = null;

        } else if (buf === 's1' || buf === 's2'){

          if (!f.isCPU) Input.buf = null;

          addPop(f.x, FLOOR_Y-176, '能量不足', '#ff9a9a');

        }

        cmd.moved = true;

      }

    }



    if (f.state !== 'attack'){

      // 防御

      if (cmd.block && f.onGround){

        f.state = 'block'; f.st = 0;

      }

      // 跳跃

      else if (jumpEdge && f.onGround){

        f.vy = JUMP_V; f.onGround = false; f.state = 'jump'; f.st = 0;

        f.jumpsLeft = 1; f.airJumpT = 0;

        SFX.jump();

        jumpDust(f);

      }

    }

  }



  // 空中

  if (!f.onGround){



    if (f.fly){



      /* 飞行：不吃重力。按住跳缓升、按住蹲缓降，松手悬停 */

      f.flyT -= dt;

      if (f.flyEnter > 0) f.flyEnter -= dt;

      if (f.state === 'idle' || f.state === 'walk'){ f.state = 'jump'; f.st = 0; }



      if (f.state !== 'attack'){

        var wantV = 0;

        if (holdUp) wantV = 250;

        /* 飞行中的横向控制：比地面略快一点，但比不上地面冲刺 */

      f.y += f.vy*dt;

      var flyCap = (f.c.id === 'gp') ? (f.form ? 244 : 220) : 188;

      if (f.y > flyCap){ f.y = flyCap; if (f.vy > 0) f.vy = 0; }



      if (f.flyT <= 0) exitFlight(f, true);



      if (f.y <= 0){

        f.y = 0; f.vy = 0; f.onGround = true;

        var wasFly = f.fly;

        f.jumpsLeft = 2;

        f.dodgeUsed = false;

        if (f.state === 'jump'){ f.state='idle'; f.st=0; }

        else if (f.state === 'attack' && f.atk.m.air && f.atk.m.type !== 'rain'){ f.state='idle'; f.st=0; f.atk=null; }

        if (wasFly) jumpDust(f);

    } else {

      f.y += f.vy*dt;

      if (f.y <= 0){

        f.y = 0; f.vy = 0; f.onGround = true;

        f.jumpsLeft = 2;

        f.dodgeUsed = false;

        if (f.state === 'jump'){ f.state='idle'; f.st=0; }

        else if (f.state === 'attack' && f.atk.m.air && f.atk.m.type !== 'rain'){ f.state='idle'; f.st=0; f.atk=null; }

      }



    }

  }



  // 地面移动

  if (actionable && f.state !== 'attack' && !cmd.block && f.onGround){

    var dir = cmd.dir;

    if (dir !== 0){

      var spd = f.c.speed * (f.spdMul || 1) * (dir === f.facing ? 1 : 0.82);

      if (f.confuseT > 0) spd *= 0.4;

      f.x += dir * spd * dt;

    }

  if (f.chainT > 0){ f.chainT -= dt; if (f.chainT <= 0) f.chain = 0; }

  if (f.airChainT > 0){ f.airChainT -= dt; if (f.airChainT <= 0) f.airChain = 0; }



  // 边界

  f.x = clamp(f.x, WALL_PAD, ARENA_W-WALL_PAD);



  /* 保险：只在出招状态才保留 atk。
     万一有别的分支把 state 改走，残留的 atk 会变成「看不见的判定」。 */
  if (f.state !== 'attack' && f.atk) f.atk = null;

  // 状态计时

  f.st += dt;



  // 计时器上的必杀可用提示

  if (f.meter >= 100 && !f._suSaid){ f._suSaid = true; addPop(f.x, FLOOR_Y-200, '必杀就绪', '#ffe9a8'); }

  if (f.meter < 100) f._suSaid = false;

}



function playerCommand(f){

function aiCommand(f, o, dt){

  var dist = Math.abs(f.x - o.x);

  var wallL = f.x < WALL_PAD + 90, wallR = f.x > ARENA_W - WALL_PAD - 90;

  var pinned = (wallL || wallR) && dist < 220;   // 被压在墙角



  if (f.aiActT > 0) f.aiActT -= dt;



  /* 一个动作走完再重新决策：避免「半步一抖」的拉扯感 */

  if (f.aiActT <= 0){

    var act = null;

    var meterReady = f.meter >= 100;

    var s1Ready = f.meter >= f.c.s1.cost;

    var s2Ready = f.meter >= f.c.s2.cost;



    /* 有弹幕朝自己飞过来：先格挡，别直挺挺走过去吃满
       （Claude 娘的平A 全是远程，没这条 AI 会被弹到死） */
    /* GPT 娘腾空后大概率再蹬一次，展开双翼打空战 */

    var wantFly = ((f.c.id === 'gp' || f.c.id === 'cl') && !f.onGround && !f.fly && f.jumpsLeft > 0 && f.state === 'jump' && Math.random() < 0.7);



    var incoming = false;

    for (var pj = 0; pj < G.projectiles.length; pj++){

      var pp = G.projectiles[pj];

      if (pp.owner === f) continue;

      var gapP = Math.abs(pp.x - f.x);

      if ((pp.vx > 0 && pp.x < f.x - 8) || (pp.vx < 0 && pp.x > f.x + 8) ||
          (pp.vy > 0 && pp.y < FLOOR_Y - f.y - 40)){ incoming = true; break; }

    }

    if (wantFly){ act = { jump:true, t:0.16 }; }



    else if (incoming && f.onGround && f.state !== 'attack' && Math.random() < 0.62){

      act = { block:true, t:0.34 };

    }

    else if (f.c.zoner){

      /* Claude 娘：平A 全是远程符文弹，贴脸反而吃亏。
         AI 拉开距离对轰，被贴身就后撤或用「宪法护栏」反击。 */
      var zr = Math.random();

      if (pinned && dist < 200){

        if (s2Ready && zr < 0.46) act = { atk:'s2', t:0.36 };

        else if (meterReady && zr < 0.70) act = { atk:'su', t:0.34 };

        else act = { atk:'l', t:0.28 };

      }

      else if (dist < 120){

        if (s2Ready && o.state === 'attack' && zr < 0.58) act = { atk:'s2', t:0.36 };

        else if (zr < 0.78) act = { dir:-1, t:0.34 };

        else act = { atk:'h', t:0.32 };

      }

      else if (dist < 230){

        if (s2Ready && o.state === 'attack' && zr < 0.26) act = { atk:'s2', t:0.34 };

        else if (zr < 0.52) act = { dir:-1, t:0.30 };

        else act = { atk: (Math.random()<0.7?'l':'h'), t:0.30 };

      }

      else {

        if (meterReady && zr < 0.24) act = { atk:'su', t:0.36 };

        else if (zr < 0.64) act = { atk: (Math.random()<0.76?'l':'h'), t:0.28 };

        else if (zr < 0.82 && s1Ready) act = { atk:'s1', t:0.34 };

        else act = { dir:1, t:0.42 };

      }

    }

    else if (pinned){

      /* 贴墙：不再横跳，改成顶上去压制 / 蹲防找机会 */

      var pr = Math.random();

      if (meterReady && pr < 0.34) act = { atk:'su', t:0.34 };

      else if (pr < 0.62) act = { atk: (Math.random()<0.6?'l':'h'), t:0.30 };

      else if (pr < 0.82 && s1Ready) act = { atk:'s1', t:0.34 };

      else act = { block:true, t:0.40 };

    }

    else if (meterReady && dist < 170 && Math.random() < 0.50){

      act = { atk:'su', t:0.34 };

    }

    else if (o.state === 'attack' && dist < 150 && Math.random() < 0.38){

      act = (Math.random() < 0.28) ? { block:true, t:0.42 } : { dir:-1, t:0.32 };

    }

    else if (dist > 300){

      act = { dir:1, t:0.55 };

    }

    else if (dist > 190){

      act = (Math.random() < 0.20) ? { dir:1, jump:true, t:0.42 } : { dir:1, t:0.48 };

    }

    else if (dist > 115){

      var r = Math.random();

      if (r < 0.26 && s2Ready) act = { atk:'s2', t:0.36 };

      else if (r < 0.48 && s1Ready) act = { atk:'s1', t:0.36 };

      else if (r < 0.80) act = { dir:1, t:0.40 };

      else act = { atk: (Math.random()<0.6?'l':'h'), t:0.30 };

    }

    else {

      var q = Math.random();

      /* 对手蹲着：用连打第三段（下段）破蹲 */

      if (o.state === 'block' && Math.random() < 0.6) act = { atk:'l', t:0.26 };

      else if (q < 0.20 && s1Ready && f.c.s1.type !== 'channel') act = { atk:'s1', t:0.34 };

      else if (q < 0.26 && s2Ready && f.c.s2.type !== 'channel') act = { atk:'s2', t:0.34 };

      else if (q < 0.58) act = { atk: (Math.random()<0.65?'l':'h'), t:0.28 };

      else if (q < 0.74) act = { block:true, t:0.34 };

      else if (q < 0.88) act = { atk:'l', t:0.26 };

      else act = { dir:-1, t:0.30 };

    }

    f.aiAct = act;

    f.aiActT = act ? act.t : 0.24;

  }



  var a = (f.aiActT > 0) ? f.aiAct : null;

  if (!a) return { dir:0, jump:false, block:false, atk:null };



  /* a.dir 是「相对对手」的语义：+1 靠近、-1 拉开，这里映射成世界方向 */

  var toOpp = (o.x >= f.x) ? 1 : -1;

  var dir = 0;

  if (a.dir > 0) dir = toOpp;

  else if (a.dir < 0) dir = -toOpp;

  /* 贴墙时不许再往墙里走，避免原地踏步卡墙 */

  if (wallL && dir < 0) dir = 0;

  if (wallR && dir > 0) dir = 0;



  /* 飞行时间快耗尽时主动下沉，别一直飘在天上拖时间 */
  return { dir:dir, jump:!!a.jump, block:(f.fly && f.flyT < 2.3) ? true : !!a.block, atk:a.atk || null };

}



function fireShot(f, m, i){

  var y = FLOOR_Y - f.y + (m.y || -104) + 30;

  if (m.type === 'rain'){

    var tgt = P1 === f ? P2 : P1;

    var px = tgt.x + (i - (m.shots-1)/2) * 74 + (Math.random()-0.5)*20;

    G.projectiles.push({

      x: px, y: FLOOR_Y - 300 - i*10, vx: 0, vy: 260, r: 15, owner: f,

      dmg: m.dmg, kb: m.kb, hitstun: m.hitstun, color: m.color, life: 2.4,

      kind:'rain', text: ['图','文','音','视'][i%4], hit:false

    });

  } else {

    /* fly / pr / pdy / pvy 是「书页符文弹」用的参数，缺省时保持原来的行为 */
    var nAll = m.shots || 1;

    var fi = i - (nAll - 1)/2;

    var spd = (m.fly || 480) + fi*(m.spreadX || 0);

    var pr  = m.pr || 14;

    var off = m.poff || 34;

    var yy  = y + (m.pdy || 0);

    var vy  = (m.pvy || 0) + fi*(m.spreadY || 0);

    /* 立绘角色（Claude 娘）：弹从手里的书打出去，不从身体中线出来 */
    if (f.c.style === 'bob' && f._fistX !== undefined){

      off = clamp(f._fistX * SC + 6, 22, 96);

    }

    /* 贴脸时别把弹生成到对手背后，不然会直接穿过去 */
    var opp2 = (f === P1) ? P2 : P1;

    var gap2 = (opp2.x - f.x) * f.facing;

    if (gap2 > 0 && gap2 < off + 34) off = Math.max(14, gap2 - 36);

    G.projectiles.push({

      x: f.x + f.facing*off, y: yy, vx: f.facing * spd, vy: vy, r: pr, owner: f,

      dmg: m.dmg, kb: m.kb, hitstun: m.hitstun, color: m.color, life: 1.8,

      kind: m.wind ? 'wind' : (m.magic ? 'rune' : 'shot'), text: ['喻','理','例','证','论','证','章'][i%7],

      lvl: m.lvl || 'mid', launch: !!m.launch, big: !!m.big, hit:false,

      grow: m.grow || 0, rMax: m.rMax || 0

    });

    SFX.shot(f.c.id);

  }

}



function updateProjectiles(dt){

  for (var i = G.projectiles.length-1; i >= 0; i--){

    var p = G.projectiles[i];

    p.x += p.vx*dt;

    p.y += p.vy*dt;

    /* 蒸危墨影：越飞越大，撞上就炸 */

    if (p.grow && p.r < (p.rMax || 40)) p.r = Math.min(p.rMax || 40, p.r + p.grow*dt);

    p.life -= dt;

    if (p.life <= 0){ G.projectiles.splice(i,1); continue; }

    var tgt = (p.owner === P1) ? P2 : P1;

    if (!tgt.ko){

      var hb = hurtbox(tgt);

      var box = { x:p.x-p.r, y:p.y-p.r, w:p.r*2, h:p.r*2 };

      if (aabb(hb, box)){

        var m = { dmg:p.dmg, kb:p.kb, hitstun:p.hitstun, meter:6, color:p.color, lvl:p.lvl || 'mid', launch:!!p.launch };

        applyHit(p.owner, tgt, m, p.x, p.y);

        spawnSpark(p.x, p.y, true, p.color);

        G.projectiles.splice(i,1);

        continue;

      }

    }

    if (p.x < 0 || p.x > ARENA_W || p.y > FLOOR_Y+20) G.projectiles.splice(i,1);

  }

}



function resolveAttacks(dt){

  var pair = [[P1,P2],[P2,P1]];

  for (var i=0;i<2;i++){

    var att = pair[i][0], def = pair[i][1];

    if (att.state !== 'attack' || !att.atk || def.ko) continue;

    var m = att.atk.m;

    if (m.type === 'shot' || m.type === 'rain' || m.type === 'counter') continue;

    var e = att.st;

    if (e < m.startup || e > m.startup + m.active) continue;



    var box = hitboxOf(att, m);

    var hb = hurtbox(def);



    /* 蹲下时上段攻击从头顶掠过 */

    if (m.lvl === 'high' && def.state === 'block' && def.onGround){

      if (!att.atk.lastMissT || G.t - att.atk.lastMissT > 0.4){

        att.atk.lastMissT = G.t;

        addPop(def.x, FLOOR_Y-146, '躲过', '#9fe8ff', { size:17, life:0.5 });

        SFX.whiff();

      }

      continue;

    }



    if (!aabb(box, hb)) continue;



    var gap = m.gap || 0.99;

    if (e - att.atk.lastHitT < gap) continue;

    att.atk.lastHitT = e;



    var hx = clamp(box.x + box.w*0.5, hb.x, hb.x+hb.w);

    var hy = clamp(box.y + box.h*0.5, hb.y, hb.y+hb.h);

    applyHit(att, def, m, hx, hy);

  }

}



function pushApart(){

  if (!P1 || !P2) return;

  var minD = 46*SC;

  /* 空中也做阻挡（略松一点）：以前只有双方都在地面才互推，

     于是跳过去就能穿身换边，之后朝向、出招方向全乱。 */

  var air = (P1.y > 40 || P2.y > 40);

  var span = air ? minD*0.8 : minD;

  var d = P2.x - P1.x;

  if (Math.abs(d) < span){

    var push = (span - Math.abs(d)) * 0.5 * sign(d || 1);

    P1.x -= push; P2.x += push;

  }

  /* 禁止穿身：左右顺序一旦被打乱，重新摆回各自一侧（P1 恒在左） */

  if (P2.x < P1.x){

    var mid = (P1.x + P2.x) / 2;

    P1.x = mid + span*0.5;

    P2.x = mid - span*0.5;

  }

  P1.x = clamp(P1.x, WALL_PAD, ARENA_W-WALL_PAD);

  P2.x = clamp(P2.x, WALL_PAD, ARENA_W-WALL_PAD);

  /* 贴边时再兜一次，避免上面 clamp 又把两人挤到同一侧 */

  if (P2.x < P1.x + span*0.5){

    if (P1.x + span > ARENA_W-WALL_PAD){ P2.x = P1.x + span*0.5; }

    else { P1.x = P2.x - span*0.5; }

    P1.x = clamp(P1.x, WALL_PAD, ARENA_W-WALL_PAD);

    P2.x = clamp(P2.x, WALL_PAD, ARENA_W-WALL_PAD);

  }

}



function updateGame(dt){

  pollInput();

  G.t += dt;

  if (G.msgT > 0) G.msgT -= dt;
  if (G.artT > 0) G.artT -= dt;

  if (G.flash > 0) G.flash -= dt;

  if (G.critFlash > 0) G.critFlash -= dt;

  if (G.superT > 0) G.superT -= dt;

  if (G.shake > 0) G.shake = Math.max(0, G.shake - dt*40);



  if (G.state === 'fight'){

    if (G.intro > 0) G.intro -= dt;



    var sdt = dt;

    if (G.slow > 0){ G.slow -= dt; sdt = dt*0.62; }



    if (G.freeze > 0){

      G.freeze -= dt;

    } else {

      fighterUpdate(P1, P2, sdt);

      fighterUpdate(P2, P1, sdt);

      pushApart();

      resolveAttacks(sdt);

      updateProjectiles(sdt);

    }



    if (Input.buf){ Input.buf.t -= dt; if (Input.buf.t <= 0) Input.buf = null; }

    if (Input.jumpTap > 0){ Input.jumpTap -= dt; if (Input.jumpTap <= 0) Input.jumpTap = 0; }

    if (Input.dodgeTap > 0){ Input.dodgeTap -= dt; if (Input.dodgeTap <= 0) Input.dodgeTap = 0; }



    G.timer -= (G.freeze > 0 ? 0 : dt);

    if (G.timer <= 0){

      G.timer = 0;

      // 时间到，比血量

      var w = null;

      if (P1.hp > P2.hp) w = P1; else if (P2.hp > P1.hp) w = P2;

      if (w){

        G.msg = 'TIME UP'; G.msgSub = w.c.name + ' 判定获胜'; G.msgT = 2.2;

        doKO(w === P1 ? P2 : P1, w);

      } else {

        G.msg = 'DRAW'; G.msgSub = '体力相同，重开本回合'; G.msgT = 2.0;

        G.state = 'roundend';

        setTimeout(function(){ resetRound(); }, 1900);

      }

    }

  }



  else if (G.state === 'roundend' && P1 && P2){

    [P1,P2].forEach(function(f){

      if (f.flash > 0) f.flash -= dt;

      if (!f.ko) return;

      f.koT += dt;

      f.x += f.kbv*dt; f.kbv *= Math.pow(0.02, dt);

      f.y += f.vy*dt; f.vy -= GRAV*dt;

      if (f.y <= 0){ f.y = 0; f.vy = 0; }

    });

    if (G.superT > 0) G.superT -= dt;

  }



  // 镜头

  if (P1 && P2){

    G.camTarget = clamp((P1.x+P2.x)/2 - VIEW_W/2, 0, ARENA_W - VIEW_W);

    G.cam += (G.camTarget - G.cam) * Math.min(1, dt*5.5);

  }



  // 粒子

  for (var i=G.hitspark.length-1;i>=0;i--){

    var s = G.hitspark[i];

    s.life -= dt;

    s.x += s.vx*dt; s.y += s.vy*dt; s.vy += 900*dt; s.vx *= 0.96;

    if (s.life <= 0) G.hitspark.splice(i,1);

  }

  for (var k=G.rings.length-1;k>=0;k--){

    var rg = G.rings[k];

    rg.t += dt;

    if (rg.t >= rg.life) G.rings.splice(k,1);

  }

  for (var j=G.pops.length-1;j>=0;j--){

    var p = G.pops[j];

    p.life -= dt; p.y -= 34*dt;

    if (p.life <= 0) G.pops.splice(j,1);

  }

  BTN.forEach(function(b){ if (b.press > 0) b.press -= dt; });

}

var BLD = null;

function buildStage(){

  BLD = [[],[],[]];

  for (var l=0;l<3;l++){

    var x = -200;

    while (x < ARENA_W + 400){

      var w = 60 + srand()*(l===0?110:70);

      var h = (l===0? 150 : l===1? 210 : 260) + srand()*140;

      BLD[l].push({x:x, w:w, h:h, seed:Math.floor(srand()*9999)});

      x += w + 14 + srand()*26;

    }

  }

}

function drawStage(){

  // 夜空

  var sky = ctx.createLinearGradient(0,0,0,VIEW_H);

  sky.addColorStop(0,'#0d0a1e');

  sky.addColorStop(0.45,'#1d1740');

  sky.addColorStop(0.78,'#33295c');

  sky.addColorStop(1,'#120e24');

  ctx.fillStyle = sky; ctx.fillRect(0,0,VIEW_W,VIEW_H);



  // 星

  ctx.save();

  for (var i=0;i<60;i++){

    var sx = (i*137.5) % VIEW_W;

    var sy = (i*79.3) % 220;

    var al = 0.15 + Math.abs(Math.sin(G.t*0.7 + i))*0.5;

    ctx.globalAlpha = al;

    ctx.fillStyle = '#dcd8ff';

    ctx.fillRect(sx, sy, 1.6, 1.6);

  }

  ctx.restore();



  // 月亮

  var mx = 800 - G.cam*0.04, my = 96;

  var mg = ctx.createRadialGradient(mx,my,10,mx,my,86);

  mg.addColorStop(0,'rgba(220,214,255,0.55)');

  mg.addColorStop(1,'rgba(220,214,255,0)');

  ctx.fillStyle = mg;

  ctx.beginPath(); ctx.arc(mx,my,86,0,Math.PI*2); ctx.fill();

  ctx.fillStyle = '#f0ecff';

  ctx.beginPath(); ctx.arc(mx,my,30,0,Math.PI*2); ctx.fill();



  // 三层楼

  for (var l=0;l<3;l++){

    var par = [0.18, 0.34, 0.55][l];

    var col = ['#141128','#1a1636','#221c44'][l];

    var ox = -G.cam*par;

    for (var b=0;b<BLD[l].length;b++){

      var o = BLD[l][b];

      var bx = o.x + ox;

      if (bx > VIEW_W+120 || bx+o.w < -120) continue;

      var by = FLOOR_Y + 30 - o.h;

      ctx.fillStyle = col;

      ctx.fillRect(bx, by, o.w, o.h+60);

      // 窗

      var cols = Math.max(1, Math.floor(o.w/22));

      var rows = Math.max(2, Math.floor(o.h/26));

      for (var cx2=0; cx2<cols; cx2++){

        for (var ry=0; ry<rows; ry++){

          var v = ((o.seed + cx2*31 + ry*17) % 100);

          if (v > 62) continue;

          ctx.fillStyle = v%9===0 ? 'rgba(140,200,255,0.55)' : (v%5===0 ? 'rgba(255,200,140,0.42)' : 'rgba(150,160,230,0.22)');

          ctx.fillRect(bx+7+cx2*22, by+10+ry*26, 9, 12);

        }

      }

      // 顶部天线灯

      if (o.seed % 7 === 0){

        ctx.fillStyle = Math.sin(G.t*2 + o.seed) > 0 ? '#ff6b6b' : '#5a2a3a';

        ctx.beginPath(); ctx.arc(bx+o.w/2, by-4, 2.6, 0, Math.PI*2); ctx.fill();

      }

    }

  }



  // 数据流粒子

  ctx.save();

  for (var d=0; d<26; d++){

    var px = ((d*97 + G.t*22*(0.4+ (d%5)/5)) % (VIEW_W+80)) - 40 - G.cam*0.5%80;

    var py = (VIEW_H - ((G.t*40 + d*53) % (VIEW_H+120)));

    ctx.globalAlpha = 0.10 + (d%4)*0.05;

    ctx.fillStyle = d%3===0 ? '#8ee0c4' : '#7d6fe8';

    ctx.fillRect(px, py, 2, 16 + (d%3)*10);

  }

  ctx.restore();



  // 地面

  var gy = FLOOR_Y;

  var fg = ctx.createLinearGradient(0,gy,0,VIEW_H);

  fg.addColorStop(0,'#241f3c');

  fg.addColorStop(1,'#0b0916');

  ctx.fillStyle = fg;

  ctx.fillRect(0,gy,VIEW_W,VIEW_H-gy);



  // 地面网格（透视）

  ctx.strokeStyle = 'rgba(140,150,255,0.10)';

  ctx.lineWidth = 1;

  for (var k=0;k<=14;k++){

    var gx = (k*120 - (G.cam % 120)) - 60;

    ctx.beginPath(); ctx.moveTo(gx, gy); ctx.lineTo(gx + (gx-VIEW_W/2)*0.55, VIEW_H); ctx.stroke();

  }

  for (var r2=0;r2<5;r2++){

    var yy = gy + Math.pow(r2/4,1.8) * (VIEW_H-gy);

    ctx.globalAlpha = 0.5 - r2*0.08;

    ctx.beginPath(); ctx.moveTo(0,yy); ctx.lineTo(VIEW_W,yy); ctx.stroke();

  }

  ctx.globalAlpha = 1;



  // 地面边缘光

  var eg = ctx.createLinearGradient(0,gy-6,0,gy+16);

  eg.addColorStop(0,'rgba(120,140,255,0)');

  eg.addColorStop(0.5,'rgba(120,140,255,0.35)');

  eg.addColorStop(1,'rgba(120,140,255,0)');

  ctx.fillStyle = eg; ctx.fillRect(0,gy-6,VIEW_W,22);

}

function hpName(f){

function drawHPBar(x, y, w, h, ratio, flip, col, name, meter, isP1, form){

  ctx.save();

  // 底

  ctx.fillStyle = 'rgba(8,7,16,0.72)';

  rr(x-3, y-3, w+6, h+6, 6); ctx.fill();

  ctx.fillStyle = 'rgba(255,255,255,0.08)';

  rr(x, y, w, h, 4); ctx.fill();



  var bw = Math.max(0, w*clamp(ratio,0,1));

  var g = ctx.createLinearGradient(x, y, x, y+h);

  g.addColorStop(0, shade(col, 0.25));

  g.addColorStop(1, col);

  ctx.fillStyle = g;

  if (flip){ rr(x + w - bw, y, bw, h, 4); }

  else { rr(x, y, bw, h, 4); }

  ctx.fill();



  // 高光

  ctx.save();

  if (flip){ rr(x + w - bw, y, bw, h, 4); } else { rr(x, y, bw, h, 4); }

  ctx.clip();

  ctx.fillStyle = 'rgba(255,255,255,0.20)';

  rr(x, y, w, h*0.42, 4); ctx.fill();

  ctx.restore();



  // 名字

  ctx.font = '700 15px "PingFang SC","Microsoft YaHei",sans-serif';

  ctx.textBaseline = 'alphabetic';

  ctx.textAlign = flip ? 'right' : 'left';

  ctx.fillStyle = '#eae6ff';

  ctx.fillText(name, flip ? x+w : x, y-10);

  if (form){

    var tw2 = ctx.measureText(name).width;

    var bx2 = flip ? (x+w-tw2-34) : (x+tw2+8);

    ctx.fillStyle = 'rgba(169,220,255,0.94)';

    rr(bx2, y-27, 27, 18, 9); ctx.fill();

    ctx.fillStyle = '#0d1a33';

    ctx.font = '800 11px "PingFang SC",sans-serif';

    ctx.textAlign = 'center';

    ctx.fillText('II', bx2+13.5, y-13);

  }



  // 能量条

  var mw = w*0.82, mx2 = flip ? x+w-mw : x;

  ctx.fillStyle = 'rgba(255,255,255,0.10)';

  rr(mx2, y+h+7, mw, 7, 3.5); ctx.fill();

  var mfull = meter >= 100;

  ctx.fillStyle = mfull ? (Math.sin(G.t*9)>0 ? '#ffe9a8' : '#ffb84d') : '#6f8cf0';

  rr(mx2, y+h+7, mw*clamp(meter/100,0,1), 7, 3.5); ctx.fill();

  if (meter >= 50 && meter < 100){

    ctx.fillStyle = 'rgba(255,255,255,0.5)';

    ctx.fillRect(mx2 + mw*0.5, y+h+6, 1.5, 9);

  }

  ctx.restore();

}

/* Claude 娘的书页符文弹：一枚旋转法环包着飞出的纸页，后面拖光带。
   注意纸页要用正常混合画，否则叠在加色辉光上会糊成一团纯白。 */
function drawRuneBolt(p, x, y){

  var r = p.r;
  var t = G.t;
  var sgn = (p.vx >= 0) ? 1 : -1;
  var spin = t*3.4*sgn;

  ctx.save();

  /* 1) 光：拖尾 + 外圈辉光 + 断弧法环，全部加色混合 */
  ctx.globalCompositeOperation = 'lighter';

  for (var k=1;k<=4;k++){

    ctx.globalAlpha = 0.16/k;

    ctx.fillStyle = p.color;

    ctx.beginPath();

    ctx.ellipse(x - p.vx*0.008*k, y - p.vy*0.008*k,
                r*(1.45 - k*0.15), Math.max(1.2, r*(0.55 - k*0.07)), 0, 0, Math.PI*2);

    ctx.fill();

  }

  var g = ctx.createRadialGradient(x, y, r*0.2, x, y, r+9);

  g.addColorStop(0, 'rgba(255,255,255,0.52)');
  g.addColorStop(0.46, p.color);
  g.addColorStop(1, 'rgba(255,255,255,0)');

  ctx.globalAlpha = 0.52;
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(x, y, r+9, 0, Math.PI*2); ctx.fill();

  ctx.strokeStyle = p.color;

  for (var a2=0;a2<3;a2++){

    var s0 = spin + a2*2.094;

    ctx.globalAlpha = 0.72;
    ctx.lineWidth = p.big ? 2.4 : 1.7;
    ctx.beginPath(); ctx.arc(x, y, r*1.52, s0, s0 + 1.05); ctx.stroke();

  }

  if (p.big){

    ctx.globalAlpha = 0.30;
    ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.arc(x, y, r*1.94, -spin*0.6, -spin*0.6 + 4.2); ctx.stroke();

  }

  ctx.restore();

  /* 2) 纸页本体：正常混合，白纸 + 角色色描边 + 三行「字」 + 折角 */
  ctx.save();

  ctx.translate(x, y);
  ctx.rotate(Math.sin(t*7 + p.x*0.02)*0.20 + sgn*0.16);

  var pw = r*1.12, ph = r*1.46;

  ctx.shadowColor = p.color;
  ctx.shadowBlur = p.big ? 13 : 9;

  ctx.fillStyle = '#fffdf4';
  rr(-pw/2, -ph/2, pw, ph, 2.6); ctx.fill();

  ctx.shadowBlur = 0; ctx.shadowColor = 'rgba(0,0,0,0)';

  ctx.strokeStyle = p.color; ctx.lineWidth = 1.4;
  rr(-pw/2, -ph/2, pw, ph, 2.6); ctx.stroke();

  ctx.strokeStyle = 'rgba(140,102,64,0.50)'; ctx.lineWidth = 1;

  for (var l2=0;l2<3;l2++){

    var ly = -ph*0.16 + l2*ph*0.19;

    ctx.beginPath(); ctx.moveTo(-pw*0.29, ly); ctx.lineTo(pw*0.29, ly); ctx.stroke();

  }

  /* 右上折角 */
  ctx.fillStyle = p.color;
  ctx.globalAlpha = 0.55;
  ctx.beginPath();
  ctx.moveTo(pw*0.5, -ph*0.5 + ph*0.26);
  ctx.lineTo(pw*0.5, -ph*0.5);
  ctx.lineTo(pw*0.5 - pw*0.26, -ph*0.5);
  ctx.closePath(); ctx.fill();

  ctx.restore();

}

/* 风刃弹：两道反向旋转的半月风弧 + 中心气核 */
function drawWindBolt(p, x, y){
  var r = p.r;
  var dir = (p.vx < 0) ? -1 : 1;
  var ph = G.t*8 + p.x*0.02;
  ctx.save();
  ctx.translate(x, y);
  ctx.globalCompositeOperation = 'lighter';

  /* 背后的气流尾迹 */
  ctx.save();
  ctx.scale(dir, 1);
  ctx.lineCap = 'round';
  for (var k=1;k<=3;k++){
    ctx.globalAlpha = 0.26/k;
    ctx.strokeStyle = (k === 1) ? '#ffffff' : p.color;
    ctx.lineWidth = 2.4 - k*0.5;
    var tl = r*1.3 + k*r*1.5;
    var oy = (k - 2)*r*0.55;
    ctx.beginPath();
    ctx.moveTo(-tl, oy);
    ctx.quadraticCurveTo(-tl*0.45, oy*0.4 - r*0.4, 0, oy*0.6);
    ctx.stroke();
  }
  ctx.restore();

  /* 月牙刀风：前端薄、内侧凹，随飞行方向恒朝前 */
  ctx.save();
  ctx.scale(dir, 1);
  var hh = r*1.55, ff = r*1.35;
  var cg = ctx.createLinearGradient(-hh*0.3, 0, ff, 0);
  cg.addColorStop(0, 'rgba(255,255,255,0.10)');
  cg.addColorStop(0.45, 'rgba(246,254,255,0.92)');
  cg.addColorStop(1, p.color);
  ctx.beginPath();
  ctx.moveTo(-r*0.15, -hh);
  ctx.quadraticCurveTo(ff, 0, -r*0.15, hh);
  ctx.quadraticCurveTo(ff*0.42, 0, -r*0.15, -hh);
  ctx.closePath();
  ctx.fillStyle = cg;
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.95)';
  ctx.lineWidth = 1.4;
  ctx.stroke();

  /* 刃尖前的一道细切口 */
  ctx.globalAlpha = 0.55 + 0.25*Math.sin(ph*1.7);
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 1.6;
  ctx.beginPath();
  ctx.moveTo(ff*0.15, 0);
  ctx.lineTo(ff*1.55, 0);
  ctx.stroke();
  ctx.restore();

  /* 中心气核（小，衬在月牙里侧） */
  var g = ctx.createRadialGradient(-r*0.2, 0, 1, -r*0.2, 0, r*1.5);
  g.addColorStop(0, 'rgba(255,255,255,0.85)');
  g.addColorStop(0.45, p.color);
  g.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.globalAlpha = 0.45;
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(-r*0.2, 0, r*1.5, 0, Math.PI*2); ctx.fill();
  ctx.restore();
}

function drawProjectiles(){

  for (var i=0;i<G.projectiles.length;i++){

    var p = G.projectiles[i];

    var x = p.x - G.cam, y = p.y;

    if (p.kind === 'wind'){ drawWindBolt(p, x, y); continue; }
    if (p.kind === 'rune'){ drawRuneBolt(p, x, y); continue; }

    ctx.save();

    // 拖尾

    for (var k=1;k<=3;k++){

      ctx.globalAlpha = 0.18/k;

      ctx.fillStyle = p.color;

      ctx.beginPath(); ctx.arc(x - p.vx*0.012*k, y - p.vy*0.012*k, p.r*(1-k*0.15), 0, Math.PI*2); ctx.fill();

    }

    ctx.globalAlpha = 1;

    var g = ctx.createRadialGradient(x,y,2,x,y,p.r+8);

    g.addColorStop(0,'rgba(255,255,255,0.95)');

    g.addColorStop(0.35,p.color);

    g.addColorStop(1,'rgba(255,255,255,0)');

    ctx.fillStyle = g;

    ctx.beginPath(); ctx.arc(x,y,p.r+8,0,Math.PI*2); ctx.fill();



    ctx.fillStyle = '#1a1330';

    ctx.beginPath(); ctx.arc(x,y,p.r*0.72,0,Math.PI*2); ctx.fill();

    ctx.fillStyle = p.color;

    ctx.textAlign='center'; ctx.textBaseline='middle';

    ctx.font = '800 13px "PingFang SC",sans-serif';

    ctx.fillText(p.text || '论', x, y+0.5);

    ctx.restore();

  }

}



function drawEffects(){

  for (var i=0;i<G.hitspark.length;i++){

    var s = G.hitspark[i];

    var a = s.life/s.max;

    ctx.globalAlpha = a;

    ctx.fillStyle = s.col;

    ctx.beginPath(); ctx.arc(s.x - G.cam, s.y, s.r*a, 0, Math.PI*2); ctx.fill();

  }

  ctx.globalAlpha = 1;



  for (var k=0;k<G.rings.length;k++){

    var rg = G.rings[k];

    var kp = clamp(rg.t/rg.life, 0, 1);

    var kr = 14 + kp*74;

    ctx.save();

    ctx.globalAlpha = (1-kp)*0.9;

    ctx.strokeStyle = rg.col;

    ctx.lineWidth = 5.5*(1-kp) + 1;

    if (rg.ell){

      /* 贴地气浪：压扁的椭圆 */

      ctx.beginPath();

      ctx.ellipse(rg.x - G.cam, rg.y, kr, kr*0.36, 0, 0, Math.PI*2);

      ctx.stroke();

      ctx.restore();

      continue;

    }

    ctx.beginPath(); ctx.arc(rg.x - G.cam, rg.y, kr, 0, Math.PI*2); ctx.stroke();

    ctx.globalAlpha = (1-kp)*0.72;

    ctx.lineWidth = 3;

    for (var q=0;q<4;q++){

      var qa = q*Math.PI/2 + Math.PI/4;

      ctx.beginPath();

      ctx.moveTo(rg.x - G.cam + Math.cos(qa)*kr*0.55, rg.y + Math.sin(qa)*kr*0.55);

      ctx.lineTo(rg.x - G.cam + Math.cos(qa)*kr*1.3, rg.y + Math.sin(qa)*kr*1.3);

      ctx.stroke();

    }

    ctx.restore();

  }



  for (var j=0;j<G.pops.length;j++){

    var p = G.pops[j];

    var a2 = clamp(p.life/0.5, 0, 1);

    ctx.save();

    ctx.globalAlpha = a2;

    ctx.font = '800 ' + (p.size||20) + 'px "PingFang SC",sans-serif';

    ctx.textAlign = 'center';

    if (p.crit){

      var tw = ctx.measureText(p.text).width;

      var padX = 14, padY = 9;

      var bx = p.x - G.cam - tw/2 - padX, by = p.y - (p.size||20) + 2;

      ctx.fillStyle = 'rgba(12,8,24,0.88)';

      rr(bx, by, tw + padX*2, (p.size||20) + padY*2, 10); ctx.fill();

      ctx.strokeStyle = 'rgba(255,214,90,0.9)'; ctx.lineWidth = 2;

      rr(bx, by, tw + padX*2, (p.size||20) + padY*2, 10); ctx.stroke();

      ctx.shadowColor = 'rgba(255,200,50,0.9)';

      ctx.shadowBlur = 14;

    }

    ctx.lineWidth = p.crit ? 5 : 3;

    ctx.strokeStyle = 'rgba(10,8,20,0.85)';

    ctx.strokeText(p.text, p.x - G.cam, p.y);

    ctx.fillStyle = p.col;

    ctx.fillText(p.text, p.x - G.cam, p.y);

    ctx.restore();

  }

}

/* 只画身体（局部坐标，原点在髋部） */

function drawBodyLocal(f){

  var c = f.c;

  var P = buildPose(f);

  var D = dimsOf(f);

  var sh = { x: Math.sin(P.lean)*D.torso, y: -Math.cos(P.lean)*D.torso };

  var hd = { x: sh.x + Math.sin(P.lean+P.head)*D.headOff, y: sh.y - Math.cos(P.lean+P.head)*D.headOff };

  var aB = fk(sh.x, sh.y, P.armB[0], D.ua, P.armB[1], D.hand);

  var aF = fk(sh.x, sh.y, P.armF[0], D.ua, P.armF[1], D.hand);

  var lB = fk(0, 0, P.legB[0], D.leg, P.legB[1], D.leg);

  var lF = fk(0, 0, P.legF[0], D.leg, P.legF[1], D.leg);



  var drop = clamp(D.toes - Math.max(lF.ey, lB.ey), 0, (P.crouch||0) > 0 ? 38 : 14);



  if (c.style === 'whale'){ drawWhaleFigure(f, D, P, sh, hd, lF, lB); return; }

  if (c.style === 'bob' && drawClaudeSprite(f, D, P)) return;

  ctx.translate(0, drop);

  drawGpFigure(f, D, P, sh, hd, aF, aB, lF, lB);

}

function drawMessage(){

  if (G.msgT <= 0 || !G.msg) return;

  var a = clamp(G.msgT/0.35, 0, 1);

  ctx.save();

  ctx.globalAlpha = a;

  ctx.textAlign = 'center';

  var sc = 1 + (1 - clamp(G.msgT/2.2,0,1))*0.06;

  ctx.translate(VIEW_W/2, 210);

  ctx.scale(sc,sc);

  ctx.font = '900 52px "PingFang SC",sans-serif';

  ctx.lineWidth = 6; ctx.strokeStyle = 'rgba(10,8,20,0.8)';

  ctx.strokeText(G.msg, 0, 0);

  var g = ctx.createLinearGradient(0,-40,0,10);

  g.addColorStop(0,'#fff'); g.addColorStop(1,'#9db4ff');

  ctx.fillStyle = g;

  ctx.fillText(G.msg, 0, 0);

  if (G.msgSub){

    ctx.font = '600 15px "PingFang SC",sans-serif';

    ctx.fillStyle = 'rgba(225,222,255,0.85)';

    ctx.fillText(G.msgSub, 0, 32);

  }

  ctx.restore();

}



/* ---------------- 主循环 ---------------- */

var last = 0;

function frame(ts){

  var dt = last ? Math.min(0.05, (ts-last)/1000) : 0.016;

  last = ts;



  updateGame(dt);



  ctx.setTransform(DPR,0,0,DPR,0,0);

  ctx.fillStyle = '#06060b';

  ctx.fillRect(0,0,cv.width/DPR, cv.height/DPR);

  ctx.save();

  ctx.translate(OX, OY);

  ctx.scale(SCALE, SCALE);



  // 震屏

  var sh = G.shake;

  if (sh > 0){

    ctx.translate((Math.random()-0.5)*sh, (Math.random()-0.5)*sh);

  }



  if (G.state === 'title'){

    drawTitle();

  } else if (G.state === 'select'){

    drawSelect();

  } else if (G.state === 'fight' || G.state === 'roundend' || G.state === 'pause'){

    drawStage();

    // 角色（远处先画）

    var order = (P1.x < P2.x) ? [P1,P2] : [P2,P1];

    drawFighter(order[0]);

    drawFighter(order[1]);

    drawFighterFX(order[0]);

    drawFighterFX(order[1]);

    drawProjectiles();

    drawEffects();

    drawSuperFX();

    if (TOUCH_MODE) drawTouchUI(); else drawKeyHints();

    drawHUD();

    drawMessage();

    if (G.state === 'pause') drawPause();

  } else if (G.state === 'result'){

    drawResult();

  } else if (G.state === 'keys'){

    drawKeys();

  }



  // 暴击金色闪光

  if (G.critFlash > 0){

    ctx.fillStyle = 'rgba(255,214,90,'+ (G.critFlash*0.18) +')';

    ctx.fillRect(0,0,VIEW_W,VIEW_H);

  }



  // 闪光

  if (G.state === 'fight' || G.state === 'roundend') drawAwakeArt();

  if (G.flash > 0){

    ctx.fillStyle = 'rgba(255,255,255,'+ (G.flash*0.65) +')';

    ctx.fillRect(0,0,VIEW_W,VIEW_H);

  }



  ctx.restore();

  requestAnimationFrame(frame);

}



/* ---------------- 自适应 ---------------- */

function resize(){

  var w = window.innerWidth, h = window.innerHeight;

  var dpr = Math.min(window.devicePixelRatio || 1, 2.5);

  /* 内部渲染像素封顶：高分屏按原生 DPR 满速渲染时，每帧要填几百万像素，
     帧率掉到 30 以下，手感就变成「按键有延迟」。这里给内部缓冲设上限，
     画面由 CSS 拉伸，肉眼几乎看不出差别。 */
  var kk = Math.min(1, 1680/(w*dpr), 945/(h*dpr));

  DPR = Math.max(0.85, dpr*kk);

  cv.width = Math.floor(w*DPR);

  cv.height = Math.floor(h*DPR);

  cv.style.width = w+'px';

  cv.style.height = h+'px';

  SCALE = Math.min(w/VIEW_W, h/VIEW_H);

  OX = (w - VIEW_W*SCALE)/2;

  OY = (h - VIEW_H*SCALE)/2;

}

window.addEventListener('resize', resize);

window.addEventListener('orientationchange', function(){ setTimeout(resize, 120); });
