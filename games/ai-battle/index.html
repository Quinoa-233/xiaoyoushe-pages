function clamp(v,a,b){ return v<a?a:(v>b?b:v); }

function ease(t){ return t<0?0:(t>1?1:t*t*(3-2*t)); }

function rr(x,y,w,h,r){

  ctx.beginPath();

  ctx.moveTo(x+r,y);

  ctx.arcTo(x+w,y,x+w,y+h,r);

  ctx.arcTo(x+w,y+h,x,y+h,r);

  ctx.arcTo(x,y+h,x,y,r);

  ctx.arcTo(x,y,x+w,y,r);

  ctx.closePath();

}

function shade(hex, amt){

  var n = parseInt(hex.slice(1),16);

  var r = (n>>16)&255, g = (n>>8)&255, b = n&255;

  if (amt < 0){ r*= (1+amt); g*=(1+amt); b*=(1+amt); }

  else { r += (255-r)*amt; g += (255-g)*amt; b += (255-b)*amt; }

  return 'rgb('+Math.round(r)+','+Math.round(g)+','+Math.round(b)+')';

}

/* ---------------- 音效 ---------------- */

var AC = null, SFX_GAIN = null, _NZ = null;

function initAudio(){

  if (AC){

    if (AC.state === 'suspended'){ try { AC.resume(); } catch(e){} }

    return;

  }

  try {

    AC = new (window.AudioContext || window.webkitAudioContext)();

    SFX_GAIN = AC.createGain();

    SFX_GAIN.gain.value = 0.85;

    SFX_GAIN.connect(AC.destination);

  } catch(e){ AC = null; SFX_GAIN = null; }

}

/* 一段带低通的噪声，作为所有「挥空 / 打击 / 摩擦」声的底料。

   纯振荡器做不出拳风，噪声 + 扫频带通才像真的破空。 */

function nzBuf(){

  if (!AC) return null;

  if (_NZ) return _NZ;

  var n = Math.round(AC.sampleRate*0.6);

  var b = AC.createBuffer(1, n, AC.sampleRate);

  var d = b.getChannelData(0);

  var lp = 0;

  for (var i=0;i<n;i++){

    var w = Math.random()*2-1;

    lp = lp*0.62 + w*0.38;

    d[i] = lp*0.85 + w*0.15;

  }

  _NZ = b;

  return b;

}

/* dur 秒 / vol 音量 / f0→f1 带通扫频 / q 尖锐度 / type 滤波类型 */

function noise(dur, vol, f0, f1, q, type, delay){

  if (!AC) return;

  var src = AC.createBufferSource();

  src.buffer = nzBuf();

  if (!src.buffer) return;

  src.playbackRate.value = 0.88 + Math.random()*0.26;

  var flt = AC.createBiquadFilter();

  flt.type = type || 'bandpass';

  flt.Q.value = (q == null) ? 1.1 : q;

  var g = AC.createGain();

  var now = AC.currentTime + (delay || 0);

  flt.frequency.setValueAtTime(Math.max(40, f0), now);

  if (f1) flt.frequency.exponentialRampToValueAtTime(Math.max(40, f1), now+dur);

  g.gain.setValueAtTime(0.0001, now);

  g.gain.exponentialRampToValueAtTime(Math.max(0.0002, vol||0.04), now + Math.min(0.018, dur*0.3));

  g.gain.exponentialRampToValueAtTime(0.0001, now+dur);

  src.connect(flt); flt.connect(g); g.connect(SFX_GAIN || AC.destination);

  src.start(now); src.stop(now+dur+0.03);

}

function tone(freq, dur, type, vol, slideTo){

  if (!AC) return;

  var o = AC.createOscillator(), g = AC.createGain();

  o.type = type || 'square';

  var now = AC.currentTime;

  o.frequency.setValueAtTime(freq, now);

  if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(30,slideTo), now+dur);

  g.gain.setValueAtTime(vol||0.06, now);

  g.gain.exponentialRampToValueAtTime(0.0001, now+dur);

  o.connect(g); g.connect(SFX_GAIN || AC.destination);

  o.start(now); o.stop(now+dur+0.02);

}

var DEFAULT_BINDS = {

  left:'KeyA', right:'KeyD', jump:'KeyW', block:'KeyS', dodge:'KeyL',

  light:'KeyJ', heavy:'KeyK', s1:'KeyU', s2:'KeyI', su:'KeyO'

};

/* 方向键始终可用，作为备用键 */

var ALT_BINDS = {

  left:['ArrowLeft'], right:['ArrowRight'],

  jump:['Space','ArrowUp'], block:['ArrowDown'], dodge:['KeyH','ShiftLeft','ShiftRight']

};

/* 键位存档换到 v2：旧版本存过的键位（含左右可能相反）一律作废 */

var BIND_STORE = 'aifight.binds.v2';

var BINDS = (function(){

  var out = {};

  for (var k in DEFAULT_BINDS) out[k] = DEFAULT_BINDS[k];

  try {

    var raw = localStorage.getItem(BIND_STORE);

    if (raw){

      var o = JSON.parse(raw);

      var seen = {};

      for (var k2 in out){

        var v = (o && o[k2]);

        /* 只接受合法且不与其他动作重复的键 */

        if (typeof v === 'string' && v && !seen[v]) out[k2] = v;

        seen[out[k2]] = 1;

      }

    }

  } catch(e){}

  return out;

})();

function saveBinds(){ try { localStorage.setItem(BIND_STORE, JSON.stringify(BINDS)); } catch(e){} }

function swapLR(){

  var t = BINDS.left; BINDS.left = BINDS.right; BINDS.right = t;

  saveBinds();

}

function resetBinds(){

  for (var k in DEFAULT_BINDS) BINDS[k] = DEFAULT_BINDS[k];

  saveBinds();

}

function keyLabel(code){

  if (!code) return '—';

  if (code.indexOf('Key') === 0) return code.slice(3);

  if (code.indexOf('Digit') === 0) return code.slice(5);

  if (code.indexOf('Numpad') === 0) return '小' + code.slice(6);

  var m = {

    ArrowLeft:'←', ArrowRight:'→', ArrowUp:'↑', ArrowDown:'↓',

    Space:'空格', ShiftLeft:'Shift', ShiftRight:'Shift',

    ControlLeft:'Ctrl', ControlRight:'Ctrl', AltLeft:'Alt', AltRight:'Alt',

    Enter:'Enter', Tab:'Tab', Backquote:'~', Minus:'-', Equal:'=',

    Comma:',', Period:'.', Slash:'/', Semicolon:';', Quote:"'",

    BracketLeft:'[', BracketRight:']', Backslash:'\\'

  };

  return m[code] || code;

}

function logicalPos(e){

  var rect = cv.getBoundingClientRect();

  var cx = e.clientX - rect.left, cy = e.clientY - rect.top;

  return { x:(cx - OX)/SCALE, y:(cy - OY)/SCALE };

}

function dist(a,b,c,d){ return Math.hypot(a-c,b-d); }



function onDown(e){

  initAudio();

  var p = logicalPos(e);

  if (!TOUCH_MODE){

    // 桌面：鼠标只用于菜单点击

    if (G.state === 'fight' || G.state === 'roundend') return;

    handleMenuTap(p);

    return;

  }

  if (G.state === 'fight' || G.state === 'roundend'){

    if (p.x < VIEW_W*0.42 && !Input.joy.active){

      Input.joy.active = true; Input.joy.id = e.pointerId;

      Input.joy.dx = 0; Input.joy.dy = 0;

      Input.joy.ox = p.x; Input.joy.oy = p.y;

      return;

    }

    for (var i=0;i<BTN.length;i++){

      var b = BTN[i];

      if (dist(p.x,p.y,b.x,b.y) < b.r + 14){

        b.press = 0.1; b.pid = e.pointerId;

        if (b.id === 'block') Input.touchBlock = true;

        else Input.buf = { act:b.id, t:0.22 };

        return;

      }

    }

  } else {

    handleMenuTap(p);

  }

}

function onMove(e){

  if (Input.joy.active && e.pointerId === Input.joy.id){

    var p = logicalPos(e);

    var dx = p.x - Input.joy.ox, dy = p.y - Input.joy.oy;

    var d = Math.hypot(dx,dy);

    var max = Input.joy.r;

    if (d > max){ dx = dx/d*max; dy = dy/d*max; }

    Input.joy.dx = dx/max; Input.joy.dy = dy/max;

  }

}

function onUp(e){

  if (Input.joy.active && e.pointerId === Input.joy.id){

    Input.joy.active = false; Input.joy.dx = 0; Input.joy.dy = 0;

  }

  for (var i=0;i<BTN.length;i++){

    var b = BTN[i];

    if (b.pid === e.pointerId){

      b.pid = null;

      if (b.id === 'block') Input.touchBlock = false;

    }

  }

}



cv.addEventListener('pointerdown', onDown);

/* ---------------- 键位查询 ---------------- */

var keys = {};

/* 某个键是否已经被「主绑定」占用：被占用的键不再触发备用动作，
   否则玩家把轻攻击改到 Space 之后，按轻攻击会连跳跃一起触发。 */
function keyTaken(code){
  for (var k in BINDS){ if (BINDS[k] === code) return true; }
  return false;
}

function isDown(action){

  var c = BINDS[action];

  if (c && keys[c]) return true;

  var alts = ALT_BINDS[action];

  if (alts) for (var i=0;i<alts.length;i++){

    if (!keys[alts[i]]) continue;

    if (keyTaken(alts[i])) continue;

    return true;

  }

  return false;

}

function actionOfCode(code){

  for (var a in BINDS) if (BINDS[a] === code) return a;

  for (var b in ALT_BINDS) if (ALT_BINDS[b].indexOf(code) >= 0 && !keyTaken(code)) return b;

  return null;

}

  var gp = null;

  try {

    var pads = (navigator.getGamepads && navigator.getGamepads()) || [];

    for (var i=0;i<pads.length;i++){

      if (pads[i] && pads[i].connected){ gp = pads[i]; break; }

    }

  } catch(e){ gp = null; }

  G.padOn = !!gp;



  if (gp){

    var ax = gp.axes[0] || 0;

    var dl = gp.buttons[14] && gp.buttons[14].pressed;

    var dr = gp.buttons[15] && gp.buttons[15].pressed;

    if (!dir){

      if (dl || ax < -0.38) dir = -1;

      else if (dr || ax > 0.38) dir = 1;

    }

    if (!jump && gp.buttons[12] && gp.buttons[12].pressed) jump = true;

    if (!block && ((gp.buttons[13] && gp.buttons[13].pressed) || (gp.buttons[4] && gp.buttons[4].pressed))) block = true;

    if (!dodge && ((gp.buttons[5] && gp.buttons[5].pressed) || (gp.buttons[6] && gp.buttons[6].pressed))) dodge = true;



    var bmap = { 0:'light', 1:'heavy', 2:'s1', 3:'s2', 7:'su' };

    for (var bi in bmap){

      var bp = !!(gp.buttons[bi] && gp.buttons[bi].pressed);

      if (bp && !PAD_PREV[bi]) feedAction(bmap[bi]);

      PAD_PREV[bi] = bp;

    }

    var st = !!(gp.buttons[9] && gp.buttons[9].pressed);

    if (st && !PAD_PREV[9]) togglePause();

    PAD_PREV[9] = st;



    // 手柄在菜单里用十字键导航

    if (G.state !== 'fight' && G.state !== 'roundend'){

      var nav = { 12:[0,-1], 13:[0,1], 14:[-1,0], 15:[1,0] };

      for (var ni in nav){

        var np = !!(gp.buttons[ni] && gp.buttons[ni].pressed);

        if (np && !PAD_PREV['n'+ni]) menuNav(nav[ni][0], nav[ni][1]);

        PAD_PREV['n'+ni] = np;

      }

    }

  } else {

    PAD_PREV = {};

  }



  if (TOUCH_MODE && Input.joy.active){

    dir = Math.abs(Input.joy.dx) > 0.34 ? sign(Input.joy.dx) : 0;

    if (Input.joy.dy < -0.62 && !Input._joyJump){ jump = true; Input._joyJump = true; }

    if (Input.joy.dy > -0.35) Input._joyJump = false;

  }



  Input.dir = dir;

  Input.up = jump;

  Input.block = block || Input.touchBlock;

  Input.dodge = dodge;

}



/* 键盘按下 -> 动作 */

function feedAction(a){

  if (!a) return;

  if (G.state === 'fight'){

    /* 缓冲 0.34s：重击 / 技能的收招都在 0.3~0.4s，
       旧值 0.22 会让「后摇里按下的下一招」直接过期，玩起来就是按了没反应 */
    if (a === 'light') Input.buf = { act:'l', t:0.34 };

    else if (a === 'heavy') Input.buf = { act:'h', t:0.34 };

    else if (a === 's1') Input.buf = { act:'s1', t:0.34 };

    else if (a === 's2') Input.buf = { act:'s2', t:0.34 };

    else if (a === 'su'){

      if (P1 && P1.meter >= 100) Input.buf = { act:'su', t:0.25 };

    }

    return;

  }

  if (a === 'light' || a === 'heavy') menuConfirm();

}



/* ---------------- 暂停 / 全屏 ---------------- */

function pauseGame(){

  if (G.state !== 'fight') return;

  G.state = 'pause'; G.pauseSel = 0; SFX.ui();

}

function resumeGame(){

  if (G.state === 'pause'){

    G.state = 'fight';

    /* 暂停里按下的键不算数，回来时也不带着上一帧的输入 */
    Input.buf = null; Input.jumpTap = 0; Input.dodgeTap = 0;

    clearKeys();

    SFX.ui();

  }

}

function togglePause(){

  if (G.state === 'fight') pauseGame();

  else if (G.state === 'pause') resumeGame();

  else if (G.state === 'keys'){ G.state = G.keysFrom || 'title'; G.bindTarget = null; }

}

function toggleFullscreen(){

  try {

    if (!document.fullscreenElement){

      var el = document.documentElement;

      if (el.requestFullscreen) el.requestFullscreen();

      else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();

    } else {

      if (document.exitFullscreen) document.exitFullscreen();

      else if (document.webkitExitFullscreen) document.webkitExitFullscreen();

    }

  } catch(e){}

  SFX.ui();

}



/* ---------------- 键盘事件 ---------------- */

window.addEventListener('keydown', function(e){

  initAudio();

  var code = e.code;

  if (code === 'Space' || code.indexOf('Arrow') === 0 || code === 'Tab') e.preventDefault();

  if (e.repeat) return;



  // 键位设置页

  if (G.state === 'keys'){

    if (G.bindTarget){

      if (code === 'Escape'){ G.bindTarget = null; }

      else bindKey(code);

      return;

    }

    if (code === 'Escape'){ G.state = G.keysFrom || 'title'; SFX.ui(); return; }

    if (code === 'ArrowUp' || code === 'KeyW'){ G.bindRow = (G.bindRow + BIND_ORDER.length - 1) % BIND_ORDER.length; SFX.ui(); return; }

    if (code === 'ArrowDown' || code === 'KeyS'){ G.bindRow = (G.bindRow + 1) % BIND_ORDER.length; SFX.ui(); return; }

    if (code === 'Enter' || code === 'Space'){ G.bindTarget = BIND_ORDER[G.bindRow]; SFX.ui(); return; }

    if (code === 'KeyR'){ resetBinds(); SFX.ui(); return; }

    if (code === 'KeyX'){ swapLR(); SFX.ui(); return; }

    return;

  }



  if (code === 'Escape'){ togglePause(); return; }

  if (code === 'KeyF' && (G.state === 'title' || G.state === 'pause')){ toggleFullscreen(); return; }



  keys[code] = true;



  // 菜单导航

  if (G.state === 'title' || G.state === 'select' || G.state === 'result' || G.state === 'pause'){

    if (code === 'ArrowUp' || code === 'KeyW'){ menuNav(0,-1); return; }

    if (code === 'ArrowDown' || code === 'KeyS'){ menuNav(0,1); return; }

    if (code === 'ArrowLeft' || code === 'KeyA'){ menuNav(-1,0); return; }

    if (code === 'ArrowRight' || code === 'KeyD'){ menuNav(1,0); return; }

    if (code === 'Enter' || code === 'Space' || code === 'KeyJ'){ menuConfirm(); return; }

    return;

  }



  if (G.state === 'fight'){

    var act2 = actionOfCode(code);

    /* 游戏内把用到的键全部拦下：避免空格 / 方向键滚页、浏览器快捷键抢键 */


    e.preventDefault();

    if (act2 === 'jump') Input.jumpTap = 0.13;

    if (act2 === 'dodge') Input.dodgeTap = 0.13;

    feedAction(act2);

  }

});

window.addEventListener('keyup', function(e){

  keys[e.code] = false;

});

/* 切窗口时把按键状态全部清掉：旧版只暂停不清键，
   切回来会「一直按着方向往前冲 / 一直往右走」，看起来就像按键冲突。 */
function clearKeys(){
  keys = {};
  Input.jumpTap = 0; Input.dodgeTap = 0; Input.buf = null;
  if (P1){ P1._jumpHeld = false; P1._dodgeHeld = false; }
  if (P2){ P2._jumpHeld = false; P2._dodgeHeld = false; }
}

window.addEventListener('blur', function(){

  clearKeys();

  if (G.state === 'fight') pauseGame();

});

document.addEventListener('visibilitychange', function(){

  if (document.hidden) clearKeys();

});



/* 菜单交互 */

var PAUSE_BTN = [

  {x:330, y:212, w:300, h:42, act:'resume', label:'继续对战'},

  {x:330, y:262, w:300, h:42, act:'keys',   label:'键位设置'},

  {x:330, y:312, w:300, h:42, act:'full',   label:'切换全屏'},

  {x:330, y:362, w:300, h:42, act:'title',  label:'返回标题'}

];



function handleMenuTap(p){

  if (G.state === 'title'){ startSelect(); return; }



  if (G.state === 'select'){

    for (var i=0;i<3;i++){

      var bx = 168 + i*224;

      if (p.x > bx-96 && p.x < bx+96 && p.y > 176 && p.y < 420){

        G.selIdx = i; SFX.ui();

        if (G.selStep === 0){ G.pickP1 = i; G.selStep = 1; }

        else { startMatch(G.pickP1, i); }

        return;

      }

    }

    if (G.selStep === 1 && p.y > 448 && p.y < 496 && p.x > 366 && p.x < 594){

      SFX.ui(); startMatch(G.pickP1, -1); return;

    }

    return;

  }



  if (G.state === 'result'){

    for (var ri=0; ri<RESULT_BTN.length; ri++){

      var rb = RESULT_BTN[ri];

      if (p.x > rb.x && p.x < rb.x+rb.w && p.y > rb.y && p.y < rb.y+rb.h){

        G.resultSel = ri; resultGo(ri); return;

      }

    }

    return;

  }



  if (G.state === 'pause'){

    for (var j=0;j<PAUSE_BTN.length;j++){

      var b = PAUSE_BTN[j];

      if (p.x > b.x && p.x < b.x+b.w && p.y > b.y && p.y < b.y+b.h){

        G.pauseSel = j; runPauseAction(b.act); return;

      }

    }

    return;

  }



  if (G.state === 'keys'){

    for (var r=0;r<BIND_ORDER.length;r++){

      var ry = 140 + r*38;

      if (p.y > ry && p.y < ry+34 && p.x > 250 && p.x < 710){

        G.bindRow = r; G.bindTarget = BIND_ORDER[r]; SFX.ui(); return;

      }

    }

    return;

  }

}



function runPauseAction(act){

  if (act === 'resume'){ resumeGame(); }

  else if (act === 'keys'){ G.keysFrom = 'pause'; G.state = 'keys'; G.bindRow = 0; G.bindTarget = null; SFX.ui(); }

  else if (act === 'full'){ toggleFullscreen(); }

  else if (act === 'title'){ G.state = 'title'; SFX.ui(); }

}



function bindKey(code){

  if (!G.bindTarget) return;

  if (code === 'Escape'){ G.bindTarget = null; return; }

  var cur = BINDS[G.bindTarget];

  for (var k in BINDS){

    if (k !== G.bindTarget && BINDS[k] === code){ BINDS[k] = cur; break; }

  }

  BINDS[G.bindTarget] = code;

  saveBinds();

  G.bindTarget = null;

  SFX.ui();

}



function menuNav(dx, dy){

  if (G.state === 'select' && dx){

    G.selIdx = (G.selIdx + (dx > 0 ? 1 : 2)) % 3; SFX.ui();

  } else if (G.state === 'pause' && dy){

    G.pauseSel = (G.pauseSel + (dy > 0 ? 1 : PAUSE_BTN.length-1)) % PAUSE_BTN.length; SFX.ui();

  } else if (G.state === 'result' && (dx || dy)){
    G.resultSel = G.resultSel ? 0 : 1; SFX.ui();
  } else if (G.state === 'keys' && dy){

    G.bindRow = (G.bindRow + (dy > 0 ? 1 : BIND_ORDER.length-1)) % BIND_ORDER.length; SFX.ui();

  }

}



function menuConfirm(){

  if (G.state === 'title'){ startSelect(); }

  else if (G.state === 'select'){

    if (G.selStep === 0){ G.pickP1 = G.selIdx; G.selStep = 1; SFX.ui(); }

    else startMatch(G.pickP1, G.selIdx);

  }

  else if (G.state === 'result'){ resultGo(G.resultSel ? 1 : 0); }

  else if (G.state === 'pause'){ runPauseAction(PAUSE_BTN[G.pauseSel].act); }

  else if (G.state === 'keys'){

    if (G.bindTarget) return;

    G.bindTarget = BIND_ORDER[G.bindRow]; SFX.ui();

  }

}

/* 空中套：GPT 要展翼之后才切飞行套，Claude 一起跳就是空中套 */
function kitOf(f){
  /* 二形态（DeepSeek 星海解放·太刀 / GPT 霜冠龙王）有独立的一套招式表 */
  if (f && f.c && f.form && f.c.kit2) return f.c.kit2;
  return f.c;
}

function airKit(f){
  if (!f || f.onGround || !f.c) return null;
  var K = kitOf(f);
  if (f.fly && K.flySet) return K.flySet;
  return K.airSet || null;
}

function moveOf(f, key){
  var K = kitOf(f) || f.c;
  /* 飞行 / 滞空态：平A 与技能全部切到空中版 */
  var ak = airKit(f);
  if (ak && ak[key]) return ak[key];
  if (key === 'l1' || key === 'l2' || key === 'l3' || key === 'hv') return K.normals[key];
  if (key === 'air') return K.air;
  if (key === 'lS') return K.lS;
  if (key === 's1') return K.s1;
  if (key === 's2') return K.s2;
  if (key === 'su') return K.su;
  return null;
}



function totalDur(m){ return m.startup + m.active + m.recovery; }



function startAttack(f, key){

  var m = moveOf(f, key);

  if (!m) return false;

  if (m.cost && f.meter < m.cost) return false;

  if (m.cost) f.meter -= m.cost;

  f.state = 'attack';

  f.st = 0;

  f.atk = { key:key, m:m, hitList:{}, lastHitT:-9, shotsFired:0, counterArmed:false, blinked:0 };



  /* 硬体 / 霸体：技能(s1/s2)带 1 次硬体，必杀(su)全程霸体 */

  if (key === 's1' || key === 's2'){ f.atk.armor = 'hard'; f.atk.armorLeft = 1; f.atk.armorT = 0; }

  else if (key === 'su'){ f.atk.armor = 'super'; f.atk.armorLeft = 99; f.atk.armorT = 0; }

  f.vx = 0;

  if (m.lunge) f.kbv = f.facing * 0;

  if (m.type === 'counter'){ f.shield = 1; }

  /* 出招音：所有角色、所有招式都有，音色按角色 + 招式重量区分 */

  var chid = f.c.id;

  var swKind = 'light';

  if (key === 'air') swKind = 'air';

  else if (key === 'hv') swKind = 'heavy';

  else if (key === 'l3' || key === 'lS'){

    swKind = (m.anim === 'sweep' || m.anim === 'tail' || m.lvl === 'low') ? 'sweep' : 'heavy';

  }

  if (key === 'su'){

    G.flash = 0.42; G.slow = 0.5; G.superT = 0.55; G.superF = f; G.superName = m.name;

    SFX.super(); setTimeout(function(){ SFX.swing('heavy', chid); }, 90);

    say(f, m.say);

  }

  else if (key === 's1' || key === 's2'){

    SFX.cast(chid);

    if (m.type === 'rush' || m.type === 'channel' || m.type === 'breath' || m.type === 'tail'){

      setTimeout(function(){ SFX.swing(swKind, chid); }, Math.round((m.startup||0.1)*1000));

    }

    say(f, m.say);

  }

  else SFX.swing(swKind, chid);

  return true;

}



function say(f, text){

  if (!text) return;

  f.say = text; f.sayT = 1.5;

}



/* 起跳：脚下炸一圈气浪 + 几粒迸溅的光尘，让「起跳」有发力感 */

/* 闪避：朝指定方向急速滑步，整段无敌，专门用来穿过技能判定 */

function doDodge(f, dir){

  f.dodgeT = air ? 0.20 : 0.25;

  f.dodgeVX = dir * (air ? 640 : 810);

  f.dodgeAir = air;

  f.dodgeDir = dir;

  if (!air){

    G.rings.push({ x:f.x, y:fy - 3, t:0, life:0.26, col:'#9fdcff', ell:1 });

/* 二段跳：空中再蹬一次，脚下一圈气浪 */

/* 飞行模式：GPT 的二段跳不是再蹬一次地，而是展开双翼悬停。
   飞行中可自由升降、能在空中连段；时间耗尽、落地或被击中都结束飞行。 */
function enterFlight(f){

    });

/* 瞬身：一步闪到对手身后，起点留残像、落点炸一圈白光 */
function blinkStep(f, o, m){
  var oy = FLOOR_Y - f.y;
  for (var i=0;i<8;i++){
    G.hitspark.push({ x:f.x + (Math.random()-0.5)*18, y:oy - 22 - Math.random()*58,
      vx:(Math.random()-0.5)*110, vy:(Math.random()-0.35)*70, life:0.32, max:0.32, col:'#f2ffff', r:2.0 });
  }
  G.rings.push({ x:f.x, y:oy - 52, t:0, life:0.28, col:'#ffffff', ell:0 });
  var nx = clamp(o.x + (f.facing || 1)*74, WALL_PAD, ARENA_W - WALL_PAD);
  f.x = nx; f.vx = 0;
  /* 落到背后就转身，判定框才跟着指向对手 */
  f.facing = (o.x >= f.x) ? 1 : -1;
  G.rings.push({ x:f.x, y:oy - 52, t:0, life:0.30, col:'#bfe9ff', ell:0 });
  for (var j=0;j<10;j++){
    var b = (j/9)*Math.PI*2;
    G.hitspark.push({ x:f.x + Math.cos(b)*22, y:oy - 30 - (j%4)*13,
      vx:Math.cos(b)*140, vy:Math.sin(b)*90 - 30, life:0.30, max:0.30, col:'#ffffff', r:2.2 });
  }
  G.flash = Math.max(G.flash, (m && m.bigflash) ? 0.12 : 0.05);
  SFX.whiff(); SFX.dodge();
}
function exitFlight(f, hard){
  if (!f.fly) return;
  f.fly = 0; f.flyT = 0; f.airChain = 0;
  if (hard){
    var fy = FLOOR_Y - f.y;
    for (var i = 0; i < 10; i++){
      G.hitspark.push({
        x:f.x + (Math.random()-0.5)*28, y:fy - 26 - Math.random()*44,
        vx:(Math.random()-0.5)*170, vy:Math.random()*90 + 20,
        life:0.44, max:0.44, col:'#cfeeff', r:2.2
      });
    }
    SFX.whiff();
  }
}

function doAirJump(f){

  f.jumpsLeft--;

  /* 二段跳的初速按「离画面顶部还剩多少空间」算，越接近顶点补得越少，
     这样既能延长滞空，又不会把角色顶出画面上沿。 */

  var room = Math.max(46, JUMP2_CAP - f.y);

  f.vy = Math.min(880, Math.sqrt(2*GRAV*room));

  if (f.y < 10) f.y = 10;

  f.airJumpT = 0.34;

  f.state = 'jump'; f.st = 0;

  SFX.dbl();

  var fy = FLOOR_Y - f.y;

  G.rings.push({ x:f.x, y:fy - 4, t:0, life:0.34, col:'#cfeaff', ell:1 });

  G.rings.push({ x:f.x, y:fy - 4, t:-0.055, life:0.40, col:'#8fd0ff', ell:1 });

  for (var i=0;i<11;i++){

    var a = Math.PI + (i/10)*Math.PI;

    G.hitspark.push({

      x:f.x, y:fy - 2,

      vx:Math.cos(a)*160*(0.45+Math.random()*0.8),

      vy:Math.sin(a)*70*(0.45+Math.random()*0.8) + 30,

      life:0.34, max:0.34, col:'#d8f0ff', r:2.6

    });

  }

}

   同时获得 +15% 伤害 / +8% 移速。一回合只触发一次。 */

function awaken(f){

  }

}



/* 姿态：返回骨骼角度 */

function buildPose(f){

  var P = {

    lean:-0.04, head:0.02,

    armF:[1.02,0.78], armB:[-0.05,0.87],

    legF:[0.42,0.12], legB:[-0.44,0.16],

    squash:1

  };

  var t = f.t;



  if (f.state === 'idle'){

    var br = Math.sin(t*2.6)*0.035;

    P.lean = -0.04 + br*0.5;

    P.armF = [1.02+br*0.26, 0.78-br*0.10];

    P.armB = [-0.05-br*0.08, 0.87-br*0.06];

    P.head = 0.02 + br*0.2;

  }

  else if (f.state === 'walk'){

    var s = Math.sin(f.walkT*10);

    if (f.backStep){

      /* 后退：步幅收小、重心后仰，是「向后退步」而不是倒着走 */

      s = -s;

      P.legF = [0.34*s, 0.16]; P.legB = [-0.34*s, 0.16];

      P.armF = [1.08 - 0.05*s, 0.80];

      P.armB = [0.02 + 0.04*s, 0.85];

      P.lean = -0.11;

    } else {

      P.legF = [0.46*s, 0.12]; P.legB = [-0.46*s, 0.12];

      P.armF = [1.02 - 0.09*s, 0.78];

      P.armB = [-0.05 + 0.06*s, 0.85];

      P.lean = -0.015;

    }

  }

  else if (f.state === 'dodge'){

    /* 滑步：重心压低、上身朝移动方向倾，手臂甩在身后 */

    P.lean = -0.17;

    P.legF = [0.58, 0.34]; P.legB = [-0.52, 0.18];

    P.armF = [1.14, 0.66]; P.armB = [0.34, 0.88];

  }

  else if (f.state === 'jump'){

    P.legF = [0.62, 0.95]; P.legB = [-0.34, 0.72];

    P.armF = [1.16, 0.62]; P.armB = [0.30, 0.92];

    P.lean = -0.1;

  }

  else if (f.state === 'block'){

    /* 下蹲：重心压低、双手护在胸前 */

    var ck = clamp(f.st/0.085, 0, 1);

    P.crouch = ck;

    P.lean = lerp(-0.04, 0.34, ck);

    P.head = lerp(0.02, -0.20, ck);

    P.armF = [lerp(1.02, 1.28, ck), lerp(0.78, 0.50, ck)];

    P.armB = [lerp(-0.05, 0.50, ck), lerp(0.87, 1.05, ck)];

    P.legF = [lerp(0.42, 1.30, ck), lerp(0.12, -1.30, ck)];

    P.legB = [lerp(-0.44, -1.30, ck), lerp(0.16, 1.30, ck)];

  }

  else if (f.state === 'hit'){

    var k = clamp(f.st/0.18, 0, 1);

    P.lean = 0.16 + 0.14*k; P.head = 0.24*k;

    P.armF = [-0.45-0.3*k, -0.5]; P.armB = [-0.85-0.3*k, -0.35];

    P.legF = [0.34, 0.12]; P.legB = [-0.44, 0.16];

  }

  else if (f.state === 'attack'){

    var m = f.atk.m, e = f.st, kind = m.kind || m.type;

    var su = m.startup, ac = m.active, rc = m.recovery;

    var ext;

    if (e < su) ext = ease(e/su)*0.35;

    else if (e < su+ac) ext = 1;

    else ext = Math.max(0, 1 - (e-su-ac)/rc);



    var an = m.anim || '';

    if (an === 'jab'){

      P.armF = [lerp(1.02, 1.56, ext), lerp(0.78, -0.10, ext)];

      P.armB = [0.00, 0.85];

      P.lean = lerp(-0.04, 0.13, ext);

      P.head = 0.05;

    }

    else if (an === 'cross'){

      P.armB = [lerp(-0.05, 1.56, ext), lerp(0.87, -0.10, ext)];

      P.armF = [lerp(1.02, 1.00, ext), lerp(0.78, 0.66, ext)];

      P.lean = lerp(-0.04, 0.17, ext);

      P.head = 0.06;

    }

    else if (an === 'palm'){

      P.armF = [lerp(1.02, 1.46, ext), lerp(0.78, -0.26, ext)];

      P.armB = [lerp(-0.05, 1.18, ext), lerp(0.87, -0.42, ext)];

      P.lean = lerp(-0.04, 0.2, ext);

      P.legF = [lerp(0.42, 0.62, ext), 0.12];

      P.legB = [lerp(-0.44, -0.58, ext), 0.18];

      P.head = 0.07;

    }

    else if (an === 'swing'){

      P.armB = [lerp(-0.05, 1.34, ext), lerp(0.87, -1.45, ext)];

      P.armF = [lerp(1.02, 0.72, ext), lerp(0.78, 0.95, ext)];

      P.lean = lerp(-0.16, 0.22, ext);

      P.head = lerp(-0.06, 0.1, ext);

    }

    else if (an === 'sweep'){

      P.legF = [lerp(0.42, 1.34, ext), lerp(0.12, -0.55, ext)];

      P.legB = [-0.5, 0.3];

      P.lean = lerp(-0.04, -0.24, ext);

      P.armF = [0.94, 0.92];

      P.armB = [0.10, 0.80];

      P.head = -0.08;

    }

    else if (an === 'overhead'){

      P.armF = [lerp(2.95, 0.72, ext), lerp(0.5, 0.42, ext)];

      P.armB = [lerp(2.7, 0.62, ext), lerp(0.4, 0.35, ext)];

      P.lean = lerp(-0.22, 0.3, ext);

      P.head = lerp(-0.11, 0.16, ext);

    }

    else if (an === 'upper'){

      P.armF = [lerp(0.70, 2.50, ext), lerp(0.92, 0.18, ext)];

      P.armB = [lerp(0.40, -1.60, ext), 1.70];

      P.lean = lerp(0.02, -0.22, ext);

      P.legF = [lerp(0.42, 0.18, ext), 0.12];

      P.legB = [lerp(-0.44, -0.28, ext), 0.2];

      P.head = lerp(0.0, -0.13, ext);

    }

    else if (an === 'bookJab'){

      P.armF = [lerp(1.02, 1.66, ext), lerp(0.78, -0.22, ext)];

      P.armB = [lerp(-0.05, 0.58, ext), lerp(0.87, 0.62, ext)];

      P.lean = lerp(-0.04, 0.17, ext);

      P.head = 0.05;

    }

    else if (an === 'bookSwipe'){

      var bw = ease(ext);

      P.armF = [lerp(2.25, 1.16, bw), lerp(0.42, 0.16, bw)];

      P.armB = [lerp(-0.05, 0.34, bw), lerp(0.87, 0.70, bw)];

      P.lean = lerp(-0.12, 0.20, bw);

      P.head = lerp(-0.04, 0.08, bw);

      P.legF = [lerp(0.42, 0.56, bw), 0.12];

      P.legB = [lerp(-0.44, -0.56, bw), 0.18];

    }

    else if (an === 'airStrike'){

      /* 空中平A：双腿收起，单手从头顶劈下 */

      P.legF = [0.72, 1.02]; P.legB = [-0.40, 0.86];

      P.armF = [lerp(2.55, 1.30, ext), lerp(0.34, 0.02, ext)];

      P.armB = [lerp(2.10, 0.62, ext), lerp(0.38, 0.62, ext)];

      P.lean = lerp(-0.12, 0.24, ext);

      P.head = lerp(-0.08, 0.12, ext);

    }

    else if (an === 'dragonTail' || m.type === 'tail'){

      /* 龙尾：腰先拧，再把尾巴从身后整条甩到身前 */

      var tw = Math.sin(clamp(e/Math.max(0.001, totalDur(m)), 0, 1)*Math.PI);

      P.lean = lerp(-0.10, 0.26, tw);

      P.head = lerp(0.02, 0.14, tw);

      P.armF = [lerp(1.02, 1.38, tw), lerp(0.78, 0.06, tw)];

      P.armB = [lerp(-0.05, -0.88, tw), lerp(0.87, 0.62, tw)];

      P.legF = [lerp(0.42, 0.62, tw), 0.10];

      P.legB = [lerp(-0.44, -0.62, tw), 0.20];

    }

    else if (m.type === 'breath'){

      var bp = clamp(e/su, 0, 1);

      if (e < su){

        /* 蓄气：后仰、双手向两侧张开、喉咙发亮 */

        P.lean = lerp(-0.04, -0.20, bp);

        P.head = lerp(0.02, -0.16, bp);

        P.armF = [lerp(1.02, 0.30, bp), lerp(0.78, 1.06, bp)];

        P.armB = [lerp(-0.05, -0.34, bp), lerp(0.87, 1.02, bp)];

        P.legF = [lerp(0.42, 0.52, bp), 0.14];

        P.legB = [lerp(-0.44, -0.54, bp), 0.18];

      } else {

        /* 吐息：整个人前压，头抬向对手 */

        var bo = clamp((e - su)/Math.max(0.001, ac), 0, 1);

        P.lean = lerp(-0.20, 0.24, ease(Math.min(1, bo*2.2)));

        P.head = lerp(-0.10, 0.20, ease(Math.min(1, bo*2.2)));

        P.armF = [0.26, 1.10]; P.armB = [-0.28, 1.06];

        P.legF = [0.56, 0.12]; P.legB = [-0.54, 0.18];

      }

    }

    else if (m.type === 'channel'){

      var ch = clamp(e/su, 0, 1);

      if (e <= su){

        P.lean = -0.1 - Math.sin(G.t*7)*0.03;

        P.armF = [lerp(1.02, 0.16, ch), lerp(0.78, -1.10, ch)];

        P.armB = [lerp(-0.05, -0.95, ch), lerp(0.87, -0.55, ch)];

        P.legF = [0.4, 0.16]; P.legB = [-0.44, 0.2];

        P.head = -0.05;

      } else {

        P.armF = [1.5, -0.1]; P.armB = [1.18, -0.45];

        P.lean = 0.22; P.head = 0.07;

        P.legF = [0.6, 0.14]; P.legB = [-0.56, 0.2];

      }

    }

    else if (m.type === 'rush'){

      var w = Math.sin(e*34)*0.5+0.5;

      P.armF = [lerp(1.5, 0.9, w), lerp(-0.12, -0.6, w)];

      P.armB = [lerp(0.9, 1.5, w), lerp(-0.6, -0.12, w)];

      P.lean = 0.12; P.head = 0.05;

      P.legF = [0.42, 0.1]; P.legB = [-0.42, 0.12];

    }

    else if (m.type === 'dash'){

      var d = ext;

      P.lean = lerp(-0.04, 0.34, d);

      P.armF = [lerp(1.02, 1.56, d), lerp(0.78, -0.06, d)];

      P.armB = [lerp(0.00, -1.0, d), 0.95];

      P.legF = [lerp(0.16, 0.95, d), 0.1]; P.legB = [lerp(-0.2,-0.85,d), 0.35];

      P.head = 0.08;

    }

    else if (m.type === 'shot'){

      var s2 = ext;

      P.lean = lerp(-0.04, -0.1, s2);

      P.armF = [lerp(1.02, 1.50, s2), lerp(0.78, -0.15, s2)];

      P.armB = [lerp(0.00, 1.28, s2), lerp(0.95, -0.50, s2)];

      P.legF = [0.3, 0.1]; P.legB = [-0.34, 0.12];

    }

    else if (m.type === 'counter'){

      P.lean = -0.2;

      P.armF = [1.14, 0.62]; P.armB = [0.40, 0.95];

      P.legF = [0.34, 0.12]; P.legB = [-0.36, 0.12];

    }

    else if (m.type === 'rain'){

      P.lean = -0.16; P.head = -0.12;

      P.armF = [2.4, 0.2]; P.armB = [-2.4, -0.2];

      P.legF = [0.3, 0.12]; P.legB = [-0.34, 0.12];

    }

  }

  else if (f.state === 'ko'){

    P.lean = 0;

  }

  return P;

}



function fk(ox, oy, a1, l1, a2, l2){

  var kx = ox + Math.sin(a1)*l1, ky = oy + Math.cos(a1)*l1;

  var ex = kx + Math.sin(a1+a2)*l2, ey = ky + Math.cos(a1+a2)*l2;

  return {kx:kx, ky:ky, ex:ex, ey:ey};

}

function bone(x1,y1,x2,y2,w,col){

  ctx.strokeStyle = col; ctx.lineWidth = w; ctx.lineCap = 'round';

  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();

}



/* 拳头：本地 +x 恒为「前臂伸出方向」，也就是朝对手的那一面。

   指节画在 +x 一侧、护腕在 -x 一侧，拳面永远正对敌人。 */

function drawFist(a, cuffCol, dim){

  var ang = Math.atan2(a.ey - a.ky, a.ex - a.kx);

  var skin = dim ? shade('#ffe7da', -0.09) : '#ffe7da';

  ctx.save();

  ctx.translate(a.ex, a.ey);

  ctx.rotate(ang);

  ctx.fillStyle = cuffCol;

  rr(-11.0, -5.4, 5.4, 10.8, 2.3); ctx.fill();

  ctx.fillStyle = skin;

  ctx.beginPath(); ctx.ellipse(0.8, 0, 6.6, 5.9, 0, 0, Math.PI*2); ctx.fill();

  // 指节凸在朝前一面

  ctx.fillStyle = dim ? shade('#ffe7da', -0.28) : shade('#ffe7da', -0.11);

  ctx.beginPath(); ctx.ellipse(4.6, -2.3, 2.5, 2.2, -0.2, 0, Math.PI*2); ctx.fill();

  ctx.beginPath(); ctx.ellipse(4.6, 2.1, 2.5, 2.2, 0.2, 0, Math.PI*2); ctx.fill();

  ctx.beginPath(); ctx.ellipse(2.5, 0.0, 2.4, 2.0, 0, 0, Math.PI*2); ctx.fill();

  // 指缝

  ctx.strokeStyle = 'rgba(150,104,96,0.40)'; ctx.lineWidth = 1.0; ctx.lineCap = 'round';

  ctx.beginPath(); ctx.moveTo(3.2, -4.3); ctx.lineTo(3.2, -0.7); ctx.stroke();

  ctx.beginPath(); ctx.moveTo(3.2, 0.7); ctx.lineTo(3.2, 4.1); ctx.stroke();

  // 拇指

  ctx.fillStyle = skin;

  ctx.beginPath(); ctx.ellipse(-0.8, -4.9, 2.7, 2.0, 0.5, 0, Math.PI*2); ctx.fill();

  ctx.strokeStyle = 'rgba(64,46,60,0.24)'; ctx.lineWidth = 1;

  ctx.beginPath(); ctx.ellipse(0.8, 0, 6.6, 5.9, 0, 0, Math.PI*2); ctx.stroke();

  ctx.restore();

}



function drawHair(c, hd, t, back){

  var s = c.style;

  /* 后发整体往「身后」(-x) 挪一点：以前后发是正对镜头对称铺开的，

     脸被头发两边框住，看起来就像正对着人；挪开后轮廓能看出「前脸后发」。 */

  if (back){ ctx.save(); ctx.translate(-6, 1.5); }

  if (s === 'long'){

    if (back){

      ctx.fillStyle = shade(c.hair,-0.18);

      ctx.beginPath();

      ctx.moveTo(hd.x-21, hd.y-6);

      ctx.quadraticCurveTo(hd.x-31, hd.y+26, hd.x-23, hd.y+50);

      ctx.quadraticCurveTo(hd.x-6, hd.y+60, hd.x+9, hd.y+47);

      ctx.quadraticCurveTo(hd.x+25, hd.y+26, hd.x+21, hd.y-6);

      ctx.closePath(); ctx.fill();

    }

    ctx.fillStyle = c.hair;

    ctx.beginPath();

    ctx.arc(hd.x, hd.y-3, HEAD_R+3, Math.PI*0.98, Math.PI*2.02);

    ctx.quadraticCurveTo(hd.x+HEAD_R+6, hd.y-18, hd.x-HEAD_R-4, hd.y-16);

    ctx.closePath(); ctx.fill();

    ctx.fillStyle = c.hair2;

    ctx.beginPath();

    ctx.moveTo(hd.x-13, hd.y-18);

    ctx.quadraticCurveTo(hd.x-2, hd.y-26, hd.x+12, hd.y-16);

    ctx.quadraticCurveTo(hd.x+2, hd.y-19, hd.x-13, hd.y-18);

    ctx.fill();

    // 鲸鱼发饰

    ctx.fillStyle = '#9fd0ff';

    ctx.beginPath(); ctx.ellipse(hd.x+15, hd.y-20, 7, 4.2, -0.5, 0, Math.PI*2); ctx.fill();

    ctx.beginPath(); ctx.moveTo(hd.x+21,hd.y-22); ctx.lineTo(hd.x+27,hd.y-26); ctx.lineTo(hd.x+23,hd.y-18); ctx.closePath(); ctx.fill();

  }

  else if (s === 'bob'){

    if (back){

      ctx.fillStyle = shade(c.hair,-0.2);

      ctx.beginPath();

      ctx.moveTo(hd.x-22, hd.y-8);

      ctx.quadraticCurveTo(hd.x-30, hd.y+22, hd.x-18, hd.y+30);

      ctx.lineTo(hd.x+18, hd.y+30);

      ctx.quadraticCurveTo(hd.x+30, hd.y+20, hd.x+22, hd.y-8);

      ctx.closePath(); ctx.fill();

    }

    ctx.fillStyle = c.hair;

    ctx.beginPath();

    ctx.arc(hd.x, hd.y-2, HEAD_R+3.5, Math.PI*0.96, Math.PI*2.04);

    ctx.quadraticCurveTo(hd.x+HEAD_R+8, hd.y-16, hd.x-HEAD_R-5, hd.y-14);

    ctx.closePath(); ctx.fill();

    ctx.fillStyle = c.hair2;

    ctx.beginPath();

    ctx.arc(hd.x-6, hd.y-14, 9, Math.PI*1.05, Math.PI*1.95); ctx.fill();

    // 星芒发饰

    ctx.save();

    ctx.translate(hd.x+14, hd.y-17); ctx.rotate(t*1.2);

    ctx.fillStyle = '#ffd79a';

    for (var i=0;i<4;i++){

      ctx.rotate(Math.PI/2);

      ctx.beginPath(); ctx.moveTo(0,-7); ctx.lineTo(2.6,0); ctx.lineTo(0,7); ctx.lineTo(-2.6,0); ctx.closePath(); ctx.fill();

    }

    ctx.restore();

  }

  else if (s === 'dragon'){

    /* 龙娘：后发一大束铺在身后，斜刘海露出眼睛，角从发帽里顶出来 */

    if (back){

      ctx.fillStyle = shade(c.hair,-0.24);

      ctx.beginPath();

      ctx.moveTo(hd.x-13, hd.y-12);

      ctx.quadraticCurveTo(hd.x-24, hd.y+10, hd.x-23, hd.y+42);

      ctx.quadraticCurveTo(hd.x-21, hd.y+56, hd.x-16, hd.y+48);

      ctx.quadraticCurveTo(hd.x-12, hd.y+36, hd.x-8, hd.y+42);

      ctx.quadraticCurveTo(hd.x-6, hd.y+22, hd.x-3, hd.y+6);

      ctx.quadraticCurveTo(hd.x-1, hd.y-3, hd.x+2, hd.y-12);

      ctx.closePath(); ctx.fill();

      ctx.strokeStyle = c.hair2; ctx.globalAlpha = 0.30; ctx.lineWidth = 2.2;

      ctx.beginPath();

      ctx.moveTo(hd.x-14, hd.y-2);

      ctx.quadraticCurveTo(hd.x-19, hd.y+18, hd.x-17, hd.y+34);

      ctx.stroke();

      ctx.globalAlpha = 1;

    }

    /* 头顶发帽 */

    ctx.fillStyle = c.hair;

    ctx.beginPath();

    ctx.arc(hd.x, hd.y-3, HEAD_R+3.0, Math.PI*0.98, Math.PI*2.02);

    ctx.quadraticCurveTo(hd.x+HEAD_R+9, hd.y-14, hd.x-HEAD_R-5, hd.y-12);

    ctx.closePath(); ctx.fill();

    /* 斜刘海：两缕尖角压在额角，不全遮眼 */

    ctx.beginPath();

    ctx.moveTo(hd.x-19, hd.y-10);

    ctx.quadraticCurveTo(hd.x-9, hd.y-29, hd.x+14, hd.y-18);

    ctx.lineTo(hd.x+16, hd.y-10);

    ctx.quadraticCurveTo(hd.x+5, hd.y-14, hd.x-1, hd.y-5);

    ctx.lineTo(hd.x-5, hd.y-2);

    ctx.quadraticCurveTo(hd.x-10, hd.y-6, hd.x-13, hd.y-9);

    ctx.quadraticCurveTo(hd.x-16, hd.y-12, hd.x-19, hd.y-10);

    ctx.closePath(); ctx.fill();

    /* 鬓角 */

    ctx.fillStyle = shade(c.hair,-0.10);

    ctx.beginPath();

    ctx.moveTo(hd.x-16, hd.y-4);

    ctx.quadraticCurveTo(hd.x-21, hd.y+6, hd.x-19, hd.y+13);

    ctx.quadraticCurveTo(hd.x-15, hd.y+5, hd.x-12, hd.y-2);

    ctx.closePath(); ctx.fill();

    /* 金色挑染（贴着刘海边缘的一道） */

    ctx.strokeStyle = c.horn2; ctx.globalAlpha = 0.32; ctx.lineWidth = 1.6;

    ctx.beginPath();

    ctx.moveTo(hd.x-8, hd.y-22);

    ctx.quadraticCurveTo(hd.x-2, hd.y-24, hd.x+4, hd.y-21);

    ctx.stroke();

    ctx.globalAlpha = 1;

  }

  else {

    if (back){

      ctx.fillStyle = shade(c.hair,-0.16);

      ctx.beginPath();

      ctx.moveTo(hd.x-21, hd.y-4);

      ctx.quadraticCurveTo(hd.x-28, hd.y+16, hd.x-16, hd.y+20);

      ctx.lineTo(hd.x+16, hd.y+20);

      ctx.quadraticCurveTo(hd.x+28, hd.y+14, hd.x+21, hd.y-4);

      ctx.closePath(); ctx.fill();

    }

    ctx.fillStyle = c.hair;

    ctx.beginPath();

    ctx.arc(hd.x, hd.y-3, HEAD_R+3, Math.PI*0.98, Math.PI*2.02);

    ctx.closePath(); ctx.fill();

    // 呆毛 + 发光

    ctx.strokeStyle = c.hair; ctx.lineWidth = 4; ctx.lineCap = 'round';

    ctx.beginPath();

    ctx.moveTo(hd.x+3, hd.y-HEAD_R-1);

    ctx.quadraticCurveTo(hd.x+12, hd.y-HEAD_R-16, hd.x+2, hd.y-HEAD_R-22);

    ctx.stroke();

    ctx.fillStyle = c.hair2;

    ctx.beginPath(); ctx.arc(hd.x+2, hd.y-HEAD_R-23, 4.5, 0, Math.PI*2); ctx.fill();

    ctx.globalAlpha = 0.5 + Math.sin(t*6)*0.25;

    ctx.beginPath(); ctx.arc(hd.x+2, hd.y-HEAD_R-23, 8, 0, Math.PI*2); ctx.fill();

    ctx.globalAlpha = 1;

  }

  if (back) ctx.restore();

}

/* 龙角：金色、后掠的弯角，带环纹。back=true 时画远侧那只（压在头后） */

function drawHorns(hd, c, t, back){

  var k = back ? 0.86 : 1.0;

  var bx = hd.x + (back ? -8.0 : 8.2);

  var by = hd.y - HEAD_R + 1.8;

  ctx.save();

  ctx.translate(bx, by);

  ctx.rotate(back ? -0.30 : -0.12);

  ctx.scale(k, k);



  var g = ctx.createLinearGradient(5, 2, -6, -26);

  if (back){

    g.addColorStop(0, shade(c.horn2, -0.22));

    g.addColorStop(1, shade(c.horn, -0.20));

  } else {

    g.addColorStop(0, c.horn2);

    g.addColorStop(0.35, c.horn);

    g.addColorStop(1, '#ffffff');

  }

  ctx.fillStyle = g;

  ctx.beginPath();

  ctx.moveTo(6.4, 2.6);

  ctx.quadraticCurveTo(5.6, -8.0, 0.8, -15.6);

  ctx.quadraticCurveTo(-3.0, -20.6, -8.2, -23.8);   // 尖端向后钩

  ctx.quadraticCurveTo(-4.2, -16.0, -3.4, -9.8);

  ctx.quadraticCurveTo(-3.0, -3.2, -6.2, 2.4);

  ctx.closePath();

  ctx.fill();

  ctx.strokeStyle = 'rgba(96,116,146,0.5)'; ctx.lineWidth = 0.9;

  ctx.stroke();



  /* 角面环纹 */

  ctx.strokeStyle = 'rgba(255,255,255,0.40)'; ctx.lineWidth = 0.8;

  for (var i=0;i<2;i++){

    var yy = -3.2 - i*4.8;

    ctx.beginPath();

    ctx.moveTo(-5.2 + i*1.2, yy + 0.5);

    ctx.quadraticCurveTo(-1.0 + i*0.7, yy + 1.8, 4.0 - i*1.1, yy - 1.5);

    ctx.stroke();

  }

  /* 角根：压一圈暗金，收进发里 */

  ctx.fillStyle = shade(c.horn2, -0.18);

  ctx.beginPath(); ctx.ellipse(0, 2.4, 3.8, 1.2, 0.08, 0, Math.PI*2); ctx.fill();

  ctx.restore();

}



/* 翼膜：整只翼绕肩部旋转 —— sp 小的时候垂在身后收拢，sp=1 时向后上方张开 */

function drawWing(root, sp, tilt, membCol, boneCol, alpha){

  ctx.save();

  ctx.translate(root.x, root.y);

  ctx.rotate(lerp(-0.86, 0.12, sp) + tilt);

  var s = lerp(0.94, 1.14, sp);

  var t1 = { x:-7*s,  y:-36*s };

  var t2 = { x:-31*s, y:-27*s };

  var t3 = { x:-40*s, y:-3*s  };

  ctx.globalAlpha = alpha;

  ctx.fillStyle = membCol;

  ctx.beginPath();

  ctx.moveTo(0, 0);

  ctx.quadraticCurveTo(-3*s, -22*s, t1.x, t1.y);     // 前缘

  ctx.quadraticCurveTo(-8*s, -17*s, t2.x, t2.y);     // 翼膜凹陷

  ctx.quadraticCurveTo(-16*s, -7*s, t3.x, t3.y);     // 翼膜凹陷

  ctx.quadraticCurveTo(-11*s, -1*s, 0, 0);

  ctx.closePath(); ctx.fill();

  /* 膜上的分格线 */

  ctx.strokeStyle = 'rgba(255,255,255,0.20)'; ctx.lineWidth = 0.9;

  ctx.beginPath(); ctx.moveTo(0,0); ctx.quadraticCurveTo(-8*s, -13*s, t2.x, t2.y); ctx.stroke();

  ctx.beginPath(); ctx.moveTo(0,0); ctx.quadraticCurveTo(-12*s, -3*s, t3.x, t3.y); ctx.stroke();

  /* 指骨 + 爪尖 */

  ctx.strokeStyle = boneCol; ctx.lineWidth = 1.6; ctx.lineCap = 'round';

  ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(t1.x,t1.y); ctx.stroke();

  ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(t2.x,t2.y); ctx.stroke();

  ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(t3.x,t3.y); ctx.stroke();

  ctx.fillStyle = '#eef8ff';

  [t1,t2,t3].forEach(function(p, idx){

    ctx.beginPath();

    ctx.moveTo(p.x - 1.2, p.y + 1.0);

    ctx.lineTo(p.x + 1.6, p.y - 0.2);

    ctx.lineTo(p.x - 0.4, p.y - 2.4);

    ctx.closePath(); ctx.fill();

  });

  ctx.restore();

}



function drawDragonWings(f, sh){

  var m = (f.state === 'attack' && f.atk) ? f.atk.m : null;

  var sp = 0.46;

  if (f.state === 'jump') sp = 0.86;

  else if (f.state === 'block') sp = 0.32;

  else if (f.state === 'hit') sp = 0.40;

  else if (m && m.type === 'dash') sp = 1.0;

  else if (m && (m.type === 'breath' || m.type === 'tail')) sp = 0.66;

  else if (m && m.anim === 'dragonTail') sp = 0.72;

  else if (f.state === 'attack') sp = 0.58;



  var flap = Math.sin(f.t*(f.state === 'jump' ? 9 : 3.0))*(0.05 + 0.10*sp);

  var root = { x: sh.x - 5, y: sh.y + 5 };

  drawWing(root, sp*0.82, -0.22 + flap*0.6,

           shade(f.c.wing, -0.42), shade(f.c.horn, -0.30), 0.9);

  drawWing(root, sp, 0.04 + flap,

           f.c.wing, f.c.horn, 0.96);

}



/* 龙尾：三段骨链，sweep 0=垂在身后，1=整条甩到身前 */

function drawDragonTail(f, sh){

  var m = (f.state === 'attack' && f.atk) ? f.atk.m : null;

  var sweep = 0, lift = 0;

  if (m && (m.anim === 'dragonTail' || m.type === 'tail')){

    var su = m.startup, ac = m.active, rc = m.recovery, e = f.st;

    if (e < su){ sweep = lerp(0, -0.22, ease(e/Math.max(0.001,su))); }

    else if (e <= su + ac){ sweep = lerp(-0.22, 1, ease((e-su)/Math.max(0.001,ac))); }

    else { sweep = lerp(1, 0, clamp((e-su-ac)/Math.max(0.001,rc),0,1)); }

  } else if (f.state === 'jump'){ lift = 1; }

  else if (m && (m.type === 'breath' || m.type === 'dash')){ lift = 0.9; }

  else if (f.state === 'hit'){ lift = 0.3; }

  else if (f.state === 'block'){ lift = -0.45; }



  var sway = Math.sin(f.t*2.1)*0.075;

  var A0 = 3.34 + sway + sweep*2.55 - lift*0.34;

  var A1 = 3.06 + sway*1.3 + sweep*2.42 - lift*0.50;

  var A2 = 2.70 + sway*1.6 + sweep*2.20 - lift*0.62;

  var lens = [21, 18, 16];

  var wid  = [6.4, 5.2, 3.4, 1.5];



  var p0 = { x: -1.5, y: 7 };

  var p1 = { x: p0.x + Math.cos(A0)*lens[0], y: p0.y - Math.sin(A0)*lens[0] };

  var p2 = { x: p1.x + Math.cos(A1)*lens[1], y: p1.y - Math.sin(A1)*lens[1] };

  var p3 = { x: p2.x + Math.cos(A2)*lens[2], y: p2.y - Math.sin(A2)*lens[2] };

  var pts = [p0,p1,p2,p3];



  var base = f.c.scale;

  var g = ctx.createLinearGradient(p0.x, p0.y, p3.x, p3.y);

  g.addColorStop(0, shade(base, 0.12));

  g.addColorStop(0.6, base);

  g.addColorStop(1, shade(base, -0.16));

  ctx.fillStyle = g;



  for (var i=0;i<3;i++){

    var a = pts[i], b = pts[i+1];

    var dx = b.x-a.x, dy = b.y-a.y, L = Math.hypot(dx,dy) || 1;

    var nx = -dy/L, ny = dx/L;

    var wa = wid[i], wb = wid[i+1];

    ctx.beginPath();

    ctx.moveTo(a.x+nx*wa, a.y+ny*wa);

    ctx.lineTo(b.x+nx*wb, b.y+ny*wb);

    ctx.lineTo(b.x-nx*wb, b.y-ny*wb);

    ctx.lineTo(a.x-nx*wa, a.y-ny*wa);

    ctx.closePath(); ctx.fill();

    ctx.beginPath(); ctx.arc(a.x, a.y, wa, 0, Math.PI*2); ctx.fill();

  }

  ctx.beginPath(); ctx.arc(p3.x, p3.y, wid[3], 0, Math.PI*2); ctx.fill();



  /* 背脊棘：贴尾背的一排小三角，和尾巴同色系 */

  for (var k=1;k<=2;k++){

    var p = pts[k];

    var hh = 4.6 - k*0.9;

    ctx.fillStyle = shade(f.c.wing, -0.18);

    ctx.beginPath();

    ctx.moveTo(p.x - wid[k]*0.42, p.y + wid[k]*0.30);

    ctx.lineTo(p.x + wid[k]*0.42, p.y + wid[k]*0.02);

    ctx.lineTo(p.x + 0.6, p.y - wid[k]*0.55 - hh);

    ctx.closePath(); ctx.fill();

  }



  /* 尾尖：金色枪头 */

  var dxT = p3.x-p2.x, dyT = p3.y-p2.y, LT = Math.hypot(dxT,dyT) || 1;

  var uxT = dxT/LT, uyT = dyT/LT;

  ctx.save();

  ctx.translate(p3.x, p3.y);

  ctx.rotate(Math.atan2(uyT, uxT));

  var g2 = ctx.createLinearGradient(0,0,13,0);

  g2.addColorStop(0, f.c.horn2);

  g2.addColorStop(1, '#f2fbff');

  ctx.fillStyle = g2;

  ctx.beginPath();

  ctx.moveTo(-1.5, 0);

  ctx.lineTo(8.5, -5.6);

  ctx.lineTo(5.0, 0);

  ctx.lineTo(8.5, 5.6);

  ctx.closePath(); ctx.fill();

  ctx.restore();

}
