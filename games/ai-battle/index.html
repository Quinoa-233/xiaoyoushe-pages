var GP1_IMG = new Image(), GP1_OK = false, GP1_WHITE = null;
var GP2_IMG = new Image(), GP2_OK = false, GP2_WHITE = null;

GP1_IMG.onload = function(){ GP1_OK = true; try { GP1_WHITE = dsqToWhite(GP1_IMG); } catch(e){} };
GP2_IMG.onload = function(){ GP2_OK = true; try { GP2_WHITE = dsqToWhite(GP2_IMG); } catch(e){} };
GP1_IMG.src = GP1_SRC;
GP2_IMG.src = GP2_SRC;

/* 贴图几何：w/h 为裁切后尺寸，axis 为身体中线，bot 为脚底，mouth 为龙嘴 */
var GP1_GEO = { w:444, h:440, axis:220, bot:440, face:1, mouth:[213,210], hand:[151,288] };
var GP2_GEO = { w:744, h:550, axis:324, bot:534, face:-1, mouth:[203,182] };

/* 立绘动画：整体前倾 + 压扁拉伸。静态图也要有「出手」的重量感 */
/* 飞行模式的表现：身后的风迹（画在立绘下面）+ 脚下气环和剩余飞行时间（画在上面） */
/* Claude 娘滞空：脚下风环 + 上升的风丝，风环外圈同样是剩余滞空时间 */
function drawHoverFX(f, D){
  var t = f.t, base = D.toes;
  var u = clamp(f.flyT/Math.max(0.001, f.flyMax), 0, 1);
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.lineCap = 'round';

  /* 向上托的气柱 */
  var cg = ctx.createLinearGradient(0, base + 4, 0, base - 96);
  cg.addColorStop(0, 'rgba(190,232,255,0.24)');
  cg.addColorStop(0.55, 'rgba(150,205,255,0.09)');
  cg.addColorStop(1, 'rgba(120,180,255,0)');
  ctx.fillStyle = cg;
  ctx.beginPath();
  ctx.moveTo(-30, base + 4);
  ctx.quadraticCurveTo(-16, base - 52, -6, base - 98);
  ctx.lineTo(6, base - 98);
  ctx.quadraticCurveTo(16, base - 52, 30, base + 4);
  ctx.closePath(); ctx.fill();

  /* 脚下风环：三层扁椭圆 + 一圈旋转刻度 */
  var puls = 0.6 + 0.4*Math.sin(t*5.2);
  ctx.globalAlpha = 0.30*puls;
  ctx.strokeStyle = '#e8f6ff'; ctx.lineWidth = 2.4;
  ctx.beginPath(); ctx.ellipse(0, base + 2, 28, 7.6, 0, 0, Math.PI*2); ctx.stroke();
  ctx.globalAlpha = 0.14;
  ctx.beginPath(); ctx.ellipse(0, base + 2, 37 + puls*4, 10, 0, 0, Math.PI*2); ctx.stroke();

  ctx.globalAlpha = 0.46;
  ctx.strokeStyle = '#dff0ff';
  for (var d=0; d<9; d++){
    var a0 = t*1.9 + d*(Math.PI*2/9);
    ctx.lineWidth = 2.2;
    ctx.beginPath();
    ctx.ellipse(0, base + 2, 31.5, 8.4, 0, a0, a0 + 0.20);
    ctx.stroke();
  }

  /* 剩余滞空：外圈弧，快耗尽转橙 */
  ctx.globalAlpha = 0.62;
  ctx.strokeStyle = (u > 0.30) ? '#cfe4ff' : '#ffb27a';
  ctx.lineWidth = 2.8;
  ctx.beginPath(); ctx.ellipse(0, base + 2, 44, 12, 0, -Math.PI*0.5, -Math.PI*0.5 + Math.PI*2*u); ctx.stroke();

  /* 上升气流：左右各几道卷起来的粗风丝 */
  for (var i=0;i<6;i++){
    var ph2 = ((t*1.25 + i*0.17) % 1);
    var yy = base - 2 - ph2*104;
    var side = (i % 2) ? -1 : 1;
    var sx0 = side*(14 + (i%3)*11);
    ctx.globalAlpha = 0.34*(1-ph2)*(0.45 + 0.55*u);
    ctx.strokeStyle = (i === 2 || i === 5) ? '#ffe2c6' : '#eaf6ff';
    ctx.lineWidth = 2.6 - ph2*1.2;
    ctx.beginPath();
    ctx.moveTo(sx0, yy);
    ctx.quadraticCurveTo(sx0*0.55 + side*Math.sin(ph2*5 + i)*12, yy - 18, sx0*0.20 - side*8, yy - 38);
    ctx.stroke();
  }

  /* 被卷起来的光点 */
  for (var q=0;q<7;q++){
    var pq = ((t*0.85 + q*0.14) % 1);
    var ang2 = q*0.9 + t*0.7;
    var rx2 = 20 + Math.sin(ang2)*12;
    ctx.globalAlpha = 0.42*(1-pq);
    ctx.fillStyle = (q%3 === 0) ? '#ffd9b0' : '#dff0ff';
    ctx.beginPath();
    ctx.arc(Math.cos(ang2)*rx2, base - 8 - pq*96, 1.5 + (q%3)*0.7, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.restore();
}

function drawFlightFX(f, D, layer){
  var t = f.t;
  var u = clamp(f.flyT/Math.max(0.001, f.flyMax), 0, 1);
  /* drawFighter 的局部原点在脚往上 D.toes 处，特效一律按这个基准落位 */
  var base = D.toes;

  if (layer === 0){
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.lineCap = 'round';
    for (var i = 0; i < 3; i++){
      var ph = ((t*1.25 + i*0.33) % 1);
      var yy = base - 46 + i*20 + ph*8;
      var len = 26 + i*13;
      ctx.globalAlpha = 0.16*(1-ph)*(0.5 + 0.5*u);
      ctx.strokeStyle = (i === 1) ? '#ffffff' : '#bfe9ff';
      ctx.lineWidth = 2.6 - i*0.5;
      ctx.beginPath();
      ctx.moveTo(-6 - ph*8, yy);
      ctx.quadraticCurveTo(-len*0.6, yy + 4, -len, yy + 12);
      ctx.stroke();
    }
    ctx.restore();
    return;
  }

  ctx.save();
  var puls = 0.6 + 0.4*Math.sin(t*4.4);
  ctx.globalCompositeOperation = 'lighter';

  ctx.globalAlpha = 0.26*puls;
  ctx.strokeStyle = '#cdefff';
  ctx.lineWidth = 2.2;
  ctx.beginPath(); ctx.ellipse(0, base + 3, 30, 8.5, 0, 0, Math.PI*2); ctx.stroke();

  ctx.globalAlpha = 0.14;
  ctx.beginPath(); ctx.ellipse(0, base + 3, 39 + puls*5, 11, 0, 0, Math.PI*2); ctx.stroke();

  /* 剩余飞行时间：外圈一道会缩短的弧，快耗尽时转成橙色 */
  ctx.globalAlpha = 0.58;
  ctx.strokeStyle = (u > 0.28) ? '#9fe4ff' : '#ffb27a';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.ellipse(0, base + 3, 45, 12.5, 0, -Math.PI*0.5, -Math.PI*0.5 + Math.PI*2*u);
  ctx.stroke();

  ctx.restore();
}

function gpAnim(f){
  var t = f.t;
  var ar = 0, dx = 0, dy = 0, sx = 1, sy = 1;
  var big = f.form ? 1.0 : 0.6;
  var m = (f.state === 'attack' && f.atk) ? f.atk.m : null;

  if (f.state === 'idle'){
    var br = Math.sin(t*(f.form ? 1.5 : 2.2));
    dy = br*0.6*big;
    sy = 1 + br*0.008;
    sx = 1 - br*0.006;
    ar = br*0.008*big;
  } else if (f.state === 'walk'){
    var s = Math.sin(f.walkT*(f.form ? 7 : 10));
    dy = -Math.abs(s)*1.4*big;
    dx = s*0.7*big;
    ar = s*0.03*big;
    sy = 1 + Math.abs(s)*0.010;
  } else if (f.state === 'jump'){
    if (f.fly){
      /* 悬停：被翼尖托着轻轻起伏，不会像普通起跳那样僵在半空 */
      var fb = Math.sin(t*3.1), fb2 = Math.sin(t*3.1 + 1.15);
      ar = -0.075*big + fb*0.012;
      dy = -3.0 + fb*2.0;
      sy = 1.02 + fb2*0.013;
      sx = 0.99 - fb2*0.011;
    } else {
      ar = -0.055*big; sy = 1.04; sx = 0.98; dy = -1.6;
      if (f.airJumpT > 0){
        var aj = f.airJumpT/0.34;
        sy += aj*0.08; sx -= aj*0.04; dy -= aj*2.0;
      }
    }
  } else if (f.state === 'block'){
    sx = 1.04; sy = 0.94; dy = 2.2*big; ar = -0.02;
  } else if (f.state === 'hit'){
    ar = 0.09*big; dx = -3.4*big; sy = 0.97;
  } else if (f.state === 'dodge'){
    var dj = clamp(1 - f.dodgeT/0.25, 0, 1);
    ar = -0.02 - dj*0.05; sx = 1.03; sy = 0.97; dy = 1.6;
  } else if (m){
    var s0 = Math.max(0.001, m.startup), s1 = s0 + m.active;
    var wind = clamp(f.st/s0, 0, 1);
    var act  = clamp((f.st - s0)/Math.max(0.001, m.active), 0, 1);
    var rec  = f.st > s1 ? clamp((f.st - s1)/Math.max(0.001, m.recovery), 0, 1) : 0;
    var puff = f.st < s0 ? -0.5*Math.sin(wind*Math.PI*0.5)
                         : (f.st <= s1 ? Math.sin(act*Math.PI*0.66) : 1 - rec);
    var dash = (m.type === 'dash') ? 1.9 : 1;
    ar = -0.02 + puff*0.085*big*dash;
    dx = puff*6.5*big*dash;
    sy = 1 + Math.abs(puff)*0.020;
    sx = 1 - Math.abs(puff)*0.012;
    if (m.type === 'breath'){ ar -= 0.030*big; dx += 2.5; }
    if (m.type === 'counter'){ ar += 0.020; }
  }
  /* 飞行出招：整体再往前压一点，像借着前冲的势出手 */

  if (f.fly && m){ ar -= 0.028*big; dx += 1.2; }

  return { ar:ar, dx:dx, dy:dy, sx:sx, sy:sy };
}

function gpSpriteK(f){
  return (f.form ? 162 : 150) / (f.form ? GP2_GEO.h : GP1_GEO.h);
}

/* 立绘镜像：drawFighter 外层已经按 f.facing 翻过一次，
   这里只需要把贴图本身的朝向掰正，绝不能再乘 facing（会翻两次 = 抵消） */
function gpMir(f, GG){
  return (GG.face < 0) ? -1 : 1;
}

function drawGpSprite(f, D, P){
  var img = f.form ? GP2_IMG : GP1_IMG;
  var ok  = f.form ? GP2_OK : GP1_OK;
  if (!ok || !img || !img.naturalWidth) return false;

  var GG = f.form ? GP2_GEO : GP1_GEO;
  var k = gpSpriteK(f);
  var a = gpAnim(f);
  var mir = gpMir(f, GG);

  var dw = GG.w*k, dh = GG.h*k;
  var ox = -GG.axis*k, oy = -GG.bot*k;

  ctx.save();
  ctx.imageSmoothingEnabled = true;
  if ('imageSmoothingQuality' in ctx) ctx.imageSmoothingQuality = 'high';

  ctx.translate(a.dx, D.toes + a.dy);
  ctx.rotate(a.ar);
  ctx.scale(mir*a.sx, a.sy);

  /* 闪避残影 */
  if (f.dodgeT > 0){
    var lx = (f.dodgeDir || -f.facing);
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (var gq = 1; gq <= 2; gq++){
      ctx.globalAlpha = 0.18 - gq*0.05;
      ctx.drawImage(img, ox - lx*gq*10, oy - gq*0.5, dw, dh);
    }
    ctx.restore();
  }

  /* 受击闪白 */
  if (f.flash > 0){
    var wht = f.form ? GP2_WHITE : GP1_WHITE;
    if (wht){
      ctx.globalAlpha = clamp(f.flash*1.7, 0, 0.6);
      ctx.drawImage(wht, ox, oy, dw, dh);
      ctx.globalAlpha = 1;
    }
  }

  ctx.drawImage(img, ox, oy, dw, dh);
  ctx.restore();

  /* 打击锚点：立绘没有分件的拳头，特效统一挂在身体前方 */
  if (f.form){
    f._fistX = a.dx + 46;
    f._fistY = D.toes - 92 + a.dy;
  } else {
    /* 一形态：按立绘里实际的手部位置挂牌，特效才不会飘在脸上 */
    var hx = (GG.hand[0] - GG.axis)*mir*k;
    var hy = (GG.hand[1] - GG.bot)*k;
    f._fistX = hx*a.sx + a.dx;
    f._fistY = D.toes + hy*a.sy + a.dy;
  }
  return true;
}


function gpPal(f){
  var c = f.c, k;
  if (!f.form || !c.stage2) return c;
  if (c._gpPal && c._gpPalForm === f.form) return c._gpPal;
  var p = {};
  for (k in c){ if (k !== 'stage2' && k !== '_gpPal') p[k] = c[k]; }
  for (k in c.stage2){ if (k !== 'name' && c.stage2[k] != null) p[k] = c.stage2[k]; }
  c._gpPal = p; c._gpPalForm = f.form;
  return p;
}

/* 两头尖的带子：发丝 / 绒毛 / 尾巴都用它 */
function gpStrand(x0,y0,x1,y1,w0,w1,col,bow){
  var dx = x1-x0, dy = y1-y0, L = Math.hypot(dx,dy) || 1;
  var nx = -dy/L, ny = dx/L;
  var mx = (x0+x1)/2 + nx*(bow||0), my = (y0+y1)/2 + ny*(bow||0);
  var bw = w0*0.62 + w1*0.72;
  ctx.fillStyle = col;
  ctx.beginPath();
  ctx.moveTo(x0+nx*w0, y0+ny*w0);
  ctx.quadraticCurveTo(mx+nx*bw, my+ny*bw, x1, y1);
  ctx.quadraticCurveTo(mx-nx*bw, my-ny*bw, x0-nx*w0, y0-ny*w0);
  ctx.closePath();
  ctx.fill();
}

/* 小玫瑰：五瓣 + 花心，礼裙和龙身的装饰都用 */
function gpRose(x, y, r, col, dark){
  ctx.save();
  ctx.translate(x, y);
  ctx.fillStyle = dark || shade(col,-0.16);
  for (var i=0;i<5;i++){
    ctx.rotate(Math.PI*2/5);
    ctx.beginPath(); ctx.ellipse(0, -r*0.62, r*0.66, r*0.44, 0, 0, Math.PI*2); ctx.fill();
  }
  ctx.fillStyle = col;
  for (var j=0;j<5;j++){
    ctx.rotate(Math.PI*2/5);
    ctx.beginPath(); ctx.ellipse(0, -r*0.34, r*0.42, r*0.30, 0, 0, Math.PI*2); ctx.fill();
  }
  ctx.beginPath(); ctx.arc(0, 0, r*0.26, 0, Math.PI*2); ctx.fill();
  ctx.restore();
}

/* 流苏：一个小结 + 三根垂下来的线 */
function gpTassel(x, y, len, col){
  ctx.fillStyle = col;
  ctx.beginPath(); ctx.arc(x, y, 2.2, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = col; ctx.lineWidth = 0.9; ctx.lineCap = 'round';
  for (var i=0;i<3;i++){
    var a = (i-1)*0.22;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.quadraticCurveTo(x + a*7, y + len*0.6, x + a*13, y + len);
    ctx.stroke();
  }
}

/* ---------------- 一形态：少女 ---------------- */

function gpForm1Wings(f, sh, p){
  var m = (f.state === 'attack' && f.atk) ? f.atk.m : null;
  var sp = 0.50;
  if (f.state === 'jump') sp = 0.95;
  else if (f.state === 'block') sp = 0.26;
  else if (f.state === 'hit') sp = 0.34;
  else if (m && m.type === 'dash') sp = 1.0;
  else if (m && (m.type === 'breath' || m.type === 'tail')) sp = 0.74;
  else if (f.state === 'attack') sp = 0.60;

  var flap = Math.sin(f.t*(f.state === 'jump' ? 9 : 2.4))*(0.05 + 0.08*sp);
  var rx = sh.x - 4, ry = sh.y + 2;

  function one(sc, rot, memb, boneC, alpha){
    ctx.save();
    ctx.translate(rx, ry);
    ctx.rotate(rot);
    ctx.scale(sc, sc);
    ctx.globalAlpha = alpha;

    var W = { x: -8, y: -28 };
    var tips = [ {x:-30,y:-52}, {x:-50,y:-42}, {x:-56,y:-20}, {x:-46,y:-2} ];

    ctx.fillStyle = memb;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.quadraticCurveTo(-3, -18, W.x, W.y);
    ctx.quadraticCurveTo(-18, -50, tips[0].x, tips[0].y);
    for (var i=1;i<tips.length;i++){
      var a = tips[i-1], b = tips[i];
      ctx.quadraticCurveTo((a.x+b.x)/2*0.62, (a.y+b.y)/2*0.62, b.x, b.y);
    }
    ctx.quadraticCurveTo(-22, -4, 0, 0);
    ctx.closePath();
    ctx.fill();

    ctx.strokeStyle = boneC; ctx.lineWidth = 1.1; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(0,0); ctx.quadraticCurveTo(-4,-18, W.x, W.y); ctx.stroke();
    ctx.lineWidth = 0.8;
    for (var k=0;k<tips.length;k++){
      ctx.beginPath(); ctx.moveTo(W.x, W.y);
      ctx.quadraticCurveTo((W.x+tips[k].x)/2, (W.y+tips[k].y)/2, tips[k].x, tips[k].y);
      ctx.stroke();
    }

    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.moveTo(W.x-2.4, W.y+0.6);
    ctx.lineTo(W.x+1.8, W.y-1.8);
    ctx.lineTo(W.x+0.2, W.y+2.8);
    ctx.closePath(); ctx.fill();

    ctx.globalAlpha = 1;
    ctx.restore();
  }

  var rot = lerp(-0.52, 0.08, sp) + flap;
  one(0.86, rot - 0.14, shade(p.wing, -0.14), shade(p.horn2, -0.12), 0.94);
  one(1.0, rot, p.wing, p.horn2, 0.97);
}

function gpForm1Tail(f, sh, p){
  var m = (f.state === 'attack' && f.atk) ? f.atk.m : null;
  var sweep = 0, lift = 0;

  if (m && (m.anim === 'dragonTail' || m.type === 'tail')){
    var su = m.startup, ac = m.active, rc = m.recovery, e = f.st;
    if (e < su) sweep = lerp(0, -0.22, ease(e/Math.max(0.001, su)));
    else if (e <= su + ac) sweep = lerp(-0.22, 1, ease((e-su)/Math.max(0.001, ac)));
    else sweep = lerp(1, 0, clamp((e-su-ac)/Math.max(0.001, rc), 0, 1));
  } else if (f.state === 'jump') lift = 1;
  else if (m && (m.type === 'breath' || m.type === 'dash')) lift = 0.9;
  else if (f.state === 'hit') lift = 0.3;
  else if (f.state === 'block') lift = -0.42;

  var sway = Math.sin(f.t*2.0)*0.085;
  var A0 = 3.42 + sway + sweep*2.62 - lift*0.34;
  var A1 = 3.92 + sway*1.2 + sweep*2.50 - lift*0.48;
  var A2 = 4.30 + sway*1.5 + sweep*2.24 - lift*0.58;

  var q0 = { x: -3, y: -6 };
  var q1 = { x: q0.x + Math.cos(A0)*15, y: q0.y - Math.sin(A0)*15 };
  var q2 = { x: q1.x + Math.cos(A1)*15, y: q1.y - Math.sin(A1)*15 };
  var q3 = { x: q2.x + Math.cos(A2)*14, y: q2.y - Math.sin(A2)*14 };

  var pts = [q0, q1, q2, q3];
  var wid = [5.6, 4.6, 3.2, 1.9];

  var g = ctx.createLinearGradient(q0.x, q0.y, q3.x, q3.y);
  g.addColorStop(0, shade(p.tail, 0.10));
  g.addColorStop(0.55, p.tail);
  g.addColorStop(1, shade(p.tail, -0.10));
  ctx.fillStyle = g;

  for (var i=0;i<3;i++){
    var a = pts[i], b = pts[i+1];
    var dx = b.x-a.x, dy = b.y-a.y, L = Math.hypot(dx,dy) || 1;
    var nx = -dy/L, ny = dx/L;
    var wa = wid[i], wb = wid[i+1];
    ctx.beginPath();
    ctx.moveTo(a.x+nx*wa, a.y+ny*wa);
    ctx.lineTo(b.x+nx*wb, b.y+ny*wb);
    ctx.lineTo(b.x-nx*wb, b.y-ny*wb);
    ctx.lineTo(a.x-nx*wa, a.y-ny*wa);
    ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.arc(a.x, a.y, wa, 0, Math.PI*2); ctx.fill();
  }

  /* 尾尖：一撮白绒，随尾巴甩动张开 */
  var ang = Math.atan2(q3.y-q2.y, q3.x-q2.x);
  var open = 0.40 + Math.abs(sweep)*0.30;
  for (var k=0;k<9;k++){
    var aa = ang + (k-4)*open*0.40;
    var ll = 8 + (k===4? 4 : 0) + Math.abs(Math.sin(f.t*3+k))*2.0;
    gpStrand(q3.x, q3.y, q3.x + Math.cos(aa)*ll, q3.y + Math.sin(aa)*ll, 3.4, 0.3,
             k%2 ? '#ffffff' : shade(p.tail, -0.08), 1.2);
  }
  ctx.fillStyle = '#ffffff';
  ctx.beginPath(); ctx.arc(q3.x, q3.y, 2.6, 0, Math.PI*2); ctx.fill();
}

/* 荷叶边裙摆：一层 = 上宽下窄的裙片 + 一段圆弧荷叶边 */
function gpTier(cx, y0, y1, w0, w1, n, col, edge){
  ctx.beginPath();
  ctx.moveTo(cx-w0, y0);
  ctx.lineTo(cx+w0, y0);
  ctx.quadraticCurveTo(cx+w1*0.92, (y0+y1)*0.5, cx+w1, y1-2.5);
  var span = w1*2;
  for (var i=0;i<n;i++){
    var xa = cx+w1 - span*i/n;
    var xb = cx+w1 - span*(i+1)/n;
    ctx.quadraticCurveTo((xa+xb)/2, y1+5.4, xb, y1-2.5);
  }
  ctx.quadraticCurveTo(cx-w1*0.92, (y0+y1)*0.5, cx-w0, y0);
  ctx.closePath();
  ctx.fillStyle = col;
  ctx.fill();

  /* 荷叶边上的浅色描边，把层次拉开 */
  ctx.strokeStyle = edge; ctx.lineWidth = 0.9;
  ctx.beginPath();
  for (var j=0;j<n;j++){
    var x1 = cx+w1 - span*j/n;
    var x2 = cx+w1 - span*(j+1)/n;
    ctx.moveTo(x1, y1-2.0);
    ctx.quadraticCurveTo((x1+x2)/2, y1+5.4, x2, y1-2.0);
  }
  ctx.stroke();
}

function gpForm1Gown(f, sh, hd, p){
  var T = f.t;
  var sway = Math.sin(T*1.6)*1.1 + sh.x*5.0;
  var wst = -8;

  /* 里层（背后的裙片，颜色压深一档） */
  ctx.save();
  ctx.translate(sway*0.25, 0);
  gpTier(-2, wst+2, 34, 12, 31, 5, shade(p.skirt, -0.10), 'rgba(255,255,255,0.5)');
  ctx.restore();

  /* 三层荷叶边，从内到外 */
  ctx.save();
  ctx.translate(sway*0.4, 0);
  gpTier(0, wst, 8, 11, 22, 5, p.skirt, 'rgba(255,255,255,0.8)');
  ctx.restore();

  ctx.save();
  ctx.translate(sway*0.7, 0);
  gpTier(0, wst+3, 21, 13, 27, 6, shade(p.skirt, 0.02), 'rgba(255,255,255,0.9)');
  ctx.restore();

  ctx.save();
  ctx.translate(sway, 0);
  gpTier(0, wst+6, 35, 14, 32, 7, p.skirt, 'rgba(201,184,232,0.85)');
  ctx.restore();

  /* 裙面上的一道竖向褶光 */
  ctx.strokeStyle = 'rgba(255,255,255,0.75)'; ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.moveTo(4, wst+4);
  ctx.quadraticCurveTo(7+sway, 16, 10+sway, 30);
  ctx.stroke();

  /* 腰封 + 蝴蝶结 */
  ctx.fillStyle = shade(p.accent, -0.06);
  rr(-12, wst-5, 24, 6.5, 3); ctx.fill();
  ctx.fillStyle = shade(p.skirt, -0.06);
  rr(-12, wst-5.5, 24, 2.4, 1.2); ctx.fill();

  var bx = -9 + sway*0.5, by = wst-2;
  ctx.fillStyle = p.accent;
  ctx.beginPath();
  ctx.moveTo(bx, by);
  ctx.quadraticCurveTo(bx-9, by-6, bx-8, by+1);
  ctx.quadraticCurveTo(bx-7, by+6, bx, by);
  ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(bx, by);
  ctx.quadraticCurveTo(bx+8, by-5, bx+7, by+2);
  ctx.quadraticCurveTo(bx+6, by+6, bx, by);
  ctx.closePath(); ctx.fill();

  /* 腰侧垂下的流苏链 */
  gpTassel(9 + sway*0.8, wst+2, 11, shade(p.accent, 0.10));
}

function gpForm1Bodice(f, sh, hd, p){
  /* 露肩抹胸：胸口一块白色胸衣，上方是细颈带 */
  ctx.fillStyle = p.dress;
  ctx.beginPath();
  ctx.moveTo(-11, sh.y*0.62);
  ctx.quadraticCurveTo(0, sh.y*0.5, 11, sh.y*0.62);
  ctx.lineTo(10, -6);
  ctx.quadraticCurveTo(0, 1, -10, -6);
  ctx.closePath();
  ctx.fill();

  ctx.strokeStyle = shade(p.dress, -0.10); ctx.lineWidth = 1.0;
  ctx.beginPath();
  ctx.moveTo(-10.5, -7);
  ctx.quadraticCurveTo(0, -1, 10.5, -7);
  ctx.stroke();

  /* 颈带：两根细带绕到脖子后面 */
  ctx.strokeStyle = p.accent; ctx.lineWidth = 1.8; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(-9.5, sh.y*0.62);
  ctx.quadraticCurveTo(0, sh.y*0.34, 9.5, sh.y*0.62);
  ctx.stroke();

  /* 胸前玫瑰 + 垂饰 */
  gpRose(1.5, sh.y*0.74, 4.4, '#e3d8fb', '#c2afe8');
  ctx.strokeStyle = p.accent; ctx.lineWidth = 0.9;
  ctx.beginPath(); ctx.moveTo(1.5, sh.y*0.74+4); ctx.lineTo(1.5, sh.y*0.74+13); ctx.stroke();
  ctx.fillStyle = p.accent;
  ctx.beginPath();
  ctx.moveTo(1.5, sh.y*0.74+13);
  ctx.lineTo(3.4, sh.y*0.74+10);
  ctx.lineTo(1.5, sh.y*0.74+7.4);
  ctx.lineTo(-0.4, sh.y*0.74+10);
  ctx.closePath(); ctx.fill();
}

/* 袖子：肩头一个泡泡袖，小臂一段喇叭袖 + 蕾丝袖口 */
function gpForm1Sleeve(a, sh, back, p){
  var dim = back ? -0.13 : 0;
  var skin = back ? '#f6d9d4' : '#ffe9e2';
  var ang = Math.atan2(a.ey - a.ky, a.ex - a.kx);
  var L = Math.hypot(a.ex-a.kx, a.ey-a.ky);

  /* 上臂 + 前臂：细胳膊，白手套包手 */
  bone(sh.x, sh.y, a.kx, a.ky, 6.4, shade(skin, -0.02));
  bone(a.kx, a.ky, a.ex, a.ey, 5.4, skin);

  /* 肩头泡泡袖 */
  ctx.fillStyle = shade(p.dress, dim);
  ctx.beginPath();
  ctx.ellipse(sh.x*0.86, sh.y + 4, 6.6, 5.8, ang*0.2, 0, Math.PI*2);
  ctx.fill();
  ctx.strokeStyle = shade(p.dress, -0.12 - dim*0.4); ctx.lineWidth = 0.9;
  ctx.beginPath(); ctx.arc(sh.x*0.86, sh.y + 4, 5.8, -2.5, -0.7); ctx.stroke();

  /* 小臂上的白袖：贴着前臂的一段，靠手腕处收一圈褶边 */
  ctx.save();
  ctx.translate(a.kx, a.ky);
  ctx.rotate(ang);
  ctx.fillStyle = shade(p.dress, dim);
  ctx.beginPath();
  ctx.moveTo(0, -4.6);
  ctx.quadraticCurveTo(L*0.55, -5.4, L*0.82, -3.4);
  ctx.quadraticCurveTo(L*0.92, 0, L*0.82, 3.4);
  ctx.quadraticCurveTo(L*0.55, 5.4, 0, 4.6);
  ctx.closePath();
  ctx.fill();

  ctx.strokeStyle = 'rgba(255,255,255,0.95)'; ctx.lineWidth = 1.0;
  ctx.beginPath();
  for (var i=0;i<3;i++){
    var y1 = -3.2 + i*3.2;
    ctx.moveTo(L*0.80, y1);
    ctx.quadraticCurveTo(L*0.94, y1+1.6, L*0.80, y1+3.2);
  }
  ctx.stroke();
  ctx.restore();

  /* 手套 */
  ctx.fillStyle = shade('#fdf9ff', dim*0.8);
  ctx.beginPath(); ctx.ellipse(a.ex, a.ey, 4.6, 4.2, ang, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = shade(p.accent, 0.24);
  ctx.beginPath(); ctx.arc(a.ex + Math.cos(ang)*3.2, a.ey + Math.sin(ang)*3.2, 1.1, 0, Math.PI*2); ctx.fill();
}

function gpForm1Leg(l, back, p){
  var sock = back ? '#eae1f8' : '#fdfbff';

  bone(0, 0, l.kx, l.ky, 6.6, sock);
  bone(l.kx, l.ky, l.ex, l.ey, 5.6, sock);

  /* 袜口一圈蕾丝 */
  var mx = l.kx + (l.ex-l.kx)*0.55, my = l.ky + (l.ey-l.ky)*0.55;
  ctx.fillStyle = back ? '#ded2f1' : '#f0e9fd';
  ctx.beginPath(); ctx.ellipse(mx, my, 3.8, 1.9, Math.atan2(l.ey-l.ky, l.ex-l.kx), 0, Math.PI*2); ctx.fill();

  /* 小白鞋 */
  ctx.fillStyle = back ? '#f2ecfd' : '#ffffff';
  ctx.beginPath(); ctx.ellipse(l.ex + 1.2, l.ey + 1.2, 5.2, 3.6, 0, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = shade(p.accent, 0.36);
  ctx.beginPath(); ctx.ellipse(l.ex + 1.2, l.ey + 3.0, 5.0, 1.3, 0, 0, Math.PI*2); ctx.fill();
}

function gpHorn(hd, p, back){
  var bx = hd.x + (back ? -7.4 : 6.4);
  var by = hd.y - 15.5;
  var s = back ? 0.86 : 1.0;

  ctx.save();
  ctx.translate(bx, by);
  ctx.rotate(back ? -0.26 : 0.02);
  ctx.scale(s, s);

  var g = ctx.createLinearGradient(5, 3, -6, -24);
  if (back){
    g.addColorStop(0, shade(p.horn2, -0.18));
    g.addColorStop(0.5, shade(p.horn, -0.14));
    g.addColorStop(1, shade(p.horn, -0.02));
  } else {
    g.addColorStop(0, p.horn2);
    g.addColorStop(0.32, p.horn);
    g.addColorStop(1, '#ffffff');
  }

  /* 粗壮的弯角：根部 8，尖端向后钩 */
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(8.2, 3.6);
  ctx.quadraticCurveTo(8.8, -5.6, 4.8, -13.6);
  ctx.quadraticCurveTo(1.4, -19.6, -6.4, -25.0);
  ctx.quadraticCurveTo(-1.2, -15.8, -2.4, -9.0);
  ctx.quadraticCurveTo(-3.6, -2.4, -7.6, 2.8);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = 'rgba(148,130,188,0.5)'; ctx.lineWidth = 0.9; ctx.stroke();

  /* 高光 */
  ctx.strokeStyle = 'rgba(255,255,255,0.8)'; ctx.lineWidth = 1.4; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(6.2, 0.6);
  ctx.quadraticCurveTo(6.2, -8.0, 1.6, -16.4);
  ctx.stroke();

  /* 环纹 */
  ctx.strokeStyle = 'rgba(178,160,214,0.5)'; ctx.lineWidth = 0.85;
  for (var i=0;i<3;i++){
    var yy = 0.6 - i*4.6;
    ctx.beginPath();
    ctx.moveTo(-5.0 + i*0.5, yy + 0.8);
    ctx.quadraticCurveTo(-0.6 + i*0.4, yy + 2.0, 6.2 - i*1.0, yy - 1.2);
    ctx.stroke();
  }

  ctx.fillStyle = shade(p.horn2, -0.08);
  ctx.beginPath(); ctx.ellipse(0.4, 3.0, 4.4, 1.6, 0.06, 0, Math.PI*2); ctx.fill();

  ctx.restore();
}

function gpEar(hd, p, back){
  var s = back ? 0.9 : 1.0;
  ctx.save();
  ctx.translate(hd.x - 13.5, hd.y - 3.0);
  ctx.scale(s, s);
  ctx.rotate(-0.18);
  ctx.fillStyle = back ? '#f3dfdc' : '#ffe9e2';
  ctx.beginPath();
  ctx.moveTo(1.6, 1.4);
  ctx.quadraticCurveTo(-8.0, -3.0, -13.4, -9.4);
  ctx.quadraticCurveTo(-7.0, -1.0, -3.4, 6.2);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = 'rgba(206,150,160,0.6)'; ctx.lineWidth = 0.8;
  ctx.beginPath();
  ctx.moveTo(-2.0, 1.0);
  ctx.quadraticCurveTo(-7.6, -2.6, -10.2, -6.2);
  ctx.stroke();
  ctx.restore();
}

function gpForm1HairBack(f, hd, p, T){
  var sw = Math.sin(T*1.55)*2.6;
  var sw2 = Math.sin(T*1.55 + 0.9)*3.2;

  /* 大块后发：从头顶一路铺到腰下，越往下越蓬 */
  ctx.beginPath();
  wSmooth([
    [hd.x-13, hd.y-16],
    [hd.x-29+sw*0.5, hd.y-6],
    [hd.x-34+sw, hd.y+14],
    [hd.x-33+sw2, hd.y+32],
    [hd.x-27+sw2, hd.y+46],
    [hd.x-16+sw*0.4, hd.y+52],
    [hd.x-5, hd.y+50],
    [hd.x-1, hd.y+30],
    [hd.x+1, hd.y+8],
    [hd.x-5, hd.y-12]
  ], true);
  var g = ctx.createLinearGradient(hd.x-36, hd.y-10, hd.x-2, hd.y+54);
  g.addColorStop(0, shade(p.hair, -0.06));
  g.addColorStop(0.55, shade(p.hair, -0.15));
  g.addColorStop(1, shade(p.hair2, -0.06));
  ctx.fillStyle = g;
  ctx.fill();

  /* 一缕一缕的波浪，末端往外卷 */
  var lock = [
    [hd.x-12, hd.y-10, hd.x-30+sw,  hd.y+30, 7.4, 1.4, -5.0],
    [hd.x-9,  hd.y-6,  hd.x-38+sw2, hd.y+44, 6.6, 1.2, -6.5],
    [hd.x-6,  hd.y-2,  hd.x-28+sw,  hd.y+54, 5.8, 1.0,  4.5],
    [hd.x-15, hd.y+2,  hd.x-20+sw2, hd.y+40, 5.0, 1.0, -3.0]
  ];
  for (var i=0;i<lock.length;i++){
    var L = lock[i];
    gpStrand(L[0], L[1], L[2], L[3], L[4], L[5], i%2 ? shade(p.hair, -0.05) : p.hair2, -4.0);
    /* 卷梢：一小段圆弧勾回来 */
    ctx.strokeStyle = i%2 ? shade(p.hair, -0.02) : p.hair;
    ctx.lineWidth = 2.6; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(L[2], L[3]);
    ctx.quadraticCurveTo(L[2]-6, L[3]+5, L[2]+1, L[3]+8);
    ctx.stroke();
  }

  /* 白色高光发丝 */
  ctx.strokeStyle = 'rgba(255,255,255,0.72)'; ctx.lineWidth = 1.3; ctx.lineCap = 'round';
  for (var k=0;k<3;k++){
    ctx.beginPath();
    ctx.moveTo(hd.x-16+k*4, hd.y-4);
    ctx.quadraticCurveTo(hd.x-28+sw*0.8+k*3, hd.y+22, hd.x-24+sw2*0.6+k*2, hd.y+44);
    ctx.stroke();
  }
}

function gpForm1HairFront(f, hd, p, T){
  var R = HEAD_R;
  var bob = Math.sin(T*1.5)*0.7;

  /* 发帽：只包住上半颗头，露出额头让刘海压下来 */
  ctx.beginPath();
  ctx.moveTo(hd.x - R - 2.4, hd.y + 1.5);
  ctx.quadraticCurveTo(hd.x - R - 4.6, hd.y - R - 5.5, hd.x - 2, hd.y - R - 7.0);
  ctx.quadraticCurveTo(hd.x + R + 3.4, hd.y - R - 7.6, hd.x + R + 2.2, hd.y - 1.0);
  ctx.quadraticCurveTo(hd.x + R - 2.0, hd.y - 11.0, hd.x + 3.0, hd.y - 13.6);
  ctx.quadraticCurveTo(hd.x - 9.0, hd.y - 15.6, hd.x - R + 1.2, hd.y - 9.6);
  ctx.closePath();
  var g = ctx.createLinearGradient(hd.x, hd.y-R-8, hd.x, hd.y+2);
  g.addColorStop(0, '#ffffff');
  g.addColorStop(0.55, p.hair);
  g.addColorStop(1, shade(p.hair, -0.04));
  ctx.fillStyle = g;
  ctx.fill();

  /* 刘海：四缕尖发，从发际线垂到眼睛上方 */
  var fringe = [
    { x: hd.x + 17.5, y: hd.y - 1.0, w: 5.4, sx: hd.x + 10, sy: hd.y - 14 },
    { x: hd.x + 8.0,  y: hd.y + 2.0, w: 4.6, sx: hd.x + 4,  sy: hd.y - 15 },
    { x: hd.x - 2.0,  y: hd.y - 0.5, w: 4.8, sx: hd.x - 3,  sy: hd.y - 15 },
    { x: hd.x - 12.0, y: hd.y + 3.5, w: 4.2, sx: hd.x - 9,  sy: hd.y - 13 }
  ];
  for (var i=0;i<fringe.length;i++){
    var F = fringe[i];
    gpStrand(F.sx, F.sy, F.x, F.y, F.w, 0.7, i===3 ? shade(p.hair, -0.05) : p.hair, i%2 ? 2.0 : -2.0);
  }

  /* 刘海高光 */
  ctx.fillStyle = 'rgba(255,255,255,0.6)';
  ctx.beginPath();
  ctx.moveTo(hd.x - 13, hd.y - 15);
  ctx.quadraticCurveTo(hd.x - 2, hd.y - 21, hd.x + 12, hd.y - 15);
  ctx.quadraticCurveTo(hd.x - 1, hd.y - 16, hd.x - 12, hd.y - 11);
  ctx.closePath(); ctx.fill();

  /* 两侧长鬓发：垂到胸口，末端往里打卷 */
  gpStrand(hd.x - 16, hd.y - 6, hd.x - 18 + bob, hd.y + 24, 5.0, 1.3, shade(p.hair, -0.03), 2.6);
  gpStrand(hd.x + 17, hd.y - 5, hd.x + 19 + bob, hd.y + 20, 4.4, 1.1, p.hair, -2.4);
  ctx.strokeStyle = p.hair; ctx.lineWidth = 1.9; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(hd.x - 18 + bob, hd.y + 24);
  ctx.quadraticCurveTo(hd.x - 22 + bob, hd.y + 29, hd.x - 16 + bob, hd.y + 31);
  ctx.stroke();

  /* 呆毛 */
  ctx.strokeStyle = p.hair; ctx.lineWidth = 2.2; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(hd.x + 1, hd.y - R - 6);
  ctx.quadraticCurveTo(hd.x + 10, hd.y - R - 18, hd.x + 2, hd.y - R - 21);
  ctx.stroke();

  /* 侧编发：一列交错的发辫，从太阳穴垂到锁骨 */
  for (var j=0;j<7;j++){
    var u = j/6;
    var bx = hd.x - 15.0 - u*3.4 + Math.sin(u*3.4)*1.2;
    var by = hd.y - 5 + u*30;
    ctx.fillStyle = j%2 ? shade(p.hair2, -0.02) : p.hair;
    ctx.beginPath();
    ctx.ellipse(bx, by, 3.3 - u*1.0, 2.6 - u*0.6, 0.65 + j*0.5, 0, Math.PI*2);
    ctx.fill();
    ctx.strokeStyle = 'rgba(190,172,224,0.45)'; ctx.lineWidth = 0.6;
    ctx.beginPath();
    ctx.moveTo(bx-1.9, by-1.0);
    ctx.lineTo(bx+1.8, by+0.9);
    ctx.stroke();
  }
  gpTassel(hd.x - 18.6, hd.y + 25, 8, p.accent);

  /* 编发根部的薰衣草发环 */
  ctx.strokeStyle = '#c8b6ec'; ctx.lineWidth = 1.8;
  ctx.beginPath(); ctx.arc(hd.x - 14.6, hd.y - 7.0, 3.0, 0, Math.PI*2); ctx.stroke();
  ctx.fillStyle = '#e9e0ff';
  ctx.beginPath(); ctx.arc(hd.x - 14.6, hd.y - 7.0, 1.3, 0, Math.PI*2); ctx.fill();
}

function gpForm1Head(f, hd, p, T){
  var R = HEAD_R;

  /* 头整体放大 1.2 倍：Q 版大头才撑得住这一头长发 */
  ctx.save();
  ctx.translate(hd.x, hd.y);
  ctx.scale(1.20, 1.20);
  ctx.translate(-hd.x, -hd.y);

  gpEar(hd, p, true);

  ctx.fillStyle = '#ffe9e2';
  ctx.beginPath(); ctx.arc(hd.x, hd.y, R, 0, Math.PI*2); ctx.fill();

  /* 下颌的柔和阴影 */
  var jg = ctx.createRadialGradient(hd.x + 3, hd.y + 12, 1, hd.x + 3, hd.y + 12, 15);
  jg.addColorStop(0, 'rgba(214,158,166,0.28)');
  jg.addColorStop(1, 'rgba(214,158,166,0)');
  ctx.save();
  ctx.beginPath(); ctx.arc(hd.x, hd.y, R, 0, Math.PI*2); ctx.clip();
  ctx.fillStyle = jg;
  ctx.fillRect(hd.x-R, hd.y, R*2, R);
  ctx.restore();

  drawFace(hd, p, f);

  gpHorn(hd, p, true);
  gpForm1HairFront(f, hd, p, T);
  gpHorn(hd, p, false);

  ctx.restore();
}

function gpForm1(f, D, P, sh, hd, aF, aB, lF, lB){
  var p = gpPal(f);
  var tailFront = !!(f.state === 'attack' && f.atk &&
                     (f.atk.m.anim === 'dragonTail' || f.atk.m.type === 'tail'));

  if (!tailFront) gpForm1Tail(f, sh, p);
  gpForm1Wings(f, sh, p);
  gpForm1HairBack(f, hd, p, f.t);

  /* 腿画在裙子后面：长裙只露出袜口和小白鞋 */
  gpForm1Leg(lB, true, p);
  gpForm1Leg(lF, false, p);

  gpForm1Sleeve(aB, sh, true, p);

  /* 裙 + 胸衣 */
  gpForm1Gown(f, sh, hd, p);
  gpForm1Bodice(f, sh, hd, p);

  if (tailFront) gpForm1Tail(f, sh, p);

  gpForm1Head(f, hd, p, f.t);

  /* 前臂压在最上层 */
  gpForm1Sleeve(aF, sh, false, p);

  /* 出手时：手套尖聚一点冷光，让打击点更明确 */
  if (f.state === 'attack' && f.atk){
    var m = f.atk.m;
    if (m.fx === 'claw' || m.fx === 'fang' || m.fx === 'lash'){
      var e = f.st, s0 = m.startup, s1 = s0 + m.active;
      if (e >= s0*0.6 && e <= s1){
        var fl = 0.5 + Math.abs(Math.sin(G.t*22))*0.35;
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        ctx.globalAlpha = fl*0.8;
        var fg = ctx.createRadialGradient(aF.ex+3, aF.ey, 1, aF.ex+3, aF.ey, 11);
        fg.addColorStop(0, 'rgba(255,255,255,0.95)');
        fg.addColorStop(0.45, 'rgba(219,206,255,0.85)');
        fg.addColorStop(1, 'rgba(219,206,255,0)');
        ctx.fillStyle = fg;
        ctx.beginPath(); ctx.arc(aF.ex+3, aF.ey, 11, 0, Math.PI*2); ctx.fill();
        ctx.restore();
      }
    }
  }
}

/* ---------------- 二形态：龙王 ---------------- */

function gpForm2Geom(f){
  var t = f.t;
  var m = (f.state === 'attack' && f.atk) ? f.atk.m : null;
  var e = f.st;

  var thrust = 0, lift = 0, jaw = 0, tailArc = 0, wingSp = 0.56, lunge = 0, duck = 0;
  var bob = Math.sin(t*2.0)*1.6;

  if (m){
    var s0 = Math.max(0.001, m.startup);
    var s1 = s0 + m.active;
    var wind = clamp(e/s0, 0, 1);
    var act  = clamp((e - s0)/Math.max(0.001, m.active), 0, 1);
    var rec  = e > s1 ? clamp((e - s1)/Math.max(0.001, m.recovery), 0, 1) : 0;
    var punch = e < s0 ? -0.30*Math.sin(wind*Math.PI*0.5)
                       : (e <= s1 ? Math.sin(act*Math.PI*0.72) : 1 - rec);

    if (m.type === 'breath'){
      thrust = e < s0 ? -3.5 : 7.0*Math.sin(clamp(act,0,1)*Math.PI*0.8);
      jaw = e < s0 ? 0.16*wind : (e <= s1 ? 1 : 1 - clamp((e-s1)/0.16, 0, 1));
      lift = e < s0 ? 3.5*wind : -1.5;
      wingSp = 0.82;
    } else if (m.type === 'tail' || m.anim === 'dragonTail'){
      thrust = -6.0*punch;
      tailArc = e < s0 ? -0.22*Math.sin(wind*Math.PI*0.5) : (e <= s1 ? 1 : 1 - rec);
      jaw = 0.35*Math.max(0, punch);
      wingSp = 0.74;
    } else if (m.type === 'dash'){
      thrust = 15*punch; lunge = 9*punch; jaw = 0.85*Math.max(0,punch);
      wingSp = 1.0; lift = -4*punch;
    } else if (m.anim === 'airStrike'){
      thrust = 10*punch; jaw = 0.5*Math.max(0,punch); wingSp = 0.9; lift = 5;
    } else {
      thrust = 12*punch; jaw = 0.5*Math.max(0,punch); wingSp = 0.64;
      lift = (m.anim === 'upper' || m.sig === 'fang') ? 9*punch : 0;
    }
  } else if (f.state === 'jump'){
    wingSp = 1.0; lift = 2;
  } else if (f.state === 'block'){
    duck = 1; wingSp = 0.30;
  } else if (f.state === 'hit'){
    thrust = -5; lift = -2.5; wingSp = 0.42;
  } else if (f.state === 'walk'){
    wingSp = 0.5;
  }

  var hx = 48 + thrust + lunge*(1 - duck*0.4);
  var hy = -94 + lift + bob*0.7 + duck*7;
  var jawA = jaw*0.42;

  return {
    bob: bob, thrust: thrust, lift: lift, jaw: jaw, jawA: jawA,
    tailArc: tailArc, wingSp: wingSp, lunge: lunge, duck: duck,
    hip:  { x: -46, y: -42 + bob + duck*7 },
    chst: { x: 12 + lunge, y: -54 + bob + duck*5 },
    head: { x: hx, y: hy },
    mouth:{ x: hx + 22, y: hy + 4 - jaw*1.5 },
    claw: { x: 40, y: -14 }
  };
}

/* 一段粗细渐变的管子（脖子、尾巴、四肢） */
function gpTube(pts, wid, col){
  ctx.fillStyle = col;
  for (var i=0;i<pts.length-1;i++){
    var a = pts[i], b = pts[i+1];
    var dx = b.x-a.x, dy = b.y-a.y, L = Math.hypot(dx,dy) || 1;
    var nx = -dy/L, ny = dx/L;
    var wa = wid[i], wb = wid[i+1];
    ctx.beginPath();
    ctx.moveTo(a.x+nx*wa, a.y+ny*wa);
    ctx.lineTo(b.x+nx*wb, b.y+ny*wb);
    ctx.lineTo(b.x-nx*wb, b.y-ny*wb);
    ctx.lineTo(a.x-nx*wa, a.y-ny*wa);
    ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.arc(a.x, a.y, wa, 0, Math.PI*2); ctx.fill();
  }
  var L2 = pts.length-1;
  ctx.beginPath(); ctx.arc(pts[L2].x, pts[L2].y, wid[L2], 0, Math.PI*2); ctx.fill();
}

/* 龙爪：一只脚 + 三根前伸的爪尖 */
function gpClawPaw(x, y, s, col, clawCol, back){
  ctx.fillStyle = col;
  ctx.beginPath(); ctx.ellipse(x, y-2.0*s, 7.4*s, 4.4*s, 0, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = back ? shade(clawCol, -0.12) : clawCol;
  for (var i=0;i<3;i++){
    var bx = x + (i-1)*3.6*s + 2.2*s;
    ctx.beginPath();
    ctx.moveTo(bx - 1.5*s, y - 2.6*s);
    ctx.quadraticCurveTo(bx + 4.2*s, y - 3.4*s, bx + 5.0*s, y + 0.6*s);
    ctx.quadraticCurveTo(bx + 2.0*s, y + 1.6*s, bx - 1.2*s, y - 0.4*s);
    ctx.closePath(); ctx.fill();
  }
}

/* 巨翼：三段指骨 + 荷叶状翼膜 + 盘长结与流苏 */
function gpBigWing(x, y, sc, tilt, alpha, p, back){
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(sc, sc);
  ctx.rotate(tilt);
  ctx.globalAlpha = alpha;

  var memb = back ? shade(p.wing, -0.16) : p.wing;
  var edge = back ? shade(p.wingEdge, -0.12) : p.wingEdge;
  var boneC = back ? shade(p.horn2, -0.08) : p.horn2;

  var E = { x: -18, y: -48 };
  var W = { x: -36, y: -80 };
  var tips = [ {x:-98,y:-104}, {x:-114,y:-64}, {x:-102,y:-16}, {x:-74,y:4} ];

  /* 翼膜 */
  var g = ctx.createLinearGradient(0, 0, -104, -70);
  g.addColorStop(0, shade(memb, -0.10));
  g.addColorStop(0.55, memb);
  g.addColorStop(1, shade(memb, 0.14));
  ctx.fillStyle = g;

  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.quadraticCurveTo(E.x*0.6, E.y*1.08, W.x, W.y);
  ctx.quadraticCurveTo(-62, -104, tips[0].x, tips[0].y);
  for (var i=1;i<tips.length;i++){
    var a = tips[i-1], b = tips[i];
    ctx.quadraticCurveTo((a.x+b.x)/2*0.66, (a.y+b.y)/2*0.66, b.x, b.y);
  }
  ctx.quadraticCurveTo(-30, -8, 0, 0);
  ctx.closePath();
  ctx.fill();

  /* 膜内的一道朝光 */
  ctx.globalAlpha = alpha*0.5;
  ctx.strokeStyle = 'rgba(255,255,255,0.85)';
  ctx.lineWidth = 1.4;
  ctx.beginPath();
  ctx.moveTo(W.x+3, W.y+6);
  ctx.quadraticCurveTo(-56, -62, tips[1].x+8, tips[1].y+6);
  ctx.stroke();
  ctx.globalAlpha = alpha;

  /* 指骨 */
  ctx.strokeStyle = boneC; ctx.lineCap = 'round';
  ctx.lineWidth = 3.2;
  ctx.beginPath(); ctx.moveTo(0,0); ctx.quadraticCurveTo(E.x*0.70, E.y, W.x, W.y); ctx.stroke();
  ctx.lineWidth = 2.2;
  for (var k=0;k<tips.length;k++){
    ctx.beginPath();
    ctx.moveTo(W.x, W.y);
    ctx.quadraticCurveTo((W.x+tips[k].x)/2 - 4, (W.y+tips[k].y)/2 - 4, tips[k].x, tips[k].y);
    ctx.stroke();
  }

  /* 爪尖 */
  ctx.fillStyle = back ? '#e6dcff' : '#ffffff';
  for (var m2=0;m2<tips.length;m2++){
    var tp = tips[m2];
    ctx.beginPath();
    ctx.moveTo(tp.x - 4.0, tp.y + 1.2);
    ctx.lineTo(tp.x + 2.2, tp.y - 1.0);
    ctx.lineTo(tp.x - 1.0, tp.y - 4.4);
    ctx.closePath(); ctx.fill();
  }

  /* 盘长结：两个交错的环 + 中心珠，挂在翼膜上 */
  var kx = -56, ky = -58;
  ctx.globalAlpha = alpha*0.92;
  ctx.strokeStyle = edge; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(kx-4, ky, 7.0, -0.4, Math.PI*1.5); ctx.stroke();
  ctx.beginPath(); ctx.arc(kx+4, ky, 7.0, Math.PI*0.9, Math.PI*2.5); ctx.stroke();
  ctx.fillStyle = shade(p.wing, 0.3);
  ctx.beginPath(); ctx.arc(kx, ky, 2.2, 0, Math.PI*2); ctx.fill();

  /* 流苏：从结下垂下来，随翅膀轻摆 */
  gpTassel(kx, ky + 8, 15, shade(edge, 0.08));
  gpTassel(kx - 18, ky + 22, 11, shade(edge, 0.16));

  ctx.globalAlpha = 1;
  ctx.restore();
}

function gpForm2(f, D, P, sh, hd){
  var p = gpPal(f);
  var g = gpForm2Geom(f);
  var T = f.t;

  ctx.save();
  ctx.translate(0, D.toes);       // 把原点挪到地面

  var bodyC = p.body || '#f8f4ff';
  var bodyD = shade(bodyC, -0.10);
  var bellyC = '#fffdf8';

  /* 背光：淡紫的一圈，压住背景 */
  var ag = ctx.createRadialGradient(g.chst.x, g.chst.y - 20, 8, g.chst.x, g.chst.y - 20, 96);
  ag.addColorStop(0, 'rgba(214,198,255,0.20)');
  ag.addColorStop(1, 'rgba(214,198,255,0)');
  ctx.fillStyle = ag;
  ctx.beginPath(); ctx.arc(g.chst.x, g.chst.y - 20, 96, 0, Math.PI*2); ctx.fill();

  var flap = Math.sin(T*(f.state === 'jump' ? 7.5 : 1.7))*0.06;
  var wSp = g.wingSp;

  /* 远侧翼（先压深） */
  gpBigWing(g.chst.x - 10, g.chst.y - 12, 0.94, lerp(-0.52, 0.06, wSp) - flap*0.7, 0.92, p, true);

  /* 尾巴（甩尾时改画到身前） */
  var tailFront = g.tailArc > 0.5;
  if (!tailFront) gpForm2Tail(f, g, p);

  /* 远侧两条腿 */
  gpForm2Legs(f, g, p, true);

  /* 身体主体 */
  ctx.beginPath();
  wSmooth([
    [g.chst.x+18, g.chst.y-16],
    [g.chst.x+24, g.chst.y+6],
    [g.chst.x+14, g.chst.y+26],
    [g.chst.x-8,  g.chst.y+34],
    [g.hip.x-16,  g.hip.y+30],
    [g.hip.x-28,  g.hip.y+8],
    [g.hip.x-24,  g.hip.y-16],
    [g.hip.x-6,   g.hip.y-28],
    [g.chst.x-12, g.chst.y-26]
  ], true);
  var bg2 = ctx.createLinearGradient(g.chst.x, g.chst.y-30, g.hip.x, g.hip.y+30);
  bg2.addColorStop(0, shade(bodyC, 0.06));
  bg2.addColorStop(0.55, bodyC);
  bg2.addColorStop(1, shade(bodyC, -0.16));
  ctx.fillStyle = bg2;
  ctx.fill();
  ctx.strokeStyle = shade(p.wingEdge, -0.04); ctx.lineWidth = 1.2;
  ctx.stroke();

  /* 腹鳞：一排排压暗的圆弧，从胸口铺到肚皮 */
  ctx.save();
  ctx.beginPath();
  wSmooth([
    [g.chst.x+16, g.chst.y-10],
    [g.chst.x+22, g.chst.y+8],
    [g.chst.x+8,  g.chst.y+28],
    [g.chst.x-14, g.chst.y+30],
    [g.chst.x-30, g.hip.y+20],
    [g.hip.x-12,  g.hip.y+18],
    [g.chst.x-14, g.chst.y-14]
  ], true);
  ctx.clip();
  ctx.fillStyle = bellyC;
  ctx.fillRect(-120, -140, 240, 200);
  ctx.strokeStyle = 'rgba(196,182,226,0.55)'; ctx.lineWidth = 0.9;
  for (var r2=0;r2<6;r2++){
    var yy = g.chst.y - 6 + r2*8.0;
    ctx.beginPath();
    ctx.moveTo(g.chst.x-26, yy);
    ctx.quadraticCurveTo(g.chst.x-4, yy+5.0, g.chst.x+19, yy-2.0);
    ctx.stroke();
  }
  ctx.restore();

  /* 背脊鳞纹 */
  ctx.strokeStyle = 'rgba(184,168,216,0.5)'; ctx.lineWidth = 0.9;
  for (var s2=0;s2<5;s2++){
    var sx2 = g.hip.x - 4 + s2*13;
    ctx.beginPath();
    ctx.moveTo(s2 % 2 ? g.chst.y-24 : g.chst.y-30);
    ctx.lineTo(g.chst.y - 16);
    ctx.stroke();
  }

  /* 脖子：从胸口伸向头的锥形 */
  gpTube([{x:g.chst.x+12, y:g.chst.y-16},
          {x:g.head.x-16, y:g.head.y+16},
          {x:g.head.x-4,  y:g.head.y+6}], [15.5, 11.5, 9.5], bodyC);

  /* 颈后鬃毛：一大把往后飘的白毛 */
  gpForm2Mane(f, g, p);

  /* 近侧腿 */
  gpForm2Legs(f, g, p, false);

  /* 头 */
  gpForm2Head(f, g, p);

  if (tailFront) gpForm2Tail(f, g, p);

  /* 近侧翼 */
  gpBigWing(g.chst.x - 4, g.chst.y - 16, 1.0, lerp(-0.46, 0.10, wSp) + flap, 0.97, p, false);

  /* 胸前的玫瑰与流苏（对应原画的装饰） */
  gpRose(g.chst.x - 6, g.chst.y + 2, 5.0, '#efe6ff', '#cbb9ea');
  gpTassel(g.chst.x - 6, g.chst.y + 8, 14, '#cbb9ea');

  ctx.restore();
}

function gpForm2Tail(f, g, p){
  var arc = g.tailArc;
  var sway = Math.sin(f.t*1.8)*0.07;

  var A0 = 3.02 + sway - arc*0.9;
  var A1 = 2.62 + sway*1.2 - arc*1.9;
  var A2 = 2.20 + sway*1.4 - arc*2.7;

  var q0 = { x: g.hip.x - 8, y: g.hip.y + 6 };
  var q1 = { x: q0.x + Math.cos(A0)*26, y: q0.y - Math.sin(A0)*26 };
  var q2 = { x: q1.x + Math.cos(A1)*26, y: q1.y - Math.sin(A1)*26 };
  var q3 = { x: q2.x + Math.cos(A2)*24, y: q2.y - Math.sin(A2)*24 };

  gpTube([q0,q1,q2,q3], [10.5, 8.0, 5.6, 3.0], shade(p.body || '#f8f4ff', -0.05));

  /* 尾背的小棘 */
  ctx.fillStyle = shade(p.horn2, 0.16);
  for (var i=1;i<3;i++){
    var pt = [q0,q1,q2][i];
    ctx.beginPath();
    ctx.moveTo(pt.x-3.4, pt.y+2.6);
    ctx.lineTo(pt.x+3.4, pt.y+0.6);
    ctx.lineTo(pt.x, pt.y-6.4);
    ctx.closePath(); ctx.fill();
  }

  /* 尾端白绒 */
  var ang = Math.atan2(q3.y-q2.y, q3.x-q2.x);
  for (var k=0;k<9;k++){
    var aa = ang + (k-4)*0.24;
    var ll = 18 + Math.abs(Math.sin(f.t*2.4+k))*3 + (k===4?5:0);
    gpStrand(q3.x, q3.y, q3.x+Math.cos(aa)*ll, q3.y+Math.sin(aa)*ll, 5.0, 0.4,
             k%2 ? '#ffffff' : shade(p.hair, -0.04), 1.6);
  }
  ctx.fillStyle = '#ffffff';
  ctx.beginPath(); ctx.arc(q3.x, q3.y, 3.4, 0, Math.PI*2); ctx.fill();
}

function gpForm2Mane(f, g, p){
  var T = f.t;
  var sway = Math.sin(T*1.9)*2.4;

  /* 头后一大把长发，顺着脖子往后披 */
  for (var i=0;i<8;i++){
    var u = i/7;
    var x0 = g.head.x - 10 + u*3.0;
    var y0 = g.head.y - 8 + u*11;
    var x1 = x0 - 34 - u*10 + sway*(0.4+u*0.5);
    var y1 = y0 + 34 + u*12;
    gpStrand(x0, y0, x1, y1, 5.6-u*1.4, 1.2,
             i%2 ? shade(p.hair, -0.05) : p.hair, -3.0-u*2.0);
  }

  /* 颈侧的一圈短毛 */
  ctx.fillStyle = 'rgba(255,255,255,0.92)';
  for (var k=0;k<6;k++){
    var a = -0.5 + k*0.42;
    ctx.beginPath();
    ctx.ellipse(g.head.x - 14 - k*2.5, g.head.y + 16 + Math.sin(a)*4, 6.0, 2.6, a, 0, Math.PI*2);
    ctx.fill();
  }

  /* 鬃毛高光 */
  ctx.strokeStyle = 'rgba(255,255,255,0.8)'; ctx.lineWidth = 1.2;
  for (var j=0;j<3;j++){
    ctx.beginPath();
    ctx.moveTo(g.head.x - 14 - j*3, g.head.y - 2 + j*5);
    ctx.quadraticCurveTo(g.head.x - 40 - j*4, g.head.y + 16 + j*6, g.head.x - 52 - j*3, g.head.y + 40 + j*4);
    ctx.stroke();
  }
}

function gpForm2Legs(f, g, p, back){
  var bodyC = p.body || '#f8f4ff';
  var col = back ? shade(bodyC, -0.14) : bodyC;
  var dk = back ? -0.12 : 0;

  if (back){
    /* 远侧前腿 */
    gpTube([{x:g.chst.x-6, y:g.chst.y+8},
            {x:g.chst.x-2, y:g.chst.y+26},
            {x:g.chst.x+4, y:18}], [7.6, 5.6, 4.6], col);
    gpClawPaw(g.chst.x+8, 0, 0.9, col, shade(p.horn, -0.10), true);
    /* 远侧后腿 */
    gpTube([{x:g.hip.x-14, y:g.hip.y+10},
            {x:g.hip.x-20, y:g.hip.y+30},
            {x:g.hip.x-14, y:22}], [9.0, 6.4, 5.0], col);
    gpClawPaw(g.hip.x-6, 0, 0.95, col, shade(p.horn, -0.10), true);
    return;
  }

  /* 后腿：粗壮的大腿 + 小腿，脚掌平放 */
  gpTube([{x:g.hip.x-4, y:g.hip.y+6},
          {x:g.hip.x-10, y:g.hip.y+24},
          {x:g.hip.x-2, y:24}], [13.0, 8.0, 6.0], col);
  gpClawPaw(g.hip.x+6, 0, 1.1, col, p.horn, false);

  /* 前腿 */
  gpTube([{x:g.chst.x+6, y:g.chst.y+10},
          {x:g.chst.x+12, y:g.chst.y+28},
          {x:g.chst.x+16, y:26}], [9.6, 6.4, 5.0], col);
  gpClawPaw(g.chst.x+20, 0, 1.0, col, p.horn, false);

  /* 前腿上的踝饰：一圈蕾丝 */
  ctx.strokeStyle = 'rgba(203,185,234,0.85)'; ctx.lineWidth = 1.0;
  ctx.beginPath();
  ctx.moveTo(g.chst.x+8, g.chst.y+34);
  ctx.quadraticCurveTo(g.chst.x+16, g.chst.y+37, g.chst.x+21, g.chst.y+31);
  ctx.stroke();
}

function gpForm2Head(f, g, p){
  var hx = g.head.x, hy = g.head.y;
  var jawA = g.jawA;

  ctx.save();
  ctx.translate(hx, hy);

  /* 耳鳍：头后侧一片扇形小鳍 */
  ctx.fillStyle = shade(p.wing, -0.04);
  ctx.beginPath();
  ctx.moveTo(-8, -2);
  ctx.quadraticCurveTo(-24, -12, -22, 2);
  ctx.quadraticCurveTo(-20, 10, -6, 6);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = shade(p.wingEdge, -0.10); ctx.lineWidth = 0.8;
  ctx.stroke();

  /* 颈后的角冠：三支向后掠的白角 */
  var horns = [
    { x0:-2, y0:-9,  x1:-30, y1:-30, w:3.4 },
    { x0: 4, y0:-10, x1:-10, y1:-33, w:3.0 },
    { x0:-7, y0:-6,  x1:-30, y1:-14, w:2.6 }
  ];
  for (var i=0;i<horns.length;i++){
    var H = horns[i];
    gpStrand(H.x0, H.y0, H.x1, H.y1, H.w, 0.4,
             i === 1 ? '#ffffff' : p.horn, -1.5);
    ctx.strokeStyle = 'rgba(178,160,214,0.5)'; ctx.lineWidth = 0.7;
    ctx.beginPath();
    ctx.moveTo(H.x0-1.2, H.y0+1.0);
    ctx.quadraticCurveTo((H.x0+H.x1)/2, (H.y0+H.y1)/2 + 1.6, H.x1+1.0, H.y1+1.0);
    ctx.stroke();
  }

  /* 下颌（张开时绕铰点转） */
  ctx.save();
  ctx.translate(2, 4);
  ctx.rotate(jawA);
  ctx.translate(-2, -4);
  ctx.fillStyle = shade('#f0e6fb', -0.06);
  ctx.beginPath();
  ctx.moveTo(0, 3.0);
  ctx.quadraticCurveTo(12, 3.0, 21, 1.6);
  ctx.quadraticCurveTo(23, 5.2, 20, 7.2);
  ctx.quadraticCurveTo(11, 10.2, 1, 8.0);
  ctx.closePath();
  ctx.fill();
  /* 下排牙 */
  ctx.fillStyle = '#ffffff';
  for (var t2=0;t2<4;t2++){
    ctx.beginPath();
    ctx.moveTo(6+t2*3.6, 2.4);
    ctx.lineTo(7.6+t2*3.6, 5.0);
    ctx.lineTo(9.2+t2*3.6, 2.4);
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();

  /* 上颌 + 头骨 */
  ctx.fillStyle = p.body || '#f8f4ff';
  ctx.beginPath();
  ctx.moveTo(-11, 2);
  ctx.quadraticCurveTo(-15, -8, -6, -13);
  ctx.quadraticCurveTo(2, -17, 10, -11);
  ctx.quadraticCurveTo(18, -6, 23, -2);
  ctx.quadraticCurveTo(26, 0.6, 22, 3.0);
  ctx.quadraticCurveTo(12, 5.0, 0, 4.4);
  ctx.quadraticCurveTo(-7, 4.0, -11, 2);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = shade(p.wingEdge, -0.02); ctx.lineWidth = 1.0;
  ctx.stroke();

  /* 上排牙 */
  ctx.fillStyle = '#ffffff';
  for (var t3=0;t3<4;t3++){
    ctx.beginPath();
    ctx.moveTo(8+t3*3.4, 3.6);
    ctx.lineTo(9.4+t3*3.4, 6.2);
    ctx.lineTo(10.8+t3*3.4, 3.6);
    ctx.closePath(); ctx.fill();
  }

  /* 鼻孔 */
  ctx.fillStyle = shade(p.wingEdge, -0.20);
  ctx.beginPath(); ctx.ellipse(19, 0.2, 1.6, 1.0, -0.3, 0, Math.PI*2); ctx.fill();

  /* 眼睛：紫罗兰竖瞳 */
  var eg = ctx.createRadialGradient(4, -5, 0.6, 4, -5, 5.4);
  eg.addColorStop(0, '#ffffff');
  eg.addColorStop(0.30, p.eye || '#8a6fd8');
  eg.addColorStop(1, shade(p.eye || '#8a6fd8', -0.45));
  ctx.fillStyle = eg;
  ctx.beginPath(); ctx.ellipse(4.2, -5.0, 4.2, 3.4, -0.12, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#221a38';
  ctx.beginPath(); ctx.ellipse(4.6, -5.0, 1.2, 2.9, -0.12, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.95)';
  ctx.beginPath(); ctx.arc(2.8, -6.4, 1.3, 0, Math.PI*2); ctx.fill();

  /* 眉骨 */
  ctx.strokeStyle = shade(p.wingEdge, -0.08); ctx.lineWidth = 1.3; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(-1.2, -8.6);
  ctx.quadraticCurveTo(5, -10.6, 9.6, -7.6);
  ctx.stroke();

  /* 龙须：两根细长的触须 */
  ctx.strokeStyle = 'rgba(238,230,255,0.95)'; ctx.lineWidth = 0.9;
  for (var w2=0; w2<2; w2++){
    ctx.beginPath();
    ctx.moveTo(20, 2 + w2*2);
    ctx.quadraticCurveTo(30, 6 + w2*5, 26 - w2*3, 16 + w2*6);
    ctx.stroke();
  }

  ctx.restore();
}


/* 总调度：一形态走少女，二形态走龙王 */
function drawGpFigure(f, D, P, sh, hd, aF, aB, lF, lB){
  if (drawGpSprite(f, D, P)) return;

  /* 贴图还在解码的那一两帧：给一个干净的剪影，绝不回退到手绘稿 */
  gpSilhouette(f);
}

function gpSilhouette(f){
  var GG = f.form ? GP2_GEO : GP1_GEO;
  var k = gpSpriteK(f), h = GG.h*k, w = GG.w*k;
  ctx.save();
  ctx.fillStyle = f.form ? 'rgba(228,218,255,0.42)' : 'rgba(246,242,255,0.45)';
  ctx.beginPath();
  ctx.ellipse(0, -h*0.66, w*0.26, h*0.30, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(0, -h*0.26, w*0.32, h*0.26, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();
}

/* 龙形态的嘴（吐息 / 龙吼特效的起点），含体型偏移 */
function gpMouth(f){
  if (!f.form && GP1_OK){
    var G1 = GP1_GEO, D1 = dimsOf(f), a1 = gpAnim(f);
    var k1 = gpSpriteK(f), mir1 = gpMir(f, G1);
    var mx1 = mir1*(G1.mouth[0] - G1.axis)*k1;
    var my1 = (G1.mouth[1] - G1.bot)*k1;
    return { x: mx1*a1.sx + a1.dx, y: D1.toes + my1*a1.sy + a1.dy };
  }
  if (f.form && GP2_OK){
    var GG = GP2_GEO, D2 = dimsOf(f), a = gpAnim(f);
    var k = gpSpriteK(f), mir = gpMir(f, GG);
    var mx = mir*(GG.mouth[0] - GG.axis)*k;
    var my = (GG.mouth[1] - GG.bot)*k;
    return { x: mx*a.sx + a.dx, y: D2.toes + my*a.sy + a.dy };
  }
  var g = gpForm2Geom(f);
  return { x: g.mouth.x, y: g.mouth.y + dimsOf(f).toes };
}


/* ================= DeepSeek 娘：蓝鲸女仆 ================= */

/* 立绘参考：渐变蓝长发 / 鱼鳍耳 / 白蕾丝头巾 + 蓝蝴蝶结 / 藏青女仆裙 + 白围裙鲸鱼徽章

   / 白过膝袜 + 玛丽珍鞋 / 蓝鲸尾。一阶段 Q 版（2.2 头身），二阶段长身。

   所有尺寸以头半径 R 为单位，两阶段共用同一套画法，只换 DIMS。 */



/* 调色：二阶段把发色 / 裙子 / 尾巴整体提亮 */

function whalePal(c, form){

  var p = {

    hair:c.hair, hair2:c.hair2, hair3:c.hair3, dress:c.dress, accent:c.accent,

    skirt:c.skirt, gold:c.gold, bow:c.bow, frill:c.frill, fin:c.fin,

    finEdge:c.finEdge, tail:c.tail, tail2:c.tail2, aura:c.aura

  };

  if (form && c.stage2){

    for (var k in c.stage2){

      if (k !== 'name' && c.stage2[k]) p[k] = c.stage2[k];

    }

  }

  return p;

}



/* 平滑闭合路径：点阵当控制点，用中点二次曲线串起来（发丝 / 鳍片 / 裙摆都靠它） */

function wSmooth(pts, closed){

  var n = pts.length;

  if (n < 3) return;

  if (closed){

    ctx.moveTo((pts[n-1][0]+pts[0][0])/2, (pts[n-1][1]+pts[0][1])/2);

    for (var i=0;i<n;i++){

      var a = pts[i], b = pts[(i+1)%n];

      ctx.quadraticCurveTo(a[0], a[1], (a[0]+b[0])/2, (a[1]+b[1])/2);

    }

    ctx.closePath();

  } else {

    ctx.moveTo(pts[0][0], pts[0][1]);

    for (var j=1;j<n-1;j++){

      ctx.quadraticCurveTo(pts[j][0], pts[j][1], (pts[j][0]+pts[j+1][0])/2, (pts[j][1]+pts[j+1][1])/2);

    }

    ctx.lineTo(pts[n-1][0], pts[n-1][1]);

  }

}

function wInk(a){ return 'rgba(36,48,92,' + a + ')'; }

function wLW(R, k, min){ return Math.max(min || 0.65, R*k); }





/* 头形：上圆下收的鹅蛋脸，下巴收窄 */

function wHeadPath(hd, R){

  ctx.beginPath();

  ctx.moveTo(hd.x - R*0.92, hd.y - R*0.10);

  ctx.bezierCurveTo(hd.x - R*0.94, hd.y - R*0.72, hd.x - R*0.54, hd.y - R*1.08, hd.x, hd.y - R*1.08);

  ctx.bezierCurveTo(hd.x + R*0.54, hd.y - R*1.08, hd.x + R*0.94, hd.y - R*0.72, hd.x + R*0.92, hd.y - R*0.10);

  ctx.bezierCurveTo(hd.x + R*0.90, hd.y + R*0.34, hd.x + R*0.56, hd.y + R*0.86, hd.x, hd.y + R*1.04);

  ctx.bezierCurveTo(hd.x - R*0.56, hd.y + R*0.86, hd.x - R*0.90, hd.y + R*0.34, hd.x - R*0.92, hd.y - R*0.10);

  ctx.closePath();

}



/* 身体共用锚点 */

function wGeom(D, sh, form){

  var R = D.headR, BH = D.toes;

  return {

    R: R, BH: BH,

    wy: sh.y + R*(form ? 0.70 : 0.62),

    hy: BH * (form ? 0.62 : 0.575),

    hw: Math.max(R*(form ? 1.14 : 1.06), BH*0.42),

    ww: R*(form ? 0.56 : 0.54)

  };

}



/* ---------- 后发 ---------- */

function wHairBack(p, hd, R, t, form, BH){

  var L = Math.min((BH*0.90 - hd.y) / R, 2.06);

  var sway = Math.sin(t*1.35)*0.05;

  var raw = [

    [ 0.00,-1.30],[ 0.64,-1.18],[ 1.06,-0.80],[ 1.18,-0.14],

    [ 1.44, 0.32],[ 1.18, 0.78],[ 1.46, 1.32],[ 1.16, 1.82],

    [ 1.42, 2.38],[ 1.14, 2.84],

    [ 0.98, L-0.10],[ 0.70, L-0.40],[ 0.34, L-0.12],[ 0.00, L-0.42],

    [-0.34, L-0.10],[-0.70, L-0.40],[-0.98, L-0.10],

    [-1.14, 2.82],[-1.42, 2.36],[-1.16, 1.80],[-1.46, 1.30],

    [-1.18, 0.76],[-1.44, 0.30],[-1.16,-0.14],[-1.04,-0.82],[-0.62,-1.20]

  ];

  var pts = [];

  for (var i=0;i<raw.length;i++){

    var oy = raw[i][1];

    /* 侧边的长度按 L 等比压缩，别让发梢插到地面以下 */

    if (oy > 1.0) oy = 1.0 + (oy - 1.0) * ((L - 1.0) / 1.86);

    var k = Math.max(0, oy) / L;

    pts.push([hd.x + (raw[i][0] + sway*k*1.8)*R, hd.y + oy*R]);

  }

  var g = ctx.createLinearGradient(hd.x, hd.y - R*1.05, hd.x, hd.y + R*L);

  g.addColorStop(0, shade(p.hair, 0.06));

  g.addColorStop(0.30, p.hair);

  g.addColorStop(0.70, shade(p.hair2, -0.14));

  g.addColorStop(1, shade(p.hair2, -0.02));



  ctx.save();

  ctx.fillStyle = g;

  ctx.beginPath(); wSmooth(pts, true); ctx.fill();

  ctx.strokeStyle = wInk(0.22); ctx.lineWidth = wLW(R, 0.032); ctx.stroke();



  ctx.strokeStyle = p.hair3; ctx.globalAlpha = 0.20;

  ctx.lineWidth = wLW(R, 0.050, 1); ctx.lineCap = 'round';

  for (var s=0;s<4;s++){

    var sx = hd.x + (s-1.5)*R*0.44;

    ctx.beginPath();

    ctx.moveTo(sx, hd.y + R*0.34);

    ctx.quadraticCurveTo(sx - R*0.20, hd.y + R*(L*0.52), sx - R*0.05, hd.y + R*(L-0.34));

    ctx.stroke();

  }

  ctx.restore();

}





/* ---------- 前发：发帽 + 顺滑刘海 + 鬓发 + 呆毛 ---------- */

function wHairFront(p, hd, R, t, form){

  var g = ctx.createLinearGradient(hd.x, hd.y - R*1.30, hd.x, hd.y + R*0.90);

  g.addColorStop(0, shade(p.hair, 0.16));

  g.addColorStop(0.30, shade(p.hair, 0.04));

/* ---------- 白蕾丝头巾：环绕发顶的一圈花边 ---------- */

function wHeaddress(hd, p, R, t, form){

  var a0 = Math.PI*1.115, a1 = Math.PI*1.885, N = 30;

  function rOut(u){ return R*(1.085 + 0.075*Math.sin(u*Math.PI)); }

  function rIn(u){  var s0 = Math.sin(u*Math.PI), tp = Math.min(1, s0*3.4);

    return R*((0.945 + 0.055*s0)*(1-tp) + (1.085 + 0.075*s0)*tp); }



  ctx.save();



  /* 内缘在头发上投的一圈影，让蕾丝像压在发上 */

  ctx.strokeStyle = 'rgba(38,50,96,0.30)';

  ctx.lineWidth = wLW(R, 0.070);

  ctx.lineJoin = 'round';

  ctx.beginPath();

  for (var q=0;q<=N;q++){

    var uq = q/N, aq = a0+(a1-a0)*uq, rq = rIn(uq)*0.96;

    var qx = hd.x + Math.cos(aq)*rq, qy = hd.y + Math.sin(aq)*rq;

    if (q===0) ctx.moveTo(qx,qy); else ctx.lineTo(qx,qy);

  }

  ctx.stroke();



  /* 外缘小齿：一圈小半圆 */

  ctx.fillStyle = '#ffffff';

  for (var k=0;k<20;k++){

    var uk = k/19, ak = a0 + (a1-a0)*uk;

    ctx.beginPath();

    ctx.arc(hd.x + Math.cos(ak)*rOut(uk)*0.995, hd.y + Math.sin(ak)*rOut(uk)*0.995, R*0.040, 0, Math.PI*2);

    ctx.fill();

  }

  /* 内缘小齿 */

  for (var m=0;m<16;m++){

    var um = m/15, am = a0 + (a1-a0)*um;

    ctx.beginPath();

    ctx.arc(hd.x + Math.cos(am)*rIn(um)*1.00, hd.y + Math.sin(am)*rIn(um)*1.00, R*0.028, 0, Math.PI*2);

    ctx.fill();

  }



  /* 主带 */

  var bg = ctx.createLinearGradient(hd.x, hd.y - R*1.20, hd.x, hd.y - R*0.34);

  bg.addColorStop(0, '#ffffff');

  bg.addColorStop(0.62, '#f4f9ff');

  bg.addColorStop(1, '#dfeaf8');

  ctx.fillStyle = bg;

  ctx.beginPath();

  for (var i=0;i<=N;i++){

    var u = i/N, a = a0 + (a1-a0)*u;

    var px = hd.x + Math.cos(a)*rOut(u), py = hd.y + Math.sin(a)*rOut(u);

    if (i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);

  }

  for (var j=N;j>=0;j--){

    var u2 = j/N;

    ctx.lineTo(hd.x + Math.cos(a0+(a1-a0)*u2)*rIn(u2), hd.y + Math.sin(a0+(a1-a0)*u2)*rIn(u2));

  }

  ctx.closePath();

  ctx.fill();



  /* 带上的两道细线 + 镂空点 */

  ctx.strokeStyle = 'rgba(146,176,214,0.55)';

  ctx.lineWidth = wLW(R, 0.016);

  ctx.beginPath();

  for (var s3=0;s3<=N;s3++){

    var us = s3/N, as = a0 + (a1-a0)*us;

    var rs = (rIn(us)*0.34 + rOut(us)*0.66);

    var gx = hd.x + Math.cos(as)*rs, gy = hd.y + Math.sin(as)*rs;

    if (s3===0) ctx.moveTo(gx,gy); else ctx.lineTo(gx,gy);

  }

  ctx.stroke();



  ctx.fillStyle = 'rgba(150,180,218,0.60)';

  for (var d=0;d<13;d++){

    var ud = (d+0.5)/13, ad = a0 + (a1-a0)*ud;

    var rd = (rIn(ud)*0.62 + rOut(ud)*0.38);

    ctx.beginPath();

    ctx.arc(hd.x + Math.cos(ad)*rd, hd.y + Math.sin(ad)*rd, R*0.013, 0, Math.PI*2);

    ctx.fill();

  }



  /* 外缘细蓝边 */

  ctx.strokeStyle = 'rgba(126,160,202,0.42)';

  ctx.lineWidth = wLW(R, 0.014);

  ctx.beginPath();

  for (var s4=0;s4<=N;s4++){

    var u4 = s4/N, a4 = a0 + (a1-a0)*u4;

    var x4 = hd.x + Math.cos(a4)*rOut(u4), y4 = hd.y + Math.sin(a4)*rOut(u4);

    if (s4===0) ctx.moveTo(x4,y4); else ctx.lineTo(x4,y4);

  }

  ctx.stroke();



  ctx.restore();

}

function wFace(hd, p, f, R){

  ctx.fillStyle = bl;

  ctx.beginPath(); ctx.ellipse(nearX+R*0.02, eyeY+R*0.30, R*0.26, R*0.16, -0.08, 0, Math.PI*2); ctx.fill();

  var bl2 = ctx.createRadialGradient(farX-R*0.06, eyeY+R*0.32, R*0.02, farX-R*0.06, eyeY+R*0.32, R*0.23);

  bl2.addColorStop(0, 'rgba(255,142,152,0.24)');

  bl2.addColorStop(1, 'rgba(255,142,152,0)');

  ctx.fillStyle = bl2;

  ctx.beginPath(); ctx.ellipse(farX-R*0.06, eyeY+R*0.32, R*0.23, R*0.14, 0.08, 0, Math.PI*2); ctx.fill();

  ctx.restore();



  wEye(farX, eyeY, ewF, ehF, open*(hit?0.74:1), -1);

  wEye(nearX, eyeY, ewN, ehN, open*(hit?0.74:1),  1);

    ctx.lineCap = 'round';

    ctx.moveTo(mx-R*0.055, my-R*0.004);

    ctx.quadraticCurveTo(mx, my+R*0.036, mx+R*0.055, my-R*0.004);

    ctx.stroke();

}



/* ---------- 鲸尾 ---------- */

function wTail(f, p, D, sh){

  var R = D.headR;

  var lift = 0;

  if (f.state === 'attack' && f.atk){

    var u = clamp(f.st/totalDur(f.atk.m), 0, 1);

    lift = Math.sin(u*Math.PI);

    if (f.atk.m.anim !== 'sweep' && f.atk.m.anim !== 'dragonTail') lift *= 0.25;

  }

  var sway = Math.sin(f.t*1.7)*0.05 + Math.sin(f.t*0.63)*0.03;

  var p0 = { x: -R*0.40, y: -R*0.10 };

  var p1 = { x: -R*(0.96 + sway*0.6), y: R*(0.30 - lift*0.10) };

  var p2 = { x: -R*(1.34 + sway), y: R*(0.34 - lift*0.26) };

  var p3 = { x: -R*(1.50 + sway), y: R*(0.02 - lift*0.44) };

  var wid = [R*0.320, R*0.200, R*0.095];

  var pts = [p0,p1,p2,p3];



  var g = ctx.createLinearGradient(p0.x, p0.y, p3.x, p3.y);

  g.addColorStop(0, shade(p.tail, 0.22));

  g.addColorStop(0.50, p.tail);

  g.addColorStop(1, shade(p.tail, -0.12));



  ctx.save();

  ctx.lineCap = 'round';

  /* 外描边 */

  for (var io=0;io<3;io++){

    ctx.strokeStyle = wInk(0.26);

    ctx.lineWidth = wid[io]*2 + 1.6;

    ctx.beginPath();

    ctx.moveTo(pts[io].x, pts[io].y);

    ctx.quadraticCurveTo((pts[io].x+pts[io+1].x)/2 - R*0.09, (pts[io].y+pts[io+1].y)/2, pts[io+1].x, pts[io+1].y);

    ctx.stroke();

  }

  for (var i=0;i<3;i++){

    ctx.strokeStyle = g;

    ctx.lineWidth = wid[i]*2;

    ctx.beginPath();

    ctx.moveTo(pts[i].x, pts[i].y);

    ctx.quadraticCurveTo((pts[i].x+pts[i+1].x)/2 - R*0.09, (pts[i].y+pts[i+1].y)/2, pts[i+1].x, pts[i+1].y);

    ctx.stroke();

  }

  ctx.globalAlpha = 0.40;

  ctx.strokeStyle = p.tail2;

  for (var j=0;j<2;j++){

    ctx.lineWidth = wid[j]*0.54;

    ctx.beginPath();

    ctx.moveTo(pts[j].x, pts[j].y + wid[j]*0.40);

    ctx.quadraticCurveTo((pts[j].x+pts[j+1].x)/2 - R*0.09, (pts[j].y+pts[j+1].y)/2 + wid[j]*0.44,

                         pts[j+1].x, pts[j+1].y + wid[j+1]*0.40);

    ctx.stroke();

  }

  ctx.globalAlpha = 1;



  var ang = Math.atan2(p3.y-p2.y, p3.x-p2.x);

  ctx.translate(p3.x, p3.y);

  ctx.rotate(ang - Math.PI/2 + 0.62);

  var w = R*0.66, h = R*0.58;

  var fg = ctx.createLinearGradient(0, 0, 0, h*1.1);

  fg.addColorStop(0, shade(p.tail, 0.18));

  fg.addColorStop(0.55, p.tail);

  fg.addColorStop(1, shade(p.tail, -0.16));

  ctx.fillStyle = fg;

  ctx.beginPath();

  ctx.moveTo(0, 0);

  ctx.bezierCurveTo(w*0.76, -h*0.20, w*1.16, h*0.34, w*1.10, h*0.94);

  ctx.quadraticCurveTo(w*0.66, h*0.76, 0, h*0.54);

  ctx.quadraticCurveTo(-w*0.66, h*0.76, -w*1.10, h*0.94);

  ctx.bezierCurveTo(-w*1.16, h*0.34, -w*0.76, -h*0.20, 0, 0);

  ctx.closePath();

  ctx.fill();

  ctx.strokeStyle = wInk(0.22); ctx.lineWidth = wLW(R, 0.024); ctx.stroke();

  ctx.strokeStyle = 'rgba(226,244,255,0.30)';

  ctx.lineWidth = wLW(R, 0.030, 0.9);

  for (var fk2=0; fk2<2; fk2++){

    var fv = (fk2 ? 0.60 : -0.60);

    ctx.beginPath();

    ctx.moveTo(0, h*0.20);

    ctx.quadraticCurveTo(w*fv*0.66, h*0.52, w*fv*0.98, h*0.82);

    ctx.stroke();

  }

  ctx.restore();

}

/* ---------- 女仆裙 ---------- */

function wDress(f, p, sh, hd, D, form){

  bg.addColorStop(0.62, shade(p.skirt, 0.10));

  bg.addColorStop(1, shade(p.skirt, -0.04));

  ctx.fillStyle = bg;

  ctx.beginPath();

  ctx.moveTo(-bwT, bTop + R*0.16);

  ctx.quadraticCurveTo(-bwT*1.06, bTop - R*0.10, -bwT*0.52, bTop - R*0.14);

  ctx.quadraticCurveTo(0, bBot + R*0.26, -bwB, bBot);

    var x1 = sgn*R*0.15, y1 = bTop + R*0.04;

    var x2 = sgn*R*0.33, y2 = aTop + R*0.02;

    var sw2 = R*0.082;

    ctx.fillStyle = p.frill;

    ctx.beginPath();

    ctx.moveTo(x1 - sw2, y1);

    ctx.quadraticCurveTo((x1+x2)/2 - sw2*1.15, (y1+y2)/2, x2 - sw2, y2);

    ctx.lineTo(x2 + sw2, y2);

    ctx.quadraticCurveTo((x1+x2)/2 + sw2*1.15, (y1+y2)/2, x1 + sw2, y1);

    ctx.closePath();

    ctx.fill();

    ctx.strokeStyle = 'rgba(150,178,214,0.42)';

    ctx.lineWidth = wLW(R, 0.014);

    ctx.stroke();

  }

  /* 三颗白扣子 */

  ctx.fillStyle = 'rgba(238,247,255,0.96)';

  for (var bt=0;bt<3;bt++){

    ctx.beginPath();

    ctx.arc(0, bTop + R*(0.15 + bt*0.135), R*0.034, 0, Math.PI*2);

    ctx.fill();

  }



  /* 鲸鱼刺绣：居中、独立坐标系 */

  var emY = aTop + (aBot - aTop)*0.60, emS = R*0.0112;

  ctx.save();

  ctx.translate(0, emY);

  /* 虚线圈 */

  ctx.strokeStyle = 'rgba(150,178,214,0.42)';

  ctx.lineWidth = wLW(R, 0.014);

  ctx.setLineDash([R*0.026, R*0.022]);

  ctx.beginPath();

  ctx.arc(0, 0, R*0.185, 0, Math.PI*2);

  ctx.stroke();

  ctx.setLineDash([]);

  ctx.scale(emS, emS);

  ctx.fillStyle = '#3d7fc6';

  /* 身体 */

  ctx.beginPath();

  ctx.moveTo(-14.0, 0.6);

  ctx.bezierCurveTo(-13.0, -8.0, 1.0, -11.2, 11.0, -7.6);

  ctx.bezierCurveTo(17.0, -5.0, 17.2, 4.4, 11.0, 7.4);

  ctx.bezierCurveTo(1.0, 11.0, -12.4, 8.4, -14.0, 0.6);

  ctx.closePath();

  ctx.fill();

  /* 尾鳍 */

  ctx.beginPath();

  ctx.moveTo(-12.6, -1.6);

  ctx.quadraticCurveTo(-20.4, -9.0, -24.4, -3.4);

  ctx.quadraticCurveTo(-20.2, -0.8, -22.2, 3.8);

  ctx.quadraticCurveTo(-17.6, 2.8, -12.4, 1.8);

  ctx.closePath();

  ctx.fill();

  /* 腹部 */

  ctx.fillStyle = 'rgba(234,247,255,0.95)';

  ctx.beginPath();

  ctx.ellipse(1.2, 5.2, 10.0, 3.8, -0.05, 0, Math.PI*2);

  ctx.fill();

  /* 眼 */

  ctx.fillStyle = '#16305c';

  ctx.beginPath(); ctx.arc(9.4, -1.6, 1.5, 0, Math.PI*2); ctx.fill();

  /* 喷水 */

  ctx.strokeStyle = '#79c1ee';

  ctx.lineWidth = 1.5; ctx.lineCap = 'round';

  ctx.beginPath();

  ctx.moveTo(3.4, -10.2); ctx.quadraticCurveTo(3.0, -15.6, 6.6, -16.4);

  ctx.moveTo(-0.4, -10.4); ctx.quadraticCurveTo(-2.0, -15.0, -5.0, -14.2);

  ctx.stroke();

  ctx.restore();



  /* 白领子：绕颈一圈的蕾丝小披，不做成大斗篷 */

  var cY = sh.y + R*0.24;

  ctx.fillStyle = '#ffffff';

  ctx.beginPath();

  ctx.moveTo(-R*0.46, cY - R*0.10);

  ctx.quadraticCurveTo(0, cY - R*0.30, R*0.46, cY - R*0.10);

  /* 下缘：五个小弧，做出荷叶边 */

  var cxs = [-0.46, -0.28, -0.10, 0.10, 0.28, 0.46];

  for (var ci=5; ci>0; ci--){

    var cx0 = cxs[ci], cx1 = cxs[ci-1];

    var cdep = cY + R*0.26;

    ctx.quadraticCurveTo(R*((cx0+cx1)/2), cdep + R*0.05, R*cx1, cY + R*0.19);

  }

  ctx.closePath();

  ctx.fill();

  ctx.strokeStyle = 'rgba(140,172,212,0.45)';

  ctx.lineWidth = wLW(R, 0.016);

  ctx.stroke();



  /* 领结 */

  var ny = sh.y + R*0.46;

  ctx.save();

  ctx.translate(0, ny);

  ctx.scale(R, R);

  ctx.fillStyle = p.bow;

  ctx.beginPath();

  ctx.moveTo(-0.03,-0.05); ctx.bezierCurveTo(-0.19,-0.19,-0.34,-0.08,-0.27,0.04);

  ctx.bezierCurveTo(-0.22,0.12,-0.10,0.09,-0.03,0.05); ctx.closePath(); ctx.fill();

  ctx.beginPath();

  ctx.moveTo(0.03,-0.05); ctx.bezierCurveTo(0.19,-0.19,0.34,-0.08,0.27,0.04);

  ctx.bezierCurveTo(0.22,0.12,0.10,0.09,0.03,0.05); ctx.closePath(); ctx.fill();

  ctx.fillStyle = shade(p.bow, -0.12);

  ctx.beginPath();

  ctx.moveTo(-0.05,0.04); ctx.lineTo(-0.11,0.19); ctx.lineTo(-0.03,0.16); ctx.closePath(); ctx.fill();

  ctx.beginPath();

  ctx.moveTo(0.05,0.04); ctx.lineTo(0.11,0.18); ctx.lineTo(0.03,0.15); ctx.closePath(); ctx.fill();

  ctx.restore();

  ctx.fillStyle = p.gold;

  ctx.beginPath(); ctx.arc(0, ny + R*0.01, R*0.062, 0, Math.PI*2); ctx.fill();

  ctx.fillStyle = '#9ccdf2';

  ctx.beginPath(); ctx.arc(0, ny + R*0.01, R*0.034, 0, Math.PI*2); ctx.fill();

  ctx.restore();

}

function wAura(f, sh, hd, D, R){

  var t = f.t, cy = sh.y*0.20;

  ctx.save();

  ctx.globalCompositeOperation = 'lighter';

  var g = ctx.createRadialGradient(0, cy, 3, 0, cy, R*3.2);

  g.addColorStop(0, 'rgba(150,222,255,0.15)');

  g.addColorStop(0.45, 'rgba(96,170,255,0.06)');

  g.addColorStop(1, 'rgba(70,130,255,0)');

  ctx.fillStyle = g;

  ctx.beginPath(); ctx.ellipse(0, cy, R*3.0, R*3.8, 0, 0, Math.PI*2); ctx.fill();

  ctx.strokeStyle = 'rgba(190,240,255,0.20)';

  ctx.lineWidth = 1.2;

  ctx.beginPath(); ctx.ellipse(0, cy, R*2.20, R*0.52, -0.16, 0, Math.PI*2); ctx.stroke();

  ctx.globalAlpha = 0.45;

  ctx.beginPath(); ctx.ellipse(0, cy, R*1.70, R*0.46, 0.20, 0, Math.PI*2); ctx.stroke();

  ctx.globalAlpha = 1;

  for (var i=0;i<10;i++){

    var a = t*0.85 + i*0.628;

    var rr3 = R*(1.30 + 0.55*Math.sin(t*1.1 + i*1.7));

    ctx.globalAlpha = 0.26 + 0.44*Math.abs(Math.sin(t*2.2 + i*1.3));

    ctx.fillStyle = (i%3) ? '#cdeeff' : '#ffffff';

    ctx.beginPath(); ctx.arc(Math.cos(a)*rr3*1.30, cy + Math.sin(a)*rr3*0.85, Math.max(1.1, R*0.070), 0, Math.PI*2); ctx.fill();

  }

  ctx.restore();

}



function wVeil(f, sh, D){

  var R = D.headR;

  var top = sh.y + R*0.10, bot = D.toes*0.92;

  var g = ctx.createLinearGradient(0, top, 0, bot);

  g.addColorStop(0, 'rgba(160,225,255,0.16)');

  g.addColorStop(0.55, 'rgba(90,170,245,0.07)');

  g.addColorStop(1, 'rgba(70,140,235,0)');

  ctx.save();

  ctx.fillStyle = g;

  ctx.beginPath();

  ctx.moveTo(-R*0.50, top);

  ctx.quadraticCurveTo(-R*2.20, top + (bot-top)*0.42, -R*1.86, bot);

  ctx.quadraticCurveTo(-R*0.70, bot + R*0.40, 0, bot - R*0.22);

  ctx.quadraticCurveTo(R*0.72, bot + R*0.30, R*1.38, bot*0.88);

  ctx.quadraticCurveTo(R*1.14, top + (bot-top)*0.40, R*0.50, top);

  ctx.closePath();

  ctx.fill();

  ctx.globalCompositeOperation = 'lighter';

  for (var i=0;i<7;i++){

    var an = i*1.618 + Math.sin(f.t*0.6 + i)*0.4;

    ctx.globalAlpha = 0.32 + 0.34*Math.abs(Math.sin(f.t*1.7 + i));

    ctx.fillStyle = '#e6f8ff';

    ctx.beginPath();

    ctx.arc(Math.cos(an)*R*1.40, top + (bot-top)*(0.18+0.16*i), Math.max(0.9, R*0.05), 0, Math.PI*2);

    ctx.fill();

  }

  ctx.restore();

}

var DSQ_IMG = new Image(), DSQ_OK = false, DSQ_WHITE = null;

var DSQ_ARM = { L: new Image(), R: new Image() }, DSQ_AW = { L: null, R: null };



function dsqToWhite(img){

  try{

    var cv = document.createElement('canvas');

    cv.width = img.naturalWidth; cv.height = img.naturalHeight;

    var g = cv.getContext('2d');

    g.drawImage(img, 0, 0);

    g.globalCompositeOperation = 'source-in';

    g.fillStyle = '#ffffff';

    g.fillRect(0, 0, cv.width, cv.height);

    return cv;

  }catch(e){ return null; }

}

var CL_ARM = new Image(), CL_ARM_OK = false, CL_ARM_WHITE = null;

/* 图内几何：w/h 贴图尺寸，top/bot 发顶/鞋底，axis 人物中轴 */

var DSQ_GEO = { w:540, h:720, top:95, bot:718, axis:280 };

/* 手臂在原图中的包围盒 [x0,y0,x1,y1] 与肩关节（旋转轴心） */

var DSQ_AB = { L:[144,453,219,584], R:[362,455,433,582] };

var DSQ_AS = { L:[195,462], R:[400,462] };



function drawWhaleSprite(f, D, P, sh, hd, fm){

  if (!DSQ_OK) return false;

  var G = DSQ_GEO;

  var k  = (D.toes + D.torso + D.headOff + D.headR*1.08) / (G.bot - G.top) * 1.10;

  var dw = G.w*k, dh = G.h*k;

  var ox = -G.axis*k, oy = D.toes - G.bot*k;

  var t = f.t, lean = P.lean;

  var ar = lean*0.45, dx = 0, dy = 0, sx = 1, sy = 1;

  var aF = 0, aB = 0, ext = 0;

  var stretchF = false, stretchB = false;

  f._fistX = undefined; f._fistY = undefined;



  if (f.state === 'idle'){

    var br = Math.sin(t*2.3);

    dy = br*0.5; sy = 1 + br*0.008; sx = 1 - br*0.006;

    ar = lean*0.45 + br*0.010;

    aF = br*0.032; aB = -br*0.026;

  } else if (f.state === 'walk'){

    var s = Math.sin(f.walkT*10);

    dy = -Math.abs(s)*1.3;

    ar = s*0.030;

    sy = 1 + Math.abs(s)*0.012;

    dx = s*0.5;

    aF = -s*0.17; aB = s*0.17;

  } else if (f.state === 'dodge'){

    /* 贴地滑步：整体压低、身体顺着移动方向轻微前倾 */

    var dj = clamp(1 - f.dodgeT/0.25, 0, 1);

    ar = -0.02 - dj*0.07;

    sx = 1.035; sy = 0.965; dy = 1.8;

    aF = -0.34 - dj*0.16; aB = 0.40;

  } else if (f.state === 'jump'){

    ar = -0.06; sy = 1.04; sx = 0.98; dy = -1.4;

    aF = (f.vy < 0) ? -0.46 : -0.24;

    aB = (f.vy < 0) ? 0.30 : 0.16;

    /* 二段跳：起跳瞬间拉长一下，像被顶起来 */

    if (f.airJumpT > 0){

      var aj = f.airJumpT/0.34;

      sy += aj*0.11; sx -= aj*0.045; dy -= aj*2.4;

      aF -= aj*0.55; aB -= aj*0.30;

    }

  } else if (f.state === 'block'){

    var ck = P.crouch || 0;

    ar = -lean*0.26;

    sy = 1 - ck*0.070; sx = 1 + ck*0.042;

    dy = ck*2.0;

    aF = -0.56*ck; aB = -0.42*ck;

  } else if (f.state === 'hit'){

    var hk = Math.sin(clamp(f.st/0.16, 0, 1)*Math.PI);

    ar = -0.05 - hk*0.055;

    dx = -1.2 - hk*2.4;

    sy = 0.988;

    aF = hk*0.66; aB = hk*0.86;

  } else if (f.state === 'attack' && f.atk){

    var m = f.atk.m, e = f.st;

    if (e < m.startup) ext = ease(e/m.startup)*0.45;

    else if (e < m.startup + m.active) ext = 1;

    else ext = Math.max(0, 1 - (e - m.startup - m.active)/Math.max(0.01, m.recovery));

    ar = 0.045 + ext*0.085;

    dx = ext*3.6;

    sy = 1 + ext*0.022; sx = 1 - ext*0.014;

    var backArm = P.armB[0] > P.armF[0];

    if (backArm){ aB = -ext*1.52; aF = -ext*0.30; stretchB = ext > 0.55; }

    else { aF = -ext*1.48; aB = -ext*0.26; stretchF = ext > 0.55; }

    dx = ext*5.2;

  }



  if (fm){ dy -= 1.4 + Math.sin(t*1.7)*1.0; }



  ctx.save();

  ctx.imageSmoothingEnabled = true;

  if ('imageSmoothingQuality' in ctx) ctx.imageSmoothingQuality = 'high';

  ctx.translate(0, D.toes);

  ctx.rotate(ar);

  ctx.translate(dx, dy);

  ctx.scale(sx, sy);

  ctx.translate(0, -D.toes);



  /* 闪避残影：白色剪影沿运动反方向错开三层，像拖出来的虚影 */

  if (f.dodgeT > 0 && DSQ_WHITE){

    var lx = (f.dodgeDir || -f.facing) * f.facing;

    ctx.save();

    ctx.globalCompositeOperation = 'lighter';

    for (var gq = 1; gq <= 3; gq++){

      ctx.globalAlpha = 0.22 - gq*0.055;

      ctx.drawImage(DSQ_WHITE, ox - lx*gq*17, oy - gq*0.5, dw, dh);

    }

    ctx.restore();

  }

  if (fm){ ctx.shadowColor = 'rgba(124,200,255,0.90)'; ctx.shadowBlur = 16; }

  ctx.drawImage(DSQ_IMG, ox, oy, dw, dh);

  ctx.shadowBlur = 0; ctx.shadowColor = 'rgba(0,0,0,0)';

  if (f.flash > 0 && DSQ_WHITE){

    ctx.globalAlpha = clamp(f.flash*1.8, 0, 0.68);

    ctx.drawImage(DSQ_WHITE, ox, oy, dw, dh);

    ctx.globalAlpha = 1;

  }



  if (fm) wKatana(f, D, P, sh, hd, null);

  dsqArm('L', aB, f, k, G.axis, D.toes, stretchB);

  dsqArm('R', aF, f, k, G.axis, D.toes, stretchF);



  ctx.restore();

  return true;

}




/* Claude 娘：贴着定稿立绘走。手臂不拆，动作由整体形变（倾身 / 前冲 / 压扁 / 拉伸）表达 */

function drawClaudeSprite(f, D, P){

  if (!CL_OK) return false;

  var CG = CL_GEO;

  /* 立绘比 Q 版瘦，放大一点才不掉气场 */

  var kk2 = (D.toes + D.torso + D.headOff + D.headR*1.08) / (CG.bot - CG.top) * 1.16;

  var dw = CG.w*kk2, dh = CG.h*kk2;

  var ox = -CG.axis*kk2, oy = D.toes - CG.bot*kk2;

  var ar = P.lean*0.34, dx = 0, dy = 0, sx = 1, sy = 1;

  /* 手部局部形变：cwS = 书往前推的距离（图内像素），cwR = 手腕甩动的角度 */

  var cwS = 0, cwR = 0;

  var ct = f.t;

  f._fistX = undefined; f._fistY = undefined;

  if (f.state === 'idle'){

    var br2 = Math.sin(ct*2.1);

    dy = br2*0.6; sy = 1 + br2*0.008; sx = 1 - br2*0.005;

    ar += br2*0.008;

  } else if (f.state === 'walk'){

    var ws = Math.sin(f.walkT*10);

    dy = -Math.abs(ws)*1.7;

    ar = ws*0.026;

    sx = 1 + Math.abs(ws)*0.012;

    dx = ws*0.6;

  } else if (f.state === 'dodge'){

    var dk2 = clamp(1 - f.dodgeT/0.25, 0, 1);

    ar = -0.03 - dk2*0.10; sy = 0.962; sx = 1.04; dy = 2.0;

  } else if (f.state === 'jump'){

    ar = f.fly ? -0.015 : -0.05; sy = 1.05; sx = 0.97;
    dy = f.fly ? (-1.2 + Math.sin(ct*2.4)*1.9) : -1.2;

    if (f.airJumpT > 0){

      var aj2 = f.airJumpT/0.34;

      sy += aj2*0.12; sx -= aj2*0.05; dy -= aj2*2.6;

    }

  } else if (f.state === 'block'){

    var ck2 = P.crouch || 0;

    ar = -P.lean*0.26;

    sy = 1 - ck2*0.075; sx = 1 + ck2*0.045; dy = ck2*2.2;

  } else if (f.state === 'hit'){

    var hk2 = Math.sin(clamp(f.st/0.16, 0, 1)*Math.PI);

    ar = 0.05 + hk2*0.06;

    dx = -1.4 - hk2*2.6;

    sy = 0.985;

  } else if (f.state === 'attack' && f.atk){

    var cm = f.atk.m, ce = f.st, cext;

    if (ce < cm.startup) cext = ease(ce/cm.startup)*0.5;

    else if (ce < cm.startup + cm.active) cext = 1;

    else cext = Math.max(0, 1 - (ce - cm.startup - cm.active)/Math.max(0.01, cm.recovery));

    /* 起手先微微后仰蓄势，再把上半身连同书一起送出去 */

    var cu = clamp(ce/Math.max(0.001, cm.startup), 0, 1);

    ar = cext*0.26 - (1 - cu)*0.05;

    dx = cext*(3 + cext*9);

    dy = -cext*1.6;

    sy = 1 + cext*0.02; sx = 1 - cext*0.015;

    /* 书 + 双手是独立图层：近战前送 72、重击 96、法术 50（图内像素，554 宽）。
       整张立绘只前倾 ~18px，手相对身体几乎不动，所以这一层要单独给位移。 */

    var cnm = cm.anim || '';

    var cwMax = 72;

    if (cm.magic){

      /* 远程魔法：书往前一送当「炮口」，幅度比砸人小，但依然能看出来手在动 */

      cwMax = cm.big ? 74 : 54;

      if (cnm === 'bookSwipe') cwMax = 62;

      else if (cnm === 'sweep') cwMax = 64;

      else if (cnm === 'overhead') cwMax = 84;

      else if (cnm === 'airStrike') cwMax = 46;

    }

    else if (cnm === 'overhead') cwMax = 96;

    else if (cnm === 'bookSwipe') cwMax = 80;

    else if (cnm === 'sweep') cwMax = 86;

    else if (cm.type === 'shot' || cm.type === 'rain' || cm.type === 'breath') cwMax = 50;

    else if (cm.type === 'counter') cwMax = 40;

    /* 起手先把书往回带一点（蓄势），命中帧再整块送出去，手才有「挥」的感觉 */

    var cwPh;

    if (ce < cm.startup) cwPh = -0.34*ease(ce/Math.max(0.001, cm.startup));

    else if (ce < cm.startup + cm.active) cwPh = 1;

    else cwPh = Math.max(0, 1 - (ce - cm.startup - cm.active)/Math.max(0.01, cm.recovery));

    cwS = cwPh * cwMax;

    /* 手腕甩动：书脊敲 / 翻页扫 / 压顶 各自不同的旋向 */

    var cwAng = -0.17;

    if (cnm === 'bookSwipe') cwAng = -0.22;

    else if (cnm === 'sweep') cwAng = 0.28;

    else if (cnm === 'overhead') cwAng = -0.34;

    /* 施法不甩腕，只是把书端平往前送 */
    if (cm.magic) cwAng = (cnm === 'sweep') ? 0.12 : -0.09;

    cwR = cwPh * cwAng;

  }

  ctx.save();

  ctx.imageSmoothingEnabled = true;

  if ('imageSmoothingQuality' in ctx) ctx.imageSmoothingQuality = 'high';

  /* 出招时以腰为轴前倾（脚不跟着翘起来），其余状态绕脚尖转 */

  var pvY = (f.state === 'attack') ? (D.toes - D.leg*1.05) : D.toes;

  ctx.translate(0, pvY);

  ctx.rotate(ar);

  ctx.translate(dx, dy);

  ctx.scale(sx, sy);

  ctx.translate(0, -pvY);

  /* 原画朝左（书抱在身体前方），而本地坐标系 +x 恒为「对手方向」，
     所以贴图必须恒镜像一次；站左站右由外层 scale(facing) 决定。 */

  ctx.scale(-1, 1);

  var cxd = -ox - dw;

  ctx.drawImage(CL_IMG, cxd, oy, dw, dh);

  /* 「书 + 手」是独立图层：出招时整块往前送 + 甩腕，手才会真的动。
     底图里这一块已经补画过，图层推出去不会拖出第二本书。 */

  if (CL_ARM_OK){

    var aW = CL_ARM_GEO.w*kk2, aH = CL_ARM_GEO.h*kk2;

    var aX = cxd + CL_ARM_GEO.x*kk2 + cwS*kk2;

    var aY = oy + CL_ARM_GEO.y*kk2 - cwS*0.13*kk2;

    /* 甩腕支点取手腕（图内 150,448），书才会绕着手指转而不是整块平移 */

    var pvX = cxd + 150*kk2 + cwS*kk2;

    var pvY2 = oy + 448*kk2 - cwS*0.13*kk2;

    ctx.save();

    ctx.translate(pvX, pvY2);

    ctx.rotate(-cwR);

    ctx.translate(-pvX, -pvY2);

    ctx.drawImage(CL_ARM, aX, aY, aW, aH);

    if (f.flash > 0 && CL_ARM_WHITE){

      ctx.globalAlpha = clamp(f.flash*1.8, 0, 0.62);

      ctx.drawImage(CL_ARM_WHITE, aX, aY, aW, aH);

      ctx.globalAlpha = 1;

    }

    ctx.restore();

  }

  /* 把「持书的那只手」换算到本地坐标：技能 / 普攻特效从这里出，
     否则固定公式算出来的位置在她的腰上，看着就像手长在肚子上。 */

  var hpx = 150 + 48*Math.sin(cwR) - cwS, hpy = 448 - 48*Math.cos(cwR) - cwS*0.13;

  var hx0 = (CG.w - hpx - CG.axis)*kk2;

  var hy0 = oy + hpy*kk2;

  var qx2 = hx0*sx, qy2 = (hy0 - pvY)*sy;

  var ca2 = Math.cos(ar), sa2 = Math.sin(ar);

  f._fistX = qx2*ca2 - qy2*sa2 + dx;

  f._fistY = qx2*sa2 + qy2*ca2 + dy + pvY;

  if (f.flash > 0 && CL_WHITE){

    ctx.globalAlpha = clamp(f.flash*1.8, 0, 0.62);

    ctx.drawImage(CL_WHITE, cxd, oy, dw, dh);

    ctx.globalAlpha = 1;

  }

  ctx.restore();

  return true;

}

function dsqArm(key, ang, f, k, axis, toes, stretch){

  var img = DSQ_ARM[key];

  if (!img.complete || !img.naturalWidth) return;

  var bb = DSQ_AB[key], sp = DSQ_AS[key], G = DSQ_GEO;

  var x0 = (bb[0]-axis)*k, y0 = toes + (bb[1]-G.bot)*k;

  var aw = (bb[2]-bb[0])*k, ah = (bb[3]-bb[1])*k;

  var sxl = (sp[0]-axis)*k, syl = toes + (sp[1]-G.bot)*k;

  /* 只有真正出拳时才做「橡皮手臂」拉伸；待机 / 跳跃 / 蹲防一律保持原长。 */

  var st = 1;
  if (stretch && ang < -0.38) st = 1 + Math.min(0.68, (-ang - 0.38)*1.05);

  /* 只拉「袖子」：袖口和白手套当成一个刚性整体钉在拉长后的末端。
     整条手臂连手套一起纵向拉长，手套会糊成一条白片，远看像举着一把蓝铲子。 */

  var sw = img.naturalWidth, sh = img.naturalHeight;

  var cutS = Math.round(sh*0.80), cutD = y0 + ah*0.80;

  var rigid = st > 1.05;

  function blitArm(im, alpha){

    if (alpha !== undefined) ctx.globalAlpha = alpha;

    if (!rigid){ ctx.drawImage(im, x0, y0, aw, ah); return; }

    ctx.save();

    ctx.beginPath(); ctx.rect(x0-4, y0-4, aw+8, cutD-y0+4); ctx.clip();

    ctx.drawImage(im, x0, y0, aw, ah);

    ctx.restore();

    ctx.save();

    ctx.translate(sxl, syl); ctx.scale(1, 1/st); ctx.translate(-sxl, -syl);

    ctx.drawImage(im, 0, cutS, sw, sh-cutS, x0, cutD, aw, ah*(sh-cutS)/sh);

    ctx.restore();

  }

  ctx.save();

  ctx.translate(sxl, syl);

  ctx.rotate(ang);

  if (st > 1.001) ctx.scale(1, st);

  ctx.translate(-sxl, -syl);

  /* 轮廓光：手臂的袖子与裙身都是深蓝，没有分界线时会糊成一整块，
     只剩白色手套露在外面，看起来就像凭空多出一只手。 */
  ctx.save();
  ctx.shadowColor = 'rgba(188,221,255,0.95)';
  ctx.shadowBlur = 5.5;
  blitArm(img);
  ctx.restore();

  if (st > 1.05){

    ctx.shadowColor = 'rgba(186,228,255,0.95)';

    ctx.shadowBlur = 9;

  }

  blitArm(img);

  ctx.shadowBlur = 0; ctx.shadowColor = 'rgba(0,0,0,0)';

  /* 拳心位置：两只手里往前伸得更远的那只才代表出拳（后手直拳是 L 臂） */

  if (ang < -0.3){

    var L2 = (bb[3]-bb[1])*0.86*k*st;

    var fx2 = sxl + Math.sin(-ang)*L2;

    var fy2 = syl + Math.cos(-ang)*L2;

    if (f._fistX === undefined || fx2 > f._fistX){ f._fistX = fx2; f._fistY = fy2; }

  }

  if (f.flash > 0 && DSQ_AW[key]){

    blitArm(DSQ_AW[key], clamp(f.flash*1.8, 0, 0.68));

    ctx.globalAlpha = 1;

  }

  ctx.restore();

}
